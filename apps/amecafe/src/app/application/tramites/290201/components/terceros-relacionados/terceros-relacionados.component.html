<div class="col-md-12">
    <ng-titulo titulo="Destinatario (destino final)" />
    <app-tabla-dinamica
     (filaClic)="onRowClick($event)"
    [configuracionTabla]="configuracionColumnasoli"
    [tipoSeleccionTabla]="tipoSeleccionsoliMercancias"
     [datos]="tableData"
     (listaDeFilaSeleccionada)="onSelectedRowsChange($event)"
     >
</app-tabla-dinamica>
    <div class="btn-group">
      <button class="btn btn-danger" type="button" [disabled]="!selectedRow" (click)="enModificar()">Modificar</button>
      <button class="btn btn-danger" type="button" [disabled]="!selectedRow" (click)=" onDeleteSelectedRows()">Eliminar</button>
    </div>
</div>


<div class="container"  *ngIf="esFormularioVisible">
    <form [formGroup]="destinatarioForm" (ngSubmit)="enEnviar()">
        <ng-titulo titulo="Datos personales" />
         <ng-container formGroupName="datosDelTramiteRealizar"> 
            <div class="row mb-3">
              <div class="col-md-12">
                <label class="form-label" for="tipoPersona">Tipo persona*:</label>
              </div>
              <div class="col-md-12">
                <input class="form-check-input me-2" type="radio" name="tipoPersona" formControlName="tipoPersona"
                  id="fisica" value="fisica"
                  (change)="setValoresStore(datosDelTramiteRealizar,'tipoPersona', 'setTipoPersona')"
                  [disabled]="esFormularioSoloLectura"/>
                <label for="fisica">Física</label>
              </div>
              <div class="col-md-12">
                <input class="form-check-input me-2" type="radio" name="tipoPersona" formControlName="tipoPersona" 
               id="moral" value="moral"
                (change)="setValoresStore(datosDelTramiteRealizar,'tipoPersona', 'setTipoPersona')"
                [disabled]="esFormularioSoloLectura"/>
                <label for="moral">Moral</label>
              </div>
            </div>
            <div class="row">
              <div class="col-md-8 mb-3">
                <label class="form-label" for="denominación">Denominación/razón social*:</label>
                <input class="form-control" id="denominacion" type="text" formControlName="denominacion"
                (change)="setValoresStore(datosDelTramiteRealizar,'denominacion', 'setDenominacion')"
                [disabled]="esFormularioSoloLectura"/>
              </div>
            </div>
            <div class="row">
            <div class="col-md-8">
              <div class="form-group">
                <label class="form-label" for="domicilio">Domicilio</label>
                <textarea class="form-control" id="domicilio" rows="2" height="50"
               style="height: 100px" formControlName="domicilio"
                (change)="setValoresStore(datosDelTramiteRealizar,'domicilio', 'setDomicilio')" 
                [disabled]="esFormularioSoloLectura"></textarea>
              </div>
            </div>
            </div>
           <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <app-catalogo-select
                id="paisData"
                formControlName="pais"
                [catalogo]="paisData.catalogos"
                [label]="'Pais'"
                [placeholder]="paisData.primerOpcion"
                [required]="true"
                (change)="setValoresStore(datosDelTramiteRealizar,'pais', 'setPais')"
                [disabled]="esFormularioSoloLectura"
              ></app-catalogo-select>
              <div *ngIf="destinatarioForm.get('pais')?.errors?.['required']" class="text-danger">
                Por favor, selecciona una opción.
              </div>
             </div>
           </div>
            </div>
             <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label" for="codigopostal">Codigo postal:</label>
                <input class="form-control" id="codigopostal" type="text" formControlName="codigopostal"
                (change)="setValoresStore(datosDelTramiteRealizar,'codigopostal', 'setCodigopostal')"
                [disabled]="esFormularioSoloLectura"/>
                <div *ngIf="destinatarioForm.get('codigopostal')?.errors?.['maxlength']" class="text-danger">
                  Por favor, no escribas más de 5 caracteres.
                </div>
                <div *ngIf="destinatarioForm.get('codigopostal')?.errors?.['pattern']" class="text-danger">
                  Por favor, sólo escribe dígitos.
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label" for="telefono">Telefono:</label>
                <input class="form-control" id="telefono" type="text" formControlName="telefono"
                (change)="setValoresStore(datosDelTramiteRealizar,'telefono','setTelefono')"
                [disabled]="esFormularioSoloLectura"/>
                <div *ngIf="destinatarioForm.get('telefono')?.errors?.['pattern']" class="text-danger">
                  Por favor, sólo escribe dígitos.
                </div>
              </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label" for="correoelectronico">Correo electronico:</label>
                  <input class="form-control" id="correoelectronico" type="text" formControlName="correoelectronico"
                  (change)="setValoresStore(datosDelTramiteRealizar,'correoelectronico','setCorreoelectronico')"
                  [disabled]="esFormularioSoloLectura"/>
                  <div *ngIf="destinatarioForm.get('correoelectronico')?.errors?.['email']" class="text-danger">
                    Por favor, escribe una dirección de correo válida.
                  </div>
                </div>
            </div>

          </ng-container> 
            <div class="col-md-12 d-flex justify-content-end">
              <div class="btn-group">
                <button class="btn btn-danger"
                  type="button">Cancelar</button>
                  <button class="btn btn-primary me-2"
                  type="button"(click)="onLimpiar()">Limpiar</button>
                  <button class="btn btn-primary me-2"
                  type="button" (click)="enEnviar()">Guardar</button>
              </div>
            
          </div>
    </form>
</div>
