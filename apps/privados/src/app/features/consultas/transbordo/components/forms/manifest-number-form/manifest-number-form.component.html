<form [formGroup]="manifestForm" autocomplete="off">
  <div class="row mt-5">
    <!-- First column -->
    <div class="col-md-4 col-sm-4 col-xs-6">
      <div class="form-group">
        <label
          >Manifiesto
          <span class="form-text form-text-error">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          formControlName="manifestNumber"
          [ngClass]="{
            'form-control-error': formUtils.isValidField(manifestForm, 'manifestNumber')
          }"
        />
        @if (formUtils.isValidField(manifestForm, 'manifestNumber')) {
          <small class="form-text form-text-error">
            {{ formUtils.getFieldError(manifestForm, 'manifestNumber') }}
          </small>
        }
      </div>
    </div>

    <!-- Second column -->
    <div class="col-md-4 col-sm-4 col-xs-6">
      <div class="form-group">
        <label
          >Número de vuelo
            <span class="form-text form-text-error">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          formControlName="numFlight"
          [ngClass]="{
            'form-control-error': formUtils.isValidField(manifestForm, 'numFlight')
          }"
        />
        @if (formUtils.isValidField(manifestForm, 'numFlight')) {
          <small class="form-text form-text-error">
            {{ formUtils.getFieldError(manifestForm, 'numFlight') }}
          </small>
        }
      </div>
    </div>
  </div>
</form>
