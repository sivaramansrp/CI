<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h2>Datos Generales</h2>
    </div>
    <div class="col-md-12">
      @if (isHouseSelected()) {
        <app-general-data-house/>
      } @else {
        <app-general-data-master/>
      }
    </div>
    <div class="col-md-12">
      @if (!isHouseSelected()) {
        <app-house (houseClicked)="houseClicked($event)"></app-house>
      }
    </div>
    <div class="col-md-12">
      @if (dataLoaded()) {
        <app-people-merchandise></app-people-merchandise>
      }
    </div>
    <div class="col-md-12 mt-5 text-right">
      <gob-button
        type="button"
        className="btn-primary"
        label="Regresar"
        (clicked)="goBack()"
      ></gob-button>
    </div>
  </div>
</div>
