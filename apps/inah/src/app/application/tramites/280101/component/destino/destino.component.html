<div class="container">
  <ng-titulo titulo="Destino"/>
  <form [formGroup]="DestinoForm">
    <div class="row">
      <div class="col-md-4">
        <label class="form-label" for="pais"
          >País:<span
            class="bi bi-question-circle-fill fs-4 m-1 require"
            title="Title"
            ata-bs-toggle="tooltip"
          >*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="pais"
          formControlName="pais"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label" for="codigo-postal"
          >Código Postal:</label
        ><span class="require">*</span>
        <input
          type="text"
          class="form-control"
          id="codigo-postal"
          formControlName="codigoPostal"
        />
      </div>
      <div class="col-md-4">
          <label class="form-label" for="estado"
            >Estado:</label
          >
          <input
            type="text"
            class="form-control"
            id="estado"
            formControlName="estado"
          />
        </div>

      <div class="col-md-4">
        <label class="form-label" for="municipio-o-alcadia"
          >Municipio o alcaldia:</label
        >
        <input
          type="text"
          class="form-control"
          id="municipio-o-alcadia"
          formControlName="municipioOAlcadia"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label" for="localidad"
          >Localidad:</label
        ><span class="require">*</span>
        <input
          type="text"
          class="form-control"
          id="localidad"
          formControlName="localidad"
        />
      </div>
      <div class="col-md-4">
          <label class="form-label" for="colonia"
            >Colonia:</label
          >
          <input
            type="text"
            class="form-control"
            id="colonia"
            formControlName="colonia"
          />
        </div>
         <div class="col-md-4">
          <label class="form-label" for="numero-exterior"
            >Numero exterior:</label
          ><span class="require">*</span>
          <input
            type="text"
            class="form-control"
            id="umero-exterior"
            formControlName="numeroExterior"
          />
        </div>  
        <div class="col-md-4">
          <label class="form-label" for="numero-interior"
            >Número interior:</label
          >
          <input
            type="text"
            class="form-control"
            id="numero-interior"
            formControlName="numeroInterior"
          />
        </div>
        <div class="col-md-8">
          <label class="form-label" for="calle"
            >Calle:</label
          ><span class="require">*</span>
          <input
            type="text"
            class="form-control"
            id="calle"
            formControlName="calle"
          />
        </div>         
    </div>
  </form>
</div>
