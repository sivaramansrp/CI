<div>
  <div class="container1">
  <ng-titulo titulo="Modalidad"/>
  <form [formGroup]="ModalidadForm">
    <div class="row">
      <div class="col-md-4">
        <label class="form-label" for="Modalidad"
          >Modalidad*:<span
            title="Title"
            ata-bs-toggle="tooltip"
          >*</span>
        </label>
        <app-input-radio
            [radioOptions]="radioOpcions"
            id="opcion"
            formControlName="modalidadOpcion"
            >
          </app-input-radio>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="van-a-exposicion"
          >Van a exposicion?*:</label
        ><span class="bi bi-question-circle-fill fs-4 m-1 require"></span>
        <app-input-radio
            [radioOptions]="exposicionRadioOpcions"
            id="exposicionOpcion"
            formControlName="exposicionOpcion"
            [layout]="'horizontal'"
            >
          </app-input-radio>
      </div>
      <div class="col-md-4">
          <label class="form-label" for=""
            >Nombre de la Exposicion*:</label>
          <input
            type="text"
            class="form-control"
            id=""
            formControlName="nombre"
          />
        </div>   
    </div>
  </form>
</div>
<div class="container2">
  <ng-titulo titulo="Lugar de Salida y Entrada de Territorio Nacional"/>
  <form [formGroup]="LugarDeSalidaForm">
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="aduana" formControlName="aduana" [label]="'Aduana de salida'"
                [required]="true" name="aduana" [placeholder]="'Selecciona un valor'"></app-catalogo-select>

      </div>
      @if (ModalidadForm.get('modalidadOpcion')?.value == '2') {
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="aduana" formControlName="aduanaEntrada" [label]="'Aduanas de entrada'"
                [required]="true" name="aduana" [placeholder]="'Selecciona un valor'"></app-catalogo-select>

      </div>
    }
      </div>
  </form>
</div>
<div class="container3">
  <ng-titulo titulo="Observaciones"/>
  <form [formGroup]="ObservacionesForm">
    <div class="row">
      <div class="col-md-8">
        <label class="form-label" for="Monumentos"
          >Descripción de Monumentos o Bienes Muebles a Exportar:<span
            class="bi bi-question-circle-fill fs-4 m-1 require"
            title="Title"
            ata-bs-toggle="tooltip"
          >*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="monumentos"
          formControlName="monumentos"
        />
      </div>
      </div>
  </form>
</div>

<div class="container4">
  <ng-titulo titulo="Cantidad de monumentos"/>
  <form [formGroup]="CantidadForm">
    <div class="row">
      <div class="col-md-8">
        <label class="form-label" for="cantidad"
          >Cantidad de Monumentos o bienes históricos a Exportar:<span
            class="bi bi-question-circle-fill fs-4 m-1 require"
            title="Title"
            ata-bs-toggle="tooltip"
          >*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="cantidad"
          formControlName="cantidad"
        />
      </div>
    </div>
  </form>
</div>
</div>
