<div class="page page-color">
    <div class="container">
        <div class="row">
            <div class="col-12">
                <h2 class="fw-bold my-5 titulo-tasks">Modificar contraseña</h2>
                <div class="bg-primary"></div>
            </div>
        </div>
        <form [formGroup]="FormCambioContrasena">
            <div class="row">
                <!-- Contraseña Anterior -->
                <div class="col-md-6">
                    <label for="contrasenaAnterior" class="form-label text-title">Contraseña anterior*:</label>
                    <input type="password" id="contrasenaAnterior" formControlName="contrasenaAnterior"
                        class="form-control font-weight-titulo text-title" placeholder="Contraseña anterior" />
                </div>

                <!-- Contraseña Nueva -->
                <div class="col-md-6">
                    <label for="contrasenaNueva" class="form-label text-title">Contraseña nueva*:</label>
                    <input type="password" id="contrasenaNueva" formControlName="contrasenaNueva"
                        class="form-control font-weight-titulo text-title" placeholder="Contraseña nueva" />
                </div>

                <!-- Confirmación -->
                <div class="col-md-6">
                    <label for="confirmacionContrasena" class="form-label text-title">Confirmación contraseña
                        nueva*:</label>
                    <input type="password" id="confirmacionContrasena" formControlName="confirmacionContrasena"
                        class="form-control font-weight-titulo text-title" placeholder="Confirmación contraseña" />
                </div>
            </div>
        </form>
        <div class="d-flex justify-content-lg-end h1">
            <button class="btn btn-primary ms-2" type="button" (click)="onSubmit()">Modificar</button>
        </div>
    </div>
</div>
