<div class="container">
  @if (!estaOculto) {
  <div class="row mt-5">
    <ng-titulo titulo="Permiso definitivo (no temporal)"></ng-titulo>
  </div>
  }
  <div class="row mt-5">
    <ng-titulo
      titulo="Aduana de entrada
    "
    ></ng-titulo>

    <div class="row">
      <crosslist
        [fechas]="seleccionarAduanasDisponibles"
        [label]="aduanasDisponiblesLabel"
        [fechasSeleccionadas]="seleccionarAduanasDisponiblesDatos"
        (fechasSeleccionadasChange)="
          aduanasDisponiblesSeleccionadasChange($event)
        "
      ></crosslist>
    </div>
    <div class="row mt-5">
      <form [formGroup]="form" class="container">
        <div class="row mb-3">
          <div class="col-md-4">
            <label for="permisoGeneral" class="form-label"
              >Permiso general*</label
            >
            <input
              type="text"
              id="permisoGeneral"
              class="form-control"
              formControlName="permisoGeneral"
            />
          </div>
          @if(estaOculto) {
          <div class="col-md-8">
            <label for="paisDestino" class="form-label">País de Procedencia:</label>
            <input
              type="text"
              id="paisDestino"
              class="form-control"
              formControlName="paisDestino"
              readonly
            />
          </div>
        }
        @else{
          <div class="col-md-8">
            <label for="paisDestino" class="form-label">País destino:</label>
            <input
              type="text"
              id="paisDestino"
              class="form-control"
              formControlName="paisDestino"
              readonly
            />
          </div>
        }
        </div>

        <div class="mb-3">
          <label for="usoFinal" class="form-label">
            Uso final de la mercancía*
            <i class="bi bi-info-circle" title="Información adicional"></i>
          </label>
          <textarea
            id="usoFinal"
            class="form-control"
            rows="3"
            formControlName="usoFinal"
            style="height: 90px"
          ></textarea>
        </div>
      </form>
    </div>
    <div class="row mt-5">
      <h5>Mercancías*</h5>
      <app-tabla-dinamica
        [tipoSeleccionTabla]="mercanciaTablaConfiguracion.tipoSeleccionTabla"
        [configuracionTabla]="mercanciaTablaConfiguracion.configuracionTabla"
        [datos]="datosMercanciaTabla"
      ></app-tabla-dinamica>
    </div>
    <div class="row mt-3">
      <div class="col-md-12">
        <div class="pull-right ml-2">
          <button
            type="button"
            name="agregarClave"
            class="btn btn-primary ms-2"
            (click)="irAAcciones('../agregar-datos-mercancia')"
          >
            Agregar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
