<div class="container">
  <ng-titulo titulo="Terceros relacionados"></ng-titulo>
  <div class="row mt-5">
    <ng-alert [CONTENIDO]="tercerorTextoDeAlerta"></ng-alert>
  </div>
  <div class="row mt-5">
    <h5>Destinatario (destino final)*</h5>
  </div>
  <div class="row">
    <app-tabla-dinamica
      [tipoSeleccionTabla]="destinoFinalTablaConfiguracion.tipoSeleccionTabla"
      [configuracionTabla]="destinoFinalTablaConfiguracion.configuracionTabla"
      [datos]="destinatarioFinalTablaDatos"
      (listaDeFilaSeleccionada)="destinarioTablaSeleccionada = $event"
    ></app-tabla-dinamica>
  </div>
  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        @if(!ocultarBotones){
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
          (click)="modificarDestinatario()"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
          (click)="eliminarDestinatarioFinal()"
        >
          Eliminar
        </button>
      }
        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="irAAcciones('../agregar-destino-final')"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>
  <div class="row mt-5">
    <h5>Proveedor*</h5>
  </div>
  <div class="row">
    <app-tabla-dinamica
      [tipoSeleccionTabla]="dproveedorTablaConfiguracion.tipoSeleccionTabla"
      [configuracionTabla]="dproveedorTablaConfiguracion.configuracionTabla"
      [datos]="proveedorTablaDatos"
      (listaDeFilaSeleccionada)="proveedorTablaSeleccionada = $event"
    ></app-tabla-dinamica>
  </div>
  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        @if(!ocultarBotones){
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
          [disabled]="proveedorTablaSeleccionada.length > 1"
          (click)="modificarProveedor()"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
          (click)="eliminarProveedorFinal()"
        >
          Eliminar
        </button>
      }
        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="irAAcciones('../agregar-proveedor')"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>
</div>
