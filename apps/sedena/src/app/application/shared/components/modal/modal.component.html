<div
  [config]="{ backdrop: 'static' }"
  class="modal fade"
  tabindex="-1"
  role="dialog"
  aria-labelledby="dialog-auto-name"
  bsModal
  #modal="bs-modal"
>
  <div class="modal-dialog modal-xl" role="document" style="max-width: 90vw">
    <div class="modal-content">
      <button
        type="button"
        class="close ms-auto"
        aria-label="Cerrar"
        (click)="cerrar()"
        style="font-size: 1.5rem; background: none; border: none"
      >
        &#10006;
      </button>
      <div class="modal-body">
        <ng-template #dynamicComponentContainer></ng-template>
      </div>
    </div>
  </div>
</div>
