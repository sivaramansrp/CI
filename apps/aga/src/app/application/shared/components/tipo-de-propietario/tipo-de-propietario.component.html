<div class="container">
  <ng-titulo titulo="Tipo de Propietario" />
  <form [formGroup]="formSolicitud">
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select id="ddlTipoPersona" [catalogo]="tiposSolicitud" formControlName="esConsultaRep"
          [label]="'propietario:'" [required]="true" name="esConsultaRep"
          (change)="setValoresStore(formSolicitud,'esConsultaRep')"></app-catalogo-select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        @if(propietarioOptionsForm) {

        <solicitante></solicitante>

        } @else if (propietarioOptionsForm === false) {

        <app-catalogo-select id="ddlTipoPersona" [catalogo]="tiposSolicitudNoOptions" formControlName="esExtranjero"
          [label]="'Tipo de propietario:'" [required]="true" name="esExtranjero"
          (change)="setValoresStoreForNoOption(formSolicitud,'esExtranjero')"></app-catalogo-select>


        }
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        @if(propietarioOptionsNoForm) {
        <app-persona-fisica-extranjero [personaFisicaExtranjero] = personaFisicaExtranjero></app-persona-fisica-extranjero>
        } 
      </div>
    </div>






  </form>
</div>
