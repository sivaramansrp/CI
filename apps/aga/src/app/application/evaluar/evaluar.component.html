@if(slectTramite) {
<div class="container mt-2">
    <div>
        <div *ngIf="!firmar">
            <div class="row">
                <div class="col-md-12">
                    <h2 class="titulo mt-5 mb-5">Evaluar</h2>
                    <p class="titulo mt-5 mb-5">Por favor seleccione que tipo de evaluación requiere generar.</p>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 mt-3 mb-3">
                    <lib-encabezado-requerimiento [numFolioTramite]="detallesDelTramite.numFolioTramite"
                        [tipoTramite]="detallesDelTramite.tipoTramite"></lib-encabezado-requerimiento>
                </div>
            </div>
            <div class="row margin-top">
                <ul class="nav nav-tabs justify-content-center">
                    <li [ngClass]="indice === 1 ? 'active' : ''">
                        <a data-toggle="tab" (click)="seleccionaTab(1)" (keydown.enter)="seleccionaTab(1)"
                            (keydown.space)="seleccionaTab(1)" role="button" tabindex="0">Dictamen</a>
                    </li>
                    <li [ngClass]="indice === 2 ? 'active' : ''">
                        <a data-toggle="tab" (click)="seleccionaTab(2)" (keydown.enter)="seleccionaTab(2)"
                            (keydown.space)="seleccionaTab(2)" role="button" tabindex="2">Requerimiento de
                            información</a>
                    </li>
                </ul>
                <ng-container>
                    @switch (indice) {
                    @case (1) {
                    <app-generar-dictamen botonDeCancelar="Cancelar" botonGuardar="Guardar y Firmar"
                        (enviarEvento)="enviarEvento($event)"></app-generar-dictamen>
                    }
                    @case (2) {
                    }
                    }
                </ng-container>
            </div>

        </div>
        <div *ngIf="firmar">
            <div class="row">
                <div class="col-md-12">
                    <h2 class="titulo mt-5 mb-5">Firmar</h2>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <firma-electronica tipo=""></firma-electronica>
                </div>
            </div>
        </div>

        <div class="row mb-5 mt-5">
            <app-reviewers-tabs [viewChild]="viewChild" [tramite]="tramite"
                (viewChildcambioDePestana)="viewChildcambioDePestana($event)"></app-reviewers-tabs>
        </div>
    </div>
</div>
}
