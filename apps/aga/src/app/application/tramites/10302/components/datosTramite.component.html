<div class="container">
  <form
    [formGroup]="tramiteForm"
    (ngSubmit)="validarDestinatarioFormulario()"
    class="row mt-5"
  >
    <div class="col-md-12">
      <ng-container formGroupName="importadorExportador">
        <div class="row mt-5">
          <div class="col-md-8">
            <app-catalogo-select
              [catalogo]="aduana.catalogos"
              [label]="aduana.labelNombre"
              [placeholder]="aduana.primerOpcion"
              [required]="true"
              id="aduana"
              formControlName="aduana"
              (change)="
                setValoresStore(importadorExportador, 'aduana', 'setAduana')
              "
            >
            </app-catalogo-select>
          </div>

          <div class="col-md-4" style="margin-top: 35px">
            <div class="form-group form-check">
              <input
                type="checkbox"
                class="form-check-input"
                formControlName="organismoPublico"
                id="organismoPublico"
                (change)="
                  setValoresStore(
                    importadorExportador,
                    'organismoPublico',
                    'setOrganismoPublico'
                  )
                "
              />
              <label class="form-check-label" for="organismoPublico"
                >Organismo público</label
              >
            </div>
          </div>
        </div>
      </ng-container>
      <ng-titulo titulo="Mercancía" />
      <div class="row">
        <div class="col-md-6">
          <label for="mercancia">Mercancías*:</label>
        </div>
        <div class="table-container">
          <ng-table [commonTableHeader]="encabezadosTabla"> </ng-table>
        </div>
        <div class="col-md-12 mt-5 d-flex justify-content-end">
          <button type="button" class="btn btn-default">Modificar</button>
          <button type="button" class="btn btn-default ms-3">Eliminar</button>
          <button
            type="button"
            class="btn btn-primary ms-3"
            (click)="nextTabla()"
          >
            Agregar
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
