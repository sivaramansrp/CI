<div class="container">
  <form
    [formGroup]="tramiteForm"
    (ngSubmit)="validarDestinatarioFormulario()"
    class="row mt-5"
  >
    <div class="col-md-12">
      <ng-container formGroupName="exencionImpuestos">
        <div class="row mt-5">
          <div class="col-md-8">
            <app-catalogo-select
              [catalogo]="aduana.catalogos"
              [label]="aduana.labelNombre"
              [placeholder]="aduana.primerOpcion"
              [required]="true"
              id="aduana"
              formControlName="aduana"
              (change)="
                setValoresStore(exencionImpuestos, 'aduana', 'setAduana')
              "
            >
            </app-catalogo-select>
          </div>

          <div class="col-md-4" style="margin-top: 35px">
            <div class="form-group form-check">
              <input
                type="checkbox"
                class="form-check-input"
                formControlName="organismoPublico"
                id="organismoPublico"
                (change)="
                  setValoresStore(
                    exencionImpuestos,
                    'organismoPublico',
                    'setOrganismoPublico'
                  )
                "
              />
              <label class="form-check-label" for="organismoPublico"
                >Organismo público</label
              >
            </div>
          </div>
        </div>
        <ng-titulo titulo="Mercancía" />
        <div class="row">
          <div class="col-md-6">
            <label for="usoEspecifico"
              >Fin al cual se destinará la mercancía</label
            >
            <span class="require">*</span>
          </div>
          <div class="col-md-12">
            <div class="form-group">
              <textarea
                class="form-control form-check-input"
                id="usoEspecifico"
                required="true"
                formControlName="usoEspecifico"
                (change)="
                  setValoresStore(
                    exencionImpuestos,
                    'usoEspecifico',
                    'setUsoEspecifico'
                  )
                "
                cols="110"
                rows="4"
              ></textarea>
            </div>
          </div>
          <div class="table-container" style="margin-top: 20px">
            <ng-table
              [commonTableHeader]="mercanciaHeaderData"
              [commonTableBody]="mercanciaBodyData"
            ></ng-table>
          </div>
          <div class="col-md-12 mt-5 d-flex justify-content-end">
            <button type="button" class="btn btn-default">Modificar</button>
            <button type="button" class="btn btn-default ms-3">Eliminar</button>
            <button
              type="button"
              class="btn btn-primary ms-3"
              data-bs-toggle="modal"
              data-bs-target="#modalAgregarMercancias"
              (click)="abrirDialogoMercancias()"
            >
              Agregar
            </button>
            <!-- (click)="nextTabla()" -->
          </div>
        </div>
        <ng-titulo titulo="Datos del donante" />
      </ng-container>
    </div>
  </form>
</div>

<div
  class="modal fade"
  id="modalAgregarMercancias"
  tabindex="-1"
  aria-labelledby="modalAgregarMercanciasLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <form [formGroup]="agregarMercanciasForm">
          <!--Datos de la mercancía-->
          <ng-titulo titulo="Datos de la mercancía"></ng-titulo>
          <ng-container formGroupName="datosMercancia">
            <div class="row">
              <div class="col-md-4">
                <app-catalogo-select
                  [catalogo]="tipoDeMercancia"
                  [label]="'Tipo de mercancía'"
                  formControlName="tipoDeMercancia"
                  [required]="true"
                  (change)="tipoDeMercanciaSeleccion()"
                  name="tipoDeMercancia"
                ></app-catalogo-select>
              </div>
              <div class="col-md-8">
                <app-catalogo-select
                  [catalogo]="condicionMercancia"
                  [label]="'Condición de la mercancía'"
                  [required]="true"
                  formControlName="condicionMercancia"
                  (change)="condicionMercanciaSeleccion()"
                  name="condicionMercancia"
                ></app-catalogo-select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-8">
                <label for="cantidadComercial">Cantidad</label>
                <span class="require">*</span>
                <input
                  type="text"
                  class="form-control"
                  formControlName="cantidad"
                  id="cantidad"
                  maxlength="12"
                  [required]="true"
                  (change)="
                    setValoresStore(
                      exencionImpuestos,
                      'datosMercancia.cantidad',
                      'setCantidad'
                    )
                  "
                />
              </div>
              <div class="col-md-4">
                <app-catalogo-select
                  [catalogo]="unidadMedida"
                  [label]="'Unidad de medida'"
                  [required]="true"
                  name="unidadMedida"
                  formControlName="unidadMedida"
                  (change)="unidadMedidaSeleccion()"
                ></app-catalogo-select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12" style="margin-top: 15px">
                <div class="form-group">
                  <label id="leyenda"
                    >En su caso (maquinaría y equipo obsoleto)</label
                  >
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <div class="form-group">
                  <label for="marca">Marca:</label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="marca"
                    id="marca"
                    maxlength="100"
                    (change)="
                      setValoresStore(
                        exencionImpuestos,
                        'datosMercancia.marca',
                        'setMarca'
                      )
                    "
                  />
                </div>
              </div>
              <div class="col-md-4">
                <app-catalogo-select
                  [catalogo]="ano"
                  [label]="'Año de importación temporal'"
                  name="ano"
                  formControlName="ano"
                  [required]="true"
                  (change)="anoSeleccion()"
                ></app-catalogo-select>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label for="modelo">Modelo:</label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="modelo"
                    id="modelo"
                    maxlength="50"
                    (change)="
                      setValoresStore(
                        exencionImpuestos,
                        'datosMercancia.modelo',
                        'setModelo'
                      )
                    "
                  />
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-8">
                <div class="form-group">
                  <label for="serie">Serie:</label>
                  <input
                    type="text"
                    class="form-control"
                    formControlName="serie"
                    id="serie"
                    size="50"
                    maxlength="25"
                    (change)="
                      setValoresStore(
                        exencionImpuestos,
                        'datosMercancia.serie',
                        'setSerie'
                      )
                    "
                  />
                </div>
              </div>
            </div>
          </ng-container>
        </form>
      </div>
      <div class="modal-footer custom-footer">
        <button
          type="button"
          class="btn btn-primary"
          (click)="limpiarMercancias()"
        >
          Limpiar
        </button>
        <button
          type="button"
          class="btn btn-default"
          data-bs-dismiss="modal"
          #closeModal
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#confirmarModal"
          (click)="agregarConfirmarModal()"
        >
          Agregar
        </button>
        <!-- (click)="agregarMercancias()" -->
      </div>
    </div>
  </div>
</div>


<div
  id="confirmarModal"
  aria-labelledby="confirmarModalLabel"
  class="modal fade"
  tabindex="-1"
  role="dialog"
  aria-hidden="true"
  >
  <div class="modal-dialog" role="document">
    <div class="modal-content modalsm">
      <div class="modal-body">
        <label>La mercancía fue <br/>agregada correctamente.</label>
      </div>
      <div class="modal-footer" style="justify-content: center;">
        <button type="button" class="btn btn-primary" (click)="agregarMercancias()" data-bs-dismiss="modal" #closeConfirmarModal>
          Acceptar
        </button>
      </div>
    </div>
  </div>
</div>
