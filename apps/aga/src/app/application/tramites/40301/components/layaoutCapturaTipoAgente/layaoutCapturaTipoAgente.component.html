<ng-titulo [titulo]="titulo"></ng-titulo>

<div class="row" [formGroup]="formularioAgente">
  <div class="col-md-8">
    <div class="form-group">
      <label class="control-label" for="tipoAgente">Tipo de Agente</label>
      <span class="require">*</span>
      <label class="control-label">:</label>
      <app-catalogo-select 
        [class]="formularioAgente"
        [catalogo]="agentCatalog" 
        formControlName="tipoAgente" 
        [required]="true" 
        name="tipoAgente"
        (change)="conTipoAgenteData('tipoAgente')"></app-catalogo-select>
    </div>

    <div class="text-end">
      <button type="button" class="btn btn-danger" (click)="limpiarAgente()">
        Limpiar
      </button>
    </div>
  </div>
</div>
