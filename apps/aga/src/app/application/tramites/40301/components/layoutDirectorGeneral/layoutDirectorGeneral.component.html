<div class="row">
  <div class="col-md-12">
    <h3>Nombre del director general</h3>
    <hr class="red">
  </div>
</div>
<div class="row" [formGroup]="solicitud">
  <div class="col-md-4 form-group" formGroupName="directorGeneral">
    <div>
      <label class="control-label" for="nombreDirectorGeneral">Nombre(s)</label>
      <label><span class="require">*</span></label>
      <label for="puntos">:</label>
    </div>
    <div>
      <input
        type="text"
        formControlName="nombre"
        id="nombreDirectorGeneral"
        maxlength="200"
        class="required form-control"
      />
    </div>
  </div>
  
  <div class="col-md-4 form-group" formGroupName="directorGeneral">
    <div>
      <label class="control-label" for="apellidoPaternoDirectorGeneral"> Apellido</label>
      <label><span class="require">*</span></label>
      <label for="puntos">puntos</label>
    </div>
    <div>
      <input
        type="text"
        formControlName="apellidoPaterno"
        id="apellidoPaternoDirectorGeneral"
        maxlength="200"
        class="required form-control"
      />
    </div>
  </div>
  
  <div class="col-md-4 form-group" formGroupName="directorGeneral">
    <div>
      <label class="control-label" for="apellidoMaternoDirectorGeneral">Apellido Materno del Director General</label>
      <label for="puntos">puntos</label>
    </div>
    <div>
      <input
        type="text"
        formControlName="apellidoMaterno"
        id="apellidoMaternoDirectorGeneral"
        maxlength="200"
        class="form-control"
      />
    </div>
  </div>
</div>
