<form [formGroup]="solicitudForm">
  <div class="row">
    <div class="col col-md-12">
      <h3>Nombre del director general</h3>
      <hr class="red">
    </div>
  </div>
  <div class="row">
    <div class="col col-md-4 form-group">
      <div>
        <label class="control-label" for="nombreDirectorGeneral">Nombre(s)</label>
        <label><span class="require">*</span></label>
      </div>
      <div>
        <input type="text" 
               formControlName="directorGeneralNombre" 
               size="30" 
               id="nombreDirectorGeneral" 
               maxlength="200" 
               class="form-control"
               (input)="actualizarDirectorGeneralNombre('directorGeneralNombre')"/>
      </div>
    </div>
    <div class="col col-md-4 form-group">
      <div>
        <label class="control-label" for="apellidoPaternoDirectorGeneral">Primer apellido</label>
        <label><span class="require">*</span></label>
      </div>			
      <div>
        <input type="text" 
               formControlName="primerApellido" 
               size="30" 
               id="apellidoPaternoDirectorGeneral" 
               maxlength="200" 
               class="form-control"
               (input)="actualizarPrimerApellido('primerApellido')"/>
      </div>
    </div>		
    <div class="col col-md-4 form-group">
      <div>
        <label class="control-label" for="apellidoMaternoDirectorGeneral">Segundo apellido</label>
      </div>			
      <div>
        <input type="text" 
               formControlName="segundoApellido" 
               size="30" 
               id="apellidoMaternoDirectorGeneral" 
               maxlength="200" 
               class="form-control"
               (input)="actualizarApellidoMaterno('segundoApellido')" />
      </div>
    </div>
  </div>
</form>
