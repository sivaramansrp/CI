<form [formGroup]="solicitud">
  <div class="row">
    <div class="col col-md-12">
      <h3>Nombre del director general</h3>
      <hr class="red">
    </div>
  </div>
  <div class="row">
    <div class="col col-md-4 form-group">
      <div>
        <label class="control-label" for="nombreDirectorGeneral">Nombre(s)</label>
        <label><span class="require">*</span></label>
      </div>
      <div>
        <input type="text" 
               formControlName="nombre" 
               size="30" 
               id="nombreDirectorGeneral" 
               maxlength="200" 
               class="form-control"/>
      </div>
    </div>
    <div class="col col-md-4 form-group">
      <div>
        <label class="control-label" for="apellidoPaternoDirectorGeneral">Primer apellido</label>
        <label><span class="require">*</span></label>
      </div>			
      <div>
        <input type="text" 
               formControlName="apellidoPaterno" 
               size="30" 
               id="apellidoPaternoDirectorGeneral" 
               maxlength="200" 
               class="form-control"/>
      </div>
    </div>		
    <div class="col col-md-4 form-group">
      <div>
        <label class="control-label" for="apellidoMaternoDirectorGeneral">Segundo apellido</label>
      </div>			
      <div>
        <input type="text" 
               formControlName="apellidoMaterno" 
               size="30" 
               id="apellidoMaternoDirectorGeneral" 
               maxlength="200" 
               class="form-control" />
      </div>
    </div>
  </div>
</form>
