<div class="page">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h1>Concluir relación</h1>
            </div>
            <app-wizard [listaPasos]="pasos"></app-wizard>
        </div>

        <div class="row">
        @switch (indice) {
            @case (1) {
            <app-paso-uno></app-paso-uno>
                @if (modalEmergente) {
                        <lib-notificaciones [notificacionInput]="nuevaAlertaNotificacion"
                        (confirmacionModal)="eliminarPedimento($event)">
                        </lib-notificaciones>
                }
            } @case (2) {
            <app-paso-dos></app-paso-dos>
            }
        }

        <btn-continuar
            [datos]="datosPasos"
            
            >
        </btn-continuar>
        </div>
        
    </div>
</div>
