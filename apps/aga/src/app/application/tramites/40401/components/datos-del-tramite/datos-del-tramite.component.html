<form [formGroup]="datosDelTramiteForm">
    <ng-titulo titulo="CAAT Aéreo" />
    <div class="row">
      <div class="col-md-12">
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="optionsPais" [label]="'Tipo de CAAT Aéreo'" [required]="true" id="pais"
            formControlName="pais" [ngClass]="isValid(datosDelTramiteForm,'pais') ? 'required' : ''"  [isDisabled]="readonly"
            (change)="setValoresStore(datosDelTramiteForm, 'pais', 'setPais')"></app-catalogo-select>
        </div>
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="optionsPais" [label]="'Código de Transportación Aéreo'" [required]="true" id="pais"
            formControlName="codigo" [ngClass]="isValid(datosDelTramiteForm,'codigo') ? 'required' : ''"  [isDisabled]="readonly"
            (change)="setValoresStore(datosDelTramiteForm, 'codigo', 'setCodigo')"></app-catalogo-select>
        </div>
        <div class="col-md-4 mb-3" style="margin-top: 7px;">
          <label>Empresa de Transportación Aérea*:</label>
          <input type="text" class="form-control" formControlName="transportacion"
              [ngClass]="isValid(datosDelTramiteForm,'transportacion') ? 'required' : ''"
              (change)="setValoresStore(datosDelTramiteForm, 'transportacion', 'setTransportacion')" />
              <span
            *ngIf="
              datosDelTramiteForm.get('transportacion')?.invalid &&
              datosDelTramiteForm.get('transportacion')?.touched"
            id="descMercancia"
            class="text-danger">
            Este campo es obligatorio
        </span>
      </div>
      </div>
    </div>
    <div class="col-md-12 text-end">
    <button (click)="limpiar()" [disabled]="readonly" type="button" class="btn btn-default btn-space">Limpiar</button>
  </div>
</form>
