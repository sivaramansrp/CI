<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h3>Registro del código alfanumérico armonizado del transportista</h3>
      </div>
      <div *ngIf="nombre" class="alert alert-danger" role="alert"> Error en el formulario, favor de verificar</div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <paso-uno></paso-uno>
      } 
        @case (2) {
          <paso-tres></paso-tres>
          }
      }
      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
    </div>
  </div>
</div>
