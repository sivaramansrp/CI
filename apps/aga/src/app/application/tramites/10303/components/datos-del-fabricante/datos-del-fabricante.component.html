<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="rfcFabricante">R.F.C.* :</label>
        <span class="bi bi-question-circle-fill" title="Registro Federal de Contribuyentes"
            data-bs-toggle="tooltip"></span>
        <input type="text" class="form-control" id="rfcFabricante" name="rfc" maxlength="13" [(ngModel)]="rfcFabricante"
            (blur)="buscarContribuyenteRfc(6, 'rfcFabricante')">
    </div>
    <div class="col-md-8">
        <label class="form-label" for="razonSocial">Nombre: </label>
        <input type="text" class="form-control" id="nombreFabricante" name="razonSocial" [(ngModel)]="nombreFabricante"
            disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="calleFabricante">Calle: </label>
        <input type="text" class="form-control" id="calleFabricante" name="calleFabricante"
            [(ngModel)]="calleFabricante" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="numExteriorFabricante">Número exterior: </label>
        <input type="text" class="form-control" id="numExteriorFabricante" name="numExteriorFabricante"
            [(ngModel)]="numExteriorFabricante" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="numInteriorFabricante">Número interior: </label>
        <input type="text" class="form-control" id="numInteriorFabricante" name="numInteriorFabricante"
            [(ngModel)]="numInteriorFabricante" disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <app-catalogo-select [catalogo]="pais" [label]="'País'" [isDisabled]="true" name="pais"
            [(ngModel)]="cvePaisFabricante"></app-catalogo-select>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="codigoPostal">Código postal: </label>
        <input type="text" class="form-control" id="codigoPostalFabricante" name="codigoPostal"
            [(ngModel)]="codigoPostalFabricante" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="estadoFabricante">Estado: </label>
        <input type="text" class="form-control" id="estadoFabricante" name="estadoFabricante"
            [(ngModel)]="estadoFabricante" disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="colonia">Colonia: </label>
        <input type="text" class="form-control" id="coloniaFabricante" name="colonia" [(ngModel)]="coloniaFabricante"
            disabled>
    </div>
</div>
