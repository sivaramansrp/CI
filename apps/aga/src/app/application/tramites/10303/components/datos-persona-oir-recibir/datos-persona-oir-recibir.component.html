<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="rfcPersonaAutorizada">R.F.C.* :</label>
        <span class="bi bi-question-circle-fill" title="Registro Federal de Contribuyentes"
            data-bs-toggle="tooltip"></span>
        <input type="text" class="form-control" id="rfcPersonaAutorizada" name="rfc" maxlength="13"
            (blur)="buscarContribuyenteRfc(4, 'rfcPersonaAutorizada')">
    </div>
    <div class="col-md-8">
        <label class="form-label" for="nombrePersonaAutorizada">Nombre: </label>
        <input type="text" class="form-control" id="nombrePersonaAutorizada" name="nombre" [(ngModel)]="nombrePersonaAutorizada"
            disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="callePersonaAutorizada">Calle: </label>
        <input type="text" class="form-control" id="callePersonaAutorizada" name="alle" [(ngModel)]="callePersonaAutorizada" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="numExteriorPersonaAutorizada">Número exterior: </label>
        <input type="text" class="form-control" id="numExteriorPersonaAutorizada" name="numeroExterior"
            [(ngModel)]="numExteriorPersonaAutorizada" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="numInteriorPersonaAutorizada">Número interior: </label>
        <input type="text" class="form-control" id="numInteriorPersonaAutorizada" name="numeroInterior"
            [(ngModel)]="numInteriorPersonaAutorizada" disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <app-catalogo-select [catalogo]="pais" [label]="'País'" [isDisabled]="true" name="pais"
            [(ngModel)]="cvePaisPersonaAutorizada"></app-catalogo-select>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="codigoPostal">Código postal: </label>
        <input type="text" class="form-control" id="codigoPostalPersonaAutorizada" name="codigoPostal"
            [(ngModel)]="codigoPostalPersonaAutorizada" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="informacionExtra" name="estado">Estado: </label>
        <input type="text" class="form-control" id="estadoPersonaAutorizada" name="informacionExtra"
            [(ngModel)]="estadoPersonaAutorizada" disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="colonia">Colonia: </label>
        <input type="text" class="form-control" id="coloniaPersonaAutorizada" name="colonia" [(ngModel)]="coloniaPersonaAutorizada"
            disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="correoElectronico">Correo electrónico: </label>
        <input type="text" class="form-control" id="correoElectronicoPersonaAutorizada" name="correoElectronico"
            [(ngModel)]="correoElectronicoPersonaAutorizada" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="telefono">Teléfono: </label>
        <input type="text" class="form-control" id="telefonoPersonaAutorizada" name="telefono" [(ngModel)]="telefonoPersonaAutorizada"
            disabled>
    </div>
</div>
