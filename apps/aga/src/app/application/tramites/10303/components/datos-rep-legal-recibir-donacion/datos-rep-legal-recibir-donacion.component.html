<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="rfc">R.F.C.* :</label>
        <span class="bi bi-question-circle-fill" title="Registro Federal de Contribuyentes"
            data-bs-toggle="tooltip"></span>
        <input type="text" class="form-control" id="rfcRepLegalAutorizado" name="rfc" maxlength="13"
            (blur)="buscarContribuyenteRfc(3, 'rfcRepLegalAutorizado')">
    </div>
    <div class="col-md-8">
        <label class="form-label" for="nombreRepLegalAutorizado">Nombre: </label>
        <input type="text" class="form-control" id="nombreRepLegalAutorizado" name="nombre" [(ngModel)]="nombreRepLegalAutorizado"
            disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="calleRepLegalAutorizado">Calle: </label>
        <input type="text" class="form-control" id="calleRepLegalAutorizado" name="alle" [(ngModel)]="calleRepLegalAutorizado" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="numExteriorRepLegalAutorizado">Número exterior: </label>
        <input type="text" class="form-control" id="numExteriorRepLegalAutorizado" name="numeroExterior"
            [(ngModel)]="numExteriorRepLegalAutorizado" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="numInteriorRepLegalAutorizado">Número interior: </label>
        <input type="text" class="form-control" id="numInteriorRepLegalAutorizado" name="numeroInterior"
            [(ngModel)]="numInteriorRepLegalAutorizado" disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <app-catalogo-select [catalogo]="pais" [label]="'País'" [isDisabled]="true" name="pais"
            [(ngModel)]="cvePaisRepLegalAutorizado"></app-catalogo-select>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="codigoPostal">Código postal: </label>
        <input type="text" class="form-control" id="codigoPostalRepLegalAutorizado" name="codigoPostal"
            [(ngModel)]="codigoPostalRepLegalAutorizado" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="informacionExtra" name="estado">Estado: </label>
        <input type="text" class="form-control" id="estadoRepLegalAutorizado" name="informacionExtra"
            [(ngModel)]="estadoRepLegalAutorizado" disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="colonia">Colonia: </label>
        <input type="text" class="form-control" id="coloniaRepLegalAutorizado" name="colonia" [(ngModel)]="coloniaRepLegalAutorizado"
            disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="correoElectronico">Correo electrónico: </label>
        <input type="text" class="form-control" id="correoElectronicoRepLegalAutorizado" name="correoElectronico"
            [(ngModel)]="correoElectronicoRepLegalAutorizado" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="telefono">Teléfono: </label>
        <input type="text" class="form-control" id="telefonoRepLegalAutorizado" name="telefono" [(ngModel)]="telefonoRepLegalAutorizado"
            disabled>
    </div>
</div>
