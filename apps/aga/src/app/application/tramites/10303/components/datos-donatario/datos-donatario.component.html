<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="rfcDonatario">R.F.C.* :</label>
        <span class="bi bi-question-circle-fill" title="Registro Federal de Contribuyentes"
            data-bs-toggle="tooltip"></span>
        <input type="text" class="form-control" id="rfcDonatario" name="rfc" maxlength="13" [(ngModel)]="rfcDonatario"
            (blur)="buscarContribuyenteRfc(1, 'rfcDonatario')">
    </div>
    <div class="col-md-8">
        <label class="form-label" for="nombreDonatario">Nombre: </label>
        <input type="text" class="form-control" id="nombreDonatario" name="nombre" [(ngModel)]="nombreDonatario"
            disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="calleDonatario">Calle: </label>
        <input type="text" class="form-control" id="calleDonatario" name="calle" [(ngModel)]="calleDonatario" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="numExteriorDonatario">Número exterior: </label>
        <input type="text" class="form-control" id="numExteriorDonatario" name="numeroExterior"
            [(ngModel)]="numExteriorDonatario" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="numInteriorDonatario">Número interior: </label>
        <input type="text" class="form-control" id="numInteriorDonatario" name="numeroInterior"
            [(ngModel)]="numInteriorDonatario" disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <app-catalogo-select [catalogo]="pais" [label]="'País'" [isDisabled]="true" name="pais"
            [(ngModel)]="cvePaisDonatario"></app-catalogo-select>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="codigoPostal">Código postal: </label>
        <input type="text" class="form-control" id="codigoPostalDonatario" name="codigoPostal"
            [(ngModel)]="codigoPostalDonatario" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="informacionExtra" name="estado">Estado: </label>
        <input type="text" class="form-control" id="estadoDonatario" name="informacionExtra"
            [(ngModel)]="estadoDonatario" disabled>
    </div>
</div>

<div class="row">
    <div class="col-md-4">
        <label class="form-label" for="colonia">Colonia: </label>
        <input type="text" class="form-control" id="coloniaDonatario" name="colonia" [(ngModel)]="coloniaDonatario"
            disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="correoElectronico">Correo electrónico: </label>
        <input type="text" class="form-control" id="correoElectronicoDonatario" name="correoElectronico"
            [(ngModel)]="correoElectronicoDonatario" disabled>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="telefono">Teléfono: </label>
        <input type="text" class="form-control" id="telefonoDonatario" name="telefono" [(ngModel)]="telefonoDonatario"
            disabled>
    </div>
</div>
