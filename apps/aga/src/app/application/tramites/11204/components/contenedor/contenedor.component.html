<div class="container">
    <form [formGroup]="solicitudForm" id="formSolicitud">
        <ng-titulo titulo="Ingresar por:" />
        <ng-container>
            <div class="row">
                <div class="col-md-12">
                    <br><br>
                    <div class="col-md-4">
                        <div class="radio">
                            <label>
                                <input type="radio" formControlName="tipoBusqueda" id="idRadioContenedor"
                                    value="Contenedor" class="form-check-input" (change)="onChange('tipoBusqueda', $event)">
                                Contenedor
                            </label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="radio">
                            <label>
                                <input type="radio" formControlName="tipoBusqueda" id="idRedioExcel" value="Archivo CSV"
                                    class="form-check-input" (change)="onChange('tipoBusqueda', $event)">
                                Archivo CSV
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>

        <ng-container *ngIf="mostrarSeccionAduanaaFecha">
            <div id="seccionAduanaaFecha">
                <div class="row">
                    <div class="col-md-12">
                        <h3>Datos generales</h3>
                        <hr class="red">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <app-catalogo-select [catalogo]="catalogoList" [label]="aduana.labelNombre"
                                [placeholder]="aduana.primerOpcion" [required]="true" formControlName="aduana"
                                (change)="onChange('aduana', $event)" [ngClass]="isValid('aduana') ? 'required' : ''"></app-catalogo-select>
                        </div>
                    </div>
                </div>
                <br><br>
            </div>
        </ng-container>
        <ng-container *ngIf="mostrarSeccionContenedor">
            <div id="seccionContenedor">
                <div class="row">
                    <div class="col-md-12">
                        <h3>Datos del equipo</h3>
                        <hr class="red">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="inicialesContenedor">Iniciales del equipo</label>
                            <span class="require">*</span>
                            <input type="text" formControlName="inicialesContenedor" id="inicialesContenedor"
                                maxlength="10" class="form-control" (change)="onChange('inicialesContenedor', $event)">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="numeroContenedor">Número de equipo</label>
                            <span class="require">*</span>
                            <input type="text" formControlName="numeroContenedor" id="numeroContenedor" maxlength="15"
                                class="form-control" (change)="onChange('numeroContenedor', $event)">
                        </div>
                    </div>
                </div>
                <br />
                <div class="row">
                    <div class="col-md-12" *ngIf="mostrarButtons">
                        <div class="form-group pull-right">
                            <button type="button" class="btn btn-default" (click)="limpiarCampos()">Limpiar</button>
                            <button type="button" class="btn btn-primary ms-2" (click)="datosCapturaModal()"
                                data-bs-toggle="modal" data-bs-target="#modalAgregarConstanciaTransferencia">Buscar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="mostrarAgregarTipoContenedor" *ngIf="mostrarAgregarTipoContenedor">
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <app-catalogo-select [catalogo]="contenedores.catalogos" [label]="contenedores.labelNombre"
                            [placeholder]="contenedores.primerOpcion" [required]="true" formControlName="contenedores"
                            (change)="setValoresStore(solicitudForm,'contenedores', 'setContenedores')"></app-catalogo-select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="digitoDeControl">Dígito verificador</label>
                            <input type="text" formControlName="digitoDeControl" id="digitoDeControl" maxlength="1"
                                class="form-control" (change)="onChange('digitoDeControl', $event)">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group datepicker-group">
                            <input-fecha [datos]="fechaIngreso" (valorCambiado)="cambioFechaIngreso($event)"></input-fecha>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group datepicker-group">
                            <input-fecha [datos]="Vigencia" (valorCambiado)="cambioVigencia($event)"></input-fecha>
                        </div>
                    </div>
                    <br />
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group pull-right">
                                <button type="button" class="btn btn-primary ms-2"
                                    (click)="datosCaptura()">Agregar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>

        <ng-container *ngIf="mostrarSeccionArchivoCsv">
            <div id="tabs">
                <div id="adjuntarArchivo">
                    <div class="row">
                        <div class="col-md-4">
                            <ng-titulo titulo="Datos generales" />
                            <app-catalogo-select [catalogo]="catalogoList" [label]="aduana.labelNombre"
                                [placeholder]="aduana.primerOpcion" [required]="true"
                                formControlName="aduanaMenuDesplegable"
                                (change)="setValoresStore(solicitudForm,'aduanaMenuDesplegable', 'setAduanaMenuDesplegable')"></app-catalogo-select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <ng-titulo titulo="Adjuntar archivo" />
                            <label for="archivoSeleccionado" class="form-label">Archivo Seleccionado*:</label>
                            <input class="form-control" type="file" name="archivoSeleccionado" id="archivoSeleccionado"
                                required>
                        </div>
                        <div class="col-md-4 d-flex justify-content-end cargarbtn">
                            <button type="button" class="btn btn-default" (click)="adjuntarArchivo()">Cargar
                                Archivo</button>
                        </div>
                        <div *ngIf="mostrarArchivoSeleccionadoTable" class="table-container ">
                            <app-tabla-dinamica [configuracionTabla]="csvTabla"
                                [datos]="datosDelCsvArchivo"></app-tabla-dinamica>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>

        <div class="col-md-12" id="IdGridContenedoresITC"
            *ngIf="!solicitud11204State?.tipoBusqueda || solicitud11204State?.tipoBusqueda === 'Contenedor'">
            <br>
            <div class="table-responsive">
                <div class="innercontainer">
                    <app-tabla-dinamica [configuracionTabla]="encabezadoDeTabla"
                        [datos]="datosDelContenedor"></app-tabla-dinamica>
                </div>
            </div>
            <div align="center" id="paginGridContenedoresITC">
                <nav aria-label="Page navigation example">
                    <ul class="pagination d-flex justify-content-center">
                        <li class="page-item"><a class="page-link" href="Javascript:;">1</a></li>
                    </ul>
                </nav>
            </div>
        </div>
        <div class="row" style="margin-top: 30px;margin-bottom: 30px;">
            <div class="form-group">
                <div class="col-md-12">
                    <div class="pull-right row">
                        <div class="col-md-5">
                            <button type="button" class="btn btn-danger">
                                Cancelar
                            </button>
                        </div>
                        <div class="col-md-5" id="botonGuardar">
                            <button type="submit" class="btn btn-primary" (click)="continuar()">
                                Continuar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div class="modal fade" id="modalAgregarConstanciaTransferencia" tabindex="-1" role="dialog"
        aria-labelledby="modalAgregarConstanciaTransferenciaLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Constancia no encontrada</h4>
                </div>
                <div class="modal-body">
                    <p>Constancia no encontrada, ¿Deseas agregar una nueva constancia?.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" (click)="mostrarTipoContenedor()"
                        data-bs-dismiss="modal">Si</button>
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal">No</button>
                </div>
            </div>
        </div>
    </div>
</div>
