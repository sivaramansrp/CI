<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h3>Transferencia de contenedores</h3>
      </div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { 
        @case (1) {
          <paso-uno (continuarEvento)="continuar()"></paso-uno>
        } 
        @case (2) {
          <paso-dos
           [idTipoTRamite]="'11204'"
          [datosUsuario]="datosUsuario"
          [cargaArchivosEvento]="cargarArchivosEvento"
          (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
          (reenviarCargaRealizada)="cargaRealizada($event)"
          ></paso-dos>

        }
        @case (3) {
          <paso-tres></paso-tres>
          <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
        } 
      }
    </div>
  </div>
</div>
