<div class="container mt-4 mb-4">
  <ng-titulo titulo="Información de la mercancía" />
  <form [formGroup]="informacionDeLaform">
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="fraccionArancelariaOptions"
          formControlName="fraccionArancelaria"
          [label]="'Fracción arancelaria'"
          [required]="true"
          name="fraccionArancelaria"
          (change)="
            valorSeleccionadoFraccion();
            setValoresStore(
              informacionDeLaform,
              'fraccionArancelaria',
              'setFraccionArancelaria'
            )
          "
        ></app-catalogo-select>
      </div>

      <div class="col-md-8">
        <label for="descripcionFraccion" class="form-label">Descripción:</label>
        <input
          id="descripcionFraccion"
          type="text"
          class="form-control"
          formControlName="descripcionFraccion"
          (change)="
            setValoresStore(
              informacionDeLaform,
              'descripcionFraccion',
              'setDescripcionFraccion'
            )
          "
        />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="nicoOptions"
          formControlName="nico"
          [label]="'Nico'"
          [required]="true"
          name="nico"
          (change)="
            valorSeleccionadoNico();
            setValoresStore(informacionDeLaform, 'nico', 'setNico')
          "
        ></app-catalogo-select>
      </div>

      <div class="col-md-8">
        <label for="descripcionNico" class="form-label">Descripción:</label>
        <input
          id="descripcionNico"
          type="text"
          class="form-control"
          formControlName="descripcionNico"
          (change)="
            setValoresStore(
              informacionDeLaform,
              'descripcionNico',
              'setDescripcionNico'
            )
          "
        />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-4">
        <label for="nombreQuimico" class="form-label">Nombre químico *:</label>
        <input
          id="nombreQuimico"
          type="text"
          class="form-control"
          formControlName="nombreQuimico"
          (change)="
            setValoresStore(
              informacionDeLaform,
              'nombreQuimico',
              'setNombreQuimico'
            )
          "
        />
      </div>

      <div class="col-md-8">
        <label for="nombreComercial" class="form-label"
          >Nombre comercial *:</label
        >
        <input
          id="nombreComercial"
          type="text"
          class="form-control"
          formControlName="nombreComercial"
          (change)="
            setValoresStore(
              informacionDeLaform,
              'nombreComercial',
              'setNombreComercial'
            )
          "
        />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-8">
        <label for="numeroCAS" class="form-label"
          >Número de Chemical Abstracts Substance (CAS) *:</label
        >
        <input
          id="numeroCAS"
          type="text"
          class="form-control"
          formControlName="numeroCAS"
          (change)="
            setValoresStore(informacionDeLaform, 'numeroCAS', 'setNumeroCAS')
          "
        />
      </div>

      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="estadoFisicoOptions"
          formControlName="estadoFisico"
          [label]="'Estado Fisico'"
          [required]="true"
          name="estadoFisico"
          (change)="
            setValoresStore(
              informacionDeLaform,
              'estadoFisico',
              'setEstadoFisico'
            )
          "
        ></app-catalogo-select>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-12">
        <label for="acondicionamiento" class="form-label text-start"
          >Indique el acondicionamiento con el que se presenta la mercancía al
          momento del despacho aduanero (sacos, totes, pipas, carro tanque, iso
          tanque, etc)*:</label
        >
        <textarea
          id="acondicionamiento"
          class="form-control"
          style="height: 50%; resize: none"
          formControlName="acondicionamiento"
          (change)="
            setValoresStore(
              informacionDeLaform,
              'acondicionamiento',
              'setAcondicionamiento'
            )
          "
        ></textarea>
      </div>
    </div>
  </form>

  <div class="row my-5">
    <btn-continuar [datos]="datosPasos"></btn-continuar>
  </div>
</div>
