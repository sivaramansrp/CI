<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a
          data-toggle="tab"
          tabindex="0"
          (keyup)="seleccionaTab(1)"
          (click)="seleccionaTab(1)"
          >Solicitante</a
        >
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a
          data-toggle="tab"
          tabindex="0"
          (keyup)="seleccionaTab(1)"
          (click)="seleccionaTab(2)"
          >Registro para la toma de muestras de mercancías</a
        >
      </li>
      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a
          data-toggle="tab"
          tabindex="0"
          (keyup)="seleccionaTab(1)"
          (click)="seleccionaTab(3)"
          >Pago de derechos</a
        >
      </li>
    </ul>
    <ng-container>
      @switch (indice) { @case (1) {
      <solicitante #Solicitante></solicitante>
      } @case (2) {
      <app-registro-para-la [procedureState]="tieneConsulta"></app-registro-para-la>
      <app-de-la-muestra [procedureState]="tieneConsulta"></app-de-la-muestra>
      <app-informacion-de-la [procedureState]="tieneConsulta"></app-informacion-de-la>
      } @case (3) {
      <app-pago-de-derechos [procedureState]="tieneConsulta"></app-pago-de-derechos>
      } }
    </ng-container>
  </div>
</div>
