<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a
          data-toggle="tab"
          tabindex="0"
          (keyup)="seleccionaTab(1)"
          (click)="seleccionaTab(1)"
          >Solicitante</a
        >
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a
          data-toggle="tab"
          tabindex="0"
          (keyup)="seleccionaTab(1)"
          (click)="seleccionaTab(2)"
          >Registro para la toma de muestras de mercancías</a
        >
      </li>
      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a
          data-toggle="tab"
          tabindex="0"
          (keyup)="seleccionaTab(1)"
          (click)="seleccionaTab(3)"
          >Pago de derechos</a
        >
      </li>
    </ul>
    <ng-container>
      @switch (indice) { @case (1) {
      <solicitante #Solicitante></solicitante>
      } @case (2) {
        @if(esDatosRespuesta) {
          <app-registro-para-la (emitirElValorSeleccionado)="actualizarPagina($event)"></app-registro-para-la>
          @if (seccionSeleccionada==='1') {
            <app-de-la-muestra></app-de-la-muestra>
            <app-informacion-de-la></app-informacion-de-la>
          } @else if (seccionSeleccionada==='2') {
            <app-informacion-de-la></app-informacion-de-la>
          }
        }
      } @case (3) {
       @if(esDatosRespuesta){
      <app-pago-de-derechos></app-pago-de-derechos>
         }
      } }
    </ng-container>
  </div>
</div>
