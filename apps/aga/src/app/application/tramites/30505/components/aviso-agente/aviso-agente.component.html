<div class="row mt-5">
    <div class="col-md-12">
    <ng-titulo titulo="Aviso de Agentes Aduanales y Apoderados Aduanales autorizados" />
    </div>
  
    <div class="col-md-12">
      <app-tabla-dinamica
        [configuracionTabla]="AGENTE_CONFIGURATION_TABLA"
        [datos]="avisoAgenteDatos"
        [acciones]="acciones"
      >
      </app-tabla-dinamica>
    </div>

    <div class="row">
    <div class="col-md-12">
      <div class="d-flex justify-content-end">
        <button
          type="button"
          id="btnAgregarPersona"
          class="btn btn-primary me-2"
          data-bs-toggle="modal" 
          data-bs-target="#modalAddAgent" 
          (click)="AgregarTransportias()"
        >
          Agregar
        </button>
        <button
          type="button"
          id="btnEliminarPersona"
          class="btn btn-danger me-2"
        >
          Eliminar
        </button>
        <button
          type="button"
          id="btnModificarPersona"
          class="btn btn-secondary"
        >
          Modificar
        </button>
      </div>
    </div>
  </div>
</div>
