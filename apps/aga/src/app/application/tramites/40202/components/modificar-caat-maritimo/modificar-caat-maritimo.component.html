<div [formGroup]="buscarEmpresaForm">
    <!--Tipo de empresa-->
    <ng-titulo titulo="Tipo de empresa"></ng-titulo>

    <div formGroupName="tipoDeEmpresa">
        <div class="row">
            <div class="col-md-12">
                <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'vertical'"
                    formControlName="tipoDeEmpresaOpcion"
                    (change)="setValoresStore(tipoDeEmpresa,'tipoDeEmpresaOpcion', 'setTipoDeEmpresaOpcion')"
                    (valueChange)="enCambioDeValor($event)"></app-input-radio>
            </div>
        </div>
    </div>

    @if(vista === '1'){
    <div id="tabBuscaNcional" class="row" formGroupName="tipoDeEmpresaNacional">
        <div class="col col-md-8">
            <div class="form-group">
                <label class="form-label" for="buscarPorDenominacionNa">Nombre, denominación o razón
                    social:</label>
                <input type="text" class="form-control" name="buscarPorDenominacionNa"
                    formControlName="buscarPorDenominacionNa" maxlength="50" id="buscarPorDenominacionNa"
                    (change)="setValoresStore(tipoDeEmpresaNacional,'buscarPorDenominacionNa', 'setBuscarPorDenominacionNa')">
            </div>
            <div class="form-group mt-4">
                <label class="form-label" for="rfc">RFC: <span class="bi bi-question-circle-fill"
                        title="{{ TEXTOS.RFC_TITULO_TOOLTIP }}" data-bs-toggle="tooltip"></span></label>
                <input type="text" class="form-control" id="buscarPorRFCNa" maxlength="20"
                    formControlName="buscarPorRFCNa"
                    (change)="setValoresStore(tipoDeEmpresaNacional,'buscarPorRFCNa', 'setBuscarPorRFCNa')">
            </div>
            <div class="form-group mt-4">
                <label class="form-label" for="folioCaatBusquedaNa">CAAT: <span class="bi bi-question-circle-fill"
                        title="{{ TEXTOS.CAAT_TITULO_TOOLTIP }}" data-bs-toggle="tooltip"></span></label>
                <input type="text" class="form-control" name="folioCaatBusquedaNa" formControlName="folioCaatBusquedaNa"
                    maxlength="50" id="folioCaatBusquedaNa"
                    (change)="setValoresStore(tipoDeEmpresaNacional,'folioCaatBusquedaNa', 'setFolioCaatBusquedaNa')">
            </div>
        </div>
        <div class="col-md-offset-7 col-md-1 mt-5">
            <button type="button" id="buscaCandidato1" name="buscaCandidato1" class="btn btn-primary pull-right"
                data-bs-toggle="modal" data-bs-target="#modal-alerta" (click)="buscarEmpresa(1)">Buscar</button>
        </div>

        @if (nuevaAlertaNotificacion) {
        <section>
            <lib-notificaciones [notificacionInput]="nuevaAlertaNotificacion">
            </lib-notificaciones>
        </section>
        }
    </div>
    }

    @if(vista === '2'){
    <div id="tabBuscaExtranjero" class="row" formGroupName="tipoDeEmpresaExtranjera">
        <div id="tablaDatosGenerales">
            <div class="col col-md-8">
                <div class="form-group">
                    <label class="form-label" for="buscarPorDenominacionEx">Nombre, denominación o razón
                        social:</label>
                    <input type="text" class="form-control" name="buscarPorDenominacionEx"
                        formControlName="buscarPorDenominacionEx" maxlength="50" id="buscarPorDenominacionEx"
                        (change)="setValoresStore(tipoDeEmpresaExtranjera,'buscarPorDenominacionEx', 'setBuscarPorDenominacionEx')">
                </div>
                <div class="form-group mt-4">
                    <label class="form-label" for="folioCaatBusquedaEx">CAAT: <span class="bi bi-question-circle-fill"
                            title="{{ TEXTOS.CAAT_TITULO_TOOLTIP }}" data-bs-toggle="tooltip"></span></label>
                    <input type="text" class="form-control" name="folioCaatBusquedaEx"
                        formControlName="folioCaatBusquedaEx" maxlength="50" id="folioCaatBusquedaEx"
                        (change)="setValoresStore(tipoDeEmpresaExtranjera,'folioCaatBusquedaEx', 'setFolioCaatBusquedaEx')">
                </div>
            </div>
            <div class="col-md-offset-7 col-md-1 mt-5">
                <button type="button" id="buscaCandidato2" name="buscaCandidato2" class="btn btn-primary pull-right"
                    (click)="buscarEmpresa(2)">Buscar</button>
            </div>
        </div>
    </div>
    }

    <!--Empresa con CAAT registrado-->
    <label for="Empresa con CAAT registrado">Empresa con CAAT registrado:</label>

    <div class="row mt-5">
        <div class="col-md-12">
            <app-tabla-dinamica [tipoSeleccionTabla]="tablaSeleccionCheckbox"
                [configuracionTabla]="caatRegistradoEmpresaEncabezadoDeTabla" [datos]="caatRegistradoEmpresaTabla">
            </app-tabla-dinamica>
        </div>
    </div>
    @if(mostrarAgregarSeleccionado){
    <div class="row top-buffer">
        <div class="col-md-12">
            <button type="button" id="guardarBuscado2" name="guardarBuscado2" class="btn btn-primary pull-right"
                data-bs-toggle="modal" (click)="agregarSeleccionado(caatRegistradoEmpresaTabla)">Agregar
            </button>
        </div>
    </div>

    }

    <!--Agregar Seleccionado Modal Popup-->
    @if (nuevaAlertaSeleccionNotificacion) {
    <section>
        <lib-notificaciones [notificacionInput]="nuevaAlertaSeleccionNotificacion">
        </lib-notificaciones>
    </section>
    }

    <!--Candidato a modificar CAAT marítimo-->
    <label for="Candidato a modificar CAAT marítimo">Candidato a modificar CAAT marítimo:</label>
    <div class="row mt-5">
        <div class="col-md-12">
            <app-tabla-dinamica [tipoSeleccionTabla]="tablaSeleccionCheckbox"
                [configuracionTabla]="candidatoModificarCaatEncabezadoDeTabla" [datos]="candidatoModificarCaatTabla">
            </app-tabla-dinamica>
        </div>
    </div>
</div>

<div class="modal fade" id="modal-agregar-pfe" tabindex="-1" aria-labelledby="modalAgregarPFELabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body">
                <div id="dialogoPersonaFisicaExtranjera">
                    <form [formGroup]="personaFisicaExtranjeraForm" id="formPFE" name="formPFE">
                        <!--Persona física extranjera-->
                        <ng-titulo titulo="Persona física extranjera"></ng-titulo>

                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label" for="seguroNumero">Número del seguro social*:</label>
                                <input type="text" class="form-control" size="40" id="nssPFE" maxlength="11"
                                    formControlName="seguroNumero"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'seguroNumero', 'setSeguroNumero')">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="nombrePFE">Nombre(s)*:</label>
                                <input type="text" class="form-control" size="40" id="nombrePFE" maxlength="200"
                                    formControlName="nombrePFE"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'nombrePFE', 'setNombrePFE')">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="apellidoPaterno">Primer Apellido*:</label>
                                <input type="text" class="form-control" size="40" id="apellidoPaternoPFE"
                                    maxlength="200" formControlName="apellidoPaternoPFE"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'apellidoPaternoPFE', 'setApellidoPaternoPFE')">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4">
                                <label class="form-label" for="apellidoMaterno">Segundo Apellido:</label>
                                <input type="text" class="form-control" name="apellidoMaternoPFE"
                                    formControlName="apellidoMaternoPFE" id="apellidoMaternoPFE" maxlength="200"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'apellidoMaternoPFE', 'setApellidoMaternoPFE')">
                            </div>
                            <div class="col-md-8">
                                <label class="form-label" for="correoPFE">Correo electrónico*: <span
                                        class="bi bi-question-circle-fill" title="{{ TEXTOS.CORREO_TITULO_TOOLTIP }}"
                                        data-bs-toggle="tooltip"></span></label>
                                <input type="text" class="form-control" name="correoPFE" formControlName="correoPFE"
                                    maxlength="320" id="correoPFE"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'correoPFE', 'setCorreoPFE')">
                            </div>
                        </div>

                        <!-- Domicilio fiscal-->
                        <ng-titulo titulo="Domicilio fiscal"></ng-titulo>

                        <div class="row">
                            <div class="col-md-4">
                                <app-catalogo-select [catalogo]="pais" [id]="'paisPFE'" formControlName="paisPFE"
                                    [label]="'País'" name="cvePais" (change)="paisSeleccion()"
                                    [required]="true"></app-catalogo-select>
                            </div>
                            <div class="col-md-4 pt-7">
                                <label for="codigoPostal">Código postal*:</label>
                                <input type="text" class="form-control" name="codigoPostalPFE" id="codigoPostalPFE"
                                    formControlName="codigoPostalPFE" maxlength="12"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'codigoPostalPFE', 'setCodigoPostalPFE')">
                            </div>
                            <div class="col-md-4 pt-7">
                                <label for="ciudad">Ciudad*:</label>
                                <input type="text" class="form-control" name="ciudadPFE" id="ciudadPFE"
                                    formControlName="ciudadPFE" maxlength="120"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'ciudadPFE', 'setCiudadPFE')">
                            </div>
                        </div>
                        <div class="row pt-7">
                            <div class="col-md-4">
                                <label for="estado">Estado*:</label>
                                <input type="text" class="form-control" name="estadoPFE" id="entidadFederativaPFE"
                                    formControlName="estadoPFE" maxlength="200"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'estadoPFE', 'setEstadoPFE')">
                            </div>
                            <div class="col-md-8">
                                <label for="calle">Calle*:</label>
                                <input type="text" class="form-control" name="callePFE" id="callePFE"
                                    formControlName="callePFE" maxlength="100"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'callePFE', 'setCallePFE')">
                            </div>
                        </div>
                        <div class="row pt-7">
                            <div class="col-md-4">
                                <label for="numeroExterior">Número exterior*:</label>
                                <input type="text" class="form-control" name="numeroExteriorPFE" id="numeroExteriorPFE"
                                    formControlName="numeroExteriorPFE" maxlength="55"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'numeroExteriorPFE', 'setNumeroExteriorPFE')">
                            </div>
                            <div class="col-md-4">
                                <label for="numeroInterior">Número interior:</label>
                                <input type="text" class="form-control" name="numeroInteriorPFE" id="numeroInteriorPFE"
                                    formControlName="numeroInteriorPFE" maxlength="55"
                                    (change)="setValoresStore(personaFisicaExtranjeraForm,'numeroInteriorPFE', 'setNumeroInteriorPFE')">
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <div class="modal-footer custom-footer mt-4">
                <div class="row">
                    <div class="col-md-8 text-muted">
                        <p>* Campos obligatorios</p>
                    </div>
                    <div class="col-md-4 d-flex justify-content-end">
                        <button type="button" class="btn btn-default mx-2" id="cancelarPFE" name="cancelar"
                            data-bs-dismiss="modal" #closeModal>Cancelar</button>
                        <button type="button" class="btn btn-primary" id="guardarPFE" name="guardar"
                            (click)="agregarPFE(personaFisicaExtranjeraForm.getRawValue())">Guardar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
