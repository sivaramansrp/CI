<div class="container">
  <div class="row mt-5">
    <div class="col-md-12">
      <label>Datos Requeridos*:</label>
      <div class="alert alert-info">
        <label style="font-weight: normal">
          <input type="checkbox" style="margin-left: -245px" /> *Manifesto bajo
          protesta de decir verdad que el donante de la mercancía es extranjero
        </label>
      </div>
      <div class="row mt-5">
        <div class="col-md-8">
          <app-catalogo-select
            [catalogo]="aduana.catalogos"
            [label]="aduana.labelNombre"
            [placeholder]="aduana.primerOpcion"
            [required]="true"
          ></app-catalogo-select>
        </div>
      </div>
      <ng-titulo titulo="Mercancía" />
      <div class="row">
        <div class="col-md-6">
          <label for="mercancia">Mercancías*:</label>
        </div>
        <div class="table-container">
          <ng-table [commonTableHeader]="encabezadosTabla"> </ng-table>
        </div>
        <div class="col-md-12 mt-5 d-flex justify-content-end">
          <button type="button" class="btn btn-default">Modificar</button>
          <button type="button" class="btn btn-default ms-3">Elimiar</button>
          <button
            type="button"
            class="btn btn-primary ms-3"
            (click)="nextTabla()"
          >
            Agregar
          </button>
        </div>
      </div>

      <ng-container *ngIf="!showTabla && isPopupClose">
        <div class="row mt-5">
          <ng-alert [CONTENIDO]="TEXTO_DE_ADJUNTAR"></ng-alert>
        </div>
        <ng-titulo titulo="Datos de la mercancía" />
        <crosslist
          [fechas]="selectRangoDias"
          [showSearchInput1]="true"
          [showSearchInput2]="true"
          [botonField]="botonField"
        ></crosslist>

        <div class="row mt-5">
          <div class="col-md-12">
            <label>Tipo de mercancía*:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              value="Mercancía"
            />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-4">
            <label>Uso especifico de la mercancía*:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              value="EDT"
            />
          </div>
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="condicion.catalogos"
              [label]="condicion.labelNombre"
              [placeholder]="condicion.primerOpcion"
              [required]="true"
            ></app-catalogo-select>
          </div>
          <div class="col-md-4">
            <label>Marca:</label>
            <input type="text" class="form-control" value="MARCA34345" />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="ano.catalogos"
              [label]="ano.labelNombre"
              [placeholder]="ano.primerOpcion"
              [required]="false"
            ></app-catalogo-select>
          </div>
          <div class="col-md-4">
            <label>Modelo:</label>
            <input type="text" class="form-control" value="MOD435345" />
          </div>
          <div class="col-md-4">
            <label>Número de serie:</label>
            <input type="text" class="form-control" value="SERIE342" />
          </div>
        </div>

        <div class="col-md-12 mt-5 d-flex justify-content-end">
          <button type="button" class="btn btn-default">Limpiar</button>
          <button type="button" class="btn btn-default ms-3">Cancelar</button>
          <button
            type="button"
            class="btn btn-primary ms-3"
            (click)="openPopup()"
          >
            Agregar
          </button>
        </div>
        <div
          class="modal"
          tabindex="-1"
          role="dialog"
          [ngClass]="{ show: isPopupOpen }"
          [ngStyle]="{ display: isPopupOpen ? 'block' : 'none' }"
        >
          <div class="modal-dialog" role="document">
            <div
              class="modal-content"
              style="width: fit-content; margin-left: 115px"
            >
              <div style="background-color: black; height: 55px"></div>
              <div class="modal-body">
                <p>La mercancia fue <br />agregada correctamente.</p>
              </div>
              <div class="modal-footer" style="justify-content: center">
                <button
                  type="button"
                  class="btn btn-primary"
                  (click)="closePopup()"
                >
                  Acceptar
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="modal-backdrop fade show" *ngIf="isPopupOpen"></div>
      </ng-container>

      <ng-titulo titulo="Datos del donante extrajero" />
      <div class="row">
        <div class="col-md-8">
          <label>Nombre:*:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            value="DONATELO MARSEL COBRE"
          />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-8">
          <label>Calle*:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            value="CALLE"
          />
        </div>
        <div class="col-md-4">
          <label>Número exterior*:</label>
          <input type="text" required="true" class="form-control" value="2" />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-4">
          <label>Número interior:</label>
          <input type="text" class="form-control" value="4" />
        </div>
        <div class="col-md-4">
          <label>Teléfono:</label>
          <input type="text" class="form-control" value="123432443543" />
        </div>
        <div class="col-md-4">
          <label>Correo electrónico:</label>
          <input type="text" class="form-control" value="" />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="pais.catalogos"
            [label]="pais.labelNombre"
            [placeholder]="pais.primerOpcion"
            [required]="true"
          ></app-catalogo-select>
        </div>
        <div class="col-md-4">
          <label>Código postal*:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            value="343434"
          />
        </div>
        <div class="col-md-4">
          <label>Estado*:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            value="343434"
          />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-4">
          <label>Colonia*:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            value="343434"
          />
        </div>
      </div>

      <div class="row mt-5">
        <label required="true"
          >Señale si la mercancía formará parte del patrimonio de su
          representada*:</label
        >
        <app-input-radio
          [radioOptions]="radioOpcions"
          [selectedValue]="valorSeleccionado"
          (valueChange)="cambiarRadio($event)"
        >
        </app-input-radio>
      </div>
    </div>
  </div>
</div>
