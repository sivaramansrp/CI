<div class="container">
  <form [formGroup]="tramiteForm" (ngSubmit)="validarDestinatarioFormulario()" class="row mt-5">
    <div class="col-md-12">
      <ng-container formGroupName="importadorExportador">
        <label>Datos Requeridos*:</label>
        <div class="alert alert-info">
          <label style="font-weight: normal">
            <input type="checkbox" formControlName="manifesto" id="manifesto" (change)="
                setValoresStore(
                  importadorExportador,
                  'manifesto',
                  'setManifesto'
                )
              " [disabled]="esFormularioSoloLectura" />
            *Manifesto bajo protesta de decir verdad que el donante de la
            mercancía es extranjero
          </label>
        </div>
        <div class="row mt-5">
          <div class="col-md-8">
            <app-catalogo-select [catalogo]="aduana.catalogos" [label]="aduana.labelNombre"
              [placeholder]="aduana.primerOpcion" [required]="true" id="aduana" formControlName="aduana" (change)="
                setValoresStore(importadorExportador, 'aduana', 'setAduana')
              " [isDisabled]="esFormularioSoloLectura">
            </app-catalogo-select>
          </div>
        </div>
      </ng-container>
      <ng-titulo titulo="Mercancía" />
      <div class="row">
        <div class="col-md-6">
          <label for="mercancia">Mercancías*:</label>
        </div>
        <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX" [configuracionTabla]="encabezadoDeTabla"
          [datos]="mercanciaDatos" [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
          (listaDeFilaSeleccionada)="onSelectedRowsChange($event)"></app-tabla-dinamica>
        <div class="col-md-12 mt-5 d-flex justify-content-end">
          <button type="button" class="btn btn-default" [disabled]="esFormularioSoloLectura" data-bs-toggle="modal"
            data-bs-target="#modalAgregarMercancias">Modificar</button>
          <button type="button" class="btn btn-danger ms-3" [disabled]="esFormularioSoloLectura"
            (click)="eliminar()">Eliminar</button>
          <button type="button" class="btn btn-primary ms-3" data-bs-toggle="modal"
            data-bs-target="#modalAgregarMercancias" [disabled]="esFormularioSoloLectura">
            Agregar
          </button>
        </div>
      </div>

      <div class="modal fade" id="modalAgregarMercancias" tabindex="-1" aria-labelledby="modalAgregarMercanciasLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-body">
              <form [formGroup]="agregarMercanciasForm">
                <div class="row">
                  <ng-alert [CONTENIDO]="TEXTO_DE_ADJUNTAR"></ng-alert>
                </div>
                <ng-titulo titulo="Datos de la mercancía" />
                <label class="mb-5">Fines a los que se destinará la mercancía*:</label>
                <crosslist [fechas]="selectRangoDias" [botones]="finesDeMercanciaBotons"
                  [fechasSeleccionadas]="solicitudState.fechasSeleccionadas" [isDisabled]="esFormularioSoloLectura"
                  (fechasSeleccionadasChange)="changeCrosslist($event)"></crosslist>
                <ng-container formGroupName="datosMercancia">
                  <div class="row mt-5">
                    <div class="col-md-12">
                      <label>Tipo de mercancía*:</label>
                      <input type="text" width:140 required="true" class="form-control" id="tipoMercancia"
                        formControlName="tipoMercancia" [ngClass]="
                isValid(datosMercancia, 'tipoMercancia') ? 'required' : ''
              " (change)="
                setValoresStore(
                  datosMercancia,
                  'tipoMercancia',
                  'setTipoMercancia'
                )
              " [disabled]="esFormularioSoloLectura" />
                    </div>
                  </div>
                </ng-container>
                <ng-container formGroupName="datosMercancia">
                  <div class="row mt-3">
                    <div class="col-md-4">
                      <label>Uso específico de la mercancía*:</label>
                      <input type="text" required="true" class="form-control" id="usoEspecifico"
                        formControlName="usoEspecifico" [ngClass]="
                  isValid(datosMercancia, 'usoEspecifico')
                    ? 'required'
                    : ''
                " (change)="
                  setValoresStore(
                    datosMercancia,
                    'usoEspecifico',
                    'setUsoEspecifico'
                  )
                " [disabled]="esFormularioSoloLectura" />
                    </div>
                    <div class="col-md-4">
                      <app-catalogo-select [catalogo]="condicion.catalogos" [label]="condicion.labelNombre"
                        [placeholder]="condicion.primerOpcion" [required]="true" id="condicion"
                        formControlName="condicion" (change)="setValoresStore(
                    datosMercancia,
                    'condicion',
                    'setCondicion')" [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
                      <div *ngIf="isInvalid('condicion')" class="mensaje-error">
                        Este campo es obligatorio.
                      </div>
                    </div>
                    <div class="col-md-4">
                      <label>Marca:</label>
                      <input type="text" class="form-control" id="marca" formControlName="marca" [ngClass]="
                  isValid(datosMercancia, 'marca') ? 'required' : ''
                " (change)="
                  setValoresStore(datosMercancia, 'marca', 'setMarca')
                " [disabled]="esFormularioSoloLectura" />
                    </div>
                  </div>
                  <div class="row mt-3">
                    <div class="col-md-4">
                      <app-catalogo-select [catalogo]="ano.catalogos" [label]="ano.labelNombre"
                        [placeholder]="ano.primerOpcion" [required]="false" id="ano" formControlName="ano" (change)="
                  setValoresStore(datosMercancia, 'ano', 'setAno')
                " [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
                    </div>
                    <div class="col-md-4">
                      <label>Modelo:</label>
                      <input type="text" class="form-control" id="modelo" formControlName="modelo" [ngClass]="
                  isValid(datosMercancia, 'modelo') ? 'required' : ''
                " (change)="
                  setValoresStore(datosMercancia, 'modelo', 'setModelo')
                " [disabled]="esFormularioSoloLectura" />
                    </div>
                    <div class="col-md-4">
                      <label>Número de serie:</label>
                      <input type="text" class="form-control" id="serie" formControlName="serie" [ngClass]="
                  isValid(datosMercancia, 'serie') ? 'required' : ''
                " (change)="
                  setValoresStore(datosMercancia, 'serie', 'setSerie')
                " [disabled]="esFormularioSoloLectura" />
                    </div>
                  </div>
                </ng-container>

                <div class="col-md-12 mt-5 mb-5 d-flex justify-content-end">
                  <button type="button" class="btn btn-default" [disabled]="esFormularioSoloLectura"
                    (click)="limpiarMercancias()">Limpiar</button>
                  <button type="button" class="btn btn-default ms-3" [disabled]="esFormularioSoloLectura"
                    data-bs-dismiss="modal" #closeModal>Cancelar</button>
                  <button type="button" class="btn btn-primary ms-3" data-bs-toggle="modal"
                    data-bs-target="#modalConfirmacion" [disabled]="esFormularioSoloLectura"
                    (click)="agregarMercancia()">
                    Agregar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <ng-titulo titulo="Datos del donante extranjero" />
      <ng-container formGroupName="importadorExportador">
        <div class="row">
          <div class="col-md-8">
            <label>Nombre*:</label>
            <input type="text" required="true" class="form-control" id="nombre" formControlName="nombre" [ngClass]="
                isValid(importadorExportador, 'nombre') ? 'required' : ''
              " (change)="
                setValoresStore(importadorExportador, 'nombre', 'setNombre')
              " [disabled]="esFormularioSoloLectura" />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-8">
            <label>Calle*:</label>
            <input type="text" required="true" class="form-control" maxlength="100" id="calle" formControlName="calle"
              [ngClass]="
                isValid(importadorExportador, 'calle') ? 'required' : ''
              " (change)="
                setValoresStore(importadorExportador, 'calle', 'setCalle')
              " [disabled]="esFormularioSoloLectura" />
          </div>
          <div class="col-md-4">
            <label>Número exterior*:</label>
            <input type="text" required="true" maxlength="55" class="form-control" id="numeroExterior"
              formControlName="numeroExterior" [ngClass]="
                isValid(importadorExportador, 'numeroExterior')
                  ? 'required'
                  : ''
              " (change)="
                setValoresStore(
                  importadorExportador,
                  'numeroExterior',
                  'setNumeroExterior'
                )
              " [disabled]="esFormularioSoloLectura" />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-4">
            <label>Número interior:</label>
            <input type="text" class="form-control" maxlength="55" id="numeroInterior" formControlName="numeroInterior"
              [ngClass]="
                isValid(importadorExportador, 'numeroInterior')
                  ? 'required'
                  : ''
              " (change)="
                setValoresStore(
                  importadorExportador,
                  'numeroInterior',
                  'setNumeroInterior'
                )
              " [disabled]="esFormularioSoloLectura" />
          </div>

          <div class="col-md-4">
            <label>Teléfono:</label>
            <input type="text" class="form-control" id="telefono" formControlName="telefono" maxlength="30" [ngClass]="
                isValid(importadorExportador, 'telefono') ? 'required' : ''
              " (change)="
                setValoresStore(importadorExportador, 'telefono', 'setTelefono')
              " [disabled]="esFormularioSoloLectura" />
          </div>
          <div class="col-md-4">
            <label>Correo electrónico:</label>
            <input type="email" class="form-control" maxlength="50" id="correoElectronico"
              formControlName="correoElectronico" [ngClass]="
                isValid(importadorExportador, 'correoElectronico')
                  ? 'required'
                  : ''
              " (change)="
                setValoresStore(
                  importadorExportador,
                  'correoElectronico',
                  'setCorreoElectronico'
                )
              " [disabled]="esFormularioSoloLectura" />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-4">
            <app-catalogo-select [catalogo]="pais.catalogos" [label]="pais.labelNombre"
              [placeholder]="pais.primerOpcion" [required]="true" id="pais" formControlName="pais"
              (change)="setValoresStore(importadorExportador, 'pais', 'setPais')"
              [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
          </div>
          <div class="col-md-4">
            <label>Código postal*:</label>
            <input type="text" required="true" class="form-control" id="codigoPostal" formControlName="codigoPostal"
              [ngClass]="
                isValid(importadorExportador, 'codigoPostal') ? 'required' : ''
              " (change)="
                setValoresStore(
                  importadorExportador,
                  'codigoPostal',
                  'setCodigoPostal'
                )
              " [disabled]="esFormularioSoloLectura" />
          </div>
          <div class="col-md-4">
            <label>Estado*:</label>
            <input type="text" required="true" class="form-control" id="estado" formControlName="estado" [ngClass]="
                isValid(importadorExportador, 'estado') ? 'required' : ''
              " (change)="
                setValoresStore(importadorExportador, 'estado', 'setEstado')
              " [disabled]="esFormularioSoloLectura" />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-4">
            <label>Colonia*:</label>
            <input type="text" required="true" class="form-control" id="colonia" formControlName="colonia" [ngClass]="
                isValid(importadorExportador, 'colonia') ? 'required' : ''
              " (change)="
                setValoresStore(importadorExportador, 'colonia', 'setColonia')
              " [disabled]="esFormularioSoloLectura" />
          </div>
        </div>

        <div class="row mt-5">
          <label required="true">Señale si la mercancía formará parte del patrimonio de su
            representada*:</label>
          <app-input-radio [radioOptions]="radioOpcions" [selectedValue]="valorSeleccionado"
            (valueChange)="cambiarRadio($event)" id="opcion" formControlName="opcion"
            (change)="setValoresStore(importadorExportador, 'opcion', 'setOpcion')"
            [disabled]="esFormularioSoloLectura">
          </app-input-radio>
        </div>
      </ng-container>
    </div>
  </form>
</div>

<div id="modalConfirmacion" aria-labelledby="modalConfirmacionLabel" class="modal fade" tabindex="-1" role="dialog"
  #modalConfirmacion>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content modalsm">
      <div class="modal-body">
        <p>La mercancía fue <br />agregada correctamente.</p>
      </div>
      <div class="modal-footer" style="justify-content: center">
        <button type="button" class="btn btn-primary" #closeModalConfirmacion data-bs-dismiss="modal">
          Acceptar
        </button>
      </div>
    </div>
  </div>
</div>
