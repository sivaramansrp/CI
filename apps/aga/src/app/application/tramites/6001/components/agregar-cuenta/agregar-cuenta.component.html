<div class="container">
    <ng-titulo titulo="Agregar cuenta" />
    <h4 class="mb-5">Ingresar los datos de la cuenta bancaria</h4>

    <div class="row mb-3">
        <div class="col-md-12">
            <form [formGroup]="agregarCuentaForm">
                <div class="mb-3 row">
                    <label for="titular" class="col-sm-3 col-form-label">Titular de la cuenta*:</label>
                    <div class="col-sm-9">
                        <div class="form-group">
                            <input type="text" formControlName="titularDeLaCuenta" class="form-control" id="titular" >
                        </div>
                    </div>
                </div>
        
                <div class="row mb-3">
                    <div class="col-md-12">
                        <app-catalogo-select 
                            [catalogo]="tipoDePersona" 
                            [label]="'Tipo de persona'"
                            [required]="true"
                            formControlName="persona"
                             name="persona"  
                            (change)="tipoDePersonaSeleccion()" >
                        </app-catalogo-select>
                    </div>
                </div>
        
                <div class="mb-3 row">
                    <label for="rfc" class="col-sm-3 col-form-label">RFC*:<i class="bi bi-question-circle-fill"></i></label>
                    <div class="col-sm-9">
                        <div class="form-group">
                            <input type="text" id="rfc" formControlName="rfc" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="cuenta" class="col-sm-3 col-form-label">Número de cuenta*:</label>
                    <div class="col-sm-9">
                        <div class="form-group">
                            <input type="text" formControlName="numeroDeCuenta" id="cuenta" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <app-catalogo-select 
                            [catalogo]="paisDondeRadica" 
                            [label]="'País donde radica'"
                            [required]="true" 
                            name="pais"
                            formControlName="pais"
                            (change)="paisDondeRadicaSeleccion()" >
                        </app-catalogo-select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <app-catalogo-select 
                            [catalogo]="institucion" 
                            [label]="'Institución'"
                            [required]="true" 
                            formControlName="institucion"
                            name="institucions"  
                            (change)="institucionSeleccion()" >
                        </app-catalogo-select>
                    </div>
                </div>


                <div class="row mb-3">
                    <div class="col-md-12">
                        <app-catalogo-select 
                            [catalogo]="estado" 
                            [label]="'Estado'"
                            [required]="true" 
                            formControlName="estado"
                            name="estado"  
                            (change)="estadoSeleccion()" >
                        </app-catalogo-select>
                    </div>
                </div>


                <div class="mb-3 row">
                    <label for="sucursal" class="col-sm-3 col-form-label">Sucursal*:</label>
                    <div class="col-sm-9">
                        <div class="form-group">
                            <input type="text" formControlName="sucursal" id="sucursal" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label for="plaza" class="col-sm-3 col-form-label">Número de plaza*:</label>
                    <div class="col-sm-9">
                        <div class="form-group">
                            <input type="text" formControlName="numeroDePlaza" id="plaza" class="form-control">
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div class="row mb-3">
        <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-primary me-2">Guardar</button>
            <button type="button" class="btn btn-default">Cancelar</button>
        </div>
    </div>
</div>
