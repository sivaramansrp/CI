<div class="container">
  <form [formGroup]="tramiteForm" (ngSubmit)="validarDestinatarioFormulario()" class="row mt-5">
    <div class="col-md-12">
      <ng-container formGroupName="exencionImpuestos">
        <div class="alert alert-info">
          <label style="font-weight: normal">
            <input type="checkbox" formControlName="manifesto" id="manifesto" (change)="setValoresStore(exencionImpuestos, 'manifesto', 'setManifesto')" />
            *Manifiesto bajo protesta de decir verdad que el donante de la mercancía es extranjero
          </label>
        </div>
        <div class="row mt-5">
          <div class="col-md-8">
            <app-catalogo-select [catalogo]="aduana" [label]="'Aduana por la que ingresará la mercancía'" formControlName="aduana" [required]="true" (change)="aduanaSeleccion()" name="aduana"></app-catalogo-select>
          </div>
          <div class="col-md-4" style="margin-top: 35px">
            <lib-input-check [id]="'organismoPublico'" [label]="'Organismo público'" [required]="true" formControlName="organismoPublico" (change)="organismoPublico()"></lib-input-check>
          </div>
        </div>

        <ng-titulo titulo="Mercancía" />
        <div class="row">
          <div class="col-md-8">
            <div class="form-group">
              <app-catalogo-select [catalogo]="destinoMercancia" [label]="'Fin al cual se destinará la mercancía'" formControlName="destinoMercancia" [required]="true" (change)="destinoMercanciaSeleccion()" name="aduana"></app-catalogo-select>
            </div>
          </div>
          <div class="table-container mt-5">
            <ng-table [commonTableHeader]="mercanciaHeaderData" [commonTableBody]="mercanciaBodyData"></ng-table>
          </div>
          <div class="col-md-12 mt-5 d-flex justify-content-end">
            <button type="button" class="btn btn-default">Modificar</button>
            <button type="button" class="btn btn-default ms-3">Eliminar</button>
            <button type="button" class="btn btn-primary ms-3" data-bs-toggle="modal" data-bs-target="#modalAgregarMercancias" (click)="abrirDialogoMercancias()">Agregar</button>
          </div>
        </div>
      </ng-container>
      <ng-titulo titulo="Datos del donante extrajero" />
        <ng-container formGroupName="importadorExportador">
          <div class="row">
            <div class="col-md-4">
              <label>Nombre*:</label>
              <input type="text" required="true" class="form-control" id="nombre" formControlName="nombre" (change)="setValoresStore(importadorExportador, 'nombre', 'setNombre')" />
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-md-4">
              <app-catalogo-select
              [catalogo]="pais"
              [label]="'País'"
              [required]="true"
              formControlName="pais"
              (change)="paisSeleccion()"
              name="pais"
            ></app-catalogo-select>
            </div>
            <div class="col-md-4">
              <label>Código postal*:</label>
              <input type="number" required="true" class="form-control" id="codigoPostal" formControlName="codigoPostal" (change)="setValoresStore(importadorExportador, 'codigoPostal', 'setCodigoPostal')" />
            </div>
            <div class="col-md-4">
              <label>Estado*:</label>
              <input type="number" required="true" class="form-control" id="estado" formControlName="estado" (change)="setValoresStore(importadorExportador, 'estado', 'setEstado')" />
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-md-4">
              <label>Calle*:</label>
              <input type="text" required="true" class="form-control" maxlength="100" id="calle" formControlName="calle" (change)="setValoresStore(importadorExportador, 'calle', 'setCalle')" />
            </div>
            <div class="col-md-4">
              <label>Número exterior*:</label>
              <input type="number" required="true" maxlength="55" class="form-control" id="numeroExterior" formControlName="numeroExterior"  (change)="setValoresStore(importadorExportador, 'numeroExterior', 'setNumeroExterior')" />
            </div>
            <div class="col-md-4">
              <label>Número interior:</label>
              <input type="number" class="form-control" maxlength="55" id="numeroInterior" formControlName="numeroInterior"  (change)="setValoresStore(importadorExportador, 'numeroInterior', 'setNumeroInterior')" />
            </div>
          </div>
          <div class="row mt-3 mb-3">
            <div class="col-md-4">
              <label>Colonia*:</label>
              <input type="number" required="true" class="form-control" id="colonia" formControlName="colonia"  (change)="setValoresStore(importadorExportador, 'colonia', 'setColonia')" />
            </div>
            <div class="col-md-4">
              <label>Correo electrónico:</label>
              <input type="email" class="form-control" maxlength="50" id="correoElectronico" formControlName="correoElectronico" (change)="setValoresStore(importadorExportador, 'correoElectronico', 'setCorreoElectronico')" />
            </div>
            <div class="col-md-4">
              <label>Teléfono:</label>
              <input type="number" class="form-control" id="telefono" formControlName="telefono" maxlength="30" (change)="setValoresStore(importadorExportador, 'telefono', 'setTelefono')" />
            </div>
          </div>
          <div class="row mt-5">
            <label required="true">Señale si la mercancía formará parte del patrimonio de su representada*:</label>
            <app-input-radio [radioOptions]="radioOpcions" [selectedValue]="valorSeleccionado" (valueChange)="cambiarRadio($event)" id="opcion" formControlName="opcion" (change)="setValoresStore(importadorExportador, 'opcion', 'setOpcion')"></app-input-radio>
          </div>
        </ng-container>
    </div>
  </form>
</div>

<div class="modal fade" id="modalAgregarMercancias" tabindex="-1" aria-labelledby="modalAgregarMercanciasLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <form [formGroup]="agregarMercanciasForm">
          <ng-titulo titulo="Datos de la mercancía"></ng-titulo>
          <ng-container formGroupName="datosMercancia">
            <div class="row">
              <div class="col-md-8">
                <label for="tipoDeMercancia">Tipo de mercancía</label>
                <span class="require">*</span>
                <input type="text" class="form-control" formControlName="tipoDeMercancia" id="tipoDeMercancia" maxlength="12" [required]="true" (change)="setValoresStore(exencionImpuestos, 'datosMercancia.tipoDeMercancia', 'setTipoDeMercancia')" />
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-md-8">
                <label for="usoEspecifico">Uso especifico de la mercancía</label>
                <span class="require">*</span>
                <input type="text" class="form-control" formControlName="usoEspecifico" id="usoEspecifico" maxlength="12" [required]="true" (change)="setValoresStore(exencionImpuestos, 'datosMercancia.usoEspecifico', 'setUsoEspecifico')" />
              </div>
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="condicionMercancia" [label]="'Condición de la mercancía'" [required]="true" formControlName="condicionMercancia" (change)="condicionMercanciaSeleccion()" name="condicionMercancia"></app-catalogo-select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-8">
                <label for="cantidadComercial">Cantidad</label>
                <span class="require">*</span>
                <input type="text" class="form-control" formControlName="cantidad" id="cantidad" maxlength="12" [required]="true" (change)="setValoresStore(exencionImpuestos, 'datosMercancia.cantidad', 'setCantidad')" />
              </div>
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="unidadMedida" [label]="'Unidad de medida'" [required]="true" name="unidadMedida" formControlName="unidadMedida" (change)="unidadMedidaSeleccion()"></app-catalogo-select>
              </div>
            </div>
            <div class="row mt-3">
              <div class="col-md-4">
                <lib-input-check [id]="'vehiculo'" [label]="'Vehículo'" [required]="true" formControlName="vehiculo" (change)="vehiculo()"></lib-input-check>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <label for="marca">Marca:</label>
                <input type="text" class="form-control" formControlName="marca" id="marca" maxlength="100" (change)="setValoresStore(exencionImpuestos, 'datosMercancia.marca', 'setMarca')" />
              </div>
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="ano" [label]="'Año'" name="ano" formControlName="ano" [required]="true" (change)="anoSeleccion()"></app-catalogo-select>
              </div>
              <div class="col-md-4">
                <label for="modelo">Modelo:</label>
                <input type="text" class="form-control" formControlName="modelo" id="modelo" maxlength="50" (change)="setValoresStore(exencionImpuestos, 'datosMercancia.modelo', 'setModelo')" />
              </div>
            </div>
            <div class="row">
              <div class="col-md-8">
                <label for="serie">Número de serie:</label>
                <input type="text" class="form-control" formControlName="serie" id="serie" size="50" maxlength="25" (change)="setValoresStore(exencionImpuestos, 'datosMercancia.serie', 'setSerie')" />
              </div>
            </div>
          </ng-container>
        </form>
      </div>
      <div class="row">
        <div class="col-md-12 mt-5 d-flex justify-content-end">
          <div class="modal-footer custom-footer">
            <button type="button" class="btn btn-primary">Limpiar</button>
            <button type="button" class="btn btn-default" data-bs-dismiss="modal" #closeModal>Cancelar</button>
            <button type="button" class="btn btn-primary" (click)="agregarConfirmarModal()">Agregar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="confirmarModal" aria-labelledby="confirmarModalLabel" class="modal fade" tabindex="-1" role="dialog" aria-hidden="true" #confirmarModal>
  <div class="modal-dialog" role="document">
    <div class="modal-content modalsm">
      <div class="modal-body">
        <label>La mercancía fue <br />agregada correctamente.</label>
      </div>
      <div class="modal-footer" style="justify-content: center">
        <button type="button" class="btn btn-primary" (click)="agregarMercancias()" data-bs-dismiss="modal" #closeConfirmarModal>Aceptar</button>
      </div>
    </div>
  </div>
</div>
