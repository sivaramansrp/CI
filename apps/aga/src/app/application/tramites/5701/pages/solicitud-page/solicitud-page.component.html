<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h1 *ngIf="!cargarArchivosEvento.observed">Solicitud servicios extraordinarios</h1>
        <h1 *ngIf="cargarArchivosEvento.observed && this.indice === 2">Cargar Archivos</h1>
        <h1 *ngIf="cargarArchivosEvento.observed && this.indice === 3">Firmar</h1>
      </div>
    </div>

    <div class="row mt-5" *ngIf="indice === 2">
      <div class="col-md-12">
        <lib-notificaciones
          [notificacionInput]="alertaNotificacion"
        ></lib-notificaciones>
      </div>
    </div>
    <app-wizard [listaPasos]="pasos" id="wizard5701"></app-wizard>
    <div class="row">
      <div class="col-md-12">
        @switch (indice) { @case (1) {
        <paso-uno (validFrmPadreEsValido)="onFormularioPadreValido($event)"></paso-uno>
        } @case (2) {
        <paso-dos
          [cargaArchivosEvento]="cargarArchivosEvento"
          [regresarSeccionCargarDocumentoEvento]="
            regresarSeccionCargarDocumentoEvento
          "
          (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
          (reenviarCargaRealizada)="cargaRealizada($event)"
        ></paso-dos>
        } @case (3) {
        <paso-tres></paso-tres>
        } }
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        @if (indice !== 2) {
        <btn-continuar
          [datos]="datosPasos"
          (continuarEvento)="getValorIndice($event)"
          [ocultabotonAnterior]="true"
        ></btn-continuar>
        } @else {
        <div class="mt-5 mb-3 d-flex justify-content-end">
          <button
            type="button"
            class="btn btn-default"
            (click)="anterior()"
            *ngIf="seccionCargarDocumentos"
          >
            Anterior
          </button>

          <button
            class="btn btn-primary ms-3"
            (click)="
              onClickCargaArchivos() 
            "
            [disabled]="!regresarSeccionCargarDocumentoEvento "
            *ngIf="seccionCargarDocumentos"
          >
            Cargar archivos
          </button>

          <button
            type="button"
            class="btn btn-default ms-3"
            (click)="anteriorSeccionCargarDocumento()"
            *ngIf="!seccionCargarDocumentos"
          >
            Anterior
          </button>   

          <button
            class="btn btn-primary ms-3"
            (click)="
              siguiente()
            "
            
          >
          Continuar
          </button>
        </div>
        }
      </div>
    </div>
  </div>
</div>

@if(nuevaNotificacion) {
<section>
  <lib-notificaciones [notificacionInput]="nuevaNotificacion">
  </lib-notificaciones>
</section>
}
