<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h1>Solicitud servicios extraordinarios</h1>
      </div>
    </div>

    <app-wizard [listaPasos]="pasos"></app-wizard>

    <div class="row">
      <div class="col-md-12">
        @switch (indice) {
        @case (1) {
        <paso-uno></paso-uno>
        }
        @case (2) {
        <paso-dos [cargaArchivosEvento]="cargarArchivosEvento"
          [regresarSeccionCargarDocumentoEvento]="regresarSeccionCargarDocumentoEvento"
          (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
          (reenviarCargaRealizada)="cargaRealizada($event)"></paso-dos>
        }
        @case (3) {
        <paso-tres></paso-tres>
        }
        }
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        @if (indice !== 2) {
        <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
        } @else {
        <div class="mt-5 mb-3 d-flex justify-content-end">
          <button type="button" class="btn btn-default" (click)="anterior()" *ngIf="seccionCargarDocumentos">
            Anterior
          </button>

          <button type="button" class="btn btn-default ms-3" (click)="anteriorSeccionCargarDocumento()"
            *ngIf="!seccionCargarDocumentos">
            Anterior
          </button>

          <button class="btn btn-primary ms-3" (click)="seccionCargarDocumentos ? onClickCargaArchivos() : siguiente()"
            [disabled]="!activarBotonCargaArchivos && seccionCargarDocumentos">
            {{ seccionCargarDocumentos ? 'Cargar archivos' : 'Continuar' }}
          </button>
        </div>
        }
      </div>
    </div>
  </div>
</div>
