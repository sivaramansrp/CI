<div class="row">

  <div class="col-md-12" *ngIf="!cargaRealizada">
    <lib-notificaciones [notificacionInput]="alertaNotificacion"></lib-notificaciones>
  </div>

  <div class="col-md-12">
    <anexar-documentos [catalogoDocumentos]='catalogoDocumentos'
      [catalogoDocumentosOpcionales]="catalogoDocumentosOpcionales" (cargaRealizada)="documentosCargados($event)"
      [cargaArchivosEvento]="reenviarEvento" [regresarSeccionCargarDocumentoEvento]="reenviarRegresarSeccion"
      (activarBotonCargaArchivos)="manejarEventoCargaDocumento($event)"></anexar-documentos>
  </div>
</div>
