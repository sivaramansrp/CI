<div class="row">
  <div class="col-md-4 form-group">
    <label class="form-label" for="gafeteRespoDespacho">Gafete:</label>
    <input class="form-control" id="gafeteRespoDespacho" [formControl]="gafeteRespoDespacho" placeholder="" type="text"
      [ngClass]="gafeteIsValid ? 'required' : ''" libUppercase>
  </div>
  <div class="col-md-4 d-flex align-items-end">
    <div class="btn-group">
      <button class="btn btn-default" type="button" (click)="buscarGafete()">Buscar</button>
      <button class="btn btn-primary ms-2" type="button" (click)="agregarPersona()">Agregar</button>
    </div>
  </div>
</div>

<form action="" [formGroup]="personaForm">
  <div class="row mt-5">
    <div class="col-md-4 form-group">
      <label class="form-label" for="nombreRespoDespacho">Nombre(s):</label>
      <input class="form-control" id="nombreRespoDespacho" placeholder="" type="text" formControlName="nombreRespoDespacho"
        [ngClass]="isValid('nombreRespoDespacho') ? 'required' : ''">
    </div>
    <div class="col-md-4 form-group">
      <label class="form-label" for="paternoRespoDespacho">Apellido paterno:</label>
      <input class="form-control" id="paternoRespoDespacho" placeholder="" type="text" formControlName="paternoRespoDespacho"
        [ngClass]="isValid('paternoRespoDespacho') ? 'required' : ''">
    </div>
    <div class="col-md-4 form-group">
      <label class="form-label" for="maternoRespoDespacho">Apellido materno:</label>
      <input class="form-control" id="maternoRespoDespacho" placeholder="" type="text" formControlName="maternoRespoDespacho"
        [ngClass]="isValid('maternoRespoDespacho') ? 'required' : ''">
    </div>
  </div>
</form>

<div class="row mt-5">
  <div class="col-md-12">
    <table class="table table-responsive">
      <thead>
        <tr>
          <th>Gafete</th>
          <th>Nombre</th>
          <th>Apellido paterno</th>
          <th>Apellido materno</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>
        @for (persona of personas; let i = $index; track i) {
        <tr>
          <td>{{persona.gafeteRespoDespacho}}</td>
          <td>{{persona.nombre}}</td>
          <td>{{persona.primerApellido}}</td>
          <td>{{persona.segundoApellido}}</td>
          <td>
            <button type="button" class="btn btn-link" title="Eliminar" (click)="eliminar(i)">
              <i class="bi bi-trash3 bi-c"></i>
            </button>
          </td>
        </tr>
        }
      </tbody>

    </table>
  </div>
</div>

<!-- Modal error -->
<div class="modal" [ngClass]="modal" id="modalError" #modalError tabindex="-1" aria-labelledby="modalErrorLabel"
  aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">{{ tituloModal }}</h4>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-12">
            <p>{{ mensajeModal }}</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" (click)="cerrarModal()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>
