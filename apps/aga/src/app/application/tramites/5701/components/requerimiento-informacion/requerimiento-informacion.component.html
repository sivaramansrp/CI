<div class="container">
    <div class="row padding-top">
        <form [formGroup]="formRequerimiento">
            <div class="row">
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="catTipoRequerimiento" formControlName="tipoRequerimiento" [label]="'Tipo requerimiento'"
                  [required]="true" name="tipoRequerimiento" (change)="tipoRequerimientoSeleccionado()"></app-catalogo-select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12">
                <label for="justificacionRequerimiento" class="form-label">Justificación requerimiento :</label>
                <textarea id="justificacionRequerimiento" class="form-control mb-4" placeholder="" formControlName="justificacionRequerimiento"></textarea>
              </div>
            </div>
        </form>
    </div>
</div>
