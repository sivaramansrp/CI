<div class="container">
    <!---FORM 1--->
    <formularios-de-certi-registro [formargrupo]="form" [formularioDatos]="mercancia" [menúDesplegableDatos]="listaDeOficinasDeAduanas"></formularios-de-certi-registro>
  
    <div class="row">
        <ng-titulo titulo="Mercancias" />
        <app-tabla-dinamica  [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX" [configuracionTabla]="configuracionTabla" [datos]="detallesDelProducto" (listaDeFilaSeleccionada)="listaDeFilaSeleccionada($event)"></app-tabla-dinamica>
    </div>
  
    <div class="row">
        <div class="col-md-6"></div>
        <div class="col-md-6"> 
            <div class="btn-group d-flex align-items-rigth">
            <button type="button" class="btn btn-default ms-2"  >Modificar</button>
            <button type="button" class="btn btn-default ms-2" >Eliminar</button>
            <button type="button" class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#modalAgregarProductos" (click)="abrirModal()">
                Agregar
            </button>
            
            </div>
        </div>
    </div>
  <!---FORM 2--->
  <formularios-de-certi-registro [formularioTítulo]="'Datos del donante'" [formargrupo]="formDatosDelDonante" [formularioDatos]="datosDelDonante"></formularios-de-certi-registro>
<!---FORM 3--->
  <formularios-de-certi-registro [formularioTítulo]="'Domicilio fiscal'" [formargrupo]="formDomicilioFiscal" [formularioDatos]="domicilioFiscal"></formularios-de-certi-registro>
  
  </div>
  
  <div class="modal fade" id="modalAgregarProductos" tabindex="-1" aria-labelledby="modalAgregarProductosLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div style="padding: 1rem;">
          <ng-titulo titulo="Datos de la mercancia" />
        </div>
        <div class="modal-body">
          <ng-alert [CONTENIDO]="DATOS_ALERT"></ng-alert>
          <!---FORM 4--->
          <formularios-de-certi-registro [formargrupo]="formAgregarProductos" [formularioDatos]="productos"></formularios-de-certi-registro>
        </div>
        <div class="modal-footer custom-footer">
          <button type="button" class="btn btn-default" data-bs-dismiss="modal" #closeModal>Cerrar</button>
          <button type="button" class="btn btn-primary" (click)="agregarAgente()" data-bs-toggle="modal" data-bs-target="#modalConfirmación">Agregar</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal fade" id="modalConfirmación" tabindex="-1" aria-labelledby="modalConfirmaciónLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
        </div>
        <div class="modal-body">
          <p>La mercancía fue agregada correctamente</p>
          <div class="modal-footer custom-footer">
            <button type="button" class="btn btn-default" data-bs-dismiss="modal" #closeModal>Acceptar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
