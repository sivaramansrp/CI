<div class="container">
    <!---FORM 1--->
    <formularios-de-certi-registro [formargrupo]="form" [formularioDatos]="mercancia" [menuDesplegableDatos]="listaDeOficinasDeAduanas" (emitirValorCambiado)="setValoresStore($event)" [soloLectura]="soloLectura"></formularios-de-certi-registro>
  
    <div class="row">
        <ng-titulo titulo="Mercancías" />
        <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX" [configuracionTabla]="configuracionTabla" [datos]="detallesDelProducto" [disableSeleccionTablaCheckBox]="soloLectura" (listaDeFilaSeleccionada)="valorDeAlternancia($event)"></app-tabla-dinamica>
    </div>
  
    <div class="row">
        <div class="col-md-6"></div>
        <div class="col-md-6"> 
            <div class="btn-group d-flex align-items-rigth">
            <button type="button" class="btn btn-default ms-2" [disabled]="soloLectura" data-bs-toggle="modal" data-bs-target="#modalModificarProductos" (click)="modificarModal()">Modificar</button>
            <button type="button" class="btn btn-default ms-2" [disabled]="soloLectura" (click)="eliminarProducto()">Eliminar</button>
            <button type="button" class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#modalAgregarProductos" (click)="abrirModal()" [disabled]="soloLectura">
                Agregar
            </button>
            
            </div>
        </div>
    </div>
  <!---FORM 2--->
  <formularios-de-certi-registro [formularioTitulo]="'Datos del donante'" [formargrupo]="formDatosDelDonante" [menuDesplegableDatos]="[]" [formularioDatos]="datosDelDonante" (emitirValorCambiado)="setValoresStore($event)" [readonly]="soloLectura"></formularios-de-certi-registro>
<!---FORM 3--->
  <formularios-de-certi-registro [formularioTitulo]="'Domicilio fiscal'" [formargrupo]="formDomicilioFiscal" [menuDesplegableDatos]="[]" [formularioDatos]="domicilioFiscal" (emitirValorCambiado)="setValoresStore($event)" [readonly]="soloLectura"></formularios-de-certi-registro>
  
  </div>
  
  <div class="modal fade" id="modalAgregarProductos" tabindex="-1" aria-labelledby="modalAgregarProductosLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div style="padding: 1rem;">
          <ng-titulo titulo="Datos de la mercancía" />
        </div>
        <div class="modal-body">
          <ng-alert [CONTENIDO]="DATOS_ALERT"></ng-alert>
          <!---FORM 4--->
          <formularios-de-certi-registro [formargrupo]="formAgregarProductos" [menuDesplegableDatos]="[]" [formularioDatos]="productos" (emitirValorCambiado)="setValoresStore($event)" [readonly]="soloLectura"></formularios-de-certi-registro>
        </div>
        <div class="modal-footer custom-footer">
          <button type="button" class="btn btn-default" data-bs-dismiss="modal" #closeModal [disabled]="soloLectura">Cerrar</button>
          <button type="button" class="btn btn-primary" (click)="agregarProductos()" [disabled]="soloLectura">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalModificarProductos" tabindex="-1" aria-labelledby="modalModificarProductosLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
        <div style="padding: 1rem;">
          <ng-titulo titulo="Datos de la mercancía" />
        </div>
        <div class="modal-body">
          <ng-alert [CONTENIDO]="DATOS_ALERT"></ng-alert>
          <!---FORM 4--->
          <formularios-de-certi-registro [formargrupo]="formAgregarProductos" [menuDesplegableDatos]="[]" [formularioDatos]="productos" (emitirValorCambiado)="setValoresStore($event)" [soloLectura]="soloLectura"></formularios-de-certi-registro>
        </div>
        <div class="modal-footer custom-footer">
          <button type="button" class="btn btn-default" data-bs-dismiss="modal" #closeModal [disabled]="soloLectura">Cerrar</button>
          <button type="button" class="btn btn-primary" (click)="modificarProductos()" [disabled]="soloLectura">Agregar</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="modal fade" id="modalConfirmacion" tabindex="-1" aria-labelledby="modalConfirmacionLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
        </div>
        <div class="modal-body">
          <p>La mercancía fue agregada correctamente</p>
          <div class="modal-footer custom-footer">
            <button type="button" class="btn btn-default" data-bs-dismiss="modal" #closeModal [disabled]="esFormularioSoloLectura">Acceptar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
