,<div class="container">

  <div class="row table-responsive">
    <div class="col-md-12">
      <ng-titulo titulo="Choferes nacionales"></ng-titulo>
      <h5>Alta de choferes:</h5>

      <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionTabla" [configuracionTabla]="ConfiguracionColumna"
        [datos]="datosDelChoferNacionalAlta" (listaDeFilaSeleccionada)="onChofereNationalSelected($event)">
      </app-tabla-dinamica>

    </div>
  </div>

  <div class="row mt-3">
    <div class="col-md-12 text-end">
      <div class="btn-group">
        <button class="btn btn-default" type="button" (click)="editSelectedRow(agregarModalDialog)"
          [disabled]="datosConsulta?.readonly">
          Modificar
        </button>

        <button class="btn btn-default" type="button" [disabled]="datosConsulta?.readonly"
          (click)="deleteSelectedRow()">
          Eliminar
        </button>
        <button class="btn btn-primary ms-2" (click)="addNewRow(agregarModalDialog)"
          [disabled]="datosConsulta?.readonly">
          Agregar
        </button>
      </div>
    </div>
      <ng-template #datosDeChoferesModal>
      <div  id="datosDeChoferesModal" >
            <app-choferes-datos 
            [datosDeChofere]="datosChofere" 
            #datosDeChoferesModal
            [readonly]="datosConsulta?.readonly"
            (addModalEvent)="addModal($event)"
            (cancelEvent)="cancelModal()"></app-choferes-datos>

      </div>
      </ng-template>
  </div>
