<div>
    <h5>Baja de unidades de arrastre</h5>
    <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionTabla" [configuracionTabla]="columnasUnidad"
        [datos]="unidadesArrastre" (listaDeFilaSeleccionada)="onUnidadRowSelected($event)">
    </app-tabla-dinamica>
    <div class="row mt-3">
        <div class="col-md-12 text-end">
            <div class="btn-group">
                <button class="btn btn-default" type="button" (click)="deleteUnidadRow()"
                    [disabled]="isReadonly || unidadesArrastreSelected.length === 0">
                    Eliminar
                </button>
                <button class="btn btn-primary ms-2" type="button" (click)="showUnidadDialog = true" [disabled]="isReadonly">
                    Buscar
                </button>
            </div>
        </div>
    </div>
    <ng-container *ngIf="showUnidadDialog">
      <div class="modal-backdrop fade show"></div>
      <div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,0.5);">
        <app-unidad-dialog
          [unidad]="unidadDialogData"
          [readonly]="isReadonly"
          [tipoDeUnidadCatalogo]="tipoDeUnidadCatalogo"
          [paisEmisorCatalogo]="paisEmisorCatalogo"
          [anoCatalogo]="anoCatalogo"
          [tipoArrastre]="tipoArrastre"
          (save)="onUnidadDialogSave($event)"
          (cancel)="showUnidadDialog = false">
        </app-unidad-dialog>
      </div>
    </ng-container>
</div>
