<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        <h1>Solicitud de certificación en materia de IVA e IEPS modalidad A</h1>
      </div>
      <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-pantalla-datos></app-pantalla-datos>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
      }}
      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
    </div>
  </div>
</div>
