<ng-titulo titulo="Persona física"></ng-titulo>
<label for="Persona física extranjero">Persona física extranjera:</label>
<div class="row mt-5">
  <div class="col-md-12">
    <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX" [configuracionTabla]="configuracionParaPFEEncabezadoDeTabla" [datos]="personaFisicaExtranjeraTabla"></app-tabla-dinamica>
  </div>
</div>
<div class="row">
  <div class="col-md-12">
    <div class="pull-right">
      <button type="button" name="ModificarPFE" class="btn btn-default"> Modificar </button>
      <button type="button" name="EliminarPFE" class="btn btn-danger ms-2"> Eliminar </button>
      <button type="button" name="AgregarPFE" class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#modalAgregarPFE"> Agregar </button>
    </div>
  </div>
</div>
<div class="modal fade" id="modalAgregarPFE" tabindex="-1" aria-labelledby="modalAgregarPFELabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <div id="dialogoPersonaFisicaExtranjera">
          <form [formGroup]="personaFisicaExtranjeraForm" id="formPFE" name="formPFE">
            <ng-titulo titulo="Persona física extranjera"></ng-titulo>
            <div class="row">
              <div class="col-md-4">
                <label class="form-label" for="nombrePFE">Nombre(s)*:</label>
                <input type="text" class="form-control" size="40" id="nombrePFE" maxlength="200" formControlName="nombrePFE" (change)="setValoresStore(personaFisicaExtranjeraForm,'nombrePFE', 'setNombrePFE')">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="apellidoPaterno">Primer apellido*:</label>
                <input type="text" class="form-control" size="40" id="apellidoPaternoPFE" maxlength="200" formControlName="apellidoPaternoPFE" (change)="setValoresStore(personaFisicaExtranjeraForm,'apellidoPaternoPFE', 'setApellidoPaternoPFE')">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="apellidoMaterno">Segundo apellido:</label>
                <input type="text" class="form-control" name="apellidoMaternoPFE" formControlName="apellidoMaternoPFE" id="apellidoMaternoPFE" maxlength="200" (change)="setValoresStore(personaFisicaExtranjeraForm,'apellidoMaternoPFE', 'setApellidoMaternoPFE')">
              </div>
            </div>
            <div class="row">
              <div class="col-md-8">
                <label class="form-label" for="seguroNumero">Número del seguro social*: <span class="bi bi-question-circle-fill" title="{{ TEXTOS.CORREO_TITULO_TOOLTIP }}" data-bs-toggle="tooltip"></span>
                </label>
                <input type="text" class="form-control" size="40" id="nssPFE" maxlength="11" formControlName="seguroNumero" (change)="setValoresStore(personaFisicaExtranjeraForm,'seguroNumero', 'setSeguroNumero')">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="correoPFE">Correo electrónico*: </label>
                <input type="text" class="form-control" name="correoPFE" formControlName="correoPFE" maxlength="320" id="correoPFE" (change)="setValoresStore(personaFisicaExtranjeraForm,'correoPFE', 'setCorreoPFE')">
              </div>
            </div>
            <!-- Domicilios -->
            <ng-titulo titulo="Domicilio fiscal"></ng-titulo>
            <div class="row">
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="pais" [id]="'paisPFE'" formControlName="paisPFE" [label]="'País'" name="cvePais" (change)="paisSeleccion()" [required]="true"></app-catalogo-select>
              </div>
              <div class="col-md-4 pt-7">
                <label for="codigoPostal">Código postal*:</label>
                <input type="text" class="form-control" name="codigoPostalPFE" id="codigoPostalPFE" formControlName="codigoPostalPFE" maxlength="12" (change)="setValoresStore(personaFisicaExtranjeraForm,'codigoPostalPFE', 'setCodigoPostalPFE')">
              </div>
              <div class="col-md-4 pt-7">
                <label for="estado">Estado*:</label>
                <input type="text" class="form-control" name="estadoPFE" id="entidadFederativaPFE" formControlName="estadoPFE" maxlength="200" (change)="setValoresStore(personaFisicaExtranjeraForm,'estadoPFE', 'setEstadoPFE')">
              </div>
            </div>
            <div class="row pt-7">
              <div class="col-md-4">
                <label for="ciudad">Ciudad*:</label>
                <input type="text" class="form-control" name="ciudadPFE" id="ciudadPFE" formControlName="ciudadPFE" maxlength="120" (change)="setValoresStore(personaFisicaExtranjeraForm,'ciudadPFE', 'setCiudadPFE')">
              </div>
              <div class="col-md-8">
                <label for="calle">Calle*:</label>
                <input type="text" class="form-control" name="callePFE" id="callePFE" formControlName="callePFE" maxlength="100" (change)="setValoresStore(personaFisicaExtranjeraForm,'callePFE', 'setCallePFE')">
              </div>
            </div>
            <div class="row pt-7">
              <div class="col-md-4">
                <label for="numeroExterior">Número exterior*:</label>
                <input type="text" class="form-control" name="numeroExteriorPFE" id="numeroExteriorPFE" formControlName="numeroExteriorPFE" maxlength="55" (change)="setValoresStore(personaFisicaExtranjeraForm,'numeroExteriorPFE', 'setNumeroExteriorPFE')">
              </div>
              <div class="col-md-4">
                <label for="numeroInterior">Número interior:</label>
                <input type="text" class="form-control" name="numeroInteriorPFE" id="numeroInteriorPFE" formControlName="numeroInteriorPFE" maxlength="55" (change)="setValoresStore(personaFisicaExtranjeraForm,'numeroInteriorPFE', 'setNumeroInteriorPFE')">
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="modal-footer custom-footer mt-4">
        <div class="row">
          <div class="col-md-8 text-muted">
            <p>* Campos obligatorios</p>
          </div>
          <div class="col-md-4 d-flex justify-content-end">
            <button type="button" class="btn btn-primary" id="limpiarPFE" name="limpiar" (click)="limpiarDatosPFE()">Limpiar</button>
            <button type="button" class="btn btn-default mx-2" id="cancelarPFE" name="cancelar" data-bs-dismiss="modal" #closeModal>Cancelar</button>
            <button type="button" class="btn btn-primary" id="guardarPFE" name="guardar" (click)="agregarPFE(personaFisicaExtranjeraForm.getRawValue())">Agregar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
