<ng-titulo titulo="Persona moral"></ng-titulo>
<label for="Persona moral extranjero">Persona moral extranjera:</label>
<div class="row mt-5">
  <div class="col-md-12">
    <app-tabla-dinamica [configuracionTabla]="configuracionParaPMEEncabezadoDeTabla" [datos]="personaMoralExtranjeraTabla"></app-tabla-dinamica>
  </div>
</div>
<div class="row">
  <div class="col-md-12">
    <div class="pull-right">
      <button type="button" name="ModificarPME" class="btn btn-default"> Modificar </button>
      <button type="button" name="EliminarPME" class="btn btn-danger ms-2"> Eliminar </button>
      <button type="button" name="AgregarPME" class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#modalAgregarPME"> Agregar </button>
    </div>
  </div>
</div>
<div class="modal fade" id="modalAgregarPME" tabindex="-1" aria-labelledby="modalAgregarPMELabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <div id="dialogoPersonaMoralExtranjera">
          <form [formGroup]="personaMoralExtranjeraForm" id="formPME" name="formPME">
            <ng-titulo titulo="Persona moral extranjera"></ng-titulo>
            <div class="row">
              <div class="col-md-8">
                <label class="form-label" for="denominacionPME">Nombre, denominación o razón social*:</label>
                <input type="text" class="form-control" name="denominacionPME" formControlName="denominacionPME" maxlength="254" id="denominacionPME" (change)="setValoresStore(personaMoralExtranjeraForm,'denominacionPME', 'setDenominacionPME')">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="correoPME">Correo electrónico*: <span class="bi bi-question-circle-fill" title="{{ TEXTOS.CORREO_TITULO_TOOLTIP }}" data-bs-toggle="tooltip"></span>
                </label>
                <input type="text" class="form-control" name="correoPME" formControlName="correoPME" maxlength="320" id="correoPME" (change)="setValoresStore(personaMoralExtranjeraForm,'correoPME', 'setCorreoPME')">
              </div>
            </div>
            <!-- Domicilios -->
            <ng-titulo titulo="Domicilio fiscal"></ng-titulo>
            <div class="row">
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="pais" [id]="'paisPME'" formControlName="paisPME" [label]="'País'" name="paisPME" (change)="paisSeleccion()" [required]="true"></app-catalogo-select>
              </div>
              <div class="col-md-4 pt-7">
                <label for="codigoPostal">Código postal*:</label>
                <input type="text" class="form-control" name="codigoPostalPME" id="codigoPostalPME" formControlName="codigoPostalPME" maxlength="12" (change)="setValoresStore(personaMoralExtranjeraForm,'codigoPostalPME', 'setCodigoPostalPME')">
              </div>
              <div class="col-md-4 pt-7">
                <label for="ciudad">Ciudad*:</label>
                <input type="text" class="form-control" name="ciudadPME" id="ciudadPME" formControlName="ciudadPME" maxlength="120" (change)="setValoresStore(personaMoralExtranjeraForm,'ciudadPME', 'setCiudadPME')">
              </div>
            </div>
            <div class="row pt-7">
              <div class="col-md-4">
                <label for="estado">Estado*:</label>
                <input type="text" class="form-control" name="estadoPME" id="entidadFederativaPME" formControlName="estadoPME" maxlength="200" (change)="setValoresStore(personaMoralExtranjeraForm,'estadoPME', 'setEstadoPME')">
              </div>
              <div class="col-md-8">
                <label for="calle">Calle*:</label>
                <input type="text" class="form-control" name="callePME" id="callePME" formControlName="callePME" maxlength="100" (change)="setValoresStore(personaMoralExtranjeraForm,'callePME', 'setCallePME')">
              </div>
            </div>
            <div class="row pt-7">
              <div class="col-md-4">
                <label for="numeroExterior">Número exterior*:</label>
                <input type="text" class="form-control" name="numeroExteriorPME" id="numeroExteriorPME" formControlName="numeroExteriorPME" maxlength="55" (change)="setValoresStore(personaMoralExtranjeraForm,'numeroExteriorPME', 'setNumeroExteriorPME')">
              </div>
              <div class="col-md-4">
                <label for="numeroInterior">Número interior:</label>
                <input type="text" class="form-control" name="numeroInteriorPME" id="numeroInteriorPME" formControlName="numeroInteriorPME" maxlength="55" (change)="setValoresStore(personaMoralExtranjeraForm,'numeroInteriorPME', 'setNumeroInteriorPME')">
              </div>
            </div>
            <!--Nombre del director general-->
            <ng-titulo titulo="Nombre del director general"></ng-titulo>
            <div class="row">
              <div class="col-md-4">
                <label for="nombre">Nombre(s)*:</label>
                <input type="text" class="form-control" name="nombreDG" id="nombreDG" formControlName="nombreDG" maxlength="28" (change)="setValoresStore(personaMoralExtranjeraForm,'nombreDG', 'setNombreDG')">
              </div>
              <div class="col-md-4">
                <label for="apellidoPaterno">Primer apellido*:</label>
                <input type="text" class="form-control" name="apellidoPaternoDG" id="apellidoPaternoDG" formControlName="apellidoPaternoDG" maxlength="20" (change)="setValoresStore(personaMoralExtranjeraForm,'apellidoPaternoDG', 'setApellidoPaternoDG')">
              </div>
              <div class="col-md-4">
                <label for="apellidoMaterno">Segundo apellido:</label>
                <input type="text" class="form-control" name="apellidoMaternoDG" id="apellidoMaternoDG" formControlName="apellidoMaternoDG" maxlength="20" (change)="setValoresStore(personaMoralExtranjeraForm,'apellidoMaternoDG', 'setApellidoMaternoDG')">
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="modal-footer custom-footer mt-4">
        <div class="row">
          <div class="col-md-8 text-muted">
            <p>* Campos obligatorios</p>
          </div>
          <div class="col-md-4 d-flex justify-content-end">
            <button type="button" class="btn btn-primary" id="limpiarPME" name="limpiar" (click)="limpiarDatosPME()">Limpiar</button>
            <button type="button" class="btn btn-default mx-2" id="cancelarPME" name="cancelar" data-bs-dismiss="modal" #closeModal>Cancelar</button>
            <button type="button" class="btn btn-primary" id="guardarPME" name="guardar" (click)="agregarPME(personaMoralExtranjeraForm.getRawValue())">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
