<div class="page">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h2>Desistir Solicitud de Información Histórica </h2>
        </div>
        <app-wizard [listaPasos]="pasosSolicitar"></app-wizard>
      </div>
  
      <div class="row">
        @switch(indice){ @case(1){
        <app-paso-uno></app-paso-uno>
        }@case(2){
          <app-paso-tres></app-paso-tres>
        }
        }
        <btn-continuar
          [datos]="datosPasos"
          (continuarEvento)="getValorIndice($event)"
        ></btn-continuar>
        <ng-alert [CONTENIDO]="alert_message" [CUSTOMECLASS]="'alert-info'"></ng-alert>
      </div>
    </div>
  </div>
