<div class="container">
    <ng-titulo [titulo]="'Datos de la mercancía que se importará al país temporalmente'"></ng-titulo>
    <form [formGroup]="importacionTemporaldeMercancias">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="marca" class="form-label">Marca *</label>
                    <input id="marca" formControlName="marca" type="text" class="form-control" (change)="onImportacionTemporaldeMercanciasChange('marca')" />
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="modelo" class="form-label">Modelo *</label>
                    <input id="modelo" formControlName="modelo" type="text" class="form-control" (change)="onImportacionTemporaldeMercanciasChange('modelo')" />
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label for="numeroDeSerie" class="form-label">Número de serie *</label>
                    <input id="numeroDeSerie" formControlName="numeroDeSerie" type="text" class="form-control" (change)="onImportacionTemporaldeMercanciasChange('numeroDeSerie')" />
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label for="numeroDeMotor" class="form-label">Número de motor *</label>
                    <input id="numeroDeMotor" formControlName="numeroDeMotor" type="text" class="form-control" (change)="onImportacionTemporaldeMercanciasChange('numeroDeMotor')" />
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <div class="form-group">
                    <label for="descripcionAdicionalDeLaMercancia" class="form-label">Descripción adicional de la mercancía:</label>
                    <textarea id="descripcionAdicionalDeLaMercancia" formControlName="descripcionAdicionalDeLaMercancia" type="text" class="form-control" (change)="onImportacionTemporaldeMercanciasChange('descripcionAdicionalDeLaMercancia')"></textarea>
                </div>
            </div>
            <div class="col-md-12">
                <div class="form-group">
                    <label for="motivooJustificacionDeLaImportacionTemporal" class="form-label">Motivo o justificación de la importación temporal *:</label>
                    <textarea id="motivooJustificacionDeLaImportacionTemporal" formControlName="motivooJustificacionDeLaImportacionTemporal" type="text" class="form-control" (change)="onImportacionTemporaldeMercanciasChange('motivooJustificacionDeLaImportacionTemporal')"></textarea>
                </div>
            </div>
        </div>
    </form>
</div>
