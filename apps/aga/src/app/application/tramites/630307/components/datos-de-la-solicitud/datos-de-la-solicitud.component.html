<div class="container">
    <ng-titulo [titulo]="'Datos de la Solicitud'"></ng-titulo>
    <form [formGroup]="datosImportacionTemporalFormulario">
        <div class="row mt-4">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="aduanaDeingresOpciones" [label]="'Aduana de ingreso'" [required]="true"
                    formControlName="cveAduana" (change)="setValorStore(datosImportacionTemporalFormulario,'cveAduana')"></app-catalogo-select>
                <input type="hidden" id="hidAduana" formControlName="cveAduana" />
            </div>
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="seccionAduaneraOpciones" [label]="'Sección aduanera'"
                    [required]="false" formControlName="cveSeccionAduanal" (change)="setValorStore(datosImportacionTemporalFormulario,'cveSeccionAduanal')"></app-catalogo-select>
                <input type="hidden" id="hidSeccionAduanal" formControlName="cveSeccionAduanal" />
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <input-fecha [setFecha]="datosImportacionTemporalFormulario.get('fechaLimiteRetorno')?.value"
                    [datos]="datosfecha" (valorCambiado)="cambioFechaFinal($event)"></input-fecha>
            </div>
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="prorrogaOpciones" [label]="'Cuenta con prórroga'" [required]="true"
                    formControlName="cuentaProrroga" (change)="onChangeTipoImportacionRetorno()" ></app-catalogo-select>
                <input type="hidden" id="hidMostrarSeccionRetorno" formControlName="cuentaProrroga" />
            </div>
        </div>
    </form>
</div>
<div>
    <div *ngIf="showRetornoProrroga">
        <app-datos-retorno-prorroga></app-datos-retorno-prorroga>
    </div>
    <app-datos-retorno-autorizacion></app-datos-retorno-autorizacion>
    <app-datos-mercancia-importacion-temporal></app-datos-mercancia-importacion-temporal>
</div>
