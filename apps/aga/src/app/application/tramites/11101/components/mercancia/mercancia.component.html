<div class="conatiner">
    <div class="container1">
        <ng-titulo titulo="Descripción de la mercancia" />
        <form [formGroup]="mercanciaForm">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label" for="estado">Estado*:</label>
                    <input type="text" class="form-control" id="estado" formControlName="estado" />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="cantidad">Cantidad*:</label>
                    <input type="number" class="form-control" id="cantidad" formControlName="cantidad" />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="forma-parta-de-patrimonia">Forma parte de su patrimonio*:</label>
                    <input type="text" class="form-control" id="forma-parta-de-patrimonia"
                        formControlName="formapartadepatrimonia" />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="descripcion">Descripcion*:</label>
                    <textarea type="text" class="form-control" id="descripcion" formControlName="descripcion" ></textarea>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="valor">Valor*:</label>
                    <input type="text" class="form-control" id="valor" formControlName="valor" />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="unida-de-medida">Unidad de medida*:</label>
                    <input type="text" class="form-control" id="unida-de-medida" formControlName="unidadmedida"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="fraccion-arancelaria">Fracción arancelaria*:</label>
                    <input type="number" class="form-control" id="fraccion-arancelaria"
                        formControlName="fraccionarancelaria" />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="nico">Nico*:</label>
                    <input type="text" class="form-control" id="nico" formControlName="nico" />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="marca">Marca*:</label>
                    <input type="text" class="form-control" id="marca" formControlName="marca" />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="modelo">Modelo*:</label>
                    <input type="text" class="form-control" id="modelo" formControlName="modelo" />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="numero-de-serie">Numero de serie*:</label>
                    <input type="text" class="form-control" id="numero-de-serie" formControlName="numerodeserie"/>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="moneda">Moneda*:</label>
                    <input type="text" class="form-control" id="moneda" formControlName="moneda"/>
                </div>
            </div>
        </form>
    </div>
    <div class="container2">
        <ng-titulo titulo="Fines a que se destinará la mercancía" />
        <form [formGroup]="mercanciaForm">
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label" for="fin">Fin*:</label>
                    <input type="text" class="form-control" id="fin" formControlName="fin" />
                </div>
                <div class="col-md-9">
                    <label class="form-label" for="especifique">Especifique*:</label>
                    <textarea class="form-control" id="especifique" formControlName="especifique"></textarea>
                </div>
            </div>
        </form>
    </div>
    <div class="container3 mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="pull-right">
                    <button type="button" name="Limpiar" class="btn btn-default"> Limpiar </button>
                    <button type="button" name="Agregar" class="btn btn-primary ms-2"> Agregar </button>
                    <button type="button" name="Eliminar" class="btn btn-danger ms-2"> Eliminar </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-12" >
            <app-tabla-dinamica [tipoSeleccionTabla]="tablaSeleccion.CHECKBOX" [configuracionTabla]="configuracionParaPFEEncabezadoDeTabla"
                [datos]="discripccionDeLaMercanciaForm"></app-tabla-dinamica>
        </div>
    </div>
</div>
