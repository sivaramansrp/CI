<div class="conatiner">
    <div class="container1">
        <ng-titulo titulo="Datos del Donatario Extranjero" />
        <form [formGroup]="mercanciaForm">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label" for="estado">numero de registro:</label>
                    <input type="text" class="form-control" id="estado" formControlName="estado" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="cantidad">numero de registro:</label>
                    <input type="number" class="form-control" id="cantidad" formControlName="cantidad" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="forma-parta-de-patrimonia">numero de registro:</label>
                    <input type="text" class="form-control" id="forma-parta-de-patrimonia"
                        formControlName="formapartadepatrimonia" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="descripcion">numero de registro:</label>
                    <input type="text" class="form-control" id="descripcion" formControlName="descripcion" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="valor">numero de registro:</label>
                    <input type="text" class="form-control" id="valor" formControlName="valor" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="unida-de-medida">numero de registro:</label>
                    <input type="text" class="form-control" id="unida-de-medida" formControlName="unidadmedida"
                        readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="fraccion-arancelaria">numero de registro:</label>
                    <input type="number" class="form-control" id="fraccion-arancelaria"
                        formControlName="fraccionarancelaria" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="nico">numero de registro:</label>
                    <input type="text" class="form-control" id="nico" formControlName="nico" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="marca">numero de registro:</label>
                    <input type="text" class="form-control" id="marca" formControlName="marca" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="modelo">numero de registro:</label>
                    <input type="text" class="form-control" id="modelo" formControlName="modelo" readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="numero-de-serie">numero de registro:</label>
                    <input type="text" class="form-control" id="numero-de-serie" formControlName="numerodeserie"
                        readonly />
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="moneda">numero de registro:</label>
                    <input type="text" class="form-control" id="moneda" formControlName="moneda" readonly />
                </div>
            </div>
        </form>
    </div>
    <div class="container2">
        <ng-titulo titulo="fines a que se  destinara " />
        <form [formGroup]="mercanciaForm">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label" for="fin">FIN* :</label>
                    <input type="text" class="form-control" id="fin" formControlName="fin" readonly />
                </div>
                <div class="col-md-8">
                    <label for="especifique">Especifique</label>
                    <input id="especifique" type="text" class="form-control" formControlName="especifique" readonly />
                </div>
            </div>
        </form>
    </div>
</div>
