<form [formGroup]="solicitudForm" (ngSubmit)="validarDestinatarioFormulario()">
  <div class="row mt-5">
    <label>Desistir Solicitud de Servicios Extraordinarios</label>
  </div>
  <div class="row mt-5">
    <label>Folio VUCEM</label>
    <input type="text" class="form-control gris-color" size="26" maxlength="25" readonly />
  </div>
  <div class="row mt-5">
    <div class="col-md-4">
      <label>*Motivo del Desistimiento</label>
      <div *ngIf="solicitudForm.get('motivoDelDes')?.invalid && solicitudForm.get('motivoDelDes')?.touched"
        class="text-danger">
        Este campo es obligatorio
      </div>
      <input type="text" formControlName="motivoDelDes" class="large-input form-control" maxlength="450"
        (change)=" setValoresStore( solicitudForm, 'motivoDelDes', 'setMotivoDelDes' ) " />
    </div>
  </div>
</form>
<ng-container *ngIf="number === 2">
  <btn-continuar [datos]="datosPasos" (click)="emitirEventoClick()"></btn-continuar>
</ng-container>
