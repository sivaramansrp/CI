<div class="page">
  <div class="container">
    <div class="row mt-5">
      <div class="col-md-12">
        <h2 *ngIf="indice === 1">Aviso Renovación y/u Homologación</h2>
      </div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno (indiceNombre)="alEventoHijo($event)"></app-paso-uno>
      } @case (2) {
        <app-paso-tres></app-paso-tres>
      }
      }
   <ng-container *ngIf="indice === 1">
        <btn-continuar *ngIf="nombre !== 3" [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"
        ></btn-continuar></ng-container>
    <ng-container *ngIf="indice === 2">
        <btn-continuar *ngIf="nombre !== 3" [datos]="datosIndice" (continuarEvento)="getValorIndice($event)"
        ></btn-continuar>
    </ng-container>
   
    </div>
  </div>
  @if (nuevaNotificacion ) { <section *ngIf="nuevaNotificacion">
    <lib-notificaciones [notificacionInput]="nuevaNotificacion"
      (confirmacionModal)="eliminarPedimento($event)"></lib-notificaciones>
  </section> }
</div>
