<ng-titulo titulo="Programa de fomento a la exportación" />

<form [formGroup]="fomentoExportacionForm">
    <div class="row">
        <div class="col-md-10">
            <app-catalogo-select [catalogo]="configuracionesDropdown[0].catalogos" formControlName="tipoPrograma"
                [label]="'Tipo de programa/Autorización'" [required]="true"
                name="Tipo de programa/Autorización"></app-catalogo-select>
        </div>
        <div class="col-md-6">
            <app-catalogo-select [catalogo]="configuracionesDropdown[1].catalogos" formControlName="folioAutorizacion"
                [label]="'Folio del programa/Autorización'" [required]="true"
                name="Folio del programa/Autorización"></app-catalogo-select>
        </div>
    </div>
</form>

<ng-titulo titulo="Datos de la planta para realizar los procesos de ensamble y fabricación" />

<div class="row mb-3">
    <div class="col-md-12">
        <ng-table [commonTableHeader]="establecimientoHeaderData"
            [commonTableBody]="establecimientoBodyData"></ng-table>
        <nav aria-label="Page navigation example">
            <ul class="pagination d-flex justify-content-center">
                <li class="page-item"><a class="page-link">1</a></li>
            </ul>
        </nav>
    </div>
</div>

<div class=" text-end mt-5">
    <button class="btn btn-primary  me-2">Agregar</button>
    <button class="btn btn-default me-2">Modificar</button>
    <button class="btn btn-primary">Eliminar</button>
</div>

<div class="modal" tabindex="-1" [ngClass]="{'show': mostrarAlerta}"
    [ngStyle]="{'display': mostrarAlerta ? 'block' : 'none'}">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 350px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" aria-label="Close" (click)="cerrarModal()"></button>
            </div>
            <div class="modal-body">
                <p>{{ mensajeDeAlerta }}</p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" (click)="cerrarModal()">Aceptar</button>
            </div>
        </div>
    </div>
</div>
