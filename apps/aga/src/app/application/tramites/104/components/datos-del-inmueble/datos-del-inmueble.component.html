<ng-titulo titulo="Programa de fomento a la exportación" />

<form [formGroup]="fomentoExportacionForm">
    <div class="row">
        <div class="col-md-10">
            <app-catalogo-select [catalogo]="configuracionesDropdown[0].catalogos" formControlName="tipoPrograma"
                [label]="'Tipo de programa/Autorización'" [required]="true"
                name="Tipo de programa/Autorización" [isDisabled]="consultaState.readonly"></app-catalogo-select>
        </div>
        <div class="col-md-6">
            <app-catalogo-select [catalogo]="catalogoFolioAutorizacion" formControlName="folioAutorizacion"
                [label]="'Folio del programa/Autorización'" [required]="true"
                name="Folio del programa/Autorización" [isDisabled]="consultaState.readonly"></app-catalogo-select>
        </div>
    </div>
</form>

<ng-titulo titulo="Datos de la planta para realizar los procesos de ensamble y fabricación*" />

<div class="row mb-3">
    <div class="panel-group ficha-collapse" id="accordion">
        <div class="panel panel-default">
            <div class="panel-heading" (click)="mostrarColapsable()" (keyup.enter)="mostrarColapsable()" tabindex="0">
                <label for="plantas">Plantas</label>
                <button type="button" class="collapse-arrow" [class.collapsed-arrow]="colapsable" (keydown)="mostrarColapsable()"></button>
            </div>
            @if(colapsable){
            <div class="panel-collapse collapse in" id="panel-01">
                <ng-table [commonTableHeader]="establecimientoHeaderData" [commonTableBody]="establecimientoBodyData" [disableSeleccionTablaCheckBox]="consultaState.readonly"></ng-table>
                <div class="d-flex justify-content-center">
                    <app-table-pagination [totalItems]="totalItems" [itemsPerPage]="itemsPerPage" [currentPage]="currentPage"
                        (pageChange)="onPageChange($event)" (itemsPerPageChange)="onItemsPerPageChange($event)">
                    </app-table-pagination>
                </div>
            </div>
            }
        </div>
    </div>
</div>

<div class=" text-end mt-5">
    <button class="btn btn-primary  me-2" data-bs-toggle="modal" data-bs-target="#modalAgregar"  [disabled]="consultaState.readonly">Agregar</button>
    <button class="btn btn-default me-2"  [disabled]="consultaState.readonly">Modificar</button>
    <button class="btn btn-primary"  [disabled]="consultaState.readonly">Eliminar</button>
</div>

<div class="modal" tabindex="-1" [ngClass]="{'show': mostrarAlerta}"
    [ngStyle]="{'display': mostrarAlerta ? 'block' : 'none'}">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 350px;">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" aria-label="Close" (click)="cerrarModal()"></button>
            </div>
            <div class="modal-body">
                <p>{{ mensajeDeAlerta }}</p>
            </div>
            <div class="modal-footer justify-content-center">
                <button type="button" class="btn btn-primary" (click)="cerrarModal()">Aceptar</button>
            </div>
        </div>
    </div>
</div>
<div class="container mt-4">
    <div class="modal fade" id="modalAgregar" tabindex="-1" aria-labelledby="modalAgregarLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Datos de la planta para realizar los procesos de ensamble y fabricación</h4>
                </div>
                <div class="modal-body">
                    <form [formGroup]="formularioDireccion">

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="calleInput" class="form-label">Calle*:</label>
                                    <input type="text" class="form-control" id="calleInput" formControlName="calle"
                                        placeholder="Ingrese Calle" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="numeroExteriorInput" class="form-label">Número Exterior*:</label>
                                    <input type="text" class="form-control" id="numeroExteriorInput"
                                        formControlName="numeroExterior" placeholder="Ingrese Número Exterior" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="numeroInteriorInput" class="form-label">Número Interior:</label>
                                    <input type="text" class="form-control" id="numeroInteriorInput"
                                        formControlName="numeroInterior"
                                        placeholder="Ingrese Número Interior (Opcional)" />
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <app-catalogo-select [catalogo]="configuracionesFormularioDropdown[0].catalogos"
                                        formControlName="pais" [label]="'País'" [required]="true"  [isDisabled]="consultaState.readonly">
                                    </app-catalogo-select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <app-catalogo-select [catalogo]="configuracionesFormularioDropdown[1].catalogos"
                                        formControlName="entidadFederativa" [label]="'Entidad Federativa'"
                                        [required]="true"  [isDisabled]="consultaState.readonly">
                                    </app-catalogo-select>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <app-catalogo-select [catalogo]="configuracionesFormularioDropdown[2].catalogos"
                                        formControlName="municipioDelegacion" [label]="'Municipio o Delegación'"
                                        [required]="true"  [isDisabled]="consultaState.readonly">
                                    </app-catalogo-select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <app-catalogo-select [catalogo]="configuracionesFormularioDropdown[3].catalogos"
                                        formControlName="colonia" [label]="'Colonia'" [isDisabled]="consultaState.readonly">
                                    </app-catalogo-select>
                                </div>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <app-catalogo-select [catalogo]="configuracionesFormularioDropdown[4].catalogos"
                                        formControlName="localidad" [label]="'Localidad'" [isDisabled]="consultaState.readonly">
                                    </app-catalogo-select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="codigoPostalInput" class="form-label">Código Postal*:</label>
                                    <input type="text" class="form-control" id="codigoPostalInput"
                                        formControlName="codigoPostal" placeholder="Ingrese Código Postal" />
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer custom-footer justify-content-end">
                    <button type="button" class="btn btn-primary"  [disabled]="consultaState.readonly">Agregar</button>
                    <button type="button" class="btn btn-default btn-space"  [disabled]="consultaState.readonly">Limpiar</button>
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal"  [disabled]="consultaState.readonly" #closeModal>
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
