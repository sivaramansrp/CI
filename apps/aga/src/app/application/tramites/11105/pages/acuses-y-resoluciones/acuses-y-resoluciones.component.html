<div class="container">
  <div class="container1">
    <ng-titulo titulo="Acuses y resoluciones" />
    <form [formGroup]="acusesYResolucionesFormGroup">
      <div class="row">
        <div class="col-md-6">
          <label class="form-label" for="rfc"
            >RFC:<span
              class="bi bi-question-circle-fill fs-4 m-1"
              title="Title"
              ata-bs-toggle="tooltip"
            ></span>
          </label>
          <input
            type="text"
            class="form-control"
            id="rfc"
            formControlName="rfc"
            readonly
          />
        </div>

        <div class="col-md-6">
          <label class="form-label" for="denominacion"
            >Feach inicio tr&aacute;mite:</label
          >
          <input
            type="text"
            class="form-control"
            id="denominacion"
            formControlName="denominacion"
            readonly
          />
        </div>

        <div class="col-md-12">
          <label class="form-label" for="actividad-economica"
            >Dependencia:</label
          >
          <input
            type="text"
            class="form-control"
            id="actividad-economica"
            formControlName="actividadEconomica"
            readonly
          />
        </div>

        <div class="col-md-12">
          <label class="form-label" for="correo-electronico"
            >Unidad administrativa o representación federal:</label
          >
          <input
            type="text"
            class="form-control"
            id="correo-electronico"
            formControlName="correoElectronico"
            readonly
          />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="correo-electronico"
            >Tipo de solicitud:</label
          >
          <input
            type="text"
            class="form-control"
            id="correo-electronico"
            formControlName="correoElectronico"
            readonly
          />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="correo-electronico"
            >Estatus de la solicitud:</label
          >
          <input
            type="text"
            class="form-control"
            id="correo-electronico"
            formControlName="correoElectronico"
            readonly
          />
        </div>

        <div class="col-md-6">
          <label class="form-label" for="correo-electronico"
            >Días hábiles transcurridos:</label
          >
          <input
            type="text"
            class="form-control"
            id="correo-electronico"
            formControlName="correoElectronico"
            readonly
          />
        </div>
      </div>
    </form>
  </div>
</div>
