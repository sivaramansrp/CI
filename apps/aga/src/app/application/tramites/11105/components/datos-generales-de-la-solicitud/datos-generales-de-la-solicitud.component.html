<div class="container">
  <form
    [formGroup]="tramiteForm"
    (ngSubmit)="validarDestinatarioFormulario()"
    class="row mt-5"
  >
    <div class="col-md-12">
      <ng-container formGroupName="retiradaDeDonaciones">
        <label>Datos Requeridos*:</label>
        <div class="alert alert-info">
          <label style="font-weight: normal">
            <input
              type="checkbox"
              style="margin-left: -245px"
              formControlName="manifesto"
              id="manifesto"
            />
            *Manifesto bajo protesta de decir verdad que el donante de la
            mercancía es extranjero
          </label>
        </div>
        <div class="row mt-5">
          <div class="col-md-8">
            <app-catalogo-select
              [catalogo]="aduana.catalogos"
              [label]="aduana.labelNombre"
              [placeholder]="aduana.primerOpcion"
              [required]="true"
              id="aduana"
              formControlName="aduana"
              [isDisabled]="true"
            >
            </app-catalogo-select>
          </div>
        </div>

        <ng-titulo titulo="Mercancías" />
        <div class="row mt-5">
          <div class="col-md-8">
            <app-catalogo-select
              [catalogo]="propositoDeLaMercancia.catalogos"
              [label]="propositoDeLaMercancia.labelNombre"
              [placeholder]="propositoDeLaMercancia.primerOpcion"
              [required]="true"
              id="aduana"
              formControlName="aduana"
              [isDisabled]="true"
            >
            </app-catalogo-select>
          </div>
        </div>
      </ng-container>
      <div class="row">
        <ng-titulo titulo="Mercancías" />
        <app-tabla-dinamica
          [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
          [configuracionTabla]="configuracionTabla"
          [datos]="configuracionTablaDatos"
        ></app-tabla-dinamica>
      </div>
      <div class="col-md-12 mt-5 d-flex justify-content-end">
        <button
          type="button"
          class="btn btn-primary ms-3"
          (click)="nextTabla()"
        >
          Agregar
        </button>
      </div>

      <ng-titulo titulo="Datos del donante extrajero" />
      <ng-container formGroupName="retiradaDeDonaciones">
        <div class="row">
          <div class="col-md-8">
            <label>Nombre*:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              id="nombre"
              formControlName="nombre"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'nombre') ? 'required' : ''
              "
            />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-8">
            <label>Calle*:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              maxlength="100"
              id="calle"
              formControlName="calle"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'calle') ? 'required' : ''
              "
            />
          </div>
          <div class="col-md-4">
            <label>Número exterior*:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              id="numeroExterior"
              formControlName="numeroExterior"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'numeroExterior')
                  ? 'required'
                  : ''
              "
            />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-4">
            <label>Número interior:</label>
            <input
              type="text"
              class="form-control"
              id="numeroInterior"
              formControlName="numeroInterior"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'numeroInterior')
                  ? 'required'
                  : ''
              "
            />
          </div>

          <div class="col-md-4">
            <label>Teléfono:</label>
            <input
              type="text"
              class="form-control"
              id="telefono"
              formControlName="telefono"
              maxlength="30"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'telefono') ? 'required' : ''
              "
            />
          </div>
          <div class="col-md-4">
            <label>Correo electrónico:</label>
            <input
              type="text"
              class="form-control"
              id="correoElectronico"
              formControlName="correoElectronico"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'correoElectronico')
                  ? 'required'
                  : ''
              "
            />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-4">
            <label>País:</label>
            <input
              type="text"
              class="form-control"
              id="pais"
              formControlName="pais"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'pais') ? 'required' : ''
              "
            />
          </div>
          <div class="col-md-4">
            <label>Código postal*:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              id="codigoPostal"
              formControlName="codigoPostal"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'codigoPostal') ? 'required' : ''
              "
            />
          </div>
          <div class="col-md-4">
            <label>Estado*:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              id="estado"
              formControlName="estado"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'estado') ? 'required' : ''
              "
            />
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-4">
            <label>Colonia*:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              id="colonia"
              formControlName="colonia"
              [ngClass]="
                isValid(retiradaDeDonaciones, 'colonia') ? 'required' : ''
              "
            />
          </div>
        </div>

        <div class="row mt-5">
          <label required="true"
            >Señale si la mercancía formará parte del patrimonio de su
            representada*:</label
          >
          <app-input-radio
            [radioOptions]="radioOpcions"
            [selectedValue]="valorSeleccionado"
            (valueChange)="cambiarRadio($event)"
            id="opcion"
            formControlName="opcion"
          >
          </app-input-radio>
        </div>

        <div class="row" style="margin-top: 30px; margin-bottom: 30px">
          <div class="form-group">
            <div class="col-md-12">
              <div
                class="pull-left text-muted text-vertical-align-button"
              ></div>
              <div class="pull-right row">
                <div class="col-md-5" id="botonGuardar">
                  <button
                    type="submit"
                    class="btn btn-primary"
                    (click)="continuar()"
                  >
                    Continuar
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </form>
</div>
