<form [formGroup]="formulario">
    <div class="container">
        <div class="row mb-3">
            <div class="col-md-6">
                <app-catalogo-select [catalogo]="aduanas" [label]="'Aduana'" [required]="true" formControlName="aduana">
                </app-catalogo-select>
            </div>
            <div class="col-md-6">
                <app-catalogo-select [catalogo]="seccionAduanera" [label]="'Sección Aduanera'" [required]="true"
                    formControlName="seccionAduanera">
                </app-catalogo-select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <app-catalogo-select [catalogo]="tipoOperacion" [label]="'Tipo de operación'" [required]="true"
                    formControlName="tipoOperacion" (change)="alCambiarTipoOperacion()">
                </app-catalogo-select>
            </div>
            <div class="col-md-6" *ngIf="mostrarFechaOperacion">
                <label for="fechaOperacion" class="form-label">Fecha de operación</label>
                <input class="form-control" type="date" id="fechaOperacion" formControlName="fechaOperacion" />
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label" for="motivoDespachoDomicilio">Motivo o justificación de despacho a
                    domicilio</label>
                <textarea class="form-control h-25" id="motivoDespachoDomicilio" rows="3"
                    formControlName="motivoDespachoDomicilio" id="motivoDespachoDomicilio" placeholder=""
                    title="motivoDespachoDomicilio"></textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="observaciones">Observaciones</label>
                <textarea class="form-control h-25" id="observaciones" rows="3" formControlName="observaciones"
                    id="observaciones" placeholder="" title="observaciones"></textarea>
            </div>
        </div>
    </div>
</form>
<ng-titulo titulo="Datos de la mercancía" />

<form [formGroup]="formularioMercancia">
    <div class="container">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="valorMercancia" class="form-label">Valor de la mercancía</label>
                <input class="form-control" type="text" id="valorMercancia" formControlName="valorMercancia" />
            </div>
            <div class="col-md-6">
                <app-catalogo-select [catalogo]="tipoMoneda" [label]="'Tipo de moneda'" [required]="true" formControlName="tipoMoneda">
                </app-catalogo-select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label" for="motivoDespachoDomicilio">Nombre o descripción comercial de la mercancía</label>
                <textarea class="form-control h-25" id="descripcionMercancia" rows="3"
                    formControlName="descripcionMercancia" id="descripcionMercancia" placeholder=""
                    title="descripcionMercancia"></textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="observaciones">Descripción detallada y/o especificaciones técnicas de la
                    mercancía</label>
                <textarea class="form-control h-25" id="especificacionesMercancia" rows="3" formControlName="especificacionesMercancia"
                 placeholder="" title="observaciones"></textarea>
            </div>
        </div>
    </div>
</form>

<ng-titulo titulo="Logística de las operaciones" />

<form [formGroup]="formularioLogistica">
    <div class="container">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label" for="esquemasControlSeguridad
                ">Señale los esquemas de control y seguridad de las operaciones</label>
                <textarea class="form-control h-25" id="esquemasControlSeguridad" rows="3"
                    formControlName="esquemasControlSeguridad" placeholder=""
                    title="esquemasControlSeguridad"></textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="distanciaRutaTiempos">Indique distancia, ruta y tiempos de las operaciones</label>
                <textarea class="form-control h-25" id="distanciaRutaTiempos" rows="3" formControlName="distanciaRutaTiempos"
                 placeholder="" title="distanciaRutaTiempos"></textarea>
            </div>
        </div>
    </div>
</form>

<ng-titulo titulo="Lugar en que se encuentra la mercancía en el domicilio del solicitante"/>
<form [formGroup]="formularioUbicacionMercancia">
    <div class="container">
        <div class="row mb-3">
            <div class="col-md-12">
                <label for="direccion" class="form-label">Dirección</label>
                <input class="form-control" type="text" id="direccion" formControlName="direccion" />
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-12">
                <label for="telefono" class="form-label">Teléfono</label>
                <input class="form-control" type="text" id="telefono" formControlName="telefono" />
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-12">
                <label for="distanciaAduana" class="form-label">Distancia a la aduana (km)</label>
                <input class="form-control" type="text" id="distanciaAduana" formControlName="distanciaAduana" />
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-12">
                <label for="referencias" class="form-label">Referencias</label>
                <input class="form-control" type="text" id="referencias" formControlName="referencias" />
            </div>
        </div>
    </div>
</form>
