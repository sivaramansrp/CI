<div class="container">

        <div class="col-auto d-flex align-items-center">
            <input type="checkbox" id="manifesto" class="me-2" />
        </div>
        <div class="col-md-6">
            <input type="text" id="certificacionEmpresa" class="form-control" />
        </div>
    </div>
    <div class="row">
        <div class="col-auto d-flex align-items-center">
            <label for="otraCertificacion">Especifique otra certificación:</label>
        </div>
        <div class="col-md-6">
            <input type="text" id="otraCertificacion" class="form-control" />
        </div>
    </div>
</div>
