<div class="container">
  <ng-titulo titulo="Datos generales del solicitante" />
  <form [formGroup]="solicitudForm">
    @if (this.consultaDatos.consultaioSolicitante) {
    <div class="row mb-5">
      <div class="col-md-4">
        <label class="form-label" for="folioDelTramite">Folio del trámite:</label>
        <input type="text" class="form-control" id="folioDelTramite" formControlName="folioDelTramite" readonly>
      </div>
    
      <div class="col-md-4">
        <label class="form-label" for="fechaDeInicio">Fecha de inicio:</label>
        <input type="text" class="form-control" id="fechaDeInicio" formControlName="fechaDeInicio" readonly>
      </div>
    
      <div class="col-md-4">
        <label class="form-label" for="estadoDelTramite">Estado del trámite:</label>
        <input type="text" class="form-control" id="estadoDelTramite" formControlName="estadoDelTramite" readonly>
      </div>
    
    </div>
    }
    <div class="row">

      <div class="col-md-4">
        <label class="form-label" for="rfc">RFC:<span class="bi bi-question-circle-fill fs-4 m-1" title="Title"
            ata-bs-toggle="tooltip"></span>
        </label>
        <input type="text" class="form-control" id="rfc" formControlName="rfc" readonly>
      </div>

      <div class="col-md-8">
        <label class="form-label" for="denominacion">Denominación o razón social:</label>
        <input type="text" class="form-control" id="denominacion" formControlName="denominacion" readonly>
      </div>

      <div class="col-md-12">
        <label class="form-label" for="actividad-economica">Actividad económica preponderante:</label>
        <input type="text" class="form-control" id="actividad-economica" formControlName="actividadEconomica" readonly>
      </div>

      <div class="col-md-4">
        <label class="form-label" for="correo-electronico">Correo electrónico:</label>
        <input type="text" class="form-control" id="correo-electronico" formControlName="correoElectronico" readonly>
      </div>
    </div>
  </form>
  <div class="row" style="margin-top: 30px;margin-bottom: 30px;">
    <div class="form-group">
      <div class="col-md-12">
        <div class="pull-left text-muted text-vertical-align-button" id="lblCamposObligatorios">
          * Campos obligatorios
        </div>
        <div class="pull-right row">
          <div class="col-md-5" id="botonGuardar">
            <button type="submit" class="btn btn-primary" (click)="continuar()">
              Continuar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
