<form [formGroup]="solicitudForm" id="formSolicitud">
    <div id="tabs">
        <div id="adjuntarArchivo" *ngIf="showAdjuntarArchivo">
            <!-- <app-adjuntar-archivo></app-adjuntar-archivo> -->
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <h3>
                <label for="solicitud">Ingresar por:</label>
            </h3>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <br><br>
            <div class="col-md-4">
                <div class="radio">
                    <label>
                        <input type="radio" formControlName="tipoBusqueda" id="idRadioContenedor"
                            (change)="mostrarCampos()" value="Contenedor" class="form-check-input">
                        Contenedor
                    </label>
                </div>
            </div>

            <div class="col-md-4">
                <div class="radio">
                    <label>
                        <input type="radio" formControlName="tipoBusqueda" id="idRadioManifiesto"
                            (change)="mostrarCampos()" value="No. de Manifiesto" class="form-check-input">
                        No. de Manifiesto
                    </label>
                </div>
            </div>

            <div class="col-md-4">
                <div class="radio">
                    <label>
                        <input type="radio" formControlName="tipoBusqueda" id="idRedioExcel" (change)="mostrarCampos()"
                            value="Archivo CSV" class="form-check-input">
                        Archivo CSV
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="seccionAduanaaFecha" *ngIf="showSeccionAduanaaFecha">
        <div class="row">
            <div class="col-md-12">
                <h3>Datos generales</h3>
                <hr class="red">
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="aduanas">Aduana/sección aduanera</label>
                    <span class="require">*</span>
                    <select formControlName="aduana" id="aduana" class="form-control">
                        <option value="" disabled selected>Selecciona un valor</option>
                        <option *ngFor="let aduana of aduanas" [value]="aduana.clave">
                            {{ aduana.descripcion }}
                        </option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="form-group datepicker-group">
                    <label for="fechaIngreso">Fecha de ingreso</label>
                    <span class="require">*</span>
                    <span class="glyphicon glyphicon-calendar" aria-hidden="true"></span>
                    <input type="text" formControlName="fechaIngreso" id="fechaIngreso" class="form-control"
                        [readonly]="true" (blur)="quitarErrorInput('#fechaIngreso')" placeholder="dd/MM/yyyy">
                </div>
            </div>
        </div>
        <br><br>
    </div>

    <div id="seccionContenedor" *ngIf="showSeccionContenedor">
        <div class="row">
            <div class="col-md-12">
                <h3>Datos del equipo</h3>
                <hr class="red">
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="inicialesContenedor">Iniciales del equipo</label>
                    <span class="require">*</span>
                    <input type="text" formControlName="inicialesContenedor" id="inicialesContenedor" maxlength="10"
                        class="form-control">
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label for="numeroContenedor">Número de equipo</label>
                    <span class="require">*</span>
                    <input type="text" formControlName="numeroContenedor" id="numeroContenedor" maxlength="15"
                        class="form-control">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="digitoDeControl">Dígito verificador</label>
                    <input type="text" formControlName="digitoDeControl" id="digitoDeControl" maxlength="1"
                        class="form-control">
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label for="contenedores">Tipo de equipo</label>
                    <span class="require">*</span>
                    <select formControlName="contenedores" id="contenedores" class="form-control">
                        <option value="" disabled selected>Selecciona un valor</option>
                        <option *ngFor="let contenedor of contenedores" [value]="contenedor.clave">
                            {{ contenedor.descripcion }}
                        </option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="form-group pull-right">
                    <button type="button" class="btn btn-default" (click)="limpiarCampos()">Limpiar</button>
                    <button type="button" class="btn btn-primary" (click)="validarDigitoVerificador()">Agregar</button>
                </div>
            </div>
        </div>
    </div>  

    <br>
    <div id="mensaje" class="alert alert-warning" style="margin-top: 1em;" *ngIf="mostrarMensaje">
        <p>Debes seleccionar al menos un registro para continuar.</p>
    </div>

    <div class="col-md-12" id="IdGridContenedoresITC">
        <div class="table-responsive">
            <div class="innercontainer">
                <table class="table table-bordered" align="center">
                    <tr>
                        <td align="center" colspan="3">
                            <table id="gridContenedoresITC" class="table table-striped">
                                <!-- Angular implementation for gridContenedoresITC goes here -->
                            </table>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
        <div align="center" id="paginGridContenedoresITC">
            <!-- Pagination controls go here -->
        </div>
    </div>
    <br>

    <div class="row" style="margin-top: 30px;">
        <div class="form-group">
            <div class="col-md-12">
                <div class="pull-left text-muted text-vertical-align-button" id="lblCamposObligatorios">
                    {{ mensajeCamposObligatorios }}
                </div>
                <br><br>
                <div style="margin-top: -50px;" class="pull-right">
                    <div class="col-md-3">
                        <button type="button" class="btn btn-danger" (click)="abrirModalCancelarTramite()">
                            Cancelar
                        </button>
                    </div>
                    <div class="col-md-3" *ngIf="requiereGuardadoParcial">
                        <button type="button" class="btn btn-default" (click)="guardarParcial()">
                            Guardar
                        </button>
                    </div>
                    <div class="col-md-3" id="botonGuardar">
                        <button type="submit" class="btn btn-primary" (click)="esPago()">
                            Continuar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>







</form>
