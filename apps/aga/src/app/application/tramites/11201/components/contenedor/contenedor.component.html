<div class="container">
    <form [formGroup]="solicitudForm" id="formSolicitud">
        <ng-titulo titulo="Ingresar por:" />
        <ng-container>
            <div class="row tipo-busqueda-radio">
                <div class="col-md-12">
                    <div class="col-md-4">
                        <div class="radio">
                            <label>
                                <input type="radio" formControlName="tipoBusqueda" id="idRadioContenedor"
                                    value="Contenedor" class="form-check-input"
                                    [attr.disabled]="radioContenedor ? true : null">
                                Contenedor
                            </label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="radio">
                            <label>
                                <input type="radio" formControlName="tipoBusqueda" id="idRadioManifiesto"
                                    value="No. de Manifiesto" class="form-check-input"
                                    [attr.disabled]="radioManifesto ? true : null">
                                No. de Manifiesto
                            </label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="radio">
                            <label>
                                <input type="radio" formControlName="tipoBusqueda" id="idRedioExcel" value="Archivo CSV"
                                    class="form-check-input" [attr.disabled]="radioArchivoCsv ? true : null">
                                Archivo CSV
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>

        <ng-container *ngIf="mostrarSeccionAduanaaFecha">
            <div id="seccionAduanaaFecha">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <ng-titulo titulo="Datos generales" />
                        <app-catalogo-select [catalogo]="aduanaList.catalogos" [label]="aduana.labelNombre"
                            [placeholder]="aduana.primerOpcion" [required]="true" formControlName="aduana"
                            (change)="setValoresStore(solicitudForm,'aduana', 'setAduana')"
                            [isDisabled]="soloLectura"></app-catalogo-select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group datepicker-group">
                            <input-fecha [datos]="fechaInicioInput" (valorCambiado)="cambioFechaIngreso($event)"
                                [isDisabled]="soloLectura"
                                [setFecha]="solicitudForm.get('fechaIngreso')?.value"></input-fecha>
                        </div>
                    </div>
                </div>
                <br><br>
            </div>
        </ng-container>
        <ng-container *ngIf="mostrarSeccionContenedor">
            <div id="seccionContenedor">
                <div class="row">
                    <div class="col-md-12">
                        <h3>Datos del equipo</h3>
                        <hr class="red">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="form-group">
                            <label for="inicialesContenedor">Iniciales del equipo<span class="require">*</span>:</label>
                            <input type="text" formControlName="inicialesContenedor" id="inicialesContenedor"
                                maxlength="10" class="form-control"
                                [ngClass]="isValid('inicialesContenedor') ? 'required' : ''">
                            <div *ngIf="esInvalido('inicialesContenedor')" class="text-danger">
                                <small *ngIf="solicitudForm.controls['inicialesContenedor'].errors?.['required']">
                                    Este campo es obligatorio.
                                </small>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="numeroContenedor">Número de equipo<span class="require">*</span>:</label>
                            <input type="text" formControlName="numeroContenedor" id="numeroContenedor" maxlength="15"
                                class="form-control" [ngClass]="isValid('numeroContenedor') ? 'required' : ''">
                            <div *ngIf="esInvalido('numeroContenedor')" class="text-danger">
                                <small *ngIf="solicitudForm.controls['numeroContenedor'].errors?.['required']">
                                    Este campo es obligatorio.
                                </small>
                                <div *ngIf="solicitudForm.get('numeroContenedor')?.touched && solicitudForm.get('numeroContenedor')?.errors?.['minlength']"
                                    class="mensaje-error">
                                    Por favor, no escribas menos de 6 caracteres
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="digitoDeControl">Dígito verificador:</label>
                            <input type="text" formControlName="digitoDeControl" id="digitoDeControl" maxlength="1"
                                class="form-control">
                        </div>
                    </div>

                    <div class="col-md-4 menu-desplegable">
                        <app-catalogo-select [catalogo]="contenedores.catalogos" [label]="contenedores.labelNombre"
                            [placeholder]="aduana.primerOpcion" [required]="true" formControlName="contenedores"
                            (change)="setValoresStore(solicitudForm,'contenedores', 'setContenedores')"
                            [isDisabled]="soloLectura"></app-catalogo-select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group pull-right">
                            <button type="button" class="btn btn-default" (click)="limpiarCampos()"
                                [disabled]="soloLectura">Limpiar</button>
                            <button type="button" class="btn btn-primary ms-2" (click)="validarDigitoVerificador()"
                                [disabled]="soloLectura">Agregar</button>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
        <ng-container *ngIf="mostrarSeccionNoManifiesto">
            <div id="seccionNoManifiesto">
                <div class="row">
                    <div class="col-md-12">
                        <ng-titulo titulo="Ingresar por manifiesto" />
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <app-catalogo-select [catalogo]="catalogoList" [label]="transporteList.labelNombre"
                            [placeholder]="transporteList.primerOpcion" formControlName="menuDesplegable"
                            (change)="setValoresStore(solicitudForm,'menuDesplegable', 'setMenuDesplegable')"
                            [isDisabled]="soloLectura" [required]="true"
                            [ngClass]="isValid('numeroManifiesta') ? 'required' : ''"></app-catalogo-select>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="numeroManifiesta">No. Manifiesto<span class="require">*</span>:</label>
                            <input type="text" formControlName="numeroManifiesta" id="numeroManifiesta" maxlength="50"
                                class="form-control" [ngClass]="isValid('numeroManifiesta') ? 'required' : ''"
                                (change)="setValoresStore(solicitudForm,'numeroManifiesta', 'setNumeroManifiesta')">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group pull-right">
                            <button type="button" class="btn btn-primary" (click)="enviarManifiesto()"
                                [disabled]="soloLectura">Buscar</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="mensaje" style="margin-top: 1em;" *ngIf="mostrarMensaje">
                <ng-alert [CONTENIDO]="TEXTOS.ADVERTENCIA"></ng-alert>
                <div class="col-md-12" id="IdGridContenedoresITC">
                    <div class="table-responsive">
                        <div class="innercontainer">
                            <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
                                [disableSeleccionTablaCheckBox]="soloLectura" [configuracionTabla]="encabezadoDeTabla"
                                [datos]="datosTabla"></app-tabla-dinamica>
                        </div>
                    </div>
                    <div align="center" id="paginGridContenedoresITC">
                        <div class="page-container">
                            <div class="page-number">1</div>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>

        <ng-container *ngIf="mostrarAdjuntarArchivo">
            <div id="tabs">
                <div id="adjuntarArchivo">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <ng-titulo titulo="Datos generales" />
                            <app-catalogo-select [catalogo]="catalogoList" [label]="aduana.labelNombre"
                                [placeholder]="aduana.primerOpcion" [required]="true"
                                formControlName="aduanaMenuDesplegable"
                                (change)="setValoresStore(solicitudForm,'aduanaMenuDesplegable', 'setAduanaMenuDesplegable')"
                                [isDisabled]="soloLectura"></app-catalogo-select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group datepicker-group">
                                <input-fecha [datos]="fechaInicioInput" (valorCambiado)="cambioFechaDeIngreso($event)"
                                    [isDisabled]="soloLectura"
                                    [setFecha]="solicitudForm.get('fechaDeIngreso')?.value"></input-fecha>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <ng-titulo titulo="Adjuntar archivo" />
                            <label for="archivoSeleccionado" class="form-label">Archivo Seleccionado*:</label>
                            <input class="form-control" type="string" name="archivoSeleccionado"
                                id="archivoSeleccionado" [value]="etiquetaDeArchivo" readonly>
                        </div>
                        <div class="col-md-4 d-flex justify-content-end" style="width: 100%">
                            <button
                                [disabled]="!solicitudForm.get('aduanaMenuDesplegable')?.value || !solicitudForm.get('fechaDeIngreso')?.value"
                                type="button" class="btn btn-default" (click)="adjuntarArchivo() ">Cargar
                                archivo</button>
                        </div>
                        <div class="row" style="margin-top: 20px" *ngIf="mostrarArchivoSeleccionadoTable">
                            <div class="col-md-8">
                                <ng-titulo titulo="Cargar Archivo" />
                                <div class="col-md-8">
                                    <label for="cargarArchivo" class="form-label d-flex">Archivo*:</label>
                                    <button class="mb-2" type="button" for="cargarArchivo" class="file-upload"
                                        (click)="activarSeleccionArchivo()">
                                        Seleccionar archivo
                                    </button>
                                    <span class="ml-2">{{ etiquetaDeArchivo }}</span>
                                    <input type="file" id="cargarArchivo" class="file-upload" style="display: none;"
                                        accept=".csv" (change)="onCambioDeArchivo($event)">
                                    @if (nuevaNotificacion) { <section>
                                        <lib-notificaciones [notificacionInput]="nuevaNotificacion"
                                            (confirmacionModal)="eliminarPedimento($event)"></lib-notificaciones>
                                    </section> }
                                </div>
                            </div>
                            <div class="col-md-4 d-flex justify-content-end p-5 gap-3" style="width: 100%">
                                <button type="button" class="btn btn-default" (click)="regresar()">Regresar</button>
                                <button type="button" class="btn btn-default" (click)="archivo()">Enviar</button>
                            </div>
                        </div>

                        <div *ngIf="mostrarCargarArchivoTable" class="table-container">
                            <app-tabla-dinamica [configuracionTabla]="encabezadoDeTabla"
                                [datos]="datosTabla"></app-tabla-dinamica>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
        <div class="col-md-12" id="IdGridContenedoresITC"
            *ngIf="!solicitud11201State?.tipoBusqueda || solicitud11201State?.tipoBusqueda === 'Contenedor'">
            <br>
            <div class="table-responsive">
                <div class="innercontainer">
                    <app-tabla-dinamica [configuracionTabla]="encabezadoDeTabla"
                        [datos]="datosDelContenedor"></app-tabla-dinamica>
                </div>
            </div>
            <div align="center" id="paginGridContenedoresITC">
                <nav aria-label="Page navigation example">
                    <ul class="pagination d-flex justify-content-center">
                        <li class="page-item"><a class="page-link" href="Javascript:;">1</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </form>
    <ng-template #plantillademodelo>
        <div class="modal-header">
            <h4 class="modal-title"></h4>
        </div>
        <div class="modal-body p-5">
            <ng-container [ngSwitch]="abiertoModeloDatos">
                <ng-container *ngSwitchCase="'generarerror'"> No se puede generar la constancia, porque ya cuenta con
                    una</ng-container>
                <ng-container *ngSwitchCase="'verificadorerror'">
                    Dígito verificador incorrecto</ng-container>
                <ng-container **ngSwitchDefault></ng-container>
            </ng-container>
        </div>
        <div class="modal-footer m-auto">
            <button type="button" class="btn btn-primary" (click)="modalRef?.hide()">
                Aceptar
            </button>
        </div>
    </ng-template>
</div>
