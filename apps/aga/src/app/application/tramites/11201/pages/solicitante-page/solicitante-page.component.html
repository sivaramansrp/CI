<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h3>Importación temporal de contenedores</h3>
      </div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <paso-uno (continuarEvento)="continuar()" (cancelarEvento)="cancelar()"></paso-uno>
      } @case (3) {
      <paso-tres></paso-tres>
      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
      } @case (2) {
        <app-paso-dos (cancelEvent)="cancelar()" (continuarEvento)="continuar()"></app-paso-dos>
        <!-- <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar> -->
        }}
    </div>
  </div>
</div>
