<div class="container">
  <form
    [formGroup]="solicitudForm"
    (ngSubmit)="validarDestinatarioFormulario()"
    class="row mt-5"
  >
    <ng-titulo titulo="Cancelación donaciones" />
    <div class="col-md-12">
      <ng-container formGroupName="cancelacionDonaciones">
        <label>Datos Requeridos*:</label>
        <div class="alert alert-info">
          <label style="font-weight: normal">
            <input
              type="checkbox"
              style="margin-left: -245px"
              formControlName="laAutorizacionEsNula"
              id="laAutorizacionEsNula"
            />
            *Para asi convenir a mis intereses solicito se deje sin efectos la
            autorización
          </label>
        </div>
        <div class="row" style="margin-top: 30px; margin-bottom: 30px">
          <div class="form-group">
            <div class="col-md-12">
              <div
                class="pull-left text-muted text-vertical-align-button"
              ></div>
              <div class="pull-right row">
                <div class="col-md-5" id="botonGuardar">
                  <button
                    type="submit"
                    class="btn btn-primary"
                    (click)="continuar()"
                  >
                    Continuar
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </form>
</div>
