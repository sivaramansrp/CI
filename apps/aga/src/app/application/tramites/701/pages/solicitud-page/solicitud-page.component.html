<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h1 >Solicitud servicios extraordinarios</h1>
        <h2 *ngIf="indice === 2">Cargar archivos</h2>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <paso-uno></paso-uno>
      }  @case (2) {
        <paso-dos></paso-dos>
        } @case (3) {
      <paso-tres></paso-tres>
      } }

      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
    </div>
  </div>
</div>
