<div class="page">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>Registro del código alfanumérico armonizado del transportista</h1>
            </div>
            <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
        </div>
        <div class="row">
            @switch (indice) {
                @case (1) {
                   <app-datos-40302></app-datos-40302> 
                }
                @case (2) {
                    <app-paso-uno></app-paso-uno>
                 }
                 @case (3) {
                 <app-paso-tres></app-paso-tres>
                 }
                }
             <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
        </div>
    </div>
</div>
