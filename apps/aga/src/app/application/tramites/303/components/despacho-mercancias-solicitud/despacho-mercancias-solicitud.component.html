<div class="container">
  <ng-titulo titulo="Requisitos generales" />
    <form [formGroup]="formDespacho">
      <div class="form">
        <div class="row">
          <div class="col-md-12">
            <label class="control-label" for="buscar">Señale si se encuentra al corriente en el cumplimiento de sus obligaciones fiscales y aduaneras</label>
          </div>
          <div class="col-md-2">
            <input class="form-check-input me-3" type="radio" name="cumplimiento" value="a" id="cumplimiento_si">
            <label class="control-label" for="cumplimiento">Si</label>
          </div>
          <div class="col-md-2">
            <input class="form-check-input me-3" type="radio" name="cumplimiento" value="aa" id="certficacion_no">
            <label class="control-label" for="cumplimiento">No</label>
          </div>
        </div>
        <div class="row">
            <div class="col-md-12">
              <label class="control-label" for="buscar">Indique si autorizó al S A T hacer pública su opinión positiva sobre el cumplimiento de obligaciones fiscales</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="autorizar" value="a" id="autorizar_si">
              <label class="control-label" for="autorizar">Si</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="autorizar" value="aa" id="autorizar_no">
              <label class="control-label" for="autorizar">No</label>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <label class="control-label" for="buscar">Indique si se encuentra en el listado de empresas publicadas por el S A T, en términos de los artículos 69 ó 69 Bis noveno párrafo con excepción de los dispuesto  en la fracción V I, y 69-B, cuarto párrafo, del Código Fiscal Federal: </label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="listado" value="a" id="listado_si">
              <label class="control-label" for="listado">Si</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="listado" value="aa" id="listado_no">
              <label class="control-label" for="listado">No</label>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <label class="control-label" for="buscar">Señale si al momento de ingresar su solicitud sus certificados de sellos digitales están vigentes</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="certificados" value="a" id="certificados_si">
              <label class="control-label" for="certificados">Si</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="certificados" value="aa" id="certificados_no">
              <label class="control-label" for="certificados">No</label>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <label class="control-label" for="buscar">Señale si infringió en alguno de los supuestos previos en el artículo 17-H bis del C F F, durante los últimos 12 meses contados a partir de la fecha de la presentación de la solicitud;</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="art17" value="a" id="art17_si">
              <label class="control-label" for="art17">Si</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="art17" value="aa" id="art17_no">
              <label class="control-label" for="art17">No</label>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <label class="control-label" for="buscar">Señale si al momento de ingresar sus solicitud tiene actualizado su correo electrónico para efectos del Buzón Tributario</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="buzon" value="a" id="buzon_si">
              <label class="control-label" for="buzon">Si</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="buzon" value="aa" id="buzon_no">
              <label class="control-label" for="buzon">No</label>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <label class="control-label" for="cuentaImmex">Indica si cuenta con programa IMMEX*:</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="cuentaImmex" value="a" id="cuentaImmex_si">
              <label class="control-label" for="cuentaImmex">Si</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="cuentaImmex" value="aa" id="cuentaImmex_no">
              <label class="control-label" for="cuentaImmex">No</label>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6">
              <label class="control-label" for="immex">Número del Programa IMMEX*:</label>
              <select class="form-control" id="immex" >
                <option>6-2024</option>
                <option>7-2024</option>
                <option>8-2025</option>
              </select>
            </div>


          </div>

      </div>
    </form>
    <div class="row">
        <agentes-agencias-aduanales></agentes-agencias-aduanales>
    </div>
    <!--<div class="row">
        <empleados-contratados></empleados-contratados>
    </div>-->
    <div class="row">
        <datos-transportista></datos-transportista>
    </div>
    <div class="row">
        <control-inventarios></control-inventarios>
    </div>
    <div class="ror">
        <agregar-miembros-empresa></agregar-miembros-empresa>
    </div>
  </div>
