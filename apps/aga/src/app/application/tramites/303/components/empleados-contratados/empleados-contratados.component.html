
<div class="container">
    <ng-titulo titulo="Empleados contratados y subcontratados" />
    <div class="row">
        <div class="col-md-12">
          <label class="control-label" for="empleadosImss">Señale si cuenta con empleados propios para realizar el proceso productivo o la prestación de servicios, registrado ante el IMSS*:</label>
        </div>
        <div class="col-md-2">
          <input class="form-check-input me-3" type="radio" name="empleadosImss" value="a" id="empleadosImss_si">
          <label class="control-label" for="empleadosImss">Si</label>
        </div>
        <div class="col-md-2">
          <input class="form-check-input me-3" type="radio" name="empleadosImss" value="aa" id="empleadosImss_no">
          <label class="control-label" for="empleadosImss">No</label>
        </div>
    </div>
    <div class="row">
        <ng-alert [CONTENIDO]="TEXTOS.TEXTO_EMPLEADOS_CONTRATADOS"></ng-alert>
    </div>
    <div class="row">
        <div class="col-md-4 form-group">
        <label class="control-label" for="figura">Número de empleados*:</label>

        </div>
        <div class="col-md-4 form-group">
            <label class="control-label" for="figura">Bimestre*:</label>
    
            </div>
    </div>

    <div class="row">
        <div class="col-md-12">
          <label class="control-label" for="subcontratacion">Señale si cuenta con empleados propios para realizar el proceso productivo o la prestación de servicios, registrado ante el IMSS*:</label>
        </div>
        <div class="col-md-2">
          <input class="form-check-input me-3" type="radio" name="subcontratacion" value="a" id="subcontratacion_si">
          <label class="control-label" for="subcontratacion">Si</label>
        </div>
        <div class="col-md-2">
          <input class="form-check-input me-3" type="radio" name="subcontratacion" value="aa" id="subcontratacion_no">
          <label class="control-label" for="subcontratacion">No</label>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
          <label class="control-label" for="art15">Señale si cuenta con empleados propios para realizar el proceso productivo o la prestación de servicios, registrado ante el IMSS*:</label>
        </div>
        <div class="col-md-2">
          <input class="form-check-input me-3" type="radio" name="art15" value="a" id="art15_si">
          <label class="control-label" for="art15">Si</label>
        </div>
        <div class="col-md-2">
          <input class="form-check-input me-3" type="radio" name="art15" value="aa" id="art15_no">
          <label class="control-label" for="art15">No</label>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <table class="table table-responsive">
              <thead>
                <tr>
                  <th>Instalaciones principales</th>
                  <th>Tipo de instalación</th>
                  <th>Entidad federativa</th>
                  <th>Municipio o delegación</th>
                  <th>Colonia, calle y número </th>
                  <th>Código postal</th>
                  <th>Registro ante SE/SAT</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                </tr>
              </tbody>
            </table>
          </div>
    </div>
    <div class="row">
        <div class="col-md-4"></div>
        <div class="col-md-4"></div>
        <div class="col-md-4 d-flex align-items-rigth">
            <div class="btn-group">
                <button class="btn btn-default" type="button" (click)="abrirModal()" >Modificar</button>
              <button class="btn btn-default" type="button" >Eliminar</button>
              <button type="button" class="btn btn-primary ms-2" (click)="abrirModal()">Agregar </button>
            </div>
          </div>
    </div>
   
</div>

<div [ngClass]="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Agregar empleado</h4>
        </div>
        <div class="modal-body">
       
                <div class="form-group">
                  <label for="instalacionesPrincipales">Instalaciones principales</label>
                  <input type="text" id="instalacionesPrincipales" class="form-control">
                </div>
                <div class="form-group">
                  <label for="tipoInstalacion">Tipo de instalación</label>
                  <input type="text" id="tipoInstalacion"  class="form-control">
                </div>
                <div class="form-group">
                  <label for="entidadFederativa">Entidad federativa</label>
                  <input type="text" id="entidadFederativa"  class="form-control">
                </div>
                <div class="form-group">
                  <label for="municipioDelegacion">Municipio o delegación</label>
                  <input type="text" id="municipioDelegacion"  class="form-control">
                </div>
                <div class="form-group">
                  <label for="coloniaCalleNumero">Colonia, calle y número</label>
                  <input type="text" id="coloniaCalleNumero"  class="form-control">
                </div>
                <div class="form-group">
                  <label for="codigoPostal">Código postal</label>
                  <input type="text" id="codigoPostal"  class="form-control">
                </div>
                <div class="form-group">
                  <label for="registroSE_SAT">Registro ante SE/SAT</label>
                  <input type="text" id="registroSE_SAT"  class="form-control">
                </div>
       
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal" (click)="cerrarModal()">Cerrar</button>
          <button type="button" class="btn btn-primary" >Agregar</button>
        </div>
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
  </div><!-- /.modal -->
