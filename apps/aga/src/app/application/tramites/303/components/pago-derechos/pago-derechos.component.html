<div class="container">
    <ng-titulo titulo="Pago de derechos" />
    <form [formGroup]="pagoDerechos">
      <div class="form">
        <div class="row">
          <div class="col-md-8">
            <div class="form-group">
              <label class="control-label" for="clave">Clave de referencia:</label>
              <input class="form-control" id="clave" placeholder="Clave de referencia" type="text" formControlName="clave">
            </div>
          </div>

        </div>
        <div class="row">
          <div class="col-md-8">
            <div class="form-group">
              <label class="control-label" for="dependencia">Cadena de la dependencia:</label>
              <input class="form-control" id="dependencia" placeholder="Cadena de la dependencia" type="text" formControlName="dependencia">
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label class="control-label" for="banco">Banco:</label>
              <input class="form-control" id="banco" placeholder="banco" type="text" formControlName="banco">
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="control-label" for="llavePago">Llave de pago:</label>
              <input class="form-control" id="llavePago" placeholder="Llave de pago" type="text" formControlName="llavePago">
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label class="control-label" for="fecha">Fecha de pago:</label>
              <input class="form-control" id="fecha" placeholder="Fecha de pago" type="text" formControlName="fecha">
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label class="control-label" for="importePago">Importe de pago:</label>
              <input class="form-control" id="importePago" placeholder="Importe de pago" type="text" formControlName="importePago">
            </div>
          </div>
        </div>
      </div>
    </form>
    
  </div>
