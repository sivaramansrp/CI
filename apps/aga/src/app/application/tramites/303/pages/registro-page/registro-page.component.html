<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        <h2>Registro del despacho de mercancías de las empresas</h2>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>

    </div>

    <div class="row">
      @switch (indice) {
      @case (1) {
      <paso-uno></paso-uno>
      }
      @case (2) {
      <paso-tres></paso-tres>
      }
      @case (3) {
      <paso-cuatro></paso-cuatro>
      }
      }

      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    </div>
  </div>
</div>
