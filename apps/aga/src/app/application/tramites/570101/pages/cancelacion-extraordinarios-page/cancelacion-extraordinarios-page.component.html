<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h1>Cancelación de servicios extraordinarios</h1>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>

    </div>
    <div class="row">
      @switch (indice) {
      @case (1) {
      <app-paso-uno (pestanaCambiado)="pestanaCambiado($event)"></app-paso-uno>
      }
      @case (2) {
      <app-paso-dos></app-paso-dos>
      }
      }
    </div>
    <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
  </div>
</div>
  <div class="modal fade" id="modalConfirmarCancelarSolicitud" tabindex="-1" #modalConfirmarCancelarSolicitud>
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Cancelar servicio extraordinario</h4>
        </div>
        <div class="modal-body">
          <p>Deseas cancelar el folio¿</p>
        </div>
        <div class="modal-footer custom-footer">
          <button type="button" class="btn btn-primary" (click)="encendidoSi()">Si</button>
          <button type="button" class="btn btn-default" data-bs-dismiss="modal">No</button>
        </div>
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
  </div><!-- /.modal -->
