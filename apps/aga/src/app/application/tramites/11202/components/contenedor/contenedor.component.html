<form [formGroup]="solicitudForm" id="formSolicitud">
  <input type="hidden" formControlName="idSolicitud" id="idSolicitud" />
  <div id="tabs">
    <div id="adjuntarArchivo" *ngIf="isAdjuntarArchivoVisible"></div>
  </div>

  <div class="row">
    <div class="col-md-12">
      <ng-titulo titulo="Ingresar por:" />
    </div>
  </div>

  <div class="row">
    <div class="col-md-12">
      <div class="col-md-6">
        <app-input-radio [radioOptions]="radioOptions" [isRequired]="true" [layout]="'horizontal'"
          formControlName="tipoBusqueda" (change)="setValoresStore(solicitudForm, 'tipoBusqueda', 'setTipoBusqueda')"></app-input-radio>
      </div>
    </div>
  </div>
  <br />

  <div id="seccionAduanaaFecha" *ngIf="seccionAduanaaFechaVisible">
    <ng-titulo titulo="Datos generales" />
    <ng-container formGroupName="datosGenerales">
      <div class="row">
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="options" formControlName="aduana" [label]="'Aduana/sección aduanera'"
            [placeholder]="'Seleccione una opción'" [required]="true"
            (change)="setValoresStore(datosGenerales, 'aduana', 'setAduana')"
            [isDisabled]="soloLectura"></app-catalogo-select>
        </div>
      </div>
    </ng-container>
  </div>

  <div id="seccionAduanaaFecha" *ngIf="seccionContenedor">
    <ng-titulo titulo="Datos del Contenedor" />
    <ng-container formGroupName="datosContenedor">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="inicialesContenedor">Iniciales del Contenedor:
            </label>
            <input type="text" class="form-control" id="inicialesContenedor"
              formControlName="inicialesContenedor" (change)="
                setValoresStore(
                  datosContenedor,
                  'inicialesContenedor',
                  'setInicialesContenedor'
                )
              " />
          </div>
        </div>

        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="numeroContenedor">Número del Contenedor:</label>
            <input type="text" class="form-control" id="numeroContenedor"
              formControlName="numeroContenedor" (change)="
                setValoresStore(
                  datosContenedor,
                  'numeroContenedor',
                  'setNumeroContenedor'
                )
              " />
          </div>
        </div>
      </div>

      <div id="botonesBuscar" class="mt-3" *ngIf="mostrarBotonesBuscar">
        <div class="row">
          <div class="col-md-12">
            <div class="form-group pull-right">
              <button type="button" name="limpiar" id="limpiar" class="btn btn-default" (click)="limpiarCampos()"
                [disabled]="soloLectura">
                Limpiar
              </button>
              <button type="button" name="buscar" id="buscar" class="btn btn-primary ms-2" (click)="encontradaModal()"
                [disabled]="soloLectura">
                Buscar
              </button>
            </div>
          </div>
        </div>
      </div>
      <div id="mostrarAgregarTipoContenedor" *ngIf="mostrarAgregarTipoContenedor">
        <div class="row mt-3">
          <div class="col-md-4">
            <app-catalogo-select [catalogo]="contenedore.catalogos" formControlName="tipoContenedor" [label]="contenedore.labelNombre"
              [required]="true" (change)="
                setValoresStore(
                  datosContenedor,
                  'tipoContenedor',
                  'setTipoContenedor'
                )
              " [isDisabled]="soloLectura"></app-catalogo-select>
          </div>
        </div>
        <div class="row">
          <div class="col-md-8">
            <div class="form-group pull-right">
              <button type="button" name="agregar" id="agregar" class="btn btn-primary" (click)="agregarGrid()"
                [disabled]="soloLectura">
                Agregar
              </button>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </div>
    <div class="col-md-12 mt-5" id="idGridContenedoresRC" *ngIf="!solicitudForm.get('tipoBusqueda')?.value || solicitudForm.get('tipoBusqueda')?.value === 'Contenedor'">
      <div class="table-responsive">
        <div class="innercontainer">
          <app-tabla-dinamica [configuracionTabla]="gridContenedores" [datos]="contenedores"></app-tabla-dinamica>
        </div>
      </div>
      <nav aria-label="Page navigation example">
        <ul class="pagination d-flex justify-content-center mb-3">
          <li class="page-item"><a class="page-link">1</a></li>
        </ul>
      </nav>
    </div>

  <div id="cargarArchivos" *ngIf="cargarArchivoVisible">
    <ng-titulo titulo="Cargar Archivos" />
    <ng-container formGroupName="datosContenedor">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="archivo">Archivo:</label>
            <input type="file" class="form-control" id="archivo" formControlName="archivo" />
          </div>
        </div>
      </div>
    </ng-container>
  </div>

  @if (consultaDatos.create) {
            <div class="row" style="margin-top: 30px;margin-bottom: 30px;">
                <div class="form-group">
                    <div class="col-md-12">
                        <div class="pull-left text-muted text-vertical-align-button" id="lblCamposObligatorios">
                            * Campos obligatorios
                        </div>
                        <div class="pull-right row">
                            <div class="col-md-5">
                                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#modalCancelar">
                                    Cancelar
                                </button>
                            </div>
                            <div class="col-md-5" id="botonGuardar">
                                <button type="submit" class="btn btn-primary" (click)="continuar()">
                                    Continuar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        }

</form>

<div class="modal fade" id="modalCancelar" tabindex="-1" role="dialog"
        aria-labelledby="modalCancelar" aria-hidden="true" #modalCancelar>
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Cancelar</h4>
                </div>
                <div class="modal-body">
                    <p>¿Está seguro que desea cancelar?. Se borrarán los datos capturados.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" (click)="cancelar()"
                        data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAgregarConstanciaTransferencia" tabindex="-1" role="dialog"
        aria-labelledby="modalAgregarConstanciaTransferenciaLabel" aria-hidden="true" #modalAgregarConstanciaTransferencia>
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Constancia no encontrada</h4>
                </div>
                <div class="modal-body">
                    <p>Constancia no encontrada, ¿Deseas agregar una nueva constancia?.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" (click)="datosCaptura()"
                        data-bs-dismiss="modal">Si</button>
                    <button type="button" class="btn btn-default" data-bs-dismiss="modal">No</button>
                </div>
            </div>
        </div>
    </div>
