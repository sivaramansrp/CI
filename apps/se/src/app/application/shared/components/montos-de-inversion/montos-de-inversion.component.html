<div class="container">
  <ng-titulo titulo="Montos de inversión"></ng-titulo>
  <form [formGroup]="montosDeInversionForm">
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="tipoOptions"
          [label]="'Tipo'"
          [required]="true"
          name="tipo"
          formControlName="tipos" (change)="setValoresStore(montosDeInversionForm, 'tipos', 'setTipos')"
        ></app-catalogo-select>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="cantidad">Cantidad*:</label>
        <input
          class="form-control min-hgt"
          id="cantidad"
          formControlName="cantidad"
          type="text"
          (change)="setValoresStore(montosDeInversionForm, 'cantidad', 'setCantidad')"
        />
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-8">
        <label class="control-label" for="descripsion">Descripción*:</label>
        <textarea
          rows="4"
          class="form-control h-100"
          id="descripsion"
          formControlName="descripsion"
          placeholder=""
          (change)="setValoresStore(montosDeInversionForm, 'descripsion', 'setDescripsion')"
        ></textarea>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-4">
        <label class="form-label" for="mnx"
          >Monto de inversión en moneda nacional (mxn)*:</label
        >
        <input
          class="form-control"
          id="mnx"
          formControlName="mnx"
          type="text"
          (change)="setValoresStore(montosDeInversionForm, 'mnx', 'setMnx')"
        />
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-12 container text-end mt-5">
        <button class="btn btn-default me-2">Limpiar</button>
        <button class="btn btn-primary">Agregar</button>
      </div>
    </div>
  </form>
  <div class="row">
    <h5>Montos de inversión</h5>
  </div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="montosDeInversionEncabezado"
      [tipoSeleccionTabla]="montosDeInversionTablaSeleccion"
      [datos]="montosDeInversionDatos"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-12 container text-end mt-5">
      <button class="btn btn-danger me-2">Eliminar</button>
      <button class="btn btn-primary">Editar</button>
    </div>
  </div>
  <div class="row mt-5">
    <div class="col-12 container text-end mt-5 mb-5">
      <button class="btn btn-danger me-2" (click)="regrasar()">
        Regresar a plantas
      </button>
    </div>
  </div>
</div>
