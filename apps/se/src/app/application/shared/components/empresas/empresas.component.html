<div class="container">
<ng-titulo [titulo]="tituloEmpresas" />    
<form [formGroup]="empresasForm">
<div class="row">
    <div class="col-md-4">     
      <div class="form-group">
        <label class="form-label" for="rfc">RFC*:</label>
        <input class="form-control" id="rfc" type="text" formControlName="rfc" (change)="setValoresStore(empresasForm,'rfc', 'setRfc')"           
         />
      </div>
      @if (empresasForm.controls['rfc'].invalid && empresasForm.controls['rfc'].touched) {
        <div class="d-grid">
          @if (empresasForm.controls['rfc'].errors?.['required']) {
            <span class="mensaje-error">Este campo es obligatorio</span>
          }
        </div>
      }
    </div>
    <div class="col-md-4">
        <div class="form-group"> 
            <app-catalogo-select [catalogo]="estadosCatalogo" formControlName="estado" [label]="'Estado'" 
            [required]="true" name="estado" (change)="setValoresStore(empresasForm, 'estado', 'setEstado')">
          </app-catalogo-select>
          </div>
    </div>
</div>
<div class="col-md-12 mt-5 d-flex justify-content-end">
    <button type="button" class="btn btn-primary ms-3"  (click)="buscarControladoras()">Buscar controladoras</button>
</div>
<div class="row">
  <h6>{{ tituloDisponibles }}</h6>
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaDatos"
      [datos]="disponibles"
      [tipoSeleccionTabla]="checkbox"
    ></app-tabla-dinamica>
    <nav aria-label="Page navigation example">
      <ul class="pagination justify-content-center">
        <li class="page-item"><a class="page-link">1</a></li>
      </ul>
    </nav>
</div>
<div class="col-md-12 mt-5 d-flex justify-content-end">
    <button type="button" class="btn btn-primary ms-3" (click)="agregarPlantas()">Agregar Plantas</button>
</div>
<div class="row">
  <h6>{{ tituloSeleccionadas }}</h6>
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaDatos"
      [datos]="seleccionadas"
      [tipoSeleccionTabla]="checkbox"
    ></app-tabla-dinamica>
    <nav aria-label="Page navigation example">
      <ul class="pagination justify-content-center">
        <li class="page-item"><a class="page-link">1</a></li>
      </ul>
    </nav>
</div>
<div class="col-md-12 mt-5 d-flex justify-content-end">
  <button type="button" class="btn btn-danger ms-3">Elimiar Plantas</button>
    
</div>

</form>
</div>
