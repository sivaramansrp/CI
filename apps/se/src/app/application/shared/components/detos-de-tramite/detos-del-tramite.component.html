<div class="container">
  <form [formGroup]="formDelTramite">
    <ng-titulo titulo="Datos del trámite a realizar"></ng-titulo>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label for="solicitud">Solicitud*:</label>
          <app-input-radio
            [radioOptions]="solicitudeOptions"
            formControlName="solicitud"
            [isRequired]="true"
            (valueChange)="onValueChange($event)"
            [layout]="'vertical'"
          ></app-input-radio>
        </div>
      </div>
      <div class="col-md-8">
        <div *ngFor="let catalogo of catalogosArray; let i = index">
          <app-catalogo-select
            [catalogo]="catalogo"
            [label]="inputFields[i].label"
            [placeholder]="inputFields[i].placeholder"
            [required]="inputFields[i].required"
            formControlName="fraccion"
          ></app-catalogo-select>
          <div
            *ngIf="formDelTramite.controls['fraccion'].invalid && formDelTramite.controls['fraccion'].touched"
            class="text-danger"
          >
            <small *ngIf="formDelTramite.controls['fraccion'].errors?.['required']">
              Este campo es obligatorio.
            </small>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
