<div class="container">
  <div class="row">
    <div class="col-md-3">
      <div class="form-group">
        <h5 class="form-label text-start">Fracción arancelaria</h5>
        <p class="form-label text-start">
          {{ complimentarFraccionDatos.fraccionArancelaria }}
        </p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="form-group">
        <h5 class="form-label text-start">Anexo II</h5>
        <p class="form-label text-start">
          {{ complimentarFraccionDatos.anexoDos }}
        </p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="form-group">
        <h5 class="form-label text-start">Tipo</h5>
        <p class="form-label text-start">
          {{ complimentarFraccionDatos.tipo }}
        </p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="form-group">
        <h5 class="form-label text-start">UMT</h5>
        <p class="form-label text-start">{{ complimentarFraccionDatos.umt }}</p>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <ng-titulo titulo="Fracción arancelaria del producto" />
    </div>
  </div>

  <form [formGroup]="complimentarForm">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <app-catalogo-select
            [catalogo]="catagoriaSeleccionDatos"
            formControlName="catagoria"
            [label]="'catagoria'"
            [required]="true"
            name="catagoria"
            [isDisabled]="formularioDeshabilitado"
          ></app-catalogo-select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="form-group">
          <label for="descripcion" class="form-label text-start"
            >Descripción comercial*:</label
          >
          <textarea
            id="descripcion"
            class="form-control"
            style="height: 60%; resize: none"
            formControlName="descripcion"
          ></textarea>
        </div>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-md-10">
        <label for="monedaNacionalMensual" class="form-label text-start"
          >Valor en moneda nacional de las importaciones a realizarse
          mensualmente*:</label
        >
      </div>
      <div class="col-md-2">
        <input
          class="form-control min-hgt"
          id="monedaNacionalMensual"
          formControlName="monedaNacionalMensual"
          type="number"
        />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-10">
        <label for="monedaNacionalDeDosPeriodos" class="form-label text-start"
          >Valor en moneda nacional de las importaciones a realizarse durante el
          periodo de 2 años*:</label
        >
      </div>
      <div class="col-md-2">
        <input
          class="form-control min-hgt"
          id="monedaNacionalDeDosPeriodos"
          formControlName="monedaNacionalDeDosPeriodos"
          type="number"
        />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-10">
        <label for="volumenMensual" class="form-label text-start">
          Volumen de las importaciones a realizarse mensualmente*:
        </label>
      </div>
      <div class="col-md-2">
        <input
          class="form-control min-hgt"
          id="volumenMensual"
          formControlName="volumenMensual"
          type="number"
        />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-10">
        <label for="twoPeriodVolume" class="form-label text-start">
          Volumen de las importaciones a realizarse durante el periodo de 2
          años*:
        </label>
      </div>
      <div class="col-md-2">
        <input
          class="form-control min-hgt"
          id="twoPeriodVolume"
          formControlName="twoPeriodVolume"
          type="number"
        />
      </div>
    </div>
  </form>
  <div class="row">
    <div class="col-12 container text-end mt-5">
      <button class="btn btn-default me-2" (change)="seleccionGuardar()"
      [disabled]="formularioDeshabilitado">
        Guardar
      </button>
      <button class="btn btn-primary me-2" (click)="regresar()"
      [disabled]="formularioDeshabilitado">
        Regresar Anexo
      </button>
    </div>
  </div>
</div>
