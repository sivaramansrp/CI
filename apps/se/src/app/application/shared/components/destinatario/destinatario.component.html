<div class="container">
  <form [formGroup]="formDestinatario">
    <div class="row mt-5">
      <ng-titulo titulo="Domicilio del destinatario" />
      <div class="col-md-8 form-group">
        <label class="form-label" for="ciudad"
          >Ciudad (poblacion, estado o provincia)*:</label
        >
        <input type="text" id="ciudad" class="form-control" formControlName="ciudad" />
      </div>

      <div class="row">
        <div class="col-md-4 form-group">
          <label class="form-label" for="Celle">Celle*:</label>
          <input type="text" id="celle" class="form-control" formControlName="celle" />
        </div>

        <div class="col-md-4 form-group">
          <label class="form-label" for="numeroLetra">Número y/o letra*:</label>
          <input type="text" id="numeroLetra" class="form-control" formControlName="numeroLetra" />
        </div>

        <div class="col-md-1 form-group">
          <label class="form-label" for="lada">Lada:</label>
          <input type="text" id="lada" class="form-control" formControlName="lada" />
        </div>

        <div class="col-md-3 form-group">
          <label class="form-label" for="telefono">Telefono:</label>
          <input type="text" id="telefono" class="form-control" formControlName="telefono" />
        </div>

        <div class="col-md-4 form-group">
          <label class="form-label" for="fax">Fax:</label>
          <input type="text" id="fax" class="form-control" formControlName="fax" />
        </div>

        <div class="col-md-4 form-group">
          <label class="form-label" for="correoElectronico"
            >Correo electronico*:</label
          >
          <input type="text" id="correoElectronico" class="form-control" formControlName="correoElectronico" />
        </div>

        @if(paisDestino){
        <div class="col-md-8 form-group">
          <app-catalogo-select
            [catalogo]="paisDestin || []"
            [label]="'Pais Destino'"
            [required]="true"
            name="estado"
            formControlName="paisDestin"
            (selectionChange)="paisDestinSeleccion($event)"
          ></app-catalogo-select>
        </div>
        }
      </div>
    </div>
  </form>
</div>
