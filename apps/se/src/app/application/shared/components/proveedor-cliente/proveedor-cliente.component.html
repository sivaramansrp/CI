<div class="page">
  <ng-titulo titulo="Proveedor Cliente" />
  <form [formGroup]="formularioProveedorCliente">
    <div class="row">
      <div class="col-md-8">
        <div class="form-group">
          <label for="descripcion" class="form-label text-start"
            >Descripción Comercial:</label
          >
          <textarea
            id="descripcion"
            class="form-control"
            style="height: 60%; resize: none"
            formControlName="descripcionComercial"
          ></textarea>
        </div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-4">
        <div class="form-group">
          <app-catalogo-select
            [catalogo]="paisDestinoCatalog"
            [label]="'País destino'"
            [required]="true"
            [isDisabled]="false"
            name="paisDestino"
            formControlName="paisDestino"
            (selectionChange)="cambioPaisDestino($event)"
          ></app-catalogo-select>
        </div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="rfc">RFC/TAXID Cliente*:</label>
          <input
            class="form-control min-hgt uppercase"
            id="rfc"
            formControlName="rfc"
            type="text"
          />
        </div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="razonSocialCliente"
            >Razón social Cliente*:</label
          >
          <input
            class="form-control min-hgt uppercase"
            id="razonSocialCliente"
            formControlName="razonSocialCliente"
            type="text"
            libUppercase
          />
        </div>
      </div>
    </div>
  </form>

  <div class="row justify-content-end">
    <button
      type="button"
      class="btn btn-danger col-auto mt-3 me-3"
      (click)="limpar()"
    >
      Limpar
    </button>

    <button
      type="button"
      class="btn btn-primary col-auto pull-right float-end mt-3"
      (click)="aggregar()"
    >
      Agregar
    </button>
  </div>

  <div class="row mt-5">
    <app-tabla-dinamica
      [tipoSeleccionTabla]="tablaSeleccion"
      [configuracionTabla]="PROVEEDOR_CLIENTE_TABLA_CONFIG"
      [datos]="proveedorClienteTablsDatos"
      (listaDeFilaSeleccionada)="proveedorClienteSeleccinados($event)"
    ></app-tabla-dinamica>
  </div>

  <div class="row justify-content-end">
    <button
      type="button"
      class="btn btn-danger col-auto mt-3 me-3"
      (click)="elimiar()"
    >
      Eliminar
    </button>

    <button
      type="button"
      class="btn btn-primary col-auto pull-right float-end mt-3 ml-3"
      (click)="eidtar()"
    >
      Editar
    </button>
  </div>

  <div class="row justify-content-end">
    <button
      type="button"
      class="btn btn-primary col-auto pull-right float-end mt-3"
      (click)="regrsarAnnexoI()"
    >
      Regresar
    </button>
  </div>
</div>
@if (agregarNotification) {
<section>
    <lib-notificaciones [notificacionInput]="agregarNotification">
    </lib-notificaciones>
</section>
}
