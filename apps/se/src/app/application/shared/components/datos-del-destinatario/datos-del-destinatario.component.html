<div class="container">
    <form [formGroup]="formDatosDelDestinatario">
        <div class="row mt-5">
            <ng-titulo titulo="Datos del destinatario" />
            <div class="col-md-4 form-group">
              <label class="form-label" for="nombres">Nombre(s):</label>
              <input type="text" id="nombres" class="form-control" formControlName="nombres" />
            </div>
      
            <div class="col-md-4 form-group">
              <label class="form-label" for="primerApellido">Primer apellido:</label>
              <input type="text" id="primerApellido" class="form-control" formControlName="primerApellido" />
            </div>
      
            <div class="col-md-4 form-group">
              <label class="form-label" for="segundoApellido"
                >Segundo apellido:</label
              >
              <input type="text" id="segundoApellido" class="form-control" formControlName="segundoApellido" />
            </div>
      
            <div class="col-md-4 form-group">
              <label class="form-label" for="numeroDeRegistroFiscal"
                >Numero de registro fiscal:</label
              >
              <input type="text" id="numeroDeRegistroFiscal" class="form-control" formControlName="numeroDeRegistroFiscal" />
            </div>
      
            <div class="col-md-8 form-group">
              <label class="form-label" for="razonSocial">Razon social:</label>
              <input type="text" id="razonSocial" class="form-control" formControlName="razonSocial" />
            </div>
          </div>
    </form>
</div>
