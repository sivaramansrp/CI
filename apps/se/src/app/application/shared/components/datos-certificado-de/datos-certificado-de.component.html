<div>
    <form [formGroup]="formDatosCertificado">
      <ng-titulo titulo="Datos del certificado" />
  
      <div class="row">
        <div class="col-md-8">
          <label for="justificacionDictamen" class="form-label">Observaciones:</label>
          <textarea id="justificacionDictamen" formControlName="observacionesDates" (change)="setValoresStore('formDatosCertificado','observacionesDates','setFormDatosCertificado')"   class="mb-4 h-20 w-100" placeholder="" rows="6"></textarea>
        </div>
        @if(idioma){
          <div class="col-md-8">
          <label for="presenta" class="form-label">Presenta:</label>
          <textarea id="presenta" formControlName="presenta" (change)="setValoresStore('formDatosCertificado','presenta','setPresenta')"   class="mb-4 h-20 w-100" placeholder="" rows="6"></textarea>
        </div>

           }
        @if(idioma){
          <div class="row mb-3">
            <div class="col-md-6">
              <app-catalogo-select [label]="'Idioma'" [catalogo]="idiomaDatos || []" 
              [required]="true" name="estado" formControlName="idiomaDates" (change)="setValoresStore('formDatosCertificado','idiomaDates','setFormDatosCertificado')"
              (selectionChange)="idiomaSeleccion($event)"></app-catalogo-select>
            </div>
          </div>
        }
        @if(precisa){
          <div class="col-md-8">
            <label for="Precisa" class="form-label">Precisa*:</label>
            <textarea id="Precisa" formControlName="precisaDates" (change)="setValoresStore('formDatosCertificado','precisaDates','setFormDatosCertificado')"  class="mb-4 h-20 w-100" placeholder="" rows="6" required="true"></textarea>
          </div>
        }
        <div class="row">
          <ng-titulo titulo="Representación federal" />
          <div class="col-md-6">
            <app-catalogo-select [isDisabled]="esFormularioSoloLectura" [label]="'Entidad federativa'" [catalogo]="entidadFederativaDatos || []" 
            [required]="true" name="estado" formControlName="EntidadFederativaDates"
            (selectionChange)="entidadFederativaSeleccion($event)"  (change)="setValoresStore('formDatosCertificado','EntidadFederativaDates','setFormDatosCertificado')"></app-catalogo-select>
          </div>
          <div class="col-md-6">
            <app-catalogo-select [isDisabled]="esFormularioSoloLectura" [label]="'Representación federal'"  [catalogo]="representacionFederalDatos || []" 
            [required]="true" name="estado" formControlName="representacionFederalDates"
            (selectionChange)="representacionFederalSeleccion($event)"  (change)="setValoresStore('formDatosCertificado','EntidadFederativaDates','setFormDatosCertificado')"></app-catalogo-select>
          </div>
        </div>
      </div>
    </form>
  </div>
