<div class="container">
    <div class="row mt-5">
        <ng-titulo [titulo]="'Acuses y resoluciones'"></ng-titulo>
    </div>
    <ng-alert [CONTENIDO]="alertaNotificacion" [CUSTOMECLASS]="infoAlert"></ng-alert>
    <div>
        <div class="row mt-5">
            @if(banderaVista === "Resolucion"){
                <ng-titulo [titulo]="'Resolución(es)'"></ng-titulo>
            }@else {
                <ng-titulo [titulo]="'Acuse(s)'"></ng-titulo>
            }
        </div>
        <div class="row">
            <div class="col-md-12">
                <table class="table table-striped">
                    <thead>
                        <tr class="table-header">
                            @for (item of encabezadoTablaResolucion; track $index) {
                            <th>{{ item.valor }}</th>
                            }
                            <th class="center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (row of datosTabla; track $index) {
                        <tr class="table-row">
                            @for (item of encabezadoTablaResolucion; let i = $index; track $index) {
                            <td>{{ row[item.key] }}</td>
                            }
                            <td class="center">
                                <button type="button" class="btn btn-link me-2" id="descargarPdfResol"
                                    data-bs-toggle="button" data-bs-placement="top" title="Ver Documento"
                                    (click)="descargarPdfResolucion(row.urlPdf)">
                                    <i class="bi bi-download bi-c text-gray"></i>
                                </button>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
