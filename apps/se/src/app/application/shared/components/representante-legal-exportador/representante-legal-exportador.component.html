<!--Datos del representante legal del exportador-->
<ng-titulo titulo="Datos del representante legal del exportador"/>

<div class="row" [formGroup]="form">
  @for(campo of campos; track $index) {
  <div [ngClass]="campo.columna" class="form-group">
    <label [for]="campo.nombre">
      {{ campo.label }}@if (campo.required) {<span for="asterisk">*: </span>}
      @if (campo.tooltip) {
      <span [tooltip]="campo.tooltip" placement="top">
        <i class="bi bi-question-circle-fill mx-2"></i>
      </span>
      }
    </label>

    @if (campo.tipo === 'text') {
    <input
      [type]="campo.tipo"
      class="form-control"
      [formControlName]="campo.nombre"
      [id]="campo.nombre"
      (change)="
        setValoresStore('form', campo.nombre, campo.storeStateName ?? '')
      "
      [maxlength]="campo.maxlength ?? ''"
    />
    } @if (campo.tipo === 'dropdown') {
    <app-catalogo-select
      [catalogo]="paisDestinoCatalog"
      [label]="campo.label"
      [required]="campo.required ?? false"
      name="campo.nombre"
      formControlName="campo.nombre"
      (change)="cambioPaisDestino()"
    ></app-catalogo-select>
    } @if (form.get(campo.nombre)?.touched && form.get(campo.nombre)?.invalid) {
    <div class="mensaje-error">Este campo es obligatorio</div>
    }
  </div>
  }
</div>
