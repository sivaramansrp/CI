<div class="container">
  <ng-titulo [titulo]="'Complemento de planta'"></ng-titulo>
 
    <form [formGroup]="complementarForm">
      <div class="form">
  <div class="row">
    <div class="col-md-6">
       <div class="form-group">
      <app-catalogo-select
        [catalogo]="permaneceraMercanciaProgramaOptions"
        [label]="'Permanecerá mercancía al amparo del programa'"
        [required]="true"
        name="estado"
        formControlName="permanecera" (change)="setValoresStore(complementarForm, 'permanecera', 'setPermanecera')"
      
      ></app-catalogo-select>
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
      <app-catalogo-select
        [catalogo]="documentoOptions"
        [label]="'Tipo de documento'"
        [required]="true"
        name="estado"
        formControlName="tipo" (change)="setValoresStore(complementarForm, 'tipo', 'setTipo')"
      ></app-catalogo-select>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4">
      <div class="form-group">
        <input-fecha [datos]="fetchaDeFirma" [setFecha]="complementarForm.get('fechaDeFirma')?.value" (valorCambiado)="cambioFechaFinal($event)"></input-fecha>
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <input-fecha [datos]="fetchaDeFinDeVigencia" [setFecha]="complementarForm.get('fetchaDeFinDeVigencia')?.value" (valorCambiado)="cambioFechaFinale($event)"></input-fecha>
      </div>
    </div>
  </div>
  <div class="row mt-5">
    <div class="col-12 container text-end mt-5">
      <button class="btn btn-default me-2">Limpiar</button>
      <button class="btn btn-primary">Agregar Complemento</button>
    </div>
  </div>
  <div class="row mt-5">
    <h6>Complemento de planta</h6>
    <app-tabla-dinamica
      [configuracionTabla]="complementoDePlantaEncabezado"
      [tipoSeleccionTabla]="complecomplementoDePlantaTableSelection"
      [datos]="complementoDePlantaDatos"
    ></app-tabla-dinamica>
  </div>
  <div class="row mt-5">
    <div class="col-12 container text-end mt-5 mb-5">
      <button class="btn btn-default me-2" (click)="regrasar()">
        Regresar a plantas
      </button>
    </div>
  </div>
</div>
    </form>
</div>
