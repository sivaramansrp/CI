<div class="row">
  <div class="col-md-12">
    <ng-titulo titulo="Datos de los socios y/o accionistas" />
    <app-tabla-dinamica
      [configuracionTabla]="configuracionSocios"
      [datos]="datosSocios"
    ></app-tabla-dinamica>
  </div>

  <div class="col-md-12">
    <ng-titulo titulo="Datos de los federatarios" />
    <app-tabla-dinamica
      [configuracionTabla]="configuracionFederetios"
      [datos]="datosFederetarios"
    ></app-tabla-dinamica>
  </div>

  <div class="col-md-12">
    <ng-titulo
      titulo="Datos de las plantas donde se realizarán las operaciones IMMEX"
    />
    <app-tabla-dinamica
      [configuracionTabla]="configuracionOperacion"
      [datos]="datosOperacions"
    ></app-tabla-dinamica>
  </div>

  @if (procedimiento === 80302 || procedimiento === 80303 || procedimiento ===
  80308) {
  <div class="col-md-12">
    <ng-titulo titulo="Empresas submanufactureras" />
    <app-tabla-dinamica
      [configuracionTabla]="configuracionEmpresas"
      [datos]="datosEmpresas"
    ></app-tabla-dinamica>
  </div>

  <div class="col-md-12">
    <ng-titulo titulo="Planta manufactureras" />
    <app-tabla-dinamica
      [configuracionTabla]="configuracionPlanta"
      [datos]="datosPlanta"
    ></app-tabla-dinamica>
  </div>
  }

  <div class="col-md-12">
    <ng-titulo titulo="Servicios Immex" />
    <app-tabla-dinamica
      [configuracionTabla]="configuracionServiciosImmex"
      [datos]="datosServiciosImmex"
    ></app-tabla-dinamica>
  </div>

  <div class="col-md-12">
    <ng-titulo titulo="Datos de la certificación ante el SAT" />

    <form [formGroup]="certificionForm" class="mb-5">
      <div class="row">
        <label class="form-label col-md-4 text-start" for="certificion"
          >Certificada (Si/NO)</label
        >
        <input
          class="form-control col-md-4"
          type="text"
          id="certificion"
          formControlName="certificion"
        />
      </div>
    </form>
  </div>
</div>
