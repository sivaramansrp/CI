<div class="container">
  <form [formGroup]="form">
    <ng-titulo titulo="Datos de la mercancía"></ng-titulo>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label for="producto">Producto*:</label>
          <app-input-radio
            [radioOptions]="productoOpciones"
            formControlName="producto"
            [isRequired]="true"
            (valueChange)="setValoresStore(form, 'producto')"
            [layout]="'vertical'"
          ></app-input-radio>
        </div>
      </div>
      <div class="col-md-8">
        <label for="descripcion" class="form-label">Descripción de la mercancía*:</label>
        <textarea
          id="descripcion"
          class="form-control mb-5"
          rows="8"
          formControlName="descripcion"
          (change)="setValoresStore(form, 'descripcion')"
        ></textarea>
        <div *ngIf="esInvalido('descripcion')" class="text-danger">
          <small *ngIf="form.controls['descripcion'].errors?.['required']">
            Este campo es obligatorio.
          </small>
          <small *ngIf="form.controls['descripcion'].errors?.['minlength']">
            Debe tener al menos 10 caracteres.
          </small>
          <small *ngIf="form.controls['descripcion'].errors?.['maxlength']">
            No puede exceder 500 caracteres.
          </small>
        </div>
      </div>
    </div>
    <div class="form-group">
      <app-catalogo-select
        [catalogo]="fraccionCatalogo"
        [label]="'Fracción arancelaria'"
        [required]="true"
        formControlName="fraccion"
        (change)="setValoresStore(form, 'fraccion')"
        [isDisabled]="esFormularioSoloLectura"
      ></app-catalogo-select>
    </div>
    <div class="row">
      <div class="col-md-4 form-group">
        <label class="form-label" for="cantidad">Cantidad<span class="require">*</span>:</label>
        <input
          class="form-control"
          id="cantidad"
          placeholder=""
          type="text"
          formControlName="cantidad"
          (change)="setValoresStore(form, 'cantidad')"
        />
        <div *ngIf="esInvalido('cantidad')" class="text-danger">
          <small *ngIf="form.controls['cantidad'].errors?.['required']">
            Este campo es obligatorio.
          </small>
          <small *ngIf="form.controls['cantidad'].errors?.['pattern']">
            Solo se permiten números.
          </small>
          <small *ngIf="form.controls['cantidad'].errors?.['min']">
            Debe ser mayor que 0.
          </small>
        </div>
      </div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="valorFacturaUSD">Valor factura USD<span class="require">*</span>:</label>
        <span class="bi bi-question-circle-fill"
        title="En caso de no contar con valor factura proporciona el valor estimado"
        data-bs-toggle="tooltip"></span>
        <input
          class="form-control"
          id="valorFacturaUSD"
          placeholder=""
          type="text"
          formControlName="valorFacturaUSD"
          (change)="setValoresStore(form, 'valorFacturaUSD')"
        />
        <div *ngIf="esInvalido('valorFacturaUSD')" class="text-danger">
          <small *ngIf="form.controls['valorFacturaUSD'].errors?.['required']">
            Este campo es obligatorio.
          </small>
          <small *ngIf="form.controls['valorFacturaUSD'].errors?.['pattern']">
            Ingrese un valor numérico válido (ej. 100.50).
          </small>
          <small *ngIf="form.controls['valorFacturaUSD'].errors?.['min']">
            Debe ser mayor que 0.
          </small>
        </div>
      </div>
      <div class="col-md-4 form-group">
        <app-catalogo-select
          [catalogo]="unidadCatalogo"
          [label]="'UMT'"
          [required]="true"
          formControlName="unidadMedida"
          [tooltipQuestionCircle]="true"
          (change)="setValoresStore(form, 'unidadMedida')"
          [isDisabled]="esFormularioSoloLectura"
        ></app-catalogo-select>
      </div>
    </div>
  </form>
</div>
