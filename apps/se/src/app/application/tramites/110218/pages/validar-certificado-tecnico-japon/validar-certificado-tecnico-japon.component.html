<div class="page">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h1>Validar por motivos técnicos el certificado 
            Japón </h1>
        </div>
        <app-wizard [listaPasos]="pasosSolicitar"></app-wizard>
      </div>
  
      <div class="row">
        @switch(indice){
            @case(1){
                <app-solicitante-tabs></app-solicitante-tabs>
            }@case(2){
                <p>2</p>
            }@case(3){
                <p>3</p>
            }@case(4){  
                <p>4</p>
            }
        }
        <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    </div>
  </div>
