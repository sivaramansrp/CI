<div class="container">
    <div>
        <ng-titulo titulo="Datos del certificado"></ng-titulo>
        <form [formGroup]="datosdelcertificado">
            <div class="row">
                <div class="col-md-12">
                    <label class="form-label" for="lugar">Lugar *: </label>
                    <input type="text" class="form-control bg-white" id="lugar" formControlName="lugar" (change)="onDatosdelcertificadoChange('lugar')">
                </div>
                <div class="col-md-12">
                    <label class="form-label" for="observaciones">Observaciones:</label>
                    <textarea type="text" class="form-control custom-textarea bg-white" id="observaciones"
                        formControlName="observaciones" (change)="onDatosdelcertificadoChange('observaciones')"></textarea>
                </div>

            </div>
        </form>


    </div>
    <h6>Mercancías seleccionadas</h6>
    <app-tabla-dinamica [configuracionTabla]="configTableArray" [datos]="datos" [tipoSeleccionTabla]="tableradio"
        (filaSeleccionada)="handleFilaSeleccionada($event)"
        (listaDeFilaSeleccionada)="handleListaDeFilaSeleccionada($event)">
    </app-tabla-dinamica>
</div>
