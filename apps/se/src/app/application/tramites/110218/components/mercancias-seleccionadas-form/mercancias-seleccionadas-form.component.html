<div class="container modify">
    <form [formGroup]="modifydatosdelcertificado">
        <div class="row">
            <div class="col-md-12">
                <label class="form-label" for="nombreComercial">Nombre comercial:  </label>
                <input type="text" class="form-control" id="nombreComercial" formControlName="nombreComercial" readonly>
            </div>
            <div class="col-md-12">
                <label class="form-label" for="nombreIngles">Nombre en inglés: </label>
                <input type="text" class="form-control" id="nombreIngles"
                    formControlName="nombreIngles" readonly>
            </div>
            <div class="col-md-12">
                <label class="form-label" for="complementoDelaDescripcion">Complemento de la descripción:  </label>
                <input type="text" class="form-control bg-white" id="complementoDelaDescripcion"
                    formControlName="complementoDelaDescripcion" placeholder="complemento de prueba" (change)="onMercanciaSeleccionadasChange('complementoDelaDescripcion')">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="marca">Marca: </label>
                <input type="text" class="form-control bg-white" id="marca"
                    formControlName="marca" (change)="onMercanciaSeleccionadasChange('marca')" placeholder="marca de la prueba de japon ">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="valorMercancia">Valor mercancía: </label>
                <input type="text" class="form-control bg-white" id="valorMercancia"
                    formControlName="valorMercancia" (change)="onMercanciaSeleccionadasChange('valorMercancia')" placeholder="50000.0000 ">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="cantidad">Cantidad: </label>
                <input type="text" class="form-control" id="cantidad"
                    formControlName="cantidad" readonly>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="unidaddeMedidadeComercializacionOptions" formControlName="unidaddeMedidadeComercializacion"
            name="unidaddeMedidadeComercializacion" [label]="'Unidad de medida de comercialización'" class="Unidadformlabel" (change)="onChangeUnidadMedida()"></app-catalogo-select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label" for="numerodeFactura">Número de factura: </label>
                <input type="text" class="form-control bg-white" id="numerodeFactura"
                    formControlName="numerodeFactura" (change)="onMercanciaSeleccionadasChange('numerodeFactura')" placeholder="fact12345">
            </div>
            <div class="col-md-4">
                    <app-catalogo-select [catalogo]="tipodeFacturaOptions" formControlName="tipodeFactura" [label]="'Tipo de factura'"
                   name="tipodeFactura" (change)="onChangeTipodeFactura()"></app-catalogo-select>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="fechadelaFactura">Fecha de la factura: </label>
                <input type="text" class="form-control" id="fechadelaFactura"
                    formControlName="fechadelaFactura" readonly>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-4 p-5">
            <button type="button" class="btn btn-default" disabled>Cancelar</button>
            <button type="button" class="btn btn-primary ms-3" (click)="modificarSuccess()">Modificar</button>
        </div>
    </form>
</div>
