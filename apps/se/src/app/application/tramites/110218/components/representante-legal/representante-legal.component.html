<div class="container">
  <div>
    <ng-titulo titulo="Datos del representante legal del exportador"></ng-titulo>

    <form [formGroup]="datosdelexportador" novalidate>
      <div class="row">
        <div class="col-md-12">
          <label class="form-label" for="nombredelRepresentante">Nombre del representante legal del exportador
            *:</label>
          <input type="text" class="form-control bg-white" id="nombredelRepresentante"
            placeholder="Ingrese el nombre del representante" formControlName="nombredelRepresentante"
            [class.is-invalid]="datosdelexportador.get('nombredelRepresentante')?.touched && datosdelexportador.get('nombredelRepresentante')?.invalid" />
          <div class="invalid-feedback"
            *ngIf="datosdelexportador.get('nombredelRepresentante')?.touched && datosdelexportador.get('nombredelRepresentante')?.invalid">
            <small *ngIf="datosdelexportador.get('nombredelRepresentante')?.hasError('required')">Este campo es
              obligatorio.</small>
            <small *ngIf="datosdelexportador.get('nombredelRepresentante')?.hasError('pattern')">Corrija el nombre de la
              persona.</small>
          </div>
        </div>

        <div class="col-md-8">
          <label class="form-label" for="empresa">Empresa *:</label>
          <input type="text" class="form-control" id="empresa" formControlName="empresa" readonly>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="cargo">Cargo *:</label>
          <input type="text" class="form-control bg-white" id="cargo" placeholder="Ingrese el cargo"
            formControlName="cargo"
            [class.is-invalid]="datosdelexportador.get('cargo')?.touched && datosdelexportador.get('cargo')?.invalid" />
          <div class="invalid-feedback"
            *ngIf="datosdelexportador.get('cargo')?.touched && datosdelexportador.get('cargo')?.invalid">
            <small>Este campo es obligatorio.</small>
          </div>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="teléfonos">Teléfono *:</label>
          <input type="text" class="form-control bg-white" id="teléfonos" placeholder="Ingrese el teléfono"
            formControlName="teléfonos"
            [class.is-invalid]="datosdelexportador.get('teléfonos')?.touched && datosdelexportador.get('teléfonos')?.invalid" />
          <div class="invalid-feedback"
            *ngIf="datosdelexportador.get('teléfonos')?.touched && datosdelexportador.get('teléfonos')?.invalid">
            <small *ngIf="datosdelexportador.get('teléfonos')?.hasError('required')">Este campo es obligatorio.</small>
            <small *ngIf="datosdelexportador.get('teléfonos')?.hasError('pattern')">Ingrese solo dígitos.</small>
          </div>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="faxs">Fax *:</label>
          <input type="text" class="form-control bg-white" id="faxs" placeholder="Ingrese el fax" formControlName="faxs"
            [class.is-invalid]="datosdelexportador.get('faxs')?.touched && datosdelexportador.get('faxs')?.invalid" />
          <div class="invalid-feedback"
            *ngIf="datosdelexportador.get('faxs')?.touched && datosdelexportador.get('faxs')?.invalid">
            <small *ngIf="datosdelexportador.get('faxs')?.hasError('required')">Este campo es obligatorio.</small>
            <small *ngIf="datosdelexportador.get('faxs')?.hasError('pattern')">Ingrese solo dígitos.</small>
          </div>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="correoElectronico">Correo electrónico *:</label>
          <input type="text" class="form-control bg-white" id="correoElectronico"
            placeholder="Ingrese su correo electrónico" formControlName="correoElectronico"
            [class.is-invalid]="datosdelexportador.get('correoElectronico')?.touched && datosdelexportador.get('correoElectronico')?.invalid" />
          <div class="invalid-feedback"
            *ngIf="datosdelexportador.get('correoElectronico')?.touched && datosdelexportador.get('correoElectronico')?.invalid">
            <small *ngIf="datosdelexportador.get('correoElectronico')?.hasError('required')">Este campo es
              obligatorio.</small>
            <small *ngIf="datosdelexportador.get('correoElectronico')?.hasError('email')">Ingrese una dirección de
              correo válida.</small>
          </div>
        </div>

      </div>
    </form>

  </div>
</div>
