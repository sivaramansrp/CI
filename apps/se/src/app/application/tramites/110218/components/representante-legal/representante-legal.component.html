<div class="container">
    <div>
      <ng-titulo
        titulo="Datos del representante legal del exportador"
      ></ng-titulo>
      <form [formGroup]="datosdelexportador">
        <div class="row">
          <div class="col-md-12">
            <label class="form-label" for="nombredelRepresentante">Nombre del representante legal del exportador *: </label>
            <input type="text" class="form-control bg-white" placeholder="Jose Alberto martinez juarez" id="nombredelRepresentante" formControlName="nombredelRepresentante" (change)="onDatosdelexportadorChange('nombredelRepresentante')">
          </div>
          <div class="col-md-8">
            <label class="form-label" for="empresa">Empresa *:</label>
            <input type="text" class="form-control" id="empresa" formControlName="empresa" readonly>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="cargo">Cargo *:</label>
            <input type="text" class="form-control bg-white" id="cargo" placeholder="REPRESENTANTE LEGA" formControlName="cargo" (change)="onDatosdelexportadorChange('cargo')">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="teléfonos">Teléfono *:</label>
            <input type="text" class="form-control bg-white" id="teléfonos" placeholder="5646844" formControlName="teléfonos" (change)="onDatosdelexportadorChange('teléfonos')">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="faxs">Fax *:</label>
            <input type="text" class="form-control bg-white" id="faxs" placeholder="49887498789" formControlName="faxs" (change)="onDatosdelexportadorChange('faxs')">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="correoElectrónicos">Correo electrónico *:</label>
            <input type="text" class="form-control bg-white" id="correoElectrónicos" placeholder="Ultra@correo.com" formControlName="correoElectrónicos" (change)="onDatosdelexportadorChange('correoElectrónicos')">
          </div>
          
        </div>
        </form>
    </div>
</div>
