<div class="container">
    <div>
      <ng-titulo
        titulo="Detalles del transporte"
      ></ng-titulo>
      <form [formGroup]="detallestransporte" novalidate>
        <div class="row">
         
          <div class="col-md-4">
            <label class="form-label" for="puertodeEmbarque">Puerto de embarque:</label>
            <input 
              type="text" class="form-control" id="puertodeEmbarque" 
              placeholder="Veracruz" formControlName="puertodeEmbarque"
              [class.is-invalid]="detallestransporte.get('puertodeEmbarque')?.touched && detallestransporte.get('puertodeEmbarque')?.invalid"
              (change)="onDetallestransporteChange('puertodeEmbarque')">
            <div class="invalid-feedback">
              Corrija el nombre.
            </div>
          </div>
      
          <div class="col-md-4">
            <label class="form-label" for="puertodeDesembarque">Puerto de desembarque:</label>
            <input 
              type="text" class="form-control" id="puertodeDesembarque" 
              placeholder="Mexico" formControlName="puertodeDesembarque"
              [class.is-invalid]="detallestransporte.get('puertodeDesembarque')?.touched && detallestransporte.get('puertodeDesembarque')?.invalid"
              (change)="onDetallestransporteChange('puertodeDesembarque')">
            <div class="invalid-feedback">
              Corrija el nombre.
            </div>
          </div>
      
          <div class="col-md-4">
            <label class="form-label" for="puertodeTránsito">Puerto de tránsito:</label>
            <input 
              type="text" class="form-control" id="puertodeTránsito" 
              placeholder="Veracruz norte" formControlName="puertodeTránsito"
              [class.is-invalid]="detallestransporte.get('puertodeTránsito')?.touched && detallestransporte.get('puertodeTránsito')?.invalid"
              (change)="onDetallestransporteChange('puertodeTránsito')">
            <div class="invalid-feedback">
              Corrija el nombre.
            </div>
          </div>
      
         
          <div class="col-md-4">
            <label class="form-label" for="nombredelaEmbarcación">Nombre de la embarcación:</label>
            <input 
              type="text" class="form-control" id="nombredelaEmbarcación" 
              placeholder="Puerto Boca" formControlName="nombredelaEmbarcación"
              [class.is-invalid]="detallestransporte.get('nombredelaEmbarcación')?.touched && detallestransporte.get('nombredelaEmbarcación')?.invalid"
              (change)="onDetallestransporteChange('nombredelaEmbarcación')">
            <div class="invalid-feedback">
              Corrija el nombre.
            </div>
          </div>
      
         <div class="col-md-4">
            <label class="form-label" for="númerodeVuelo">Número de vuelo:</label>
            <input 
              type="text" class="form-control" id="númerodeVuelo" 
              placeholder="0115 I" formControlName="númerodeVuelo"
              [class.is-invalid]="detallestransporte.get('númerodeVuelo')?.touched && detallestransporte.get('númerodeVuelo')?.invalid"
              (change)="onDetallestransporteChange('númerodeVuelo')">
            <div class="invalid-feedback">
              Ingrese solo dígitos.
            </div>
          </div>
      
        </div>
      </form>
     
    </div>
</div>
