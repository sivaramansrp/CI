<div class="container">
    <div>
        <ng-titulo titulo="Datos del destinatario"></ng-titulo>

        <form [formGroup]="datosDelDestinatario" novalidate>
            <div class="row">

                <div class="col-md-4">
                    <label class="form-label" for="nombre">Nombre(s)*:</label>
                    <input type="text" class="form-control bg-white" id="nombre" formControlName="nombre"
                        [class.is-invalid]="datosDelDestinatario.get('nombre')?.touched && datosDelDestinatario.get('nombre')?.invalid"
                        (change)="setValorStore(datosDelDestinatario,'nombre')">
                    <div class="invalid-feedback">
                        Corrija el nombre.
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="primerApellido">Primer apellido*:</label>
                    <input type="text" class="form-control bg-white" id="primerApellido" formControlName="primerApellido"
                        [class.is-invalid]="datosDelDestinatario.get('primerApellido')?.touched && datosDelDestinatario.get('primerApellido')?.invalid"
                        (change)="setValorStore(datosDelDestinatario,'primerApellido')">
                    <div class="invalid-feedback">
                        Corrija el nombre.
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="segundoApellido">Segundo apellido*:</label>
                    <input type="text" class="form-control bg-white" id="segundoApellido" formControlName="segundoApellido" [class.is-invalid]="datosDelDestinatario.get('segundoApellido')?.touched && datosDelDestinatario.get('segundoApellido')?.invalid"
                        (change)="setValorStore(datosDelDestinatario,'segundoApellido')">
                    <div class="invalid-feedback">
                        Este campo es obligatorio.
                    </div>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="numeroderegistroFiscal">Número de registro fiscal*:</label>
                    <input type="text" class="form-control bg-white" id="numeroderegistroFiscal"
                        placeholder="12867612783" formControlName="numeroderegistroFiscal"
                        [class.is-invalid]="datosDelDestinatario.get('numeroderegistroFiscal')?.touched && datosDelDestinatario.get('numeroderegistroFiscal')?.invalid"
                        (change)="setValorStore(datosDelDestinatario,'numeroderegistroFiscal')">
                    <div class="invalid-feedback">
                        Corrija el RFC.
                    </div>
                </div>

                <div class="col-md-8">
                    <label class="form-label" for="razonSocial">Razón social*:</label>
                    <input type="text" class="form-control bg-white" id="razonSocial" formControlName="razonSocial"
                        [class.is-invalid]="datosDelDestinatario.get('razonSocial')?.touched && datosDelDestinatario.get('razonSocial')?.invalid"
                        (change)="setValorStore(datosDelDestinatario,'razonSocial')">
                    <div class="invalid-feedback">
                        Este campo es obligatorio.
                    </div>
                </div>

            </div>
        </form>

    </div>
</div>
<div class="container">
    <div>
        <ng-titulo titulo="Domicilio del destinatario"></ng-titulo>
        <form [formGroup]="domicilioDelDestinatario" novalidate>
            <div class="row">

                <div class="col-md-8">
                    <label class="form-label" for="calle">Calle*:</label>
                    <input type="text" class="form-control bg-white" id="calle" placeholder="CALLE"
                        formControlName="calle"
                        [class.is-invalid]="domicilioDelDestinatario.get('calle')?.touched && domicilioDelDestinatario.get('calle')?.invalid"
                        (change)="setValorStore(domicilioDelDestinatario,'calle')">
                    <div class="invalid-feedback">Este campo es obligatorio.</div>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="numeroLetra">Número y/o letra*:</label>
                    <input type="text" class="form-control bg-white" id="numeroLetra" placeholder="NUMERO"
                        formControlName="numeroLetra"
                        [class.is-invalid]="domicilioDelDestinatario.get('numeroLetra')?.touched && domicilioDelDestinatario.get('numeroLetra')?.invalid"
                        (change)="setValorStore(domicilioDelDestinatario,'numeroLetra')">
                    <div class="invalid-feedback">Este campo es obligatorio.</div>
                </div>

                <div class="col-md-8">
                    <label class="form-label" for="ciudad">Ciudad (población, estado o provincia) *:</label>
                    <input type="text" class="form-control bg-white" id="ciudad" placeholder="CIUDAD"
                        formControlName="ciudad"
                        [class.is-invalid]="domicilioDelDestinatario.get('ciudad')?.touched && domicilioDelDestinatario.get('ciudad')?.invalid"
                        (change)="setValorStore(domicilioDelDestinatario,'ciudad')">
                    <div class="invalid-feedback">Este campo es obligatorio.</div>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="correoElectronico">Correo electrónico*:</label>
                    <input type="email" class="form-control bg-white" id="correoElectronico"
                        placeholder="correo@correo.com" formControlName="correoElectronico"
                        [class.is-invalid]="domicilioDelDestinatario.get('correoElectronico')?.touched && domicilioDelDestinatario.get('correoElectronico')?.invalid"
                        (change)="setValorStore(domicilioDelDestinatario,'correoElectronico')">
                    <div class="invalid-feedback">Ingrese una dirección de correo válida.</div>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="fax">Fax:</label>
                    <input type="text" class="form-control bg-white" id="fax" placeholder="546456" formControlName="fax"
                        (change)="setValorStore(domicilioDelDestinatario,'fax')">
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="telefono">Teléfono:</label>
                    <input type="text" class="form-control bg-white" id="telefono" placeholder="5555687"
                        formControlName="telefono" (change)="setValorStore(domicilioDelDestinatario,'telefono')">
                   
                </div>

            </div>
        </form>


    </div>
</div>
