<div class="container">
    <div>
        <ng-titulo titulo="Datos del destinatario"></ng-titulo>
        <form [formGroup]="datosdeldestinatario">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label" for="nombre">Nombre(s): </label>
                    <input type="text" class="form-control" id="nombre" formControlName="nombre" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="primerApellido">Primer apellido:</label>
                    <input type="text" class="form-control" id="primerApellido" formControlName="primerApellido"
                        readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="segundoApellido">Segundo apellido:</label>
                    <input type="text" class="form-control" id="segundoApellido" formControlName="segundoApellido"
                        readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="númeroderegistroFiscal">Número de registro fiscal *: </label>
                    <input type="text" class="form-control" id="númeroderegistroFiscal"
                        formControlName="númeroderegistroFiscal" readonly>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="razónSocial">Razón social:</label>
                    <input type="text" class="form-control" id="razónSocial" formControlName="razónSocial" readonly>
                </div>

            </div>
        </form>
    </div>
</div>
<div class="container">
    <div>
        <ng-titulo titulo="Domicilio del destinatario"></ng-titulo>
        <form [formGroup]="domiciliodeldestinatario">
            <div class="row">
                <div class="col-md-8">
                    <label class="form-label bg-white" for="calle">Calle *: </label>
                    <input type="text" class="form-control" id="calle" formControlName="calle">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="númeroLetra">Número y/o letra *:</label>
                    <input type="text" class="form-control" id="númeroLetra" formControlName="númeroLetra"
                        readonly>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="ciudad">Ciudad (población, estado o provincia) *:</label>
                    <input type="text" class="form-control" id="ciudad" formControlName="ciudad"
                        readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="correoElectrónico">Correo electrónico *:</label>
                    <input type="text" class="form-control" id="correoElectrónico"
                        formControlName="correoElectrónico" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="fax">Fax:</label>
                    <input type="text" class="form-control" id="fax" formControlName="fax" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="teléfono">Teléfono:</label>
                    <input type="text" class="form-control" id="teléfono" formControlName="teléfono" readonly>
                </div>

            </div>
        </form>
    </div>
</div>
