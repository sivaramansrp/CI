<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a
          data-toggle="tab"
          tabindex="0"
          (keyup)="seleccionaTab(1)"
          (click)="seleccionaTab(1)"
          >Solicitante</a
        >
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a
          data-toggle="tab"
          tabindex="0"
          (keyup)="seleccionaTab(2)"
          (click)="seleccionaTab(2)"
          >Programas presentados por reporte anual</a
        >
      </li>
      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a
          data-toggle="tab"
          tabindex="0"
          (keyup)="seleccionaTab(3)"
          (click)="seleccionaTab(3)"
          [ngClass]="!estaHabilitado ? 'disabled-link':''"
          >Datos de reporte anual</a
        >
      </li>
    </ul>

    <ng-container>
      @switch (indice) { @case (1) { 
        <solicitante  #Solicitante></solicitante>
      } 
      @case (2) {
      <app-programas-reporte-anual (filaDeInformeSeleccionada)="getFilaDeInformeSeleccionada($event)"></app-programas-reporte-anual>
      }
      @case (3) {
      <app-datos-de-reporte-anual ></app-datos-de-reporte-anual>
      }
      }
    </ng-container>
  </div>
</div>
