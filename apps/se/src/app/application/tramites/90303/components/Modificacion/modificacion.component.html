<div class="row mt-5">
    <div class="col-md-6">
        <div class="form-group">
            <label class="form-label" for="registroFederalContribuyentes">Registro Federal de Contribuyentes:</label>
            <input class="form-control gris-color" type="text" id="registroFederalContribuyentes"
                formControlName="registroFederalContribuyentes">
        </div>
    </div>
    <div class="col-md-6">
        <div class="form-group">
            <label class="form-label" for="representacionFederal">Representación federal:</label>
            <input class="form-control gris-color" type="text" id="representacionFederal"
                formControlName="representacionFederal">
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-6">

            <label class="form-label" for="tipoModificacion">Tipo de modificación:</label>
            <input class="form-control gris-color" type="text" id="tipoModificacion" formControlName="tipoModificacion">
        </div>
    </div>
    <div class="col-md-6">
        <div class="form-group">
            <label class="form-label" for="modificacionPrograma">Modificación de programa:</label>
            <input class="form-control gris-color" type="text" id="modificacionPrograma"
                formControlName="modificacionPrograma">
        </div>
    </div>
</div>
