<div class="container">
  <ng-titulo titulo="Validación inicial del certificado de circulación de mercancías" />
  <form [formGroup]="formularioCertificado">

    <div class="row">
      <div class="col-md-12">
        <label class="form-check-label text-justify" for="tercerOperador">¿La operación se realizó con un tercer
          operador?</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="checkbox">
          <input type="checkbox" id="tercerOperador" formControlName="tercerOperador"
            (change)="setValoresStore(formularioCertificado,'tercerOperador', 'setTercerOperador')" />
          <label for="tercerOperador">&nbsp;si</label>
        </div>
      </div>
    </div>

    <div class="row" *ngIf="solicitudState?.tercerOperador">
      <ng-container formGroupName="grupoOperador" *ngIf="formularioCertificado.get('grupoOperador')">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Nombre(s):</label>
            <input type="text" class="form-control" [maxlength]="25" formControlName="nombre"
              (change)="setValoresStore(grupoOperador, 'nombre', 'setGrupoOperadorNombre');actualizarEstadoCampos()" />
          </div>
          <div class="col-md-4 mb-3">
            <label>Primer apellido:</label>
            <input type="text" [maxlength]="15" class="form-control" id="primerApellido"
              formControlName="apellidoPrimer" (click)="onClick()"
              (change)="setValoresStore(grupoOperador, 'apellidoPrimer','setGrupoOperadorApellidoPrimer');actualizarEstadoCampos()" />
          </div>
          <div class="col-md-4 mb-3">
            <label>Segundo apellido:</label>
            <input type="text" [maxlength]="15" class="form-control" id="segundoApellido"
              formControlName="apellidoSegundo" (change)="
                    setValoresStore(grupoOperador, 'apellidoSegundo', 'setGrupoOperadorSegundo');actualizarEstadoCampos()" />
          </div>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Número de registro fiscal*:</label>
            <input type="text" class="form-control" id="numeroFiscal" formControlName="numeroFiscal"
              [ngClass]="isValid(grupoOperador,'numeroFiscal') ? 'required' : ''"
              (change)="setValoresStore(grupoOperador, 'numeroFiscal', 'setGrupoOperadorNumeroFiscal')" />
              <div class="error-message col-md-12 ps-0">
                <small
                  *ngIf="formularioCertificado.get('grupoOperador.numeroFiscal')?.touched && formularioCertificado.get('grupoOperador.numeroFiscal')?.hasError('required')"
                  class="text-danger">
                  Este campo es obligatorio.
                </small>
                </div>
          </div>
          <div class="col-md-8 mb-3">
            <label>Razón social:</label>
            <input type="text" class="form-control"
              [ngClass]="{'gray-glass': grupoOperador.get('apellidoPrimer')?.value !== ''}" id="denominacion"
              [readonly]=" grupoOperador.get('apellidoPrimer')?.value !== ''" formControlName="razonSocial"
              (change)="setValoresStore(grupoOperador, 'razonSocial', 'setGrupoOperadorRazonSocial');actualizarEstadoCampos()" />
          </div>
        </div>
      </ng-container>

      <ng-titulo titulo="Domicilio del tracer operador" />
      <ng-container formGroupName="grupoDeDomicilio">
        <div class="row">
          <div class="col-md-4">
            <app-catalogo-select [catalogo]="optionsPais" [label]="'País'" [required]="true" id="pais"
              formControlName="pais" [ngClass]="isValid(grupoDeDomicilio,'pais') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'pais', 'setGrupoDeDomicilioPais')"
              [isDisabled]="soloLectura"></app-catalogo-select>
          </div>
          <div class="col-md-8 mb-3">
            <label>Ciudad (población, estado o provincia):</label>
            <input type="text" class="form-control" id="ciudad" formControlName="ciudad"
              [ngClass]="isValid(grupoDeDomicilio,'ciudad') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'ciudad','setGrupoDeDomicilioCiudad')" />
          </div>
        </div>
        <div class="row">
          <div class="col-md-8 mb-3">
            <label>Calle:</label>
            <input type="text" class="form-control" id="nombre" formControlName="calle"
              [ngClass]="isValid(grupoDeDomicilio,'calle') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'calle', 'setGrupoDeDomicilioCalle')" />
          </div>
          <div class="col-md-4 mb-3">
            <label>Número y/o letra:</label>
            <input type="text" class="form-control" id="numeroLetra" formControlName="numeroLetra"
              [ngClass]="isValid(grupoDeDomicilio,'numeroLetra') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'numeroLetra', 'setGrupoDeDomicilioNumeroLetra')" />
          </div>
        </div>
        <div class="row">
          <div class="col-md-1 mb-3">
            <label>Lada:</label>
            <input type="text" class="form-control" id="lada" formControlName="lada"
              [ngClass]="isValid(grupoDeDomicilio,'lada') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'lada', 'setGrupoDeDomicilioLada')" />
          </div>
          <div class="col-md-3 mb-3">
            <label>Teléfono:</label>
            <input type="text" class="form-control" id="telefono" formControlName="telefono"
              [ngClass]="isValid(grupoDeDomicilio,'telefono') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'telefono', 'setGrupoDeDomicilioTelefono')" />
          </div>
          <div class="col-md-4 mb-3">
            <label>Fax:</label>
            <input type="text" class="form-control" id="fax" formControlName="fax"
              [ngClass]="isValid(grupoDeDomicilio,'fax') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'fax', 'setGrupoDeDomicilioFax')" />
          </div>
          <div class="col-md-4 mb-3">
            <label>Correo electrónico:</label><span class="bi bi-question-circle-fill" title="ejemplo@dominio.com"
              data-bs-toggle="tooltip"></span>
            <input type="text" class="form-control" id="correoElectronico" formControlName="correoElectronico"
              [ngClass]="isValid(grupoDeDomicilio,'correoElectronico') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio,'correoElectronico','setGrupoDeDomicilioCorreoElectronico')" />
          </div>
        </div>
      </ng-container>
    </div>
    <ng-container formGroupName="grupoTratado">
      <div class="row">
        <ng-titulo titulo="Tratado y país o bloque" />
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="optionsTratado" [label]="'Tratado/Acuerdo'" [required]="true" id="tratado"
            formControlName="tratado" [ngClass]="isValid(grupoTratado,'tratado') ? 'required' : ''"
            (change)=" setValoresStore(grupoTratado, 'tratado', 'setGrupoTratadoTratado') "
            [isDisabled]="soloLectura"></app-catalogo-select>
        </div>
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="optionsPais" [label]="'País / Bloque'" [required]="true" id="pais"
            formControlName="pais" [ngClass]="isValid(grupoTratado,'pais') ? 'required' : ''"
            (change)="setValoresStore(grupoTratado, 'pais', 'setGrupoTratadoPais')"
            [isDisabled]="soloLectura"></app-catalogo-select>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <label>Fracción arancelaria:</label>
          <input type="number" class="form-control" formControlName="fraccionArancelaria"
            [ngClass]="isValid(grupoTratado,'fraccionArancelaria') ? 'required' : ''"
            (change)=" setValoresStore( grupoTratado, 'fraccionArancelaria', 'setGrupoTratadoFraccionArancelaria' ) " />
        </div>
        <div class="col-md-4">
          <label># Registro producto:</label>
          <input type="text" class="form-control" formControlName="numeroRegistro"
            [ngClass]="isValid(grupoTratado,'numeroRegistro') ? 'required' : ''"
            (change)=" setValoresStore( grupoTratado, 'numeroRegistro', 'setGrupoTratadoNumeroRegistro' ) " />
        </div>
        <div class="col-md-4">
          <label>Nombre comercial:</label>
          <input type="text" class="form-control" formControlName="nombreComercial"
            [ngClass]="isValid(grupoTratado,'nombreComercial') ? 'required' : ''"
            (change)=" setValoresStore( grupoTratado, 'nombreComercial', 'setGrupoTratadoNombreComercial' ) " />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-8 text-center">
          <label>Periodo</label>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <input-fecha [setFecha]="formularioCertificado.get('grupoTratado.fechaInicial')?.value"
            [datos]="fechaInicialInput" (valorCambiado)="cambioFechaInicial($event)"
            [isDisabled]="soloLectura"></input-fecha>
        </div>
        <div class="col-md-4">
          <input-fecha [setFecha]="formularioCertificado.get('grupoTratado.fechaFinal')?.value"
            [datos]="fechaFinalInput" (valorCambiado)="cambioFechaFinal($event)"
            [isDisabled]="soloLectura"></input-fecha>
        </div>
      </div>
    </ng-container>

    <div class="col-md-12 mt-5 d-flex justify-content-end">
      <button type="button" class="btn btn-primary ms-3" (click)="cargarMercanciasDisponibles()"
        [disabled]="soloLectura"> Buscar mercancías
      </button>
    </div>

    <div class="row mt-5">
      <label>Mercancías disponibles</label>
    </div>
    <ng-container>
      <div class="table-container mt-5">
        <app-tabla-dinamica [configuracionTabla]="disponiblesEncabezados" [datos]="mercanciaDisponsiblesTablaDatos"
          (filaClic)="disponiblesSeleccionDeFilas($event)"></app-tabla-dinamica>
      </div>
    </ng-container>
    <ng-titulo titulo="Carga de mercancías por archivo" />
    <div class="col-md-12 mt-5 d-flex justify-content-end">
      <button type="button" class="btn btn-primary ms-3" (click)="cargaArchivo()" [disabled]="soloLectura"> Carga por
        archivo </button>
    </div>
    <div class="row mt-5">
      <ng-alert [CONTENIDO]="TEXTO_DE_ALERTA" style="margin-top: 40px"></ng-alert>
    </div>
    <ng-container>
      <div class="row mt-5">
        <label>Mercancías seleccionadas</label>
      </div>
      <div class="table-container mt-5">
        <app-tabla-dinamica [tipoSeleccionTabla]="tablaSeleccion.RADIO" [configuracionTabla]="seleccionadasEncabezados"
          [datos]="mercanciaSeleccionadasTablaDatos" (filaSeleccionada)="seleccionDeFilas($event)"
          [disableSeleccionTablaRadio]="soloLectura" ></app-tabla-dinamica>
        <div class="col-md-12 mt-5 d-flex justify-content-end">
          <button type="button" class="btn btn-danger ms-3" (click)="eliminar()"
            [disabled]="soloLectura">Eliminar</button>
          <button type="button" class="btn btn-primary ms-3" [disabled]="soloLectura" (click)="modificarMercanciaSeleccionada(mercanciaSeleccionadasFila!)"> Modificar </button>
        </div>
      </div>
    </ng-container>

  </form>
</div>
<div class="modal fade" id="modalArchivo" tabindex="-1" #modalArchivo aria-labelledby="modalArchivo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <ng-titulo titulo="Carga de mercancías por archivo" />
        <form [formGroup]="formularioArchivo">
          <div class="row">
            <div class="col-md-8">
              <div class="form-group">
                <div>
                  <label class="control-label"> Archivo: </label>
                </div>
                <input class="visually-hidden-file" type="file" formControlName="archivo" id="archivoAdjuntar" size="60"
                  (change)="alSeleccionarArchivo($event);" />
                <label class="custome-file-label" for="archivoAdjuntar" value="Seleccionar archivo"
                  style="background-color: lightgrey; font-weight: bold">Seleccionar archivo</label>
                <p style="display: inline-block"> {{ nombreArchivo || 'Sin archivos seleccionados' }} </p>
                <br />
              </div>
            </div>
          </div>
        </form>

      </div>
      <div class="modal-footer custom-footer">
        <button type="button" class="btn btn-default" data-bs-dismiss="modal" #closeModal> Cerrar </button>
        <button type="submit" class="btn btn-primary" (click)="enviar()"> Enviar </button>
      </div>
    </div>
  </div>
</div>

 <div class="modal fade" id="modalBuscar" tabindex="-1" #modalBuscar aria-labelledby="modalBuscar" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body">
        <ng-titulo titulo="Datos de la mercancía" />
        <form [formGroup]="formularioMercancia">
          <ng-container>
            <div class="row">
              <div class="col-md-4">
                <label>Fracción arancelaria:</label>
                <input type="text" required="true" class="form-control gray-glass" readonly
                  formControlName="fraccionMercanciaArancelaria"
                  (change)=" setValoresStore( formularioMercancia, 'fraccionMercanciaArancelaria', 'setFraccionMercanciaArancelaria' ) " />
              </div>
              <div class="col-md-8">
                <label>Nombre comercial de la mercancía(igual que en la factura):</label>
                <input type="text" required="true" class="form-control gray-glass"
                  formControlName="nombreComercialDelaMercancia" readonly
                  (change)=" setValoresStore( formularioMercancia, 'nombreComercialDelaMercancia', 'setNombreComercialDelaMercancia' ) " />
              </div>
            </div>
            <div class="row mt-5">
              <div class="col-md-8">
                <label>Nombre técnico:</label>
                <input type="text" required="true" class="form-control gray-glass" formControlName="nombreTecnico"
                  readonly (change)=" setValoresStore( formularioMercancia, 'nombreTecnico', 'setNombreTecnico' ) " />
              </div>
            </div>
            <div class="row mt-5">
              <div class="col-md-8">
                <label>Nomre en inglés:</label>
                <input type="text" required="true" class="form-control gray-glass" formControlName="nombreEnIngles"
                  readonly (change)=" setValoresStore( formularioMercancia, 'nombreEnIngles', 'setNombreEnIngles' ) " />
              </div>
              <div class="col-md-4">
                <label>Otras instancias:</label>
                <input type="text" required="true" class="form-control gray-glass" formControlName="otrasInstancias"
                  readonly
                  (change)=" setValoresStore( formularioMercancia, 'otrasInstancias', 'setOtrasInstancias' ) " />
              </div>
            </div>
            <div class="row mt-5">
              <div class="col-md-4">
                <label>Criterio para conferir origen:</label>
                <input type="text" required="true" class="form-control gray-glass"
                  formControlName="criterioParaConferir" readonly
                  (change)=" setValoresStore( formularioMercancia, 'criterioParaConferir', 'setCriterioParaConferir' ) " />
              </div>
            </div>

            <div class="row mt-5">
              <div class="col-md-4">
                <label>Cantidad*:</label>
                <input type="number" class="form-control" formControlName="cantidad"
                  [ngClass]="isValid(formularioMercancia,'cantidad') ? 'required' : ''"
                  (change)=" setValoresStore( formularioMercancia, 'cantidad', 'setCantidad' ) " />
                <div class="error-message col-md-12 ps-0">
                  <small
                    *ngIf="formularioMercancia.get('cantidad')?.touched && formularioMercancia.get('cantidad')?.hasError('required')"
                    class="text-danger">
                    Este campo es obligatorio.
                  </small>
                </div>
              </div>
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="optionsPais" [label]="'UMC'" [required]="true" id="pais"
                  formControlName="pais" [ngClass]="isValid(formularioMercancia,'pais') ? 'required' : ''"
                  (change)="setValoresStore(formularioMercancia, 'pais', 'setPais')"
                  [isDisabled]="soloLectura"></app-catalogo-select>
              </div>

            </div>
            <div class="row mt-5">
              <div class="col-md-4">
                <label>Valor de la mercancía(dólares)*:</label>
                <input type="text" required="true" class="form-control" formControlName="valorDelaMercancia"
                  [ngClass]="isValid(formularioMercancia,'valorDelaMercancia') ? 'required' : ''"
                  (change)=" setValoresStore( formularioMercancia, 'valorDelaMercancia', 'setValorDelaMercancia' ) " />
                        <div class="error-message col-md-12 ps-0">
                  <small
                    *ngIf="formularioMercancia.get('valorDelaMercancia')?.touched && formularioMercancia.get('valorDelaMercancia')?.hasError('required')"
                    class="text-danger">
                    Este campo es obligatorio.
                  </small>
                </div>
              </div>
              <div class="col-md-8">
                <label>Complemento de la descripción*:</label>
                <textarea rows="3" class="w-100" formControlName="complementoDelaDescripcion"
                  [ngClass]="isValid(formularioMercancia,'complementoDelaDescripcion') ? 'required' : ''"
                  (change)=" setValoresStore( formularioMercancia, 'complementoDelaDescripcion', 'setComplementoDelaDescripcion' ) "></textarea>
                        <div class="error-message col-md-12 ps-0">
                  <small
                    *ngIf="formularioMercancia.get('complementoDelaDescripcion')?.touched && formularioMercancia.get('complementoDelaDescripcion')?.hasError('required')"
                    class="text-danger">
                    Este campo es obligatorio.
                  </small>
                </div>
              </div>
            </div>

            <div class="row mt-5">
              <div class="col-md-4">
                <input-fecha [setFecha]="formularioMercancia.get('fecha')?.value" [datos]="fechaFacturaInput"
                  (valorCambiado)="cambioFechaFactura($event)" [isDisabled]="soloLectura"></input-fecha>
              </div>
              <div class="col-md-4">
                <label>N° factura:</label>
                <input type="text" required="true" class="form-control" formControlName="numeroFactura"
                  (change)=" setValoresStore( formularioMercancia, 'numeroFactura', 'setNumeroFactura' ) " />
              </div>
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="optionsTipoFactura" [label]="'Tipo de factura'" id="tipoFactura"
                  formControlName="tipoFactura"
                  (change)=" setValoresStore( formularioMercancia, 'tipoFactura', 'setTipoFactura' ) "
                  [isDisabled]="soloLectura"></app-catalogo-select>
              </div>
            </div>
          </ng-container>
        </form>

      </div>
      <div class="modal-footer custom-footer mt-4">
        <button type="button" class="btn btn-default" data-bs-dismiss="modal" #closeModal> Cancelar </button>
        <button type="submit" class="btn btn-primary" #closeModal  (click)="activarModal(formularioMercancia)"> Agregar </button>
      </div>
    </div>
  </div>
</div>
