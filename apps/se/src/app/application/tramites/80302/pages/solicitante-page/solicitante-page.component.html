<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h3>Registro de solicitud modificación programa IMMEX</h3>
        <h3>(Modificación Baja de domicilio de una planta, bodega o almacén)</h3>
      </div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno (continuarEvento)="continuar()"></app-paso-uno>
       <btn-continuar *ngIf="consultaDatos.create" [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
       <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
       <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
      }}
    </div>
  </div>
</div>
