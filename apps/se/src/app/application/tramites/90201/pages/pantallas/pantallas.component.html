<div class="page">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Registro de solicitud AMPLIACION - PROSEC productor directo.</h2>
            </div>
            <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
        </div>
        <div class="row">
            @switch (indice) {
                @case (1) {
                    <app-datos></app-datos>
                }
                @case (2) {
                    <anexar-documentos [catalogoDocumentos]='catalogoDocumentos'></anexar-documentos>
                }
                @case (3) {
                    <app-firmar-solicitud></app-firmar-solicitud>
                }
            }
            <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
        </div>
    </div>
</div>
