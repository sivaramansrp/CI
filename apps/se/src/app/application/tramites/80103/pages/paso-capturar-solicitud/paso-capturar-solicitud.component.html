<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h1>Registro de solicitud IMMEX modalidad albergue</h1>
    </div>

    <app-wizard [listaPasos]="pasos"></app-wizard>

  </div>

  <div class="row">
    @switch (indice) {
    @case (1) {
    <app-paso-uno-cs></app-paso-uno-cs>
    }
    @case (2) {
    <app-paso-dos></app-paso-dos>
    }
    @case (3) {
     <paso-firma [idSolicitud]="idSolicitud" [procedure]="80103" [procedureUrl]="'nuevo-programa-industrial/action'"></paso-firma> 
    }
    }
    <btn-continuar
      [datos]="datosPasos"
      (continuarEvento)="getValorIndice($event)"
      [btnGuardar]="true" 
      [btnGuardarVisible]="btnGuardarVisible"
      (btnGuardarClicked)="obtenerDatosDelStore()"
    ></btn-continuar>
  </div>
</div>
