<div class="container">
  <form [formGroup]="formDelTramite">
    <ng-titulo titulo="Datos del tramite a realizar"> </ng-titulo>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label for="solicitude">Solicitude*:</label>
          <app-input-radio
            [radioOptions]="solicitude"
            [selectedValue]="defaultSelect"
            [isRequired]="true"
            (valueChange)="onValueChange($event)"
            [layout]="'vertical'"
          ></app-input-radio>
        </div>
      </div>
      <div class="col-md-8">
        <div *ngFor="let catalogo of catalogosArray; let i = index">
          <app-catalogo-select
            [catalogo]="catalogo"
            [label]="inputFields[i].label"
            [placeholder]="inputFields[i].placeholder"
            [required]="inputFields[i].required"       
            formControlName="fraccion"
            (change)="setValoresStore(formDelTramite, 'fraccion', 'setFraccion')"
          ></app-catalogo-select>
        </div>
      </div>
    </div>
  </form>
</div>
