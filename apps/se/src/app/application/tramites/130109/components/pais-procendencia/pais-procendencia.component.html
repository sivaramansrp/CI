<div class="container">
  <form [formGroup]="paisForm">
    
  <div class="row">
    <ng-titulo titulo="País(es) procedencia"> </ng-titulo>

    <div class="row mb-5">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="paisProc"
          (change)="fetchPaisProc()"
          [label]="'Bloque'"
          [placeholder]="'Seleccione un bloque'"
          formControlName="bloque"
        ></app-catalogo-select>       
      </div>
      <div
        class="col-md-4 d-flex justify-content-center align-items-center mt-5 mx-4"
      >
        <button type="button" class="btn-primary btn" name="todos países">Todos los países</button>
      </div>
      <div class="col-md-4"></div>
    </div>
    <crosslist
      [fechas]="selectRangoDias"
      [showSearchInput1]="true"
      [showSearchInput2]="true"
      [botonField]="botonField"
    ></crosslist>
  </div>

  <div class="row mt-4">
    <div class="col-md-8">
      <div class="form-group">
        <label for="descripcion" class="form-label"
          >Uso(s) especffico(s) de la mercancia*:</label
        >
        <textarea
          class="form-control"
          rows="2"
          id="descripcion"
          placeholder="Uso(s) especffico(s) de la mercancia*:"
          formControlName="descripcioneSpecffico"
        ></textarea>
        <div
        *ngIf="
          paisForm.controls['descripcioneSpecffico'].invalid &&
          paisForm.controls['descripcioneSpecffico'].touched
        "
        class="text-danger"
      >
        <small *ngIf="paisForm.controls['descripcioneSpecffico'].errors?.['required']"
          >La descripción es obligatoria.</small
        >
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-md-8">
      <div class="form-group">
        <label for="descripcion" class="form-label"
          >Justificación y beneficio que se obtiene*:</label
        >
        <textarea
          class="form-control"
          rows="2"
          id="descripcion"
          placeholder="Justificación y beneficio que se obtiene"
          formControlName="descripcionJustificacion"
        ></textarea>
        <div
        *ngIf="
          paisForm.controls['descripcionJustificacion'].invalid &&
          paisForm.controls['descripcionJustificacion'].touched
        "
        class="text-danger"
      >
        <small *ngIf="paisForm.controls['descripcionJustificacion'].errors?.['required']"
          >La justificacion es obligatoria.</small
        >
        </div>
      </div>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-md-8">
      <div class="form-group">
        <label for="descripcion" class="form-label">Observaciones:</label>
        <textarea
          class="form-control"
          rows="2"
          id="descripcion"
          placeholder="Observaciones"
          formControlName="observaciones"
        ></textarea>
      </div>
    </div>
  </div>

  </form>
</div>
