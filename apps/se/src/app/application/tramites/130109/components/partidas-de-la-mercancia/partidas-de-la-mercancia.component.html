<div class="container">
  <form [formGroup]="form">
    <div>
      <ng-titulo titulo="Partidas de la mercancía"></ng-titulo>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="cantidad">Cantidad*:</label>
            <input
              class="form-control"
              type="text"
              id="cantidad"
              formControlName="cantidad"
              appUppercase
              aria-labelledby="cantidad"
              (change)="setValoresStore(form, 'cantidad', 'setCantidad')"
            />
            <div *ngIf="esInvalido('cantidad')" class="text-danger">
              <small *ngIf="form.controls['cantidad'].hasError('required')"
                >Cantidad es obligatoria.</small
              >
              <small *ngIf="form.controls['cantidad'].hasError('pattern')"
                >Solo se permiten números.</small
              >
              <small *ngIf="form.controls['cantidad'].hasError('maxlength')"
                >Máximo 18 caracteres.</small
              >
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="valorPartidaUSD"
              >Valor partida USD*:</label
            >
            <input
              class="form-control"
              type="number"
              id="valorPartidaUSD"
              formControlName="valorPartidaUSD"
              aria-labelledby="valorPartidaUSD"
              (change)="
                setValoresStore(form, 'valorPartidaUSD', 'setvalorPartidaUSD')
              "
            />
            <div *ngIf="esInvalido('valorPartidaUSD')" class="text-danger">
              <small
                *ngIf="form.controls['valorPartidaUSD'].hasError('required')"
                >Este campo es obligatorio.</small
              >
              <small
                *ngIf="form.controls['valorPartidaUSD'].hasError('pattern')"
                >Ingrese un número válido.</small
              >
              <small *ngIf="form.controls['valorPartidaUSD'].hasError('min')"
                >El valor debe ser mayor o igual a 0.</small
              >
              <small
                *ngIf="form.controls['valorPartidaUSD'].hasError('maxlength')"
                >Máximo 20 caracteres permitidos.</small
              >
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-8">
          <div class="form-group">
            <label class="form-label" for="descripcion">Descripción*:</label>
            <textarea
              class="form-control height"
              rows="3"
              id="descripcion"
              formControlName="descripcion"
              aria-labelledby="descripcion"
              (change)="setValoresStore(form, 'descripcion', 'setDescripcion')"
            ></textarea>
            <div *ngIf="esInvalido('descripcion')" class="text-danger">
              <small *ngIf="form.controls['descripcion'].hasError('required')"
                >Descripción es obligatoria.</small
              >
              <small *ngIf="form.controls['descripcion'].hasError('maxlength')"
                >Máximo 255 caracteres.</small
              >
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-8"></div>
        <div class="col-md-4 text-end">
          <div class="btn-group">
            <button
              class="btn btn-primary me-2"
              type="button"
              (click)="navegarACargarArchivo()"
            >
              Cargar archivo
            </button>
            <button
              class="btn btn-danger"
              type="button"
              (click)="validarYEnviarFormulario()"
            >
              Agregar
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>

  <div class="row">
    <div>
      <h6>Partidas</h6>
      <div *ngIf="mostrarTabla">
        <app-tabla-dinamica
          [configuracionTabla]="tableHeaderData"
          [datos]="tableBodyData"
          [tipoSeleccionTabla]="CHECKBOX"
          (listaDeFilaSeleccionada)="handleListaDeFilaSeleccionada($event)"
        >
        </app-tabla-dinamica>
      </div>

      <form [formGroup]="formularioParaConteoTotal">
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="cantidadTotal"
                >Cantidad total:</label
              >
              <input
                class="form-control"
                type="number"
                id="cantidadTotal"
                formControlName="cantidadTotal"
                aria-labelledby="cantidadTotal"
              />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="valorTotalUSD"
                >Valor Total USD:</label
              >
              <input
                class="form-control"
                type="number"
                id="valorTotalUSD"
                formControlName="valorTotalUSD"
                aria-labelledby="valorTotalUSD"
              />
            </div>
          </div>
        </div>

        <div class="row mt-5">
          <div class="col-md-4"></div>
          <div class="col-md-8">
            <hr />
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 col-sm-6"></div>
          <div class="col-md-6 col-sm-6 text-end">
            <div class="btn-group">
              <button class="btn btn-primary me-2" type="button">
                Elimina Partida
              </button>
              <button
                class="btn btn-danger"
                type="button"
                (click)="navegarParaModificarPartida()"
              >
                Mofificar
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
