<div class="container">
  <ng-titulo titulo="Cargar Archivo"> </ng-titulo>
  <div class="row mb-5">
    <div class="col-md-12 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <label for="archivoNacionales" class="form-label me-3">
          Archivo:
        </label>
        <input type="file" id="archivoNacionales" class="form-control w-auto" />
      </div>
      <div></div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-8"></div>
    <div class="col-md-4 text-end">
      <div class="btn-group mb-4">
        <button type="button" class="btn btn-primary me-2" (click)="navegar()">
          Cerrar
        </button>
        <button type="button" class="btn btn-danger">Enviar</button>
      </div>
    </div>
  </div>
</div>
