<div class="container">
  <form [formGroup]="form">
    <div>
      <ng-titulo titulo="Modificar partida"></ng-titulo>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="cantidad">Cantidad*:</label>
            <input
              class="form-control"
              type="text"
              id="cantidad"
              formControlName="cantidad"
              appUppercase
              aria-labelledby="cantidad"
            />
            <div *ngIf="esInvalido('cantidad')" class="text-danger">
              <small *ngIf="form.controls['cantidad'].hasError('required')"
                >Cantidad es obligatoria.</small
              >
              <small *ngIf="form.controls['cantidad'].hasError('pattern')"
                >Solo se permiten números.</small
              >
              <small *ngIf="form.controls['cantidad'].hasError('maxlength')"
                >Máximo 18 caracteres.</small
              >
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="valorPartidaUSD"
              >Valor partida USD*:</label
            >
            <input
              class="form-control"
              type="number"
              id="valorPartidaUSD"
              formControlName="valorPartidaUSD"
              aria-labelledby="valorPartidaUSD"
            />
            <div *ngIf="esInvalido('valorPartidaUSD')" class="text-danger">
              <small
                *ngIf="form.controls['valorPartidaUSD'].hasError('required')"
                >Este campo es obligatorio.</small
              >
              <small
                *ngIf="form.controls['valorPartidaUSD'].hasError('pattern')"
                >Ingrese un número válido.</small
              >
              <small *ngIf="form.controls['valorPartidaUSD'].hasError('min')"
                >El valor debe ser mayor o igual a 0.</small
              >
              <small
                *ngIf="form.controls['valorPartidaUSD'].hasError('maxlength')"
                >Máximo 20 caracteres permitidos.</small
              >
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-8">
          <div class="form-group">
            <label class="form-label" for="descripcion">Descripción*:</label>
            <textarea
              class="form-control height"
              rows="3"
              id="descripcion"
              formControlName="descripcion"
              aria-labelledby="descripcion"
            ></textarea>
            <div *ngIf="esInvalido('descripcion')" class="text-danger">
              <small *ngIf="form.controls['descripcion'].hasError('required')"
                >Descripción es obligatoria.</small
              >
              <small *ngIf="form.controls['descripcion'].hasError('maxlength')"
                >Máximo 255 caracteres.</small
              >
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4"></div>
        <div class="col-md-8">
          <hr />
        </div>
      </div>
      <div class="row">
        <div class="col-md-8"></div>
        <div class="col-md-4 text-end">
          <div class="btn-group mb-4">
            <button
              class="btn btn-primary me-2"
              type="button"
              (click)="navegar()"
            >
              cancelar
            </button>
            <button class="btn btn-danger" type="button">modificar</button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
