<div class="container">
  <form [formGroup]="mercanciaFormulario">
    <ng-titulo titulo="Modificación de la descripción de la mercancía" />
    <div class="row">
      <div class="col-md-4">
        <label>Folio resolución:</label>
        <input type="text" class="form-control" id="numeroFolioResolucion" formControlName="numeroFolioResolucion" />
      </div>
      <div class="col-md-4">
        <label>Cantidad:</label>
        <span class="bi bi-question-circle-fill" title="" data-bs-toggle="tooltip"></span>
        <input type="text" class="form-control" id="cantidadLibreMercancia" formControlName="cantidadLibreMercancia" />
      </div>
    </div>
    <ng-titulo titulo="Datos del trámite a realizar" />
    <div class="row">
      <div class="col-md-12">
        <div>
          <label>Descripción de la mercancía:</label>
          <textarea class="form-control height-55" id="descripcion" formControlName="descripcion"></textarea>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12 mt-3">
        <div>
          <label>Modificar la descripción como sigue*:</label>
          <textarea class="form-control height-80" id="descripcionModificacion"
            formControlName="descripcionModificacion"
            [ngClass]="isValid(mercanciaFormulario,'descripcionModificacion') ? 'required' : ''"
            (change)=" setValoresStore( mercanciaFormulario, 'descripcionModificacion', 'setDescripcionModificacion' ) "></textarea>
        </div>
      </div>

    </div>
    <ng-container class="mt-5">
      <ng-titulo titulo="Partidas de la mercancía" />
      <div class="table-container">
        <label class="mb-2">Partidas</label>
        <app-tabla-dinamica [configuracionTabla]="mercanciaTablaEncabezados"
          [tipoSeleccionTabla]="tablaSeleccion.CHECKBOX" [datos]="mercanciaTablaDatos"
          (listaDeFilaSeleccionada)="seleccionDeFilas($event)"></app-tabla-dinamica>
        <div class="col-md-12 d-flex justify-content-end">
          <button type="button" class="btn btn-primary ms-3"> Modificar partida mercancia </button>
        </div>
      </div>
    </ng-container>
  </form>
</div>
