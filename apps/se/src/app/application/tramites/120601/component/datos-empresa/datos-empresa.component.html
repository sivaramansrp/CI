
<div class="container">
    <ng-titulo titulo="Representación federal" />
    <form [formGroup]="formulario">
        <div class="row mb-3">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="entidad" [label]="'Estado'"
                    name="entidad" formControlName="entidad" (change)="docSeleccionado($event)" [placeholder]="'CHIHUAHUA'">
                </app-catalogo-select>
            </div>
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="representacion" [label]="'Representación federal'" [required]="true"
                    name="representacion" formControlName="representacion"
                    (change)="validarRepresentacionFederalIDCSECEROR_($event)">
                </app-catalogo-select>
            </div>
        </div>
    </form>
</div>
