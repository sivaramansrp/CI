<div class="container" [formGroup]="formularioEmpresa">
    <ng-titulo titulo="Representación federal"></ng-titulo>
    <div class="row">
        <div class="col-md-3">
            <app-catalogo-select [catalogo]="federalEstatal" [label]="'Estado'"   [required]="false" name="Estado"
                formControlName="estado" (change)="setValoresStore(formularioEmpresa,'estado', 'setEstado')">
            </app-catalogo-select>
        </div>
        <div class="col-md-3">
            <app-catalogo-select [catalogo]="federalEstatal" [label]="'Representación federal'" [required]="true"
                name="Representación federal" formControlName="representacionFederal" (change)="setValoresStore(formularioEmpresa,'representacionFederal', 'setRepresentacionFederal')">
            </app-catalogo-select>
        </div>
    </div>

    <h6 class="gap">Selección de sucursal</h6>

    <app-tabla-dinamica [configuracionTabla]="tableHeader" [datos]="tablaDatosSucursal"></app-tabla-dinamica>

    <ng-titulo titulo="Datos de la solicitud"></ng-titulo>

    <div class="row">
        <div class="col-md-4">
            <app-catalogo-select [catalogo]="federalEstatal" [label]="'Tipo de empresa:'" [required]="true"
                name="Tipo de empresa" formControlName="tipoEmpresa"
                (change)="setValoresStore(formularioEmpresa,'tipoEmpresa', 'setTipoEmpresa')"></app-catalogo-select>

        </div>
        <div class="col-md-8">
            <label for="especifique" class="form-label">Especifique:</label>
            <input type="text" class="form-control" id="especifique" formControlName="especifique" readonly
                [disabled]="true">
        </div>
        <div class="col-md-12">
            <label for="actividad-economica-preponderante" class="form-label">Clasificación del Catálogo de Actividades
                Económicas del SAT conforme a la Actividad Económica Preponderante":</label>
            <input type="text" id="actividad-economica-preponderante" class="form-control"
                name="actividadEconomicaPreponderante" formControlName="actividadEconomicaPreponderante"
                (change)="setValoresStore(formularioEmpresa,'actividadEconomicaPreponderante', 'setActividadEconomicaPreponderante')">
        </div>
        <div class="col-md-12">
            <label for="descripcion" class="form-label">Descripción:</label>
            <textarea id="descripcion" class="form-control" formControlName="descripcion" [readonly]="true"></textarea>
        </div>
    </div>

    <div class="row">
        <ng-titulo titulo="Domicilio donde se almacenarán las mercancías a importar"></ng-titulo>

        <div class="col-md-4">
            <label for="País" class="form-label">País:</label>
            <input type="text" id="País" class="form-control" formControlName="pais" readonly [disabled]="true">
        </div>
        <div class="col-md-4">
            <label for="Código postal" class="form-label">Código postal:
            </label>
            <input type="text" id="Código postal" class="form-control" formControlName="codigoPostal" readonly
                [disabled]="true">
        </div>
        <div class="col-md-4">
            <label for="Estado" class="form-label">Estado</label>
            <input type="text" id="Estado" class="form-control" formControlName="estado" readonly [disabled]="true">
        </div>
        <div class="col-md-4">
            <label for="alcaldía:" class="form-label">Municipio o alcaldía:</label>
            <input type="text" id="alcaldía:" class="form-control" formControlName="municipioAlcaldia" readonly
                [disabled]="true">
        </div>
        <div class="col-md-4">
            <label for="Localidad" class="form-label">Localidad:</label>
            <input type="text" id="Localidad" class="form-control" formControlName="localidad" readonly
                [disabled]="true">
        </div>
        <div class="col-md-4">
            <label for="Colonia" class="form-label">Colonia:</label>
            <input type="text" id="Colonia" class="form-control" formControlName="colonia" readonly [disabled]="true">
        </div>
        <div class="col-md-8">
            <label for="Calle" class="form-label">Calle:</label>
            <input type="text" id="Calle" class="form-control" formControlName="calle" readonly [disabled]="true">
        </div>
        <div class="col-md-4">
            <label for="exterior" class="form-label">Número exterior:</label>
            <input type="text" id="exterior" class="form-control" formControlName="numeroExterior" readonly
                [disabled]="true">
        </div>
        <div class="col-md-4">
            <label for="interior" class="form-label">Número interior:</label>
            <input type="text" id="interior" class="form-control" formControlName="numeroInterior" readonly
                [disabled]="true">
        </div>
        <div class="col-md-2">
            <label for="Lada" class="form-label">Lada:</label>
            <input type="text" id="Lada" class="form-control" formControlName="lada" readonly [disabled]="true">
        </div>
        <div class="col-md-3">
            <label for="Teléfono" class="form-label">Teléfono:</label>
            <input type="text" id="Teléfono" class="form-control" formControlName="telefono" readonly [disabled]="true">
        </div>
    </div>


    <div class="row">
        <ng-titulo titulo="Datos generales socios accionistas"></ng-titulo>
        <div class="col-md-6">
            <label class="form-label">Nacionalidad mexicana:</label>
            <app-input-radio [radioOptions]="opcionSeleccionMexicana" [selectedValue]="valorSeleccionadoNacionalidad"
                [isRequired]="false" [layout]="'horizontal'" formControlName="nacionalidad"></app-input-radio>
        </div>
        <div class="col-md-6">
            <label class="form-label">Tipo de persona:</label>
            <app-input-radio [radioOptions]="opcionSeleccionPersona" [selectedValue]="valorSeleccionadoPersona"
                [isRequired]="false" [layout]="'horizontal'" formConrolName="tipoDePersona"></app-input-radio>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <label for="taxId" class="form-label">TAX ID*:</label>
            <input type="text" id="taxId" class="form-control" formControlName="taxId"
                (change)="setValoresStore(formularioEmpresa,'taxId', 'setTaxId')">
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <label for="Denominación" class="form-label">Denominación o razón social:</label>
            <input type="text" id="denominación" class="form-control" formControlName="denominacion"
            (change)="setValoresStore(formularioEmpresa,'denominacion', 'setDenominacion')">
        </div>
        <div class="col-md-6">
            <app-catalogo-select [catalogo]="federalEstatal" [label]="'País'" [required]="true" name="País"
                formControlName="datosPais"></app-catalogo-select>

        </div>
        <div class="col-md-6">
            <label for="Código postal" class="form-label">Código postal:</label>
            <input type="text" id="Código postal" class="form-control" formControlName="datosCodigoPostal"
             (change)="setValoresStore(formularioEmpresa,'datosCodigoPostal', 'setDatosCodigoPostal')">
        </div>
        <div class="col-md-6">
            <label for="Estado" class="form-label">Estado:</label>tableData
            <input type="text" id="Estado" class="form-control" formControlName="datosEstado"
            (change)="setValoresStore(formularioEmpresa,'datosEstado', 'setDatosEstado')">
        </div>
        <div class="col-md-6">
            <label for="Correo electrónico" class="form-label">Correo electrónico:</label>
            <input type="text" id="Correo electrónico" class="form-control" formControlName="correoElectronico"
            (change)="setValoresStore(formularioEmpresa,'correoElectronico', 'setCorreoElectronico')">
        </div>
        <div class="col-md-12 d-flex justify-content-end mt-2 mb-4">
            <button type="button" class="btn btn-primary">Agregar</button>
        </div>
    </div>

    <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionTabla" [configuracionTabla]="configuracionTabla"
        [datos]="datosGenerales"></app-tabla-dinamica>

    <div class=" text-end">
        <button type="button" class="btn btn-primary">Eliminar</button>
    </div>

    <h6 class="margin-header">Socios y Accionistas Extranjeros</h6>
    <h6>Datos de los socios y/o accionistas:</h6>

    <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionTabla" [configuracionTabla]="tableHeaderExtranjeros"
        [datos]="datosTablaExtranjeros"></app-tabla-dinamica>


    <div class=" text-end mt-5">
        <button type="button" class="btn btn-primary">Eliminar</button>
    </div>

    <btn-continuar [datos]="datosPasos"></btn-continuar>

    <ng-alert [CONTENIDO]="DATOS_EMPRESA"></ng-alert>
</div>
