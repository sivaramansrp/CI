<div class="container">
    <div class="row">
        <ul class="nav nav-tabs">
            <li [ngClass]="indice === 1 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(1)">Solicitante</a>
            </li>
            @if(consultaState.parameter === "READ_PROCEDURE")
            {
            <li [ngClass]="indice === 2 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(2)">Datos de la solicitud</a>
            </li>
            }
            @else
            {       
            <li [ngClass]="indice === 2 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(2)">Datos Empresa</a>
            </li>
          }
        </ul>
        <ng-container>
            @switch (indice) {
            @case (1) {
                <app-solicitante></app-solicitante>
            }
            @case (2) {
                @if (esDatosRespuesta) {
                    <app-datos-empresa></app-datos-empresa>
                }
            }
            }
        </ng-container>

    </div>
</div>
