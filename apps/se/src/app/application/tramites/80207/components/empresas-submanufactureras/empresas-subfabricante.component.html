<!-- InfoRegistro empezar -->
<form [formGroup]="formularioInfoRegistro">
  <div class="row mt-md-4">
    <div class="col-md-4">
      <div class="form-group">
        <label for="modalidad" class="form-label text-nowrap"
          >Selecciona la modalidad</label
        >
        <input
          type="text"
          id="modalidad"
          name="modalidad"
          size="30"
          maxlength="13"
          class="form-control"
          formControlName="modalidad"
        />
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-group">
        <label for="folio" class="form-label">Folio</label>
        <input
          type="text"
          id="folio"
          name="folio"
          size="30"
          maxlength="13"
          class="form-control"
          formControlName="folio"
        />
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-group">
        <label for="ano" class="form-label">Año</label>
        <input
          type="text"
          id="ano"
          name="ano"
          size="30"
          maxlength="13"
          class="form-control"
          formControlName="ano"
        />
      </div>
    </div>
  </div>
</form>
<!-- InfoRegistro fin -->

<!-- datosSubcontratista empezar -->

<form [formGroup]="formularioDatosSubcontratista">
  <ng-titulo titulo="Empresas submanufactureras" />
  <div class="row">
    <div class="col-md-4">
      <div class="form-group">
        <label
          class="form-label text-nowrap text-truncate-ellipsis"
          [title]="'Registro federal de contribuyentes'"
          for="rfc"
          >Registro federal de contribuyentes
          <span class="require">*</span>
        </label>
        <input
          type="text"
          name="rfc"
          id="rfc"
          formControlName="rfc"
          class="form-control mt-custom"
          size="30"
          maxlength="13"
          (change)="obtenerRFC()"
        />
        <div *ngIf="esInvalido('rfc')" class="text-danger">
          <small *ngIf="formularioDatosSubcontratista.controls['rfc'].errors?.['required']">
            Este campo es obligatorio.
          </small>
          </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="form-group">
        <app-catalogo-select
          [catalogo]="estadoCatalogo"
          [label]="'Estado'"
          [required]="true"
          [isDisabled]="false"
          name="estado"
          formControlName="estado"
          (selectionChange)="enEstadoSeleccionado($event)"
        ></app-catalogo-select>
        <div *ngIf="esInvalido('estado')" class="text-danger">
          <small *ngIf="formularioDatosSubcontratista.controls['estado'].errors?.['required']">
            Este campo es obligatorio.
          </small>
          </div>
      </div>
      </div>
    </div>
</form>
<!-- datosSubcontratista fin -->

<div class="row justify-content-end">
  <button
    type="button"
    class="btn btn-primary col-auto pull-right float-end mt-3"
    (click)="realizarBusqueda()"
  >
    Buscar plantas
  </button>
</div>

<div *ngIf="mostrarTablaSubfabricantesDisponibles$ | async" class="row mt-5">
  <div class="col-md-12">
    <label for="submanufacturerasdisponibles"
      >Submanufactureras disponibles:</label
    >
  </div>
  <div class="col-md-12">
    <app-tabla-dinamica
      [tipoSeleccionTabla]="tablaSeleccion"
      [configuracionTabla]="configuracionTabla"
      [datos]="datosTablaSubfabricantesDisponibles"
      (listaDeFilaSeleccionada)="obtenerRegistroSeleccionado($event)"
    ></app-tabla-dinamica>
  </div>


<div
  class="row justify-content-end"
>
  <button
    type="button"
    class="btn btn-primary col-auto pull-right float-end mt-3"
    (click)="agregarPlantas()"
  >
    Agregar plantas
  </button>
</div>
</div>
<div *ngIf="mostrarTablaSubfabricantesSeleccionadas" class="row mt-5">
  <div class="col-md-12">
    <label for="submanufacturerasdisponibles"
      >Plantas submanufactureras seleccionadas:</label
    >
  </div>
  <div class="col-md-12">
    <app-tabla-dinamica
      [tipoSeleccionTabla]="tablaSeleccion"
      [configuracionTabla]="configuracionTabla"
      [datos]="datosSubfabricanteParaSerAgregados"
      (listaDeFilaSeleccionada)="datosDelSubfabricantePorEliminar($event)"
    ></app-tabla-dinamica>
  </div>

  <div class="row justify-content-end">
    <button
      type="button"
      class="btn btn-danger col-auto pull-right float-end mt-3"
      [disabled]="listaDeSubfabricantesPorEliminar.length === 0"
      (click)="eliminarPlantas()"
    >
      Eliminar plantas
    </button>
  </div>
</div>
