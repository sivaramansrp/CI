<form [formGroup]="formularioDatosGenerales" class="my-5 col-md-12">

    <div class="row">
      <div class="col-md-6 form-group">
        <label class="form-label" for="rfc">Registro Federal de Contribuyentes:</label>
        <input class="form-control" type="text" id="rfc" formControlName="rfc"    />
      </div>
      <div class="col-md-6 form-group">
        <label class="form-label" for="representacionFederal">Representación Federal:</label>
        <input class="form-control" type="text" id="representacionFederal" formControlName="representacionFederal"    />
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 form-group">
        <label class="form-label" for="tipoModalidad">Tipo de Modificación:</label>
        <input class="form-control" type="text" id="tipoModalidad" formControlName="tipoModalidad"   />
      </div>
      <div class="col-md-6 form-group">
        <label class="form-label" for="descripcionModalidad">Modificación de Programa:</label>
        <input class="form-control" type="text" id="descripcionModalidad" formControlName="descripcionModalidad"   />
      </div>
    </div>
</form>
