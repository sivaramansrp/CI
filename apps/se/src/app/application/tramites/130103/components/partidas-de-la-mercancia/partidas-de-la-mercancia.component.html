<div class="container">
    <form [formGroup]="forma">
        <div class="row">
            <ng-titulo titulo="Partidas de la mercancía" />
        </div>
        <div class="row">
            <ng-alert [CONTENIDO]="instrucciones"></ng-alert>
        </div>
        <div class="row mt-5">
            <div class="col-md-8"></div>
            <div class="col-md-4 text-end">
            <div class="btn-group">
                <button
                class="btn btn-primary me-2"
                type="button"
                
                >
                <!-- data-bs-toggle="modal"
                data-bs-target="#modalCargarArchivo" -->
                Cargar archivo
                </button>
                <button
                class="btn btn-primary ms-2"
                (click)="agregar()"
            >
                Agregar
            </button>
            </div>
            </div>
        </div>
        <div class="row mt-5">
            <ng-alert [CONTENIDO]="instrucciones_para_partidas"></ng-alert>
        </div>
        <div class="row">
            <h6>Partidas:</h6>
            <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"  [configuracionTabla]="encabezadoDeTabla"
                [datos]="datosTabla"></app-tabla-dinamica>
        </div>
        <div class="row mt-5">
            <div class="col-md-6 d-flex justify-content-between">
                <div class="form-group">
                    <label class="form-label" for="cantidad_total">Cantidad :</label>
                    <input
                      class="form-control"
                      type="number"
                      id="cantidad_total"
                      formControlName="cantidad_total"
                    />
                  </div>
    
                  <div class="form-group">
                    <label class="form-label" for="valor_total">Valor total USD :</label>
                    <input
                      class="form-control"
                      type="number"
                      id="valor_total"
                      formControlName="valor_total"
                    />
                  </div>
            </div>
        </div>
    </form>
</div>
