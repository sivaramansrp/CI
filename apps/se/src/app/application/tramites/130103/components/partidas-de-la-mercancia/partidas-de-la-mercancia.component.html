<div class="container">
    <form [formGroup]="forma">
        <div class="row">
            <ng-titulo titulo="Partidas de la mercancía" />
        </div>
        <div class="row">
            <ng-alert [CONTENIDO]="instrucciones"></ng-alert>
        </div>
        <div class="row">
            <formas-dinamicas [forma]="ninoFormGroup" [formularioDatos]="partidasDeLaMercanciaFormData"
            [estado]="importacionstate" [soloLectura]="consultaState.readonly" (emitirCambioDeValor)="establecerCambioDeValor($event)"></formas-dinamicas>
        </div>
        <div class="row mt-5">
            <div class="col-md-8"></div>
            <div class="col-md-4 text-end">
            <div class="btn-group">
                <button
                class="btn btn-danger me-2"
                type="button"
                [disabled]="consultaState.readonly"
                (click)="cargarArchivo()"
                >
                Cargar archivo
                </button>
                <button
                class="btn btn-primary ms-2"
                [disabled]="consultaState.readonly"
                (click)="agregar()"
            >
                Agregar
            </button>
            </div>
            </div>
        </div>
        <div class="row mt-5">
            <ng-alert [CONTENIDO]="instrucciones_para_partidas"></ng-alert>
        </div>
        <div class="row">
            <h6>Partidas:</h6>
            <app-tabla-dinamica
              [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
              [configuracionTabla]="encabezadoDeTabla"
              [datos]="datosTabla"
              [disableSeleccionTablaCheckBox]="consultaState.readonly"
              [desactivarEmitirEvento]="!consultaState.readonly"
              (listaDeFilaSeleccionada)="onPartidasSeleccion($event)">
            </app-tabla-dinamica>
        </div>
        <div class="row mt-5">
            <div class="col-md-6 d-flex justify-content-between">
                <div class="form-group">
                    <label class="form-label" for="cantidad_total">Cantidad :</label>
                    <input
                      class="form-control"
                      type="number"
                      id="cantidad_total"
                      formControlName="cantidad_total"
                    />
                  </div>
    
                  <div class="form-group">
                    <label class="form-label" for="valor_total">Valor total USD :</label>
                    <input
                      class="form-control"
                      type="number"
                      id="valor_total"
                      formControlName="valor_total"
                    />
                  </div>
            </div>
        </div>
        <div class="row mt-5 text-end">
            <div>
                <button type="button" class="btn btn-danger me-2 btn-space" [disabled]="consultaState.readonly" (click)="eliminar()">Eliminar partida</button>
                <button type="button" class="btn btn-primary btn-space" [disabled]="consultaState.readonly" (click)="abrirModalEditar()">Modificar partida mercancía</button>
            </div>
        </div>
    </form>
</div>


<div
  class="modal fade"
  #cargarArchivoModal
  tabindex="-1"
  aria-labelledby="confirmModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <div class="row">
          <ng-titulo titulo="Cargar archivo" />
        </div>
        <form [formGroup]="archivoFormGroup">
            <div class="row">
            <p>Archivo:</p>
        </div>
        <div class="row">
            <div class="col-md-8">
                <input
                class="form-control"
                type="file"
                formControlName="archivo"
                id="archivo"
                (change)="eventoDeCambioDeValor($event, 'archivo')"
            >
            </div>
        </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger me-2 btn-space" (click)="cerrar()">Cerrar</button>
        <button type="button" class="btn btn-primary btn-space" (click)="cerrar()">Enviar</button>
    </div>
  </div>
</div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalEditarPartida" tabindex="-1" aria-labelledby="modalEditarPartidaLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalEditarPartidaLabel">Modificar partida</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
         <formas-dinamicas [forma]="modificarPartidaForm" [formularioDatos]="modificarPartidasFormData"
            [estado]="importacionstate" (emitirCambioDeValor)="establecerCambioDeValor($event)"></formas-dinamicas>
      </div>
      <div class="row mt-5 mb-5">
          <div class="form-group">
              <div class="col-md-12">
                  <div class="pull-left text-muted text-vertical-align-button" id="lblCamposObligatorios">
                      * Campos obligatorios
                  </div>
                  <div class="pull-right row">
                      <div class="col-md-5">
                          <button type="button" class="btn btn-default" data-bs-dismiss="modal">Cancelar</button>
                      </div>
                      <div class="col-md-5" id="botonGuardar">
                          <button type="button" class="btn btn-primary" (click)="guardarEdicion()" >Modificar</button>
                      </div>
                  </div>
              </div>
          </div>
      </div>
    </div>
  </div>
</div>
