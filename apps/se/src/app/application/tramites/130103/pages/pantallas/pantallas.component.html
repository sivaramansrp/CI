<div class="container mt-5">
    <div class="row">
        <div class="col-12">
          <h1>Solicitud importación regla octava definitiva</h1>
        </div>
        <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
      </div>
      <div class="row">
        @switch (indice) { 
        @case (1) {
          <app-paso-uno [consultaState]="consultaState" (pestanaCambiado)="pestanaCambiado($event)"></app-paso-uno>
        }
         @case (2) {
          <app-paso-dos></app-paso-dos>
        } @case (3) {
          <app-paso-tres></app-paso-tres>
        }
       }
      </div>
      <btn-continuar
      [datos]="datosPasos"
      (continuarEvento)="getValorIndice($event)"
    >
    </btn-continuar>

    @if (indiceDePestanaSeleccionada===2) {
      <div class="mt-5">
        <ng-alert [CONTENIDO]="avisoPrivacidadAlert"></ng-alert>
      </div>
    }
</div>
