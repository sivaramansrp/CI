<form [formGroup]="cancelacionForm" (ngSubmit)="validarDestinatarioFormulario()">
  <ng-container formGroupName="validacionForm">
    <ng-titulo titulo="Buscar certificado de origen" />
    <div class="row mt-5">
      <div class="col-md-4">
        <label>Número de certificado de origen*:</label>
        <input type="text" required="true" class="form-control" formControlName="numeroCertificado" [disabled]="soloLectura"
          (change)=" setValoresStore(validacionForm,'numeroCertificado','setNumeroCertificado' )" />
      </div>
      <div class="col-md-3 mt-5 d-flex justify-content-end buscar">
        <button type="button" class="btn btn-primary ms-3" (click)="alBuscarClic()"> Buscar Certificado </button>
      </div>
    </div>
    <ng-titulo titulo="" />
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="paisCatalogo.catalogos" [label]="'País / Bloque'" [required]="false" id="pais"
          formControlName="pais" [isDisabled]="soloLectura" (change)="setValoresStore(validacionForm, 'pais', 'setPais')"></app-catalogo-select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="tratadoCatalogo.catalogos" [label]="'Tratado/Acuerdo'" [required]="false"
          id="tratado" formControlName="tratado" [isDisabled]="soloLectura"
          (change)="setValoresStore(validacionForm, 'tratado', 'setTratado')"></app-catalogo-select>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-4">
        <input-fecha [setFecha]="cancelacionForm.get('validacionForm.fechaInicial')?.value" [datos]="fechaInicialInput"
          (valorCambiado)="cambioFechaInicial($event)" [isDisabled]="soloLectura"></input-fecha>
      </div>
      <div class="col-md-4">
        <input-fecha [setFecha]="cancelacionForm.get('validacionForm.fechaFinal')?.value" [datos]="fechaFinalInput"
          (valorCambiado)="cambioFechaFinal($event)" [isDisabled]="soloLectura"></input-fecha>
      </div>
      <div class="col-md-3 mt-5 d-flex justify-content-end buscars">
        <button type="button" class="btn btn-primary ms-3" [disabled]="soloLectura"> Buscar Certificado </button>
      </div>
    </div>
    <ng-container *ngIf="estaBuscando">
      <div class="row mt-5">
        <ng-alert [CONTENIDO]="TEXTO_DE_ALERTA"></ng-alert>
      </div>
      <div class="table-container mt-5">
        <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.UNDEFINED" [configuracionTabla]="headers"
          [datos]="certificadoDisponsiblesTablaDatos" [disableSeleccionTablaCheckBox]="soloLectura? true : false" ></app-tabla-dinamica>
      </div>
    </ng-container>
  </ng-container>
</form>
<btn-continuar [datos]="datosPasos" (click)="emitirEventoClick()" [disabled]="soloLectura"></btn-continuar>
