<form [formGroup]="cancelacionForm" (ngSubmit)="validarDestinatarioFormulario()">
  <ng-container formGroupName="validacionForm">
    <ng-titulo titulo="Buscar certificado de origen" />
    <div class="row mt-5">
      <div class="col-md-4">
        <label>Número de certificado de origen*:</label>
        <input type="text" required="true" maxlength="16" pattern="\d{16}$" class="form-control"
          formControlName="numeroCertificado"
          (change)=" setValoresStore(validacionForm,'numeroCertificado','setNumeroCertificado' )" />
      </div>
      <div class="col-md-3 mt-5 d-flex justify-content-end buscar">
        <button type="button" class="btn btn-primary ms-3" (click)="alBuscarClic()"> Buscar Certificado </button>
      </div>
      <!-- <div *ngIf="mostrarErrores" class="alert alert-danger text-center" role="alert">
        <p>Corrija los siguientes errores:</p>
        <span style="color: rgb(134, 17, 17);">
          1.(Número de certificado) es un campo requerido
        </span>
      </div>
      <div *ngIf="mostrarErrores" class="alert alert-danger text-center" role="alert">
  <p>Corrija los siguientes errores:</p>
  <span style="color: rgb(134, 17, 17);">
    {{ mensajeError }}
  </span>
</div> -->
    </div>
    <ng-titulo titulo="" />
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="paisCatalogo.catalogos" [label]="'País / Bloque'" [required]="false" id="pais"
          formControlName="pais" (change)="setValoresStore(validacionForm, 'pais', 'setPais')"></app-catalogo-select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="tratadoCatalogo.catalogos" [label]="'Tratado / Acuerdo'" [required]="false"
          id="tratado" formControlName="tratado" [placeholder]="'Seleccione un tratado'"
          (change)="setValoresStore(validacionForm, 'tratado', 'setTratado')"></app-catalogo-select>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-4">
        <input-fecha [setFecha]="cancelacionForm.get('validacionForm.fechaInicial')?.value" [datos]="fechaInicialInput"
          (valorCambiado)="cambioFechaInicial($event)"></input-fecha>
      </div>
      <div class="col-md-4">
        <input-fecha [setFecha]="cancelacionForm.get('validacionForm.fechaFinal')?.value" [datos]="fechaFinalInput"
          (valorCambiado)="cambioFechaFinal($event)"></input-fecha>
      </div>
      <div class="col-md-3 mt-5 d-flex justify-content-end buscars">
        <button type="button" class="btn btn-primary"> Buscar Certificado </button>
      </div>
    </div>

    <div class="row mt-5" style="text-align: center;">
      <ng-alert [CONTENIDO]="TEXTO_DE_ALERTA"></ng-alert>
    </div>
    <div class="table-container centered-table-wrapper mt-5">
      <ng-titulo titulo="Certificados disponibles" />
      <ng-container *ngIf="!estaBuscando && !mostrarErrores">
        <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.UNDEFINED" [configuracionTabla]="headers"
          [datos]="certificadoDisponsiblesTablaDatos"></app-tabla-dinamica>
      </ng-container>
      <ng-container *ngIf="estaBuscando && mostrarErrores">
        <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.UNDEFINED"
          [configuracionTabla]="headers"></app-tabla-dinamica>
      </ng-container>
      <ng-container *ngIf="!estaBuscando && mostrarErrores">
        <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.UNDEFINED"
          [configuracionTabla]="headers"></app-tabla-dinamica>
      </ng-container>
      <ng-container *ngIf="estaBuscando && !mostrarErrores">
        <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.UNDEFINED"
          [configuracionTabla]="headers"></app-tabla-dinamica>
      </ng-container>
    </div>
  </ng-container>
</form>
<btn-continuar [datos]="datosPasos" (click)="emitirEventoClick()"></btn-continuar>
