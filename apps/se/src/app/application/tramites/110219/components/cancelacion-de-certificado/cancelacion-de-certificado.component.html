<form [formGroup]="cancelacionForm" (ngSubmit)="validarDestinatarioFormulario()">
  <ng-container formGroupName="validacionForm">
    <ng-titulo titulo="Buscar certificado de origen" />
    <div class="row mt-5">
      <div class="col-md-4">
        <label>Número de certificado de origen*:</label>
        <input type="text" required="true" class="form-control" formControlName="numeroCertificado"/>
      </div>
      <div class="col-md-3 mt-5 d-flex justify-content-end buscar">
        <button type="button" class="btn btn-primary ms-3" (click)="onBuscarClick()">
          Buscar Certificado
        </button>
      </div>
    </div>
    <ng-titulo titulo="" />
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="paisCatalogo.catalogos"
          [label]="'País / Bloque'"
          [required]="false"
          id="pais"
          formControlName="pais"
        ></app-catalogo-select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="tratadoCatalogo.catalogos"
          [label]="'Tratado/Acuerdo'"
          [required]="false"
          id="tratado"
          formControlName="tratado"
        ></app-catalogo-select>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-4">
        <label>Fecha inicial:</label>
        <input type="date" required="true" class="form-control" formControlName="fechaInicial"/>
      </div>
      <div class="col-md-4">
        <label>Fecha final:</label>
        <input type="date" required="true" class="form-control" formControlName="fechaFinal"/>
      </div>
      <div class="col-md-3 mt-5 d-flex justify-content-end buscars">
        <button type="button" class="btn btn-primary ms-3">
          Buscar Certificado
        </button>
      </div>
    </div>
    <ng-container *ngIf="isBuscar">
      <div class="row mt-5">
        <ng-alert [CONTENIDO]="TEXTO_DE_ALERTA"></ng-alert>
      </div>
      <div class="row mt-5">
        <app-tabla-dinamica></app-tabla-dinamica>
      </div>
      <div class="table-container mt-5">
        <app-tabla-dinamica
          [tipoSeleccionTabla]="TablaSeleccion.UNDEFINED"
          [configuracionTabla]="headers"
          [datos]="certificadoDisponsiblesTablaDatos"
          formControlName="certificadoDisponibles"
        ></app-tabla-dinamica>
      </div>
    </ng-container>
  </ng-container>
</form>
