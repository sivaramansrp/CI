<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2>Cancelación de certificado</h2>
      </div>
      <div
        *ngIf="isNumeroDe"
        class="alert alert-danger text-center"
        role="alert"
      >
        <p>Corrija los siguientes errores:</p>
        <span style="color: rgb(134, 17, 17)">
          1.(Número de certificado) es un campo requerido
        </span>
      </div>
      <div
        *ngIf="isNumeroPattern"
        class="alert alert-danger text-center"
        role="alert"
      >
        <p>Corrija los siguientes errores:</p>
        <span style="color: rgb(134, 17, 17)">
          El certificado de origen no existe
        </span>
      </div>
      <div
        class="col-md-12 alert alert-danger"
        style="text-align: center"
        role="alert"
        *ngIf="isNumeroDatos"
      >
        Favor de verificar los campos que marcan error
      </div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno
        (eventoNumeroDePattern)="isNumeroDePattern($event)"
        (eventoNumeroDe)="isNumeroDeCertificado($event)"
        (miEvento)="alEventoHijo($event)"
        (eventoDatosHijoCertificado)="getDatosCertificado($event)"
        (isDatosNumero)="isDatosNumero($event)"
      ></app-paso-uno>
      } @case (2) { <app-paso-tres></app-paso-tres> } }
      <btn-continuar
        *ngIf="nombre === 1"
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
    </div>
  </div>
</div>
