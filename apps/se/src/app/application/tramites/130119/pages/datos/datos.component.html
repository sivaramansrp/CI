<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h3>Aviso Automático de Importación de Máquinas de funcionamiento eléctrico, electrónico, mecánico o combinación
        de ellos, a través de las cuales se realicen sorteos con números o símbolos, que están sujetos al azar</h3>
    </div>
  </div>

  <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
  <div>
    @switch (indice) {
    @case (1) {
     <app-paso-uno></app-paso-uno>
    }
    @case (2) {
    <app-paso-dos></app-paso-dos>
    }
    @case (3) {
   <app-paso-tres></app-paso-tres>

    }
    }
  </div>
  <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
</div>
