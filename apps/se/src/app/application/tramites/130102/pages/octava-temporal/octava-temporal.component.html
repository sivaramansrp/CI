
<div class="Page">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>Solicitud importación regla octava temporal</h1>
            </div>
            @if (mostrarErrorFormularios) {
                <div class="col-12">
                    <ng-alert [CUSTOMECLASS]="'alert-danger'" [CONTENIDO]="registroAlert"></ng-alert>
                  </div>
              }
        </div>
            <div class="row">
                <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
            </div>
        <div class="row">
            @switch (indice) {
            @case (1) {
           <app-datos></app-datos>
            }
            @case (2) {
                <app-paso-tres></app-paso-tres>
                 }
            }
        </div>
        <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    </div>

</div>
