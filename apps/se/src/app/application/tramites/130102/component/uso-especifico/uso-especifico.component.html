<div class="container">
    <ng-titulo titulo="Uso específico de la mercancía" />

    <!-- form -->
    <form [formGroup]="usoEspicificoForm">
        <div class="row">
            <div class="col-8">
                <app-catalogo-select 
               [label]="'Fracción arancelaria PROSEC (Especificar la fracción arancelaria del producto en el que se utilizará la mercancía a importar)'" 
                (change)="obtenerRequisitosFraccionArancelariaEsquema();setValoresStore(usoEspicificoForm,'fraccionArancelariaProsec', 'setFraccionArancelariaProsec')" 
                formControlName="fraccionArancelariaProsec"
                [catalogo]="catalogos"
               [required]="true"></app-catalogo-select>
            </div>
        </div>

        <div class="row">
            <div class="col-8">
                <label class="form-label text-start" for="descripcion">
                    Descripción fracción PROSEC (Especificar el nombre comercial o técnico del producto en el que se
                    utilizará la mercancía a importar):*
                </label>
                <textarea id="descripcionFraccionProsec" class="form-control height" rows="3"
                    formControlName="descripción"></textarea>
                    <div
                    *ngIf="
                      usoEspicificoForm.controls['descripción'].invalid &&
                      usoEspicificoForm.controls['descripción'].touched
                    "
                    class="text-danger"
                  >
                    <small *ngIf="usoEspicificoForm.controls['descripción'].errors?.['leadingSpaces']">No se permiten espacios al inicio del campo.</small>
                  </div>
            </div>
        </div>
         
        
            <div class="container text-end mt-5">
                <button class="btn btn-primary">Agregar</button>
            </div>
        
    </form>
</div>

<!-- Table -->
<div class="container mt-5">
    <div class="row mt-5">
        <h6>Fracciones arancelarias uso especifico</h6>
        <ng-table [commonTableHeader]="tableColumns" [commonTableBody]="tableData"></ng-table>
    </div>
    <div class="container text-end mt-5">
        <button class="btn btn-danger">Eliminar seleccionado</button>
    </div>
</div>
