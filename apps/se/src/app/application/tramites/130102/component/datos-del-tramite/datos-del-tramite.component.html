<div class="container">
  <form [formGroup]="formDelTramite">
    <ng-titulo titulo="Datos del trámite a realizar"> </ng-titulo>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label for="solicitud">Solicitud*:</label>
          <app-input-radio
            [radioOptions]="solicitude"
            [selectedValue]="defaultSelect"
            [isRequired]="true"
            (valueChange)="onValueChange($event)"
            [layout]="'vertical'"
            formControlName="solicitud"
            (change)="setValoresStore(formDelTramite,'solicitud', 'setSolicitude')"
          ></app-input-radio>
        </div>
      </div>
      <div class="col-md-8">
        <!--<div *ngFor="let catalogo of catalogosArray; let i = index">
          <app-catalogo-select [catalogo]="catalogo" [label]="inputFields[i].label" [placeholder]="inputFields[i].placeholder"
            [required]="inputFields[i].required" formControlName="fraccion"    [isDisabled]="esFormularioSoloLectura ? true : false"
            (change)="setValoresStore(formDelTramite,'fraccion', 'setFraccion')">
          </app-catalogo-select>
          @if (formDelTramite.controls['fraccion'].invalid && formDelTramite.controls['fraccion'].touched) {
            <div class="text-danger">
              @if (formDelTramite.controls['fraccion'].errors?.['required']) {
                <small>Debe seleccionar un valor.</small>
              }
            </div>
          }          
        </div>-->
        <div >
          <app-catalogo-select [catalogo]="catalogosArray[0]" [label]="inputFields[0].label" [placeholder]="inputFields[0].placeholder"
            [required]="inputFields[0].required" formControlName="regimen"    [isDisabled]="esFormularioSoloLectura ? true : false"
            (change)="setValoresStore(formDelTramite,'regimen', 'setRegimen')">
          </app-catalogo-select>
          @if (formDelTramite.controls['regimen'].invalid && formDelTramite.controls['regimen'].touched) {
            <div class="text-danger">
              @if (formDelTramite.controls['regimen'].errors?.['required']) {
                <small>Debe seleccionar un valor.</small>
              }
            
            </div>
          }         
        </div>
      </div>
    </div>
  </form>
</div>
