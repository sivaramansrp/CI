<div class="container">
    <div>
        <form>
            <div class="descripcion-cupo mt-5">
                <ng-titulo titulo="Descripción del cupo" />
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="regimenAduanero">Regimen aduanero:</label>
                        <input type="text" class="form-control" id="regimenAduanero" name="regimenAduanero">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="descripcionProducto">Descripción del producto:</label>
                        <input type="text" class="form-control" id="descripcionProducto" name="descripcionProducto">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="clasificacionSubProducto">Clasificacion del subproducto:</label>
                        <input type="text" class="form-control" id="clasificacionSubProducto" name="clasificacionSubProducto">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="unidadMedida">Unidad de medida:</label>
                        <input type="text" class="form-control" id="unidadMedida" name="unidadMedida">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="fechaInicio">Fecha inicio vigencia del cupo:</label>
                        <input type="text" class="form-control" id="fechaInicio" name="fechaInicio">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="fechaFin">Fecha fin vigencia del cupo:</label>
                        <input type="text" class="form-control" id="fechaFin" name="fechaFin">
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="form-group">
                        <label class="form-label" for="mecanismoAsignacion">Mecanismo de asignación:</label>
                        <input type="text" class="form-control" id="mecanismoAsignacion" name="mecanismoAsignacion">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="tratadoAcuerdo">Tratado / Acuerdo:</label>
                        <input type="text" class="form-control" id="tratadoAcuerdo" name="tratadoAcuerdo">
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="form-group">
                        <label class="form-label" for="fraccionesArancelarias">Fracciones arancelarias:</label>
                        <textarea cols="8" rows="6" class="form-control" id="fraccionesArancelarias" name="fraccionesArancelarias"></textarea>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="form-group">
                        <label class="form-label" for="paises">Países:</label>
                        <textarea cols="8" rows="6" class="form-control" id="paises" name="paises"></textarea>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="form-group">
                        <label class="form-label" for="observaciones">Observaciones:</label>
                        <textarea cols="8" rows="6" class="form-control" id="observaciones" name="observaciones"></textarea>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="form-group">
                        <label class="form-label" for="fundamento">Fundamento:</label>
                        <textarea cols="8" rows="6" class="form-control" id="fundamento" name="fundamento"></textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
