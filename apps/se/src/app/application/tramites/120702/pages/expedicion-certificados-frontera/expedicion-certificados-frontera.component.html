<div class="page">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div>
                    <h2>Expedición de certificados de la frontera personas morales</h2>
                </div>
                <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
            </div>
        </div>
        <div class="row">
            @switch (indice) {
            @case (1) {
            <app-paso-uno></app-paso-uno>
            }
            @case (2) {
            <app-paso-tres></app-paso-tres>
            }
            }
            <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
        </div>
        <div class="mt-5">
            <ng-alert [CONTENIDO]="avisoPrivacidadAlert"></ng-alert>
        </div>
    </div>
</div>
