<div class="container">
    <div class="row">
      <div class="col-md-6">
        <h1>Asignación directa de cupo personas morales (ampliación)</h1>
      </div>
    </div>

    <!-- Error messages section -->
    <div *ngIf="showBuscarError" class="alert alert-danger" role="alert">
      Corrija los siguientes errores:<br>
      1. El valor (Test) debe ser un número válido
    </div>

    <app-wizard [listaPasos]="pasos"></app-wizard>

    <div [ngSwitch]="indice">
      <div *ngSwitchCase="1">
        <app-asignciontab (buscarIntento)="onBuscarIntento($event)"></app-asignciontab>
      </div>
      <div *ngSwitchCase="2">
        <app-paso-dos></app-paso-dos>
      </div>
      <div *ngSwitchCase="3">
        <app-paso-tres></app-paso-tres>
      </div>
    </div>
    
    <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
</div>
