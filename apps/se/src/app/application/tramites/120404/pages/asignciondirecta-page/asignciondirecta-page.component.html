<div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1>Asignación directa de cupo personas morales (ampliación)</h1>
      </div>
    </div>
  <div class="col-md-12 mt-2" *ngIf="showBuscarError">
      <ng-alert [CONTENIDO]="buscarAlertText" [CUSTOMECLASS]="infoAlert"></ng-alert>
    </div>

   <div class="col-md-12 mt-2" *ngIf="showValidationError && validationErrorsList.length">
      <div class="alert alert-danger" role="alert">
        <div style="text-align: center;">
          <strong style="color: #585051ff">Faltan campos por capturar.</strong>
        </div>
       </div>
    </div>

    <app-wizard [listaPasos]="pasos"></app-wizard>
   @switch (indice) {
    @case (1) {
     <app-solicitante-entidad 
       (buscarIntento)="onBuscarIntento($event)"
       (formValidation)="onFormValidation($any($event))">
     </app-solicitante-entidad>
     }
    @case (2) {
   <app-paso-dos (formValidation)="onFormValidation($any($event))"></app-paso-dos>
    }
    @case (3) {
      <app-paso-tres (formValidation)="onFormValidation($any($event))"></app-paso-tres>
    }
  }    
 <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar> 
 <ng-alert [CONTENIDO]="avisoContrnido"></ng-alert>

</div>
