<div class="container">
    <div class="row">
      <div class="col-md-6">
        <h1>Asignación directa de cupo personas morales (ampliación)</h1>
      </div>
  <app-wizard [listaPasos]="pasos"></app-wizard>
       </div>

 <div>
    @switch (indice) {
    @case (1) {
   <app-solicitante-entidad></app-solicitante-entidad>
     }
    @case (2) {
   <app-paso-dos></app-paso-dos>
    }
    @case (3) {
      <app-paso-tres></app-paso-tres>
    }
  }
  </div>
  <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
</div>
