<div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1>Asignación directa de cupo personas morales (ampliación)</h1>
      </div>
    </div>

  
    <div class="col-md-12 mt-2" *ngIf="showBuscarError">
<ng-alert [CONTENIDO]="TEXTOS.TEXTOS_BUSCAR" [CUSTOMECLASS]="infoAlert"></ng-alert>
      </div>

    <app-wizard [listaPasos]="pasos"></app-wizard>
   @switch (indice) {
    @case (1) {
     <app-solicitante-entidad (buscarIntento)="onBuscarIntento($event)" (alertaEvento)="mostrarAlerta = $event"></app-solicitante-entidad>
     }
    @case (2) {
   <app-paso-dos></app-paso-dos>
    }
    @case (3) {
      <app-paso-tres></app-paso-tres>
    }
  }
    
    <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
     @if (mostrarAlerta) {
 <ng-alert [CONTENIDO]="avisoContrnido"></ng-alert>
}
</div>
