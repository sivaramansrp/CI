<div class="col-md-12">
    <br/>
<app-input-radio
          [radioOptions]="asignacionRadio"
          [isRequired]="true"
          [selectedValue]="selectedValue"
          [layout]="'vertical'"
          ></app-input-radio>
          </div>

<div class="container">
<form [formGroup]="asignacionForm" (ngSubmit)="buscar()">
        <div class="form" formGroupName="datosRegimen">
             <ng-titulo titulo="Número de oficio de asingación" />
              <div class="row mb-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <app-catalogo-select [catalogo]="asigncionid" [required]="true" name="asignacionSolitud"  [label]="'Año del oficio de asignación'" formControlName="asignacionsolitud"  >
                      </app-catalogo-select>
                      <div *ngIf="isInvalid('asignacionsolitud')" class="text-danger">
                        Este campo es obligatorio
                    </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group clasifi-regimen-catalogo">
                        <label for="clasificacionRegimen">Número de oficio de asignación*</label>
                        <input type="text" class="form-control" formControlName="numTramite" placeholder="6" id="numTramite" >
                        <div *ngIf="isInvalid('numTramite')" class="text-danger">
                                Este campo es obligatorio
                            </div>
                    </div>
                </div>
            </div>
        <div class="row mb-5">
            <div class="col-md-6 col-sm-6"></div>
            <div class="col-md-6 col-sm-6 text-end">
              <div class="btn-group">
                <button class="btn btn-primary me-2" type="button">Buscar</button>
                </div>
            </div>
          </div>
        </div>
    <form>
<app-solicitantetab></app-solicitantetab>
