<div class="container form-container">
            <ng-titulo titulo="Datos de la asignacion" />
            <form [formGroup]="formasignacion" (ngSubmit)="enviarFormulario()">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="especie">Fetch de inicio vigencia dela asignacion</label>
                        <input type="text" class="form-control" id="especie" formControlName="especie">
                        </div>
                    <div class="col-md-4">
                        <label for="funcionZootecnica">Fecha de fin vigencia de la asignacion</label>
                        <input type="text" class="form-control" id="funcionZootecnica" formControlName="funcionZootecnica">
                    </div>
                    <div class="col-md-4"></div>
                </div>
        <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="authorizado">Monto authorizado</label>
                        <input type="text" class="form-control" id="authorizado" formControlName="authorizado">
                        <p>(kilogramo)</p>
                    </div>
                    <div class="col-md-4">
                        <label for="Expendido">Monto Expendido</label>
                        <input type="text" class="form-control" id="expendido" formControlName="expendido">
                        <p>(kilogramo)</p>
                    </div>
                    <div class="col-md-4">
                        <label for="disponible">Monto disponible</label>
                        <input type="text" class="form-control" id="disponible" formControlName="disponible">
                        <p>(kilogramo)</p>
                    </div>
                    <ng-titulo titulo="Monto a ampliar" />
                    <div class="col-md-4">
                        <label for="ampliar" class="form-label">Monto a ampliar*</label>
                        <input type="text" class="form-control" id="ampliar" formControlName="ampliar">
                       <span>(kilogramo)</span>
                    </div>
                </div>
              <btn-continuar [datos]="datosPasos"></btn-continuar>
                 <div class="row">
                  <ng-alert [CONTENIDO]="texto"></ng-alert>
               </div>
                </form>
                </div>
