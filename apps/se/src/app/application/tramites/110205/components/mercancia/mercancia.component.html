<div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header d-flex justify-content-between">
        <h5 class="modal-title" id="exampleModalLabel">Datos de la mercancía</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form [formGroup]="mercanciaForm">
          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label" for="fraccionArancelaria">Fracción arancelaria: </label>
              <input type="text" class="form-control" formControlName="fraccionArancelaria" [readonly]="true"
              (change)="
                setValoresStore(
                mercanciaForm,
                'fraccionArancelaria',
                'setFraccionArancelaria'
                )" >
            </div>
            <div class="col-md-8">
              <label for="nombreComercialMercancia">Nombre comercial de la mercancía (igual que en la factura):</label>
              <input type="text" class="form-control" formControlName="nombreComercialMercancia"
              (change)="
                setValoresStore(
                mercanciaForm,
                'nombreComercialMercancia',
                'setNombreComercialMercancia'
                )">
            </div>
          </div>
      
          <div class="row mt-3 mb-3">
            <div class="col-md-8">
              <label for="nombreTecnico">Nombre técnico:</label>
              <input type="text" class="form-control" formControlName="nombreTecnico"
              (change)="
                setValoresStore(
                mercanciaForm,
                'nombreTecnico',
                'setNombreTecnico'
                )">
            </div>
          </div>
      
          <div class="row mt-3 mb-3">
            <div class="col-md-6">
              <label for="nombreIngles">Nombre en inglés:</label>
              <input type="text" class="form-control" formControlName="nombreIngles"
              (change)="
                setValoresStore(
                mercanciaForm,
                'nombreIngles',
                'setNombreIngles'
                )">
            </div>

            <div class="col-md-6">
              <label for="otrasInstancias">Otras instancias:</label>
              <input type="text" class="form-control" formControlName="otrasInstancias"
              (change)="
                setValoresStore(
                mercanciaForm,
                'otrasInstancias',
                'setOtrasInstancias'
                )">
            </div>

            <div class="col-md-6 mt-2">
              <label for="criterioParaConferirOrigen">Criterio para conferir origen:</label>
              <input type="text" class="form-control" formControlName="criterioParaConferirOrigen"
              (change)="
                setValoresStore(
                mercanciaForm,
                'criterioParaConferirOrigen',
                'setCriterioParaConferirOrigen'
                )">
            </div>
          </div>
      
          <div class="row mt-3 mb-3">
            <div class="col-md-6">
              <label for="cantidad">Cantidad:</label>
              <input type="number" class="form-control" formControlName="cantidad"
              (change)="
                setValoresStore(
                mercanciaForm,
                'cantidad',
                'setCantidad'
                )">
            </div>
            <div class="col-md-6">
                <app-catalogo-select [catalogo]="umc || []" [label]="'UMC'" [required]="true" name="estado" formControlName="umc" 
                (change)="
                setValoresStore(
                mercanciaForm,
                'umc',
                'setUmc'
                )"></app-catalogo-select>
              </div>
          </div>
          
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="valorMercancia">Valor de la mercancía (dólares)*:</label>
              <input type="number" class="form-control" formControlName="valorMercancia"
              (change)="
                setValoresStore(
                mercanciaForm,
                'valorMercancia',
                'setValorMercancia'
                )">
            </div>
            <div class="col-md-6">
              <label for="complementoDescripcion">Complemento de la descripción*:</label>
              <textarea class="mb-4 h-20 w-100 form-control" formControlName="complementoDescripcion" rows="2"
              (change)="
                setValoresStore(
                mercanciaForm,
                'complementoDescripcion',
                'setComplementoDescripcion'
                )"></textarea>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-4">
              <input-fecha [datos]="fechaFactura"></input-fecha>
            </div>
            <div class="col-md-4">
              <label for="numeroFactura">N° factura / Referencia:</label>
              <input type="text" class="form-control" formControlName="numeroFactura"
              (change)="
                setValoresStore(
                mercanciaForm,
                'numeroFactura',
                'setNumeroFactura'
                )" >
            </div>
            <div class="col-md-4 mr-2">
              <app-catalogo-select [catalogo]="factura || []" [label]="'Tipo de factura'" [required]="true" name="tipoFactura" formControlName="tipoFactura" 
              (change)="
                setValoresStore(
                mercanciaForm,
                'tipoFactura',
                'setTipoFactura'
                )"></app-catalogo-select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal" (click)="cerrarModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="activarModal()" >Agregar</button>
      </div>

      @if(nuevaNotificacion){
        <lib-notificaciones [notificacionInput]="nuevaNotificacion"></lib-notificaciones>
        }
