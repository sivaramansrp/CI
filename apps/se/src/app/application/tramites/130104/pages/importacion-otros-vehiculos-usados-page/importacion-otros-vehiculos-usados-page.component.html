<div class="container">
    <div class="row">
      <div class="col-md-12" *ngIf="indice === 1">
        <h1>Solicitud Importación Otros vehículos usados</h1>
      </div>
      <div class="col-md-12" *ngIf="indice === 2">
        <h1>Cargar archivos</h1>
      </div>
      <div class="col-md-12" *ngIf="indice === 3">
        <h1>Firmar</h1>
      </div>
    </div>

    <!-- <div class="col-12">
        <div class="col-md-12" *ngIf="esFormaValido">
          <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
    </div> -->
    <div class="row mt-5" *ngIf="indice === 2">
      <div class="col-md-12">
        <lib-notificaciones
          [notificacionInput]="alertaNotificacion"
        ></lib-notificaciones>
      </div>
    </div>
    <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    <div>
      @switch (indice) {
      @case (1) {
        <app-paso-uno></app-paso-uno>
      }
      @case (2) {
        <app-paso-dos></app-paso-dos>

      }
      @case (3) {
        <paso-firma [idSolicitud]="solicitudState.idSolicitud" [procedure]="130104"
        [procedureUrl]="'importacion-otros-vehiculos-usados/solicitud'"></paso-firma>
      }
    }
    </div>
    <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
</div>
