<div class="container">
    <div class="row">
      <ul class="nav nav-tabs">
        <li [ngClass]="indice === 1 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(1)">Solicitante</a>
        </li>
        <li [ngClass]="indice === 2 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(2)">Constancia del registro</a>
        </li>
        <li [ngClass]="indice === 3 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(3)">Facturas asociadas</a>
        </li>
        <li [ngClass]="indice === 4 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(4)">Capturar facturas</a>
        </li>
        <li [ngClass]="indice === 5 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(5)">Histórico fabricantes</a>
        </li>
        <li [ngClass]="indice === 6 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(6)">Importador en destino</a>
        </li>
      </ul>
  
      <ng-container>
        @switch (indice) {
        @case (1) {
        <solicitante></solicitante>
        }
         @case (2) {
        <app-constancia-del-registro></app-constancia-del-registro>
        }
        @case (3) {
          <app-facturas-asociadas></app-facturas-asociadas>
        } 
        @case (4) {
          <app-capturar-facturas></app-capturar-facturas>
        } 
        @case (5) {
          <app-historico-fabricantes></app-historico-fabricantes>
        }
        @case (6) {
          <app-importador-en-destino></app-importador-en-destino>
        }  
        }
      </ng-container>
    </div>
  </div>
