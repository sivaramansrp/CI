<div class="container">
    <form [formGroup]="fitosanitarioForm">
      <div class="row">
        <div class="col-md-12">
          <label for="Mostrar"
            >Mostrar:</label
          >
        </div>
        <app-input-radio
          [radioOptions]="radioOptions"
          [selectedValue]="selectedValue"
          (valueChange)="onValueChange($event)"
          [layout]="'horizontal'"
          [gap]="'50px'"
          formControlName="flexRadioRegistro"
          (change)="
            setValoresStore(
            fitosanitarioForm,
            'flexRadioRegistro',
            'setFlexRadioRegistro'
            )"
        ></app-input-radio>
        <div class="container text-end mt-5">
          <button class="btn btn-default me-2">Buscar</button>
        </div>
      </div>
      <div class="row">

            <div class="form-group">
              <label class="form-label" for="estado">Estado:</label>
              <input
                value=""
                class="form-control"
                id="estado"
                placeholder=""
                type="text"
                libUppercase
                name="estado"
                formControlName="estado"
                (change)="
                  setValoresStore(
                  fitosanitarioForm,
                  'estado',
                  'setEstado'
                  )"
              />
            </div>
          </div>
