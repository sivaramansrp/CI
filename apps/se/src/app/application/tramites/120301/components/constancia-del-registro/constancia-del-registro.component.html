<div class="container">
    <form [formGroup]="fitosanitarioForm">
      <div class="row">
        <div class="col-md-12">
          <label for="Mostrar"
            >Mostrar:</label
          >
        </div>
        <app-input-radio
          [radioOptions]="radioOptions"
          [selectedValue]="selectedValue"
          (valueChange)="onValueChange($event)"
          [layout]="'horizontal'"
          [gap]="'50px'"
          formControlName="flexRadioRegistro"
          (change)="
            setValoresStore(
            fitosanitarioForm,
            'flexRadioRegistro',
            'setFlexRadioRegistro'
            )"
        ></app-input-radio>
      </div>
      <div class="row">
        <div class="row pb-5">
          <ng-titulo titulo="Representación-federal"></ng-titulo>
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="estado">Estado:</label>
              <input
                value=""
                class="form-control"
                id="estado"
                placeholder=""
                type="text"
                appUppercase
                name="estado"
                formControlName="estado"
                (change)="
                  setValoresStore(
                  fitosanitarioForm,
                  'estado',
                  'setEstado'
                  )"
              />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="Representacion-federal"
                >Representación federal:</label
              >
              <input
                value=""
                class="form-control"
                id="representacionFederal"
                placeholder=""
                type="text"
                appUppercase
                name="representacionFederal"
                formControlName="representacionFederal"
                (change)="
                  setValoresStore(
                  fitosanitarioForm,
                  'representacionFederal',
                  'setRepresentacionFederal'
                  )"
              />
            </div>
          </div>
        </div>
        <div class="row pb-5">
          <ng-titulo titulo="Descripción del cupo"></ng-titulo>
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="Fraccion-arancelaria"
                >Fracción arancelaria:</label

                appUppercase

          </div>
          <div class="col-md-4">
            <div class="form-group">

                value=""
                class="form-control"
                id="producto"
                placeholder=""
                type="text"
                appUppercase

            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="Tratado">Tratado o bloque:</label>

                value=""

                appUppercase

          </div>
          <div class="col-md-4">

          <div class="col-md-4">
