<div class="container">
    <div class="row">
        <div class="col-md-12">
            <ng-titulo titulo="Datos de la factura" />
        </div>
        <div class="row mt-5">
          <div class="col-md-12">
            <label for="mercancia">Facturas asociadas</label>
          </div>
          <div class="col-md-12">
            <ng-table [commonTableHeader]="tableColumns" [commonTableBody]="facturas"></ng-table>
          </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <ng-titulo titulo="Datos de la factura" />
            </div>
            <div class="row mt-5">
              <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="Número-de-la-factura">Número de la factura:</label>
                    <input
                    class="form-control"
                    value=""
                    class="form-control"
                    id="Número-de-la-factura"
                    placeholder=""
                    type="text"
                    libUppercase
                    name="Número-de-la-factura"
                    />
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="Cantidad-total">Cantidad total:</label>
                    <input
                    class="form-control"
                    value=""
                    class="form-control"
                    id="Cantidad-total"
                    placeholder=""
                    type="text"
                    libUppercase
                    name="Cantidad-total"
                    />
                </div>
              </div>
              <div class="col-md-4">
                    <app-catalogo-select
                    [catalogo]="unidadDeMedida"
                    formControlName="unidadDeMedida"
                    [label]="'Unidad De Medida'"
                    [required]="true"
                    name="unidadDeMedida"
                  ></app-catalogo-select>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                    <input-fecha [datos]="fechaInicioInput" formControlName="fechaInicioInput"></input-fecha>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="Valor-en-dólares">Valor en dólares:</label>
                    <input
                    class="form-control"
                    value=""
                    class="form-control"
                    id="Valor-en-dólares"
                    placeholder=""
                    type="text"
                    libUppercase
                    name="Valor-en-dólares"
                    />
                </div>
              </div>
        </div>
        <div class="row mb-6">
            <div class="col-md-12">
                <ng-titulo titulo="Datos del emisor/consignatario" />
            </div>
            <div class="row mt-5">
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label" for="tax-id">TAX ID:</label>
                        <input
                        class="form-control"
                        value=""
                        class="form-control"
                        id="tax-id"
                        placeholder=""
                        type="text"
                        libUppercase
                        name="tax-id"
                        />
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="form-label" for="Razón-social">Razón social:</label>
                        <input
                        class="form-control"
                        value=""
                        class="form-control"
                        id="Razón-social"
                        placeholder=""
                        type="text"
                        libUppercase
                        name="Razón-social"
                        />
                    </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label" for="Calle">Calle:</label>
                    <input
                    class="form-control"
                    value=""
                    class="form-control"
                    id="Calle"
                    placeholder=""
                    type="text"
                    libUppercase
                    name="Calle"
                    />
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label" for="Ciudad">Ciudad:</label>
                    <input
                    class="form-control"
                    value=""
                    class="form-control"
                    id="Ciudad"
                    placeholder=""
                    type="text"
                    libUppercase
                    name="Ciudad"
                    />
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label" for="CP">CP:</label>
                    <input
                    class="form-control"
                    value=""
                    class="form-control"
                    id="CP"
                    placeholder=""
                    type="text"
                    libUppercase
                    name="CP"
                    />
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label" for="País">País:</label>
                    <input
                    class="form-control"
                    value=""
                    class="form-control"
                    id="País"
                    placeholder=""
                    type="text"
                    libUppercase
                    name="País"
                    />
                </div>
              </div>
            </div>
        </div>
        <div class="container text-end mt-5">
            <button class="btn btn-default me-2">Limpiar</button>
            <button class="btn btn-default me-2">Agregar</button>
            <button class="btn btn-primary me-2">Cerrar</button>
        </div>
    </div>
</div>
