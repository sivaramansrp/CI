<div class="container">
    <ng-titulo titulo="Asociar facturas a expedición"></ng-titulo>
    <h6>Facturas disponibles</h6>
    <form [formGroup]="formularioAsociacionFactura">
      <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX" [configuracionTabla]="tableColumns" [datos]="facturasDisponible" ></app-tabla-dinamica>
      <div class="col-12 col-xxl-4 col-xl-4 col-md-4 col-sm-4 mb-5 p-0">
        <label for="message" class="form-label">Cantidad asociada<span [ngClass]="{'text-danger': formularioAsociacionFactura.get('cantidadFacturas')?.invalid && (formularioAsociacionFactura.get('cantidadFacturas')?.touched || formularioAsociacionFactura.get('cantidadFacturas')?.dirty)}">*</span>:</label>
        <input type="text" class="form-control" id="message" placeholder="" formControlName="cantidadFacturas"
        (change)="
          setValoresStore(
          formularioAsociacionFactura,
          'cantidadFacturas',
          'setCantidadFacturas'
          )"/>
        @if (formularioAsociacionFactura.get('cantidadFacturas')?.invalid && (formularioAsociacionFactura.get('cantidadFacturas')?.touched || formularioAsociacionFactura.get('cantidadFacturas')?.dirty)) {
          <small class="text-danger">Este campo es obligatorio</small>
        }
      </div>
  
      <div class="container text-end mt-5">
        <button class="btn btn-default me-2">Asociar</button>
      </div>
      <h6>Facturas asociadas</h6>
      <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX" [configuracionTabla]="asociadastableColumns" [datos]="facturasAsociadas" ></app-tabla-dinamica>
      <div class="row mb-5">
        <div class="d-flex justify-content-end mt-3">
            <button type="submit" class="btn btn-primary ">Eliminar seleccionado</button>
            
        </div>
    </div>
      <div class="row mb-5">
        <div class="col-6 ">
          <label for="message" class="form-label">Cantidad total:</label>
          <input type="text" class="form-control" id="message" placeholder="" formControlName="cantidadFacturasTotal"
          (change)="
            setValoresStore(
            formularioAsociacionFactura,
            'cantidadFacturas',
            'setCantidadFacturas'
            )"/>
        </div>
        <div class="col-6 ">
          <label for="message" class="form-label">Metros cuadrados equivalentes:</label>
          <input type="text" class="form-control" id="message" placeholder="" formControlName="metrosCuadradosEquivalentes"
          (change)="
            setValoresStore(
            formularioAsociacionFactura,
            'cantidadFacturas',
            'setCantidadFacturas'
            )"/>
        </div>
        

      </div>
    </form>
  </div>
