<div class="container">
    <ng-titulo titulo="Asociar facturas a expedición"></ng-titulo>
    <h6>Facturas disponible</h6>
    <form [formGroup]="formularioAsociacionFactura">
      <ng-table
        [commonTableHeader]="tableColumns"
        [commonTableBody]="facturasDisponible"
      ></ng-table>
      <div class="col-12 col-xxl-4 col-xl-4 col-md-4 col-sm-4 mb-5">
        <label for="message" class="form-label">Cantidad*:</label>
        <input type="text" class="form-control" id="message" placeholder="" formControlName="cantidad"/>
        <p>Kilogramo</p>
      </div>
  
      <div class="container text-end mt-5">
        <button class="btn btn-default me-2">Asociar</button>
      </div>
      <h6>Facturas asociadas</h6>
  
      <ng-table
        [commonTableHeader]="asociadastableColumns"
        [commonTableBody]="facturasAsociadas"
      ></ng-table>
    </form>
  </div>
