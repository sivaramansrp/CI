<div class="container">
    <div class="row">
      <div class="col-md-12">
        <ng-titulo titulo="Importador en destino" />
      </div>
      <div class="row mt-5">
        <div class="col-md-6">
          <app-catalogo-select
            [label]="'Tipo'"
            [catalogo]="tipo"
            formControlName="tipo"
            [required]="true"
            name="tipo"
          ></app-catalogo-select>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="Cantidad-total"
              >Valor (sin espacios, sin guiones)*:</label
            >
            <input
              class="form-control"
              value=""
              class="form-control"
              id="Cantidad-total"
              placeholder=""
              type="text"
              libUppercase
              name="Cantidad-total"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="Razón-social">Razón social*:</label>
            <input
              class="form-control"
              value=""
              class="form-control"
              id="Razón-social"
              placeholder=""
              type="text"
              libUppercase
              name="Razón-social"
            />
          </div>
        </div>
        <div class="col-md-6"></div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="Domicilio">Domicilio*:</label>
            <input
              class="form-control"
              value=""
              class="form-control"
              id="Domicilio"
              placeholder=""
              type="text"
              libUppercase
              name="Domicilio"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="ciudad"
              >Ciudad (población, estado o provincia)*:</label
            >
            <input
              class="form-control"
              value=""
              class="form-control"
              id="ciudad"
              placeholder=""
              type="text"
              libUppercase
              name="ciudad"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="cp">C P*:</label>
            <input
              class="form-control"
              value=""
              class="form-control"
              id="cp"
              placeholder=""
              type="text"
              libUppercase
              name="cp"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="País">País*:</label>
            <input
              class="form-control"
              value=""
              class="form-control"
              id="País"
              placeholder=""
              type="text"
              libUppercase
              name="País"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
