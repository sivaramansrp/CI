<div class="Page">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>Cancelación de Certificados a Petición del Interesado</h1>
            </div>
            <div *ngIf="showBuscarError" class="alert alert-danger" role="alert">
                Corrija los siguientes errores:<br>
                Para ejecutar la búsqueda se requiere ingresar al menos el parámetro de búsqueda requerido.
            </div>
            <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
        </div>
        <div class="row">
            @switch (indice) {
            @case (1) {
                <app-datos (buscarIntento)="onBuscarIntento($event)"></app-datos>
            }
            @case (2) {
                <app-firmar-solicitud></app-firmar-solicitud>
            }
            }
            <btn-continuar
                  [datos]="datosPasos"
                  (continuarEvento)="getValorIndice($event)"
                >
            </btn-continuar>
        </div>
    </div>

</div>
<!-- </div> -->
