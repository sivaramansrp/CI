<div class="container">
    <div class="row">
        <ul class="nav nav-tabs">
            <li [ngClass]="indice === 1 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(1)">Solicitante</a>
            </li>
            <li [ngClass]="indice === 2 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(2)">Cancelación de
                    Certificados de Cupo</a>
            </li>

        </ul>
        @if(esDatosRespuesta){
        <ng-container>
            <app-140103solicitante [hidden]="indice !== 1"></app-140103solicitante>
            <app-solitude *ngIf="esDatosRespuesta" [hidden]="indice !== 2"></app-solitude>
        </ng-container>
    }
        
    </div>
</div>
