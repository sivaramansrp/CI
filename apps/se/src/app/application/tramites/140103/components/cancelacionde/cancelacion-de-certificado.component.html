<ng-titulo titulo="Buscar cupos" />




  <div class="container" [formGroup]="CancelacionForm">
    <div>
    
           <div class="row">
             <div class="col-md-4">          

              <app-catalogo-select [catalogo]="regimen" [label]="'Régimen aduanero:'"   [required]="true" name="regimen"
              formControlName="regimen" (change)="setValoresStore(CancelacionForm,'regimen', 'setRegimen')">
          </app-catalogo-select>

           </div>
           <div class="col-md-4">
           
             <app-catalogo-select [catalogo]="mecanismo" [label]="'Mecanismo de asignación:'"   [required]="true" name="regime"
              formControlName="mecanismo" (change)="setValoresStore(CancelacionForm,'mecanismo', 'setMecanismo')">
          </app-catalogo-select>
          </div>
          <div class="col-md-4">
           
             <app-catalogo-select [catalogo]="tratado" [label]="'Tratado o bloqueo comercial:'"   [required]="true" name="tratado"
             formControlName="tratado" (change)="setValoresStore(CancelacionForm,'tratado', 'setTratado')">
         </app-catalogo-select>
          </div>
   </div>
   <div class="row">
    <div class="col-md-4">
  
     <app-catalogo-select [catalogo]="producto" [label]="'Nombre de producto:'"   [required]="true" name="producto"
             formControlName="producto" (change)="setValoresStore(CancelacionForm,'producto', 'setProducto')">
         </app-catalogo-select>
  </div>
  <div class="col-md-4">
 
    <app-catalogo-select [catalogo]="subproducto" [label]="'Nombre del subproducto:'"   [required]="true" name="subproducto"
    formControlName="subproducto" (change)="setValoresStore(CancelacionForm,'subproducto', 'setSubproducto')">
</app-catalogo-select>
 </div>
 <div class="col-md-4">
  
    <app-catalogo-select [catalogo]="representacion" [label]="'Representación federal:'"   [required]="true" name="representacion"
    formControlName="representacion" (change)="setValoresStore(CancelacionForm,'representacion', 'setRepresentacion')">
</app-catalogo-select>


</div>
</div>

<div class="row" style="padding-top: 20px;text-align: right;">
    <div>
        <button type="button" class="btn btn-primary btn-space" >Buscar</button>
        
    </div>
</div>
<H6> Cupos disponibles</H6>
<app-tabla-dinamica 
  [configuracionTabla]="configuracionTabla"
  [datos]="Cancelacion">
</app-tabla-dinamica>
</div>
</div>
