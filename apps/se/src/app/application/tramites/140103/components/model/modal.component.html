<div
  class="modal fade"
  [class.show]="active"
  [style.display]="active ? 'block' : 'none'"
  tabindex="-1"
  role="dialog"
>
  <div class="modal-dialog modal-dialog-centered modal-90w" role="document">
    <div class="modal-content">
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop fade" [class.show]="active" *ngIf="active"></div>
