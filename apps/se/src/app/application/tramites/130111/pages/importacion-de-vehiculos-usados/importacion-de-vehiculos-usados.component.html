<div class="page">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <h2>Solicitud Importación Vehículos usados adaptados para personas físicas con actividad empresarial o personas morales </h2>
        </div>
        <app-wizard [listaPasos]="pasosSolicitar"></app-wizard>
      </div>
  
      <div class="row">
        @switch(indice){
          @case(1){
            <app-paso-uno></app-paso-uno>
            }@case(2){
              <app-paso-dos></app-paso-dos>
            }@case(3){
              <app-paso-tres></app-paso-tres>
            }
        }
        <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    </div>
    <div class="container">
      <div class="row">    
        <ng-alert [CONTENIDO]="TEXTOS.AVISO.Aviso"></ng-alert>
      </div>   
    </div>
  </div>
