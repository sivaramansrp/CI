<div class="Page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-12">
        <h1>Asignación directa de cupo personas físicas (primera vez)</h1>
      </div>
      
      <!-- Validation messages above wizard -->
      @if (mostrarMensajeValidacion) {
        <div class="col-md-12 mb-3">
          <div class="alert alert-primary alert-dismissible fade show custom-info-alert" role="alert">
            {{ mensajeValidacion }}
            <button (click)="cerrarMensajeValidacion()"></button>
          </div>
        </div>
      }
      
      <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-datos></app-datos>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
      }
     }
    </div>

    <btn-continuar
      [datos]="datosPasos"
      (continuarEvento)="getValorIndice($event)"
    ></btn-continuar>
  </div>
  </div>

  <div class="container">
    <div class="row">    
      <ng-alert [CONTENIDO]="TEXTOS.AVISO.Aviso"></ng-alert>
    </div>   
  </div>
