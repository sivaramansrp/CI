<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2>{{ tituloMensaje }}</h2>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno></app-paso-uno>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      }  @case (3) {
      <paso-firma [idSolicitud]="idSolicitud" [procedure]="80102" [procedureUrl]="'autorizacion-programa-nuevo/solicitud'"></paso-firma> 
      } }

      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
        [btnGuardar]="true"
        [btnGuardarVisible]="btnGuardarVisible"
        (btnGuardarClicked)="obtenerDatosDelStore()"
      ></btn-continuar>
    </div>
  </div>
</div>
