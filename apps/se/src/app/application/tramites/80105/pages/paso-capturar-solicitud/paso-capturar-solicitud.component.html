<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h1>Registro de solicitud IMMEX modalidad terciarización</h1>
    </div>

    <app-wizard [listaPasos]="pasos"></app-wizard>

  </div>

  <div class="row">
    @switch (indice) {
    @case (1) {
    <app-paso-uno-cs></app-paso-uno-cs>
    }
    @case (2) {
    <app-paso-dos></app-paso-dos>
    }
    @case (3) {
    <paso-firma [idSolicitud]="solicitudState.idSolicitud" [procedure]="80105" [procedureUrl]="'modalidad-terciarizacion/action'"></paso-firma>
    }
    }
    <btn-continuar
      [datos]="datosPasos"
      [btnGuardar]="true" 
      [btnGuardarVisible]="btnGuardarVisible"
      (btnGuardarClicked)="obtenerDatosDelStore()"
      (continuarEvento)="getValorIndice($event)"
    ></btn-continuar>
  </div>
</div>
