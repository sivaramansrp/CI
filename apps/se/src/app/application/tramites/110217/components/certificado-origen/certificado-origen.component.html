<div class="container">
  <ng-titulo titulo="Validación a posteriori del certificado de circulación de mercancías" />
  <form [formGroup]="formCertificado">

    <div class="row">

      <div class="col-md-12">
        <label class="form-check-label text-justify" for="tercerOperador">¿La operación se realizó con un tercer
          operador?</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="checkbox">
          <input type="checkbox" id="tercerOperador" formControlName="tercerOperador"
            (change)="setValoresStore(formCertificado,'tercerOperador', 'setTercerOperador')" />
          <label for="tercerOperador">&nbsp;si</label>
        </div>
      </div>
    </div>

    <div class="row" *ngIf="solicitudState?.tercerOperador">
      <ng-container formGroupName="grupoOperador" *ngIf="formCertificado.get('grupoOperador')">
        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Nombre(s):</label>
            <input type="text" class="form-control" formControlName="nombre"
              (change)="setValoresStore(grupoOperador, 'nombre', 'setGrupoOperadorNombre')" />
          </div>
          <div class="col-md-4 mb-3">
            <label>Primer apellido:</label>
            <input type="text" class="form-control" id="primerApellido" formControlName="apellidoPrimer"
              (click)="onClick()"
              (change)="setValoresStore(grupoOperador, 'apellidoPrimer','setGrupoOperadorApellidoPrimer')" />
          </div>
          <div class="col-md-4 mb-3">
            <label>Segundo apellido:</label>
            <input type="text" class="form-control" id="segundoApellido" formControlName="apellidoSegundo" (change)="
                    setValoresStore(grupoOperador, 'apellidoSegundo', 'setGrupoOperadorSegundo')" />
          </div>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Número de registro fiscal*:</label>
            <input type="text" class="form-control" id="numeroFiscal" formControlName="numeroFiscal"
              [ngClass]="isValid(grupoOperador,'numeroFiscal') ? 'required' : ''"
              (change)="setValoresStore(grupoOperador, 'numeroFiscal', 'setGrupoOperadorNumeroFiscal')" />
          </div>
          <div class="col-md-8 mb-3">
            <label>Razón social:</label>
            <input type="text" class="form-control"
              [ngClass]="{GrayClass: registroFormulario.get('grupoOperador.apellidoPrimer')?.value !== ''}"
              id="denominacion" [readonly]=" registroFormulario.get('grupoOperador.apellidoPrimer')?.value !== ''"
              formControlName="razonSocial"
              (change)="setValoresStore(grupoOperador, 'razonSocial', 'setGrupoOperadorRazonSocial')" />
          </div>
        </div>
      </ng-container>
    </div>

    <div class="row">
      <ng-titulo titulo="Domicilio del tracer operador" />
      <ng-container formGroupName="grupoDeDomicilio">
        <div class="row">
          <div class="col-md-8 mb-3">
            <label>Ciudad (población, estado o provincia)*:</label>
            <input type="text" class="form-control" id="ciudad" formControlName="ciudad"
              [ngClass]="isValid(grupoDeDomicilio,'ciudad') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'ciudad','setGrupoDeDomicilioCiudad')" />
          </div>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Calle*:</label>
            <input type="text" class="form-control" id="nombre" formControlName="calle"
              [ngClass]="isValid(grupoDeDomicilio,'calle') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'calle', 'setGrupoDeDomicilioCalle')" />
          </div>
          <div class="col-md-4 mb-3">
            <label>Número y/o letra*:</label>
            <input type="text" class="form-control" id="numeroLetra" formControlName="numeroLetra"
              [ngClass]="isValid(grupoDeDomicilio,'numeroLetra') ? 'required' : ''"
              (change)="setValoresStore(grupoDeDomicilio, 'numeroLetra', 'setGrupoDeDomicilioNumeroLetra')" />
          </div>
          <div class="col-md-1 mb-3">
            <label>Lada:</label>
            <input type="text" class="form-control" id="lada" formControlName="lada"
              (change)="setValoresStore(grupoDeDomicilio, 'lada', 'setGrupoDeDomicilioLada')" />
          </div>
          <div class="col-md-3 mb-3">
            <label>Teléfono:</label>
            <input type="text" class="form-control" id="telefono" formControlName="telefono"
              (change)="setValoresStore(grupoDeDomicilio, 'telefono', 'setGrupoDeDomicilioTelefono')" />
          </div>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label>Fax:</label>
              <input type="text" class="form-control" id="fax" formControlName="fax"
                (change)="setValoresStore(grupoDeDomicilio, 'fax', 'setGrupoDeDomicilioFax')" />
            </div>
            <div class="col-md-4 mb-3">
              <label>Correo electrónico*:</label><span class="bi bi-question-circle-fill" title="ejemplo@dominio.com"
                data-bs-toggle="tooltip"></span>
              <input type="text" class="form-control" id="correoElectronico" formControlName="correoElectronico"
                [ngClass]="isValid(grupoDeDomicilio,'correoElectronico') ? 'required' : ''"
                (change)="setValoresStore(grupoDeDomicilio,'correoElectronico','setGrupoDeDomicilioCorreoElectronico')" />
            </div>
          </div>
        </div>
      </ng-container>
    </div>



    <ng-container formGroupName="grupoTratado">

      <div class="row">
        <ng-titulo titulo="Tratado y país o bloque" />
        <div class="col-md-4">
          <label>Tratado/Acuerdo*:</label>
          <app-catalogo-select [catalogo]="optionsTratado" [required]="true" id="tratado" formControlName="tratado"
            (change)=" setValoresStore(grupoTratado, 'tratado', 'setGrupoTratadoTratado') "></app-catalogo-select>
        </div>
        <div class="col-md-4">
          <label>País / Bloque*:</label>
          <app-catalogo-select [catalogo]="optionsPais" [label]="'País / Bloque'" [required]="true" id="pais"
            formControlName="pais"
            (change)="setValoresStore(grupoTratado, 'pais', 'setGrupoTratadoPais')"></app-catalogo-select>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <label>Fracción arancelaria:</label>
          <input type="number" required="true" class="form-control" formControlName="fraccionArancelaria"
            (change)=" setValoresStore( grupoTratado, 'fraccionArancelaria', 'setGrupoTratadoFraccionArancelaria' ) " />
        </div>
        <div class="col-md-4">
          <label># Registro producto:</label>
          <input type="text" required="true" class="form-control" formControlName="numeroRegistro"
            (change)=" setValoresStore( grupoTratado, 'numeroRegistro', 'setGrupoTratadoNumeroRegistro' ) " />
        </div>
        <div class="col-md-4">
          <label>Nombre comercial:</label>
          <input type="text" required="true" class="form-control" formControlName="nombreComercial"
            (change)=" setValoresStore( grupoTratado, 'nombreComercial', 'setGrupoTratadoNombreComercial' ) " />
        </div>
      </div>
      <div class="row mt-3">
        <label style="margin-left: 338px">Periodo</label>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <input-fecha [setFecha]="formCertificado.get('grupoTratado.fechaInicial')?.value" [datos]="fechaInicialInput"
            (valorCambiado)="cambioFechaInicial($event)"></input-fecha>
        </div>
        <div class="col-md-4">
          <input-fecha [setFecha]="formCertificado.get('grupoTratado.fechaFinal')?.value" [datos]="fechaFinalInput"
            (valorCambiado)="cambioFechaFinal($event)"></input-fecha>
        </div>
      </div>
    </ng-container>



  </form>

</div>

<div>
  <ng-titulo titulo="Datos de la mercancía" />
  <form [formGroup]="mercanciaForm">
    <ng-container formGroupName="validacionMercanciaForm">
      <div class="row">
        <div class="col-md-4">
          <label>Fracción arancelaria:</label>
          <input type="text" required="true" class="form-control grisColor" readonly
            formControlName="fraccionMercanciaArancelaria"
            (change)=" setValoresStore( validacionMercanciaForm, 'fraccionMercanciaArancelaria', 'setFraccionMercanciaArancelaria' ) " />
        </div>
        <div class="col-md-8">
          <label>Nombre comercial de la mercancía(igual que en la factura):</label>
          <input type="text" required="true" class="form-control grisColor"
            formControlName="nombreComercialDelaMercancia" readonly
            (change)=" setValoresStore( validacionMercanciaForm, 'nombreComercialDelaMercancia', 'setNombreComercialDelaMercancia' ) " />
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-8">
          <label>Nombre técnico:</label>
          <input type="text" required="true" class="form-control grisColor" formControlName="nombreTecnico" readonly
            (change)=" setValoresStore( validacionMercanciaForm, 'nombreTecnico', 'setNombreTecnico' ) " />
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-8">
          <label>Nomre en inglés:</label>
          <input type="text" required="true" class="form-control grisColor" formControlName="nombreEnIngles" readonly
            (change)=" setValoresStore( validacionMercanciaForm, 'nombreEnIngles', 'setNombreEnIngles' ) " />
        </div>
        <div class="col-md-4">
          <label>Otras instancias:</label>
          <input type="text" required="true" class="form-control grisColor" formControlName="otrasInstancias:" readonly
            (change)=" setValoresStore( validacionMercanciaForm, 'otrasInstancias', 'setOtrasInstancias' ) " />
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <label>Criterio para conferir origen:</label>
          <input type="text" required="true" class="form-control grisColor" formControlName="criterioParaConferir"
            readonly
            (change)=" setValoresStore( validacionMercanciaForm, 'criterioParaConferir', 'setCriterioParaConferir' ) " />
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-4">
          <label>Cantidad:</label>
          <input type="number" class="form-control" formControlName="cantidad" [required]="true" (change)=" setValoresStore( validacionMercanciaForm, 'cantidad', 'setcantidad' ) " />
        </div>
        <div class="col-md-4">
          <label>UMC:</label>
          <app-catalogo-select [catalogo]="optionsPais" [label]="'UMC'" [required]="true" id="pais"
          formControlName="pais"
          (change)="setValoresStore(validacionMercanciaForm, 'pais', 'setGrupoTratadoPais')"></app-catalogo-select>

        </div>
        
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <label>Valor de la mercancía(dólares)*:</label>
          <input type="text" required="true" class="form-control" formControlName="valorDelaMercancia" (change)=" setValoresStore( validacionMercanciaForm, 'valorDelaMercancia', 'setValorDelaMercancia' ) " />
        </div>
        <div class="col-md-8">
          <label>Complemento de la descripción*:</label>
          <textarea cols="80" rows="3" formControlName="complementoDelaDescripcion" (change)=" setValoresStore( validacionMercanciaForm, 'complementoDelaDescripcion', 'setComplementoDelaDescripcion' ) "></textarea>
        </div>
      </div>

     <div class="row mt-5">
        <div class="col-md-4">
          <input-fecha [setFecha]="mercanciaForm.get('fecha')?.value" [datos]="fechaFacturaInput" (valorCambiado)="cambioFechaFactura($event)"></input-fecha>
        </div>
        <div class="col-md-4">
          <label>N° factura*:</label>
          <input type="text" required="true" class="form-control" formControlName="numeroFactura" (change)=" setValoresStore( validacionMercanciaForm, 'numeroFactura', 'setNFactura' ) " />
        </div>
        <div class="col-md-4">
          <label >Tipo de factura</label>
          <app-catalogo-select [catalogo]="optionsTipoFactura" [label]="'Tipo de factura'" [required]="true" id="tipoFactura" formControlName="tipoFactura" (change)=" setValoresStore( validacionMercanciaForm, 'tipoFactura', 'setTipoFactura' ) "></app-catalogo-select>
        </div>
      </div>
    </ng-container>
  </form>
</div>
