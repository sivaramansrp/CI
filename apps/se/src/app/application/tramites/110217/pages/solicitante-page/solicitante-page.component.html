<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-6">
        <h3>Registro del codigo alfanumerico armonizado del transportista</h3>
      </div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno></app-paso-uno>
      } @case (2) {
      <app-paso-tres></app-paso-tres>
      }
      }
      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
      @if(indice ===1){
      <ng-alert [CONTENIDO]="TEXTOS.Aviso"></ng-alert>
      }
    </div>
  </div>
</div>
