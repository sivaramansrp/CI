<div class="page">
  <div class="container">
    <div class="row">

      @if(indice === 1){
      <div class="col-md-12">
        <h1>Permiso automático de importación</h1>
      </div>
      }
      @if(indice === 2){
      <div class="col-md-12">
        <h1>Cargar archivos</h1>
      </div>
      }

       @if (!esValido) {
        <ng-alert [CONTENIDO]="ALERTA" [CUSTOMECLASS]="infoError"></ng-alert>
      }

      <div class="row mt-5" *ngIf="indice === 2">
      <div class="col-md-12">
        <lib-notificaciones
          [notificacionInput]="alertaNotificacion"
        ></lib-notificaciones>
      </div>
    </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) {
      @case (1) {
      <app-paso-uno #pasoUno></app-paso-uno>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-cuatro></app-paso-cuatro>
      }
      }

      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    </div>
  </div>
</div>
