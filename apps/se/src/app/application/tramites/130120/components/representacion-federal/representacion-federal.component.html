<div class="container">
    <form [formGroup]="datosFederal">
      <ng-titulo [titulo]="'Representación federal'"></ng-titulo>
      <div class="row align-items-end">
        <!-- Entidad federativa -->
        <div class="col-md-6">
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="entidadOpcion"
              [label]="'Entidad federativa'"
              [isDisabled]="esFormularioSoloLectura"
              formControlName="entidad_federativa"
              [required]="true"
              (change)="onEntidadSeleccionado()">
            </app-catalogo-select>
            <div *ngIf="datosFederal.get('entidad_federativa')?.touched && datosFederal.get('entidad_federativa')?.invalid">
              <small *ngIf="datosFederal.get('entidad_federativa')?.errors?.['required']" class="text-danger espaciador-campo-pequeño">Este campo es obligatorio</small>
            </div>
          </div>
        </div>
        <!-- Representación federal -->
        <div class="col-md-6">
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="representacionOpcion"
              [isDisabled]="esFormularioSoloLectura"
              [label]="'Representación federal'"
              formControlName="representacion_federal"
              [required]="true"
              (change)="setValoresStore(datosFederal, 'representacion_federal', 'setRepresentacion_federal')">
            </app-catalogo-select>
            <div *ngIf="datosFederal.get('representacion_federal')?.touched && datosFederal.get('representacion_federal')?.invalid">
              <small *ngIf="datosFederal.get('representacion_federal')?.errors?.['required']" class="text-danger espaciador-campo-pequeño">Este campo es obligatorio</small>
            </div>
          </div>
        </div>
      </div>
    </form>
</div>
