<div class="page">
  <div class="container">
    <div class="row mb-3">
      <div class="col-md-12">
        <h3>Validar inicialmente el certificado de Uruguay</h3>
      </div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) {
        @case (1) {
          <app-paso-uno #pasoUnoRef></app-paso-uno>
        }
        @case (2) {
          <app-paso-tres></app-paso-tres>
        }
      }
      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
        [dePadre]="true"
        [btnGuardar]="true"
      ></btn-continuar>
    </div>
  </div>
</div>

<lib-notificaciones
  *ngIf="btnContinuar"
  [notificacionInput]="nuevaNotificacion"
  (confirmacionModal)="btnContinuarNotificacion()"
>
</lib-notificaciones>
