<div class="page">
  <div class="container">
    <div class="row mb-3">
      <div class="col-md-12">
        <h3>Validar inicialmente el certificado de Uruguay</h3>
      </div>
      <ng-container>
        <ng-alert *ngIf="isAlerta" [CONTENIDO]="TEXTO_DE_ALERTA" [CUSTOMECLASS]="'alert-warning'"
          class="mt-5"></ng-alert>
        <ng-alert *ngIf="isPeligro" [CONTENIDO]="TEXTO_DE_PELIGRO" [CUSTOMECLASS]="'alert-danger'"
          class="mt-5"></ng-alert>
      </ng-container>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno></app-paso-uno>
      } @case (2) {
      <app-paso-tres></app-paso-tres>
      }
      }
      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    </div>
  </div>
</div>
