<form [formGroup]="registroFormulario" (ngSubmit)="validarDestinatarioFormulario()">
  <ng-titulo titulo="Datos del destinatario" />
  <ng-container formGroupName="grupoReceptor">
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Nombre(s):</label>
        <input type="text" class="form-control" formControlName="nombre" id="nombre"
          (change)="setValoresStore(grupoReceptor, 'nombre', 'setGrupoReceptorNombre')" />
      </div>
      <div class="col-md-4 mb-3">
        <label>Primer apellido:</label>
        <input type="text" class="form-control" id="primerApellido" formControlName="apellidoPrimer" (click)="onClick()"
          (change)="setValoresStore(grupoReceptor, 'apellidoPrimer','setGrupoReceptorApellidoPrimer')" />
      </div>
      <div class="col-md-4 mb-3">
        <label>Segundo apellido:</label>
        <input type="text" class="form-control" id="segundoApellido" formControlName="apellidoSegundo" (change)="
            setValoresStore(grupoReceptor,    'apellidoSegundo', 'setGrupoReceptorApellidoSegundo')" />
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Número de registro fiscal*:</label>
        <input type="text" class="form-control" id="numeroFiscal" formControlName="numeroFiscal"
          [ngClass]="isValid(grupoReceptor,'numeroFiscal') ? 'required' : ''"
          (change)="setValoresStore(grupoReceptor, 'numeroFiscal', 'setGrupoReceptorNumeroFiscal')" />
      </div>
      <div class="col-md-8 mb-3">
        <label>Razón social:</label>
        <input type="text" class="form-control"
          [ngClass]="{'gray-glass': registroFormulario.get('grupoReceptor.apellidoPrimer')?.value !== ''}"
          id="denominacion" [readonly]=" registroFormulario.get('grupoReceptor.apellidoPrimer')?.value !== ''"
          formControlName="razonSocial"
          (change)="setValoresStore(grupoReceptor, 'razonSocial', 'setGrupoReceptorRazonSocial')" />
      </div>
    </div>
  </ng-container>

  <ng-titulo titulo="Domicilio del destinatario" />
  <ng-container formGroupName="grupoDeDirecciones">
    <div class="row">
      <div class="col-md-8 mb-3">
        <label>Ciudad (población, estado o provincia)*:</label>
        <input type="text" class="form-control" id="ciudad" formControlName="ciudad"
          [ngClass]="isValid(grupoDeDirecciones,'ciudad') ? 'required' : ''"
          (change)="setValoresStore(grupoDeDirecciones, 'ciudad','setGrupoDeDireccionesCiudad')" />
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Calle*:</label>
        <input type="text" class="form-control" id="nombre" formControlName="calle"
          [ngClass]="isValid(grupoDeDirecciones,'calle') ? 'required' : ''"
          (change)="setValoresStore(grupoDeDirecciones, 'calle', 'setGrupoDeDireccionesCalle')" />
      </div>
      <div class="col-md-4 mb-3">
        <label>Número y/o letra*:</label>
        <input type="text" class="form-control" id="numeroLetra" formControlName="numeroLetra"
          [ngClass]="isValid(grupoDeDirecciones,'numeroLetra') ? 'required' : ''"
          (change)="setValoresStore(grupoDeDirecciones, 'numeroLetra', 'setGrupoDeDireccionesNumeroLetra')" />
      </div>
      <div class="col-md-4 mb-3">
        <label>Teléfono:</label>
        <input type="text" class="form-control" id="telefono" formControlName="telefono"
          (change)="setValoresStore(grupoDeDirecciones, 'telefono', 'setGrupoDeDireccionesTelefono')" />
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label>Correo electrónico*:</label><span class="bi bi-question-circle-fill" title="ejemplo@dominio.com"
            data-bs-toggle="tooltip"></span>
          <input type="text" class="form-control" id="correoElectronico" formControlName="correoElectronico"
            [ngClass]="isValid(grupoDeDirecciones,'correoElectronico') ? 'required' : ''"
            (change)="setValoresStore(grupoDeDirecciones,'correoElectronico','setGrupoDeDireccionesCorreoElectronico')" />
        </div>
      </div>
    </div>
  </ng-container>

  <ng-titulo titulo="Datos del representante legal del exportador" />
  <ng-container formGroupName="grupoRepresentativo">
    <div class="row">
      <div class="col-md-8 mb-3">
        <label>Lugar*:</label>
        <input type="text" class="form-control" id="lugar" formControlName="lugar"
          [ngClass]="isValid(grupoRepresentativo,'lugar') ? 'required' : ''"
          (change)="setValoresStore(grupoRepresentativo, 'lugar', 'setGrupoRepresentativoLugar')" />
      </div>
    </div>
    <div class="row">
      <div class="col-md-8 mb-3">
        <label>Nombre del representante legal del exportador*:</label>
        <input type="text" class="form-control" id="nombreExportador" formControlName="nombreExportador"
          [ngClass]="isValid(grupoRepresentativo,'nombreExportador') ? 'required' : ''"
          (change)="setValoresStore(grupoRepresentativo, 'nombreExportador', 'setGrupoRepresentativoNombreExportador')" />
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Empresa*:</label>
        <input type="text" class="form-control" id="empresa" formControlName="empresa"
          [ngClass]="isValid(grupoRepresentativo,'empresa') ? 'required' : ''"
          (change)="setValoresStore(grupoRepresentativo, 'empresa', 'setGrupoRepresentativoEmpresa')" />
      </div>
      <div class="col-md-4 mb-3">
        <label>Cargo*:</label>
        <input type="text" class="form-control" id="cargo" formControlName="cargo"
          [ngClass]="isValid(grupoRepresentativo,'cargo') ? 'required' : ''"
          (change)="setValoresStore(grupoRepresentativo, 'cargo', 'setGrupoRepresentativoCargo')" />
      </div>
      <div class="col-md-4 mb-3">
        <label>Teléfono*:</label>
        <input type="text" class="form-control" id="telefono" formControlName="telefono"
          [ngClass]="isValid(grupoRepresentativo,'telefono') ? 'required' : ''"
          (change)="setValoresStore(grupoRepresentativo, 'telefono', 'setGrupoRepresentativoTelefono')" />
      </div>
      <div class="row">
        <div class="col-md-4 mb-3">
          <label>Correo electrónico*:</label><span class="bi bi-question-circle-fill" title="ejemplo@dominio.com"
            data-bs-toggle="tooltip"></span>
          <input type="text" class="form-control" id="correoElectronico" formControlName="correoElectronico"
            [ngClass]="isValid(grupoRepresentativo,'correoElectronico') ? 'required' : ''"
            (change)="setValoresStore( grupoRepresentativo,'correoElectronico','setGrupoRepresentativoCorreoElectronico')" />
        </div>
      </div>
    </div>
  </ng-container>

</form>
