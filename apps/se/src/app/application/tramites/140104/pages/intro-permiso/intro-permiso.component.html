<div class="page">
  <div class="container">
    @if (indice !== 2) {
    <div class="row" [class.hide]="mostrarBusqueda">
      <div class="col-md-12">
        <h4>{{tituloMensaje}}</h4>
      </div>
    </div>}
      @if (indice === 2) {
        <div class="=row">
          <div class="col-md-12">
            <h2>Cargar archivos</h2>
            <ng-alert [CONTENIDO]="alerta" [CUSTOMECLASS]="infoAlert"></ng-alert>
          </div>
        </div>}
      @if(esFormaValido){
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
        }

      <app-wizard [listaPasos]="pasos"></app-wizard>
    

    <div class="row">
      @switch (indice) {
        @case (1) {
          <app-paso-uno #pasoUnoRef></app-paso-uno>
        } @case (2) {
         <app-paso-carga-documento [idSolicitud]="solicitudState.idSolicitud" [idTipoTRamite]="'260203'"
      [cargaArchivosEvento]="cargarArchivosEvento" (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
      (reenviarCargaRealizada)="cargaRealizada($event)"
      (cargaEnProgreso)="onCargaEnProgreso($event)"></app-paso-carga-documento>
        } @case (3) {
        <paso-firma [idSolicitud]="solicitudState.idSolicitud" [procedure]="260203"
      [procedureUrl]="'medicamentos-registro-sanitario/solicitud'"></paso-firma>
        }
      }

      <btn-continuar *ngIf="!mostrarBusqueda"
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
       
      ></btn-continuar>
    </div>
  </div>
</div>
