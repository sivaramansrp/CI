<div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Datos de la mercancía</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" >
        <form [formGroup]="mercanciaForm">
          <div class="form-group">
            <label class="form-label" for="rfc">Clasificación NALAD: <span class="bi bi-question-circle-fill fs-4 m-1" title="Title" ata-bs-toggle="tooltip"></span></label>
            <input type="text" class="form-control" formControlName="fraccionNaladi">
          </div>
          <div class="form-group">
            <label for="naladisa93">Clasificación NALADISA 1993:</label>
            <input type="text" class="form-control" formControlName="fraccionNaladiSa93">
          </div>
          <div class="form-group">
            <label for="naladisa1996">Clasificación NALADISA 1996:</label>
            <input type="text" class="form-control" formControlName="fraccionNaladiSa96">
          </div>
          <div class="form-group">
            <label for="naladisa2002">Clasificación NALADISA 2002:</label>
            <input type="text" class="form-control" formControlName="fraccionNaladiSa02">
          </div>
          <div class="form-group">
            <label for="nombreComercial">Nombre comercial de la mercancía (que aparece en la factura):</label>
            <input type="text" class="form-control" formControlName="nombreComercial">
          </div>
          <div class="form-group">
            <label for="nombreTecnico">Nombre técnico:</label>
            <input type="text" class="form-control" formControlName="nombreTecnico">
          </div>
          <div class="form-group">
            <label for="normaOrigen">Norma origen:</label>
            <input type="text" class="form-control" formControlName="normaOrigen">
          </div>
          <div class="row mt-3 mb-3">
            <div class="col-md-6">
              <label for="cantidad">Cantidad:</label>
              <input type="number" class="form-control" formControlName="cantidad">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="rfc">UMC:<span class="bi bi-question-circle-fill fs-4 m-1" title="Title" ata-bs-toggle="tooltip"></span></label>
              <select class="form-control" formControlName="umc">
                <option>Seleccione un valor</option>
              </select>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="valorMercancia">Valor de la mercancía (dólares):</label>
              <input type="number" class="form-control" formControlName="valorMercancia">
            </div>
            <div class="col-md-6">
              <label for="complementoClasificacion">Complemento de la clasificación:</label>
              <textarea class="mb-4 h-20 w-100 form-control" formControlName="complementoClasificacion" rows="2"></textarea>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-4">
              <input-fecha [datos]="fechaFinalInput"></input-fecha>
            </div>
            <div class="col-md-4">
              <label for="numeroFactura">N° factura:</label>
              <input type="text" class="form-control" formControlName="numeroFactura">
            </div>
            <div class="col-md-4">
              <label for="tipoFactura">Tipo de factura:</label>
              <select class="form-control" formControlName="tipoFactura">
                <option>Seleccione un valor</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary">Agregar</button>
      </div>
