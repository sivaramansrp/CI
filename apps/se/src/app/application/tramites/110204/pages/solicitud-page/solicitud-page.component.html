<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2>Validar inicialmente el certificado de origen para los países miembros de la ALADI</h2>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>

    </div>

    <div class="row">
      @switch (indice) {
      @case (1) {
      <app-paso-uno></app-paso-uno>
      }
      @case (2) {
      <app-paso-tres></app-paso-tres>
      }

      }

      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    </div>
    @if(2 === indice) {
      <div class="mt-5">
        <div class="mt-5">
          <ng-alert [CONTENIDO]="TEXTOS.ADJUNTAR" [CUSTOMECLASS]="infoAlert"></ng-alert>
        </div>
      </div>
      }
  </div>
</div>
