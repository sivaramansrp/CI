<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2>Validar inicialmente el certificado de origen para los países miembros de la ALADI</h2>
      </div>
      @if(esFormaValido){
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
        }
      <app-wizard [listaPasos]="pasos"></app-wizard>

    </div>

    <div class="row">
      @switch (indice) {
      @case (1) {
      <app-paso-uno #pasoUnoRef></app-paso-uno>
      }
      @case (2) {
      <app-paso-tres></app-paso-tres>
      }

      }

      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"
      [btnGuardar]="true"
      [dePadre]="true"></btn-continuar>
    </div>
    @if(indice === 1) {
      <div class="mt-5">
        <div class="row">
      <ng-alert [CONTENIDO]="avisoContrnido"></ng-alert>
    </div>
      </div>
      }
  </div>
</div>
