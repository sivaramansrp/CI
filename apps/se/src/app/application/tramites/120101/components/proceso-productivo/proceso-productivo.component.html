<div class="container" [formGroup]="procesoProductivoForm">
    <ng-titulo titulo="Proceso productivo"></ng-titulo>
    <h6 class="mb-5">Indicar el(los) país(es) donde se realizó o realizaron el(los) siguiente(s) proceso(s) productivo(s), según
        corresponda al bien final a exportar o importar</h6>
        <div class="mb-5">
    <app-input-radio [radioOptions]="opcionesDeRadioIndicar" id="indicar" formControlName="indicar"
        [layout]="'horizontal'">
    </app-input-radio>
    </div>

    <div class="row" *ngIf="procesoProductivoForm.get('indicar')?.value === '1'">
        <div class="col-md-4">
            <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País de origen de la fibra'" [required]="false"
                name="País de origen de la fibra" formControlName="paisDeOrigenDeLaFibra">
            </app-catalogo-select>
        </div>
        <div class="col-md-4">
            <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País en que se realizó el hilado'"
                [required]="true" name="País en que se realizó el hilado" formControlName="paisEnQueSeRealizoElHilado">
            </app-catalogo-select>
        </div>
    </div>
    
    <div class="row" *ngIf="procesoProductivoForm.get('indicar')?.value === '2'">
        <div class="col-md-4">
            <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País en que se realizó el hilado'"
                [required]="true" name="País en que se realizó el hilado" formControlName="paisEnQueSeRealizoElHilado">
            </app-catalogo-select>
        </div>
        <div class="col-md-4">
            <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País en que se realizó el tejido'"
                [required]="true" name="País en que se realizó el tejido" formControlName="paisEnQueSeRealizoElTejido">
            </app-catalogo-select>
        </div>
    </div>

    <div class="row" *ngIf="procesoProductivoForm.get('indicar')?.value === '3'">
        <div class="col-md-4">
            <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País en que se realizó el hilado'"
                [required]="true" name="País en que se realizó el hilado" formControlName="paisEnQueSeRealizoElHilado">
            </app-catalogo-select>
        </div>
        <div class="col-md-5">
            <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País en que se realizó el tejido a forma'"
                [required]="true" name="País en que se realizó el tejido a forma"
                formControlName="paisEnQueSeRealizoElTejidoAForma">
            </app-catalogo-select>
        </div>
    </div>

    <div *ngIf="procesoProductivoForm.get('indicar')?.value === '4'">
        <div class="row">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País en que se realizó el hilado'"
                    [required]="true" name="País en que se realizó el hilado"
                    formControlName="paisEnQueSeRealizoElHilado">
                </app-catalogo-select>
            </div>
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País en que se realizó el tejido'"
                    [required]="true" name="País en que se realizó el tejido"
                    formControlName="paisEnQueSeRealizoElTejido">
                </app-catalogo-select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País en que se realizó el corte'"
                    [required]="true" name="País en que se realizó el corte"
                    formControlName="paisEnQueSeRealizoElCorte">
                </app-catalogo-select>
            </div>
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="paisDeOrigen" [label]="'País en que se realizó el ensamble'"
                    [required]="true" name="País en que se realizó el ensamble"
                    formControlName="paisEnQueSeRealizoElEnsamble">
                </app-catalogo-select>
            </div>
        </div>
    </div>
</div>
