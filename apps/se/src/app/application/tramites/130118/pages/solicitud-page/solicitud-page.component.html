<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2>Aviso automático de importación de productos siderúrgicos</h2>
      </div>

      @if (!esValido) {
        <ng-alert [CONTENIDO]="ALERTA" [CUSTOMECLASS]="infoError"></ng-alert>
      }

      <!-- ✅ Agrega #wizard -->
      <app-wizard #wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) {
        @case (1) {
          <app-paso-uno #pasoUno></app-paso-uno>
        }
        @case (2) {
          <app-paso-dos
           [cargaArchivosEvento]="cargarArchivosEvento"
          [regresarSeccionCargarDocumentoEvento]="regresarSeccionCargarDocumentoEvento"
          (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
          (reenviarCargaRealizada)="cargaRealizada($event)"></app-paso-dos>
        }
        @case (3) {
          <app-paso-tres></app-paso-tres>
        }
      }

     <div class="row">
      <div class="col-md-12">
        @if (indice !== 2) {
        <btn-continuar
          [datos]="datosPasos"
          (continuarEvento)="getValorIndice($event)"
        ></btn-continuar>
        } @else {
        <div class="mt-5 mb-3 d-flex justify-content-end">
          <button
            type="button"
            class="btn btn-default"
            (click)="anterior()"
            *ngIf="seccionCargarDocumentos"
          >
            Anterior
          </button>

          <button
            type="button"
            class="btn btn-default ms-3"
            (click)="anteriorSeccionCargarDocumento()"
            *ngIf="!seccionCargarDocumentos"
          >
            Anterior
          </button>

          <button
            class="btn btn-primary ms-3"
            (click)="
              seccionCargarDocumentos ? onClickCargaArchivos() : siguiente()
            "
            [disabled]="!activarBotonCargaArchivos && seccionCargarDocumentos"
          >
            {{ seccionCargarDocumentos ? 'Cargar archivos' : 'Continuar' }}
          </button>
        </div>
        }
      </div>
    </div>

      @if (indice === 1) {
        <ng-alert [CONTENIDO]="TEXTOS" [CUSTOMECLASS]="infoAlert"></ng-alert>
      }
    </div>
  </div>
</div>

@if(nuevaNotificacion) {
<section>
  <lib-notificaciones [notificacionInput]="nuevaNotificacion">
  </lib-notificaciones>
</section>
}
