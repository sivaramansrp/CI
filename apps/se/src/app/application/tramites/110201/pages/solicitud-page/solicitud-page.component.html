<div class="page">
  <div class="container">
    <div class="row mt-5">
      <div class="col-md-12">
        <h2 *ngIf="indice === 1">Validación inicial del certificado de circulación de mercancías EUR 1</h2>
      </div>
      @if(esFormaValido){
      <div class="col-md-12">
        <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
      </div>
      }
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno (archivo)="cargaArchivo($event)" #pasoUnoRef></app-paso-uno>
      }
      @case (2) {
      <paso-firma [idSolicitud]="this.solicitudState.idSolicitud" [procedure]="110201"
        [procedureUrl]="'registro/solicitud'"></paso-firma>
      }
      }
      
    </div>
      <div class="row">
      <div class="col-md-12">
       
        <btn-continuar [datos]="datosPasos"  (continuarEvento)="getValorIndice($event)" (btnGuardarClicked)="obtenerDatosDelStore()"></btn-continuar>
      </div>
    </div>
  </div>
</div>
