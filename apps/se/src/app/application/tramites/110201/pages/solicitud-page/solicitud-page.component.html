<div class="page">
  <div class="container">
    <div class="row mt-5">
      <div class="col-md-12">
        <h2 *ngIf="indice === 1">Validación inicial del certificado de circulación de mercancías EUR 1</h2>
        </div>
        @if(esFormaValido){
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
        }
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno (archivo)="cargaArchivo($event)" #pasoUnoRef></app-paso-uno>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <paso-firma [idSolicitud]="solicitudState.idSolicitud" [procedure]="110201" [procedureUrl]="'nuevo-programa-industrial/action'"></paso-firma>
      } }

      <btn-continuar *ngIf="cargarArchivo"
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
    </div>
  </div>
</div>
