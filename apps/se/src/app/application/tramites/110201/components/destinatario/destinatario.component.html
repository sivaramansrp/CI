<form [formGroup]="registroForm" (ngSubmit)="validarDestinatarioFormulario()">
  <ng-titulo titulo="Datos del destinatario" />
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Nombre(s)*:</label>
      <input type="text" class="form-control" id="nombre" formControlName="nombre"/>
    </div>
    <div class="col-md-4 mb-3">
      <label>Primer apellido:</label>
      <input type="text" class="form-control" id="primerApellido" formControlName="apellidoPrimer"/>
    </div>
    <div class="col-md-4 mb-3">
      <label>Segundo apellido:</label>
      <input type="text" class="form-control" id="segundoApellido" formControlName="apellidoSegundo"/>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Número de registro fiscal*:</label>
      <input type="text" class="form-control" id="denominacion" formControlName="numeroFiscal"/>
    </div>
    <div class="col-md-8 mb-3">
      <label>Razón social:</label>
      <input type="text" class="form-control" id="denominacion" formControlName="razonSocial"/>
    </div>
  </div>
  <ng-titulo titulo="Domicilio del destinatario" />
  <div class="row">
    <div class="col-md-8 mb-3">
      <label>Ciudad (población, estado o provincia)*:</label>
      <input type="text" class="form-control" id="denominacion" formControlName="ciudad"/>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Calle*:</label>
      <input type="text" class="form-control" id="nombre" formControlName="calle"/>
    </div>
    <div class="col-md-4 mb-3">
      <label>Número y/o letra:</label>
      <input type="text" class="form-control" id="primerApellido" formControlName="numeroLetra"/>
    </div>
    <div class="col-md-1 mb-3">
      <label>Lada:</label>
      <input type="text" class="form-control" id="segundoApellido" formControlName="lada"/>
    </div>
    <div class="col-md-3 mb-3">
      <label>Telefono:</label>
      <input type="text" class="form-control" id="segundoApellido" formControlName="telefono" />
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Fax:</label>
      <input type="text" class="form-control" id="nombre" formControlName="fax"/>
    </div>
    <div class="col-md-4 mb-3">
      <label>Correo electrónico*:</label>
      <input type="text" class="form-control" id="primerApellido" formControlName="correoElectronico"/>
    </div>
  </div>
  <div class="row">
    <div class="col-md-8 mb-3">
      <app-catalogo-select
        [catalogo]="pais.catalogos"
        [label]="pais.labelNombre"
        [placeholder]="pais.primerOpcion"
        [required]="true"
        formControlName="nacion"
      ></app-catalogo-select>
    </div>
  </div>
  <ng-titulo titulo="Detalles del transporte" />
  <div class="col-md-8 mb-3">
    <app-catalogo-select
      [catalogo]="transporte.catalogos"
      [label]="transporte.labelNombre"
      [placeholder]="transporte.primerOpcion"
      [required]="true"
      formControlName="transporte"
    ></app-catalogo-select>
  </div>
</form>
