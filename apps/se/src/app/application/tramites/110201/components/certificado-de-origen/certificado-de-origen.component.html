<ng-titulo
  titulo="Validación inicial del certificado de circulación de mercancías"
/>
<ng-titulo titulo="Tratado y país o bloque" />
<div class="container">
  <!-- <ng-titulo  titulo="Validación inicial del certificado de circulación de mercancías" />
     <ng-titulo  titulo="Tratado y país o bloque" /> -->
  <div class="row">
    <div class="col-md-12">
      <div class="row">
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="tratado.catalogos"
            [label]="tratado.labelNombre"
            [placeholder]="tratado.primerOpcion"
            [required]="true"
          ></app-catalogo-select>
        </div>
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="pais.catalogos"
            [label]="pais.labelNombre"
            [placeholder]="pais.primerOpcion"
            [required]="true"
          ></app-catalogo-select>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <label>Fracción arancelaria:</label>
          <input type="text" required="true" class="form-control" />
        </div>
        <div class="col-md-4">
          <label># Registro producto:</label>
          <input type="text" required="true" class="form-control" />
        </div>
        <div class="col-md-4">
          <label>Nombre comercial:</label>
          <input type="text" required="true" class="form-control" />
        </div>
      </div>
      <div class="row mt-3">
        <label style="margin-left: 338px">Periodo</label>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <label>Fecha inicio:</label>
          <input type="date" required="true" class="form-control" />
        </div>
        <div class="col-md-4">
          <label>Fecha fin:</label>
          <input type="date" required="true" class="form-control" />
        </div>
      </div>
      <div class="col-md-12 mt-5 d-flex justify-content-end">
        <button type="button" class="btn btn-primary ms-3">
          Buscar mercancías
        </button>
      </div>
      <ng-titulo titulo="Carga de mercancías por archivo" />
      <div class="col-md-12 mt-5 d-flex justify-content-end">
        <button type="button" class="btn btn-primary ms-3">
          Carga por archivo
        </button>
      </div>

      <!-- //rakhi -->
      <form
        [formGroup]="fileUploadForm"
        (ngSubmit)="onSubmit()"
        enctype="multipart/form-data"
      >
        <div class="bottom-buffer">
          <div class="row">
            <div class="col-md-8">
              <div class="form-group">
                <div>
                  <label class="control-label"> Archivo: </label>
                </div>
                <input
                  type="file"
                  formControlName="archivo"
                  id="archivoAdjuntar"
                  size="60"
                /><br />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-8 pull-right">
              <hr />
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <div class="pull-right">
                <button
                  type="button"
                  class="btn btn-default"
                  (click)="cerrarAdjuntarArchivoMercancias()"
                >
                  Cerrar
                </button>
                <button type="submit" class="btn btn-primary">Enviar</button>
              </div>
            </div>
          </div>
        </div>
      </form>

      <!-- code end -->
    </div>
  </div>
</div>
