<ng-titulo
  *ngIf="!cargarArchivo"
  titulo="Validación inicial del certificado de circulación de mercancías"
/>
<ng-titulo *ngIf="!cargarArchivo" titulo="Tratado y país o bloque" />
<div class="container">
  <form [formGroup]="registroForm" (ngSubmit)="validarDestinatarioFormulario()">
    <ng-container formGroupName="validacionForm">
      <ng-container *ngIf="!cargarArchivo">
        <div class="row">
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="tratado.catalogos"
              [label]="tratado.labelNombre"
              [placeholder]="tratado.primerOpcion"
              [required]="true"
              id="tratado"
              formControlName="tratado"
              (change)="
                setValoresStore(validacionForm, 'tratado', 'setTratado')
              "
            ></app-catalogo-select>
          </div>
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="pais.catalogos"
              [label]="pais.labelNombre"
              [placeholder]="pais.primerOpcion"
              [required]="true"
              id="pais"
              formControlName="pais"
              (change)="setValoresStore(validacionForm, 'pais', 'setPais')"
            ></app-catalogo-select>
          </div>
        </div>
        <div class="row mt-5">
          <div class="col-md-4">
            <label>Fracción arancelaria:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              formControlName="fraccionArancelaria"
              (change)="
                setValoresStore(
                  validacionForm,
                  'fraccionArancelaria',
                  'setFraccionArancelaria'
                )
              "
            />
          </div>
          <div class="col-md-4">
            <label># Registro producto:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              formControlName="numRegistro"
              (change)="
                setValoresStore(validacionForm, 'numRegistro', 'setNumRegistro')
              "
            />
          </div>
          <div class="col-md-4">
            <label>Nombre comercial:</label>
            <input
              type="text"
              required="true"
              class="form-control"
              formControlName="nomComercial"
              (change)="
                setValoresStore(
                  validacionForm,
                  'nomComercial',
                  'setNomComercial'
                )
              "
            />
          </div>
        </div>
        <div class="row mt-3">
          <label style="margin-left: 338px">Periodo</label>
        </div>
        <div class="row mt-5">
          <div class="col-md-4">
            <label>Fecha inicio:</label>
            <input
              type="date"
              required="true"
              class="form-control"
              formControlName="fechInicioB"
              (change)="
                setValoresStore(validacionForm, 'fechInicioB', 'setFechInicioB')
              "
            />
          </div>
          <div class="col-md-4">
            <label>Fecha fin:</label>
            <input
              type="date"
              required="true"
              class="form-control"
              formControlName="fechFinB"
              (change)="
                setValoresStore(validacionForm, 'fechFinB', 'setFechFinB')
              "
            />
          </div>
        </div>
        <div class="col-md-12 mt-5 d-flex justify-content-end">
          <button
            type="button"
            class="btn btn-primary ms-3"
            (click)="buscarMercancias()"
          >
            Buscar mercancías
          </button>
        </div>
        <div class="row mt-5">
          <label>Mercancías disponibles</label>
        </div>
        <div class="table-container mt-5" *ngIf="!isDisponibles">
          <app-tabla-dinamica
            [tipoSeleccionTabla]="TablaSeleccion.UNDEFINED"
            [configuracionTabla]="tableData.headers"
          ></app-tabla-dinamica>
        </div>
        <div class="table-container mt-5" *ngIf="isDisponibles">
          <div #tableContainer>
          <app-tabla-dinamica
            [tipoSeleccionTabla]="TablaSeleccion.UNDEFINED"
            [configuracionTabla]="tableData.headers"
            [datos]="tableData.data"
          ></app-tabla-dinamica>
          </div>
        </div>
        <i id="bi-1-square" class="bi bi-1-square" viewBox="0 0 16 16"></i>
      </ng-container>
      <ng-titulo titulo="Carga de mercancías por archivo" />

      <div
        class="col-md-12 mt-5 d-flex justify-content-end"
        *ngIf="!cargarArchivo"
      >
        <button
          type="button"
          class="btn btn-primary ms-3"
          (click)="cargaArchivo()"
        >
          Carga por archivo
        </button>
      </div>
      <div class="bottom-buffer" *ngIf="cargarArchivo">
        <div class="row">
          <div class="col-md-8">
            <div class="form-group">
              <div>
                <label class="control-label"> Archivo: </label>
              </div>
              <input
                class="visually-hidden-file"
                type="file"
                formControlName="archivo"
                id="archivoAdjuntar"
                size="60"
                (change)="alSeleccionarArchivo($event)"
                (change)="
                  setValoresStore(validacionForm, 'archivo', 'setArchivo')
                "
              />
              <label
                class="custome-file-label"
                for="archivoAdjuntar"
                value="Seleccionar archivo"
                style="background-color: lightgrey; font-weight: bold"
                >Elegir archivo</label
              >
              <p style="display: inline-block">
                {{ nombreArchivo || 'No se eligió ningún archivo' }}
              </p>
              <br />
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-8 pull-right">
            <hr />
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <div class="pull-right">
              <button
                type="button"
                class="btn btn-default"
                (click)="cerrarAdjuntarArchivoMercancias()"
              >
                Cerrar
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                (click)="giveError()"
              >
                Enviar
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-5">
        <ng-alert
          *ngIf="!cargarArchivo"
          [CONTENIDO]="TEXTO_DE_ALERTA"
          style="margin-top: 40px"
        >
        </ng-alert>
      </div>
      <ng-container *ngIf="!cargarArchivo">
        <div class="row mt-5">
          <label>Mercancías seleccionadas</label>
        </div>
        <div class="table-container mt-5" *ngIf="!isMercancia">
          <app-tabla-dinamica
            [tipoSeleccionTabla]="TablaSeleccion.RADIO"
            [configuracionTabla]="tableSeleccionadas.headers"
            
          ></app-tabla-dinamica>
        </div>
        <div class="table-container mt-5" *ngIf="isMercancia">
          <app-tabla-dinamica
            [tipoSeleccionTabla]="TablaSeleccion.RADIO"
            [configuracionTabla]="tableSeleccionadas.headers"
            [datos]="tableSeleccionadas.data"
          ></app-tabla-dinamica>
        </div>
        <i id="bi-1-square" class="bi bi-1-square" viewBox="0 0 16 16"></i>
        <div class="col-md-12 mt-5 d-flex justify-content-end" *ngIf="isMercancia">
          <button type="button" class="btn btn-default ms-3">Eliminar</button>
          <button type="button" class="btn btn-primary ms-3">Modificar</button>
        </div>
        <div class="row mt-5">
          <div
            class="alert alert-danger"
            style="margin-top: 40px"
            *ngIf="giveErrors"
          >
            <strong
              >Existen errores en la carga de mercancías por archivo</strong
            >
          </div>
        </div>
        <div class="row mt-5">
          <label *ngIf="giveErrors">Mercancías*:</label>
        </div>
        <div class="table-container instance-special mt-5" *ngIf="giveErrors">
          <label style="margin-left: 490px">Error</label>
          <ng-table
            id="myElement "
            class="hide-checkbox"
            [enableScrollbar]="true"
            [commonTableHeader]="mercanciasHeader"
            [commonTableBody]="mercanciasBody"
            [enableScrollbar]="true"
          ></ng-table>
        </div>
      </ng-container>
    </ng-container>
  </form>
</div>
<div class="container" *ngIf="!isMercancia">
  <ng-titulo titulo="Datos de la mercancía" />
  <form [formGroup]="mercanciaForm" (ngSubmit)="validarmercanciaForm()">
    <ng-container formGroupName="validacionMercanciaForm">
      <div class="row">
        <div class="col-md-4">
          <label>Fracción arancelaria:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="fraccionMercanArancelaria"
            value=""
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'fraccionMercanArancelaria',
                'setfraccionMercanArancelaria'
              )
            "
          />
        </div>
        <div class="col-md-8">
          <label
            >Nombre comercial de la mercancía(igual que en la factura):</label
          >
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="nombrecomercialdelamercancia"
            value=""
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'nombrecomercialdelamercancia',
                'setnombrecomercialdelamercancia'
              )
            "
          />
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-8">
          <label>Nombre técnico:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="nombretecnico"
            value=""
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'nombretecnico',
                'setnombretecnico'
              )
            "
          />
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-8">
          <label>Nomre en inglés:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="nomreeningles"
            value=""
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'nomreeningles',
                'setnomreeningles'
              )
            "
          />
        </div>
        <div class="col-md-4">
          <label>Criterio para conferir origen:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="criterioparaconferir"
            value=""
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'criterioparaconferir',
                'setcriterioparaconferir'
              )
            "
          />
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-8">
          <label>Marca:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="marca"
            (change)="
              setValoresStore(validacionMercanciaForm, 'marca', 'setmarca')
            "
          />
        </div>
        <div class="col-md-4">
          <label>Cantidad:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="cantidad"
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'cantidad',
                'setcantidad'
              )
            "
          />
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="umc.catalogos"
            [label]="umc.labelNombre"
            [placeholder]="umc.primerOpcion"
            [required]="true"
            [tooltipQuestionCircle]="true"
            id="umc"
            formControlName="umc"
            (change)="setValoresStore(validacionMercanciaForm, 'umc', 'setUMC')"
          ></app-catalogo-select>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <label>Valor de la mercancía(dólares)*:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="valordelamercancia"
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'valordelamercancia',
                'setvalordelamercancia'
              )
            "
          />
        </div>
        <div class="col-md-8">
          <label>Complemento de la descripción*:</label>
          <textarea
            cols="80"
            rows="3"
            formControlName="complementodeladescripcion"
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'complementodeladescripcion',
                'setcomplementodeladescripcion'
              )
            "
          ></textarea>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <label>Masa bruta*:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="masabruta"
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'masabruta',
                'setmasabruta'
              )
            "
          />
        </div>
        <div class="col-md-8">
          <app-catalogo-select
            [catalogo]="unidadMedida.catalogos"
            [label]="unidadMedida.labelNombre"
            [placeholder]="unidadMedida.primerOpcion"
            [required]="true"
            id="unidadMedida"
            formControlName="unidadMedida"
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'unidadMedida',
                'setUnidadMedida'
              )
            "
          ></app-catalogo-select>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <label>Fecha de factura*:</label>
          <input
            type="date"
            required="true"
            class="form-control"
            formControlName="fecha"
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'fecha',
                'setFecha'
              )
            "
          />
        </div>
        <div class="col-md-4">
          <label>N° factura*:</label>
          <input
            type="text"
            required="true"
            class="form-control"
            formControlName="nFactura"
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'nFactura',
                'setNFactura'
              )
            "
          />
        </div>
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="tipoFactura.catalogos"
            [label]="tipoFactura.labelNombre"
            [placeholder]="tipoFactura.primerOpcion"
            [required]="true"
            id="tipoFactura"
            formControlName="tipoFactura"
            (change)="
              setValoresStore(
                validacionMercanciaForm,
                'tipoFactura',
                'setTipoFactura'
              )
            "
          ></app-catalogo-select>
        </div>
      </div>
      <div class="col-md-12 mt-5 d-flex justify-content-end">
        <button type="button" class="btn btn-default ms-3">Cancelar</button>
        <button type="button" class="btn btn-primary ms-3" (click)="agregar()">Agregar</button>
      </div>
    </ng-container>
  </form>
</div>
