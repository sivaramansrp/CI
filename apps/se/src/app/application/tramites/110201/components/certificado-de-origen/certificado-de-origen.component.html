
  <ng-titulo
    titulo="Validación inicial del certificado de circulación de mercancías"
  />
  <ng-titulo titulo="Tratado y país o bloque" />
  <div class="container">
    <form [formGroup]="registroForm" (ngSubmit)="validarDestinatarioFormulario()">
    <div class="row">
      <ng-container formGroupName="validacionForm">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="tratado.catalogos"
          [label]="tratado.labelNombre"
          [placeholder]="tratado.primerOpcion"
          [required]="true"
          id="tratado"
          formControlName="tratado"
          (change)="
                setValoresStore(
                  validacionForm,
                  'tratado',
                  'setTratado'
                )
              "
        ></app-catalogo-select>
      </div>
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="pais.catalogos"
          [label]="pais.labelNombre"
          [placeholder]="pais.primerOpcion"
          [required]="true"
          id="pais"
          formControlName="pais"
          (change)="
                setValoresStore(
                  validacionForm,
                  'pais',
                  'setPais'
                )
              "
        ></app-catalogo-select>
      </div>
      </ng-container>
    </div>
    <div class="row mt-5">
      <ng-container formGroupName="validacionForm">
      <div class="col-md-4">
        <label>Fracción arancelaria:</label>
        <input type="text" required="true" class="form-control" formControlName="fraccionArancelaria"
        (change)="
                setValoresStore(
                  validacionForm,
                  'fraccionArancelaria',
                  'setFraccionArancelaria'
                )
              "/>
      </div>
      <div class="col-md-4">
        <label># Registro producto:</label>
        <input type="text" required="true" class="form-control" formControlName="numRegistro"
        (change)="
                setValoresStore(
                  validacionForm,
                  'numRegistro',
                  'setNumRegistro'
                )
              "/>
      </div>
      <div class="col-md-4">
        <label>Nombre comercial:</label>
        <input type="text" required="true" class="form-control" formControlName="nomComercial" 
        (change)="
                setValoresStore(
                  validacionForm,
                  'nomComercial',
                  'setNomComercial'
                )
              "/>
      </div>
      </ng-container>
    </div>
    <div class="row mt-3">
      <label style="margin-left: 338px">Periodo</label>
    </div>
    <div class="row mt-5">
      <ng-container formGroupName="validacionForm">
      <div class="col-md-4">
        <label>Fecha inicio:</label>
        <input type="date" required="true" class="form-control" formControlName="fechInicioB"
        (change)="
                setValoresStore(
                  validacionForm,
                  'fechInicioB',
                  'setFechInicioB'
                )
              "/>
      </div>
      <div class="col-md-4">
        <label>Fecha fin:</label>
        <input type="date" required="true" class="form-control" formControlName="fechFinB"
        (change)="
                setValoresStore(
                  validacionForm,
                  'fechFinB',
                  'setFechFinB'
                )
              "/>
      </div>
      </ng-container>
    </div>
    <div class="col-md-12 mt-5 d-flex justify-content-end">
      <button type="button" class="btn btn-primary ms-3">
        Buscar mercancías
      </button>
    </div>
    <div class="row mt-5">
      <label>Mercancías disponibles</label>
    </div>
    <div class="table-container mt-5">
      <ng-table
        class="custom-table"
        [commonTableHeader]="mercanciasdisponibles"
      ></ng-table>
    </div>
    <i id="bi-1-square" class="bi bi-1-square" viewBox="0 0 16 16"></i>
    <ng-titulo titulo="Carga de mercancías por archivo" />
    <div
      class="col-md-12 mt-5 d-flex justify-content-end"
      *ngIf="!cargarArchivo"
    >
      <button
        type="button"
        class="btn btn-primary ms-3"
        (click)="cargaArchivo()"
      >
        Carga por archivo
      </button>
    </div>
    <div class="bottom-buffer" *ngIf="cargarArchivo">
      <div class="row">
        <ng-container formGroupName="validacionForm">
        <div class="col-md-8">
          <div class="form-group">
            <div>
              <label class="control-label"> Archivo: </label>
            </div>
            <input
              class="visually-hidden-file"
              type="file"
              formControlName="archivo"
              id="archivoAdjuntar"
              size="60"
              (change)="alSeleccionarArchivo($event)"
              (change)="
                setValoresStore(
                  validacionForm,
                  'archivo',
                  'setArchivo'
                )
              "
            />
            <label
              class="custome-file-label"
              for="archivoAdjuntar"
              value="Seleccionar archivo"
              style="background-color: lightgrey; font-weight: bold"
              >Elegir archivo</label
            >
            <p style="display: inline-block">
              {{ nombreArchivo || 'No se eligió ningún archivo' }}
            </p>
            <br />
          </div>
        </div>
        </ng-container>
      </div>
      <div class="row">
        <div class="col-md-8 pull-right">
          <hr />
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="pull-right">
            <button
              type="button"
              class="btn btn-default"
              (click)="cerrarAdjuntarArchivoMercancias()"
            >
              Cerrar
            </button>
            <button type="submit" class="btn btn-primary" (click)="giveError()">
              Enviar
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="row mt-5">
      <ng-alert
        *ngIf="!cargarArchivo"
        [CONTENIDO]="TEXTO_DE_ALERTA"
        style="margin-top: 40px"
      >
      </ng-alert>
    </div>
    <div class="row mt-5">
      <label>Mercancías seleccionadas</label>
    </div>
    <div class="table-container mt-5">
      <ng-table class="custom-table" [commonTableHeader]="encabezadosTablas">
      </ng-table>
    </div>
    <i id="bi-1-square" class="bi bi-1-square" viewBox="0 0 16 16"></i>
    <div class="col-md-12 mt-5 d-flex justify-content-end">
      <button type="button" class="btn btn-default ms-3">Eliminar</button>
      <button type="button" class="btn btn-primary ms-3">Modificar</button>
    </div>
    <div class="row mt-5">
      <div
        class="alert alert-danger"
        style="margin-top: 40px"
        *ngIf="giveErrors"
      >
        <strong>Existen errores en la carga de mercancías por archivo</strong>
      </div>
    </div>
    <div class="row mt-5">
      <label *ngIf="giveErrors">Mercancías*:</label>
    </div>
    <div class="table-container instance-special mt-5" *ngIf="giveErrors">
      <label style="margin-left: 490px">Error</label>
      <ng-table
        id="myElement "
        class="hide-checkbox"
        [enableScrollbar]="true"
        [commonTableHeader]="mercanciasHeader"
        [commonTableBody]="mercanciasBody"
        [enableScrollbar]="true"
      ></ng-table>
    </div>
  </form>
  </div>
  <!-- </ng-container> -->
