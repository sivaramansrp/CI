<form [formGroup]="registroForm" (ngSubmit)="validarDestinatarioFormulario()">
  <ng-container formGroupName="validacionForm">
  <ng-titulo titulo="Datos del certificado" />
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Observaciones:</label>
      <div class="col-md-12 align-text-area">
        <textarea cols="80" rows="5" formControlName="observaciones"
        (change)="setValoresStore(validacionForm, 'observaciones', 'setObservaciones')"></textarea>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3 ">
      <label>Presica*:</label>
      <div class="col-md-12 align-text-area">
        <textarea cols="80" rows="5" formControlName="presica"
        (change)="setValoresStore(validacionForm, 'presica', 'setPresica')"></textarea>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label>Presenta:</label>
      <div class="col-md-12 align-text-area">
        <textarea cols="80" rows="5" formControlName="presenta"
        (change)="setValoresStore(validacionForm, 'presenta', 'setPresenta')"></textarea>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
        <app-catalogo-select
          [catalogo]="idioma.catalogos"
          [label]="idioma.labelNombre"
          [placeholder]="idioma.primerOpcion"
          [required]="true"
          id="idioma"
          formControlName="idioma"
          (change)="setValoresStore(validacionForm, 'idioma', 'setIdioma')"
        ></app-catalogo-select>
      </div>
      <ng-titulo titulo="Representación federal" />
      <div class="row">
      <div class="col-md-4">
      <app-catalogo-select
      [catalogo]="entidad.catalogos"
      [label]="entidad.labelNombre"
      [placeholder]="entidad.primerOpcion"
      [required]="true"
      id="entidadFederativa"
      formControlName="entidad"
      (change)="setValoresStore(validacionForm, 'entidad', 'setEntidad')"
    ></app-catalogo-select></div>
    <div class="col-md-4">
    <app-catalogo-select
    [catalogo]="representacion.catalogos"
    [label]="representacion.labelNombre"
    [placeholder]="representacion.primerOpcion"
    [required]="true"
    id="representacion"
    formControlName="representacion"
    (change)="setValoresStore(validacionForm, 'representacion', 'setRepresentacion')"
  ></app-catalogo-select></div></div>
  </div>
</ng-container>
</form>
