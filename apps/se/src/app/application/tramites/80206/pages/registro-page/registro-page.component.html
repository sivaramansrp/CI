<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12 mb-5">
        <h1>{{ tituloMensaje || null }}</h1>
      </div>
      <div class="col-md-12 mt-5" *ngIf="mostrarAlerta">
        <ng-alert [CONTENIDO]="alert.ERRORMESSAGE" [CUSTOMECLASS]="dangerClass"></ng-alert>
      </div>
     

      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
        <app-paso-uno></app-paso-uno>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
      } }

      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
      <ng-alert [CONTENIDO]="TEXTOS.Aviso"></ng-alert>
    </div>
  </div>
</div>
