<div class="row">
  <ul class="nav nav-tabs">
    <li [ngClass]="indice === 1 ? 'active' : ''">
      <a
        data-toggle="tab"
        (click)="seleccionaTab(1)"
        (keydown.enter)="seleccionaTab(1)"
        (keydown.space)="seleccionaTab(1)"
        tabindex="1"
        role="button"
        >Solicitante</a
      >
    </li>
    <li [ngClass]="indice === 2 ? 'active' : ''">
      <a
        data-toggle="tab"
        (click)="seleccionaTab(2)"
        (keydown.enter)="seleccionaTab(1)"
        (keydown.space)="seleccionaTab(1)"
        tabindex="2"
        role="button"
        >Empresas terciarizadas</a
      >
    </li>
  </ul>

  <ng-container>

    <solicitante [hidden]="indice !==1" [tabindex]="1" #solicitante></solicitante>

      @if(esDatosRespuesta){
      <app-empresas-terciarizadas [hidden]="indice !==2" [active]="indice === 2" #empresasTerciarizadas></app-empresas-terciarizadas>
       }
  </ng-container>
</div>
