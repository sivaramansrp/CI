<div class="container mt-5">
  <div class="row">
    <div class="col-md-6">
      <h4>Registro de solicitud de cancelación PROSEC</h4>
    </div>
    @if (mostrarAplicacionRegistradaAlerta) {
    <div class="col-md-12">
      <ng-alert [CONTENIDO]="applicacionRegistradaAlerta" [CUSTOMECLASS]="infoAlert"></ng-alert>
    </div>
    }
    @if (!esFormaValido && esFormaValido !== undefined && !mostrarAplicacionRegistradaAlerta) {
    <div class="col-md-12">
      <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
    </div>
    }
    <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
  </div>
  <div class="row">
    @switch (indice) {
    @case (1) {
    <app-datos [pestanaDosFormularioValido]="pestanaDosFormularioValido"
      (pestanaCambiado)="pestanaCambiado($event)"></app-datos>
    } @case (2) {
    <app-paso-dos></app-paso-dos>
    } @case (3) {
    <app-paso-tres></app-paso-tres>
    }
    }
  </div>
  <btn-continuar [datos]="datosPasos" [dePadre]="true" (continuarEvento)="getValorIndice($event)">
  </btn-continuar>
  <div class="mt-5">
    <ng-alert [CONTENIDO]="avisoPrivacidadAlert"></ng-alert>
  </div>
</div>
