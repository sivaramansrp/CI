@if (consultaState.create === true) {
  <ng-titulo titulo="Tratados y criterios solicitados" />
<ng-alert [CONTENIDO]="alerta.MENSAJE_ALERTA"></ng-alert>
<form [formGroup]="formularioTratados">
  <div class="row">
    <div class="col-md-8">
      <app-catalogo-select [catalogo]="paisCatalogo" formControlName="pais" [label]="'País o bloque'" [required]="true"
        name="Pais o bloque" [isDisabled]="esFormularioSoloLectura"
        (change)="setValoresStore(formularioTratados,'pais', 'setPais');getLabelFromCatalogData(paisCatalogo,'pais')"
        (selectionChange)="onTratadoAcuerdo($event, 'pais')"></app-catalogo-select>
    </div>
    <div class="col-md-8">
      <app-catalogo-select [catalogo]="tratadoCatalogo" formControlName="tratado" [label]="'Tratado o Acuerdo'"
        [required]="true" name="Tratado o Acuerdo" [isDisabled]="esFormularioSoloLectura"
        (change)="setValoresStore(formularioTratados,'tratado', 'setTratado');getLabelFromCatalogData(tratadoCatalogo,'tratado')"
        (selectionChange)="onTratadoAcuerdo($event, 'tratado')"></app-catalogo-select>
    </div>
    <div class="col-md-8">
      <app-catalogo-select [catalogo]="origenCatalogo" formControlName="origen" [label]="'Criterio de origen'"
        [required]="true" name="Criterio de origen" [isDisabled]="esFormularioSoloLectura"
        (change)="setValoresStore(formularioTratados,'origen', 'setOrigen');getLabelFromCatalogData(origenCatalogo,'origen')"></app-catalogo-select>
    </div>
  </div>
  <div class="col-12 d-flex justify-content-end mt-3 mb-4">
    <button class="btn btn-primary" (click)="agregarTratado()" [disabled]="esFormularioSoloLectura">Agregar
      tratado</button>
  </div>
</form>
}
@if (consultaState.create === true) {
<ng-alert [CONTENIDO]="'Para continuar con el trámite, deberá agregar por lo menos un tratado o acuerdo.'"></ng-alert>

<h6 class="fs-4">País/bloque-tratado/acuerdo seleccionados por el solicitante</h6>

<div class="row">
  <div class="col-md-12">
    <app-tabla-dinamica *ngIf="mostrarTabla" [tipoSeleccionTabla]="tipoSeleccionTabla" [configuracionTabla]="configuracionTabla"
      [datos]="registroDeSolicitudesTablaDatos" (listaDeFilaSeleccionada)="onSeleccionChange($event)"
      [disableSeleccionTablaCheckBox]="esFormularioSoloLectura? true : false">
    </app-tabla-dinamica>
  </div>
  <div class=" text-end mt-5">
    <button class="btn btn-default me-2" [disabled]="esFormularioSoloLectura" (click)="modificarTratado()">
      Modificar tratado
    </button>
    <button class="btn btn-primary" [disabled]="esFormularioSoloLectura" (click)="eliminarTratado()">
      Eliminar tratado
    </button>
  </div>
</div>
}

@if(consultaState.create === false){
  <ng-titulo titulo="País/bloque-tratado/acuerdo seleccionados por el solicitante" />
<div class="col-md-12">
  <app-tabla-dinamica [configuracionTabla]="tablaSeleccionada" [datos]="tratadosEvaluacionTablaDatos" [tipoSeleccionTabla]="tipoSeleccionTabla">
  </app-tabla-dinamica>
   <div class=" text-end mt-5">
    <button class="btn btn-primary me-2"  >
      Resumen de valores
    </button>
    <button class="btn btn-primary  me-2" >
      Insumos
    </button>
    <button class="btn btn-primary  me-2" >
      Requisito Proceso
    </button>
  </div>
</div>
}

@for (pais of paisesInstancias; track pais) {
  <app-otras-instancias
    [pais]="pais"
    [titulo]="instanciasConfig[pais].titulo"
    [mensajeAlerta]="instanciasConfig[pais].alerta"
    [catalogo]="instanciasConfig[pais].cargarCatalogo" 
    [modificacionTxt]="instanciasConfig[pais].modificacionText">
  </app-otras-instancias>
}

@if (nuevaNotificacion) {
<section>
  <lib-notificaciones [notificacionInput]="nuevaNotificacion" (confirmacionModal)="eliminarPedimento($event)">
  </lib-notificaciones>
</section>
}
