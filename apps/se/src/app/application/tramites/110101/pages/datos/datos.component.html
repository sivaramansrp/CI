<div class="container">
    <div class="row">
        <ul class="nav nav-tabs">
            <li [ngClass]="indice === 1 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(1)">Solicitante</a>
            </li>
            <li [ngClass]="indice === 2 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(2)">Tratados</a>
            </li>
            <li [ngClass]="indice === 3 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(3)">Datos de la mercancia</a>
            </li>
            <li [ngClass]="indice === 4 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(4)">Datos adicionales</a>
            </li>
        </ul>
        <ng-container>
            @switch (indice) {
            @case (1) {
                <app-solicitante></app-solicitante>
            }
            @case (2) {
                <app-tratados></app-tratados>
            }
            @case (3) {
                <app-datos-mercancia></app-datos-mercancia>
            }
            @case (4) {
                <app-datos-adicionales></app-datos-adicionales>
            }
        }
        </ng-container>
    </div>
</div>
