<div class="container">
    <div class="row">
        <ul class="nav nav-tabs">
            <li [ngClass]="indice === 1 ? 'active' : ''">
                <a data-toggle="tab" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(1)">Solicitante</a>
            </li>
            <li [ngClass]="indice === 2 ? 'active' : ''">
                <a data-toggle="tab" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(2)">Tratados</a>
            </li>
            <li [ngClass]="{ active: indice === 3, disabled: desactivado }">
                <a data-toggle="tab" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(3)">Datos de la mercancia</a>
            </li>
            <li [ngClass]="{ active: indice === 4, disabled: desactivado }">
                <a data-toggle="tab" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(4)">Datos adicionales</a>
            </li>
        </ul>
        <ng-container>
            @switch (indice) {
            @case (1) {
                <solicitante #Solicitante></solicitante>
            }
            @case (2) {
                <app-protesto-decir-verdad></app-protesto-decir-verdad>
            }
            @case (3) {
                <app-tratados (habilitarPestana)="habilitarPestana()"></app-tratados>
            }
            @case (4) {
                <app-datos-mercancia></app-datos-mercancia>
            }
            @case (5) {
                <app-datos-adicionales></app-datos-adicionales>
            }
            @case (6) {
                <app-protesto-decir-verdad></app-protesto-decir-verdad>
            }
        }
        </ng-container>
    </div>
</div>
