<app-datos-del-destinatario
  [datosForm]="formDatosDelDestinatarioValues"
  (formDatosDelDestinatarioEvent)="detosDelDestinatarioFunc($event)"
></app-datos-del-destinatario>

<app-destinatario
  [paisDestino]="paisDestino"
  (paisDestinSeleccionEvent)="paisDestinSeleccion($event)"
  [paisDestin]="(paisDestin$ | async) || []"
  (formDestinatarioEvent)="formDestinatarioFunc($event)"
  [datosForm]="formDestinatarioValues"
></app-destinatario>

<div>
  <form [formGroup]="destinatarioForm">
    <div class="row">
      <div class="row">
        <ng-titulo titulo="Detalles del transporte" />
        <div class="col-md-6">
          <app-catalogo-select
            [label]="'Medio de transporte'"
            [catalogo]="(medioDeTransporte$ | async) || []"
            [required]="true"
            name="estado"
            formControlName="medioDeTransporte"
            (selectionChange)="medioDeTransporteSeleccion($event)"
          ></app-catalogo-select>
        </div>
      </div>
    </div>
  </form>
</div>
