<div>
  <form [formGroup]="destinatarioForm">
    <ng-titulo titulo="Domicilio del destinatario" />

    <div class="row">
      <div class="row mb-3">
        <div class="col-md-6">
          <app-catalogo-select
            [label]="'Pais destino'"
            [catalogo]="(paisDestin$ | async) || []"
            [required]="true"
            name="estado"
            formControlName="paisDestin"
            (selectionChange)="paisDestinSeleccion($event)"
          ></app-catalogo-select>
        </div>
      </div>
      <div class="row">
        <ng-titulo titulo="Detalles del transporte"/>

        <div class="col-md-6">
          <app-catalogo-select
            [label]="'Medio de transporte'"
            [catalogo]="(medioDeTransporte$ | async) || []"
            [required]="true"
            name="estado"
            formControlName="medioDeTransporte"
          ></app-catalogo-select>
        </div>
      </div>
    </div>
  </form>
</div>
