<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a
          (click)="seleccionaTab(1)"
          (keyup.enter)="seleccionaTab(1)"
          (keydown.space)="seleccionaTab(1)"
          tabindex="0"
          data-toggle="tab"
          >Solicitante</a
        >
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a
          (click)="seleccionaTab(2)"
          (keyup.enter)="seleccionaTab(2)"
          (keydown.space)="seleccionaTab(2)"
          tabindex="0"
          data-toggle="tab"
          >Certificado de origen</a
        >
      </li>

      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a
          (click)="seleccionaTab(3)"
          (keyup.enter)="seleccionaTab(3)"
          (keydown.space)="seleccionaTab(3)"
          tabindex="0"
          data-toggle="tab"
          >Destinatario</a
        >
      </li>

      <li [ngClass]="indice === 4 ? 'active' : ''">
        <a
          (click)="seleccionaTab(4)"
          (keyup.enter)="seleccionaTab(4)"
          (keydown.space)="seleccionaTab(4)"
          tabindex="0"
          data-toggle="tab"
          >Datos certificado</a
        >
      </li>
    </ul>

    <ng-container>
      @switch (indice) { @case (1) {
      <solicitante #Solicitante></solicitante>
      } @case (2) {
      <app-certificado-origen></app-certificado-origen>
      } @case (3) {
      <app-destinatario-de></app-destinatario-de>
      } @case (4) {
      <app-datos-certificado></app-datos-certificado>
      } }
    </ng-container>

    @if(3 === indice) {
    <div class="mt-5">
      <div class="mt-5">
        <ng-alert
          [CONTENIDO]="TEXTOS.ADJUNTAR"
          [CUSTOMECLASS]="infoAlert"
        ></ng-alert>
      </div>
    </div>
    }
  </div>
</div>
