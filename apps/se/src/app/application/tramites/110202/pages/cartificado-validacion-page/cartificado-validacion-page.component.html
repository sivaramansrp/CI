<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2>
          Validación a posteriori del certificado de circulación de mercancías
          EUR 1
        </h2>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
     <app-paso-uno (alertaEvento)="mostrarAlerta = $event"></app-paso-uno>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } }

      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
         @if (mostrarAlerta) {
   <ng-alert
          [CONTENIDO]="TEXTOS.ADJUNTAR"
          [CUSTOMECLASS]="infoAlert"
        ></ng-alert>
}
    </div>
  </div>
</div>
