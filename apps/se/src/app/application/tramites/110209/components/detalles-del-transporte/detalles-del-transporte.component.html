<div class="container">
    <ng-titulo [titulo]="'Detalles del transporte'"></ng-titulo>
    <form [formGroup]="detallesDeltransportForm">
        <div class="row">

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="tratado">Tratado / Acuerdo :</label>
                    <input type="text" class="form-control" id="tratado" formControlName="tratado" readonly />
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="paisOBloque">Pais o bloque :</label>
                    <input type="text" class="form-control" id="paisOBloque" formControlName="paisOBloque" readonly />
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="paisOOrigin">Pais o origin :</label>
                    <input type="text" class="form-control" id="paisOOrigin" formControlName="paisOOrigin" readonly />
                </div>
            </div>
        </div>

        <div class="row mt-4" >

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="tratado">Pais o destino :</label>
                    <input type="text" class="form-control" id="tratado" formControlName="paisODestino" readonly />
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="paisOBloque">Fetcha de expedicion :</label>
                    <input type="date" class="form-control" id="paisOBloque" formControlName="fetchaDeExpedicion"
                        readonly />
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="paisOOrigin">Fetcha de vencimiento :</label>
                    <input type="date" class="form-control" id="paisOOrigin" formControlName="fetchaDeVencimiento"
                        readonly />
                </div>
            </div>
        </div>
    </form>
</div>
