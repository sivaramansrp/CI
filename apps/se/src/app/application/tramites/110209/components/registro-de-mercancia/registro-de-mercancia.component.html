<div class="container">

    <form [formGroup]="mercanciaFrom">
        <div class="row">
            <div class="col-md-12">
                <div class="form-group">
                    <label for="nombreComercial" class="form-label">Nombre comercial :</label>
                    <input type="text" class="form-control" id="nombreComercial" formControlName="nombreComercial">
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-12">
            <div class="form-group">
                <label for="nombreIngles" class="form-label">Nombre en inglés :</label>
                <input type="text" class="form-control" id="nombreIngles" formControlName="nombreIngles">
            </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-12">
                <div class="form-group">
                    <label for="descripcion" class="form-label">Complemento de la descripción :</label>
                    <input type="text" class="form-control" id="descripcion" formControlName="descripcion">
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="marca"class="form-label">Marca</label>
                    <input type="text" class="form-control" id="marca" formControlName="marca">
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label for="valorMercancia" class="form-label">Valor de la Mercancía</label>
                    <input type="text" class="form-control" id="valorMercancia" formControlName="valorMercancia">
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label for="cantidad" class="form-label">Cantidad</label>
                    <input type="text" class="form-control" id="cantidad" formControlName="cantidad">
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="unidadMedida" class="form-label">Unidad de Medida</label>
                    <input type="text" class="form-control" id="unidadMedida" formControlName="unidadMedida">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="numeroFactura" class="form-label">Número de Factura</label>
                    <input type="text" class="form-control" id="numeroFactura" formControlName="numeroFactura">
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label for="tipoFactura" class="form-label">Tipo de Factura</label>
                    <input type="text" class="form-control" id="tipoFactura" formControlName="tipoFactura">
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label for="fechaFactura" class="form-label">Fecha de Factura</label>
                    <input type="date" class="form-control" id="fechaFactura" formControlName="fechaFactura">
                </div>
            </div>

        </div>

    </form>
    <div class="d-flex justify-content-end mt-4 p-5">
        <button type="button" class="btn btn-default" disabled>Cancelar</button>
        <button type="button" class="btn btn-primary ms-3" (click)="onNavigate()">Modificar</button>
    </div>
</div>
