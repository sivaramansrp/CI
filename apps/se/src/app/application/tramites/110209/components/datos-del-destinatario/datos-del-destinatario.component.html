<div class="container">
    <ng-titulo [titulo]="'Datos del destinatario'"></ng-titulo>
    <form [formGroup]="detosDelDestinatarioForm">
        <div class="row">

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="nombre">Nombre(s):</label>
                    <input type="text" class="form-control" id="nombre" formControlName="nombre" placeholder="Juan" />
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="primerApellido">Primer apellido:</label>
                    <input type="text" class="form-control" id="primerApellido" formControlName="primerApellido" placeholder="Perez"/>
                </div>
            </div>

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="segundoApellido">Segundo apellido:</label>
                    <input type="text" class="form-control" id="segundoApellido" formControlName="segundoApellido" placeholder="Perez"/>
                </div>
            </div>
        </div>

        <div class="row mt-4">

            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label width-unset" for="numeroDeRegistroFiscal">Número de registro
                        fiscal*:</label>
                    <input type="text" class="form-control" id="numeroDeRegistroFiscal" formControlName="numeroDeRegistroFiscal" placeholder="3243254532"/>
                </div>
            </div>

            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label width-unset" for="razonSocial">Razón social :</label>
                    <input type="text" class="form-control" id="razonSocial" formControlName="razonSocial" readonly />
                </div>
            </div>
            
        </div>
    </form>
    <div class="mt-4">
        <app-domicilio-del-destinatario></app-domicilio-del-destinatario>
    </div>
</div>
