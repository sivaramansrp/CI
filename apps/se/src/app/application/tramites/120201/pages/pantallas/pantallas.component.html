<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h3>Solicitud expedición de certificado de asignación directa persona física.</h3>
        </div>
        <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    </div>
    <div class="row">
        @switch (indice) {
        @case (1) {
        <app-datos></app-datos>
        } @case (2) {
        <app-paso-dos></app-paso-dos>
        }
        }
    </div>
    <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)">
    </btn-continuar>
    @if (indice === 1) {
    <ng-alert [CONTENIDO]="TEXTOS" [CUSTOMECLASS]="infoAlert"></ng-alert>
    }
</div>
