<form [formGroup]="registroForm" (ngSubmit)="validarDestinatarioFormulario()">
  <ng-container formGroupName="validacionForm">
    <ng-titulo titulo="Datos del certificado" />
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Observaciones:</label>
        <div class="col-md-12 align-text-area">
          <textarea
            cols="80"
            rows="5"
            formControlName="observaciones" 
            (change)="
              setValoresStore(
                validacionForm,
                'observaciones',
                'setObservaciones'
              )
            "
          ></textarea>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <app-catalogo-select
          [catalogo]="optionsIdioma"
          [label]="'Idioma'"
          [required]="true"
          id="idioma"
          formControlName="idioma"
          
          (change)="setValoresStore(validacionForm, 'idioma', 'setIdioma')"
        ></app-catalogo-select>
      </div>
      <ng-container *ngIf="isJustificacion">
        <ng-titulo titulo="Justificación para obtención del certificado" />
        <div class="row">
          <label>¿Desea obtener el certificado de origen?:</label>
        </div>
        <div class="row">
          <label style="font-weight: bold">
            <input
              type="checkbox"
              formControlName="casillaVerificacion" 
              (change)="
                setValoresStore(
                  validacionForm,
                  'casillaVerificacion',
                  'setCheckbox'
                )
              "
            />
            Sí
          </label>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label>Justificación*:</label>
            <div class="col-md-12 align-text-area">
              <textarea
                cols="80"
                rows="5"
                formControlName="justificacion"
                
                (change)="
                  setValoresStore(
                    validacionForm,
                    'justificacion',
                    'setJustificacion'
                  )
                "
              ></textarea>
            </div>
          </div>
        </div>
      </ng-container>
      <ng-titulo titulo="Representación federal" />
      <div class="row">
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="optionsEntidad"
            [label]="'Entidad federativa'"
            [required]="true"
            formControlName="entidad"
            
            (change)="setValoresStore(validacionForm, 'entidad', 'setEntidad')"
          ></app-catalogo-select>
        </div>
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="optionsRepresentacion"
            [label]="'Representación federal'"
            [required]="true"
            id="representacion"
            formControlName="representacion"
            
            (change)="
              setValoresStore(
                validacionForm,
                'representacion',
                'setRepresentacion'
              )
            "
          ></app-catalogo-select>
        </div>
      </div>
    </div>
  </ng-container>
</form>
