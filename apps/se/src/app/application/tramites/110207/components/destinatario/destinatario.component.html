<form [formGroup]="registroForm" (ngSubmit)="validarDestinatarioFormulario()">
  <ng-container formGroupName="validacionForm">
    <ng-titulo titulo="Datos del destinatario" />
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Nombre(s):</label>
        <input
          type="text"
          class="form-control"
          formControlName="nombre"
          (change)="setValoresStore(validacionForm, 'nombre', 'setNombre')"
        />
      </div>
      <div class="col-md-4 mb-3">
        <label>Primer apellido:</label>
        <input
          type="text"
          class="form-control"
          id="primerApellido"
          formControlName="apellidoPrimer"
          (click)="onClick()"
          (change)="
            setValoresStore(
              validacionForm,
              'apellidoPrimer',
              'setApellidoPrimer'
            )
          "
        />
      </div>
      <div class="col-md-4 mb-3">
        <label>Segundo apellido:</label>
        <input
          type="text"
          class="form-control"
          id="segundoApellido"
          formControlName="apellidoSegundo"
          (change)="
            setValoresStore(
              validacionForm,
              'apellidoSegundo',
              'setApellidoSegundo'
            )
          "
        />
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Número de registro fiscal*:</label>
        <input
          type="text"
          class="form-control"
          id="denominacion"
          formControlName="numeroFiscal"
          (change)="
            setValoresStore(validacionForm, 'numeroFiscal', 'setNumeroFiscal')
          "
        />
      </div>
      <div class="col-md-8 mb-3">
        <label>Razón social:</label>
        <input
          type="text"
          class="form-control"
          [ngClass]="{
            'gray-class':
              registroForm.get('validacionForm.apellidoPrimer')?.value !== ''
          }"
          id="denominacion"
          [readonly]="
            registroForm.get('validacionForm.apellidoPrimer')?.value !== ''
          "
          formControlName="razonSocial"
          (change)="
            setValoresStore(validacionForm, 'razonSocial', 'setRazonSocial')
          "
        />
      </div>
    </div>
    <ng-titulo titulo="Domicilio del destinatario" />
    <div class="row">
      <div class="col-md-8 mb-3">
        <label>Ciudad (población, estado o provincia)*:</label>
        <input
          type="text"
          class="form-control"
          id="denominacion"
          formControlName="ciudad"
          (change)="setValoresStore(validacionForm, 'ciudad', 'setCiudad')"
        />
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Calle*:</label>
        <input
          type="text"
          class="form-control"
          id="nombre"
          formControlName="calle"
          (change)="setValoresStore(validacionForm, 'calle', 'setCalle')"
        />
      </div>
      <div class="col-md-4 mb-3">
        <label>Número y/o letra*:</label>
        <input
          type="text"
          class="form-control"
          id="primerApellido"
          formControlName="numeroLetra"
          (change)="
            setValoresStore(validacionForm, 'numeroLetra', 'setNumeroLetra')
          "
        />
      </div>
      <div class="col-md-1 mb-3">
        <label>Lada:</label>
        <input
          type="text"
          class="form-control"
          id="segundoApellido"
          formControlName="lada"
          (change)="setValoresStore(validacionForm, 'lada', 'setLada')"
        />
      </div>
      <div class="col-md-3 mb-3">
        <label>Teléfono:</label>
        <input
          type="text"
          class="form-control"
          id="segundoApellido"
          formControlName="telefono"
          (change)="setValoresStore(validacionForm, 'telefono', 'setTelefono')"
        />
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label>Fax:</label>
        <input
          type="text"
          class="form-control"
          id="nombre"
          formControlName="fax"
          (change)="setValoresStore(validacionForm, 'fax', 'setFax')"
        />
      </div>
      <div class="col-md-4 mb-3">
        <label>Correo electrónico*:</label
        ><span
          class="bi bi-question-circle-fill"
          title="ejemplo@dominio.com"
          data-bs-toggle="tooltip"
        ></span>
        <input
          type="text"
          class="form-control"
          id="primerApellido"
          formControlName="correoElectronico"
          (change)="
            setValoresStore(
              validacionForm,
              'correoElectronico',
              'setCorreoElectronico'
            )
          "
        />
      </div>
    </div>
    <div class="row">
      <div class="col-md-8 mb-3">
        <app-catalogo-select
          [catalogo]="options"
          [label]="'País destino'"
          [required]="true"
          formControlName="nacion"
          (change)="setValoresStore(validacionForm, 'nacion', 'setNacion')"
        ></app-catalogo-select>
      </div>
    </div>
    <ng-titulo titulo="Detalles del transporte" />
    <div class="row mt-5">
    <div class="col-md-8 mb-3">
      <app-catalogo-select
        [catalogo]="options"
        [label]="'Medio de transporte'"
        [required]="true"
        formControlName="transporte"
        (change)="
          setValoresStore(validacionForm, 'transporte', 'setTransporte')
        "
      ></app-catalogo-select>
    </div></div>
    <div class="row mt-5">
      <div class="col-md-6 mb-3">
        <label>Ruta completa :</label>
          <input
            type="text"
            class="form-control"
            id="rutaCompleta"
            formControlName="rutaCompleta"
            (change)="
              setValoresStore(
                validacionForm,
                'rutaCompleta',
                'setRutaCompleta')"/>
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-6 mb-3">
        <label>Puerto de embarque :</label>
          <input
            type="text"
            class="form-control"
            id="puertoEmbarque"
            formControlName="puertoEmbarque"
            (change)="
              setValoresStore(
                validacionForm,
                'puertoEmbarque',
                'setPuertoEmbarque')"/>
      </div>
      <div class="col-md-6 mb-3">
        <label>Puerto de desembarque :</label>
          <input
            type="text"
            class="form-control"
            id="puertoDesembarque"
            formControlName="puertoDesembarque"
            (change)="
              setValoresStore(
                validacionForm,
                'puertoDesembarque',
                'setPuertoDesembarque')"/>
      </div>
    </div>
  </ng-container>
</form>
