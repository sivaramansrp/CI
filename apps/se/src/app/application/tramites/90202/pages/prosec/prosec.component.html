<div class="page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <h3>
          Registro de solicitud AMPLIACION - PROSEC productor indirecto
        </h3>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { 
        @case (1) {
          <app-paso-uno></app-paso-uno>
        } 
        @case (2) {
          <!-- Step 2: Show conditional buttons for file upload and continue -->
          <div class="mt-5 mb-3 d-flex justify-content-end">
            <button
              type="button"
              class="btn btn-default"
              (click)="anterior()"
              *ngIf="seccionCargarDocumentos"
            >
              Anterior
            </button>
            <button
              class="btn btn-primary ms-3"
              (click)="seccionCargarDocumentos ? onClickCargaArchivos() : siguiente()"
              [disabled]="!activarBotonCargaArchivos && seccionCargarDocumentos"
            >
              {{ seccionCargarDocumentos ? 'Cargar archivos' : 'Continuar' }}
            </button>
          </div>
        } 
        @case (3) {
          <app-paso-tres></app-paso-tres>
        } 
      }
      <!-- Keep btn-continuar for steps other than 2 -->
      <ng-container *ngIf="indice !== 2">
        <btn-continuar
          [datos]="datosPasos"
          (continuarEvento)="getValorIndice($event)"
        ></btn-continuar>
      </ng-container>
    </div>
  </div>
</div>
