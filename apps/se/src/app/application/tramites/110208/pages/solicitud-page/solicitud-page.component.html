<div class="container">
    <div class="row">
        <div class="col-md-12">
          <h2>Validar a posteriori el certificado de SGP</h2>
        </div>
  
        <app-wizard [listaPasos]="pasos"></app-wizard>
  
      </div>
      <div class="row">
        @switch (indice) {
        @case (1) {
          <app-paso-uno></app-paso-uno>
        }
        @case (2) {
         <paso-firma [idSolicitud]="solicitudState.idSolicitud" [procedure]="110208" [procedureUrl]="'validar-inicialmente/certificado-origen'"></paso-firma>
        }
  
        }
  
        <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
      </div>
</div>
