<div class="container">
    <div class="row">
        <div class="col-md-12">
          <h2>Validar inicialmente el certificado de SGP</h2>
        </div>
  
        <app-wizard [listaPasos]="pasos"></app-wizard>
  
      </div>
      <div class="row">
        @switch (indice) {
        @case (1) {
          <app-paso-uno></app-paso-uno>
        }
        @case (2) {
          <app-paso-dos></app-paso-dos>
        }
  
        }
  
        <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
        <ng-alert [CONTENIDO]="alerta.inst"></ng-alert>
      </div>
</div>
