<ng-titulo titulo="Carga de mercancías por archivo" />
<div class="text-end mt-3 mb-4">
    <button class="btn btn-primary" [disabled]="esFormularioSoloLectura ? true : false">Carga por archivo</button>
</div>
<div class="row mt-5">
    <ng-alert [CONTENIDO]="alerta.inst"></ng-alert>
</div>
<h6 class="mt-5">Mercancías seleccionadas</h6>
    <app-tabla-dinamica 
        [configuracionTabla]="mercanciasTabla"
        [datos]="mercanciasTablaDatos"
        [tipoSeleccionTabla]="tipoSeleccionTabla"
        (filaSeleccionada)="filaSeleccionadaEvento($event)">
    </app-tabla-dinamica>
<ul class="pagination d-flex justify-content-center">
    <li class="page-item"><a class="page-link" href="#">1</a></li>
</ul>
<div class="text-end mt-3 mb-3">
    <button class="btn btn-danger me-3" [disabled]="esFormularioSoloLectura ? true : false">Eliminar</button>
    <button class="btn btn-primary" (click)="abrirDialogoMercancias()" [disabled]="esFormularioSoloLectura ? true : false">Modificar</button>
</div>

<div class="modal fade" #modalAgregarMercancias id="modalAgregarMercancias" tabindex="-1" aria-labelledby="modalAgregarMercanciasLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-body">
                <ng-titulo titulo="Datos de la mercancía" />
                <div class="col-md-12">
                    <form [formGroup]="formMercancia">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="fraccionArancelaria">Fracción arancelaria:</label>
                                <input type="text" id="fraccionArancelaria" formControlName="fraccionArancelaria" class="form-control">
                              </div>
                        </div>
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="nombreComercial">Nombre comercial de la mercancía (igual que en la factura):</label>
                                <input type="text" id="nombreComercial" formControlName="nombreComercial" class="form-control">
                              </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="nombreTecnio">Nombre técnico:</label>
                                <input type="text" id="nombreTecnio" formControlName="nombreTecnio" class="form-control">
                              </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="nombreEnIngles">Nombre en inglés:</label>
                                <input type="text" id="nombreEnIngles" formControlName="nombreEnIngles" class="form-control">
                              </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="criterioPara">Criterio para conferir origen:</label>
                                <input type="text" id="criterioPara" formControlName="criterioPara" class="form-control">
                              </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="marca">Marca:</label>
                                <input type="text" id="marca" formControlName="marca" class="form-control" (change)="setValoresStore(formMercancia,'marca', 'setMarca')">
                              </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="cantidad">Cantidad*:</label>
                                <input type="text" id="cantidad" formControlName="cantidad" class="form-control" (change)="setValoresStore(formMercancia,'cantidad', 'setCantidad')" [ngClass]="esValido('cantidad') ? 'required' : ''">
                                <div *ngIf="formMercancia.get('cantidad')?.touched && formMercancia.get('cantidad')?.hasError('required')" class="mensaje-error">
                                    Este campo es obligatorio
                                </div>
                              </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-4">
                            <div class="form-group">
                                <app-catalogo-select [catalogo]="estado" [label]="'UMC'" [tooltipQuestionCircle]="true"
                                [required]="true" name="umc" formControlName="umc" [isDisabled]="esFormularioSoloLectura ? true : false" (change)="setValoresStore(formMercancia,'umc', 'setUmc')"
                                ></app-catalogo-select>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="valorDeLa">Valor de la mercancía (dólares)*:</label>
                                <input type="text" id="valorDeLa" formControlName="valorDeLa" class="form-control" [ngClass]="esValido('valorDeLa') ? 'required' : ''" (change)="setValoresStore(formMercancia,'valorDeLa', 'setValorDeLa')">
                                <div *ngIf="formMercancia.get('valorDeLa')?.touched && formMercancia.get('valorDeLa')?.hasError('required')" class="mensaje-error">
                                    Este campo es obligatorio
                                </div>
                              </div>
                        </div>
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="complementoDescripcion">Complemento de la descripción*:</label>
                                <textarea id="complementoDescripcion" rows="5" formControlName="complementoDescripcion" [ngClass]="esValido('complementoDescripcion') ? 'required' : ''" class="form-control textarea-height" (change)="setValoresStore(formMercancia,'complementoDescripcion', 'setComplementoDescripcion')"></textarea>
                                <div *ngIf="formMercancia.get('complementoDescripcion')?.touched && formMercancia.get('complementoDescripcion')?.hasError('required')" class="mensaje-error">
                                    Este campo es obligatorio
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="nFactura">N° factura*:</label>
                                <input type="text" id="nFactura" formControlName="nFactura" class="form-control"  [ngClass]="esValido('nFactura') ? 'required' : ''" (change)="setValoresStore(formMercancia,'nFactura', 'setNFactura')">
                                <div *ngIf="formMercancia.get('nFactura')?.touched && formMercancia.get('nFactura')?.hasError('required')" class="mensaje-error">
                                    Este campo es obligatorio
                                </div>
                              </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <app-catalogo-select [catalogo]="estado" [label]="'Tipo de factura'"
                                [required]="true" name="tipoDeFactura" formControlName="tipoDeFactura" (change)="setValoresStore(formMercancia,'tipoDeFactura', 'setTipoDeFactura')" [isDisabled]="esFormularioSoloLectura ? true : false"
                                ></app-catalogo-select>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-md-4">
                            <div class="form-group">
                                <input-fecha [datos]="fechaFacturaInput" [setFecha]="formMercancia.get('fechaFactura')?.value"
                                (valorCambiado)="cambioFechaFactura($event,formMercancia,'fechaFactura', 'setFechaFactura')" [isDisabled]="esFormularioSoloLectura ? true : false"></input-fecha>
                            </div>
                        </div>
                    </div>
                    </form>
                </div>
                
                <div class="col-md-12 mt-5 mb-5">
                    <div class="pull-left text-muted text-vertical-align-button" id="lblCamposObligatorios">* Campos obligatorios</div>
                    <div class="text-end">
                        <button type="button" class="btn btn-default me-3" data-bs-dismiss="modal" #closeModal [disabled]="esFormularioSoloLectura ? true : false">Cancelar</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" #closeModal [disabled]="esFormularioSoloLectura ? true : false">Agregar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
