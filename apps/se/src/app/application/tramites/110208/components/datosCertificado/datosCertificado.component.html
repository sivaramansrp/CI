<ng-titulo titulo="Datos del certificado" />
<form [formGroup]="formDatosCertificado">
    <div class="row">
        <div class="col-md-8">
            <label for="observaciones" class="form-label">Observaciones</label>
            <textarea id="observaciones" formControlName="observaciones"  class="mb-4 h-20 w-100" placeholder="" rows="6"></textarea>
          </div>
    </div>
    <div class="row">
        <div class="col-md-4">
            <app-catalogo-select [catalogo]="estado" [label]="'Idioma'"
            [required]="true" name="idioma" formControlName="idioma"
            ></app-catalogo-select>
          </div>
    </div>
    <ng-titulo titulo="Representación federal" />
    <div class="row">
        <div class="col-md-4">
            <app-catalogo-select [catalogo]="estado" [label]="'Entidad federativa'"
            [required]="true" name="entidadFederativa" formControlName="entidadFederativa"
            ></app-catalogo-select>
        </div>
        <div class="col-md-4">
            <app-catalogo-select [catalogo]="estado" [label]="'Representación federal'"
            [required]="true" name="representacionFederal" formControlName="representacionFederal"
            ></app-catalogo-select>
        </div>
    </div>
</form>
