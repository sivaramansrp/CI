<div class="Page"></div>
<div class="Page">
  <div class="container">
    <div class="row">
      @if(indice ===1) {
      <div class="col-md-12">
        <h1>Registro de solicitud de Cancelación IMMEX</h1>
      </div>
      }
      @if(indice !==1) {
      <h1>Firmar</h1>
      <ng-alert [CONTENIDO]="TEXTOS.FIRMAR.Firmar"></ng-alert>
      }
      <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) {
      @case (1) {
      <app-datos></app-datos>
      }
      @case (2) {
      <app-firmar-solicitud></app-firmar-solicitud>

      }


      }
      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)">
      </btn-continuar>

    </div>
    @if(indice === 1){
    <ng-alert [CONTENIDO]="TEXTOS.AVISO.Aviso"></ng-alert>
    }
  </div>

</div>
