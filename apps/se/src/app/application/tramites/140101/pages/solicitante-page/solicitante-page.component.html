<div class="Page"></div>
<div class="Page">
  <div class="container">
    <div class="row">
      @if(indice ===1) {
      <div class="col-md-12">
        <h1>Registro de solicitud de Cancelación IMMEX</h1>
      </div>
      }
      @if(indice !==1) {
      <h1>Firmar</h1>
      <ng-alert [CONTENIDO]="TEXTOS.FIRMAR.alerta"></ng-alert>
      }
      @if(indice ===1 && !esFormaValido) {
      <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="infoError"></ng-alert>
      }
      <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) {
      @case (1) {
      <app-datos [idTipoTramite]="idTipoTramite" #datosComponent></app-datos>
      }
      @case (2) {
      <paso-firma [idSolicitud]="idSolicitudState" [procedure]="140101" [procedureUrl]="'solicitud-de-cancelacion/solicitante'"></paso-firma>
      }


      }
      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)">
      </btn-continuar>

    </div>
    @if(indice === 1){
    <ng-alert [CONTENIDO]="TEXTOS.AVISO.Aviso"></ng-alert>
    }
  </div>

</div>
