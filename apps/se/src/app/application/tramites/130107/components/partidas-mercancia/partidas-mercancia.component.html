<form [formGroup]="forma">
    <div class="row">
        <formas-dinamicas formularioTitulo="Partidas de la mercancía" [forma]="ninoFormGroup"
            [formularioDatos]="partidasDeLaMercancia" [estado]="solicitudDeRegistroState"
            [soloLectura]="consultaState.readonly" (emitirCambioDeValor)="establecerCambioDeValor($event)"></formas-dinamicas>
    </div>

    <div class="row mt-5" style="margin-top: 7rem !important; margin-bottom: 6rem;">
        <div class="col-md-8"></div>
        <div class="col-md-4 text-end">
            <div class="btn-group">
                <button class="btn btn-primary me-2" type="button" [disabled]="consultaState.readonly">
                    Cargar archivo
                </button>
                <button class="btn btn-primary ms-2" (click)="agregarPartida()" [disabled]="consultaState.readonly">
                    Agregar
                </button>
            </div>
        </div>
    </div>

    <div class="row">
        <h6>Partidas:</h6>
        <app-tabla-dinamica [tipoSeleccionTabla]="tablaSeleccion.CHECKBOX" [configuracionTabla]="partidasTabla"
         [disableSeleccionTablaCheckBox]="consultaState.readonly"   [datos]="datospartidas"  (listaDeFilaSeleccionada)="onSeleccionChange($event)"></app-tabla-dinamica>
    </div>

    <div class="row">
        <formas-dinamicas [forma]="ninoFormGroup" [formularioDatos]="partidasDeLa" [estado]="solicitudDeRegistroState"
         [soloLectura]="consultaState.readonly"   (emitirCambioDeValor)="establecerCambioDeValor($event)"></formas-dinamicas>
    </div>
    
    <div class="row mt-5 text-end" style="margin-top: 7rem !important;">
        <div>
            <button type="button" class="btn btn-danger me-2 btn-space" [disabled]="consultaState.readonly" (click)="eliminarSeleccionados()">Eliminar partida</button>
            <button type="button" class="btn btn-primary btn-space" [disabled]="consultaState.readonly">Modificar partida</button>
        </div>
    </div>
</form>
