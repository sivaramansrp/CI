<form [formGroup]="forma">
    <div class="row">
        <formas-dinamicas formularioTitulo="País(es) procedencia" [forma]="ninoFormGroup"
            [formularioDatos]="paisProcedencia" [estado]="solicitudDeRegistroState"
            [soloLectura]="consultaState.readonly"
            (emitirCambioDeValor)="establecerCambioDeValor($event)"></formas-dinamicas>
    </div>
    <div class="row mt-5">
        <crosslist 
        [showSearchInput1]="true"
            [showSearchInput2]="true"
            [showSearchPlaceholder]="false"
            [searchInput1Label]="'País disponible:'"
            [searchInput2Label]="'País seleccionados*:'"
            [fechas]="seleccionarOrigenDelPais" 
            [label]="paisDeProcedenciaLabel"
            [botonField]="paisDeProcedenciaBotones" [isDisabled]="consultaState.readonly"></crosslist>
    </div>
    <div class="row">
        <formas-dinamicas [forma]="ninoFormGroup" [formularioDatos]="paisProcedenciaTodos"
            [estado]="solicitudDeRegistroState" [soloLectura]="consultaState.readonly"
            (emitirCambioDeValor)="establecerCambioDeValor($event)"></formas-dinamicas>
    </div>

</form>
