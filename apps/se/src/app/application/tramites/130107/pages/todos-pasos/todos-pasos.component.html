<div class="page">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>{{titulo}}</h1>
                <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
            </div>
        </div>
        <div class="row">
            @switch (indice) {
            @case (1) {
            <app-paso-uno></app-paso-uno>
            }
            @case (2) {
            <app-paso-dos></app-paso-dos>
            }
            @case (3) {
            <app-paso-tres></app-paso-tres>
            }
            }
            <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)">
            </btn-continuar>
            <ng-alert [CONTENIDO]="aviso"  *ngIf="indice === 1"></ng-alert>
        </div>
    </div>
</div>
