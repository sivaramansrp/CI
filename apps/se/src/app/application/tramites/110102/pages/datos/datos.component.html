<div class="Page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-12">
        <h3>
          Para UE/AELC, ALADI, SGP, Japón, Perú, Uruguay, Panamá y para el certificado de
          artículos mexicanos (CAM), y para el carácter de exportador autorizado
          para UE/AELC, para comercializador
        </h3>
      </div>
    </div>
    <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
  
  <div class="row">
    @switch (indice) { @case (1) {
    <app-datos-mercancia></app-datos-mercancia>
    } @case (2) {
  <app-paso-dos></app-paso-dos>
    } @case (3) {
  <app-paso-tres></app-paso-tres>
    }
    }
  </div>

  <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
</div>
</div>
