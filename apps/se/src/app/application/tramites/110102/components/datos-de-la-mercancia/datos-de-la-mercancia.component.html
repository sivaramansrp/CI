<form [formGroup]="datosDeLamercanciaFrom">
    <div class="form">
        <ng-titulo [titulo]="'Datos de la Mercancía'"></ng-titulo>
        <div class="row">
            <div class="col-md-6 form-group">
                <label for="certificadoOrigenProductoNumRegistro" class="form-label text-start">Número de Registro de
                    Productos Elegibles *:</label>
                <input type="text" id="cveRegistroProductor" formControlName="cveRegistroProductor" class="form-control"
                    (change)="setValoresStore(datosDeLamercanciaFrom,'cveRegistroProductor')" />
                <div *ngIf="esInvalido('cveRegistroProductor')" class="text-danger">
                    <small *ngIf="datosDeLamercanciaFrom.controls['cveRegistroProductor'].hasError('required')">Este
                        campoes obligatorio.</small>
                </div>
            </div>
            <div class="col-md-2 mt-4">
                <button type="button" class="btn btn-primary mt-4" (click)="actualizaGridComercializadoresProductos()">
                    Buscar
                </button>
            </div>
        </div>
    </div>
</form>

 @if (nuevaAlertaNotificacion) {
        <div>
            <lib-notificaciones [notificacionInput]="nuevaAlertaNotificacion"></lib-notificaciones>
        </div>
    }
