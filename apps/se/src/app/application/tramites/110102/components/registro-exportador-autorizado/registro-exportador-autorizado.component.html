<div class="container">
    <ng-titulo [titulo]="'Información opcional para UE y AELC'"></ng-titulo>
    <form [formGroup]="registroExportadorForm">
        <div class="row">
            <div class="form-group">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="solicitaSeparacionContable" formControlName="solicitaSeparacionContable" />
                  <label class="form-check-label text-justify" for="solicitaSeparacionContable">
                    ¿Desea usar la opción del método de separación contable? 
                  </label>
                </div>
            </div>
            <div class="form-group">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="solicitaExportadorAutorizado"  formControlName="solicitaExportadorAutorizado"/>
                  <label class="form-check-label text-justify" for="solicitaExportadorAutorizado">
                    ¿Desea usar la opción de exportador autorizado? 
                  </label>
                </div>
            </div>
        </div>
    </form>
</div>
