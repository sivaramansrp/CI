<div class="container">
    <form [formGroup]="representacionForm">
      <div class="row mb-3">
        <ng-titulo titulo="Representación federal"></ng-titulo>
        <div class="col-md-4">
          <app-catalogo-select 
            [catalogo]="entidad" 
            [label]="'Entidad Federativa'"
            [required]="true"
            name="entidad" 
            formControlName="entidad"
            (change)="getEntidad()"
            >
          </app-catalogo-select>
           <div *ngIf="esInvalido('entidad')" class="text-danger">
            <small
              *ngIf="
                representacionForm.controls['entidad'].hasError('required')
              "
              >Este campo es obligatorio.</small
            >
          </div>
        </div>
        <div class="col-md-4">
          <app-catalogo-select 
            [catalogo]="representacion" 
            [label]="'Representación federal'" 
            [required]="true"
            name="representacion" 
            formControlName="representacion"
            (change)="getRepresentacion()"
           >
          </app-catalogo-select>
           <div *ngIf="esInvalido('representacion')" class="text-danger">
            <small
              *ngIf="
                representacionForm.controls['representacion'].hasError('required')
              "
              >Este campo es obligatorio.</small
            >
          </div>
        </div>
      </div>
    </form>
  </div>
