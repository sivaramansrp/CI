<div class="container">
    <form [formGroup]="representacionForm">
      <div class="row mb-3">
        <ng-titulo titulo="Representación federal"></ng-titulo>
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="entidad"
            [label]="'Entidad Federativa'"
            [required]="true"
            name="entidad"
            formControlName="entidad"
            (selectionChange)="getEntidad($event)"
            >
          </app-catalogo-select>
        </div>
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="representacion"
            [label]="'Representación federal'"
            [required]="true"
            name="representacion"
            formControlName="representacion"
           (selectionChange)="getRepresentacion($event)"
           >
          </app-catalogo-select>
        </div>
      </div>
    </form>
  </div>
