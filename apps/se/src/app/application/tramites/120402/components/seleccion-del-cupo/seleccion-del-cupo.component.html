<div class="container">
  <form [formGroup]="seleccionForm">
    <ng-titulo titulo="Selección del cupo"></ng-titulo>
    <div class="row mb-3">
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="regimen" [label]="'Régimen aduanero'" name="regimen"
          [isDisabled]="esFormularioSoloLectura" [required]="true" formControlName="regimen" (change)="setValorStore(seleccionForm,'regimen')"
          [required]="true">
        </app-catalogo-select>
      </div>
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="tratado" [label]="'Tratado o bloque comercial'" name="tratado"
          [isDisabled]="esFormularioSoloLectura" [required]="true" formControlName="tratado" (change)="setValorStore(seleccionForm,'tratado')">
        </app-catalogo-select>
      </div>
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="producto" [label]="'Nombre de producto'" name="producto"
          [isDisabled]="esFormularioSoloLectura" [required]="true" formControlName="producto"
          (change)="setValorStore(seleccionForm,'producto')">
        </app-catalogo-select>
      </div>
      <div class="col-md-4">
        <app-catalogo-select [catalogo]="subproducto" [label]="'Nombre del subproducto'" name="subproducto"
          [isDisabled]="esFormularioSoloLectura" [required]="true" formControlName="subproducto"
          (change)="setValorStore(seleccionForm,'subproducto')">
        </app-catalogo-select>
      </div>
    </div>
    <hr />
    <div class="row mt-5 mb-5">
      <div class="col-md-8"></div>
      <div class="col-md-4 text-end">
        <div class="btn-group">
          <button class="btn btn-primary me-2" type="button"  [disabled]="esFormularioSoloLectura" (click)="manejarBuscar()">
            Buscar
          </button>
        </div>
      </div>
    </div>
  </form>

  <div>
    <ng-alert [CONTENIDO]="tituloAlerta" [CUSTOMECLASS]="infoAlerta"></ng-alert>
    <app-tabla-dinamica [configuracionTabla]="configuracionColumnasCupo" [datos]="datosTablaCupo"
      [acciones]="[accionesEnum.EDITAR]" (alternarValor)="onAccionCupo($event)"></app-tabla-dinamica>
  </div>
  <div>
    <lib-notificaciones *ngIf="modalAbierto" [notificacionInput]="nuevaNotificacion"
      (confirmacionModal)="cerrarModal()">
    </lib-notificaciones>
  </div>
  <app-descripcion-del-cupo *ngIf="mostrarDescripcionCupo"></app-descripcion-del-cupo>
  <app-cantidad-solicitada *ngIf="mostrarDescripcionCupo"></app-cantidad-solicitada>
</div>
