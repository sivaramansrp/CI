<div class="container mt-5">
    <form [formGroup]="form">
      <div>
        <ng-titulo titulo="Cantidad solicitada y unidad de medida"></ng-titulo>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="cantidadSolicitada">Cantidad solicitada*:</label>
              <input
                class="form-control"
                type="text"
                id="cantidadSolicitada"
                formControlName="cantidadSolicitada"
                appUppercase
                [disabled]="true"
                aria-labelledby="cantidadSolicitada"
              />
            </div>
          </div>
        </div>
        <div>
            (Pieza)
        </div>
        <div class="row mt-5 mb-5">
            <div class="col-md-8">Campos obligatorios</div>
            <div class="col-md-4 text-end">
                <div class="btn-group">
                    <button class="btn btn-primary me-2" type="button">Continuar</button>
                </div>
            </div>
        </div>
      </div>
    </form>
  </div>
