<div class="container mt-5">
    <form [formGroup]="form">
      <div>
        <ng-titulo titulo="Cantidad solicitada y unidad de medida"></ng-titulo>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="cantidadSolicitada">Cantidad solicitada*:</label>
              <input
                class="form-control"
                type="text"
                id="cantidadSolicitada"
                formControlName="cantidadSolicitada"
                libUppercase
                aria-labelledby="cantidadSolicitada"
                (change)="setValorStore(form, 'cantidadSolicitada')"
              />
              <div *ngIf="esInvalido('cantidadSolicitada')" class="text-danger">
                <small *ngIf="form.controls['cantidadSolicitada'].hasError('required')">(Monto a ampliar) es un campo requerido</small>
                <small class="text-danger" *ngIf="form.get('cantidadSolicitada')?.errors?.['pattern']">
                  el valor ({{form.get('cantidadSolicitada')?.value}}) debe ser un número válido
                </small>
              </div>
            </div>
          </div>
        </div>
        <div>
            (Pieza)
        </div>
      </div>
    </form>
  </div>
