<div class="Page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-12">
        <h1>Asignación directa de cupo personas morales (primera vez)</h1>
      </div>
       @if (showAlert) {
        <div>
            <lib-notificaciones
             [notificacionInput]="nuevaAlertaNotificacion"></lib-notificaciones>
            
        </div>
        
    }
      <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-datos></app-datos>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
      }
     }
    </div>

    <btn-continuar
      [datos]="datosPasos"
      (continuarEvento)="getValorIndice($event)"
  (click)="actualizaGridComercializadoresProductos()"
    ></btn-continuar>
    <!-- @if(showAlert){
     <ng-alert [CONTENIDO]="TEXTOS" [CUSTOMECLASS]="infoAlert"></ng-alert>
    } -->
  </div>
</div>
