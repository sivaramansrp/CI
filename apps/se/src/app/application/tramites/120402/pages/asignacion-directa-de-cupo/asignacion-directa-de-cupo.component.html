<div class="Page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-12">
        <h1>Asignación directa de cupo personas morales (primera vez)</h1>
      </div>

      @if (esFormaValido) {
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
      }
    
      <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-datos #datosRef></app-datos>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
      }
      }
    </div>

    <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)" [dePadre]="true">
    </btn-continuar>

    <div class="row" mt-5>
      <ng-alert [CONTENIDO]="PRIVACY_NOTICE_CONTENT"></ng-alert>
    </div>

  </div>
</div>
