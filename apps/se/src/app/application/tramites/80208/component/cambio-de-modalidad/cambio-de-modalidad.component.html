<div class="container mt-4">
    <form [formGroup]="cambioDeModalidadForm">
        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="seleccionaLaModalidad">Selecciona la modalidad:</label>
                    <input class="form-control" id="seleccionaLaModalidad"
                        type="text" formControlName="seleccionaLaModalidad">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="folio">Folio:</label>
                    <input class="form-control" id="folio" type="text"
                        formControlName="folio">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="año">Año:</label>
                    <input class="form-control" id="año" type="text"
                        formControlName="ano">
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label" for="seleccionaModalidad">Selecciona la modalidad:</label>
                    <input class="form-control" id="seleccionaModalidad"
                        type="text" formControlName="seleccionaModalidad">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <app-catalogo-select formControlName="cambioDeModalidad" [label]="'Cambio de Modalidad'"
                        [required]="true" name="cambioDeModalidad" [catalogo]="cambioDeModalidad"
                        (selectionChange)="seleccionarDesplegable($event)"
                        [isDisabled]="esFormularioSoloLectura"
                        >
                    </app-catalogo-select>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="container mt-4" *ngIf="espectaculoServiciosImmx">
    <ng-titulo titulo="Servicios IMMEX"></ng-titulo>
    <div class="row">
        <div class="col-md-8">
            <form [formGroup]="serviciosImmxForm">
                <div class="form-group">
                    <app-catalogo-select formControlName="serviciosImmx" [label]="'Servicios IMMEX'" [required]="true"
                        name="serviciosImmx" [catalogo]="serviciosImmx" [placeholder]="'selecciona un valor'"
                        [isDisabled]="esFormularioSoloLectura"
                        ></app-catalogo-select>
                </div>
            </form>
        </div>
    </div>

    <div class="row">
        <div class="d-flex justify-content-end">
            <div class="btn-group">
                <button class="btn btn-primary me-2" type="button">Eliminar</button>
                <button class="btn btn-danger" type="button">Agregar</button>
            </div>
        </div>
    </div>

    <div class="row my-4">
        <div class="col-md-12">
            <label class="form-label mb-4" for="serviciosImmx">Servicios IMMEX:</label>
            <app-tabla-dinamica [tipoSeleccionTabla]="tablaSeleccion" [configuracionTabla]="configuracionTabla"
            [datos]="ServiciosDatos"></app-tabla-dinamica>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <label class="form-label mb-4" for="serviciosImmx">Servicios autorizados:</label>
            <app-tabla-dinamica [tipoSeleccionTabla]="tablaSeleccion" [configuracionTabla]="configuracionTabla"
            [datos]="autorizadosDatos"></app-tabla-dinamica>
        </div>
    </div>
</div>
