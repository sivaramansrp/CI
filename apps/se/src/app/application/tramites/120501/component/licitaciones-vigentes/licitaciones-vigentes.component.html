      <ng-titulo
        titulo="Administrar residuos y/o materia prima a importar"
      ></ng-titulo>
  
      <div>
        <h6>Licitaciones disponibles</h6>
        <app-tabla-dinamica [configuracionTabla]="configTableArray"
        [datos] = "datos"></app-tabla-dinamica>

        <!-- Representación federal  -->
        <div class="container">
          <ng-titulo titulo="Representación federal" />
          <form [formGroup]="formulario">
            <div class="row">
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="entidadfederativa" formControlName="entidadfederativa" [label]="'Entidad federativa'"
                  [required]="true" name="federalent"></app-catalogo-select>
              </div>
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="representacionfederal" formControlName="representacionfederal" [label]="'Representación federal'"
                  [required]="true" name="representfederal"></app-catalogo-select>
              </div>
            </div>
            </form>
        </div>
      
        <!-- Detalle de la licitación y monto adjudicado  -->
        <div class="container">
          <ng-titulo titulo="Detalle de la licitación y monto adjudicado" />
            <form [formGroup]="detalledelalicitacionForm">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label" for="numeradelicitacion">Número de licitación:</label>
                    <input type="text" class="form-control" id="numeradelicitacion" formControlName="numeradelicitacion" size="30" readonly>
                </div>
        
                <div class="col-md-4">
                    <label class="form-label" for="fechadeleventodelicitacion">Fecha de evento de licitación pública: </label>
                    <input type="text" class="form-control" id="fechadeleventodelicitacion" formControlName="fechadeleventodelicitacion" size="30" readonly>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="descripciondelproducto">Descripción del producto:</label>
                  <input type="text" class="form-control" id="descripciondelproducto" formControlName="descripciondelproducto" size="30" readonly>
              </div>
                <div class="col-md-8">
                    <label class="form-label" for="unidadtarifaria">Unidad de medida tarifaria o comercialización:</label>
                    <input type="text" class="form-control" id="unidadtarifaria" formControlName="unidadtarifaria" size="30" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="regimenaduanero">Régimen aduanero:</label>
                    <input type="text" class="form-control" id="regimenaduanero" formControlName="regimenaduanero" size="30" readonly>
                </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <label class="form-label" for="fraccionarancelaria">Fracción o fracciones arancelarias: </label>
                <input type="text" class="form-control" id="fraccionarancelaria" formControlName="fraccionarancelaria" size="30" readonly>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <label class="form-label" for="fechadeiniciodevigenciadelcupo">Fecha de inicio de vigencia del cupo </label>
                <input type="text" class="form-control" id="fechadeiniciodevigenciadelcupo" formControlName="fechadeiniciodevigenciadelcupo" size="30"  readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="fechadefindevigenciadelcupo">Fecha de fin de vigencia del cupo:  </label>
                <input type="text" class="form-control" id="fechadefindevigenciadelcupo" formControlName="fechadefindevigenciadelcupo" size="30" readonly>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12">
                <label class="form-label" for="observaciones">Observaciones: </label>
                <textarea type="text" class="form-control observaciones" rows="3" id="observaciones" formControlName="observaciones" readonly></textarea>
              </div>
              <div class="col-md-12">
                <label class="form-label" for="bloquecomercial">Bloque comercial: </label>
                <input type="text" class="form-control" id="bloquecomercial" formControlName="bloquecomercial" readonly>
              </div>
              <div class="col-md-12">
                <label class="form-label" for="paises">Países: </label>
                <textarea type="text" class="form-control observaciones" id="paises" formControlName="paises" readonly></textarea>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="montoadjudicado">Monto adjudicado: </label>
                <input type="text" class="form-control" id="montoadjudicado" formControlName="montoadjudicado" readonly>
              </div><div class="col-md-4">
                <label class="form-label" for="montodisponible">Monto disponible: </label>
                <input type="text" class="form-control" id="montodisponible" formControlName="montodisponible" readonly>
              </div><div class="col-md-4">
                <label class="form-label" for="montomaximo">Monto máximo: </label>
                <input type="text" class="form-control" id="montomaximo" formControlName="montomaximo" readonly>
              </div>
            </div>
        </form>
        
        </div>
        <!-- Adquiriente  -->
        <div class="container">
          <ng-titulo titulo="Adquiriente" />
          <form [formGroup]="adquiriente">
            <div class="row">
              <div class="col-md-4">
                <label class="form-label" for="rfc">RFC*:</label>
                <input type="text" class="form-control" id="rfc" formControlName="rfc" readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="montodisponible">Monto disponible:</label>
                <input type="text" class="form-control" id="montodisponible" formControlName="montodisponible" readonly>
              </div>
              <div class="col-md-4">
                <button type="button" class="btn btn-primary col-auto pull-right float-end mt-3">
                  Seleccionar participante 
              </button>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="montorecibir">Monto a recibir*:</label>
                <input type="text" class="form-control bg-white" id="montorecibir" formControlName="montorecibir" [ngClass]="isInvalid('montorecibir') ? 'required' : ''">
                <div *ngIf="isInvalid('montorecibir')" class="text-danger">
                  Este campo es obligatorio
              </div>
              </div>
            </div>
            </form>
            
        </div>
      </div>
      <!-- <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar> -->
      <div class="row mt-5">
        <ng-alert [CONTENIDO]="texto"></ng-alert>
    </div>
    </div>
  </div>
