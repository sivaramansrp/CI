<div class="container">
    <div>
      <ng-titulo
        titulo="Administrar residuos y/o materia prima a importar"
      ></ng-titulo>
  
      <div>
        <h6>Licitaciones disponibles</h6>
  
        <!-- <ng-table
          [commonTableHeader]="tableData.tableHeader"
          [commonTableBody]="tableData.tableBody"
          [enableScrollbar]="true" [tableoptions] = "tableoptions"
        ></ng-table> -->
        <ng-table
          [commonTableHeader]="tableData.tableHeader"
          [commonTableBody]="tableData.tableBody"
          [enableScrollbar]="true"
        ></ng-table>
  
        <form [formGroup]="formForTotalCount">
          <div class="text-center">
            <div>
              <input
                class="label-width"
                id="recuentoTotalDeFilas"
                formControlName="recuentoTotalDeFilas"
                aria-labelledby="recuentoTotalDeFilas"
                [disabled]="true"
              />
            </div>
          </div>
        </form>
        <!-- Representación federal  -->
        <div class="container">
          <ng-titulo titulo="Representación federal" />
          <form [formGroup]="formulario">
            <div class="row">
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="federalentity" formControlName="federalentity" [label]="'Entidad federativa'"
                  [required]="true" name="federalent"></app-catalogo-select>
              </div>
              <div class="col-md-4">
                <app-catalogo-select [catalogo]="representationfederal" formControlName="representationfederal" [label]="'Representación federal'"
                  [required]="true" name="representfederal"></app-catalogo-select>
              </div>
            </div>
            </form>
        </div>
      
        <!-- Detalle de la licitación y monto adjudicado  -->
        <div class="container">
          <ng-titulo titulo="Detalle de la licitación y monto adjudicado" />
            <form [formGroup]="detalledelalicitacionForm">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label" for="numeradelicitacion">Número de licitación:</label>
                    <input type="text" class="form-control" id="numeradelicitacion" formControlName="numeradelicitacion" placeholder="002/2024" readonly>
                </div>
        
                <div class="col-md-4">
                    <label class="form-label" for="biddingeventdate">Fecha de evento de licitación pública: </label>
                    <input type="text" class="form-control" id="biddingeventdate" formControlName="biddingeventdate"  placeholder="2024-03-22 " readonly>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="productdescription">Descripción del producto:</label>
                  <input type="text" class="form-control" id="productdescription" formControlName="productdescription" placeholder="PANTALONES CON PETO Y TIRANTI " readonly>
              </div>
                <div class="col-md-8">
                    <label class="form-label" for="tariffunit">Unidad de medida tarifaria o comercialización:</label>
                    <input type="text" class="form-control" id="tariffunit" formControlName="tariffunit" placeholder="Caja" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="customsregime">Régimen aduanero:</label>
                    <input type="text" class="form-control" id="customsregime" formControlName="customsregime" placeholder="EXPORTACION" readonly>
                </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <label class="form-label" for="tarifffraction">Fracción o fracciones arancelarias: </label>
                <input type="text" class="form-control" id="tarifffraction" formControlName="tarifffraction" placeholder="61012003, 61013001, 61013099, " readonly>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <label class="form-label" for="quotaeffectivedate">Fecha de inicio de vigencia del cupo </label>
                <input type="text" class="form-control" id="quotaeffectivedate" formControlName="quotaeffectivedate" placeholder="2024-03-01" readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="quotaenddate">Fecha de fin de vigencia del cupo:  </label>
                <input type="text" class="form-control" id="quotaenddate" formControlName="quotaenddate" placeholder="2024-12-31" readonly>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12">
                <label class="form-label" for="observaciones">Observaciones: </label>
                <input type="text" class="form-control observaciones" id="observaciones" formControlName="observaciones" readonly>
              </div>
              <div class="col-md-12">
                <label class="form-label" for="bloquecomercial">Bloque comercial: </label>
                <input type="text" class="form-control" id="bloquecomercial" formControlName="bloquecomercial" placeholder="Tratado entre México, Estados Unidos y Canadá" readonly>
              </div>
              <div class="col-md-12">
                <label class="form-label" for="Paises">Países: </label>
                <input type="text" class="form-control observaciones" id="Paises" formControlName="Paises" placeholder="ESTADOS UNIDOS DE AMERICA," readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="montoadjudicado">Monto adjudicado: </label>
                <input type="text" class="form-control" id="montoadjudicado" formControlName="montoadjudicado" placeholder="9985" readonly>
              </div><div class="col-md-4">
                <label class="form-label" for="montodisponible">Monto disponible: </label>
                <input type="text" class="form-control" id="montodisponible" formControlName="montodisponible" placeholder="9985" readonly>
              </div><div class="col-md-4">
                <label class="form-label" for="montomaximo">Monto máximo: </label>
                <input type="text" class="form-control" id="montomaximo" formControlName="montomaximo" placeholder="10000" readonly>
              </div>
            </div>
        </form>
        
        </div>
        <!-- Adquiriente  -->
        <div class="container">
          <ng-titulo titulo="Adquiriente" />
          <form [formGroup]="adquiriente">
            <div class="row">
              <div class="col-md-4">
                <label class="form-label" for="rfc">RFC*:</label>
                <input type="text" class="form-control" id="rfc" formControlName="rfc" placeholder="eeg860212925" readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="montodisponible">Monto disponible:</label>
                <input type="text" class="form-control" id="montodisponible" formControlName="montodisponible" placeholder="15" readonly>
              </div>
              <div class="col-md-4">
                <button type="button" class="btn btn-primary col-auto pull-right float-end mt-3">
                  Seleccionar participante 
              </button>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="montorecibir">Monto a recibir*:</label>
                <input type="text" class="form-control bg-white" id="montorecibir" formControlName="montorecibir" placeholder="1000">
              </div>
            </div>
            </form>
            
        </div>
      </div>
    </div>
  </div>
