<div class="Page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1>Registro de solicitud de Reporte Anual</h1>
      </div>
       <div class="col-md-12 mt-2 mb-2">
        @if(!esValido) {
        <ng-alert
          [CUSTOMECLASS]="'alert-danger'"
          class="text-center"
          [CONTENIDO]="mensajeError"
        ></ng-alert>
        }
      </div>
      <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-datos #datos></app-datos>
      } @case (2) {
      <app-paso-tres></app-paso-tres>
      } }
    </div>
    <btn-continuar
      [datos]="datosPasos"
      (continuarEvento)="getValorIndice($event)"
    ></btn-continuar>
  </div>
</div>
