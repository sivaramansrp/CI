<div class="Page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1>Registro de solicitud de Reporte Anual</h1>
      </div>
       <div class="col-md-12 mt-2 mb-2">
          @if (!esFormaValido && esFormaValido !== undefined) {
            <div class="col-md-12">
              <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
            </div>
          }
      </div>
      <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-datos #datos></app-datos>
      } @case (2) {
        <paso-firma [idSolicitud]="guardarIdSolicitud" [procedure]="150102" [procedureUrl]="'reporte-anual/solicitud'"></paso-firma>
      } }
    </div>
    <btn-continuar
      [datos]="datosPasos"
      [dePadre]="!consultaState.readonly ? true : false"
      (continuarEvento)="getValorIndice($event)"
    ></btn-continuar>
    <ng-alert [CONTENIDO]="PAGO_DE_DERECHOS"></ng-alert>
  </div>
</div>
