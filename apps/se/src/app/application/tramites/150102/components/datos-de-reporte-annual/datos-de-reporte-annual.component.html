<div class="container">
  <form [formGroup]="formReporteAnnual">
    <ng-titulo
      titulo="Reporte anual balanza comercial (Capture todas las cantidades en miles de pesos)"
    />

    <div class="row mt-3">
      <div class="col-md-4">
        <label class="form-label" for="ventasTotales"
          >Ventas totales (a)*:</label
        >
        <input
          type="text"
          id="ventasTotales"
          class="form-control"
          maxlength="16"
          formControlName="ventasTotales"
          (change)="obtenerVentasTotales($event)"
        />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="totalExportaciones"
          >Total exportaciones (b)*:</label
        >
        <input
          type="text"
          id="totalExportaciones"
          class="form-control"
          maxlength="16"
          formControlName="totalExportaciones"
          (input)="obtenerTotalExportaciones($event)"
        />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="totalImportaciones"
          >Total importaciones (c)*:</label
        >
        <input
          type="text"
          id="totalImportaciones"
          class="form-control"
          formControlName="totalImportaciones"
          (input)="obtenerTotalImportaciones($event)"
        />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="saldo">Saldo b-c:</label>
        <input
          type="text"
          id="saldo"
          class="form-control"
          formControlName="saldo"
        />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="porcentajeExportacion"
          >Porcentaje exportación b/a*100:</label
        >
        <input
          type="text"
          id="porcentajeExportacion"
          class="form-control"
          formControlName="porcentajeExportacion"
        />
      </div>
    </div>

    <div class="row mt-5">
      <div class="col-md-12">
        <h6 class="mt-3 mb-5">Relación de bienes producidos</h6>
        <app-tabla-con-entrada
          [tipoSeleccionTabla]="producidosSeleccionTabla"
          [datos]="producidosDatos"
          [inputSelection]="producidosSelection"
          [configuracionTabla]="producidosConfiguracionTabla"
          (filaSeleccionada)="seleccionarFilaDeEntrada($event)"
        >
        </app-tabla-con-entrada>
      </div>
      <div class="row justify-content-end">
        <button
          type="button"
          class="btn btn-primary col-auto pull-right float-end mt-3"
          (click)="agregarBienesProducidos()"
        >
          Agregar
        </button>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-12">
        <h6 class="mt-3 mb-5">Relacion de bienes producidos</h6>
        <app-tabla-dinamica
          [tipoSeleccionTabla]="bienesProducidosSeleccionTabla"
          [datos]="bienesProducidosDatos"
          [inputSelection]="bienesProducidosSelection"
          [configuracionTabla]="bienesProducidosConfiguracionTabla"
          (listaDeFilaSeleccionada)="seleccionarBienesFilaDeEntrada($event)"
        >
        </app-tabla-dinamica>
        <div class="row justify-content-end">
          <button
            type="button"
            class="btn eliminar-btn col-auto pull-right float-end mt-3"
            (click)="eliminarBienesProducidos()"
          >
            Eliminar
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
@if (nuevaNotificacion) {
<section>
  <lib-notificaciones
    [notificacionInput]="nuevaNotificacion"
    (confirmacionModal)="eliminarPedimento($event)"
  ></lib-notificaciones>
</section>
}
