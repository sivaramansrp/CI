<div class="container">
    <div class="row">
        <ul class="nav nav-tabs">
            <li [ngClass]="indice === 1 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(1)">Solicitante</a>
            </li>
            <li [ngClass]="indice === 2 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(2)">Certificado de origen</a>
            </li>
            <li [ngClass]="indice === 3 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(3)">Destinatario</a>
            </li>
            <li [ngClass]="indice === 4 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(4)">Datos certificado</a>
            </li>
        </ul>
        <ng-container>
            @switch (indice) {
            @case (1) {
            <solicitante></solicitante>
            }
            @case (2){
                <app-certificado-origen></app-certificado-origen>
            }
            @case (3){
                <app-cam-destinatario></app-cam-destinatario>
            }
            @case (4){
                <app-cam-datos-certificado></app-cam-datos-certificado>
            }
            }
        </ng-container>
    </div>
</div>
