<app-datos-certificado-de

  [idProcedimiento]="110211"
  (formDatosCertificadoEvent)="setValoresStore($event)"
  (idiomaSeleccionEvent)="idiomaSeleccion($event)"
  (entidadFederativaSeleccionEvent)="entidadFederativaSeleccion($event)"
  (representacionFederalSeleccionEvent)="representacionFederalSeleccion($event)"

  [representacionFederalDatos]="representacionFederal || []"
  [esFormularioSoloLectura]="esFormularioSoloLectura"

  (formaValida)="setFormValida($event)"
></app-datos-certificado-de>
