<div class="container">
  <form [formGroup]="periodoReporteAnual">
    <ng-titulo titulo="Periodo que cubre reporte annual" />

    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="reporteAnualFechaInicio">Incio:</label>
          <input class="form-control" id="reporteAnualFechaInicio" type="date" formControlName="reporteAnualFechaInicio"
                [ngClass]="isValid(periodoReporteAnual,'reporteAnualFechaInicio') ? 'required' : ''"
                (change)="setValoresStore(periodoReporteAnual,'reporteAnualFechaInicio', 'setReporteAnualFechaInicio')" />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="reporteAnualFechaFin">Fin:</label>
          <input class="form-control" id="reporteAnualFechaFin" type="date" formControlName="reporteAnualFechaFin"
                [ngClass]="isValid(periodoReporteAnual,'reporteAnualFechaFin') ? 'required' : ''"
                (change)="setValoresStore(periodoReporteAnual,'reporteAnualFechaFin', 'setReporteAnualFechaFin')" />
        </div>
      </div>
      <div class="col-md-4"></div>
    </div>
    <div class="row mt-5">
      <div class="col-md-12">
        <app-tabla-dinamica
          [tipoSeleccionTabla]="solicitudSeleccionTabla"
          [datos]="solicitudDatos"
          [configuracionTabla]="solicitudConfiguracionTabla"
          (filaSeleccionada)="actualizarProgramasReporte($event)"
        >
        </app-tabla-dinamica>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-md-4">
        <label class="form-label" for="folioPrograma">Folio de programa:</label>
        <input
          type="text"
          id="folioPrograma"
          class="form-control"
          formControlName="folioPrograma"
        />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="modalidad"
          >Selecciona la modalidad:</label
        >
        <input
          type="text"
          id="modalidad"
          class="form-control"
          formControlName="modalidad"
        />
      </div>
      <div class="col-md-4"></div>
      <div class="col-md-4">
        <label class="form-label" for="tipoPrograma">Tipo programa:</label>
        <input
          type="text"
          id="tipoPrograma"
          class="form-control"
          formControlName="tipoPrograma"
        />
      </div>
      <div class="col-md-4">
        <label class="form-label" for="estatus">Estatus:</label>
        <input
          type="text"
          id="estatus"
          class="form-control"
          formControlName="estatus"
        />
      </div>
      <div class="col-md-4"></div>
    </div>
    
  </form>
</div>
