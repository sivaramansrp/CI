<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h5>Permisos a cancelar</h5>
      <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionSolicitud" [configuracionTabla]="configuracionColumnasSolicitud"
        [datos]="cuerpoTablaCancelacion"></app-tabla-dinamica>

    </div>
  </div>
  <div class="row mt-2">
    <div class="col-md-12 d-flex justify-content-end">
      <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"
        aria-controls="offcanvasRight" [disabled]="cuerpoTablaCancelacion.length === 0" (click)="eliminarRegistro($event)">Eliminar registro</button>
      <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"
        aria-controls="offcanvasRight" (click)="busqueda($event)">Búsqueda folio</button>
    </div>
  </div>
  <div *ngIf="datosDePermiso">
    <form [formGroup]="cancelacionForm">
      <div class="row">
        <div class="col-md-12">
          <label class="form-label" for="motivoCancelacion">Motivo cancelación*:
          </label>
          <textarea rows="3" style="height: 80px" class="form-control" id="motivoCancelacion"
            formControlName="motivoCancelacion"></textarea>
        </div>

      </div>
    </form>

  </div>
