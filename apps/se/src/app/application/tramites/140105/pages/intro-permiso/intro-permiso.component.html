<div class="page">
  <div class="container">
    @if (indice !== 2) {
    <div class="row" [class.hide]="mostrarBusqueda">
      <div class="col-md-12">
        <h1>Cancelación por solicitud de permisos</h1>
      </div>
    </div>}
      @if (indice === 2) {
        <div class="=row">
          <div class="col-md-12">
            <h2>Cargar archivos</h2>
            <ng-alert [CONTENIDO]="alerta" [CUSTOMECLASS]="infoAlert"></ng-alert>
          </div>
        </div>}
      @if(esFormaValido){
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
        }

      <app-wizard [listaPasos]="pasos"></app-wizard>
    

    <div class="row">
      @switch (indice) {
        @case (1) {
          <app-paso-uno #pasoUnoRef></app-paso-uno>
        } @case (2) {
          <app-paso-dos></app-paso-dos>
        } @case (3) {
          <app-paso-tres></app-paso-tres>
        }
      }

      <btn-continuar *ngIf="!mostrarBusqueda"
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
       
      ></btn-continuar>
    </div>
  </div>
</div>
