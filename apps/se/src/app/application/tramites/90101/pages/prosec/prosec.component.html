<div class="page">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <h1>Registro de solicitud AUTORIZACION - PROSEC productor directo.</h1>
        </div>
        @if(esFormaValido){
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
        }
        <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno #pasoUnoRef></app-paso-uno>
      }
      @case (2) {
      <app-paso-dos></app-paso-dos>
      }
      @case (3) {
      <app-paso-tres></app-paso-tres>
      }
     }
      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
        [btnGuardar]="true"
        [dePadre]="true"
      ></btn-continuar>
    </div>
  </div>
