<div class="container">
    <div class="row">
        <div class="col-md-4">
            <label class="form-label" for="contribuyentes">Registro federal de contribuyentes:</label>
            <input type="text" 
            value=""
            class="form-control" 
            id="contribuyentes"  
            placeholder="Registro federal de contribuyentes">
        </div>
    </div>
    <div class="row mb-5">
        <div class=" text-end mt-5">
            <button class="btn btn-default me-2">Eliminar Productor</button>
            <button class="btn btn-primary">Agregar Productor</button>
        </div>
    </div>
    <div class="row">
        <h6>Solicitud Prosec Productor Indirecto Tabla:</h6>
        <ng-table [commonTableHeader]="productorColumns" [commonTableBody]="productorDatos" ></ng-table>
    </div>
</div>
