<div class="container">
    <form formGroupname="sectoresYMercancias">
        <div class="row mt-5">
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="Selecciona-la-modalidad">Selecciona la modalidad</label>
                    <input type="text" 
                    value=""
                    class="form-control" 
                    id="modalidad"  
                    placeholder="Selecciona la modalidad">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <ng-titulo titulo="Consulta de domicilios"></ng-titulo>
            </div>
        </div>
        <div class="row">
            <ng-alert [CONTENIDO]="TEXTO"></ng-alert>
        </div>
        <div class="row mb-5">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="estadoSeleccionar" [label]="'Estado'" [required]="true" formControlName="Estado" name="Estado"></app-catalogo-select>
            </div>
            <div class="col-md-4"></div>
            <div class="col-md-4 text-end">
                <button type="button" class="btn btn-primary">Mostrar domicilios</button>
            </div>
        </div>
        <div class="row">
            <h6>Datos de las plantas donde se realizarán las operaciones PROSEC disponibles:</h6>
            <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX" [configuracionTabla]="plantaColumnsConfiguracion" [datos]="plantasDatos" ></app-tabla-dinamica>
        </div>
        <div class="row mb-5">
            <div class=" text-end mt-5">
                <button class="btn btn-default me-2">Eliminar plantas</button>
                <button class="btn btn-primary">Agregar plantas</button>
            </div>
        </div>
        <div class="row">
            <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX" [configuracionTabla]="plantaColumnsConfiguracion" [datos]="plantasDatos" ></app-tabla-dinamica>
        </div>
        <div class="row mb-5">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="RepresentacionFederal" [label]="'Representación federal'" [required]="true" formControlName="RepresentacionFederal" name="RepresentacionFederal" ></app-catalogo-select>
            </div>
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="ActividadProductiva" [label]="'Actividad productiva'" [required]="true" formControlName="ActividadProductiva" name="ActividadProductiva" ></app-catalogo-select>
            </div>
        </div>
    </form>

</div>
