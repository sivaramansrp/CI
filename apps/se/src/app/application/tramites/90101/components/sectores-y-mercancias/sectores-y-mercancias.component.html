<div class="container">
    <div class="row">
        <div class="form-group">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="sector" [label]="'Sector'" [required]="true" formControlName="sector" name="sector"></app-catalogo-select>
            </div>
        </div>
        <div class="row">
            <div class=" text-end mt-5">
                <button class="btn btn-default me-2">Eliminar sector</button>
                <button class="btn btn-primary">Agregar sector</button>
            </div>
        </div>
        <div class="row">
            <h6>Solicitud PROSEC sector plural:</h6>
            <ng-table [commonTableHeader]="sectorColumns" [commonTableBody]="sectorsDatos" ></ng-table>
        </div>
        <div class="row">
            <div class="col-md-12">
                <ng-titulo titulo="Mercancías a producir"></ng-titulo>
            </div>
        </div>
        <div class="row">
            <ng-alert [CONTENIDO]="TEXTO"></ng-alert>
        </div>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label" for="Fraccion_arancelaria">Fracción arancelaria:</label>
                <input type="text" 
                value=""
                class="form-control" 
                id="Fraccion_arancelaria"  
                placeholder="Fracción arancelaria">
            </div>
        </div>
        <div class="row mb-5">
            <div class=" text-end mt-5">
                <button class="btn btn-default me-2">Eliminar</button>
                <button class="btn btn-primary">Agregar</button>
            </div>
        </div>
    </div>
</div>
