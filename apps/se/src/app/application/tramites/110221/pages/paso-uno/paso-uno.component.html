<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(1)" (keydown.enter)="seleccionaTab(1)" (keydown.space)="seleccionaTab(1)" role="button" tabindex="0">Solicitante</a>
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(2)" (keydown.enter)="seleccionaTab(2)" (keydown.space)="seleccionaTab(2)" role="button" tabindex="2">Certificado de Origen</a>
      </li>
      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(3)" (keydown.enter)="seleccionaTab(3)" (keydown.space)="seleccionaTab(3)" role="button" tabindex="3">Destinatario</a>
      </li>
      <li [ngClass]="indice === 4 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(4)" (keydown.enter)="seleccionaTab(4)" (keydown.space)="seleccionaTab(4)" role="button" tabindex="4">Datos Certificado</a>
      </li>
    </ul>
    <ng-container>
      @switch (indice) 
        { @case (1) {
          <solicitante [tabindex]="1" #Solicitante></solicitante> 
        } @case (2) { 
          @if(esDatosRespuesta){
            <app-certificado-de-origen [tabIndex]="2"></app-certificado-de-origen>
          }
        } @case (3) {
          @if(esDatosRespuesta){
            <app-destinatario [tabIndex]="3"></app-destinatario>
          }
        } @case (4) { 
          @if(esDatosRespuesta){
            <app-datos-certificado [tabIndex]="4" [entidadFederativaData]="entidadFederativa"></app-datos-certificado>
          }
        }
      } 
    </ng-container>
  </div>
</div>
