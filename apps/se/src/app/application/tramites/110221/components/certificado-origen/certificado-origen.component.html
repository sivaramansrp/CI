<div class="container">
  <ng-titulo titulo="Validación inicial del certificado de circulación de mercancías" />

  <form [formGroup]="FormSolicitud">
      <div formGroupName="validacionForm">
          <div class="row">
              <div class="col-md-12">
                  <div class="form-group">
                      <label class="form-label" for="nroRegistro">¿La operación se realizó con un tercer operador?</label>
                  </div>
              </div>
          </div>
          <div class="row">
              <div class="col">
                  <div class="form-check"></div>
                  <input class="form-check-input" type="checkbox" value="" id="tercerOperador" formControlName="tercerOperador" (change)="setValoresStore(validacionForm,'tercerOperador', 'setTercerOperador')">
                  <label class="form-check-label" for="tercerOperador">Si</label>
              </div>
          </div>
      </div>
      <ng-titulo titulo="Tratado y país o bloque" />
      <div formGroupName="validacionForm">
          <div class="row">
              <div class="col-md-4">
                  <app-catalogo-select [catalogo]="tratado.catalogos" [label]="tratado.labelNombre" [placeholder]="tratado.primerOpcion" [required]="true" id="tratado" formControlName="tratado" (change)="
    setValoresStore(validacionForm, 'tratado', 'setTratado')
  "></app-catalogo-select>
              </div>
              <div class="col-md-4">
                  <app-catalogo-select [catalogo]="pais.catalogos" [label]="pais.labelNombre" [placeholder]="pais.primerOpcion" [required]="true" id="pais" formControlName="pais" (change)="setValoresStore(validacionForm, 'pais', 'setPais')"></app-catalogo-select>
              </div>
          </div>
          <div class="row mt-5">
              <div class="col-md-4">
                  <label>Fracción arancelaria:</label>
                  <input type="number" required="true" class="form-control" formControlName="fraccionArancelaria" (change)="
    setValoresStore(
      validacionForm,
      'fraccionArancelaria',
      'setFraccionArancelaria'
    )
  " />
              </div>
              <div class="col-md-4">
                  <label># Registro producto:</label>
                  <input type="text" required="true" class="form-control" formControlName="numeroRegistro" (change)="
    setValoresStore(
      validacionForm,
      'numeroRegistro',
      'setNumRegistro'
    )
  " />
              </div>
              <div class="col-md-4">
                  <label>Nombre comercial:</label>
                  <input type="text" required="true" class="form-control" formControlName="nombreComercial" (change)="
    setValoresStore(
      validacionForm,
      'nombreComercial',
      'setNomComercial'
    )
  " />
              </div>
          </div>
          <div class="row mt-3">
              <label style="margin-left: 338px">Periodo</label>
          </div>
      </div>

      <div class="row mt-5">
          <div class="col-md-4">
              <label>Fecha inicio:</label>
              <input type="date" required="true" class="form-control" formControlName="fechaInicioB" (change)="
setValoresStore(
  validacionForm,
  'fechaInicioB',
  'setFechInicioB'
)
" />
          </div>
          <div class="col-md-4">
              <label>Fecha fin:</label>
              <input type="date" required="true" class="form-control" formControlName="fechFinB" (change)="
setValoresStore(validacionForm, 'fechFinB', 'setFechFinB')
" />
          </div>
      </div>

      <div class="row w-100">
        <div class="col-12 d-flex justify-content-end mt-3 mb-4">
            <button type="button" class="btn btn-primary ms-3" (click)="buscarMercancias()">Buscar mercancías</button>
        </div>
    </div>

    <h6 class="mt-5">Mercancías disponibles</h6>
    <app-tabla-dinamica [configuracionTabla]="nicoTabla"
    [datos]="nicoTablaDatos"></app-tabla-dinamica>
    <ul class="pagination d-flex justify-content-center">
        <li class="page-item"><a class="page-link" href="#">1</a></li>
    </ul>
      
  </form>
