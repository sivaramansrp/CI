<div class="container">
  <div class="row mt-3">
    <div class="col-md-12">
      <div class="panel-group ficha-collapse" id="accordion">
        <div class="panel panel-default">
          <div
            class="panel-heading"
            (click)="mostrar_colapsable()"
            tabindex="0"
          >
            <h4 class="panel-title">
              <a aria-label="Repeat"
                ><i class="bi bi-repeat" aria-hidden="true"></i>.</a
              >
            </h4>
            <button type="button" class="collpase-button collapsed"></button>
          </div>
          @if(colapsable){
          <div class="panel-collapse collapse in" id="panel-01">
            <div class="panel-body">
              <div class="row">
                <div class="col-md-12">
                  <ng-alert [CONTENIDO]="alertMessage"></ng-alert>
                </div>
                <div class="col-md-12">
                  <label class="form-label" for="table">Solicitud</label>
                </div>
                <div class="col-md-12">
                  <app-tabla-dinamica
                    [tipoSeleccionTabla]="tipoSeleccionsoli"
                    [configuracionTabla]="configuracionColumnasoli"
                    [datos]="cuerpoTabla"
                  >
                  </app-tabla-dinamica>
                </div>
              </div>
            </div>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
  <form [formGroup]="datosMercanciaFormGroup">
    <div class="row">
      <ng-titulo [titulo]="'Datos del trámite a realizar'"></ng-titulo>
    </div>
    <div class="row" formGroupName="realizarGroup">
      <div class="col-md-8">
        <app-catalogo-select
          [catalogo]="aduanaDeIngresoList"
          formControlName="aduanaIngreso"
          [label]="'Aduana de ingreso'"
          [required]="true"
          name="aduanaIngreso"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'aduanaIngreso'
          )
        " 
        ></app-catalogo-select>
      </div>
      <div class="col-md-8">
        <app-catalogo-select
          [catalogo]="oficinaInspeccionList"
          formControlName="oficinaInspeccion"
          [label]="'Oficina de inspección de Sanidad Agropecuaria:'"
          [required]="true"
          name="oficinaInspeccion"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'oficinaInspeccion'
          )
        " 
        ></app-catalogo-select>
      </div>
      <div class="col-md-8">
        <app-catalogo-select
          [catalogo]="puntoInspeccionList"
          formControlName="puntoInspeccion"
          [label]="'Punto de inspección'"
          [required]="true"
          name="puntoInspeccion"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'puntoInspeccion'
          )
        " 
        ></app-catalogo-select>
      </div>
      <div class="col-md-4"></div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="numeroGuia">Número de guía:</label>
        <input
          class="form-control"
          id="numeroGuia"
          formControlName="numeroGuia"
          placeholder=""
          name="numeroGuia"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'numeroGuia'
          )
        " 
        />
      </div>
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="regimenList"
          formControlName="regimen"
          [label]="'Régimen'"
          [required]="true"
          name="regimen"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'regimen'
          )
        " 
        ></app-catalogo-select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <label class="form-label" for="tabel">Mercancías</label>
      </div>
      <div class="col-md-12">
        <app-tabla-dinamica
          [tipoSeleccionTabla]="tipoSeleccion"
          [configuracionTabla]="configuracionColumnas"
          [datos]="cuerpoTablaFila"
        >
        </app-tabla-dinamica>
      </div>
      <div class="col-md-12 d-flex justify-content-end">
        <div>
          <button class="btn btn-primary me-2" type="button">Modificar</button>
        </div>
        <div>
          <button class="btn btn-default me-2" type="button">Eliminar</button>
        </div>
        <div>
          <button class="btn btn-default me-2" type="button">Agregar</button>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <ng-titulo [titulo]="'Datos mercancía'"></ng-titulo>
      </div>
    </div>
    <div class="row" formGroupName="mercanciaGroup">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="tipoRequisitoList"
          formControlName="tipoRequisito"
          [label]="'Tipo de requisito'"
          [required]="true"
          name="tipoRequisito"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'tipoRequisito'
          )
        " 
        ></app-catalogo-select>
      </div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="requisito">Requisito:</label>
        <input
          class="form-control"
          id="requisito"
          formControlName="requisito"
          placeholder=""
          name="requisito"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'requisito'
          )
        " 
        />
      </div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="numeroCertificadoInternacional"
          >Número de certificado internacional *:</label
        >
        <input
          class="form-control"
          id="numeroCertificadoInternacional"
          formControlName="numeroCertificadoInternacional"
          placeholder=""
          name="numeroCertificadoInternacional"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'numeroCertificadoInternacional'
          )
        " 
        />
      </div>
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="arancelariaList"
          formControlName="fraccionArancelaria"
          [label]="'Fracción arancelaria'"
          [required]="true"
          name="fraccionArancelaria"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'fraccionArancelaria'
          )
        " 
        ></app-catalogo-select>
      </div>
      <div class="col-md-8 form-group">
        <label class="form-label" for="descripcionFraccionArancelaria"
          >Descripción de la fracción arancelaria *:</label
        >
        <input
        readonly
          class="form-control"
          id="descripcionFraccionArancelaria"
          formControlName="descripcionFraccionArancelaria"
          placeholder=""
          name="descripcionFraccionArancelaria"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'descripcionFraccionArancelaria'
          )
        " 
        />
      </div>
      <div class="col-md-4">
        <app-catalogo-select
        
          [catalogo]="nicoList"
          formControlName="nico"
          [label]="'Nico'"
          [required]="true"
          name="nico"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'nico'
          )
        " 
        ></app-catalogo-select>
      </div>
      <div class="col-md-8 form-group">
        <label class="form-label" for="descripcionFraccionArancelaria"
          >Descripción Nico*:</label
        >
        <input
        readonly
          class="form-control"
          id="descripcionNico"
          formControlName="descripcionNico"
          placeholder=""
          name="descripcionNico"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'descripcionNico'
          )
        " 
        />
      </div>
      <div class="col-md-12">
        <label for="descripcion">Descripción:</label>
        <textarea
          class="form-control"
          name="descripcion"
          id="descripcion"
          rows="10"
          formControlName="descripcion"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'descripcion'
          )
        " 
        ></textarea>
      </div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="cantidadUMT">Cantidad UMT*:</label>
        <input
          class="form-control"
          id="cantidadUMT"
          formControlName="cantidadUMT"
          placeholder=""
          name="cantidadUMT"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'cantidadUMT'
          )
        " 
        />
      </div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="umt">UMT*:</label>
        <input
        readonly
          class="form-control"
          id="umt"
          formControlName="umt"
          placeholder=""
          name="umt"
          type="text"
          disable="true"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'umt'
          )
        " 
        />
      </div>
      <div class="col-md-4"></div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="cantidadUMC">Cantidad UMC*:</label>
        <input
          class="form-control"
          id="cantidadUMC"
          formControlName="cantidadUMC"
          placeholder=""
          name="cantidadUMC"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'cantidadUMC'
          )
        " 
        />
      </div>
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="nicoList"
          formControlName="umc"
          [label]="'UMC'"
          [required]="true"
          name="umc" 
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'umc'
          )
        " 
          
        ></app-catalogo-select>
      </div>
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="usoList"
          formControlName="uso"
          [label]="'Uso'"
          [required]="true"
          name="uso"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'uso'
          )
        " 
        ></app-catalogo-select>
      </div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="numeroDeLote">Número de lote*:</label>
        <input
          class="form-control"
          id="numeroDeLote"
          formControlName="numeroDeLote"
          placeholder=""
          name="numeroDeLote"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'numeroDeLote'
          )
        " 
        />
      </div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="faseDeDesarrollo"
          >Fase de desarrollo*:</label
        >
        <input
          class="form-control"
          id="faseDeDesarrollo"
          formControlName="faseDeDesarrollo"
          placeholder=""
          name="faseDeDesarrollo"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'faseDeDesarrollo'
          )
        " 
        />
      </div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="especie">Especie*:</label>
        <input
          class="form-control"
          id="especie"
          formControlName="especie"
          placeholder=""
          name="especie"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'especie'
          )
        " 
        />
      </div>
      <div class="col-md-8">
        <app-catalogo-select
          [catalogo]="paisDeOrigenList"
          formControlName="paisDeOrigen"
          [label]="'País de origen'"
          [required]="true"
          name="paisDeOrigen"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'paisDeOrigen'
          )
        " 
        ></app-catalogo-select>
      </div>
      <div class="col-md-8">
        <app-catalogo-select
          [catalogo]="paisDeProcedenciaList"
          formControlName="paisDeProcedencia"
          [label]="'País de procedencia'"
          [required]="true"
          name="paisDeProcedencia"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'paisDeProcedencia'
          )
        " 
        ></app-catalogo-select>
      </div>
    </div>
    <div class="row">
      <ng-titulo [titulo]="'Detalle'"></ng-titulo>
    </div>
    <div class="row" formGroupName="detalles">
      <div class="col-md-8 form-group">
        <label class="form-label" for="especie">Nombre científico:</label>
        <input
          class="form-control"
          id="nombreCientifico"
          formControlName="nombreCientifico"
          placeholder=""
          name="nombreCientifico"
          type="text"
          (change)="
          setValoresStore(
            datosMercanciaFormGroup,
            'nombreCientifico'
          )
        " 
        />
      </div>
    </div>
    <div class="row">
      <div class="col-md-12 mt-2 d-flex justify-content-end">
        <div>
          <button class="btn btn-primary me-2" type="button">
            Eliminar detalle
          </button>
        </div>
        <div>
          <button class="btn btn-default" type="button">Agregar detalle</button>
        </div>
      </div>
      <div class="col-md-12">
        <label class="form-label" for="especie">Detalle:</label>
      </div>
      <div class="col-md-4">
        <ng-table
          [commonTableHeader]="detalleTable"
          [commonTableBody]="detallecuerpoTabla"
          [enableScrollbar]="myScrollbarValue"
        ></ng-table>
      </div>
    </div>
  </form>
</div>
