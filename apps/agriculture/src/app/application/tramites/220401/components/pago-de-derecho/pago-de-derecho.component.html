<div class="container form-container">
    <ng-titulo titulo="Pago de derechos" />
    <div>
      <form [formGroup]="FormSolicitud" (ngSubmit)="validarFormulario()">
        
        <ng-container formGroupName="datosImportadorExportador">
          <div>
            <label for="exentoDePago">Exento de pago*:</label>
            <div class="radio-container">
              <div class="radio-option">
                <input type="radio" id="no" formControlName="exentoDePago" value="No">
                <label for="no">No</label>
              </div>
              <div class="radio-option">
                <input type="radio" id="yes" formControlName="exentoDePago" value="Yes">
                <label for="yes">Si</label>
              </div>
             
            </div>
          </div>
          
  
          <!-- Select Dropdown -->
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
               

                <app-catalogo-select [catalogo]="Justificacion" formControlName="Justificacion" [label]="'Justificación*:'"
                [required]="true" name="Justificacion"  (change)="JustificacionSeleccion()" ></app-catalogo-select>
              </div>
            </div>
          </div>
  
          <!-- Clave de referencia, Cadena de la dependencia, Banco, etc. -->
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="rfcImportExport">Clave de referencia:</label>
                <input class="form-control" id="rfcImportExport" formControlName="rfcImportExport"  type="text">
              </div>
            </div>
  
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="cadenaDependencia">Cadena de la dependencia*:</label>
                <input class="form-control" id="cadenaDependencia" formControlName="cadenaDependencia"  type="text" appUppercase>
              </div>
            </div>
  
            <div class="col-md-4">
              <div class="form-group">
                
                <app-catalogo-select [catalogo]="Banco" formControlName="Banco" [label]="'Banco*:'"
                [required]="true" name="Banco"  (change)="BancoSeleccion()" ></app-catalogo-select>
               
             
             
              </div>
            </div>
           
          </div>
  
          <!-- Llave de pago, Fecha de pago, Importe de pago -->
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="llaveDePago">Llave de pago*:</label>
                <input class="form-control" id="llaveDePago" formControlName="llaveDePago"  type="text">
              </div>
            </div>
  
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="fechaPago">Fecha de pago*:</label>
                <input class="form-control" id="fechaPago" formControlName="fechaPago"  type="date">
                
              </div>
            </div>
  
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="importePago">Importe de pago*:</label>
                <input class="form-control" id="importePago" formControlName="importePago"  type="text" appUppercase>
              </div>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-md-12 text-right">
              <div class="form-group">
                <button type="button" class="btn btn-outline-warning custom-button">Borrar datos del pago</button>
              </div>
            </div>
          </div>
  
        </ng-container>
  
       
  
       
      </form>
    </div>
  </div>
