<div class="container">
  <ng-titulo titulo="Transporte" />

  <form [formGroup]="transporteForm" (ngSubmit)="validarTransporteFormulario()">
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <select-catalogos
            [catalogosDatos]="tiposDocumentos"
          ></select-catalogos>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="identificationDelTransporte"
            >Identificación del transporte:</label
          >
          <input
            class="form-control"
            id="identificationDelTransporte"
            formControlName="identificationDelTransporte"
            placeholder=""
            type="text"
          />
        </div>
      </div>
    </div>

    <div class="row mt-5 mb-2">
      <div class="col-md-8">
        <p>* Campos obligatorios</p>
      </div>
      <div class="col-md-4">
        <div class="btn-group">
          <button class="btn btn-primary me-2" type="button">Guardar</button>
          <button class="btn btn-danger" type="button">Continuar</button>
        </div>
      </div>
    </div>
  </form>
</div>
