<div class="container">
  <form [formGroup]="pagosDerechosForm">
    <div class="row mt-5">
      <ng-titulo titulo="Pago de derechos" />
      <div class="row">
        <div class="col-md-12 mt-5">
          <label for="exentoDePago"
            >Exento de pago:</label
          >
        </div>

        <div class="col-md-12">
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="exentoDePago"
              id="SiSolicitudFerros"
              value="1"
              formControlName="exentoDePago"
            />
            <label class="form-check-label" for="SiSolicitudFerros">Sí</label>
          </div>
        </div>

        <div class="col-md-12 mb-4">
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="exentoDePago"
              id="NoSolicitudFerros"
              value="0"
              formControlName="exentoDePago"
            />
            <label class="form-check-label" for="NoSolicitudFerros">No</label>
          </div>
        </div>

      </div>
      
      <div class="col-md-4 form-group">
        <label class="form-label" for="claveDeReferencia"
          >Clave de referencia*:</label
        >
        <input
          type="text"
          id="claveDeReferencia"
          class="form-control"
          formControlName="claveDeReferencia"
        />
      </div>

      <div class="col-md-4 form-group">
        <label class="form-label" for="cadenaDependencia"
          >Cadena de la dependencia*:</label
        >
        <input
          type="text"
          id="cadenaDependencia"
          class="form-control"
          formControlName="cadenaDependencia"
        />
      </div>

      <div class="col-md-4 form-group">
        <label class="form-label" for="banco">Banco:</label>
        <input
          type="text"
          id="banco"
          class="form-control"
          formControlName="banco"
        />
      </div>

      <div class="col-md-4 form-group">
        <label class="form-label" for="llaveDePago">Llave de pago*:</label>
        <input
          type="text"
          id="llaveDePago"
          class="form-control"
          formControlName="llaveDePago"
        />
      </div>

      <div class="col-md-4 form-group">
        <label class="form-label" for="fechaInicio">Fecha de pago:</label>
        <input
          type="text"
          id="fechaInicio"
          class="form-control"
          formControlName="fechaInicio"
        />
      </div>

      <div class="col-md-4 form-group">
        <label class="form-label" for="importeDePago">Importe de pago*:</label>
        <input
          type="text"
          id="importeDePago"
          class="form-control"
          formControlName="importeDePago"
        />
      </div>
    </div>
  </form>
</div>
