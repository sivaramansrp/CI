<div class="container">
  <form [formGroup]="pagoForm">
    <div class="row">
      <ng-titulo titulo="Pago de derechos" />
      <div class="row mt-2">
        <div class="col-md-12">
          <label for="certficacion_a">Exento de pago</label>
        </div>
        <div class="col-md-4">
          <input
            class="form-check-input me-3"
            type="radio"
            name="certficacion"
            value="a"
            id="certficacion_a"
          />
          <label class="form-label" for="certficacion_a">No</label>
        </div>
        <div class="col-md-12">
          <input
            class="form-check-input me-3"
            type="radio"
            name="certficacion"
            value="aa"
            id="certficacion_aa"
          />
          <label class="form-label" for="certficacion_aa">Sí</label>
        </div>
      </div>
      <div class="row">
        <div class="col-md-8">
          <app-catalogo-select
            [catalogo]="justificacion.catalogos"
            [label]="justificacion.labelNombre"
            [placeholder]="justificacion.primerOpcion"
            [isDisabled]="true"
            (selectionChange)="selectJustificacionCatalogo($event)"
          ></app-catalogo-select>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="nombreImportExport"
              >Clave de referencia:</label
            >
            <input
              class="form-control"
              id="nombreImportExport"
              placeholder=""
              type="text"
              value="454000554"
              formControlName="claveReferencia"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="nombreImportExport"
              >Cadena de dependencia:</label
            >
            <input
              class="form-control"
              id="nombreImportExport"
              placeholder=""
              type="text"
              value="0003008010CEZI"
              readonly
              required
              formControlName="cadenaDependencia"
            />
          </div>
        </div>
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="banco.catalogos"
            [label]="banco.labelNombre"
            [placeholder]="banco.primerOpcion"
            [isDisabled]="true"
            (selectionChange)="selectBancoCatalogo($event)"
          ></app-catalogo-select>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="nombreImportExport"
              >Llave de pago:</label
            >
            <input
              class="form-control"
              id="nombreImportExport"
              placeholder=""
              type="text"
              appUppercase
              formControlName="llavePago"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="nombreImportExport"
              >Fecha de pago:</label
            >
            <input
              class="form-control"
              id="nombreImportExport"
              placeholder=""
              type="text"
              appUppercase
              formControlName="fetchapago"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="nombreImportExport"
              >Importe de pago:</label
            >
            <input
              class="form-control"
              id="nombreImportExport"
              placeholder=""
              type="text"
              formControlName="importePago"
            />
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
