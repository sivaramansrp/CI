<form [formGroup]="medioTransporteForm">
    <ng-titulo titulo="Medio de transporte" />
    <div class="row">
        <div class="col-md-4">
            <app-catalogo-select id="transporteIdMedio" [catalogo]="medioDeTransporte" formControlName="medioDeTransporte"
                [label]="'Medio de transporte'" [required]="true"
                name="medioDeTransporte" (selectionChange)="medioDeTransporteSeleccion($event)"></app-catalogo-select>
        </div>
        <div class="col-md-4">
            <label for="identificacionTransporte" class="form-label">Identificación del transporte:</label>
            <input class="form-control" type="text" size="30" formControlName="identificacionTransporte"
                id="identificacionTransporte" (input)="getIdentificacionTransporte()" />
        </div>
    </div>
    <div class="row mt-5">
        <div class="col-md-12">
            <label for="esSolicitudFerros">¿La solicitud de Inspección Física es para trámites que arriban
                por
                Ferrocarril o por Partes II?*:</label>

                <app-input-radio
                [radioOptions]="opcionDeBotonDeRadio"
                [isRequired]="true"
                [selectedValue]="esSolicitudFerrosValor"
                [layout]="'vertical'"
                formControlName="esSolicitudFerros"
                (valueChange)="estableceSeleccionSolicitudFerro($event)"
              ></app-input-radio>
        </div>
    </div>
    @if (esSolicitudFerrosValor === '1') {
    <ng-alert [CONTENIDO]="TEXTOS.SECCION_LEYENDA_CONFIRMAR_TEXTOS"></ng-alert>
    }

    <h6>Datos de la mercancía:</h6>

    <ng-table [commonTableHeader]="mercanciaHeaderData" [commonTableBody]="mercanciaBodyData"></ng-table>

    @if (esSolicitudFerrosValor === '1') {
    <div class="row">
        <div class="text-end">
            <button name="modificarSaldoMercancia" id="btnSaldoMercancia" class="btn btn-primary"
                (click)="modificarSaldosMercancia()">Modificar</button>
        </div>
    </div>

    @if (mostrarAgregarMercancia) {
    <app-agregar-mercancia [mercanciasDatos]="mercanciaBodyData"
        (cancelarEvento)="obtenerAgregarMercanciaEvent($event)"></app-agregar-mercancia>
    }
    }

    @if(esSolicitudFerrosValor !== '1') {
    <div class="row">
        <div class="col-md-4">
            <label for="totalGuia" class="form-label">Total de guías amparadas:<span class="bi bi-question-circle-fill"
                    title="" data-bs-toggle="tooltip"></span></label>
            <input class="form-control" type="text" formControlName="totalGuias" id="totalGuia" (input)="getTotalGuiasAmparadas()" />
        </div>
    </div>
    }
</form>
