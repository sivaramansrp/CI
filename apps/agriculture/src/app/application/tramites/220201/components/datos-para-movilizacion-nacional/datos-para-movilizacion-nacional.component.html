<div class="container">
    <form [formGroup]="movilizacionForm">
      <ng-titulo titulo="Destino" />
      <div class="row">
        <div class="col-md-4 form-group">
          <label class="form-label" for="coordenadas"
            >Coordenadas geográficas:</label
          >
          <input
            class="form-control"
            id="coordenadas"
            formControlName="coordenadas"
            placeholder=""
            type="text"
               (change)="setValoresStore()"
          />
        </div>
      </div>
      <ng-titulo titulo="Medio de transporte" />
      <div class="row">
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="medioTransporteList"
            formControlName="medio"
            [label]="'Medio de transporte'"
            [required]="true"
            name="medio"
               (change)="setValoresStore()"
          ></app-catalogo-select>
        </div>
        <div class="col-md-4 form-group">
          <label class="form-label" for="coordenadas"
            >Identificación del transporte:</label
          >
          <input
            class="form-control"
            id="transporte"
            formControlName="transporte"
            placeholder=""
            type="text"
               (change)="setValoresStore()"
          />
        </div>
        <div class="col-md-8">
          <app-catalogo-select
            [catalogo]="puntoDeVerificacionFederal"
            formControlName="punto"
            [label]="'Punto de verificación federal'"
            [required]="false"
            name="punto"
               (change)="setValoresStore()"
          ></app-catalogo-select>
        </div>
        <div class="col-md-8">
          <app-catalogo-select
            [catalogo]="nombreDeLaEmpresaTransportista"
            formControlName="nombre"
            [label]="'Nombre de la empresa transportista'"
            [required]="true"
            name="nombre"
               (change)="setValoresStore()"
          ></app-catalogo-select>
        </div>
      </div>
    </form>
  </div>
