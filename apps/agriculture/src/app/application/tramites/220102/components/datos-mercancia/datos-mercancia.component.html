    </div>

<div class="col-md-12">

</div>        
    </div>
    <div class="row">

      </div>

        <app-tabla-dinamica
        [tipoSeleccionTabla]="tipoSeleccionsoli"

      >

    <div class="row">

<form [formGroup]="formMercancia">
<div  *ngIf ="estadoChecker">
    <div class="row">
        <div class="col-md-12">        
            <ng-titulo titulo="Datos mercancia" />
        </div>
    </div>
    <div class="row">
                <div class="col-md-6">
                    <app-catalogo-select
                      [catalogo]="nombreComunCatalogo"
                      formControlName="nombreComun"
                      [label]="'Nombre común'"
                      [required]="true"
                      name="nombreComun"
                    ></app-catalogo-select>
                  </div>
                  <div class="col-md-6">
                    <app-catalogo-select
                      [catalogo]="nombreComunCatalogo"
                      formControlName="nombreCientifico"
                      [label]="'Nombre científico'"
                      [required]="true"
                      name="nombreCientifico"
                    ></app-catalogo-select>
                  </div>
     </div>
     <div class="row">
        <div class="col-md-6">
            <app-catalogo-select
            [catalogo]="usoCatalog"
            formControlName="uso"
            [label]="'Uso'"
            [required]="true"
            name="uso"
          ></app-catalogo-select>
        </div>
     </div>
     <div class="row">
        <div class="col-md-6">
            <app-catalogo-select
            [catalogo]="usoCatalog"
            formControlName="paisOrigen"
            [label]="'País de origen'"
            [required]="true"
            name="paisOrigen"
          ></app-catalogo-select>
        </div>
     </div>


</div>
</form>
