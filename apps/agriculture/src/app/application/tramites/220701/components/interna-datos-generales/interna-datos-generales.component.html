<div class="container">
    <form [formGroup]="forma">
      <div class="row mt-5">
        <ng-titulo titulo="Número de folio del trámite"></ng-titulo>
              <div class="col-md-12 p-0">
                  <div class="col-md-8 p-0">
                      <div class="form-group">
                          <label for="fileDelTramite">Filo del trámite:</label>
                          <input
                          formControlName="folioControlUnico"
                          value="1502200200120240301000015"
                          class="form-control"
                          id="folioControlUnico"
                          placeholder=""
                          readonly
                          type="text"
                          appUppercase
                        />
                      </div>
                  </div>
              </div>
              <div class="row" formGroupName="datosDelaSolicitud">
                  <ng-titulo titulo="Datos del trámite a realizar"></ng-titulo>
                    <div class="row">
                        <div class="col-md-4">
                            <app-catalogo-select
                              [catalogo]="aduanaDeIngreso"
                              formControlName="aduanaIngreso"
                              [label]="'Aduana de ingreso'"
                              [required]="true"
                              name="aduanaIngreso"
                            ></app-catalogo-select>
                          </div>
                          <div class="col-md-8">
                            <app-catalogo-select
                              [catalogo]="sanidadAgropecuaria"
                              formControlName="oficinaInspeccion"
                              [label]="'Oficina de inspección de sanidad Agropecuaria'"
                              [required]="true"
                              name="oficinaInspeccion"
                            ></app-catalogo-select>
                          </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <app-catalogo-select
                              [catalogo]="puntoInspeccion"
                              formControlName="puntoInspeccion"
                              [label]="'Punto de inspección'"
                              [required]="true"
                              name="puntoInspeccion"
                            ></app-catalogo-select>
                          </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                              <label class="form-label" for="claveControlUnico"
                                >Clave UCON*:
                                <i
                                  class="bi bi-question-circle-fill"
                                  style="margin-bottom: '5px'"
                                ></i
                              ></label>
                              <input
                                formControlName="claveControlUnico"
                                value=""
                                class="form-control"
                                id="claveControlUnico"
                                placeholder=""
                                type="text"
                                appUppercase
                                [required]="true"
                              />
                            </div>
                          </div>
                          <div class="col-md-4">
                            <app-catalogo-select
                              [catalogo]="establecimientoTIF"
                              formControlName="establecimientoTIFs"
                              [label]="'Establecimiento TIF'"
                              [required]="false"
                              name="establecimientoTIFs"
                            ></app-catalogo-select>
                          </div>
                          <div class="col-md-4">
                            <app-catalogo-select
                              [catalogo]="veterinario"
                              formControlName="nombreVeterinario"
                              [label]="'Nombre del médico veterinario'"
                              [required]="false"
                              name="nombreVeterinario"
                            ></app-catalogo-select>
                          </div>  
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                              <label class="form-label" for="numeroGuia">Número de guia</label>
                              <input
                                class="form-control"
                                id="numeroGuia"
                                placeholder=""
                                type="text"
                                formControlName="numeroGuia"
                                appUppercase
                              />
                            </div>
                          </div>
                          <div class="col-md-8">
                            <app-catalogo-select
                              [catalogo]="regimen"
                              formControlName="regimen"
                              [label]="'Régimen'"
                              [required]="true"
                              name="regimen"
                            ></app-catalogo-select>
                          </div>
                    </div>
                    <div class="row">
                      <ng-titulo titulo="Tipo de Mercancía" />
                      <div class="col-md-12">
                        <label for="capturaMercancia">Captura de datos de mercancía*:</label>
                      </div>
                      <div class="col-md-12">
                        <input
                          class="form-check-input me-3"
                          type="radio"
                          name="capturaMercancia"
                          formControlName="capturaMercancia"
                          [required]="true"
                          value="a"
                          id="certficacion_a"
                        />
                        <label class="form-label" for="animalesVivos">Animales Vivos:</label>
                      </div>
                      <div class="col-md-12">
                        <input
                          class="form-check-input me-3"
                          type="radio"
                          name="animalesVivos"
                          formControlName="animalesVivos"
                          value="aa"
                          id="certficacion_aa"
                        />
                        <label class="form-label" for="animalesVivos"
                          >Productos Subproductos</label
                        >
                      </div>
                    </div>
                    <div class="row">
                      <div class="row mt-5">
                        <div class="col-md-12">
                          <label for="mercancia">Mercancía</label>
                        </div>
                        <div class="col-md-12 mt-5">
                          <div class="table-container">
                              <app-tabla-dinamica *ngIf="mercanciaTablaDatos.length > 0" [configuracionTabla]="mercanciaTabla" [datos]="mercanciaTablaDatos"></app-tabla-dinamica>
                          </div>
                        </div>
                      </div>
                      <div class="container">
                        <form [formGroup]="movilizacionForm">
                          <ng-titulo titulo="Destino" />
                          <div class="row">
                            <div class="col-md-7 form-group">
                              <label class="form-label" for="coordenadas"
                                >Coordenadas geográficas:</label
                              >
                              <input
                                class="form-control"
                                id="coordenadas"
                                readonly
                                formControlName="coordenadas"
                                placeholder=""
                                type="text"
                              />
                            </div>
                          </div>
                          <ng-titulo titulo="Medio de transporte" />
                          <div class="row">
                            <div class="col-md-4">
                              <app-catalogo-select
                                [catalogo]="movilizacionNacional.catalogos"
                                [label]="movilizacionNacional.labelNombre"
                                [placeholder]="movilizacionNacional.primerOpcion"
                                [isDisabled]="false"
                                formControlName="movilizacionNacional"
                              ></app-catalogo-select>
                            </div>
                            <div class="col-md-8 form-group">
                              <label class="form-label" for="identificacionTransporte"
                                >Identificación del transporte:</label
                              >
                              <input
                                class="form-control"
                                id="identificacionTransporte"
                                readonly
                                placeholder=""
                                type="text"
                                formControlName="identTransporte"
                              />
                            </div>
                            <div class="col-md-4">
                              <app-catalogo-select
                                [catalogo]="puntoVerificacion.catalogos"
                                [label]="puntoVerificacion.labelNombre"
                                [placeholder]="puntoVerificacion.primerOpcion"
                                [isDisabled]="false"
                                formControlName="puntoVerificacion"
                              ></app-catalogo-select>
                            </div>
                            <div class="col-md-8">
                              <app-catalogo-select
                                [catalogo]="empresaTransportista.catalogos"
                                [label]="empresaTransportista.labelNombre"
                                [placeholder]="empresaTransportista.primerOpcion"
                                [isDisabled]="true"
                                formControlName="empresaTransportista"
                              ></app-catalogo-select>
                            </div>
                          </div>
                        </form>
                      </div>
                      <div class="row my-5">
                        <div class="col-md-12 d-flex justify-content-end"></div>
                      </div>
                    </div>
              </div>
      </div>
    </form>
  </div>
