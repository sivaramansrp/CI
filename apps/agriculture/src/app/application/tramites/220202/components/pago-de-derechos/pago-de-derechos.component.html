<div class="container">
  <form [formGroup]="pagoForm">
    <div class="row">
      <ng-titulo titulo="Pago de derechos"></ng-titulo>
      <div class="row mt-2">
        <div class="col-md-12">
          <label for="paymentExempt">Exento de pago</label>
        </div>
        <div class="col-md-4"></div>
      </div>

      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="justificacionSelector"
          formControlName="justificacion"
          [label]="'Justificación'"
          [required]="true"
          name="justificacionSelect"
          (change)="
          setValoresStore(
            pagoForm,
            'justificacion'
          ) "
        ></app-catalogo-select>
      </div>
      <div class="col-md-8"></div>

      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="referenceKey"
            >Clave de referencia*</label
          >
          <input
            class="form-control"
            id="referenceKey"
            placeholder=""
            type="text"
            [disabled]="true"
            name="claveReferencia"
            formControlName="claveReferencia"
            (change)="
            setValoresStore(
              pagoForm,
              'claveReferencia'
            ) "
          />
        </div>
      </div>

      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="dependencyChain"
            >Cadena de la dependencia*</label
          >
          <input
            class="form-control"
            id="dependencyChain"
            placeholder=""
            type="text"
            appUppercase
            [disabled]="true"
            name="cadenaDependencia"
            formControlName="cadenaDependencia"
            (change)="
            setValoresStore(
              pagoForm,
              'cadenaDependencia'
            )"
          />
        </div>
      </div>

      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="bancoSelector"
          formControlName="banco"
          [label]="'Banco'"
          [required]="true"
          [isDisabled]="true"
          name="bankSelect"
          (change)="
          setValoresStore(
            pagoForm,
            'banco'
          )"
        ></app-catalogo-select>
      </div>

      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="paymentKey">Llave de pago</label>
          <input
            class="form-control"
            id="llavePago"
            placeholder=""
            type="text"
            appUppercase
            [disabled]="true"
            name="llavePago"
            formControlName="llavePago"
            (change)="
          setValoresStore(
            pagoForm,
            'llavePago'
          )"
          />
        </div>
      </div>

      <div class="col-md-4">
        <div class="form-group">
          <input-fecha [datos]="fechaInicioInput"   formControlName="fechaInicioInput"   (change)="
          setValoresStore(
            pagoForm,
            'fechaInicioInput'
          )"></input-fecha>
        </div>
      </div>

      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="importePago"
            >Importe de pago*:</label
          >
          <input
            class="form-control"
            id="importePago"
            placeholder=""
            type="text"
            [disabled]="true"
            name="importePago"
            formControlName="importePago"
            (change)="
          setValoresStore(
            pagoForm,
            'importePago'
          )"
          />
        </div>
      </div>
    </div>
  </form>
  <div class="col-md-12 d-flex justify-content-end mt-5">
    <button class="btn btn-primary" type="button">Borrar datos del pago</button>
  </div>
</div>
