<div class="page">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <h1>Aviso de transferencia de mercancías de empresas con programa IMMEX a terceros registrados para operar en su programa, para llevar a cabo procesos de submanufactura (Regla 4.3.7.)</h1>
        </div>
  
        <app-wizard [listaPasos]="pasos"></app-wizard>
      </div>
  
      <div class="row">
        @switch (indice) {
          @case (1) {
            <app-paso-uno></app-paso-uno>
          } @case (2) {
            <app-paso-dos></app-paso-dos>
          } @case (3) {
            <app-paso-tres></app-paso-tres>
          }
        }
  
        <btn-continuar
          [datos]="datosPasos"
          (continuarEvento)="getValorIndice($event)"
        ></btn-continuar>
          @if(indice ===1){
            <ng-alert [CONTENIDO]="AVISO.Aviso"></ng-alert>
          }
      </div>
    </div>
  </div>
