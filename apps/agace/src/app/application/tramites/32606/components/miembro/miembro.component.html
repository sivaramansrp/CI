<form [formGroup]="miembroForm">
    <div class="col-md-12">
        <ng-titulo titulo="Agregar miembro de la empresa" />
    </div>
    <div class="col-md-12 mt-4">
        <label class="form-label text-start"><span style="color: red;">*</span> Señale si los socios, accionistas, según
            corresponda, representante
            legal con facultad para actos de dominio e integrantes de la
            administración de conformidad con la constitución de la empresa
            solicitante, se encuentran al corriente en el cumplimiento de sus
            obligaciones fiscales.</label>
        <app-input-radio [radioOptions]="radioOpcions08" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
            formControlName="tipoRadio08"></app-input-radio>
    </div>

    <div class="col-md-12">
        <ng-titulo titulo="Miembro de la empresa" />
    </div>
    <div class="row mt-12">
        <div class="col-md-12">
            <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
                [configuracionTabla]="empresaTabla"></app-tabla-dinamica>
        </div>
    </div>
    <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
        <div class="btn-group">
            <button type="button" class="btn btn-primary"> Agregar </button>
            <button type="button" class="btn btn-default ms-3"> Modificar </button>
            <button type="button" class="btn btn-danger 3 ms-3"> Eliminar </button>
        </div>
    </div>

    <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Manifieste si sus socios o accionistas, según corresponda,
            representantes legales con facultad para actos de dominio e
            integrantes de la administración, no se encuentren vinculados con
            alguna empresa a la que se le hubiere cancelado su Registro en el
            Esquema de Certificación de Empresas, de conformidad con la regla
            7.2.4., apartado A, fracciones V, VI y VII y apartado B, fracciones
            II, y III y V y/o de la regla 7.2.5., fracciones VI, VII y XI.</label>
    <app-input-radio [radioOptions]="radioOpcions08" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio08"></app-input-radio>
  </div>
  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Una vez manifestado lo anterior, se solicita al SAT, a
            través de AGACE, que realice las inspecciones a que hace referencia
            la fracción IX de la regla 7.1.1, a las instalaciones señaladas en
            las que se realizan las operaciones de comercio exterior con el
            propósito de verificar la información plasmada en la presente
            solicitud del Registro en el Esquema Integral de Certificación.</label>
    <app-input-radio [radioOptions]="radioOpcions08" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio08"></app-input-radio>
  </div>
  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Bajo protesta de decir verdad, manifiesto que los datos
            asentados en el presente documento son ciertos y que las facultades
            que me fueron otorgadas para representar al solicitante no me han
            sido modificadas y/ o revocadas..</label>
    <app-input-radio [radioOptions]="radioOpcions08" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio08"></app-input-radio>
  </div>
</form>
