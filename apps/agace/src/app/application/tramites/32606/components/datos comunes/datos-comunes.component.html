<form [formGroup]="datosComunesForm">
  <div class="col-md-12">
    <label class="form-label text-start">Señale el sector productivo o servicio al que pertenece</label>
  </div>
  <div class="col-md-6">
    <app-catalogo-select [catalogo]="sectorProductivo.catalogos" [label]="'Sector Productivo'"
      formControlName="sectorProductivo"></app-catalogo-select>
  </div>
  <div class="col-md-6">
    <app-catalogo-select [catalogo]="servicioCatalogo.catalogos" [label]="'Servicio'"
      formControlName="servicio"></app-catalogo-select>
  </div>

  <div class="col-md-12 mt-5">
    <div class="alert alert-info">
      <div class="form-check">
        <b> Nota:</b> Si no encuadra en los sectores o los servicios de los
        catálogos, deberá seleccionar el más cercano a sus actividades.
      </div>
    </div>
  </div>
  <!-- 2nd section -->
  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Señale si al momento de ingresar su
      solicitud si se encuentra al
      corriente en el cumplimiento de sus obligaciones fiscales y aduaneras</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio01"></app-input-radio>
  </div>

  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Indique si autorizó al S A T hacer pública
      su opinión positiva sobre el cumplimiento de obligaciones fiscales</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio02"></app-input-radio>
  </div>

  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Señale si cuenta con empleados propios para
      realizar el proceso productivo o la prestación de servicios, registrado ante el I M S S</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio03"></app-input-radio>
  </div>
  <!-- on radio select condition -->
  <div class="col-md-12 mt-4" *ngIf="datosComunesForm.get('tipoRadio03')?.value === 'si'">
    <label class="form-label text-start">Cual es el número de empleados propios con los que contó en el último
      bimestre anterior a su solicitud</label>
    <div class="col-md-3"></div>
    <div class="col-md-3">
      <label class="form-label">Número de empleados</label>
      <input type="text" formControlName="numeroEmpleados" />
    </div>
    <div class="col-md-3">
      <app-catalogo-select [catalogo]="biomestreCatalogo.catalogos" [label]="'Biomestre'"
        formControlName="biomestre"></app-catalogo-select>
    </div>
    <div class="text-danger mt-1"
      *ngIf="datosComunesForm.get('biomestre')?.invalid && datosComunesForm.get('biomestre')?.touched && datosComunesForm.get('numeroEmpleados')?.value && datosComunesForm.get('numeroEmpleados')?.touched">
      <small>Se debe agregar los datos del número de empleados propios del último bimestre.</small>
    </div>
    <div class="col-md-3"></div>
  </div>

  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Cumple con la obligación de retener y
      enterar el I S R de los trabajadores</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio04"></app-input-radio>
  </div>

  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Acredita realizar el pago de cuotas obrero
      patronales</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio05"></app-input-radio>
  </div>

  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Señale si al momento de ingresar su
      solicitud la empresa solicitante cuenta con subcontratación de servicios especializados o de ejecución de obras
      especializadas</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio06"></app-input-radio>
  </div>

  <!-- 3rd section -->

  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Señale si al momento de ingresar su
      solicitud se encuentra en el listado de empresas publicadas por el SAT en términos del artículo 69, con excepción
      de lo dispuesto en la fracción VI.</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio04"></app-input-radio>
  </div>

  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Del mismo modo indique si al momento de
      ingresar su solicitud se encuentra en el listado de empresas publicadas por el SAT en términos del artículo 69-B,
      cuarto párrafo del CFF.</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio05"></app-input-radio>
  </div>

  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Señale si se encuentra en el listado de
      empresas publicadas por el SAT en términos del artículo 69-B Bis noveno párrafo del CFF.</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio06"></app-input-radio>
  </div>
  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> Señale si sus certificados de sellos
      digitales están vigentes.</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio04"></app-input-radio>
  </div>

  <div class="col-md-12 mt-4">
    <label class="form-label text-start"><span style="color: red;">*</span> En caso afirmativo señale si se infringió
      alguno de los supuestos previstos en el artículo 17-H Bis del CFF, durante los últimos doce meses.</label>
    <app-input-radio [radioOptions]="radioOpcions01" [isRequired]="true" [layout]="'horizontal'" [gap]="'445px'"
      formControlName="tipoRadio05"></app-input-radio>
  </div>

</form>
<app-domicillio></app-domicillio>
<app-querella></app-querella>
<app-miembro></app-miembro>
