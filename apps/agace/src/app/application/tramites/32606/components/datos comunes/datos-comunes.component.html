  <div class="col-md-12">
        <label class="form-label text-start">Señale el sector productivo o servicio al que pertenece</label>
      </div>
      <div class="col-md-6">
        <app-catalogo-select [catalogo]="sectorProductivo.catalogos"
        [label]="'Sector Productivo'" formControlName="sectorProductivo"></app-catalogo-select>
      </div>
      <div class="col-md-6">
        <app-catalogo-select [catalogo]="servicioCatalogo.catalogos"
        [label]="'Servicio'" formControlName="servicio"></app-catalogo-select>
      </div>

      <div class="col-md-12 mt-5">
        <div class="alert alert-info">
          <div class="form-check">
            <b> Nota:</b> Si no encuadra en los sectores o los servicios de los
            catálogos, deberá seleccionar el más cercano a sus actividades.
          </div>
        </div>
      </div>
