<div class="container">
  <form [formGroup]="miFormulario" (ngSubmit)="aiEnviar()">
    <div class="row">
      <div class="col-md-12 mb-4">
        <label for="modalidadCertificacion"
          >Modalidad de la certificación
        </label>
        <input
          type="text"
          id="modalidadCertificacion"
          formControlName="modalidadCertificacion"
          class="form-control"
        />
      </div>
    </div>
    <ng-alert
      [CONTENIDO]="'Debe seleccionar por lo menos un tipo de aviso'"
    ></ng-alert>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        formControlName="foreignClientsSuppliers"
      
      />
      <label class="form-check-label">
        DAviso cuando cambie la situación, respecto del documento con el que se haya acreditado el legal uso y goce del inmueble o inmuebles en donde se lleven a cabo los procesos productivos o la prestación del servicio, según se trate, referente a la vigencia, las partes y el domicilio.
      </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        formControlName="nationalSuppliers"
        
      />
      <label class="form-check-label">
        DAviso de fusión o escisión de empresas que cuenten con el Registro en el Esquema de Certificación de Empresas, cuando resulte una nueva sociedad, extinguiéndose una o más empresas con Registro en el Esquema de Certificación de Empresas vigente
      </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        formControlName="modificationsMembers"
        
      />
      <label class="form-check-label">
        DAviso para solventar las observaciones respecto a los estándares mínimos de seguridad, que deriven de cualquier inspección de supervisión de cumplimiento.
DAviso relacionado a incidentes de seguridad. (creación de vista gráfica captura, consultas funcionario y solicitante, documentos, para los avisos de SCC y OEA)
      </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        formControlName="changesToLegalDocuments"
      
      />
      <label class="form-check-label">
        Aviso cuando varíe o cambie la situación respecto del documento con el
        que se haya acreditado el legal uso y goce del inmueble o inmuebles en
        donde se lleven a acabo los procesos productivos o la prestación de
        servicios según se trate, referente a la vigencia, las partes y
        domicilio
      </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        formControlName="mergerOrSplitNotice"
        
      />
      <label class="form-check-label"> Aviso de fusión o escisión </label>
    </div>
    <div class="form-check">
      <input
        class="form-check-input"
        type="checkbox"
        formControlName="additionFractions"
       
      />
      <label class="form-check-label"> Aviso de adición de fracciones </label>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="alert alert-info">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              formControlName="acepto253"
             
            />
            <label class="form-check-label">
              * Bajo protesta de decir verdad, manifiesto que los datos
              asentados en el presente documento son ciertos y que las
              facultades que me fueron otorgadas para representar al solicitante
              no me han sido modificadas y/ o revocadas.
            </label>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
