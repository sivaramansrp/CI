<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a
          data-toggle="tab"
          (click)="seleccionaTab(1)"
          (keydown.enter)="seleccionaTab(1)"
          (keydown.space)="seleccionaTab(1)"
          tabindex="1"
          role="button"
          >Solicitante</a
        >
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a
          data-toggle="tab"
          (click)="seleccionaTab(2)"
          (keydown.enter)="seleccionaTab(1)"
          (keydown.space)="seleccionaTab(1)"
          tabindex="2"
          role="button"
          >Datos generales de la solicitud</a
        >
      </li>

      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a
          data-toggle="tab"
          (click)="seleccionaTab(3)"
          (keydown.enter)="seleccionaTab(3)"
          (keydown.space)="seleccionaTab(3)"
          tabindex="3"
          role="button"
          >Datos por garantia</a
        >
      </li>
      @if(isEnableModificacionTab){
      <li [ngClass]="indice === 4 ? 'active' : ''">
        <a
          data-toggle="tab"
          (click)="seleccionaTab(4)"
          (keydown.enter)="seleccionaTab(4)"
          (keydown.space)="seleccionaTab(4)"
          tabindex="4"
          role="button"
          >Modificacion de denominacion o razors social</a
        >
      </li>
      }
      <li [ngClass]="indice === 5 ? 'active' : ''">
        <a
          data-toggle="tab"
          (click)="seleccionaTab(5)"
          (keydown.enter)="seleccionaTab(5)"
          (keydown.space)="seleccionaTab(5)"
          tabindex="5"
          role="button"
          >Terceros relacionados</a
        >
      </li>
    </ul>

    <ng-container>
      @switch (indice) { @case (1) {
      <solicitante #Solicitante></solicitante>
      } @case (2) {
      <app-datos-generales-de-la-solicitud
        (tipoDeEndosoChanges)="tipoDeEndosoChanges($event)"
      ></app-datos-generales-de-la-solicitud>
      } @case (3) {
      <app-datos-por-garantia></app-datos-por-garantia>
      } @case (4) {
      <app-modificacion-de-denominacion-o-razors-social></app-modificacion-de-denominacion-o-razors-social>
      } @case (5) {
      <app-terceros-relacionados></app-terceros-relacionados>
      } }
    </ng-container>
  </div>
</div>
