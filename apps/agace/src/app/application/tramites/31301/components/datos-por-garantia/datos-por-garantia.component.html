<div class="container">
  <form [formGroup]="polizaDeFianzaForm">
    <div class="row">
      <div class="col-md-12">
        <ng-titulo titulo="Datos de la póliza de fianza" />
      </div>
    </div>
    <div class="row">
      <div class="col-md-8">
        <app-catalogo-select
          id="cveGenerica1Carta"
          [catalogo]="nombreInstitucionCatalogo.catalogos"
          [label]="nombreInstitucionCatalogo.labelNombre"
          [placeholder]="nombreInstitucionCatalogo.primerOpcion"
          [isDisabled]="true"
          [required]="nombreInstitucionCatalogo.required"
          formControlName="polizaDeFianzaActual"
          (selectionChange)="seleccionaNombreInstitucion($event)"
        >
        </app-catalogo-select>
      </div>
      <div class="col-md-4"></div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="descripcionGenerica1Carta"
            >Número de folio:
            <span
              tooltip="Marcar la casilla si requiere usar esta aduana."
              data-bs-toggle="tooltip"
            >
              <i class="bi bi-question-circle-fill"></i
            ></span>
          </label>
          <input
            class="form-control"
            type="text"
            size="80"
            id="descripcionGenerica1Carta"
            formControlName="numeroFolio"
          />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="cveGenerica1Carta">RFC de la institución de fianza:</label>
          <input class="form-control" type="text" id="cveGenerica1Carta" size="80" formControlName="rfcInstitucion" />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="fechaGenerica1Carta">Fecha de expedición:</label>
          <input class="form-control" type="text" id="fechaGenerica1Carta" size="30"
            formControlName="fechaExpedicion" />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <input-fecha
          class="width"
          [isDisabled]="esFormularioSoloLectura"
          [setFecha]="polizaDeFianzaForm.get('fechaInicioVigencia')?.value"
          [datos]="configuracionFechaInicioVigencia"
          [tooltipQuestionCircle]="true"
        ></input-fecha>
      </div>
      <div class="col-md-4">
        <input-fecha
          class="width"
          [isDisabled]="esFormularioSoloLectura"
          [setFecha]="polizaDeFianzaForm.get('fechaFinVigencia')?.value"
          [datos]="configuracionFechaFinVigencia"
          [tooltipQuestionCircle]="true"
        ></input-fecha>
      </div>
    </div>
    <div class="row">
      <div class="col-md-8">
        <div class="form-group">
          <label class="form-label" for="importeGenerico1Carta">Importe total en moneda nacional que ampara la póliza de
            fianza:</label>
          <input class="form-control" type="text" id="importeGenerico1Carta" size="30" formControlName="importeTotal" />
        </div>
      </div>
      <div class="col-md-4"></div>
    </div>
  </form>
</div>
