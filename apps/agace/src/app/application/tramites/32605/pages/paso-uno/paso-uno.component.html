
<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <ul class="nav nav-tabs">
        <li *ngFor="let tab of seccionesDeLaSolicitud" [ngClass]="indice === tab.index ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(tab.index)" (keydown.enter)="seleccionaTab(tab.index)"
            tabindex="0">{{ tab.title }}</a>
        </li>
      </ul>
    </ul>

    <ng-container>
      <solicitante #solicitanteRef [hidden]="indice !== 1"></solicitante>
       @if(esDatosRespuesta){<app-datos-comunes [hidden]="indice !== 2"></app-datos-comunes>}

       @if(esDatosRespuesta){<app-terceros-relacionados #tercerosRelacionadosRef  [hidden]="indice !== 3"> </app-terceros-relacionados>}

       @if(esDatosRespuesta){<app-importador-exportador #importadorExportadorRef [hidden]="indice !== 4"></app-importador-exportador>}

       @if(esDatosRespuesta){<app-c-tpat [hidden]="indice !== 5"></app-c-tpat>}
    </ng-container>

  </div>
</div>
