<form [formGroup]="forma">
<app-domicilios-rfc-solicitante></app-domicilios-rfc-solicitante>
    <div class="row mt-5">
        <div class="col-md-6">
            <div class="form-group">
                <app-catalogo-select [catalogo]="sectorProductivoList" [label]="'Sector Productivo'"
                    [placeholder]="'Seleccione un valor'" [required]="true" id="sector-productivo"
                    formControlName="sectorProductivo" (change)="
            setValoresStore(forma,'sectorProductivo'); manejarCamposMutuamenteExcluyentes('sectorProductivo', 'sectorServicio', $event)"
            [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>

                <div *ngIf="esInvalido('sectorProductivo')" class="text-danger">
                    <small *ngIf="
              forma.controls['sectorProductivo'].hasError(
                'required'
              )
            ">Este campo es obligatorio.</small>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="form-group">
                <app-catalogo-select [catalogo]="sectorServicio" [label]="'Servicio'"
                    [placeholder]="'Seleccione un valor'" [required]="true" id="sector-servicio"
                    formControlName="sectorServicio"
                    (change)="setValoresStore(forma, 'sectorServicio'); manejarCamposMutuamenteExcluyentes('sectorServicio', 'sectorProductivo', $event)"
                    [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>

                <div *ngIf="esInvalido('sectorServicio')" class="text-danger">
                    <small *ngIf="
              forma.controls['sectorServicio'].hasError('required')
            ">Este campo es obligatorio.</small>
                </div>
            </div>
        </div>
    </div>



    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Señale si al momento de ingresar su solicitud si se encuentra al corriente en el cumplimiento de sus obligaciones fiscales y aduaneras*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="cumplimientoFiscalAduanero" (valueChange)="onSeleccionfalsa($event)"
                (change)="setValoresStore(forma,'cumplimientoFiscalAduanero')"></app-input-radio>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Indique si autorizó al S A T hacer pública su opinión positiva sobre el cumplimiento de obligaciones fiscales*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="autorizaOpinionSAT" (valueChange)="onSeleccionfalsa($event)"
                (change)="setValoresStore(forma,'autorizaOpinionSAT')"></app-input-radio>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Señale si cuenta con empleados propios para realizar el proceso productivo o la prestación de servicios, registrado ante el IMSS*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="cuentaConEmpleadosPropios" (valueChange)="enCambioDeValor($event); onSeleccionfalsa($event, EMPLEADO_REQUISITO)"
                (change)="setValoresStore(forma,'cuentaConEmpleadosPropios')"></app-input-radio>
        </div>
    </div>

    <div class="row" *ngIf="radioSeleccionado">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Cual es el número de empleados propios con los que contó en el último bimestre anterior a su solicitud</label>
        </div>
        <div class="col-md-6">
            <div class="form-group">
                <label class="form-label text-left">Número de empleados</label>
                <input class="form-control" id="numero-de-empleadas" type="text" name="numeroDeEmpleadas"
                    formControlName="numeroDeEmpleadas" (change)="
              setValoresStore(forma, 'numeroDeEmpleadas')
            " />
                <div *ngIf="esInvalido('numeroDeEmpleadas')" class="text-danger">
                    <small *ngIf="
                forma.controls['numeroDeEmpleadas'].hasError('required')
              ">Este campo es obligatorio.</small>
                    <!-- <small *ngIf="forma.controls['capitalSocial'].hasError('pattern')">
              No cumple con el formato esperado
            </small>
          <small
            *ngIf="forma.controls['capitalSocial'].hasError('maxlength')"
          >
            El capital social no puede exceder los 20 caracteres.
          </small> -->
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="form-group" *ngIf="bimestreList.length > 0">
                <app-catalogo-select [catalogo]="bimestreList" [label]="'Bimestre'"
                    [placeholder]="'Seleccione un valor'" [required]="true" id="bimestre"
                    formControlName="bimestreUltimo" (change)="
            setValoresStore(forma, 'bimestreUltimo')
          " [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>

                <div *ngIf="esInvalido('bimestreUltimo')" class="text-danger">
                    <small *ngIf="
              forma.controls['bimestreUltimo'].hasError('required')
            ">Este campo es obligatorio.</small>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Cumple con la obligación de retener y enterar el I S R de los trabajadores*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="retencionISRTrabajadores" (valueChange)="onSeleccionfalsa($event)"
                (change)="setValoresStore(forma,'retencionISRTrabajadores')"></app-input-radio>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Acredita realizar el pago de cuotas obrero patronales*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="pagoCuotasIMSS" (valueChange)="onSeleccionfalsa($event); manejarPagoCuotasIMSS($event)"
                (change)="setValoresStore(forma,'pagoCuotasIMSS')"></app-input-radio>
        </div>
    </div>

    <div class="row" *ngIf="mostrarRespuestaObligatoria">
        <div class="col-md-12 pt-5">
            <h5 class="m-0 text-danger">Respuesta Obligatoria</h5>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-2 mb-5">
            <label class="form-label text-left">Señale si al momento de ingresar su solicitud la empresa solicitante cuenta con subcontratación de servicios especializados o de ejecución de obras especializadas*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="cuentaConSubcontratacionEspecializada" (valueChange)="toggleTablaPorValor($event)"
                (change)="setValoresStore(forma,'cuentaConSubcontratacionEspecializada')"></app-input-radio>
        </div>

        <ng-container *ngIf="esTablaVisible">
            <app-numero-empleados-bimestre [bimestreList]="bimestreList"></app-numero-empleados-bimestre>
        </ng-container>

    </div>


            <div class="row" *ngIf="esTablaVisible">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">En su caso, acredita cumplir con el registro y estar en el padrón a que se refiere el artículo 15 de la LFT.*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="registroPadronLFT" (valueChange)="onSeleccionfalsa($event)"
                (change)="setValoresStore(forma,'registroPadronLFT')"></app-input-radio>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Señale si al momento de ingresar su solicitud se encuentra en el listado de empresas publicadas por el SAT en términos del articulo 69, con excepción de lo dispuesto en la fracción VI.*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="listadoSATArt69" (valueChange)="onSeleccionVerdadera($event)"
                (change)="setValoresStore(forma,'listadoSATArt69')"></app-input-radio>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Del mismo modo indique si al momento de ingresar su solicitud se encuentra en el listado de empresas publicadas por el SAT en términos del artículo 69-B, cuarto párrafo del CFF.*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="listadoSATArt69B" (valueChange)="onSeleccionVerdadera($event)"
                (change)="setValoresStore(forma,'listadoSATArt69B')"></app-input-radio>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Señale si se encuentra en el listado de empresas publicadas por el SAT en términos del artículo 69-B Bis noveno párrafo del CFF.*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="listadoSATArt69BBis" (valueChange)="onSeleccionVerdadera($event)"
                (change)="setValoresStore(forma,'listadoSATArt69BBis')"></app-input-radio>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Señale si sus certificados de sellos digitales están vigentes.*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="certificadosSellosVigentes" (valueChange)="onSeleccionfalsa($event)"
                (change)="setValoresStore(forma,'certificadosSellosVigentes')"></app-input-radio>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">En caso afirmativo señale si se infringió alguno de los supuestos previstos en el artículo 17-H Bis del CFF, durante los últimos doce meses.*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="infringioSupuestos17HBis" (valueChange)="onSeleccionVerdadera($event)"
                (change)="setValoresStore(forma,'infringioSupuestos17HBis')"></app-input-radio>
        </div>
    </div>


    <div class="row">
        <div class="col-md-12 pt-5">
            <h2>new table section will come here</h2>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Señale si tiene actualizado sus medios de contacto para efectos del buzón tributario en términos del penúltimo párrafo del artículo 17-K del CFF.*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="mediosContactoActualizadosBuzon" (valueChange)="onSeleccionfalsa($event)"
                (change)="setValoresStore(forma,'mediosContactoActualizadosBuzon')"></app-input-radio>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12 pt-5">
            <label class="form-label text-left">Señale si se encuentra suspendida en el Padrón de Importadores o en el Padrón de Importadores de Sectores Específicos o Padrón de Exportadores Sectorial.*:</label>
            <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [isRequired]="true" [layout]="'horizontal'"
                formControlName="suspensionPadronImportadoresExportadores" (valueChange)="onSeleccionVerdadera($event)"
                (change)="setValoresStore(forma,'suspensionPadronImportadoresExportadores')"></app-input-radio>
        </div>
    </div>
</form>

<lib-notificaciones 
  *ngIf="esHabilitarElDialogo"
  [notificacionInput]="nuevaNotificacion" 
  (confirmacionModal)="cerrarModal()">
</lib-notificaciones>
