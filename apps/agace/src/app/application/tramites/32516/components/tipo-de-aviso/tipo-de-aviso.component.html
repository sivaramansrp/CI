<div class="container mt-4">
<ng-titulo titulo="Datos del aviso del que procede el acta"></ng-titulo>
  <form [formGroup]="solicitudForm">
    <div class="row">
      <div class="col-md-10">
        <div class="form-group">
          <app-catalogo-select [label]="'Aviso del que procede el acta de hechos'" [catalogo]="actaDeHechos"
            formControlName="descripcionGenerica1" [required]="true" name="actaDeHechos"></app-catalogo-select>
        </div>
      </div>
    </div>

    <ng-titulo titulo="Datos de la ADACE que asistió a la destrucción"></ng-titulo>
    <div class="row">
      <div class="col-md-12">
        <div class="form-group d-flex align-items-center">
          <label>&iquest;Acudió la ADACE?</label>
          <div class="form-check ms-3">
            <app-input-radio [radioOptions]="radioOpcion" formControlName="capacidadAlmacenamiento"
                             [layout]="'horizontal'"></app-input-radio>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4">
        <div class="form-group text-left">
          <app-catalogo-select [label]="'ADACE a la que le corresponde levantar el acta'" [catalogo]="levantarActa"
          formControlName="descripcionGenerica2" [required]="true" name="levantarActa"></app-catalogo-select>
        </div>
      </div>
    </div>

    <!-- Sección: Datos de la destrucción en relación con el Acta de Hechos -->
    <div class="row">
      <div class="col-md-12">
        <ng-titulo
          titulo="Datos de la destrucci&oacute;n en relaci&oacute;n con la cual se presenta el Acta de Hechos"></ng-titulo>
      </div>
      <div class="col-md-12">
        <div class="form-group d-flex align-items-center">
          <label>&iquest;Cuenta con el ID de transacci&oacute;n de VUCEM por la presentaci&oacute;n del aviso de
            destrucci&oacute;n?</label>
            <app-input-radio [radioOptions]="radioOpcion" formControlName="cantidadBienes"
            [layout]="'horizontal'"></app-input-radio>
        </div>
      </div>
    </div>

    <!-- Condicional: Mostrar campo ID de transacción -->
    <div id="dos" *ngIf="solicitudForm.get('cantidadBienes')?.value === '1'">
      <div class="row">
        <div class="col-md-4">
          <label for="numeroIMMEX">ID de transacci&oacute;n de VUCEM</label>
          <span class="require">*</span>
          <span class="glyphicon glyphicon-question-sign" data-bs-toggle="tooltip" data-bs-placement="top"
            title="ID de transacci&oacute;n de VUCEM" for="numeroIMMEX" aria-hidden="true"></span>
        </div>
        <div class="col-md-4">
          <input type="text" formControlName="descripcionGenerica3" id="numeroIMMEX" maxlength="250"
            class="form-control" [required]="true"/>
        </div>
      </div>
    </div>

    <!-- Tabla de Entrega Act -->
    <div class="row">
      <div class="col-md-12 mt-4">
        <div class="table-responsive">
          <div class="table-container">
            <app-tabla-dinamica *ngIf="hechosTableDatos.length > 0"
                [tipoSeleccionTabla]="tablaSeleccionCheckbox" [configuracionTabla]="hechosTabla"
                [datos]="hechosTableDatos"></app-tabla-dinamica>
        </div>
        </div>
      </div>
    </div>

    <!-- Botones Agregar -->
    <div class="row">
      <div class="col-md-12">
        <div class="d-flex justify-content-end">
          <button type="button" class="btn btn-primary me-2" (click)="irAPaginaAgregar()" [disabled]="solicitudForm.invalid">Agregar</button>
        </div>
      </div>
    </div>
  </form>
</div>
