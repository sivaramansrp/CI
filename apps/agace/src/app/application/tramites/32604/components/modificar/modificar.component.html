<div class="container">
    <form>
        <div class="row mb-3">
                <div class="col-md-4">
                    <ng-titulo titulo="Agregar" />
                </div>
                <div class="col-md-12">
                    <label class="form-label text-start">
                        *Instalaciones principales</label>
                    <div class="col-md-12">
                        <app-input-radio
                        [radioOptions]="sinoOpcion.radioOptions"
                        [isRequired]="sinoOpcion.isRequired"
                        [layout]="'horizontal'"
                        [gap]="'50px'"
                        (valueChange)="actualizar290($event)"
                        ></app-input-radio>
                    </div>
                    <div class="col-md-4">
                        <label for="rfc" class="form-label">Municipio o alcaldia</label>
                        <input type="text" id="rfc" class="form-control"/>
                    </div>
                </div>

                    <div class="col-md-6">
                        <app-catalogo-select [catalogo]="contenedores.catalogos" [label]="contenedores.labelNombre" [placeholder]="contenedores.primerOpcion" [required]="true"></app-catalogo-select>
                    </div>
                    <div class="col-md-6">
                        <label for="entidad" class="form-label">Entidad federativa</label>
                        <input type="text" id="entidad" class="form-control"/>
                    </div>
                    <div class="col-md-6">
                        <label for="registro" class="form-label">Registro ante SE/SAT</label>
                        <input type="text" id="registro" class="form-control"/>
                    </div>
        </div>
        <div class="row mb-3">
             <div class="col-md-12">
                <label for="colonia" class="form-label">Colonia, calle y número</label>
                <input type="text" id="colonia" class="form-control"/>
            </div>
            <div class="col-md-6">
                <label for="codigoPostal" class="form-label">Código postal</label>
                <input type="text" id="codigoPostal" class="form-control"/>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
          <button
            type="button"
            id="aceptar"
            class="btn btn-primary"
            data-bs-dismiss="modal"
            #closeModal
          >
            Aceptar
          </button>

          <button
            type="button"
            id="cancelar"
            class="btn btn-danger ms-3"
            data-bs-dismiss="modal"
            #closeModal
          >
            Cancelar
          </button>
        </div>
    </form>
</div>
