<div class="container">
    <form>
        <div class="row mb-3">
            <div class="col-md-12">
                <ng-titulo titulo="Agregar miembro de ela empresa" />
            </div>
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="contenedores.catalogos" [label]="contenedores.labelNombre"
                    [placeholder]="contenedores.primerOpcion" [required]="true"></app-catalogo-select>
            </div>
            <div class="col-md-4">
                <label for="rfcBusqueda" class="form-label">RFC*:</label>
                <input type="text" id="rfcBusqueda" class="form-control" />
            </div>
            <div class="col-md-4">
                <div class="form-group mt-5 pull-left">
                    <button type="button" name="Buscar" id="Buscar" class="btn btn-primary me-5">
                        Buscar
                    </button>
                </div>
            </div>
        </div>
        <div class="row mb-3">
            <!-- <div class="col-md-6"> -->
                <label class="form-label text-start">
                    *Instalaciones principales</label>
                <div class="col-md-6">
                    <app-input-radio [radioOptions]="sinoOpcion.radioOptions" [isRequired]="sinoOpcion.isRequired"
                        [layout]="'horizontal'" [gap]="'50px'" (valueChange)="actualizar290($event)"></app-input-radio>
                </div>
                <div class="col-md-12">
                    <label for="registro" class="form-label">Registro Federal de Contribuyentes*:</label>
                    <input type="text" id="registro" class="form-control" />
                </div>
            <!-- </div> -->
        </div>
        <div class="row mb-3">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="nacionalidad.catalogos" [label]="nacionalidad.labelNombre"
                    [placeholder]="nacionalidad.primerOpcion" [required]="true"></app-catalogo-select>
            </div>
            <div class="col-md-6">
                <label for="nombreCompleto" class="form-label">Nombre completo*</label>
                <input type="text" id="nombreCompleto" class="form-control" />
            </div>
        </div>
        <div class="d-flex justify-content-end mt-4">
            <button type="button" id="aceptar" class="btn btn-primary" data-bs-dismiss="modal" #closeModal>
                Aceptar
            </button>

            <button type="button" id="cancelar" class="btn btn-danger ms-3" data-bs-dismiss="modal" #closeModal>
                Cancelar
            </button>
        </div>
    </form>
</div>
