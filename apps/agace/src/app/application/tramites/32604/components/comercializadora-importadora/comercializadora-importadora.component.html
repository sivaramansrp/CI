<div class="container">
    <form [formGroup]="modalidadForm">
        <div class="row">
            <div class="col-md-12 mt-2">
                <label class="form-label text-start">
                    Conforme a la regla 7.1.4 primer párrafo, fracciones I, III y IV. y al
                    apartado A, se deben acreditar lo siguiente:
                </label>
                <label class="form-label text-start">
                    Pago del derecho a que se refiere el artículo 40, inciso m, de la LFD,
                    correspondiente a la fecha de presentación de la solicitud:
                </label>
            </div>

            <div class="col-md-12">
                <div class="col-md-4 mt-5">
                    <label class="form-label text-start"> Fecha de pago: </label>
                </div>
                <div class="col-md-4">
                    <input-fecha [datos]="fechaDePago" [isDisabled]="esFormularioSoloLectura"
                        [setFecha]="modalidadForm.get('fechaPago')?.value"
                        (valorCambiado)="actualizarFechaPago($event)">
                    </input-fecha>
                </div>
            </div>

            <div class="col-md-12">
                <div class="col-md-4">
                    <label class="form-label text-start" for="montoOEA">Monto :</label>
                </div>
                <div class="col-md-4">
                    <input class="form-control" formControlName="monto" type="text" id="montoOEA" name="montoOEA" />
                </div>
            </div>

            <div class="col-md-12 mt-1">
                <div class="col-md-4">
                    <label class="form-label text-start" for="operacionesBancarias">Número de Operación Bancaria :</label>
                </div>
                <div class="col-md-4">
                    <input class="form-control" formControlName="operacionesBancarias" type="text" id="operacionesBancarias"
                    name="operacionesBancarias" />
                </div>
            </div>

            <div class="col-md-12 mt-1">
                <div class="col-md-4">
                    <label class="form-label text-start" for="llaveOEA">Llave de pago :</label>
                </div>
                <div class="col-md-4">
                    <input class="form-control" formControlName="llavePago" type="text" id="llaveOEA" name="llaveOEA" />
                </div>
            </div>


        </div>
    </form>
</div>
