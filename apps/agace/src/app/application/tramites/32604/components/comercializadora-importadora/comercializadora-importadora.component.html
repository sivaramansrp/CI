<div class="container">
    <form [formGroup]="modalidadForm">
        <div class="row">
            <div class="col-md-12 mt-2">
                <label class="form-label text-start">
                    Conforme a la regla 7.1.4 primer párrafo, fracciones I, III y IV. y al
                    apartado A, se deben acreditar lo siguiente:
                </label>
                <label class="form-label text-start">
                    Pago del derecho a que se refiere el artículo 40, inciso m, de la LFD,
                    correspondiente a la fecha de presentación de la solicitud:
                </label>
            </div>

            <div class="col-md-12">
                <div class="col-md-4 mt-5">
                    <label class="form-label text-start"> Fecha de pago: </label>
                </div>
                <div class="col-md-4">
                    <input-fecha [datos]="fechaDePago" [isDisabled]="esFormularioSoloLectura"
                        [setFecha]="modalidadForm.get('fechaPago')?.value"
                        (valorCambiado)="actualizarFechaPago($event)">
                    </input-fecha>
                </div>
            </div>

            <div class="col-md-12">
                <div class="col-md-4">
                    <label class="form-label text-start" for="montoOEA">Monto :</label>
                </div>
                <div class="col-md-4">
                    <input class="form-control" formControlName="monto" type="text" id="montoOEA" name="montoOEA" />
                </div>
            </div>

            <div class="col-md-12 mt-1">
                <div class="col-md-4">
                    <label class="form-label text-start" for="operacionesBancarias">Número de Operación Bancaria
                        :</label>
                </div>
                <div class="col-md-4">
                    <input class="form-control" formControlName="operacionesBancarias" type="text"
                        id="operacionesBancarias" name="operacionesBancarias" />
                </div>
            </div>

            <div class="col-md-12 mt-1">
                <div class="col-md-4">
                    <label class="form-label text-start" for="llaveOEA">Llave de pago :</label>
                </div>
                <div class="col-md-4">
                    <input class="form-control" formControlName="llavePago" type="text" id="llaveOEA" name="llaveOEA" />
                </div>
            </div>

            <div class="col-md-12 mt-5">
                <label class="form-label text-start">
                    * Designe a las empresas transportistas authorizadas para efectuar el translado de
                    las mercancías de commercio exterior.
                </label>
            </div>
            <div class="col-md-12">
                <ng-titulo titulo="Transportistas" />
            </div>
            <div class="col-md-12">
                <app-tabla-dinamica [tipoSeleccionTabla]="transportistasTabla"
                    [configuracionTabla]="transportistasConfiguracionColumnas" [datos]="transportistasLista"
                    (listaDeFilaSeleccionada)="seleccionarDato($event)">
                </app-tabla-dinamica>
            </div>

            <div class="col-md-12 mt-3">
                <div class="form-group mt-5 pull-right">
                    <button type="button" [disabled]="esFormularioSoloLectura" id="agregarTransportista"
                        class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#transportistas"
                        (click)="agregarTransportistaModel()">
                        Agregar
                    </button>
                    <button type="button" [disabled]="esFormularioSoloLectura" id="modificarTransportista"
                        class="btn btn-default me-2" (click)="agregarTransportistaModel()">
                        Modificar
                    </button>
                    <button type="button" [disabled]="esFormularioSoloLectura" id="eliminarTransportista"
                        class="btn btn-danger" (click)="eliminarDato()">
                        Eliminar
                    </button>
                </div>
            </div>

            <div class="col-md-12 mt-4">
                <label class="form-label text-start">
                    Indique si cuenta con un programa IMMEX *</label>
                <app-input-radio
                    formControlName="programaImmex"
                    [radioOptions]="sinoOpcion.radioOptions"
                    [isRequired]="sinoOpcion.isRequired"
                    [layout]="'horizontal'"
                    [gap]="'50px'"
                    (valueChange)="actualizarProgramaImmex($event)"
                ></app-input-radio>
            </div>

            <div class="col-md-12 mt-4">
                <label class="form-label text-start">
                    Indique si efectuo en el semestre inmediato a la fecha en que ingresa su solicitud,
                    importaciones por un valor en aduana menor a $300,000,000.00. *
                </label>
                <app-input-radio
                formControlName="importsRadio"
                [radioOptions]="sinoOpcion.radioOptions"
                [isRequired]="sinoOpcion.isRequired"
                [layout]="'horizontal'"
                [gap]="'50px'"
                (valueChange)="actualizarImportsRadio($event)"
                ></app-input-radio>
            </div>

        </div>
    </form>
</div>

<div class="modal fade" id="transportistas" tabindex="-1" aria-labelledby="modaltransportistas" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content mr-5px">
            <app-agregar-transportistas
            (seccionTransportistasLista)="seccionTransportistasLista($event)"
            ></app-agregar-transportistas>
        </div>
    </div>
</div>
