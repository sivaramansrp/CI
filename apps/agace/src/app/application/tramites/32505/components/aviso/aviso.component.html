<form [formGroup]="aviosForm">
    <div class="col-md-8 mb-3">
        <ng-container formGroupName="adaceForm">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="adace">ADACE:</label>
                    <input type="text" class="form-control" style="cursor:not-allowed" formControlName="adace"
                        [readonly]="true" id="adace" />
                </div>

            </div>
            <ng-titulo titulo="Datos del periodo del aviso" />
            <div class="row align-items-center">
                <div class="col-md-6 ">
                    <label for="pais"> Mes al que corrosponde el aviso*:</label>
                </div>
                <div class="col-md-6">
                    <div>
                    <app-catalogo-select class="optionsPais" [catalogo]="optionsPais" [required]="true" id="pais"
                        formControlName="pais" [ngClass]="isValid(adaceForm,'pais') ? 'required' : ''"
                        (change)="setValoresStore(adaceForm, 'pais', 'setPais')">
                    </app-catalogo-select>
                </div>
                </div>
            </div>
            <div class="row align-items-center">
                <div class="col-md-6 ">
                    <label for="anio"> Año al que corrosponde el aviso*:</label>
                </div>

                <div class="col-md-6 ">
                    <div>
                    <app-catalogo-select class="optionsAnio" [catalogo]="optionsAnio" [required]="true" id="anio"
                        formControlName="anio" [ngClass]="isValid(adaceForm,'anio') ? 'required' : ''"
                        (change)="setValoresStore(adaceForm, 'anio', 'setAnio')">
                    </app-catalogo-select>
                    </div>
                </div>
            </div>
        </ng-container>

        <ng-container formGroupName="adaceForm">
            <ng-titulo titulo="Tipo de aviso" />
            <div class="row">
                <div class="col-md-12">
                    <div class="col-md-5">
                        <div class="radio">
                            <label>
                                <input type="radio" id="idRadioAviso" formControlName="tipoBusqueda" value="Manual"
                                    class="form-check-input"
                                    (change)="setValoresStore(adaceForm, 'tipoBusqueda', 'setTipoBusqueda')">
                                Manual
                            </label>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <div class="radio">
                            <label>
                                <input type="radio" id="idRadioAviso" value="Carga masiva"
                                    formControlName="tipoBusqueda" class="form-check-input"
                                    (change)="setValoresStore(adaceForm, 'tipoBusqueda', 'setTipoBusqueda')">
                                Carga masiva
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>

        <ng-container formGroupName="adaceForm" *ngIf="datosDelAvisoVisible">

            <ng-titulo titulo="Datos del aviso" />
            <div class="row">
                <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
                    [configuracionTabla]="tableData.headers" [datos]="tableData.data"></app-tabla-dinamica>
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-primary ms-3" [disabled]="true"
                        (click)="accionesBotones(botonAccionesTipos.ELIMINAR)">
                        Eliminar
                    </button>
                    <button type="button" class="btn btn-primary ms-3" [disabled]="false" (click)="datosDelAviso()">
                        Modificar
                    </button>
                    <button type="button" class="btn btn-primary ms-3" [disabled]="false"
                        (click)="accionesBotones(botonAccionesTipos.AGREGAR)">
                        Agregar
                    </button>
                </div>
            </div>


        </ng-container>

        <ng-container *ngIf="datosCargaMasiva">
            <app-carga-masiva></app-carga-masiva>

            <!-- <app-datos-aviso></app-datos-aviso> -->
        </ng-container>

        <ng-container formGroupName="adaceForm" *ngIf="isPopupOpen">
            <div class="modal fade" id="datosAviso" tabindex="-1" #datosAviso aria-labelledby="datosAviso"
                aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-xl">
                    <div class="modal-content">
                        <div class="modal-body">
                            <ng-titulo titulo="Datos del aviso" />
                            <div class="row align-items-center">
                                <ng-titulo titulo="Tipo de operación" />
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="col-md-4">
                                            Datos del tipo de registro*:
                                        </div>
                                        <div class="col-md-2">
                                            <div class="radio">
                                                <label>
                                                    <input type="radio" id="idRadioAviso"
                                                        formControlName="tipoBusquedaAviso" value="Importación"
                                                        class="form-check-input"
                                                        (change)="setValoresStore(adaceForm, 'tipoBusquedaAviso', 'setTipoBusquedaAviso')">
                                                    Importación
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-2">
                                            <div class="radio">
                                                <label>
                                                    <input type="radio" id="idRadioAviso" value="Venta"
                                                        formControlName="tipoBusquedaAviso" class="form-check-input"
                                                        (change)="setValoresStore(adaceForm, 'tipoBusquedaAviso', 'setTipoBusquedaAviso')">
                                                    Venta
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="radio">
                                                <label>
                                                    <input type="radio" id="idRadioAviso" value="Importación y venta"
                                                        formControlName="tipoBusquedaAviso" class="form-check-input"
                                                        (change)="setValoresStore(adaceForm, 'tipoBusquedaAviso', 'setTipoBusquedaAviso')">
                                                    Importación y venta
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <br><br>
                                <div class="row">
                                    <!-- folioTipo -->
                                    <div class="col-md-12">
                                        <div class="col-md-6">
                                            ¿Cuentas con el folio VUCEM de la importación?
                                        </div>
                                        <div class="col-md-3">
                                            <div class="radio">
                                                <label>
                                                    <input type="radio" id="idRadioAviso" formControlName="folioTipo"
                                                        value="Si" class="form-check-input"
                                                        (change)="setValoresStore(adaceForm, 'folioTipo', 'setFolioTipo')">
                                                    Si
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <div class="radio">

                                                <label>
                                                    <input type="radio" id="idRadioAviso" formControlName="folioTipo"
                                                        value="No" class="form-check-input"
                                                        (change)="setValoresStore(adaceForm, 'folioTipo', 'setFolioTipo')">
                                                    No
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label>NIV o número de serie*:</label>
                                    <input type="text" class="form-control" id="numeroSerie"
                                        formControlName="numeroSerie"
                                        [ngClass]="isValid(adaceForm,'numeroSerie') ? 'required' : ''"
                                        (change)="setValoresStore(adaceForm, 'numeroSerie', 'setNumeroSerie')" />
                                </div>
                            </div>



                            <ng-titulo titulo="Datos del vehículo" />
                            <ng-container *ngIf="datosDelVehiculo">
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="col-md-4 mb-3">
                                            <label>NIV o número de serie*:</label>
                                            <input type="text" class="form-control" formControlName="numeroNIV"
                                                [ngClass]="isValid(adaceForm,'numeroNIV') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'numeroNIV', 'setNumeroNIV')" />
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label>Año modelo*:</label>
                                            <input type="text" class="form-control" id="anoModelo"
                                                formControlName="anoModelo"
                                                [ngClass]="isValid(adaceForm,'anoModelo') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'anoModelo','setAnoModelo')" />
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label>Marca*:</label>
                                            <input type="text" class="form-control" id="marca" formControlName="marca"
                                                [ngClass]="isValid(adaceForm,'marca') ? 'required' : ''" (change)="
                                          setValoresStore(adaceForm, 'marca', 'setMarca')" />
                                        </div>
                                    </div>
                                </div>

                                <!-- second row  -->
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="col-md-4 mb-3">
                                            <label>Modelo*:</label>
                                            <input type="text" class="form-control" formControlName="modelo"
                                                [ngClass]="isValid(adaceForm,'modelo') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'modelo', 'setModelo')" />
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label>Tipo/Variante/Versión*:</label>
                                            <input type="text" class="form-control" id="tipoVariante"
                                                formControlName="tipoVariante"
                                                [ngClass]="isValid(adaceForm,'tipoVariante') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'anoModelo','setTipoVariante')" />
                                        </div>
                                        <div class="col-md-4 ">
                                            <app-catalogo-select class="optionCilindros" [label]="'No. de cilindros'"
                                                [catalogo]="optionCilindros" [required]="true" id="cilindros"
                                                formControlName="cilindros"
                                                [ngClass]="isValid(adaceForm,'cilindros') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'cilindros', 'setCilindros')">
                                            </app-catalogo-select>
                                        </div>
                                    </div>
                                </div>
                                <!-- Third row  -->
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="col-md-4 mb-3">
                                            <app-catalogo-select class="optionCilindros" [label]="'No. de puertas'"
                                                [catalogo]="optionCilindros" [required]="true" id="cilindros"
                                                formControlName="puertas"
                                                [ngClass]="isValid(adaceForm,'puertas') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'puertas', 'setPuertas')">
                                            </app-catalogo-select>
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <app-catalogo-select class="optionCombustible"
                                                [label]="'Tipo de combustible'" [catalogo]="optionCombustible"
                                                [required]="true" id="combustible" formControlName="combustible"
                                                [ngClass]="isValid(adaceForm,'combustible') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'combustible', 'setCombustible')">
                                            </app-catalogo-select>
                                        </div>

                                        <div class="col-md-4 mb-3">
                                            <label>No. del título de propiedad*:</label>
                                            <input type="text" class="form-control" formControlName="propiedad"
                                                [ngClass]="isValid(adaceForm,'propiedad') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'propiedad', 'setPropiedad')" />
                                        </div>

                                    </div>
                                </div>

                                <!-- Fourth row -->
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="col-md-12 mb-3">
                                            <label>Nombre en el título de propiedad extranjero o en su caso, nombre de
                                                la persona a la que se haya concedido la propiedad*:
                                                :</label>
                                            <input type="text" class="form-control" formControlName="nombreTitulo"
                                                [ngClass]="isValid(adaceForm,'nombreTitulo') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'nombreTitulo', 'setNombreTitulo')" />
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="col-md-6 mb-3">
                                            <app-catalogo-select class="paisIssued"
                                                [label]="'País que emitió el título de propiedad'"
                                                [catalogo]="paisIssued" [required]="true" id="paisEmitio"
                                                formControlName="paisEmitio"
                                                [ngClass]="isValid(adaceForm,'paisEmitio') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'paisEmitio', 'setPaisEmitio')">
                                            </app-catalogo-select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label>Estado o provincia de emisión del título de propiedad</label>
                                            <input type="text" class="form-control" formControlName=" provinciaEmision"
                                                [ngClass]="isValid(adaceForm,'provinciaEmision') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'provinciaEmision', 'setProvinciaEmision')" />
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="col-md-6 mb-3">
                                            <label>No. de placas de circulación en el país de procedencia</label>
                                            <input type="text" class="form-control" formControlName=" procedencia"
                                             (change)="setValoresStore(adaceForm, 'procedencia', 'setProcedencia')" />
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <app-catalogo-select class="paisIssued"
                                                [label]="'Forma de adquisición del vehículo importado'"
                                                [catalogo]="paisIssued" [required]="true" id="vehiculoImportado"
                                                formControlName="paisEmitio"
                                                [ngClass]="isValid(adaceForm,'vehiculoImportado') ? 'required' : ''"
                                                (change)="setValoresStore(adaceForm, 'vehiculoImportado', 'setVehiculoImportado')">
                                            </app-catalogo-select>
                                        </div>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="col-md-6 mb-3">
                                            <label>No. de documento de exportación*:</label>
                                            <input type="text" class="form-control" formControlName=" exportacion"
                                            [ngClass]="isValid(adaceForm,'exportacion') ? 'required' : ''"
                                             (change)="setValoresStore(adaceForm, 'exportacion', 'setExportacion')" />
                                        </div>

                                        </div>
                                        </div>
                            </ng-container>
                        </div>
                    </div>
                </div>
            </div>
        </ng-container>
    </div>
</form>
