<div class="page">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <h2>Aviso de modificación del Registro en el Esquema de Certificación de Empresas Modalidad IVA e IEPS 
        </h2>
        </div>
  
        <app-wizard [listaPasos]="pasos"></app-wizard>
      </div>
  
      <div class="row">
        @switch (indice) {
          @case (1) {

            <app-paso-uno  (tabSelected)="handleTabSelected($event)"></app-paso-uno>
          } @case (2) {
            <app-paso-dos></app-paso-dos>
          } @case (3) {
            <app-paso-tres></app-paso-tres>
          }
        }
    <btn-continuar-custom [currentPasoUnoTab]="currentPasoUnoTab"  [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar-custom>
      </div>
    </div>
  </div>
