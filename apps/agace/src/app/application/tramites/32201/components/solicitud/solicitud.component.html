<div class="mt-4">
  <form [formGroup]="solicitudForm">
    <ng-titulo titulo="Régimen aduanero"></ng-titulo>
    <div class="col-md-12">
      <div class="form-check">
        <lib-input-check [id]="'regimen_0'" [label]="'Importación temporal para la elaboración, transformación o preparación
              en programas de maquila o de exportación (IMMEX)'" [required]="true" formControlName="regimen_0"
          (change)="setValoresStore(solicitudForm, 'regimen_0', 'setRegimen_0')" [isDisabled]="esFormularioSoloLectura"></lib-input-check>
      </div>

      <div class="form-check">
        <lib-input-check [id]="'regimen_1'" [label]="'Depósito fiscal para someterse al proceso de ensamble y fabricación de
              vehículo a empresas de la industria automotriz terminal'" [required]="true" formControlName="regimen_1"
          (change)="setValoresStore(solicitudForm, 'regimen_1', 'setRegimen_1')" [isDisabled]="esFormularioSoloLectura"></lib-input-check>
      </div>

      <div class="form-check">
        <lib-input-check [id]="'regimen_2'" [label]="'Elaboración, transformación o reparación en recinto fiscalizado'"
          [required]="true" formControlName="regimen_2"
          (change)="setValoresStore(solicitudForm, 'regimen_2', 'setRegimen_2')" [isDisabled]="esFormularioSoloLectura"></lib-input-check>
      </div>

      <div class="form-check">
        <lib-input-check [id]="'regimen_3'" [label]="'Recinto Fiscalizado Estratégico'" 
          [required]="true" formControlName="regimen_3" 
          (change)="setValoresStore(solicitudForm, 'regimen_3', 'setRegimen_3')" [isDisabled]="esFormularioSoloLectura"></lib-input-check>
      </div>
    </div>

    <ng-titulo titulo="Requisitos"></ng-titulo>
    <div class="col-md-12">
      <div class="form-group">
        <label>Indique si cuenta dieciocho meses después de haber obtenido el Registro en el 
          Esquema de certificación de Empresas. </label>
        <app-input-radio [radioOptions]="radioOpcions" [isBold]="true" formControlName="radio_1"
            [layout]="'horizontal'" (change)="setValoresStore(solicitudForm, 'radio_1', 'setRadio_1')" 
            [disabled]="esFormularioSoloLectura"></app-input-radio>
      </div>

      <div class="form-group">
        <label>Manifieste si ha realizado operaciones del Programa autorizado al amparo 
          del Decreto IMMEX en al menos doce meses previos a la presentación de la solicitud la 
          presente autorización</label>
        <app-input-radio [radioOptions]="radioOpcions" [isBold]="true" formControlName="radio_2"
            [layout]="'horizontal'" (change)="setValoresStore(solicitudForm, 'radio_2', 'setRadio_2')" 
            [disabled]="esFormularioSoloLectura"></app-input-radio>
      </div>

      <div>
        <label>Indique si durante los últimos doce meses ha importado temporalmente 
          mercancías y que, al menos el 80% de las importaciones temporales de insumos realizadas 
          durante el mismo período fueron transformadas y retornadas, retornadas en su mismo estado,
           transferidas, destruidas, o se les prestó un servicio</label>
        <app-input-radio [radioOptions]="radioOpcions" [isBold]="true" formControlName="radio_3"
            [layout]="'horizontal'" (change)="setValoresStore(solicitudForm, 'radio_3', 'setRadio_3')" 
            [disabled]="esFormularioSoloLectura"></app-input-radio>
      </div>

    </div>
    <ng-titulo titulo="Operaciones virtuales"></ng-titulo>
    <div class="col-md-12">
      <ng-alert [CONTENIDO]="TEXTOS.TEXTO_OPERACIONES_VIRTUALES" [CUSTOMECLASS]="infoAlert"></ng-alert>
    </div>
    <div class="col-md-12">
      <label class="form-label text-justify">
        Para descargar plantilla del archivo de excel de click
        <a [href]="" target="_blank" class="text-primary fw-bold"
          (click)="esFormularioSoloLectura ? $event.preventDefault() : null"
          [class.disabled]="esFormularioSoloLectura">aquí</a>.
      </label>
      <div class="row mt-4 mb-4">
        <div class="col-md-8">
          <button type="button" for="archivoMedicamentos" class="file-upload" (click)="activarSeleccionArchivo()"
            [disabled]="esFormularioSoloLectura">
            Elgir archivo
          </button>
          <span class="ml-2">{{ elgirDeArchivo }}</span>
          <input type="file" id="archivoMedicamentos" (change)="onCambioDeArchivo($event)" class="file-upload"
            style="display: none" />
        </div>
        <div class="col-md-4 d-flex justify-content-end">
          <button type="button" class="btn btn-default" (click)="cargarProveedores()"
            [disabled]="esFormularioSoloLectura">
            Cargar Proveedores
          </button>
        </div>
      </div>
      <label class="form-label text-justify">
        Proveedores existentes actualmente.
      </label>
      <div class="row">
        <div class="alert alert-info">
          <label style="font-weight: normal">
            <input type="checkbox" formControlName="manifiesto" (change)="
                setValoresStore(solicitudForm, 'manifiesto', 'setManifiesto')"/>
            {{ TEXTOS.TEXTO_PROVEEDORES_EXISTENTES_ACTUALMENTE }}
          </label>
        </div>
      </div>
    </div>
  </form>
</div>

<!-- Confirmar Modal -->
@if (confirmarNotificacion) {
<section>
  <lib-notificaciones [notificacionInput]="confirmarNotificacion">
  </lib-notificaciones>
</section>
}

<!-- Error Modal -->
@if (errorNotificacion) {
<section>
  <lib-notificaciones [notificacionInput]="errorNotificacion">
  </lib-notificaciones>
</section>
}
