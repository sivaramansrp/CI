<ng-titulo titulo="Enlace Operativo" />
<div class="row">
  <div class="col-md-12">
    <ng-table
      [commonTableHeader]="enlaceHeaderData"
      [commonTableBody]="enlanceBodyData"
    ></ng-table>
    <nav aria-label="Page navigation example">
      <ul class="pagination justify-content-center">
        <li class="page-item"><a class="page-link" href="#">Anterior</a></li>
        <li class="page-item"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">Siguiente</a></li>
      </ul>
    </nav>
  </div>
  <div class="row" style="text-align: right">
    <div>
      <button
        type="button"
        class="btn btn-primary ms-2"
        data-bs-toggle="modal"
        data-bs-target="#modalAgregar"
        (click)="abrirModal()"
      >
        Agregar
      </button>
      <button type="button" class="btn btn-default me-3">Modificar</button>
      <button type="button" class="btn btn-danger">Eliminar</button>
    </div>
  </div>
</div>

<div class="container mt-4">
  <div
    class="modal fade"
    id="modalAgregar"
    tabindex="-1"
    aria-labelledby="modalAgregarLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title">Instalaciones</h4>
        </div>
        <div class="modal-body">
          <form [formGroup]="represtantante">
            <H6>*Registro Federal de Contribuyentes:</H6>
            <div class="row">
              <div class="col-md-4">
                <div class="form-group">
                  <input
                    class="form-control"
                    id="resigtroReprestantante"
                    formControlName="resigtroReprestantante"
                    type="text"
                    (change)="setValoresStore(represtantante,'resigtroReprestantante', 'setResigtroReprestantante')"
                  />
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="rfcReprestantante">RFC:</label>
                  <input
                    class="form-control"
                    id="rfcReprestantante"
                    formControlName="rfcReprestantante"
                    type="text"
                    (change)="setValoresStore(represtantante,'rfcReprestantante', 'setRfcReprestantante')"
                  />
                </div>
              </div>

              <div class="col-md-4 d-flex align-items-center">
                <div class="btn-group">
                  <button class="btn btn-default" type="button">Buscar</button>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="nombreReprestante">Nombre:</label>
                  <input
                    class="form-control"
                    id="nombreReprestante"
                    formControlName="nombreReprestante"
                    type="text"
                    (change)="setValoresStore(represtantante,'nombreReprestante', 'setNombreReprestante')"
                  />
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="apellidoPaterno"
                    >Apellido Paterno:</label
                  >
                  <input
                    class="form-control"
                    id="apellidoPaterno"
                    formControlName="apellidoPaterno"
                    type="text"
                  />
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="apellidoMaterno"
                    >Apellido Materno:</label
                  >
                  <input
                    class="form-control"
                    id="apellidoMaterno"
                    formControlName="apellidoMaterno"
                    type="text"
                  />
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-8">
                <div class="form-group">
                  <label class="form-label" for="cuidad"
                    >Cuidad o Estado de Residencia</label
                  >
                  <input
                    class="form-control"
                    id="cuidad"
                    formControlName="cuidad"
                    type="text"
                  />
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="cargo">Cargo o Puesto</label>
                  <input
                    class="form-control"
                    id="cargo"
                    formControlName="cargo"
                    type="text"
                  />
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="telefono">Teléfono:</label>
                  <input
                    class="form-control"
                    id="telefono"
                    formControlName="telefono"
                    type="text"
                  />
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="correo"
                    >Correo Electrónico:</label
                  >
                  <input
                    class="form-control"
                    id="correo"
                    formControlName="correo"
                    type="text"
                  />
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="suplente">Suplente</label>
                  <div class="form-check-input-container">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      value=""
                      id="suplente"
                      formControlName="suplente"
                    />
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer custom-footer justify-content-center">
          <button type="button" class="btn btn-primary">Agregar</button>
          <button
            type="button"
            class="btn btn-default"
            data-bs-dismiss="modal"
            #closeModal
          >
            Cerrar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
