<div class="container mt-5">
  <h4>Pago de derechos</h4>
  <div class="row">
    <div class="col-md-6">
      <label for="claveReferencia">Clave de referencia:</label>
      <input id="claveReferencia" type="text" class="form-control" [(ngModel)]="pagoDerechos.claveReferencia" />
    </div>
    <div class="col-md-6">
      <label for="numeroOperacion">Número de operación:</label>
      <input id="numeroOperacion" type="text" class="form-control" [(ngModel)]="pagoDerechos.numeroOperacion" />
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-md-6">
      <label for="cadenaDependencia">Cadena de la dependencia:</label>
      <input id="cadenaDependencia" type="text" class="form-control" [(ngModel)]="pagoDerechos.cadenaDependencia" />
    </div>
    <div class="col-md-6">
      <label for="banco">Banco:</label>
      <select id="banco" class="form-control" [(ngModel)]="pagoDerechos.banco">
        <option value="" disabled selected>Seleccione un valor</option>
        <option *ngFor="let banco of bancos" [value]="banco">{{ banco }}</option>
      </select>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col-md-6">
      <label for="llavePago">Llave de pago:</label>
      <input id="llavePago" type="text" class="form-control" [(ngModel)]="pagoDerechos.llavePago" />
    </div>
    <div class="col-md-3">
      <label for="fechaPago">Fecha de pago:</label>
      <input id="fechaPago" type="date" class="form-control" [(ngModel)]="pagoDerechos.fechaPago" />
    </div>
    <div class="col-md-3">
      <label for="importePago">Importe de pago:</label>
      <input id="importePago" type="text" class="form-control" [(ngModel)]="pagoDerechos.importePago" />
    </div>
  </div>
  <div class="row mt-4">
    <div class="col-md-12">
        <div class="pull-right">
      <button class="btn btn-primary" (click)="submitPagoDerechos()"> Borrar datos del pago</button>
    </div>
    </div>
  </div>
</div>
