<form [formGroup]="registroForm" (ngSubmit)="validarDestinatarioFormulario()">
  <ng-container>
    <div class="mt-5">
      <label class="label-spacing">{{solicitudEnum.MODALIDAD_SOCIO_COMERCIAL}}</label>
      <label class="label-spacing">{{ solicitudEnum.RUBRO_MENSAJERIA }}</label>
    </div>
    <ng-titulo titulo="Aviso Único de Renovación en el Registro en el Esquema de Certificación de Empresas" />
    <div class="row">
      <label class="label-spacing">{{solicitudEnum.DATOS_REGISTRO}}</label>
    </div>
    <div class="row mt-5">
      <div class="col-md-8">
        <label>Número de oficio*:</label>
        <input type="text" class="form-control gris-color" readonly required />
      </div>
    </div>
    <div class="row mt-5 mb-5">
      <div class="col-md-4">
        <input-fecha [datos]="fechaInicialInput" class="disabled-input-fecha"></input-fecha>
      </div>
      <div class="col-md-4">
        <input-fecha [datos]="fechaFinalInput" class="disabled-input-fecha"></input-fecha>
      </div>
    </div>
    <div class="row mt-5"></div>
    <div class="row mt-5"></div>
    <div class="row mt-5">
      <div class="col-md-4">
        <input-fecha [setFecha]="registroForm.get('fechaPago')?.value" [datos]="fechaPagoInput" (valorCambiado)="cambioFechaPago($event)"></input-fecha>
      </div>
      <div class="col-md-4">
        <label>Monto en moneda nacional*:</label>
        <input type="text" class="form-control" formControlName="monedaNacional" (change)=" setValoresStore(registroForm, 'monedaNacional', 'setMonedaNacional')" />
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-4">
        <label>Número de operación bancaria*:</label>
        <input type="number" class="form-control" formControlName="numeroOperacion" (change)=" setValoresStore(registroForm, 'numeroOperacion', 'setNumeroOperacion')" />
      </div>
      <div class="col-md-4">
        <label>Llave de pago*:</label>
        <input type="text" class="form-control" formControlName="llave" (change)=" setValoresStore(registroForm, 'llave', 'setLlave')" />
      </div>
    </div>
    <div class="row mt-5">
      <div class="alert alert-info">
        <label style="font-weight: normal">
          <input type="checkbox" formControlName="manifiesto1" (change)=" setValoresStore(registroForm, 'manifiesto1', 'setManifiesto1')">{{ solicitudEnum.MANIFIESTO_1 }}
        </label>
      </div>
    </div>
    <div class="row mt-5">
      <div class="alert alert-info">
        <label style="font-weight: normal">
          <input type="checkbox" formControlName="manifiesto2" (change)=" setValoresStore(registroForm, 'manifiesto2', 'setManifiesto2')">{{ solicitudEnum.MANIFIESTO_2 }}
        </label>
      </div>
    </div>
    <div class="row mt-5">
      <div class="alert alert-info">
        <label style="font-weight: normal">
          <input type="checkbox" formControlName="manifiesto3" (change)=" setValoresStore(registroForm, 'manifiesto3', 'setManifiesto3')">{{ solicitudEnum.MANIFIESTO_3 }}
        </label>
      </div>
    </div>
  </ng-container>
</form>
