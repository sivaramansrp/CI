<div class="container">
  <form [formGroup]="avisoFormulario">
    <ng-container formGroupName="adaceFormulario">
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="adace" class="form-label">ADACE:</label>
          <input class="form-control" [ngClass]="isValid(adaceFormulario, 'adace') ? 'required' : ''" type="text" formControlName="adace" name="adace" id="adace" (change)="setValoresStore(avisoFormulario, 'adace', 'setAvisoFormularioAdace')" readonly />
        </div>
      </div>
    </ng-container>
    <!-- second section -->
    <ng-titulo titulo="Datos de la empresa IMMEX que presenta la documentación complementaria del aviso" />
    <ng-container formGroupName="datosEmpresa">
      <div class="row mb-3">
        <div class="col-md-4 text-end">
          <label for="valorProgramaImmex" class="form-label mb-0"> Número de programa IMMEX <span class="require">*</span>: </label>
        </div>
        <div class="col-md-4">
          <input id="valorProgramaImmex" name="valorProgramaImmex" class="form-control" [ngClass]="isValid(datosEmpresa, 'valorProgramaImmex') ? 'required' : ''" type="text" maxlength="9" formControlName="valorProgramaImmex" (keyup)="avisoComponent.sanitizeAlphanumeric(datosEmpresa,'valorProgramaImmex',$event)" (change)="setValoresStore(datosEmpresa, 'valorProgramaImmex', 'setAvisoFormularioValorProgramaImmex')" />
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-4 text-end">
          <label for="valorAnioProgramaImmex" class="form-label mb-0"> Año de programa IMMEX <span class="require">*</span>: </label>
        </div>
        <div class="col-md-4">
          <input id="valorAnioProgramaImmex" name="valorAnioProgramaImmex" class="form-control" type="text" maxlength="4" formControlName="valorAnioProgramaImmex" [ngClass]="isValid(datosEmpresa, 'valorAnioProgramaImmex') ? 'required' : ''" (keyup)="avisoComponent.sanitizeAlphanumeric(datosEmpresa,'valorAnioProgramaImmex',$event)" (change)="setValoresStore(datosEmpresa, 'valorAnioProgramaImmex', 'setAvisoFormularioValorAnioProgramaImmex')" />
        </div>
      </div>
    </ng-container>
    <!-- Third section -->
    <ng-titulo titulo="Datos de la ADACE que asistió a la destrucción" />
    <ng-container formGroupName="datosAdace">
      <div class="row">
        <div class="col-md-12">
          <div class="col-md-3"> ¿Acudió la ADACE? </div>
          <div class="col-md-3">
            <app-input-radio [radioOptions]="radioOpcions" formControlName="tipoBusqueda" [layout]="'horizontal'" (change)="setValoresStore(datosAdace, 'tipoBusqueda', 'setAvisoFormularioTipoBusqueda')"></app-input-radio>
          </div>
        </div>
      </div>
      <br>
      <div class="row">
        <div class="col-md-12">
          <div class="col-md-4">
            <app-catalogo-select [catalogo]="optoinAdace" [label]="'ADACE que levanta el acta'" [required]="true" [tooltipQuestionCircle]="true" id="levantaActa" formControlName="levantaActa" [isDisabled]="soloLectura" [placeholder]="'Selecciona un valor'" [ngClass]="isValid(datosAdace,'levantaActa') ? 'required' : ''" (change)="setValoresStore(datosAdace, 'levantaActa', 'setAvisoFormularioLevantaActa')"></app-catalogo-select>
          </div>
        </div>
      </div>
    </ng-container>
    <ng-titulo titulo="Datos de las mercancías destruídas" />
    <div class="row">
      <app-tabla-dinamica [tipoSeleccionTabla]="tablaSeleccion.CHECKBOX" [configuracionTabla]="tablaDeDatos.encabezadas" [datos]="tablaDeDatos.datos" (listaDeFilaSeleccionada)="filaSeleccionada($event)"></app-tabla-dinamica>
      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-primary ms-3" (click)="datosDelAviso()" [disabled]="soloLectura"> Agregar </button>
        <button type="button" class="btn btn-danger ms-3" (click)="eliminarMercancia()" [disabled]="soloLectura"> Eliminar </button>
      </div>
    </div>
    <ng-container formGroupName="adaceForm" *ngIf="esPopupAbierto">
      <div class="modal fade" id="datosAviso" tabindex="-1" #datosAviso aria-labelledby="datosAviso" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
          <div class="modal-content">
            <div class="modal-body">
              <ng-titulo titulo="Datos de la destrucción en relación con la cual se presenta el Acta de Hechos" />
              <div class="row">
                <div class="col-md-4 mb-3">
                  <label>ID de transacción de VUCEM:</label>
                  <input type="text" class="form-control" id="transaccionId" formControlName="transaccionId" (change)="setValoresStore(adaceForm, 'transaccionId', 'setAvisoFormularioTransaccionId')" />
                </div>
              </div>
              <ng-titulo titulo="Datos de las mercancías destruídas" />
              <div class="row">
                <div class="col-md-4 mb-3">
                  <label>Cantidad*:</label>
                  <input type="text" class="form-control" id="cantidad" formControlName="cantidad" [ngClass]="isValid(adaceForm,'cantidad') ? 'required' : ''" (change)="setValoresStore(adaceForm, 'cantidad', 'setAvisoFormularioCantidad')" />
                </div>
                <div class="col-md-4 mb-3">
                  <label>Peso (Kg)*:</label>
                  <input type="text" class="form-control" id="peso" formControlName="peso" [ngClass]="isValid(adaceForm,'peso') ? 'required' : ''" (change)="setValoresStore(adaceForm, 'peso', 'setAvisoFormularioPeso')" />
                </div>
                <div class="col-md-4 ">
                  <app-catalogo-select class="unidadMedida" [label]="'Unidad de medida'" [catalogo]="unidadMedida" [required]="true" id="unidadMedida" formControlName="unidadMedida" [isDisabled]="soloLectura" [ngClass]="isValid(adaceForm,'unidadMedida') ? 'required' : ''" (change)="setValoresStore(adaceForm, 'cilindros', 'setAvisoFormularioUnidadMedida')"></app-catalogo-select>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-6">
                    <div>
                      <label>Descripción*:</label>
                      <input type="text" class="form-control" formControlName="descripcion" id="descripcion" maxlength="250" [ngClass]="isValid(adaceForm,'descripcion') ? 'required' : ''" (change)="setValoresStore(adaceForm,'descripcion', 'setAvisoFormularioDescripcion')">
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer custom-footer mt-4 justify-content-end">
              <button type="submit" class="btn btn-primary" (click)="agregarMercancia()" [disabled]="soloLectura"> Agregar </button>
              <button type="button" class="btn btn-danger" data-bs-dismiss="modal" #closeMercancia [disabled]="soloLectura"> Cancelar </button>
            </div>
          </div>
        </div>
      </div>
    </ng-container>
  </form>
</div>
