<ng-titulo titulo="Aviso Único de Renovación en el Registro en el Esquema de Certificación de Empresas" />
<label>{{solicitudEnum.MODALIDAD_SOCIO_COMERCIAL}}</label>
<br />
<br />
<label>{{ solicitudEnum.RUBRO_MENSAJERIA }}</label>
<br />
<br />
<label>{{ solicitudEnum.DATOS_REGISTRO }}</label>
<div class="row mt-5">
  <div class="col-md-8">
    <label>Número de oficio*:</label>
    <input type="text" class="form-control gris-color" readonly required />
  </div>
</div>
<div class="row mt-5">
  <div class="col-md-4">
    <input-fecha [datos]="fechaInicialInput" class="gris-color"></input-fecha>
  </div>
  <div class="col-md-4">
    <input-fecha [datos]="fechaFinalInput" class="gris-color"></input-fecha>
  </div>
</div>
<ng-titulo titulo="Pago de derechos" />
<div class="row mt-5">
  <div class="col-md-6">
    <label>Clave de referencia:</label>
    <input type="text" class="form-control gris-color" readonly required />
  </div>
  <div class="col-md-6">
    <label>Número de operación:</label>
    <input type="text" class="form-control" />
  </div>
</div>
<div class="row mt-5">
  <div class="col-md-6">
    <label>Cadena de la dependencia:</label>
    <input type="text" class="form-control gris-color" readonly required />
  </div>
  <div class="col-md-6">
    <app-catalogo-select [catalogo]="bancoCatalogo.catalogos" [label]="'Banco'" ></app-catalogo-select>
  </div>
</div>
<div class="row mt-5">
  <div class="col-md-4">
    <label>Llave de pago:</label>
    <input type="text" class="form-control" />
  </div>
  <div class="col-md-4">
    <input-fecha [datos]="fechaPagoInput"></input-fecha>
  </div>
  <div class="col-md-4">
    <label>Importe de pago:</label>
    <input type="text" class="form-control gris-color" readonly />
  </div>
</div>
<div class="row mt-5">
  <div class="col-md-12 mt-5 d-flex justify-content-end">
    <button type="button" class="btn btn-danger">Borrar datos del pago</button>
  </div>
</div>
<div class="row mt-5">
  <div class="alert alert-info">
    <label style="font-weight: normal">
      <input type="checkbox">{{ solicitudEnum.MANIFIESTO_1 }} </label>
  </div>
</div>
<div class="row mt-5">
  <div class="alert alert-info">
    <label style="font-weight: normal">
      <input type="checkbox">{{ solicitudEnum.MANIFIESTO_2 }}</label>
  </div>
</div>
