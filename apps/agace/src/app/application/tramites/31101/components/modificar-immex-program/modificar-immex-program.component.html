<div class="container">
  <form [formGroup]="modificarImmexProgramForm">
    <div class="row">
      <div class="col-md-4 mt-4">
        <label class="form-label text-start"
          >Instalaciones principales *:</label
        >
        <app-input-radio
          [radioOptions]="sinoOpcion.radioOptions"
          [isRequired]="sinoOpcion.isRequired"
          [layout]="'horizontal'"
          [gap]="'50px'"
        ></app-input-radio>
      </div>
      <div class="col-md-4 mt-4">
        <label class="form-label text-start" for=""
          >Municipio o alcaldía *:</label
        >
        <input type="text" class="form-control" name="" id="" />
      </div>
      <div class="col-md-4 mt-4"></div>
      <div class="col-md-4 mt-4">
        <app-catalogo-select
          [catalogo]="tipoDeInstalacion.catalogos"
          [label]="tipoDeInstalacion.labelNombre"
          [placeholder]="tipoDeInstalacion.primerOpcion"
          [required]="true"
          [isDisabled]="false"
          name="tipoDeInstalacion"
          id="tipoDeInstalacion"
        ></app-catalogo-select>
      </div>
      <div class="col-md-4 mt-4">
        <label class="form-label text-start" for=""
          >Entidad federativa *:</label
        >
        <input type="text" class="form-control" name="" id="" />
      </div>
      <div class="col-md-4 mt-4">
        <label class="form-label text-start" for=""
          >Registro ante S E/ S A T *:</label
        >
        <input type="text" class="form-control" name="" id="" />
      </div>
      <div class="col-md-4 mt-4">
        <label class="form-label text-start" for=""
          >Colonia, calle y número *:</label
        >
        <input type="text" class="form-control" name="" id="" />
      </div>
      <div class="col-md-4 mt-4">
        <label class="form-label text-start" for="">Código postal *:</label>
        <input type="text" class="form-control" name="" id="" />
      </div>
      <div class="col-md-4 mt-4"></div>
      <div class="col-md-4 mt-4">
        <label class="form-label text-start">Proceso productivo *:</label>
        <app-input-radio
          [radioOptions]="sinoOpcion.radioOptions"
          [isRequired]="sinoOpcion.isRequired"
          [layout]="'horizontal'"
          [gap]="'50px'"
        ></app-input-radio>
      </div>

      <div class="col-md-12">
        <div class="d-flex justify-content-end">
          <button
            type="button"
            id="cancelar"
            class="btn btn-danger ms-3"
            data-bs-dismiss="modal"
            #closeModal
          >
            Cancelar
          </button>

          <button
            type="button"
            id="Iceptar"
            class="btn btn-primary ms-3"
            data-bs-dismiss="modal"
            #closeModal
          >
            Aceptar
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
