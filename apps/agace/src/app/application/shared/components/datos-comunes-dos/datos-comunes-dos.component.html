
<div class="row mb-3">
    <div class="col-md-6">
        <app-catalogo-select
            [placeholder]="'Seleccione un valor'"
            [catalogo]="comboBimestresIDC">
        </app-catalogo-select>
    </div>
</div>
<div class="row mb-3">
    <div class="col-md-12">
        <p class="fw-bold">
            Indique todos los domicilios registrados ante el FC del solicitante e
            indique aquellos en que se desarrollen actividades relacionadas con su
            proceso productivo y/o la prestación de servicios.
        </p>
    </div>
</div>
<ng-alert [CONTENIDO]="TEXTOS.alerta"></ng-alert>
<div class="row mt-5">
    <div class="col-md-12">
        <app-tabla-dinamica 
            [configuracionTabla]="instalacionesPrincipalesTabla"
            [datos]="instalacionesPrincipalesTablaDatos" 
            [tipoSeleccionTabla]="tablaSeleccionCheckbox">
        </app-tabla-dinamica>
    </div>
    <div class="d-flex justify-content-end mt-3 mb-4">
        <button class="btn btn-primary me-2">Agregar</button>
        <button class="btn btn-danger me-2">Modificar</button>
        <button class="btn btn-default me-2">Eliminar</button>
    </div>
</div>
