<div class="conatiner">
    <form [formGroup]="represtantanteLegalForma">
        <div class="row mb-3">  
            <formas-dinamicas 
                [formularioTitulo]="'Representante Legal'"
                [forma]="represtantanteLegalFormGroup" 
                [formularioDatos]="represtantanteLegalDatos"
                >
            </formas-dinamicas>
        </div>
    </form>
    <div class="row mb-3">
        <ng-titulo titulo="Enlace Operativo" />
        <h5 class="mb-3">Enlace Operativo</h5>
        <app-tabla-dinamica
            [configuracionTabla]="configuracionTabla"
            [datos]="enlaceOperativoDatos"
            [tipoSeleccionTabla]="checkbox">
        </app-tabla-dinamica>
        <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-primary me-2" (click)="abrirModal(template)">
                Agregar
            </button>
            <button class="btn btn-danger me-2" type="button">
                Modificar
            </button>
            <button class="btn btn-default" type="button">
                Eliminar
            </button>
        </div>
    </div>
    <div class="row mb-3">
        <ng-titulo titulo="Personas para oir y recibir notificaciones" />
        <h5 class="mb-3">Personas para oir y recibir notificaciones</h5>
        <app-tabla-dinamica
            [configuracionTabla]="personasConfiguracionTabla"
            [datos]="personaParas">
        </app-tabla-dinamica>
    </div>
</div>


<!-- Modal -->
<ng-template #template>
    <div class="modal-header">
      <h4 class="modal-title pull-left">Agregar</h4>
    </div>
    <div class="modal-body">
        <form [formGroup]="enlaceOperativoForm">
          <h6>*Registro Federal de Contribuyentes:</h6>
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <input
                  class="form-control"
                  id="resigtro"
                  formControlName="resigtro"
                  type="text"
                />
              </div>
            </div>
            <div class="col-md-8">
                <div class="btn-group">
                  <button class="btn btn-default" type="button">Buscar</button>
                </div>
              </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="rfc">RFC:</label>
                <input
                  class="form-control"
                  id="rfc"
                  formControlName="rfc"
                  type="text"
                />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="nombre">Nombre:</label>
                <input
                  class="form-control"
                  id="nombre"
                  formControlName="nombre"
                  type="text"
                />
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="apellidoPaterno"
                  >Apellido Paterno:</label
                >
                <input
                  class="form-control"
                  id="apellidoPaterno"
                  formControlName="apellidoPaterno"
                  type="text"
                />
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="apellidoMaterno"
                  >Apellido Materno:</label
                >
                <input
                  class="form-control"
                  id="apellidoMaterno"
                  formControlName="apellidoMaterno"
                  type="text"
                />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-8">
              <div class="form-group">
                <label class="form-label" for="cuidad"
                  >Cuidad o Estado de Residencia</label
                >
                <input
                  class="form-control"
                  id="cuidad"
                  formControlName="cuidad"
                  type="text"
                />
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="cargo">Cargo o Puesto</label>
                <input
                  class="form-control"
                  id="cargo"
                  formControlName="cargo"
                  type="text"
                />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="telefono">Teléfono:</label>
                <input
                  class="form-control"
                  id="telefono"
                  formControlName="telefono"
                  type="text"
                />
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="correo"
                  >Correo Electrónico:</label
                >
                <input
                  class="form-control"
                  id="correo"
                  formControlName="correo"
                  type="text"
                />
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="suplente">Suplente</label>
                <div class="form-check-input-container">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    value=""
                    id="suplente"
                    formControlName="suplente"
                  />
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer d-flex justify-content-end">
        <button type="button" class="btn btn-primary">
          Aceptar
        </button>
        <button type="button" class="btn btn-danger" (click)="modalRef?.hide()">
          Cancelar
        </button>
      </div>
</ng-template>
