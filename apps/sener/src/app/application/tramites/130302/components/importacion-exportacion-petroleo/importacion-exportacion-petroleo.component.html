<form [formGroup]="form">

  <formas-dinamicas 
  formularioTitulo="Permiso a prorrogar"
  [forma]="ninoFormGroup"
  [formularioDatos]="informacionFormData"
  [estado]="exportarIlustracionesState"
  (emitirCambioDeValor)="establecerCambioDeValor($event)"
  ></formas-dinamicas>
   
    <ng-titulo titulo="Solicitud prórroga para permisos de importación/exportación"/>
    <p>Número de permiso: 1702C624000390</p>
    <ng-titulo titulo="Prorrogar" />

    <app-tabla-dinamica
    [configuracionTabla]="configuracionTabla"
    [datos]="tercerosProd"
    [tipoSeleccionTabla]="tipoSeleccionTabla.CHECKBOX">
    </app-tabla-dinamica>

    <div class="datos-prorroga">
        <ng-titulo titulo="Datos de la prórroga" />
      
      <div>
        <label for="saldoDisponible">Saldo disponible aproximado a importar/exportar:</label>
        <input id="saldoDisponible" type="text" formControlName="saldoDisponible" 
        (change)="setValoresStore(form,'saldoDisponible', 'setsaldoDisponible')"/>
        
      </div>
      <div>
        <label for="prorrogaDel">Prórroga del:</label>
        <input id="prorrogaDel" type="date" formControlName="prorrogaDel"
        (change)="setValoresStore(form,'prorrogaDel', 'setprorrogaDel')" />
      </div>
      <div>
        <label for="prorrogaAl">Prórroga al:</label>
        <input id="prorrogaAl" type="date" formControlName="prorrogaAl"
        (change)="setValoresStore(form,'prorrogaAl', 'setprorrogaAl')" />
        <!-- <input-fecha [datos]="fechaInicioInput" formControlName="prorrogaAl"
                    (valorCambiado)="onFechaCambiada($event)"
                    [setFecha]="form.get('prorrogaAl')?.value"></input-fecha> -->
      </div>
      <div>
       
        <label for="motivoJustificacion">Motivo y/o Justificación*:</label>
        <textarea id="motivoJustificacion" formControlName="motivoJustificacion" class="form-control"
        (change)="setValoresStore(form,'motivoJustificacion', 'setmotivoJustificacion')" ></textarea>
      </div>
      <div>
<label for="motivoJustificacion">Otras declaraciones:</label>
        <textarea id="otrasDeclaraciones" formControlName="otrasDeclaraciones" class="form-control " 
        (change)="setValoresStore(form,'otrasDeclaraciones', 'setotrasDeclaraciones')"></textarea>
      </div>
    </div>
    <ng-titulo titulo="Manifiesto de aceptación" />
    <ng-alert [CONTENIDO]="aduanaAlert"></ng-alert>
</form>
