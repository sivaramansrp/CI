<form [formGroup]="form">
    <ng-titulo titulo="Permiso a prorrogar" />

    <div class="row">
        <div class="col-md-4">
            <label class="form-label" for="folioTramite">Folio trámite:</label>
            <input type="text" class="form-control" id="folioTramite" fromControlName="folioTramite" name="folioTramite">
        </div>
        <div class="col-md-4">
            <label class="form-label" for="tipoSolicitud">Tipo de solicitud:</label>
            <input type="text" class="form-control" id="tipoSolicitud" fromControlName="tipoSolicitud" name="tipoSolicitud">
        </div>
        <div class="col-md-4">
            <label class="form-label" for="regimen">Régimen:</label>
            <input type="text" class="form-control" id="regimen" fromControlName="regimen" name="regimen">
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <label class="form-label" for="clasificacionRegimen">Clasificación del régimen:</label>
            <textarea id="clasificacionRegimen" formControlName="clasificacionRegimen" class="form-control custom-textarea"></textarea>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="periodoVigencia">Periodo de vigencia:</label>
            <input type="text" class="form-control" id="periodoVigencia" fromControlName="periodoVigencia" name="periodoVigencia">
        </div>
        <div class="col-md-3">
            <label class="form-label" for="unidadMedida">Unidad de medida:</label>
            <input type="text" class="form-control" id="unidadMedida" fromControlName="unidadMedida" name="unidadMedida">
        </div>
    </div>

    <div class="row">
        <div class="col-md-4">
            <label for="fraccionArancelaria">Fracción arancelaria:</label>
            <input id="fraccionArancelaria" formControlName="fraccionArancelaria" type="text" class="form-control" />
        </div>
        <div class="col-md-4">
            <label for="cantidadAutorizada">Cantidad autorizada:</label>
            <input id="cantidadAutorizada" formControlName="cantidadAutorizada" type="text" class="form-control" />
        </div>
        <div class="col-md-4">
            <label for="valorAutorizado">Valor autorizado:</label>
            <input id="valorAutorizado" formControlName="valorAutorizado" type="text" class="form-control" />
        </div>
    </div>

    <div class="row">
        <div class="col-md-2">
            <label for="nico">NICO:</label>
            <input id="nico" formControlName="nico" type="text" class="form-control" />
        </div>
        <div class="col-md-6">
            <label for="descripcionNico">Descripción NICO:</label>
            <textarea id="descripcionNico" formControlName="descripcionNico" class="form-control custom-textarea" style="height: 80px;"></textarea>
        </div>
        <div class="col-md-4">
            <label for="acotacion">Acotación:</label>
            <textarea id="acotacion" formControlName="acotacion" class="form-control custom-textarea" ></textarea>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <label for="permisoValidoDesde">Permiso válido desde:</label>
            <input id="permisoValidoDesde" formControlName="permisoValidoDesde" type="date" class="form-control" />
        </div>
        <div class="col-md-6">
            <label for="permisoValidoHasta">Permiso válido hasta:</label>
            <input id="permisoValidoHasta" formControlName="permisoValidoHasta" type="date" class="form-control" />
        </div>
    </div>
    <ng-titulo titulo="Solicitud prórroga para permisos de importación/exportación"/>
    <p>Número de permiso: 1702C624000390</p>
    <ng-titulo titulo="Prorrogar" />

    <app-tabla-dinamica
[configuracionTabla]="configuracionTabla"
[datos]="tercerosProd"
[tipoSeleccionTabla]="tipoSeleccionTabla.CHECKBOX">
</app-tabla-dinamica>
</form>
