<div class="container">
  <form [formGroup]="form">
    <ng-titulo titulo="Datos de la mercancía"></ng-titulo>
    <div class="row">
      <div class="col-md-12">
        <div class="form-group radioOpciones">
          <label class="mb-5" for="plazo">Plazo*:</label>
          <app-input-radio [radioOptions]="productoOpciones" formControlName="plazo" [isRequired]="true"
            (change)="setValoresStore(form, 'plazo', 'setProducto')" [layout]="'vertical'"></app-input-radio>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-12">
        <label for="descripcion" class="form-label">Descripción de la mercancía*:</label>
        <textarea id="descripcion" class="form-control descripcion-text-box" placeholder="Descripción de la mercancía"
          rows="8" formControlName="descripcion"
          (change)="setValoresStore(form, 'descripcion', 'setDescripcion')"></textarea>
        <div *ngIf="esInvalido('descripcion')" class="text-danger">
          <small *ngIf="form.controls['descripcion'].errors?.['required']">
            La descripción es obligatoria.
          </small>
          <small *ngIf="form.controls['descripcion'].errors?.['minlength']">
            Debe tener al menos 10 caracteres.
          </small>
          <small *ngIf="form.controls['descripcion'].errors?.['maxlength']">
            No puede exceder 500 caracteres.
          </small>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <app-catalogo-select id="fraccion" [label]="'Fracción arancelaria'" [catalogo]="mercanciaCatalogoArray[0]"
          [required]="true" [placeholder]="'Selecciona un valor'" [isDisabled]="false"
          (selectionChange)="onFraccionChange($event)" formControlName="fraccion">
        </app-catalogo-select>
      </div>

      <div class="col-md-6">
        <app-catalogo-select id="umt" [label]="'Unidad de medida de la tarifa (UMT)'" [catalogo]="unidadCatalogo"
          [required]="true" [placeholder]="'Selecciona un valor'" [isDisabled]="false" formControlName="unidadMedida"
          (selectionChange)="onUmtChange($event)">
        </app-catalogo-select>
      </div>

    </div>
    <div class="row mt-3">
      <div class="col-md-6">
        <app-catalogo-select id="nico" [label]="'NICO'" [catalogo]="nicoCatalogoArray" [required]="true"
          formControlName="nico" [placeholder]="'Selecciona un valor'" [isDisabled]="false"
          (selectionChange)="onNicoChange($event)">
        </app-catalogo-select>
      </div>
    </div>

    <div class="row">
      <div class="col-md-6">
        <label for="descripcion_nico" class="form-label">Descripción NICO:</label>
        <textarea id="descripcion_nico" class="form-control descripcion-text-box" formControlName="descripcionNico" rows="8"></textarea>

      </div>
      <div class="col-md-6">
        <label for="acotacion" class="form-label">Acotación:</label>
        <textarea id="acotacion" class="form-control descripcion-text-box" formControlName="acotacion" rows="8" ></textarea>

      </div>
    </div>
    <div class="row">
      <div class="col-md-6 form-group">
        <label class="form-label" for="cantidad">Cantidad<span class="require">*</span>:</label>
        <input class="form-control" id="cantidad" placeholder="" type="text" formControlName="cantidad"
          (change)="setValoresStore(form, 'cantidad', 'setCantidad')" />
        <div *ngIf="esInvalido('cantidad')" class="text-danger">
          <small *ngIf="form.controls['cantidad'].errors?.['required']">
            Este campo es obligatorio.
          </small>
          <small *ngIf="form.controls['cantidad'].errors?.['pattern']">
            Solo se permiten números.
          </small>
          <small *ngIf="form.controls['cantidad'].errors?.['min']">
            Debe ser mayor que 0.
          </small>
        </div>
      </div>
      <div class="col-md-6 form-group">
        <label class="form-label" for="valorFacturaUSD">Valor factura USD<span class="require">*</span>:</label>
        <input class="form-control" id="valorFacturaUSD" placeholder="" type="text" formControlName="valorFacturaUSD"
          (change)="setValoresStore(form, 'valorFacturaUSD', 'setValorPartidaUSD')" />
        <div *ngIf="esInvalido('valorFacturaUSD')" class="text-danger">
          <small *ngIf="form.controls['valorFacturaUSD'].errors?.['required']">
            Este campo es obligatorio.
          </small>
          <small *ngIf="form.controls['valorFacturaUSD'].errors?.['pattern']">
            Ingrese un valor numérico válido (ej. 100.50).
          </small>
          <small *ngIf="form.controls['valorFacturaUSD'].errors?.['min']">
            Debe ser mayor que 0.
          </small>
        </div>
      </div>
    </div>

  </form>
</div>
