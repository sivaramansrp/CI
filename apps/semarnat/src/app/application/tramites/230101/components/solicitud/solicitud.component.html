<div class="container">
  <form [formGroup]="FormSolicitud">

    <ng-titulo titulo="Datos del trámite a realizar" />
    <ng-container>
      <div class="row">
        <div class="col-md-12">
          <app-solicitud-datos [tablaHeadData]="hSolicitud" [tablaFilaDatos]="dSolicitud"></app-solicitud-datos>
        </div>
      </div>
    </ng-container>
    <ng-titulo titulo="Tipo de r&eacute;gimen" />
    <ng-container formGroupName="tipoRegimen">
      <div class="row">
        <div class="col-md-12">
          <div class="form-check">
            <input class="form-check-input me-2" type="radio" name="clave" formControlName="clave"
              value="definitivos" id="definitivos"
              (change)="setValoresStore(tipoRegimen,'clave', 'setClave')" />
            <label class="form-check-label" for="definitivos">Definitivos</label>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="form-check">
            <input class="form-check-input me-2" type="radio" name="clave" formControlName="clave"
              value="temporales" id="temporales"
              (change)="setValoresStore(tipoRegimen,'clave', 'setClave')" />
            <label class="form-check-label" for="temporales">Reexportación</label>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-titulo titulo="Aduana" />
    <ng-container formGroupName="aduanaForm">
      <div class="row">
        <div class="col-md-12">
          <label class="form-label">Aduanas de entradas (M&aacute;ximo 3 aduanas)</label>
        <crosslist [fechas]="selectRangoDias" [label]="aduanaLabel" >
        </crosslist>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="options" formControlName="tipoDeProducto" [label]="'Tipo de producto'"
            [required]="true"
            (change)="setValoresStore(aduanaForm,'tipoDeProducto', 'setTipoDeProducto');"></app-catalogo-select>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-12">
          <label class="form-label">Pa&iacute;s Origen</label>
          <crosslist [fechas]="selectRangoDias" [label]="paisLabel" >
          </crosslist>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="options" formControlName="paisDeProcedencia"
            [label]="'Pa&iacute;s de procedencia'" [required]="true"
            (change)="setValoresStore(aduanaForm,'paisDeProcedencia', 'setPaisDeProcedencia');"></app-catalogo-select>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-12">
          <label class="form-label">Destino dentro del Pa&iacute;s (Entidad federativa)</label>
          <crosslist [fechas]="selectRangoDias" [label]="destinoLabel" >
          </crosslist>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-12" *ngFor="let option of disponsibleAduanaCheckboxes; let i = index">
          <label>
            <input type="checkbox" [checked]="selectedOptions.value[i]" (change)="onCheckboxChange($event, i)" />
            {{ option.name }}
          </label>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="options" formControlName="clasificacionMercancias"
            [label]="'Clasificaci&oacute;n mercanc&iacute;as'" [required]="true"
            (change)="setValoresStore(aduanaForm,'clasificacionMercancias', 'setClasificacionMercancias');"></app-catalogo-select>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="TEXTOS.MERCANCIAS"></ng-alert>
        </div>
      </div>

    </ng-container>

    <ng-titulo titulo="Mercancía" />
    <ng-container formGroupName="mercanciaForm">
      <div class="row">
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="options" formControlName="fraccionArancelaria"
            [label]="'Fracción arancelaria'" [required]="true"
            (change)="setValoresStore(mercanciaForm,'fraccionArancelaria', 'setFraccionArancelaria')"></app-catalogo-select>
        </div>
        <div class="col-md-5">
          <div class="form-group">
            <label class="form-label" for="descFraccionArancelaria">Decripción de la fracción arancelaria*:</label>
            <input class="form-control" id="descFraccionArancelaria" placeholder="Decripción Fraccion Arancelaria"
              type="text" formControlName="descFraccionArancelaria"
              [ngClass]="isValid(mercanciaForm,'descFraccionArancelaria') ? 'required' : ''"
              (change)="setValoresStore(mercanciaForm,'descFraccionArancelaria', 'setDescFraccionArancelaria')" />
          </div>
        </div>

        <div class="col-md-3">
          <div class="form-group">
            <label class="form-label" for="cantidad">Cantidad*:</label>
            <input class="form-control" id="cantidad" placeholder="Cantidad" type="text" formControlName="cantidad"
              [ngClass]="isValid(mercanciaForm,'cantidad') ? 'required' : ''"
              (change)="setValoresStore(mercanciaForm,'cantidad', 'setCantidad')" />
          </div>
        </div>

      </div>

      <div class="row mt-5">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="cantidadLetra">Cantidad(letra):</label>
            <input class="form-control" id="cantidadLetra" placeholder="Cantidad Letra" type="text"
              formControlName="cantidadLetra" [ngClass]="isValid(mercanciaForm,'cantidadLetra') ? 'required' : ''"
              (change)="setValoresStore(mercanciaForm,'cantidadLetra', 'setCantidadLetra')" />
          </div>
        </div>
      </div>
      
    </ng-container>

    <ng-titulo titulo="Detalle" />
    <ng-container formGroupName="detalleForm">
      <div class="row">
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="options" formControlName="genero" [label]="'Gen&eacute;ro'" [required]="true"
            (change)="setValoresStore(detalleForm,'genero', 'setGenero')"></app-catalogo-select>
        </div>
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="options" formControlName="especie" [label]="'Especie'" [required]="true"
            (change)="setValoresStore(detalleForm,'especie', 'setEspecie')"></app-catalogo-select>
        </div>
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="options" formControlName="nombreComun" [label]="'Nombre com&uacute;n'"
            [required]="true"
            (change)="setValoresStore(detalleForm,'nombreComun', 'setNombreComun')"></app-catalogo-select>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-12 d-flex justify-content-end align-items-end">
          <div class="btn-group">
            <button class="btn btn-default ms-3" type="button" name="aceptar" id="agregarAduana">
              Eliminar Detelle
            </button>
            <button type="button" class="btn btn-primary ms-3" data-bs-toggle="modal">
              Agregar Detelle
            </button>
          </div>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-12">
          <label class="form-label mb-5" for="">Detalle</label>
          <ng-table [commonTableHeader]="detalle.tableHeader"
            [commonTableBody]="detalle.tableBody"></ng-table>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-12 d-flex justify-content-end align-items-end">
          <div class="btn-group">
            <button type="button" class="btn btn-default btn-space" data-bs-toggle="modal"
              data-bs-target="#modalAgregarMercancias">
              Cancelar
            </button>
            <button class="btn btn-default ms-3" type="button" name="aceptar" id="agregarAduana">
              Limpiar
            </button>
            <button type="button" class="btn btn-primary ms-3" data-bs-toggle="modal">
              Agregar
            </button>
          </div>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-12">
          <label class="form-label mb-5" for="">Mercancías</label>
          <ng-table [commonTableHeader]="mercanicias.tableHeader"
            [commonTableBody]="mercanicias.tableBody"></ng-table>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-12 d-flex justify-content-end align-items-end">
          <div class="btn-group">
            <button type="button" class="btn btn-default btn-space" data-bs-toggle="modal"
              data-bs-target="#modalAgregarMercancias">
              Modificar
            </button>
            <button class="btn btn-default ms-3" type="button" name="aceptar" id="agregarAduana">
              Eliminar
            </button>
            <button type="button" class="btn btn-primary ms-3" data-bs-toggle="modal">
              Agregar
            </button>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8">
          <app-catalogo-select [catalogo]="options" formControlName="descDelProducto" [label]="'Descripción del producto'" [required]="true"
            (change)="setValoresStore(detalleForm,'descDelProducto', 'setDescDelProducto')"></app-catalogo-select>
        </div>
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="options" formControlName="unidadDeMedida" [label]="'Unidad de medida'" [required]="true"
            (change)="setValoresStore(detalleForm,'unidadDeMedida', 'setUnidadDeMedida')"></app-catalogo-select>
        </div>
      </div>
    </ng-container>
    <ng-titulo titulo="Manifiestos y declaraciones" />
    <ng-container formGroupName="manifiestosForm">
    <div class="row">
      <div class="col-md-12">
        <span class="checkbox-align">
          <input class="form-check-input me-3" type="checkbox" value="" id="manifiestosYdesc"
            formControlName="manifiestosYdesc"
            (change)="setValoresStore(manifiestosForm,'manifiestosYdesc', 'setManifiestosYdesc')">
        </span>
        <ng-alert [CONTENIDO]="'Protesto decir verdad*'"></ng-alert>
      </div>
    </div>
    </ng-container>
  </form>
</div>
