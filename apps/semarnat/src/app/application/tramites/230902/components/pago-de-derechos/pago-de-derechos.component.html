<div class="container">
  <ng-titulo titulo="Pago de derechos" />
  <form [formGroup]="formPagoDerechos">
    <div class="form">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="claveDeReferencia">Clave de referencia</label>
            <input class="form-control" id="claveDeReferencia" type="number" placeholder="084000966"
              formControlName="claveDeReferencia" [required]="true" />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="cadenaDeLaDependencia">Cadena de la dependencia</label>
            <input class="form-control" id="cadenaDeLaDependencia" type="number" placeholder="00130090940161"
              formControlName="cadenaDeLaDependencia" [required]="true" />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <app-catalogo-select [catalogo]="this.permisoCitesService.banco" formControlName="banco" [label]="'Banco'"
              [required]="true" name="banco" (change)="onBancoSeleccion()"></app-catalogo-select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="llaveDePago">Llave de pago</label>
            <input class="form-control" id="llaveDePago" type="text" formControlName="llaveDePago" [required]="true"
              [class.is-invalid]="formPagoDerechos.get('llaveDePago')?.touched && formPagoDerechos.get('llaveDePago')?.invalid"
              (change)="onllavaDePagoChange()">
            <div class="invalid-feedback"
              *ngIf="formPagoDerechos.get('llaveDePago')?.touched && formPagoDerechos.get('llaveDePago')?.invalid">
              <span *ngIf="formPagoDerechos.get('llaveDePago')?.hasError('required')">Este campo es
                obligatorio.</span>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <input-fecha [setFecha]="formPagoDerechos.get('fechaDePago')?.value" [datos]="fechaFinalInput"
            (valorCambiado)="cambioFechaFinal($event)"
            [class.is-invalid]="formPagoDerechos.get('fechaDePago')?.touched && formPagoDerechos.get('fechaDePago')?.invalid">
          </input-fecha>
          <div class="invalid-feedback"
            *ngIf="formPagoDerechos.get('fechaDePago')?.touched && formPagoDerechos.get('fechaDePago')?.invalid">
            <span *ngIf="formPagoDerechos.get('fechaDePago')?.hasError('required')">Este campo es obligatorio.</span>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="importeDePago">Importe de pago</label>
            <input class="form-control" id="importeDePago" type="number" placeholder="672"
              formControlName="importeDePago" [required]="true" />
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
