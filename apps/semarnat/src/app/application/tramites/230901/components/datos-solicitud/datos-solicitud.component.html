<div class="container">
  <ng-titulo titulo="Datos de la solicitud" />
  <form [formGroup]="formSolicitud">
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="autorizacionesDeVidaSilvestreService.tiposDeMovimiento"
          formControlName="tipodemovimiento"
          [label]="'Tipo de movimiento'"
          [required]="true"
          name="tipodemovimiento"
          (change)="onTipoMovimientoChange()"
        ></app-catalogo-select>
      </div>
    </div>

    @if (tipoMovimientoSeleccionada) {
    <ng-titulo titulo="Régimen" />
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="autorizacionesDeVidaSilvestreService.tiposDeRegimen"
          formControlName="tipoderegimen"
          [label]="'Tipo de régimen'"
          [required]="true"
          name="tipoderegimen"
          (change)="onTipoRegimenChange()"
        ></app-catalogo-select>
      </div>
    </div>
    <ng-titulo
      [titulo]="
        solicitud230901State.tipoDeMovimiento === '2' ||
        solicitud230901State.tipoDeMovimiento === '3'
          ? 'Aduanas de salida'
          : 'Adnuana'
      "
    ></ng-titulo>
    <div class="row mt-3">
      <div class="col-md-12 mt-3">
        @if(solicitud230901State.tipoDeMovimiento==="1"){
        <h5>Aduana des entrades (Maximo 3 aduanas)</h5>
        }
        <crosslist
          [fechas]="seleccionarOrigenDelAduana"
          [botones]="aduanasBotons"
          [label]="aquandasLabel"
        ></crosslist>
      </div>
    </div>

    <div class="row mt-5">
      <h6>Mercancia*:</h6>
      <app-tabla-dinamica
        [configuracionTabla]="configuracionTabla"
        [datos]="tablaDatos"
        [tipoSeleccionTabla]="tablaSeleccion"
      ></app-tabla-dinamica>
      <nav aria-label="Page navigation example">
        <ul class="pagination justify-content-center">
          <li class="page-item"><a class="page-link" href="#">1</a></li>
        </ul>
      </nav>
      <div class="row" style="padding-bottom: 20px; text-align: right">
        <div>
          <button type="button" class="btn btn-default me-2">Modficar</button>
          <button type="button" class="btn btn-danger me-2">Eliminar</button>
          <button
            type="button"
            class="btn btn-primary me-2"
            (click)="showMercanciaFormModal()"
          >
            Agregar
          </button>
        </div>
      </div>
    </div>

    <ng-titulo titulo="Finalidad del movimiento" />
    <div class="row mt-3">
      <div class="col-md-12 mt-3">
        <crosslist
          [fechas]="seleccionarOrigenDelMovimiento"
          [botones]="movimientoBotons"
          [label]="movimientoLabel"
        ></crosslist>
      </div>
    </div>
    }
  </form>

  @if(showDatosMercanciaModal){
    <app-modal>
      <div class="datos-mercancia-container">
        <ng-titulo titulo="Datos mercancia" />
        <form [formGroup]="formMercancia">
          <div class="row">
            <div class="col-md-5">
              <app-catalogo-select
                [catalogo]="
                  autorizacionesDeVidaSilvestreService.fraccionArancelaria
                "
                formControlName="fraccionArancelaria"
                [label]="'Fracción arancelaria'"
                [required]="true"
                name="fraccionArancelaria"
              ></app-catalogo-select>
            </div>
            <div class="col-md-7">
              <div class="form-group">
                <label class="form-label" for="fraccionDescripcion"
                  >Descripción de la fracción arancelaria:</label
                >
                <input
                  class="form-control"
                  id="fraccionDescripcion"
                  formControlName="fraccionDescripcion"
                  type="text"
                />
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 justify-content-start">
              <div class="form-check mt-4">
                <input class="form-check-input" type="checkbox" value="" id="otraFraccion"
                  formControlName="otraFraccion">
                <label class="form-check-label" for="otraFraccion">Otra fracción
                </label>
              </div>
            </div>
            @if(otraFraccionSeleccionada){
              <div class="row m">
                <div class="col-md-4">
                  <label class="form-label" for="fraccionVigenteTIGIE">La Fracción debe estar vigente conforme a la TIGIE</label>
                  <input
                    class="form-control"
                    id="marca"
                    formControlName="fraccionVigenteTIGIE"
                    type="text"
                  />
                </div>
              </div>
            }
            
          </div>
          <div class="row">
            <div class="col-md-12">
              <label for="message" class="form-label">Descripción</label>
              <textarea
                id="descripcion"
                [required]="true"
                class="form-control"
                rows="10"
                formControlName="descripcion"
              ></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <label for="message" class="form-label"
                >Rendimiento del producto (en su caso):</label
              >
              <textarea
                id="rendimientoProducto"
                class="form-control"
                rows="10"
                formControlName="rendimientoProducto"
              ></textarea>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <app-catalogo-select
                [catalogo]="
                  autorizacionesDeVidaSilvestreService.clasificacionTaxonomica
                "
                formControlName="clasificacionTaxonomica"
                [label]="'Clasificación taxonómica'"
                [required]="true"
                name="clasificacionTaxonomica"
              ></app-catalogo-select>
            </div>
            <div class="col-md-4">
              <app-catalogo-select
                [catalogo]="
                  autorizacionesDeVidaSilvestreService.nombreCientifico
                "
                formControlName="nombreCientifico"
                [label]="'Nombre científico'"
                [required]="true"
                name="nombreCientifico"
              ></app-catalogo-select>
            </div>
          </div>
          <div class="row mb-5">
            <div class="col-md-4">
              <app-catalogo-select
                [catalogo]="
                  autorizacionesDeVidaSilvestreService.nombreComun
                "
                formControlName="nombreComun"
                [label]="'Nombre común'"
                [required]="true"
                name="nombreComun"
              ></app-catalogo-select>
            </div>
          </div>
          <ng-alert
            [CONTENIDO]="alert_message"
            [CUSTOMECLASS]="'alert-info'"
          ></ng-alert>
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="marca">Marca</label>
                <input
                  class="form-control"
                  [required]="true"
                  id="marca"
                  formControlName="marca"
                  type="text"
                />
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="cantidad">Cantidad</label>
                <input
                  class="form-control"
                  [required]="true"
                  id="cantidad"
                  formControlName="cantidad"
                  type="text"
                />
                <p>No esta permitido capturar "," (coma)</p>
              </div>
            </div>
            <div class="col-md-4">
              <app-catalogo-select
                [catalogo]="
                  autorizacionesDeVidaSilvestreService.unidadMedida
                "
                formControlName="unidadMedida"
                [label]="'Unidad de medida'"
                [required]="true"
                name="unidadMedida"
              ></app-catalogo-select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <app-catalogo-select
                [catalogo]="
                  autorizacionesDeVidaSilvestreService.paisOrigen
                "
                formControlName="paisOrigen"
                [label]="'País de origen*:'"
                [required]="true"
                name="paisOrigen"
              ></app-catalogo-select>
            </div>
            <div class="col-md-4">
              <app-catalogo-select
                [catalogo]="
                  autorizacionesDeVidaSilvestreService.paisProcedencia
                "
                formControlName="paisProcedencia"
                [label]="'País de procedencia*:'"
                [required]="true"
                name="paisProcedencia"
              ></app-catalogo-select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 d-flex justify-content-end gap-1">
              <button type="button" class="btn btn-default">Limpiar</button>
              <button
                type="button"
                class="btn btn-danger"
                (click)="toggleDivMercancia()"
              >
                Cancelar
              </button>
              <button
                type="button"
                class="btn btn-primary"
                (click)="submitMercanciaForm()"
              >
                Guardar
              </button>
            </div>
          </div>
        </form>
      </div>
    </app-modal>
  }
  
</div>
