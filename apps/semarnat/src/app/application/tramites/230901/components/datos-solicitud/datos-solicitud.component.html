<div class="container">
  <ng-titulo titulo="Datos de la solicitud" />
  <form [formGroup]="FormSolicitud">
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="autorizacionesDeVidaSilvestreService.tiposDeMovimiento"
          formControlName="tipodemovimiento"
          [label]="'Tipo de movimiento'"
          [required]="true"
          name="tipodemovimiento"
          (change)="onTipoMovimientoChange()"
        ></app-catalogo-select>
      </div>
    </div>

    @if (tipoMovimientoSeleccionada) {
    <ng-titulo titulo="Régimen" />
    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="autorizacionesDeVidaSilvestreService.tiposDeRegimen"
          formControlName="tipoderegimen"
          [label]="'Tipo de régimen'"
          [required]="true"
          name="tipoderegimen"
          (change)="onTipoRegimenChange()"
        ></app-catalogo-select>
      </div>
    </div>
    <ng-titulo
      [titulo]="
        solicitudState.tipoDeMovimiento === '2' ||
        solicitudState.tipoDeMovimiento === '3'
          ? 'Aduanas de salida'
          : 'Adnuana'
      "
    ></ng-titulo>
    <div class="row mt-3">
      <div class="col-md-12 mt-3">
        @if(solicitudState.tipoDeMovimiento==="1"){
        <h5>Aduana des entrades (Maximo 3 aduanas)</h5>
        }
        <crosslist
          [fechas]="seleccionarOrigenDelAduana"
          [botones]="aduanasBotons"
          [label]="aquandasLabel"
        ></crosslist>
      </div>
    </div>

    <div>
      <h6>Mercancia*:</h6>
      <app-tabla-dinamica
        [configuracionTabla]="configuracionTabla"
        [datos]="tablaDatos"
        [tipoSeleccionTabla]="TablaSeleccion"
      ></app-tabla-dinamica>
      <nav aria-label="Page navigation example">
        <ul class="pagination justify-content-center">
          <li class="page-item"><a class="page-link" href="#">1</a></li>
        </ul>
      </nav>
      <div class="row" style="padding-bottom: 20px; text-align: right">
        <div>
          <button type="button" class="btn btn-default me-2">Modficar</button>
          <button type="button" class="btn btn-danger me-2">Eliminar</button>
          <button
            type="button"
            class="btn btn-primary me-2"
            (click)="toggleDivMercancia()"
          >
            Agregar
          </button>
        </div>
      </div>
    </div>

    <ng-titulo titulo="Finalidad del movimiento" />
    <div class="row mt-3">
      <div class="col-md-12 mt-3">
        <crosslist
          [fechas]="seleccionarOrigenDelAduana"
          [botones]="aduanasBotons"
          [label]="aquandasLabel"
        ></crosslist>
      </div>
    </div>
    }
  </form>

  <!-- fraccionArancelaria: ['', Validators.required],
      otraFraccion: ['', Validators.required],
      descripcion: ['', Validators.required],
      rendimientoProducto: ['', Validators.required],
      nombreCientifico: ['', Validators.required],
      nombreComun: ['', Validators.required],
      marca: ['', Validators.required],
      cantidad: ['', Validators.required],
      unidadMedida: ['', Validators.required],
      paisOrigen: ['', Validators.required],
      paisProcedencia: ['', Validators.required], -->

  <app-modal [active]="showDatosMercanciaModal">
    <div class="datos-mercancia-container">
      <ng-titulo titulo="Datos mercancia" />
      <form [formGroup]="formMercancia">
        <div class="row">
          <div class="col-md-5">
            <app-catalogo-select
              [catalogo]="
                autorizacionesDeVidaSilvestreService.tiposDeMovimiento
              "
              formControlName="fraccionArancelaria"
              [label]="'Fracción arancelaria'"
              [required]="true"
              name="fraccionArancelaria"
              (change)="onTipoMovimientoChange()"
            ></app-catalogo-select>
          </div>
          <div class="col-md-7">
            <div class="form-group">
              <label class="form-label" for="fraccionDescripcion"
                >Descripción de la fracción arancelaria:</label
              >
              <input
                class="form-control"
                id="fraccionDescripcion"
                formControlName="fraccionDescripcion"
                type="text"
              />
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12 justify-content-start">
            <div class="form-check mt-4">
              <input class="form-check-input" (click)="seleccionOtraFraccion()" type="checkbox" value="" id="otraFraccion"
                formControlName="otraFraccion">
              <label class="form-check-label" for="otraFraccion">Otra fracción
              </label>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <label for="message" class="form-label">Descripción</label>
            <textarea
              id="descripcion"
              [required]="true"
              class="form-control"
              rows="10"
              formControlName="descripcion"
            ></textarea>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <label for="message" class="form-label"
              >Rendimiento del producto (en su caso):</label
            >
            <textarea
              id="rendimientoProducto"
              class="form-control"
              rows="10"
              formControlName="rendimientoProducto"
            ></textarea>
          </div>
        </div>
        <div class="row">
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="
                autorizacionesDeVidaSilvestreService.tiposDeMovimiento
              "
              formControlName="clasificacionTaxonomica"
              [label]="'Clasificación taxonómica'"
              [required]="true"
              name="clasificacionTaxonomica"
              (change)="onTipoMovimientoChange()"
            ></app-catalogo-select>
          </div>
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="
                autorizacionesDeVidaSilvestreService.tiposDeMovimiento
              "
              formControlName="nombreCientifico"
              [label]="'Nombre científico'"
              [required]="true"
              name="nombreCientifico"
              (change)="onTipoMovimientoChange()"
            ></app-catalogo-select>
          </div>
        </div>
        <div class="row mb-5">
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="
                autorizacionesDeVidaSilvestreService.tiposDeMovimiento
              "
              formControlName="nombreComun"
              [label]="'Nombre común'"
              [required]="true"
              name="nombreComun"
              (change)="onTipoMovimientoChange()"
            ></app-catalogo-select>
          </div>
        </div>
        <ng-alert
          [CONTENIDO]="ALERTA_MERCANCIA"
          [CUSTOMECLASS]="infoAlert"
        ></ng-alert>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="marca">Marca</label>
              <input
                class="form-control"
                [required]="true"
                id="marca"
                formControlName="marca"
                type="text"
              />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="cantidad">Cantidad</label>
              <input
                class="form-control"
                [required]="true"
                id="cantidad"
                formControlName="cantidad"
                type="text"
              />
              <p>No esta permitido capturar "," (coma)</p>
            </div>
          </div>
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="
                autorizacionesDeVidaSilvestreService.tiposDeMovimiento
              "
              formControlName="unidadMedida"
              [label]="'Unidad de medida'"
              [required]="true"
              name="unidadMedida"
              (change)="onTipoMovimientoChange()"
            ></app-catalogo-select>
          </div>
        </div>
        <div class="row">
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="
                autorizacionesDeVidaSilvestreService.tiposDeMovimiento
              "
              formControlName="paisOrigen"
              [label]="'País de origen*:'"
              [required]="true"
              name="paisOrigen"
              (change)="onTipoMovimientoChange()"
            ></app-catalogo-select>
          </div>
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="
                autorizacionesDeVidaSilvestreService.tiposDeMovimiento
              "
              formControlName="paisProcedencia"
              [label]="'País de procedencia*:'"
              [required]="true"
              name="paisProcedencia"
              (change)="onTipoMovimientoChange()"
            ></app-catalogo-select>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12 d-flex justify-content-end gap-1">
            <button
              type="button"
              class="btn btn-danger"
              (click)="toggleDivMercancia()"
            >
              Cancelar
            </button>
            <button type="button" class="btn btn-default">Limpiar</button>
            <button
              type="button"
              class="btn btn-primary"
              (click)="submitMercanciaForm()"
            >
              Guardar
            </button>
          </div>
        </div>
      </form>
    </div>
  </app-modal>
</div>
