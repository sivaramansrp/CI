<div class="container">
  <ng-titulo titulo="Pago de derechos" />
  <form [formGroup]="formPagoDerechos">
    <div class="form">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="claveDeReferencia"
              >Clave de referencia*:</label
            >
            <input
              class="form-control"
              id="claveDeReferencia"
              placeholder="Clave de referencia"
              type="number"
              formControlName="claveDeReferencia"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="cadenaDeLaDependencia"
              >Cadena de la dependencia*:</label
            >
            <input
              class="form-control"
              id="cadenaDeLaDependencia"
              placeholder="Cadena de la dependencia"
              type="number"
              formControlName="cadenaDeLaDependencia"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="bancoList"
              formControlName="banco"
              [label]="'Banco'"
              [required]="true"
              name="banco"
              (change)="bancoSeleccion()"
            ></app-catalogo-select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="llaveDePago">Llave de pago*:</label>
            <input
              class="form-control"
              id="llaveDePago"
              placeholder="Llave de pago"
              type="text"
              formControlName="llaveDePago"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="fecha">Fecha de pago*:</label>
            <input
              class="form-control"
              id="fechaDePago"
              placeholder="Fecha de pago"
              type="date"
              formControlName="fechaDePago"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="importeDePago"
              >Importe de pago*:</label
            >
            <input
              class="form-control"
              id="importeDePago"
              placeholder="Importe de pago"
              type="number"
              formControlName="importeDePago"
            />
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
