<div class="container">
  <ng-titulo titulo="Pago de derechos" />
  <form [formGroup]="formPagoDerechos">
    <div class="form">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="claveDeReferencia"
              >Clave de referencia</label
            >
            <input
              class="form-control"
              id="claveDeReferencia"
              type="number"
              formControlName="claveDeReferencia"
              [required]="true"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="cadenaDeLaDependencia"
              >Cadena de la dependencia</label
            >
            <input
              class="form-control"
              id="cadenaDeLaDependencia"
              type="number"
              formControlName="cadenaDeLaDependencia"
              [required]="true"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="this.autorizacionesDeVidaSilvestreService.bancos"
              formControlName="banco"
              [label]="'Banco'"
              [required]="true"
              name="banco"
              (change)="bancoSeleccion()"
            ></app-catalogo-select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="llaveDePago">Llave de pago</label>
            <input
              class="form-control"
              id="llaveDePago"
              type="text"
              formControlName="llaveDePago"
              [required]="true"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="fecha">Fecha de pago</label>
            <input
              class="form-control"
              id="fechaDePago"
              type="date"
              formControlName="fechaDePago"
              [required]="true"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="importeDePago"
              >Importe de pago</label
            >
            <input
              class="form-control"
              id="importeDePago"
              type="number"
              formControlName="importeDePago"
            />
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
