<div class="container">
  <ng-titulo titulo="Pago de derechos" />
  <form [formGroup]="formularioPagoDerechos">
    <div class="form">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="claveDeReferencia"
              >Clave de referencia*:</label
            >
            <input
            id="claveDeReferencia"
            type="number"
              class="form-control"
              formControlName="claveDeReferencia"
              placeholder="084000966"
              [required]="true"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="cadenaPagoDependencia"
              >Cadena de la dependencia*:</label
            >
            <input
            id="cadenaPagoDependencia"
            type="number"
            class="form-control"
            formControlName="cadenaPagoDependencia"
              placeholder="00130090940161"
              [required]="true"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <app-catalogo-select
            formControlName="banco"
            name="banco"
              [catalogo]="this.servicioVidaSilvestre.bancos"
              [label]="'Banco'"
              [required]="true"
              [isDisabled]="esFormularioSoloLectura"
              (change)="setValoresStore(formularioPagoDerechos,'banco')"
            ></app-catalogo-select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="llaveDePago">Llave de pago*:</label>
            <input class="form-control" id="llaveDePago" type="text" formControlName="llaveDePago" [required]="true"
              [class.is-invalid]="formularioPagoDerechos.get('llaveDePago')?.touched && formularioPagoDerechos.get('llaveDePago')?.invalid"
              (input)="manejarCambioLlavePago()" (change)="setValoresStore(formularioPagoDerechos,'llaveDePago')">
            <div class="invalid-feedback"
              *ngIf="formularioPagoDerechos.get('llaveDePago')?.touched && formularioPagoDerechos.get('llaveDePago')?.invalid">
              <span *ngIf="formularioPagoDerechos.get('llaveDePago')?.hasError('required')">Este campo es
                obligatorio.</span>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <input-fecha [setFecha]="formularioPagoDerechos.get('fecPago')?.value" [datos]="configuracionFechaFinal" [isDisabled]="esFormularioSoloLectura"
            (valorCambiado)="cambioFechaFinal($event)"
            [class.is-invalid]="formularioPagoDerechos.get('fecPago')?.touched && formularioPagoDerechos.get('fecPago')?.invalid">
          </input-fecha>
          <div class="invalid-feedback"
            *ngIf="formularioPagoDerechos.get('fecPago')?.touched && formularioPagoDerechos.get('fecPago')?.invalid">
            <span *ngIf="formularioPagoDerechos.get('fecPago')?.hasError('required')">Este campo es obligatorio.</span>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="impPago"
              >Importe de pago*:</label
            >
            <input
              class="form-control"
              id="impPago"
              type="number"
              formControlName="impPago"
              [required]="true"
            />
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
