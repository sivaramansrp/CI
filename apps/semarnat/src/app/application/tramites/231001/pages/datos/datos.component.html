<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h1>Aviso de materiales importados de régimen temporal</h1>
    </div>
    <div class="col-12">
      @if (esFormaValido) {
      <div
        class="alert alert-info alert-danger"
        [innerHTML]="formErrorAlert"
      ></div>
      }
    </div>

    <app-wizard [listaPasos]="pasos"></app-wizard>
  </div>

  <div class="row">
    @switch (indice) { @case (1) {
    <app-solicitante-datos-tabs #pasoUnoRef></app-solicitante-datos-tabs>
    } @case (2) {
    <app-paso-dos
      [cargaArchivosEvento]="cargarArchivosEvento"
      [regresarSeccionCargarDocumentoEvento]="
        regresarSeccionCargarDocumentoEvento
      "
      (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
      (reenviarCargaRealizada)="cargaRealizada($event)"
    ></app-paso-dos>
    } @case (3) {
    <app-paso-tres></app-paso-tres>
    } }
  </div>

  <div class="row">
    <div class="col-md-12">
      @if (indice !== 2) {
      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
      } @else {
      <div class="mt-5 mb-3 d-flex justify-content-end">
        <button
          type="button"
          class="btn btn-default"
          (click)="anterior()"
          *ngIf="seccionCargarDocumentos"
        >
          Anterior
        </button>

        <button
          type="button"
          class="btn btn-default ms-3"
          (click)="anteriorSeccionCargarDocumento()"
          *ngIf="!seccionCargarDocumentos"
        >
          Anterior
        </button>

        <button
          class="btn btn-primary ms-3"
          (click)="
            seccionCargarDocumentos ? onClickCargaArchivos() : siguiente()
          "
          [disabled]="!activarBotonCargaArchivos && seccionCargarDocumentos"
        >
          {{ seccionCargarDocumentos ? 'Cargar archivos' : 'Continuar' }}
        </button>
      </div>
      }
    </div>
  </div>
  <ng-alert [CONTENIDO]="aviso" *ngIf="indice === 1"></ng-alert>
</div>
