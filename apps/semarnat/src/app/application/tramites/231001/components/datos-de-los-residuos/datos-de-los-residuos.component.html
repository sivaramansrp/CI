<div class="container">
  <ng-titulo [titulo]="'Datos de los residuos y/o materia prima a importar'"></ng-titulo>
  <h4>Agregar materia prima a importar </h4>
      <form [formGroup]="materiaPrimaForm" id="materiaPrimaForm" class="form-group">
        <div class="row mt-3">
          <div class="col-md-8">
            <div class="form-group">
              <label for="nombreDeLaMateriaPrima" class="form-label">Nombre de la Materia Prima *:</label>
              <input
                type="text"
                formControlName="nombreDeLaMateriaPrima"
                class="form-control"
                id="nombreDeLaMateriaPrima"
                (change)="setValoresStore(materiaPrimaForm,'nombreDeLaMateriaPrima')"
              />
              <div *ngIf="materiaPrimaForm.get('nombreDeLaMateriaPrima')?.invalid && (materiaPrimaForm.get('nombreDeLaMateriaPrima')?.dirty || materiaPrimaForm.get('nombreDeLaMateriaPrima')?.touched)">
                  <div *ngIf="materiaPrimaForm.get('nombreDeLaMateriaPrima')?.errors?.['required']">
                      <small class="text-danger">Este campo es obligatorio</small>
                  </div>
              </div>
            </div>
            
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label for="cantidad" class="form-label">Cantidad *:</label>
              <input
                type="text"
                formControlName="cantidad"
                class="form-control"
                id="cantidad"
                (blur)="obtenerLetraCantidad(materiaPrimaForm.get('cantidad')?.value)"
                (change)="setValoresStore(materiaPrimaForm,'cantidad')"
              />
              <div *ngIf="materiaPrimaForm.get('cantidad')?.invalid && (materiaPrimaForm.get('cantidad')?.dirty || materiaPrimaForm.get('cantidad')?.touched)">
                  <div *ngIf="materiaPrimaForm.get('cantidad')?.errors?.['required']">
                      <small class="text-danger">Este campo es obligatorio</small>
                  </div>
              </div>
            </div>
          </div>
        </div>
    
        <div class="row mt-3">
          <div class="col-md-8">
            <div class="form-group">
              <label for="cantidadEnLetra" class="form-label">Cantidad (letra) *:</label>
              <input
                type="text"
                formControlName="cantidadEnLetra"
                class="form-control"
                id="cantidadEnLetra"
                (change)="setValoresStore(materiaPrimaForm,'cantidadEnLetra')"
              />
            </div>
          </div>
          <div class="col-md-4">
            <app-catalogo-select  (change)="setValoresStore(materiaPrimaForm, 'unidadMedidaComercial')" 
             formControlName="unidadMedidaComercial" 
             [catalogo]="comboUnidadMedida" 
             [label]="'Unidad de medida'"
             [required]="true"
             [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
          </div>
        </div>
    
        <div class="row mt-3">
          <div class="col-md-12">
            <div class="form-group">
              <app-catalogo-select  (change)="setValoresStore(materiaPrimaForm, 'capituloFraccion')"  
               formControlName="capituloFraccion"
               [catalogo]="comboCapituloFraccion" 
               [label]="'Capítulo'"
               [required]="true"
               [isDisabled]="esFormularioSoloLectura">
              </app-catalogo-select>
            </div>
          </div>
        </div>
    
        <div class="row mt-3">
          <div class="col-md-12">
            <div class="form-group">
              <app-catalogo-select  (change)="setValoresStore(materiaPrimaForm, 'partidaFraccion')" 
               formControlName="partidaFraccion" 
               [catalogo]="comboPartidaFraccion" 
               [label]="'Partida'"
               [required]="true"
               [isDisabled]="esFormularioSoloLectura">
              </app-catalogo-select>
            </div>
          </div>
        </div>
    
        <div class="row mt-3">
          <div class="col-md-4">
            <div class="form-group">
              <app-catalogo-select  (change)="setValoresStore(materiaPrimaForm, 'subPartidaFraccion')"   
               formControlName="subPartidaFraccion" 
               [catalogo]="comboSubPartidaFraccion" 
               [label]="'Sub partida'"
               [required]="true"
               [isDisabled]="esFormularioSoloLectura">
             </app-catalogo-select>
            </div>
          </div>
          <div class="col-md-8">
            <div class="form-group">
              <app-catalogo-select (change)="setValoresStore(materiaPrimaForm, 'fraccion')"   
               formControlName="fraccion" 
               [catalogo]="comboFraccionArancelariaParametros" 
               [label]="'Fracción arancelaria'"
               [required]="true"
               [isDisabled]="esFormularioSoloLectura">
          </app-catalogo-select>
        </div>
      </div>
    </div>


     <div class="row mb-5 mt-5">
        <div class="col-md-6 col-sm-6"></div>
        <div class="col-md-6 col-sm-6 text-end">
          <div class="btn-group">
            <button class="btn btn-danger me-2" type="button" [disabled]="esFormularioSoloLectura">Cancelar</button>
            <button class="btn btn-primary" type="button" [disabled]="esFormularioSoloLectura">Guardar</button>
          </div>
        </div>
      </div>
  </form>
</div>
