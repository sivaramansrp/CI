<div id="dialogoDestinatario" style="display: none">

  <form [formGroup]="modalDestinatario" id="modalDestinatario" name="modalDestinatario">
    <div>
      <div>
        <h3>{{ solicitud.datosGenerales }}</h3>
        <hr class="red">
      </div>
      <div class="row">
        <div class="col-md-6">
          <label for="nacionalidad">{{ solicitud.Nacionalidad }}</label>
          <label for="puntos"></label>
          <div class="radio">
            <label>
              <input type="radio" value="nacional" formControlName="nacionalidad" id="nacional">
              {{ destinatario.nacional }}
            </label>
            <label>
              <input type="radio" value="extranjero" formControlName="nacionalidad" id="extranjero">
              {{ destinatario.extranjero }}
            </label>
          </div>
        </div>
        <div class="col-md-6">
          <label for="tipoPersona">{{ solicitud.tipoPersona }}</label>
          <span class="require">*</span>
          <label for="puntos"></label>
          <div class="radio">
            <label>
              <input type="radio" value="pfisica" formControlName="tipoPersona" id="pfisica" (change)="personaFisica()">
              {{ tipoPersona.fisica }}
            </label>
            <label>
              <input type="radio" value="pmoral" formControlName="tipoPersona" id="pmoral" (change)="personaMoral()">
              {{ tipoPersona.moral }}
            </label>
          </div>
        </div>
      </div>

      <div class="pm row" *ngIf="modalDestinatario.get('tipoPersona').value === 'pmoral'">
        <div class="col-md-12">
          <label for="razonSocial">{{ destinatario.denominacion }}</label>
          <span class="require">*</span>
          <label for="puntos"></label><br>
          <input type="text" formControlName="razonSocial" id="razonSocial" maxlength="250" class="form-control" />
        </div>
      </div>

      <div class="pf" *ngIf="modalDestinatario.get('tipoPersona').value === 'pfisica'">
        <div class="row">
          <div class="col-md-4">
            <label for="nombre">{{ destinatario.nombre }}</label>
            <span class="require">*</span>
            <label for="puntos"></label>
            <input type="text" formControlName="nombre" id="nombre" maxlength="200" class="form-control" />
          </div>
          <div class="col-md-4">
            <label for="apellidoPaterno">{{ destinatario.apellidop }}</label>
            <span class="require">*</span>
            <label for="puntos"></label>
            <input type="text" formControlName="apellidoPaterno" id="apellidoPaterno" maxlength="200" class="form-control" />
          </div>
          <div class="col-md-4">
            <label for="apellidoMaterno">{{ destinatario.apellidom }}</label>
            <label for="puntos"></label>
            <input type="text" formControlName="apellidoMaterno" id="apellidoMaterno" maxlength="200" class="form-control" />
          </div>
        </div>
        <div class="row">
          <!-- Additional fields can be added here if necessary -->
        </div>
        <div class="row">
          <!-- Additional fields can be added here if necessary -->
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <label for="codigoPostal">{{ destinatario.codigoPostal }}</label>
          <span class="require">*</span>
          <label for="puntos"></label>
          <input type="text" formControlName="codigoPostal" id="codigoPostal" maxlength="15" class="form-control" />
        </div>

        <div class="col-md-4">
          <label for="paisSinMexico">{{ destinatario.pais }}</label>
          <span class="require">*</span>
          <label for="puntos"></label>
          <div id="sinMex">
            <!--
            <stk-web:catalog
              selectName="paisSinMexico" descField="descripcion"
              catalogName="paisesSinMexico" valueField="clave"
              nonSelectionText="Selecciona un valor" nonSelectionValue=""
              event="$('#pais').val(this.value), ($('#descripcionPais').val($('#paisSinMexico option:selected').text()))">
            </stk-web:catalog>
            -->
            <!-- Shared component commented out -->
            <input type="hidden" formControlName="pais" id="pais" />
            <input type="hidden" formControlName="descripcionPais" id="descripcionPais" />
          </div>
        </div>
        <div class="col-md-4">
          <div class="ciudadExp">
            <label for="ciudad">{{ destinatario.ciudad }}</label>
            <span class="require">*</span>
            <label for="puntos"></label>
            <input type="text" formControlName="ciudad" id="ciudad" maxlength="120" class="form-control" />
          </div>
        </div>
      </div>

      <div class="row">
        <!-- Additional rows can be added here if necessary -->
      </div>

      <div>
        <label for="domicilio">{{ destinatario.direccion }}</label>
        <span class="require">*</span>
        <label for="puntos"></label>
        <br>
        <textarea formControlName="domicilio" id="domicilio" class="form-control"></textarea>
      </div>

      <br />
      <div class="row">
        <div class="col-md-4 text-muted text-vertical-align-button">
          <div id="lblCamposObligatorios">
            * Campos obligatorios
          </div>
        </div>
        <div class="col-md-8">
          <div class="pull-right">
            <button type="button" name="button.cancelar" class="btn btn-default" (click)="cancelar()">
              {{ boton.cancelar }}
            </button>
            <button type="button" name="button.guardar" class="btn btn-primary" (click)="guardar()">
              {{ boton.guardar }}
            </button>
          </div>
        </div>
      </div>
      <div class="bottom-buffer"></div>
    </div>
  </form>
</div>
