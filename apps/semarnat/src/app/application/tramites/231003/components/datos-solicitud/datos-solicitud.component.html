<div class="container mb-5">
  <form [formGroup]="solicitudForm">
    <ng-titulo titulo="Datos del generador de residuos" />
    <div class="row mb-3">
      <div class="col-md-4 mb-3 form-group">
        <label for="numeroRegistroAmbiental">Número de Registro Ambiental*:</label>
        <input type="text" class="form-control" placeholder="123123" formControlName="numeroRegistroAmbiental"
          id="numeroRegistroAmbiental" maxlength="13" size="30" />
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-6 mb-3 form-group">
        <label for="descripcionGenerica1">Giro industrial del importador*: </label>
        <input type="text" class="form-control" placeholder="Giro industrial del importador"
          formControlName="descripcionGenerica1" id="descripcionGenerica1" maxlength="150" size="105" />
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-5 form-group">
        <app-catalogo-select [catalogo]='aduanas' formControlName="numeroProgramaImmex"
          [label]="'Número de autorización Immex'" [required]="true"></app-catalogo-select>
      </div>
    </div>
  </form>
  <ng-titulo titulo="Administrar residuos"></ng-titulo>
  <h6>Datos de los residuos peligrosos a reciclar*:</h6>
  <div class="row mb-3">
    <div class="col-md-12">
      <ng-table [commonTableHeader]="establecimientoHeaderData" [commonTableBody]="establecimientoBodyData"></ng-table>
      <nav aria-label="Page navigation example">
        <ul class="pagination d-flex justify-content-center">
          <li class="page-item"><a class="page-link">1</a></li>
        </ul>
      </nav>
    </div>
  </div>
  <div class="row mb-5">
    <div class="col text-end">
      <div class="btn-group">
        <button class="btn btn-primary me-2" type="button">Borrar</button>
        <button class="btn btn-danger" type="button" (click)="navigateToPath()">Agregar</button>
      </div>
    </div>
  </div>
  <ng-titulo titulo="Datos de la empresa transportista"></ng-titulo>
  <div class="row mb-3">
    <div class="col-md-8">
      <div class="form-group mb-3">
        <label for="nombreEmpresaTransportistaResiduos" class="form-label">Nombre de la empresa transportista de
          residuos peligrosos*:</label>
        <input type="text" class="form-control" id="nombreEmpresaTransportistaResiduos">
      </div>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-md-8">
      <div class="form-group mb-3">
        <label for="numeroAutorizacionSemarnat" class="form-label">Número de autorización SEMARNAT*:</label>
        <input type="text" class="form-control" id="numeroAutorizacionSemarnat">
      </div>
    </div>
  </div>
  <ng-titulo titulo="Datos de la empresa de servicio que realizará el reciclaje"></ng-titulo>
  <form [formGroup]="formularioEmpresaReciclaje">
    <div class="row mb-3">
      <div class="col-md-8">
        <label required="true">¿Requiere de una empresa de servicio para realizar el reciclaje?*:</label>
        <app-input-radio [radioOptions]="requiereEmpresaServicioReciclaje" [isRequired]="true" [layout]="'horizontal'"
          formControlName="requiereEmpresa">
        </app-input-radio>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-8">
        <div class="form-group mb-3">
          <label for="nombreEmpresaServicioReciclaje" class="form-label">Nombre de la empresa de servicios que realizará
            el reciclaje*:</label>
          <input type="text" class="form-control" id="nombreEmpresaServicioReciclaje" formControlName="nombreEmpresa">
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-8">
        <div class="form-group mb-3">
          <label for="nombreRepresentanteLegal" class="form-label">Nombre del representante legal*:</label>
          <input type="text" class="form-control" id="nombreRepresentanteLegal" formControlName="representanteLegal">
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <div class="form-group mb-3">
          <label for="telefono" class="form-label">Teléfono*:</label>
          <input type="text" class="form-control" id="telefono" formControlName="telefono">
        </div>
      </div>

      <div class="col-md-6">
        <div class="form-group mb-3">
          <label for="correoElectronico" class="form-label">Correo electrónico*:</label>
          <input type="email" class="form-control" id="correoElectronico" formControlName="correoElectronico">
        </div>
      </div>
    </div>
  </form>
</div>
<ng-titulo titulo="Información sobre precauciones"></ng-titulo>
<div class="row mb-3">
  <div class="col-md-10">
    <div class="form-group">
      <label class="form-label">Información sobre las precauciones de manejo que se debe dar al residuo
        peligroso*:</label>
      <textarea class="form-control disabled-color textarea-auto-height" rows="4" name="solicitudAcotacion"></textarea>
    </div>
  </div>
</div>

<ng-titulo titulo="Lugar donde se realizará el reciclaje"></ng-titulo>
<form [formGroup]="formularioLugarReciclaje">
  <div class="row mb-3">
    <div class="col-md-8">
      <label required="true">
        ¿El reciclaje se realizará dentro de las instalaciones donde se generaron los residuos?*:
      </label>
      <app-input-radio [radioOptions]="reciclajeEnInstalaciones" [isRequired]="true" [layout]="'horizontal'"
        formControlName="reciclajeInstalaciones">
      </app-input-radio>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-8">
      <div class="form-group mb-3">
        <label for="lugarReciclaje" class="form-label">Lugar donde se realizará el reciclaje*:</label>
        <input type="text" class="form-control" id="lugarReciclaje" formControlName="lugarReciclaje">
      </div>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-8">
      <div class="form-group mb-3">
        <label for="numeroAutorizacionEmpresaReciclaje" class="form-label">
          Número de autorización de la empresa del reciclaje*:
        </label>
        <input type="text" class="form-control" id="numeroAutorizacionEmpresaReciclaje"
          formControlName="numeroAutorizacionEmpresaReciclaje">
      </div>
    </div>
  </div>
</form>
