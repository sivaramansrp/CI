<div class="container">
    <ng-titulo titulo="Certificado a desistir" />
    <form [formGroup]="formDesistimiento">
      <div class="form">
        <div class="row">
          <div class="col-md-12">
            <div class="form-group">
              <label class="form-label" for="desistimientoFolio">Folio:</label>
              <input class="form-control mb-4" id="desistimientoFolio" placeholder="" type="text" formControlName="desistimientoFolio">
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <div class="form-group my-4">
              <label class="form-label" for="solicitudTipo">Tipo de solicitud:</label>
              <textarea class="form-control mb-4 ht" rows="6"  name="solicitudTipo" id="solicitudTipo"  placeholder="" formControlName="solicitudTipo">
              </textarea>
            </div>
          </div>
        </div>
        <div class="row">
             <div class="col-md-12">
                <div class="form-group my-4" >
                    <label class="form-label" for="desistimientoMotivo">Motivo de desistimiento*:</label>
                    <textarea (change)="onDescripcionChange()" rows="6" class="mb-4 ht" name="desistimientoMotivo" id="desistimientoMotivo"  placeholder="" formControlName="desistimientoMotivo">
                    </textarea>
                    <div *ngIf="formDesistimiento.get('desistimientoMotivo')?.touched && formDesistimiento.get('desistimientoMotivo')?.invalid">
                  <small *ngIf="formDesistimiento.get('desistimientoMotivo')?.errors?.['required']" class="text-danger espaciador-campo-pequeño">Este campo es obligatorio</small>
                </div>
                </div>
            </div>
        </div>
      </div>
    </form>
  </div>
