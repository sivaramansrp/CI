<div class="container mb-5">
  <form [formGroup]="solicitudForm">
    <div class="row">
      <div class="col-md-12 mt-5 mb-3 form-group">
        <label for="adace">Tipo de aviso*:</label>
      </div>
    </div>
    <div class="row">
      <div class="col-md-10 mb-3">
        <app-input-radio [radioOptions]="avisoOpcionesDeRadio.opcionesDeRadio" [isRequired]="avisoOpcionesDeRadio.required" [selectedValue]="solicitudForm.get('ideGenerica1')?.value" [layout]="'horizontal'" (valueChange)="setTipoDeAviso($event)" formControlName="ideGenerica1"></app-input-radio>
      </div>
    </div>
    <ng-titulo titulo="Datos del generador de residuos" />
    <div class="row mb-3">
      <div class="col-md-4 mb-3 form-group">
        <label for="numeroRegistroAmbiental">Número del registro ambiental*:</label>
        <input type="text" class="form-control" formControlName="numeroRegistroAmbiental" id="numeroRegistroAmbiental" maxlength="13" size="30" (change)="actualizarCampoSolicitudForm('numeroRegistroAmbiental')" />
      </div>
      <div class="col-md-8 mb-3 form-group">
        <label for="descripcionGenerica1">Giro industrial del importador*: </label>
        <input type="text" class="form-control" formControlName="descripcionGenerica1" id="descripcionGenerica1" maxlength="150" size="105" (change)="actualizarCampoSolicitudForm('descripcionGenerica1')" />
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-5 form-group">
        <app-catalogo-select [catalogo]='etiquetasForm.Immex' formControlName="numeroProgramaImmex" [label]="'Número de autorización IMMEX'" [required]="true" (change)="actualizarCampoSolicitudForm('numeroProgramaImmex')" [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-5 form-group">
        <app-catalogo-select [catalogo]='etiquetasForm.Domicilio' formControlName="domicilio" [label]="'Domicilio'" [required]="true" (change)="actualizarCampoSolicitudForm('domicilio')" [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
      </div>
    </div>
  </form>
  <ng-titulo titulo="Administrar residuos"></ng-titulo>
  <h6>Datos de los residuos peligrosos a retornar por primera vez ó subsecuente*:</h6>
  <div class="row mb-3">
    <div class="col-md-12">
      <ng-table [commonTableHeader]=" etiquetasForm.table[0].encabezadoDeTabla" [commonTableBody]="etiquetasForm.table[0].cuerpoTabla" [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"></ng-table>
      <nav aria-label="Page navigation example">
        <ul class="pagination d-flex justify-content-center">
          <li class="page-item">
            <a class="page-link">1</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
  <div class="row mb-5">
    <div class="col text-end">
      <div class="btn-group">
        <button class="btn btn-primary me-2" type="button" [disabled]="esFormularioSoloLectura">Borrar</button>
        <button class="btn btn-danger" type="button" data-bs-toggle="modal" data-bs-target="#modalAgregarMercancias" (click)="agregarOperacionImp()" [disabled]="esFormularioSoloLectura">Agregar</button>
      </div>
    </div>
  </div>
  <ng-titulo titulo="Datos de la empresa transportista"></ng-titulo>
  <form [formGroup]="formularioEmpresaTransportista">
    <div class="row mb-3">
      <div class="col-md-8">
        <div class="form-group mb-3">
          <label for="nombreEmpresaTransportistaResiduos" class="form-label"> Nombre de la empresa transportista de residuos peligrosos*: </label>
          <input type="text" class="form-control" id="nombreEmpresaTransportistaResiduos" formControlName="nombreEmpresaTransportistaResiduos" (change)="actualizarCampoEmpresaTransportista('nombreEmpresaTransportistaResiduos')" />
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-8">
        <div class="form-group mb-3">
          <label for="numeroAutorizacionSemarnat" class="form-label"> Número de autorización SEMARNAT*: </label>
          <input type="text" class="form-control" id="numeroAutorizacionSemarnat" formControlName="numeroAutorizacionSemarnat" (change)="actualizarCampoEmpresaTransportista('numeroAutorizacionSemarnat')" />
        </div>
      </div>
    </div>
  </form>
  <ng-titulo titulo="Datos de la empresa de servicio que realizará el retorno"></ng-titulo>
  <form [formGroup]="formularioEmpresaReciclaje">
    <div class="row mb-3">
      <div class="col-md-8">
        <label required="true">¿Requiere de una empresa de servicio para realizar el retorno?*:</label>
        <app-input-radio [radioOptions]="etiquetasForm.requiereEmpresaServicioReciclaje" [isRequired]="true" [layout]="'horizontal'" formControlName="requiereEmpresa" (change)="actualizarCampoEmpresaReciclaje('requiereEmpresa')"> ></app-input-radio>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-8">
        <div class="form-group mb-3">
          <label for="nombreEmpresaServicioReciclaje" class="form-label">Nombre de la empresa de servicios que realizará el retorno*:</label>
          <input type="text" class="form-control" id="nombreEmpresaServicioReciclaje" formControlName="nombreEmpresa" (change)="actualizarCampoEmpresaReciclaje('nombreEmpresa')">
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-8">
        <div class="form-group mb-3">
          <label for="nombreRepresentanteLegal" class="form-label">Nombre del representante legal*:</label>
          <input type="text" class="form-control" id="nombreRepresentanteLegal" formControlName="representanteLegal" (change)="actualizarCampoEmpresaReciclaje('representanteLegal')">
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-4">
        <div class="form-group mb-3">
          <label for="telefono" class="form-label">Teléfono*:</label>
          <input type="text" class="form-control" id="telefono" formControlName="telefono" (change)="actualizarCampoEmpresaReciclaje('telefono')">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group mb-3">
          <label for="correoElectronico" class="form-label">Correo electrónico*:</label>
          <input type="email" class="form-control" id="correoElectronico" formControlName="correoElectronico" (change)="actualizarCampoEmpresaReciclaje('correoElectronico')">
        </div>
      </div>
    </div>
  </form>
</div>
<ng-titulo titulo="Datos de salida"></ng-titulo>
<div [formGroup]="formularioPrecaucionesManejo">
  <div class="row mb-3">
    <div class="col-md-5 form-group">
      <app-catalogo-select [catalogo]='etiquetasForm.Aduana' formControlName="clave" [label]="'Aduana de salida'" [required]="true" (change)="actualizarCampoPrecaucionesManejo('clave')" [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-md-10">
      <div class="form-group">
        <label class="form-label">Información sobre las precauciones de manejo que se debe dar al residuo peligroso*:</label>
        <textarea class="form-control disabled-color textarea-auto-height" rows="4" formControlName="precaucionesManejo" (change)="actualizarCampoPrecaucionesManejo('precaucionesManejo')"></textarea>
      </div>
    </div>
  </div>
</div>
<ng-titulo titulo="Datos del destinatario"></ng-titulo>
<form [formGroup]="formularioLugarReciclaje">
  <div class="row mb-5">
    <div class="col-md-8">
      <div class="form-group">
        <label for="razonSocial">Nombre o razón social*:</label>
        <input type="text" id="razonSocial" formControlName="razonSocial" maxlength="180" class="form-control" />
      </div>
    </div>
  </div>
  <div class="row mb-5">
    <div class="col-md-4">
      <app-catalogo-select [catalogo]="etiquetasForm.Pais" [label]="'País destino'" [required]="true" formControlName="pais" name="pais" [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
    </div>
  </div>
  <div class="row mb-5">
    <div class="col-md-8">
      <div class="form-group">
        <label for="destinoDomicilio">Domicilio*:</label>
        <input type="text" id="destinoDomicilio" formControlName="destinoDomicilio" maxlength="180" class="form-control" />
      </div>
    </div>
  </div>
  <div class="row mb-5">
    <div class="col-md-4">
      <div class="form-group">
        <label for="codigoPostal">Código postal*:</label>
        <input type="text" id="codigoPostal" formControlName="codigoPostal" maxlength="8" readonly class="form-control" />
      </div>
    </div>
  </div>
  <div class="row mt-5 mb-3">
    <div class="col-md-12">
      <label class="form-label">Nota</label>
      <br />
      <label> {{TEXTOS.NOTA}} </label>
    </div>
  </div>
</form>
