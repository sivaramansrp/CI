<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h1>Aviso de retorno por primera vez ó subsecuente</h1>
    </div>
    <app-wizard [listaPasos]="pasos"></app-wizard>
  </div>
  <div class="row">
    @switch (indice) { @case (1) {
    <app-paso-uno></app-paso-uno>
    } @case (2) {
    <app-paso-dos></app-paso-dos>
    }}
  </div>
  <btn-continuar
    [datos]="datosPasos"
    (continuarEvento)="getValorIndice($event)"
  ></btn-continuar>
  @if(1 === indice) {
  <div class="mt-5">
    <div class="mt-5">
      <ng-alert
        [CONTENIDO]="TEXTOS.ADJUNTAR"
        [CUSTOMECLASS]="infoAlert"
      ></ng-alert>
    </div>
  </div>
  }
</div>
