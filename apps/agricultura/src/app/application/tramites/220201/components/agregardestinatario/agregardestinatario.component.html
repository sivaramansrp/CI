<div class="container">
    <div class="row">
        <div class="col-md-12">
            <ng-titulo titulo="Agregar destinatario (destino final)" />
        </div>
        <form [formGroup]="destinatarioForm">
            <div class="row">
                <div class="col-md-12">
                    <div class="col-md-12">
                        <label for="certficacion_a">Tipo persona*:</label>
                    </div>
                    <div>
                        <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [layout]="'vertical'"
                            name="tipoMercancia" formControlName="tipoMercancia"></app-input-radio>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <ng-titulo titulo="Datos personales" />
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label" for="nombre">Nombre(s)*:</label>
                            <input class="form-control" id="nombre" placeholder="" type="text" libUppercase formControlName="nombre" />
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label" for="primerApellido">Primer apellido*:</label>
                            <input class="form-control" id="primerApellido" placeholder="" type="text" libUppercase formControlName="primerApellido" />
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label" for="segundoApellido">Segundo apellido</label>
                            <input class="form-control" id="segundoApellido" placeholder="" type="text" libUppercase  formControlName="segundoApellido"/>
                        </div>
                    </div>
                </div>
                <div class="row" *ngIf="destinatarioForm.value.tipoMercancia === 'yes'">
                    <div class="col-md-8">
                        <div class="form-group">
                            <label class="form-label" for="razonSocial">Denominación/razón social*: </label>
                            <input class="form-control" id="razonSocial" placeholder="" type="text" libUppercase formControlName="razonSocial"/>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <app-catalogo-select [catalogo]="pairsCatalog" [label]="'País'" [required]="true"
                            name="pais" [isDisabled]="true" formControlName="pais" ></app-catalogo-select>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label" for="codigoPostal">Código postal*: </label>
                            <input class="form-control" id="codigoPostal" placeholder="" type="text" libUppercase formControlName="codigoPostal"/>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <app-catalogo-select [catalogo]="estadoCatalog" [label]="'Estado'" [required]="true"
                            name="estado" [isDisabled]="esFormularioSoloLectura" formControlName="estado"></app-catalogo-select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <app-catalogo-select [catalogo]="municipioCatalog" [label]="'Municipio o Alcaldía'"
                            [required]="false" name="municipio"
                            [isDisabled]="esFormularioSoloLectura" formControlName="municipio"></app-catalogo-select>
                    </div>
                    <div class="col-md-4">
                        <app-catalogo-select [catalogo]="coloniaCatalog" [label]="'Colonia'" [required]="false"
                            name="colonia" [isDisabled]="esFormularioSoloLectura" formControlName="colonia"></app-catalogo-select>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label" for="calle">Calle*: </label>
                            <input class="form-control" id="calle" placeholder="" type="text" libUppercase formControlName="calle" />
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label" for="numeroExterior">Número exterior*: </label>
                            <input class="form-control" id="numeroExterior" placeholder="" type="text" libUppercase formControlName="numeroExterior" />
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label" for="numeroInterior">Número interior: </label>
                            <input class="form-control" id="numeroInterior" placeholder="" type="text" libUppercase formControlName="numeroInterior"/>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-1">
                        <div class="form-group">
                            <label class="form-label" for="lada">Lada: </label>
                            <input class="form-control" id="lada" placeholder="" type="text" libUppercase formControlName="lada"/>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label class="form-label" for="telefono">Teléfono: </label>
                            <input class="form-control" id="telefono" placeholder="" type="text" libUppercase formControlName="telefono"/>
                        </div>
                    </div>
                       <div class="col-md-4">
                        <div class="form-group">
                            <label class="form-label" for="correo">Correo electrónico: </label>
                            <input class="form-control" id="correo" placeholder="" type="text" libUppercase formControlName="correo"/>
                        </div>
                    </div>
                </div>
                <div class="row mt-5 mb-5">
                    <div class="col-md-12 justify-content-end d-flex ">
                        <button type="button" class="btn btn-primary me-5"  [disabled]="esFormularioSoloLectura" >
                         Limpiar 
                        </button>
                        <button type="button" class="btn btn-default me-5" [disabled]="esFormularioSoloLectura" >
                            Cancelar 
                        </button>
                        <button type="button" class="btn btn-danger" 
                            [disabled]="destinatarioForm.invalid || esFormularioSoloLectura"
                            (click)="onGuardarDestinatario()"
                            >
                          Guardar 
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
