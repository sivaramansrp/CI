<div class="container">
  <form [formGroup]="forma">
    <div class="row mt-5">
      <div class="col-md-12">
        <div class="panel-group ficha-collapse" id="accordion">
          <div class="panel panel-default">
            <div class="panel-heading" (click)="esFormularioSoloLectura ? null :  mostrar_colapsable()" tabindex="0">
              <h4 class="panel-title">
                <a aria-label="Repeat">
                  <i class="bi bi-repeat" aria-hidden="true"></i></a>
              </h4>
              <button type="button" class="collpase-button collapsed"></button>
            </div>
            @if(colapsable && !esFormularioSoloLectura){
            <div class="panel-collapse collapse in" id="panel-01">
              <div class="panel-body">
                <ng-alert [CONTENIDO]="seleccionado"></ng-alert>
                <div class="row mt-5">
                  <div class="col-md-12">
                    <label for="Solicitud">Solicitud</label>
                  </div>
                  <div class="col-md-12">
                    <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionsoli"
                      [configuracionTabla]="configuracionColumnasSolicitud" [datos]="cuerpoTablaSolicitud"
                      [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"></app-tabla-dinamica>
                  </div>
                </div>
              </div>
            </div>
            }
          </div>
        </div>
      </div>
    </div>

    <div class="row" formGroupName="datosDelaSolicitud">
      <ng-titulo titulo="Datos del trámite a realizar" />

      <div class="col-md-12">
        <app-catalogo-select [catalogo]="aduanaDeIngreso" formControlName="aduanaIngreso" [label]="'Aduana de ingreso'"
          [required]="true" name="aduanaIngreso" [isDisabled]="esFormularioSoloLectura"
          (change)="setValoresStore()"></app-catalogo-select>
      </div>
      <div class="col-md-12">
        <app-catalogo-select [catalogo]="sanidadAgropecuaria" formControlName="oficinaInspeccion"
          [label]="'Oficina de inspección de sanidad Agropecuaria'" [required]="true" name="oficinaInspeccion"
          [isDisabled]="esFormularioSoloLectura" (change)="setValoresStore()"></app-catalogo-select>
      </div>
      <div class="col-md-12">
        <app-catalogo-select [catalogo]="puntoInspeccion" formControlName="puntoInspeccion"
          [label]="'Punto de inspección'" [required]="true" name="puntoInspeccion"
          [isDisabled]="esFormularioSoloLectura" (change)="setValoresStore()"></app-catalogo-select>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label" for="claveUCON">Clave UCON:
            <i class="bi bi-question-circle-fill" style="margin-bottom: '5px'"
              [title]="'Sólo para usuarios que cuenten con la contraseña UCON e importen productos cárnicos'"></i></label>
          <input formControlName="claveUCON" class="form-control" id="claveUCON" placeholder="" type="text" libUppercase
            [maxlength]="15" (change)="setValoresStore()" />
        </div>
      </div>
      <div class="col-md-6">
        <app-catalogo-select [catalogo]="establecimientoTIF" formControlName="establecimientoTIF"
          [label]="'Establecimiento TIF'" [required]="false" name="establecimientoTIF"
          [isDisabled]="esFormularioSoloLectura" (change)="setValoresStore()"></app-catalogo-select>
      </div>
      <div class="col-md-12">
        <app-catalogo-select [catalogo]="veterinario" formControlName="nombreVeterinario"
          [label]="'Nombre del médico veterinario'" [required]="false" name="nombreVeterinario"
          [isDisabled]="esFormularioSoloLectura" (change)="setValoresStore()"></app-catalogo-select>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label" for="numeroGuia">Número de guia</label>
          <input class="form-control" id="numeroGuia" formControlName="numeroGuia" placeholder="" type="text"
            libUppercase [maxlength]="50" (change)="setValoresStore()" />
        </div>
      </div>
      <div class="col-md-6">
        <app-catalogo-select [catalogo]="regimen" formControlName="regimen" [label]="'Régimen'" [required]="true"
          name="regimen" [isDisabled]="esFormularioSoloLectura" (change)="setValoresStore()"
          [tooltipQuestionCircle]="true"
          [tooltipQuestionCircleText]="'Régimen al que se destinará la mercancía'"></app-catalogo-select>
      </div>


      <div class="row">
        <ng-titulo titulo="Tipo de Mercancía" />
        <div class="col-md-12">
          <label for="certficacion_a">Captura de datos de mercancía</label>
        </div>
        <div class="col-md-12">
          <app-input-radio [radioOptions]="opcionDeBotonDeRadio" [layout]="'vertical'" name="tipoMercancia"
            formControlName="tipoMercancia" (change)="radioBotonSeleccionado()"></app-input-radio>
        </div>
      </div>
    </div>
    <div class="row">
      @if(notificationCheck && !esFormularioSoloLectura){
      <ng-alert [CONTENIDO]="TEXTOS"></ng-alert>
      }
      <div class="row mt-5">
        <div class="col-md-12">
          <label for="mercancia">Mercancías</label>
        </div>
        <div class="col-md-12">
          <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionsoli" [configuracionTabla]="configuracionColumnasoli"
            [datos]="cuerpoTabla" (listaDeFilaSeleccionada)="seleccionTabla($event)"
            [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"></app-tabla-dinamica>
        </div>
      </div>
      @if(!esFormularioSoloLectura){
      <div class="row">
        <div class="col-md-12 d-flex justify-content-end">
          <button type="button" class="btn btn-default" [disabled]="!notificationCheck || listSelectedView.length === 0"
            (click)="modificarMercancia()">Modificar</button>
          <button type="button" class="btn btn-danger ms-3"
            [disabled]="!notificationCheck || listSelectedView.length === 0"
            (click)="eliminarMercancia()">Eliminar</button>
          <button type="button" class="btn btn-primary ms-3" [disabled]="!notificationCheck"
            (click)="agregarMercancia()">Agregar</button>
        </div>
      </div>
      }
    </div>
  </form>
  <div>`
    @if(moduloEmergente){
    <lib-notificaciones [notificacionInput]="nuevaNotificacion"
      (confirmacionModal)="eliminarPedimento($event)"></lib-notificaciones>
    }
    @if(eliminarDatosTabla){
    <lib-notificaciones [notificacionInput]="nuevaNotificacion"
      (confirmacionModal)="eliminarPedimentoDatos($event)"></lib-notificaciones>
    }
  </div>
</div>
<app-modal #modalRef></app-modal>
