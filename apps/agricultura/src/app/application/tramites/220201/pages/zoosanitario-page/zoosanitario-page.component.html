
<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1>{{ tituloMensaje || null }}</h1>

      </div>
      @if(esFormaValido){
      <div class="col-md-12">
        <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
      </div>
      }
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno (tabChanged)="enTabChange($event)" #pasoUnoRef></app-paso-uno>
      <div class="row">
        <div class="col-md-12 d-flex justify-content-end">
          <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)" [btnGuardar]="true"
            [dePadre]="true" [btnGuardarVisible]="btnGuardarVisible"
            (btnGuardarClicked)="guardadoParcialSolicitud()"></btn-continuar>
        </div>
      </div>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      <div class="row">
        <div class="col-md-12 d-flex justify-content-end">
          <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)" [btnGuardar]="false"
            [dePadre]="true" [ocultabotonAnterior]="false" [btnGuardarVisible]="btnGuardarVisible">
          </btn-continuar>
        </div>
      </div>
      } @case (3) {
      <paso-firma [idSolicitud]="+this.numeroSolicitud" [procedure]="220201" [procedureUrl]="'registrozoosanitario'"></paso-firma>
      <div class="row">
        <div class="col-md-12 d-flex justify-content-end">
          <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)" [dePadre]="true"
            [btnGuardarVisible]="'false'" [ocultabotonAnterior]="false"
            ></btn-continuar>

        </div>
      </div>
      }
      @default {
      <app-paso-uno></app-paso-uno>
      }
      }

    </div>
    <div class="row">
      <div class="col-md-12">
        <div class="row">
          <p></p>
          <ng-alert [CONTENIDO]="PRIVACY_NOTICE_CONTENT"></ng-alert>
          <p></p>
        </div>
      </div>
    </div>
  </div>
</div>
