<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1>{{ tituloMensaje || null }}</h1>

      </div>
      @if(esFormaValido){
      <div class="col-md-12">
        <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
      </div>
      }
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno (tabChanged)="enTabChange($event)" #pasoUnoRef></app-paso-uno>
      } @case (2) {
      <app-paso-dos [idTipoTRamite]="'220201'" [datosUsuario]="datosUsuario" [idSolicitud]="numeroSolicitud.toString()"
        [cargaArchivosEvento]="cargarArchivosEvento" (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
        (reenviarCargaRealizada)="cargaRealizada($event)"
        (cargaEnProgresoChange)="onCargaEnProgresoPadre($event)"></app-paso-dos>
      } @case (3) {
      <paso-firma [idSolicitud]="+this.numeroSolicitud" [procedure]="220201"
        [procedureUrl]="'registrozoosanitario'"></paso-firma>
      }
      @default {
      <app-paso-uno></app-paso-uno>
      }
      }

    </div>
    <div class="row">
      <div class="col-md-12">
        @if (indice !== 2) {
        <btn-continuar [datos]="datosPasos" [btnGuardar]="btnGuardar" [btnGuardarVisible]="btnGuardarVisible"
          (continuarEvento)="getValorIndice($event)" [dePadre]="true"
          [btnHabilitarContinuar] = "true"
          (btnGuardarClicked)="guardadoParcialSolicitud()"></btn-continuar>
        } @else {
        <div class="mt-5 mb-3 d-flex justify-content-end">
          <button type="button" class="btn btn-default" (click)="anterior()" *ngIf="seccionCargarDocumentos">
            Anterior
          </button>
          <button class="btn btn-primary ms-3" (click)="seccionCargarDocumentos ? onClickCargaArchivos() : siguiente()"
            [disabled]="(seccionCargarDocumentos && !activarBotonCargaArchivos) || (!seccionCargarDocumentos && cargaEnProgreso)">
            {{ seccionCargarDocumentos ? 'Cargar archivos' : 'Continuar' }}
          </button>
        </div>
        }
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="row">
          <p></p>
          <ng-alert [CONTENIDO]="PRIVACY_NOTICE_CONTENT"></ng-alert>
          <p></p>
        </div>
      </div>
    </div>
  </div>
</div>
