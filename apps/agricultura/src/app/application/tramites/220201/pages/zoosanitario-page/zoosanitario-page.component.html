<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1>{{ tituloMensaje || null }}</h1>

      </div>
      @if(esFormaValido){
      <div class="col-md-12">
        <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
      </div>
      }
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno (tabChanged)="enTabChange($event)" #pasoUnoRef></app-paso-uno>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
      }
      @default {
      <app-paso-uno></app-paso-uno>
      }
      }

    </div>
    <div class="row">
      <div class="col-md-12 d-flex justify-content-end">
        <button type="button" class="btn btn-default">Guardar</button>
        <button type="button" class="btn btn-primary ms-3">Continuar</button>
      </div>
    </div>


    <div class="row">
      <div class="col-md-12">
        <div class="row">
          <p></p>
          <ng-alert [CONTENIDO]="PRIVACY_NOTICE_CONTENT"></ng-alert>
          <p></p>
        </div>
      </div>
    </div>
  </div>
</div>
