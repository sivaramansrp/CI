<div class="container" [formGroup]="MedioForm">
  <ng-titulo titulo="Destino" />
  <div class="row">
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="coordenadas">Coordenadas geográficas:</label>
        <input class="form-control" id="coordenadas" formControlName="coordenadas" type="number"
          (change)="setValoresStore(MedioForm, 'coordenadas', 'setCoordenadas')" />
      </div>
          </div>
    </div>  
    <ng-titulo titulo="Medio de transporte" />    
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <app-catalogo-select [catalogo]="medio" [label]="'Medio de transporte'" [required]="true" name="medio" [isDisabled]="esFormularioSoloLectura"
            formControlName="medio" (change)="setValoresStore(MedioForm, 'medio', 'setMedio')">
          </app-catalogo-select>
        </div>
      </div>  
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="transporte">Identificación del transporte:</label>
          <input class="form-control" id="transporte" formControlName="transporte" type="number"
            (change)="setValoresStore(MedioForm, 'transporte', 'setTransporte')" />
        </div>
          </div>
    </div>   
    <div class="row">
      <div class="col-md-8">
        <div class="form-group">
          <app-catalogo-select [catalogo]="verificacion" [label]="'Punto de verificación federal:'" [required]="true" [isDisabled]="esFormularioSoloLectura"
            name="verificacion" formControlName="verificacion" (change)="setValoresStore(MedioForm, 'verificacion', 'setVerificacion')">
          </app-catalogo-select>
        </div>
      </div>
    </div>    
    <div class="row">
      <div class="col-md-8">
        <div class="form-group">
          <label class="form-label" for="empresa">Nombre de la empresa transportista:*</label>
          <input class="form-control" id="empresa" formControlName="empresa" type="text"
            (change)="setValoresStore(MedioForm, 'empresa', 'setEmpresa')" />
        </div>
        @if(MedioForm.controls['empresa'].invalid && MedioForm.controls['empresa'].touched) {
          <div class="d-grid">
            @if(MedioForm.controls['empresa'].errors?.['required']) {
              <span class="mensaje-error">Este campo es obligatorio</span>
            }
          </div>
        }
      </div>
    </div>
  </div>
