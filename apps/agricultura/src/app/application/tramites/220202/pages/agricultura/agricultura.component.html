<div class="page">
    <div class="container">
      <div class="row">
        <div class="col-md-10">
          <h1>Captura del certificado fitosanitario para importación</h1>
        </div>
        @if (esFormaInValido) {
        <div class="alert alert-info alert-danger text-center" [innerHTML]="formErrorAlert"></div>
        }
        <app-wizard [listaPasos]="pasos"></app-wizard>
      </div>
  
      <div class="row">
        @switch (indice) { @case (1) {
        <app-paso-uno></app-paso-uno>
        } @case (2) {
        <app-paso-dos></app-paso-dos>
        } @case (3) {
        <app-paso-tres></app-paso-tres>
        }
        @default {
          <app-paso-uno></app-paso-uno>
        }
        }
  
      </div>
    <btn-continuar
      [datos]="datosPasos"
      [btnGuardar]="btnGuardar"
      [btnGuardarVisible]="btnGuardarVisible"
      (continuarEvento)="getValorIndice($event)"
      [btnHabilitarContinuar] = "true"
    ></btn-continuar>

                    <div class="row">
                      <ng-alert [CONTENIDO]="alertText"></ng-alert>
                    </div>
    </div>
  </div>
