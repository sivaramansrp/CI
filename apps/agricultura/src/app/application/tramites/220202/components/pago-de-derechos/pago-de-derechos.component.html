<div class="container">
  <div class="row">
    <ng-titulo [titulo]="'Pago de derechos'"></ng-titulo>
  </div>
  <div class="row">
    <form [formGroup]="pagoForm">
      <div class="row">
        <div class="col-md-8 form-group">
          <label class="form-label" for="coordenadas">Exento de pago*:</label>
          <app-input-radio [radioOptions]="exentoPagoRadio" [selectedValue]="exentoPagoValor" [isRequired]="true"
            [layout]="'horizontal'" formControlName="exentoPago" 
            (valueChange)="cambioValorRadio('exentoPago', $event.toString())"></app-input-radio>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="justificacionCatalogo" formControlName="justificacion"
            [label]="'Justificación'" [required]="true" [isDisabled]="esFormularioSoloLectura" (change)="
              setValoresStore(
                pagoForm,
                'justificacion'
              )
            "></app-catalogo-select>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 form-group">
          <label class="form-label" for="claveUCON">Clave de referencia:</label>
          <input formControlName="claveReferencia" class="form-control" id="claveReferencia" name="claveReferencia"
            placeholder="" type="text" libUppercase (change)="
            setValoresStore(
              pagoForm,
              'claveReferencia'
            )
          " />
        </div>
        <div class="col-md-4 form-group">
          <label class="form-label" for="claveUCON">Cadena de la dependencia:</label>
          <input formControlName="cadenaDependencia" class="form-control" id="cadenaDependencia"
            name="cadenaDependencia" placeholder="" type="text" libUppercase (change)="
            setValoresStore(
              pagoForm,
              'cadenaDependencia'
            )
          " />
        </div>
        <div class="col-md-4">
          <app-catalogo-select [catalogo]="bancoCatalogo" formControlName="banco" [label]="'Banco'" [required]="true"
             [isDisabled]="esFormularioSoloLectura" name="banco" (change)="
            setValoresStore(
              pagoForm,
              'banco'
            )
          "></app-catalogo-select>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4 form-group">
          <label class="form-label" for="claveUCON">Llave de pago:</label>
          <input formControlName="llavePago" class="form-control" id="llavePago" name="llavePago" placeholder=""
            type="text" libUppercase (change)="
            setValoresStore(
              pagoForm,
              'llavePago'
            )
          " />
        </div>
        <div class="col-md-4 form-group">
          <input-fecha [datos]="fechaFinalInput" (valorCambiado)="cambioFechaFinal($event)" name="fechaPago"
            [setFecha]="fechaPagoDate"></input-fecha>
        </div>
        <div class="col-md-4 form-group">
          <label class="form-label" for="claveUCON">Importe de pago:</label>
          <input formControlName="importePago" class="form-control" id="importePago" name="importePago" placeholder=""
            type="text" libUppercase (change)="
            setValoresStore(
              pagoForm,
              'importePago'
            )
          " />
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-md-12 d-flex justify-content-end">
          <div>
            <button class="btn btn-primary">Borrar datos del pago</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
