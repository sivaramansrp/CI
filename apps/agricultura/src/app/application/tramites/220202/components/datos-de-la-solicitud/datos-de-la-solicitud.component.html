<div class="container">
  <div class="row mt-4">
    <div class="col-md-12">
      <div class="panel-group ficha-collapse" id="accordion">
        <div class="panel panel-default">
          <div class="panel-heading" (click)="mostrar_colapsable()">
            <h4 class="panel-title">
              <a> <i class="bi bi-arrow-repeat"></i> </a>
            </h4>
            <button type="button" class="collpase-button collapsed"></button>
          </div>
          <div *ngIf="colapsable" class="panel-collapse collapse in" id="panel-01">
            <div class="panel-body">
              <div class="row">
                <ng-alert [CONTENIDO]="instruccionDobleClic"></ng-alert>
              </div>
              <div class="row">
                <h5>Solicita</h5>
                <div class="row">
                  <div class="col-md-12">
                    <app-tabla-dinamica
                    [tipoSeleccionTabla]="tipoSeleccionsoli"
                    [configuracionTabla]="configuracionColumnasoli"
                    [datos]="cuerpoTabla"
                    [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
                  >
                  </app-tabla-dinamica>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12">
      <ng-titulo titulo="Datos del trámite a realizar"></ng-titulo>
    </div>
  </div>
  <form [formGroup]="forma">
      <div class="row">
        <div class="col-md-12">
          <app-catalogo-select
            [catalogo]="aduanaList"
            formControlName="aduanaDeIngreso"
            [label]="'Aduana de ingreso'"
            [required]="true"
            [isDisabled]="esFormularioSoloLectura"
            name="aduanaDeIngreso"
            (change)="setValoresStore(forma, 'aduanaDeIngreso')"
          ></app-catalogo-select>
        </div>
        <div class="col-md-12">
          <app-catalogo-select
            [catalogo]="agropecuariaList"
            formControlName="oficinaDeInspeccion"
            [label]="'Oficina de inspección de Sanidad Agropecuaria'"
            [required]="true"
               [isDisabled]="esFormularioSoloLectura"
            name="oficinaDeInspeccion"
            (change)="setValoresStore(forma, 'oficinaDeInspeccion')"
          ></app-catalogo-select>
        </div>
        <div class="col-md-12">
          <app-catalogo-select
            [catalogo]="puntoList"
            formControlName="puntoDeInspeccion"
            [label]="'Punto de inspección'"
            [required]="true"
             [isDisabled]="esFormularioSoloLectura"
            name="puntoDeInspeccion"
            (change)="setValoresStore(forma, 'puntoDeInspeccion')"
          ></app-catalogo-select>
        </div>
      
        
      </div>
      <div class="row">
        <div class="col-md-6 mt-2">
          <label class="control-label" for="guia">Número de guía:</label>
          <input
            class="form-control"
            id="numeroDeGuia"
            type="text"
            name = "numeroDeGuia"
            formControlName="numeroDeGuia"
            (change)="setValoresStore(forma, 'numeroDeGuia')"
          />
        </div>
        <div class="col-md-6">
          <app-catalogo-select
            [catalogo]="regimeList"
            formControlName="regimen"
            [label]="'Régimen'"
            [required]="true"
          [isDisabled]="esFormularioSoloLectura"
            name="regimen"
            (change)="setValoresStore(forma, 'regimen')"
          ></app-catalogo-select>
        </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <label class="control-label" for="ferrocarril">Número de Carro de Ferrocarril:</label>
            <input
              class="form-control"
              id="numeroDeCarro"
              type="text"
              formControlName="numeroDeCarro"
              name="numeroDeCarro"
              (change)="setValoresStore(forma, 'numeroDeCarro')"
            />
          </div>
      
        </div>
        <div class="row">
          <div class="col-md-12">
            <h5>Mercancías</h5>
          </div>
          <div class="col-md-12">
            <app-tabla-dinamica
            [tipoSeleccionTabla]="tipoSeleccionsoliMercancias"
            [configuracionTabla]="configuracionColumnasoli"
            [datos]="cuerpoTabla"
          >
          </app-tabla-dinamica>
          </div>
        </div>
        <div class="row">
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="aduanaList"
              formControlName="tipoDeRequisito"
              [label]="'Tipo de requisito'"
              [required]="true"
                   [isDisabled]="esFormularioSoloLectura"
              name="tipoDeRequisito"
              (change)="setValoresStore(forma, 'tipoDeRequisito')"
            ></app-catalogo-select>
          </div>
          <div class="col-md-4 mt-2">
            <label class="control-label" for="requisito">Requisito:</label>
            <input
              class="form-control"
              id="requisito"
              type="text"
              formControlName="requisito"
              name="requisito"
              (change)="setValoresStore(forma, 'requisito')"
            />
          </div>
          <div class="col-md-4 mt-2">
            <label class="control-label" for="internacional">Número de certificado internacional:</label>
            <input
              class="form-control"
              id="numeroCertificadoInternacional"
              type="text"
              formControlName="numeroCertificadoInternacional"
              name="numeroCertificadoInternacional"
              (change)="setValoresStore(forma, 'numeroCertificadoInternacional')"
            />
          </div>
            
        </div>
        <div class="row">
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="arancelariaList"
              formControlName="fraccionArancelaria"
              [label]="'Fracción arancelaria'"
              [required]="true"
                   [isDisabled]="esFormularioSoloLectura"
              name="fraccionArancelaria"
              (change)="setValoresStore(forma, 'fraccionArancelaria')"
            ></app-catalogo-select>
          </div>
          <div class="col-md-8 mt-2">
            <label class="control-label" for="fraccionArancelaria">Descripción de la fracción arancelaria:</label>
            <input
              class="form-control"
              id="descripcionFraccion"
              formControlName="descripcionFraccion"
              type="text"
              name="descripcionFraccion"
              (change)="setValoresStore(forma, 'fraccionArancelaria')"
            />
          </div>
      
        </div>
        <div class="row">
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="nicoList"
              formControlName="nico"
              [label]="'Nico'"
              [required]="true"
                  [isDisabled]="esFormularioSoloLectura"
              name="nico"
              (change)="setValoresStore(forma, 'nico')"
            ></app-catalogo-select>
          </div>
          <div class="col-md-8 mt-2">
            <label class="control-label" for="descFraccion">Descripción Nico:</label>
            <input
              class="form-control"
              id="descripcionNico"
              type="text"
              formControlName="descripcionNico"
              name="descripcionNico"
              (change)="setValoresStore(forma, 'descripcionNico')"
            />
          </div>
        </div>
        <div class="row">
          <div class="col-md-12 mt-2">
            <label class="control-label" for="descripcion">Descripción:</label>
            <textarea
              class="form-control"
              rows="12"
              formControlName="descripcion"
              name="descripcion"
              (change)="setValoresStore(forma, 'descripcion')"
            ></textarea>
          </div>      
        </div>
        <div class="row">
          <div class="col-md-4 mt-2">
            <label class="control-label" for="umc">Cantidad UMT:*</label>
            <input class="form-control" id="cantidadUMT" type="text" formControlName="cantidadUMT" name="cantidadUMT" (change)="setValoresStore(forma, 'cantidadUMT')" />
          </div>
          <div class="col-md-4 mt-2">
            <label class="control-label" for="umt">UMT:*</label>
            <input class="form-control" id="umt" name="umt" type="text" formControlName="umt" (change)="setValoresStore(forma, 'umc')" />
          </div>
          <div class="col-md-4 mt-2">
            <label class="control-label" for="cantidadUMC">Cantidad UMC*:</label>
            <input class="form-control" id="cantidadUMC" name="cantidadUMC" type="text" formControlName="cantidadUMC" (change)="setValoresStore(forma, 'cantidadUMC')" />
          </div>
      
        </div>
        <div class="row">
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="umcList"
              formControlName="umc"
              [label]="'UMC'"
              [required]="true"
               [isDisabled]="esFormularioSoloLectura"
              name="umc"
              (change)="setValoresStore(forma, 'umc')"
            ></app-catalogo-select>
          </div>
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="usoList"
              formControlName="uso"
              [label]="'Uso'"
              [required]="true"
               [isDisabled]="esFormularioSoloLectura"
              name="uso"
              (change)="setValoresStore(forma, 'uso')"
            ></app-catalogo-select>
          </div>
          <div class="col-md-4">
            <app-catalogo-select
              [catalogo]="productoList"
              formControlName="tipoDeProducto"
              [label]="'Tipo de producto'"
              [required]="true"
              [isDisabled]="esFormularioSoloLectura"
              name="tipoDeProducto"
              (change)="setValoresStore(forma, 'tipoDeProducto')"
            ></app-catalogo-select>
          </div>
        </div>
    </form>

    <div class="row mt-2">
      <div class="col-md-12 d-flex justify-content-end">
        <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">Limpiar</button>
        <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">Cancelar</button>
        <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">Agregar</button>
      </div>
    </div>
  



</div>
