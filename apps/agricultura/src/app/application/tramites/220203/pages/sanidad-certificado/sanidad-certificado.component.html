<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-10">
        <h1>Captura del certificado de sanidad acuícola para importación</h1>
      </div>
      @if (esFormaInValido) {
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="FORM_ERROR_ALERT" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
      }
      @if (esPasoUnoCompleto) {
        <div class="alert alert-info" [innerHTML]="mensajePasos"></div>
      }
      <app-wizard [listaPasos]="PASOS"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) {
        @case (1) {
          <app-paso-uno #pasoUnoRef></app-paso-uno>
        }
        @case (2) {
          <app-paso-dos
            [idTipoTRamite]="'220202'"
            [datosUsuario]="datosUsuario"
            [idSolicitud]="idSolicitud"
            [cargaArchivosEvento]="cargarArchivosEvento"
            (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
            (reenviarCargaRealizada)="cargaRealizada($event)"
            (cargaEnProgresoChange)="onCargaEnProgresoPadre($event)"></app-paso-dos>
        }
        @case (3) {
          <!--      <app-paso-tres></app-paso-tres>-->
          <paso-firma [idSolicitud]="+idSolicitud" [procedure]="220203" [procedureUrl]="'sanidad'"></paso-firma>
        }
      }
      <div class="row">
        <div class="col-md-12">
          @if (indice !== 2) {
            <btn-continuar
              [datos]="datosPasos"
              [btnGuardar]="btnGuardar"
              [btnGuardarVisible]="btnGuardarVisible"
              (continuarEvento)="getValorIndice($event)"
              [btnHabilitarContinuar]="true"
              (btnGuardarClicked)="guardarDatosFormulario()"
            ></btn-continuar>
          } @else {
            <div class="mt-5 mb-3 d-flex justify-content-end">
              @if (seccionCargarDocumentos) {
                <button type="button" class="btn btn-default" (click)="anterior()">
                  Anterior
                </button>
              }
              <button class="btn btn-primary ms-3"
                      (click)="seccionCargarDocumentos ? onClickCargaArchivos() : siguiente()"
                      [disabled]="(seccionCargarDocumentos && !activarBotonCargaArchivos) || (!seccionCargarDocumentos && cargaEnProgreso)">
                {{ seccionCargarDocumentos ? 'Cargar archivos' : 'Continuar' }}
              </button>
            </div>
          }
        </div>
      </div>
      <ng-alert [CONTENIDO]="PRIVACY_NOTICE_CONTENT"></ng-alert>
    </div>
  </div>
</div>
