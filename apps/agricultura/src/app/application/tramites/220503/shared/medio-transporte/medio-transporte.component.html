<fieldset [formGroupName]="claveDeControl">
  <ng-titulo titulo="Medio de transporte" />
  <div class="row">
    <div class="col-md-4">
      <div class="form-field">
        <app-catalogo-select
          id="Mediodetransporte"
          [catalogo]="mediodetransporte.catalogos"
          [label]="mediodetransporte.labelNombre"
          [placeholder]="mediodetransporte.primerOpcion"
          [required]="mediodetransporte.required"
          formControlName="transporteIdMedio"
          (selectionChange)="setTransporteIdMedio($event)"
          [isDisabled]="esFormularioSoloLectura"
        ></app-catalogo-select>
           <div *ngIf="grupoFormularioPadre.get(claveDeControl)?.get('transporteIdMedio')?.hasError('required') 
          && grupoFormularioPadre.get(claveDeControl)?.get('transporteIdMedio')?.touched"
          class="text-danger">
          <small>Este campo es obligatorio.</small>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-field">
        <label for="puntos" class="form-label"
          >Identificación del transporte:</label
        >
        <input
          class="form-control"
          type="text"
          size="30"
          formControlName="identificacionTransporte"
          id="puntos"
          (change)="setIdentificacionTransporte($event)"
          [disabled]="esFormularioSoloLectura"
        />
        <div
          *ngIf="grupoFormularioPadre.get(claveDeControl)?.get('identificacionTransporte')?.errors?.['maxlength'] &&
          grupoFormularioPadre.get(claveDeControl)?.get('identificacionTransporte')?.touched
  "
        >
          Se superó la longitud máxima de 30 caracteres.
        </div>
      </div>
    </div>
    <div class="col-md-12 mt-5">
      <label class="form-label" for="solicituddeInspección"
        >¿La solicitud de Inspección Física es para trámites que arriban por
        Ferrocarril o por Partes II?*:</label
      >
      <app-input-radio
        [radioOptions]="opcionDeBotonDeRadio"
        [isRequired]="true"
        [selectedValue]="esSolicitudFerrosValor"
        [layout]="'vertical'"
        formControlName="esSolicitudFerros"
        (valueChange)="enCambioDeValor($event)"
        
      ></app-input-radio>
    </div>
    @if(enCambioValor === '1') {
    <div class="col-md-12 mt-2">
         <ng-alert [CONTENIDO]="ES_SOLICITUD_FERROS_VALOR"></ng-alert>
    </div>
     }
    <div class="col-md-12">
      <div class="form-field">
        <label for="Datosdelamercancía" class="form-label"
          >Datos de la mercancía:</label
        >
      </div>
    </div>
    <div class="col-md-12">
      <ng-table
        [commonTableHeader]="tableData.tableHeader"
        [commonTableBody]="tableData.tableBody"
        [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
      ></ng-table>
    </div>
  </div>
</fieldset>
