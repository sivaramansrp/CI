<div class="container">
    <div class="row">
        <ng-titulo titulo="Terceros relacionados" />
    </div>
    <div class="row">
        <div class="col-md-12">
            <ng-alert [CONTENIDO]="seleccionado" [CUSTOMECLASS]="infoAlert"></ng-alert>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <h5>Exportador *</h5>
        </div>
        <div class="col-md-12">
            <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionsoli"
                [configuracionTabla]="configuracionColumnasExportador"
                [datos]="cuerpoTablaExportador" 
                [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
                ></app-tabla-dinamica>
        </div>
        <div class="col-md-12 d-flex justify-content-end">
                <button class="btn btn-primary me-3" [disabled]="esFormularioSoloLectura">Agregar</button>
                <button class="btn btn-default" [disabled]="esFormularioSoloLectura">Buscar</button>      
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <h5>Destinatario (destino final)*</h5>
        </div>
        <div class="col-md-12">
            <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionsoli"
                [configuracionTabla]="configuracionColumnasDestino" [datos]="cuerpoTablaDestino" [disableSeleccionTablaCheckBox]="esFormularioSoloLectura" (listaDeFilaSeleccionada)="onSeleccionDestinatario($event)"></app-tabla-dinamica>
        </div>
         <div class="col-md-12 d-flex justify-content-end" *ngIf="cuerpoTablaDestino.length === 0">
                <button class="btn btn-primary me-3" [disabled]="esFormularioSoloLectura" (click)="goToAgregarDestinatario()">Agregar</button>
                <button class="btn btn-default" [disabled]="esFormularioSoloLectura">Buscar</button>      
        </div>
             <div class="col-md-12 d-flex justify-content-end" *ngIf="cuerpoTablaDestino.length === 1">
                <button class="btn btn-primary me-3" [disabled]="esFormularioSoloLectura || listaDeFilaSeleccionada.length === 0" (click)="modificarDestinatario()">Modificar</button>
                <button class="btn btn-default" [disabled]="esFormularioSoloLectura || listaDeFilaSeleccionada.length === 0" (click)="emitEliminar()">Eliminar</button>      
        </div>
    </div>
</div>
