<div class="container">
        <div class="row">
            <div class="col-12">
                <h2 class="fw-bold my-5 titulo-tasks">Verificar dictamen</h2>        
                <hr class="red">
            </div>
        </div>
    
        <div class="card">
            <div class="card-body">            
                    <div class="form-group">            
                        <label for="folio" class="form-label text-title">Folio del trámite:</label>
                        <label for="folio" class="form-label text-title">&nbsp;{{numeroDeTramite}}</label>
                    </div>
                    <div class="form-group">
                        <label for="tipoSolicitud" class="form-label text-title">Tipo de solicitud:</label>
                        <label for="folio" class="form-label text-title">&nbsp;Permiso Sanitario Previo de Importación de Productos</label>
                    </div>
            </div>
        </div>
        <br>
        <div class="form-group">            
            <div class="col-md-12 text-end">
                <button type="button" class="btn btn-primary"  (click)="guardarObservacion()">Generar observación</button>
                <button type="button" class="btn btn-primary" (click)="regresar()">Regresar</button>
            </div>            
        </div>
            <div class="form-group">            
                <label for="folio" class="form-label text-title">Justificacion de la Observación:</label>
                <textarea id="tipoAnalisis" formControlName="tipoAnalisis" class="form-control"
                                placeholder="Fundamento del dictamen"  rows="8"></textarea>
            </div>
            <div class="row mb-5 mt-5">
                <app-reviewers-tabs [viewChild]="viewChild" [tramite]="tramite"
                    (viewChildcambioDePestana)="viewChildcambioDePestana($event)"></app-reviewers-tabs>
            </div>
            
        
</div>
