<div class="container">
    <div class="row">
        <div class="col-md-6">
            <h2>Aviso sanitario de importación de productos</h2>
        </div>

        <app-wizard [listaPasos]="pasos"></app-wizard>

    </div>

    <div class="row">
        @switch (indice) {
        @case (1) {
        <app-datos></app-datos>
        }
        @case (2) {
        <app-paso-dos></app-paso-dos>
        }
        @case (3) {
        <app-firmar-solicitud></app-firmar-solicitud>
        }
        }

        <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
        @if (indice === 1) {
            <ng-alert [CONTENIDO]="TEXTOS.ADJUNTAR" [CUSTOMECLASS]="infoAlert"></ng-alert>
        }
    </div>    
</div>
