<div class="row mt-5">
    <div class="col-md-12">
        <div class="panel-group ficha-collapse" id="accordion">
            <div class="panel panel-default">
                <div class="panel-heading" (click)="mostrarColapsable()" (keyup.enter)="mostrarColapsable()"
                    tabindex="0">
                    <p class="panel-title">
                        <i class="bi bi-person-arms-up" aria-hidden="true"></i>Opciones de
                        pre-llenado de Solicitud
                    </p>
                    <button type="button" class="collpase-button" [class.collapsed]="!colapsable" (keydown)="mostrarColapsable()"> </button>
                </div>
                @if(colapsable){
                <div class="panel-collapse collapse in" id="panel-01">
                    <div class="panel-body">

                        <ng-alert class="alert-align" [CONTENIDO]="TEXTOS"></ng-alert>

                        <div class="col-md-12 mr-0">
                            <label for="solicitud">Solicitud</label>
                        </div>
                        <div class="col-md-12">
                            <app-tabla-dinamica [tipoSeleccionTabla]="tipoSeleccionTabla" [configuracionTabla]="configuracionTabla" [datos]="solicitudDatos" ></app-tabla-dinamica>
                        </div>
                    </div>
                </div>
                }
            </div>
        </div>
    </div>
</div>

<!--Datos del establecimiento-->

<app-datos-del-establecimiento #datosDelEstablecimiento></app-datos-del-establecimiento>
