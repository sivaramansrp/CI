<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header d-flex justify-content-between">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="cerrarModal()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
        <div class="modal-body">
            <ng-titulo titulo="Datos mercancía" />
            <form [formGroup]="agregarMercanciaForm">
                <div class="row">
                    <div class="col-md-8">
                        <app-catalogo-select [catalogo]="productoClasificacion" formControlName="cveProductoClasificacion"
                            [label]="'Clasificación del producto'" [required]="true" name="cveProductoClasificacion"
                            (change)="productoClasificacionSeleccion()" [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <app-catalogo-select [catalogo]="especificoProductoClasificacion"
                            formControlName="cveEspecificoProductoClasifi" [label]="'Especificar clasificación del producto'"
                            [required]="true" name="cveEspecificoProductoClasifi"
                            (change)="especificoProductoClasificacionSeleccion()" [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <label for="nombreProducto" class="form-label">Denominación específica del producto*:</label>
                        <input type="text" name="nombreProducto" id="nombreProducto" class="form-control"
                            formControlName="nombreProducto"
                            (change)="setValoresStore(agregarMercanciaForm,'nombreProducto', 'setNombreProducto')">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <label for="marca" class="form-label">Marca comercial o denominación distintiva*:</label>
                        <input type="text" name="marca" id="marca" class="form-control" formControlName="marca"
                            (change)="setValoresStore(agregarMercanciaForm,'marca', 'setMarca')">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <app-catalogo-select [catalogo]="tipoProducto" formControlName="cveTipoProducto"
                            [label]="'Tipo de producto'" [required]="true" name="cveTipoProducto"
                            (change)="tipoProductoSeleccion()" [isDisabled]="esFormularioSoloLectura"></app-catalogo-select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <label for="fraccionArancelaria" class="form-label">Fracción arancelaria*: <span
                                class="bi bi-question-circle-fill" title="" data-bs-toggle="tooltip"></span></label>
                        <input type="text" name="fraccionArancelaria" id="fraccionArancelaria" class="form-control"
                            formControlName="fraccionArancelaria"
                            (change)="setValoresStore(agregarMercanciaForm,'fraccionArancelaria', 'setFraccionArancelaria')">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <label for="fraccionArancelariaDescripcion" class="form-label">Descripción de la fracción
                            arancelaria*:</label>
                        <input type="text" name="fraccionArancelariaDescripcion" id="fraccionArancelariaDescripcion"
                            class="form-control" formControlName="fraccionArancelariaDescripcion"
                            (change)="setValoresStore(agregarMercanciaForm,'fraccionArancelariaDescripcion', 'setFraccionArancelariaDescripcion')">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <label for="modelo" class="form-label">Modelo*:</label>
                        <input type="text" name="modelo" id="modelo" class="form-control" formControlName="modelo"
                            (change)="setValoresStore(agregarMercanciaForm,'modelo', 'setModelo')">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-8">
                        <label for="productoDescripcion" class="form-label">Descripción del producto*:</label>
                        <input type="text" name="productoDescripcion" id="productoDescripcion" class="form-control"
                            formControlName="productoDescripcion"
                            (change)="setValoresStore(agregarMercanciaForm,'productoDescripcion', 'setProductoDescripcion')">
                    </div>
                </div>

                <div class="row mt-5">
                    <div class="col-md-12">
                        <div class="panel-group ficha-collapse" id="accordion">
                            @for(panel of panels; let i = $index; track i) {
                            <div class="panel panel-default mb-3">
                                <div class="panel-heading" (click)="mostrar_colapsable(i)">
                                    <h4 class="panel-title">
                                        <a>
                                            {{ panel.label }}
                                        </a>
                                    </h4>
                                    <button type="button" class="collpase-button" [class.collapsed]="panel.isCollapsed"></button>
                                </div>
                                <div class="panel-collapse" [id]="'panel-' + i"
                                    [ngClass]="{'collapse': panel.isCollapsed, 'in': !panel.isCollapsed}">
                                    <div class="panel-body">
                                        <!-- País de orígen -->
                                        <ng-container *ngIf="i === 0">
                                            <crosslist 
                                            [id]="'paisDeOrigen'"
                                            [fechas]="seleccionarPaisOrigen" [botones]="botones"
                                            (fechasSeleccionadasChange)="paisChange($event)"
                                            [fechasSeleccionadas]="seleccionadaPaisOrigen"
                                                [label]="paisOrigenCrosslistDatos.label"></crosslist>
                                        </ng-container>

                                        <!-- País de procedencia -->
                                        <ng-container *ngIf="i === 1">
                                            <crosslist 
                                            [id]="'paisDeProcedencia'"
                                            [fechas]="seleccionarPaisProcedencia" [botones]="botones"
                                            (fechasSeleccionadasChange)="paisDeProcedenciaChange($event)"
                                            [fechasSeleccionadas]="seleccionadaPaisProcedencia"
                                                [label]="paisProcedencisCrosslistDatos.label"></crosslist>
                                        </ng-container>
                                    </div>
                                </div>
                            </div>
                            }
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-8">
                        <app-catalogo-select [catalogo]="paisDestino" formControlName="cvePaisDestino" [label]="'País de destino'"
                            [required]="true" name="cvePaisDestino" [isDisabled]="true"></app-catalogo-select>
                    </div>
                </div>

                <div class="row mt-5">
                    <div class="col-md-12">
                        <div class="panel-group ficha-collapse" id="accordion">
                            <div class="panel panel-default">
                                <div class="panel-heading" (click)="mostrar_uso_especifico_colapsable()">
                                    <h4 class="panel-title">
                                        <a>Uso específico</a>
                                    </h4>
                                    <button type="button" class="collpase-button collapsed"></button>
                                </div>
                                @if(colapsable){
                                <div class="panel-collapse collapse in" id="panel-01">
                                    <div class="panel-body">
                                        <crosslist 
                                        [id]="'usoEspecifico'"
                                        [fechas]="seleccionarUsoEspecifico" [botones]="botones"
                                        (fechasSeleccionadasChange)="usoEspecificoChange($event)"
                                        [fechasSeleccionadas]="seleccionadaUsoEspecifico"
                                            [label]="usoEspecificoCrosslistDatos.label"></crosslist>
                                    </div>
                                </div>
                                }
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer custom-footer">
            <div class="row">
                <div class="col-md-12">
                    <div class="pull-right">
                        <button type="button" name="limpiarSCIAN" class="btn btn-danger" (click)="limpiarSCIAN()">
                            Limpiar
                        </button>
                        <button type="button" name="cancelar" class="btn btn-default ms-2" (click)="cerrarModal()">
                            Cancelar
                        </button>
                        <button type="button" name="agregar" class="btn btn-primary ms-2" (click)="agregarMercancia()">
                            Agregar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
