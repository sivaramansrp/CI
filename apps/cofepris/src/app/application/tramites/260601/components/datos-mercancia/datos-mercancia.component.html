<form [formGroup]="agregarMercanciaForm">
    <div class="row">
        <div class="col-md-8">
            <app-catalogo-select [catalogo]="productoClasificacion" formControlName="cveProductoClasificacion"
                [label]="'Clasificación del producto'" [required]="true" name="cveProductoClasificacion"
                (change)="productoClasificacionSeleccion()"></app-catalogo-select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-8">
            <app-catalogo-select [catalogo]="especificoProductoClasificacion"
                formControlName="cveEspecificoProductoClasifi" [label]="'Especificar clasificación del producto'"
                [required]="true" name="cveEspecificoProductoClasifi"
                (change)="especificoProductoClasificacionSeleccion()"></app-catalogo-select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-8">
            <label for="nombreProducto" class="form-label">Denominación específica del producto*:</label>
            <input type="text" name="nombreProducto" id="nombreProducto" class="form-control"
                formControlName="nombreProducto">
        </div>
    </div>
    <div class="row">
        <div class="col-md-8">
            <label for="marca" class="form-label">Marca comercial o denominación distintiva*:</label>
            <input type="text" name="marca" id="marca" class="form-control" formControlName="marca">
        </div>
    </div>
    <div class="row">
        <div class="col-md-8">
            <app-catalogo-select [catalogo]="tipoProducto" formControlName="cveTipoProducto"
                [label]="'Tipo de producto'" [required]="true" name="cveTipoProducto"
                (change)="tipoProductoSeleccion()"></app-catalogo-select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-8">
            <label for="fraccionArancelaria" class="form-label">Fracción arancelaria*:</label>
            <input type="text" name="fraccionArancelaria" id="fraccionArancelaria" class="form-control"
                formControlName="fraccionArancelaria">
        </div>
    </div>
    <div class="row">
        <div class="col-md-8">
            <label for="fraccionArancelariaDescripcion" class="form-label">Descripción de la fracción
                arancelaria*:</label>
            <input type="text" name="fraccionArancelariaDescripcion" id="fraccionArancelariaDescripcion"
                class="form-control" formControlName="fraccionArancelariaDescripcion">
        </div>
    </div>
    <div class="row">
        <div class="col-md-8">
            <label for="modelo" class="form-label">Modelo*:</label>
            <input type="text" name="modelo" id="modelo" class="form-control" formControlName="modelo">
        </div>
    </div>
    <div class="row">
        <div class="col-md-8">
            <label for="productoDescripcion" class="form-label">Descripción del producto*:</label>
            <input type="text" name="productoDescripcion" id="productoDescripcion" class="form-control"
                formControlName="productoDescripcion">
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-12">
            <div class="panel-group ficha-collapse" id="accordion">
                @for(panel of panels; let i = $index; track i) {
                <div class="panel panel-default mb-3">
                    <div class="panel-heading" (click)="mostrar_colapsable(i)">
                        <h4 class="panel-title">
                            <a>
                                {{ panel.label }}
                            </a>
                        </h4>
                        <button type="button" class="collpase-button" [class.collapsed]="panel.isCollapsed"></button>
                    </div>
                    <div class="panel-collapse" [id]="'panel-' + i"
                        [ngClass]="{'collapse': panel.isCollapsed, 'in': !panel.isCollapsed}">
                        <div class="panel-body">
                            <!-- País de orígen -->
                            <ng-container *ngIf="i === 0">
                                <app-pais-de-origen></app-pais-de-origen>
                            </ng-container>

                            <!-- País de procedencia -->
                            <ng-container *ngIf="i === 1">
                                <app-pais-de-procedencia></app-pais-de-procedencia>
                            </ng-container>
                        </div>
                    </div>
                </div>
                }
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <app-catalogo-select [catalogo]="paisDestino" formControlName="cvePaisDestino" [label]="'País de destino'"
                [required]="true" name="cvePaisDestino" (change)="paisDestinoSeleccion()"></app-catalogo-select>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-12">
            <div class="panel-group ficha-collapse" id="accordion">
                <div class="panel panel-default">
                    <div class="panel-heading" (click)="mostrar_uso_especifico_colapsable()">
                        <h4 class="panel-title">
                            <a>Uso específico</a>
                        </h4>
                        <button type="button" class="collpase-button collapsed"></button>
                    </div>
                    @if(colapsable){
                    <div class="panel-collapse collapse in" id="panel-01">
                        <div class="panel-body">
                            <crosslist [fechas]="seleccionarUsoEspecifico" [botones]="usoEspecificoBotons"
                                [label]="usoEspecificoLabel"></crosslist>
                        </div>
                    </div>
                    }
                </div>
            </div>
        </div>
    </div>
</form>
