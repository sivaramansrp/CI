<ng-titulo titulo="Representante legal"></ng-titulo>
<form [formGroup]="representante">
    <div class="form">
        <div class="row align-item-end">
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="rfc">RFC*:</label>
                    <input
                        class="form-control"
                        id="rfc"
                        placeholder=""
                        type="text"
                        formControlName="rfc"
                        (change)="setValoresStore(representante,'rfc', 'setRfc')"
                    />
                    @if(representante.controls['rfc'].invalid && representante.controls['rfc'].touched){
                        <div class="d-grid">
                            @if(representante.controls['rfc'].errors?.['required']) {
                                <span class="mensaje-error">Este campo es obligatorio</span>
                            }
                        </div>
                    }
    
                </div>
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary me-2" (click)="obtenerValor()" [disabled]="esFormularioSoloLectura ? true : false">Buscar</button>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="nombre">Nombre o Razón Social*:</label>
                    <input
                        class="form-control"
                        id="nombre"
                        placeholder=""
                        type="number"
                        formControlName="nombre"
                    />
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="apellidoPaterno">Apellido paterno*:</label>
                    <input
                        class="form-control"
                        id="apellidoPaterno"
                        placeholder=""
                        type="text"
                        formControlName="apellidoPaterno"
                        
                    />
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="apellidoMaterno">Apellido materno:</label>
                    <input
                        class="form-control"
                        id="apellidoMaterno"
                        placeholder=""
                        type="text"
                        formControlName="apellidoMaterno"
                        
                    />
                </div>
            </div>
            
        </div>
    </div>
</form>
