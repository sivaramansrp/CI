<div class="page">
    <div class="container">
      <div class="row">
        <div class="col-md-6">
          <h2>Permiso sanitario de importación de productos del tabaco</h2>
        </div>
  
        <app-wizard [listaPasos]="pasos"></app-wizard>
  
      </div>
  
      <div class="row">
        @switch (indice) {
        @case (1) {
            <app-paso-uno></app-paso-uno>
        }
        @case (2) {
            2
        }
        @case (3) {
            3
        }
        }
  
        <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
      </div>
    </div>
  </div>
