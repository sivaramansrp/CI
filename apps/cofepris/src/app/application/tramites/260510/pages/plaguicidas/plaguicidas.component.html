<div class="page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <h3>
          Permiso de importación de muestras experimentales con fínes de pruebas de calidad relativas a la garantía de composición de los nutrientes vegetales (incluye
          estándares analíticos)
        </h3>
      </div>
    <div *ngIf="isPeligro" class="alert alert-danger text-center" role="alert" [innerHTML]="textoPeligro">
        {{textoPeligro}}
      </div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno #pasoUnoRef [isContinuarTriggered]="isContinuarTriggered" ></app-paso-uno>
      } @case (2) {
        <app-paso-carga-documento 
          [idSolicitud]="guardarIdSolicitud"
          [idTipoTRamite]="'260510'"
          [cargaArchivosEvento]="cargarArchivosEvento"
          (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
          (reenviarCargaRealizada)="cargaRealizada($event)"
          (cargaEnProgreso)="onCargaEnProgreso($event)"
        ></app-paso-carga-documento>
      } @case (3) {
      <paso-firma [idSolicitud]="guardarIdSolicitud" [procedure]="260510" [procedureUrl]="'permiso-pruebas-nutrientes/plaguicidas'"></paso-firma>
      } }

      <btn-continuar
        [datos]="datosPasos"
        [dePadre]="true"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
      <app-aviso-de-privacidad *ngIf="indice === 1"></app-aviso-de-privacidad>
    </div>
  </div>
</div>
