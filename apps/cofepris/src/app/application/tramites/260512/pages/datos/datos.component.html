<div class="container">
    <div class="row">
        <ul class="nav nav-tabs">
            <li [ngClass]="indice === 1 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(1)">Solicitante</a>
            </li>
            <li [ngClass]="indice === 2 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(2)">Datos de la
                    solicitud</a>
            </li>
            <li [ngClass]="indice === 3 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(3)">Terceros
                    Relacionados</a>
            </li>
            <li [ngClass]="indice === 4 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(4)">Pago de
                    derechos</a>
            </li>

        </ul>
        <ng-container>
            
            <solicitante [hidden]="indice !== 1"></solicitante>
            
            @if(esDatosRespuesta){
                <app-datos-de-la [isAvisoLicenciaVisible]="isAvisoLicenciaVisible" 
                [isAduanasEntradaVisible]="isAduanasEntradaVisible" [configuracionVisibilidad]="configuracionVisibilidad" 
                [idProcedimiento]="idProcedimiento"[identificacion]="true"
[estadoValidte]="true" [hidden]="indice !== 2"></app-datos-de-la>
            }
            
            @if(esDatosRespuesta){
            <app-aviso-terceros-relacionados [hidden]="indice !== 3"></app-aviso-terceros-relacionados>
            }
           
            @if(esDatosRespuesta){
            <app-pago-de-derechos-contenedora [hidden]="indice !== 4"></app-pago-de-derechos-contenedora>
            }
            
        </ng-container>
    </div>
</div>
