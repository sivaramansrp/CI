<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
 <h1>Permiso de importación de muestras experimentales con fines de pruebas de calidad relativas a la garantía de composición de las sustancias tóxicas</h1>        </div>
        @if (esFormaValido) {
          <div class="col-md-12">
            <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
          </div>
        }
        <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
      </div>
      <div class="row">
        @switch (indice) { 
        @case (1) {
          <app-datos></app-datos>
        } @case (2) {
<app-paso-carga-documento 
          [idSolicitud]="solicitudState.idSolicitud"
          [idTipoTRamite]="'260512'"
          [cargaArchivosEvento]="cargarArchivosEvento"
          (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
          (reenviarCargaRealizada)="cargaRealizada($event)"
          (cargaEnProgreso)="onCargaEnProgreso($event)"
        ></app-paso-carga-documento>
        } @case (3) {
       <paso-firma [idSolicitud]="solicitudState.idSolicitud" [procedure]="260512" [procedureUrl]="'permiso-de-importacion/pantallaspage'"></paso-firma>
        }
       }
      </div>
      <div class="row">
    <div class="col-md-12">
      @if (indice !== 2) {
        <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
      } @else {
      <div class="mt-5 mb-3 d-flex justify-content-end">
        <button
          type="button"
          class="btn btn-default"
          (click)="anterior()"
          *ngIf="seccionCargarDocumentos"
        >
          Anterior
        </button>

        @if(isSaltar) {
          <button
            type="button"
            class="btn btn-default ms-3"
            (click)="saltar()"
          >
            Saltar
          </button>
        }

        <button
          class="btn btn-primary ms-3"
          (click)="
            seccionCargarDocumentos ? onClickCargaArchivos() : siguiente()
          "
          [disabled]="(seccionCargarDocumentos && !activarBotonCargaArchivos) || (!seccionCargarDocumentos && cargaEnProgreso)"
        >
          {{ seccionCargarDocumentos ? 'Cargar archivos' : 'Continuar' }}
        </button>
      </div>
      }
    </div>
  </div>
    <app-aviso-de-privacidad *ngIf="indice === 1"></app-aviso-de-privacidad>
</div>
