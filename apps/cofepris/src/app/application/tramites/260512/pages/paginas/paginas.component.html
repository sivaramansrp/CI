<div class="container mt-5">
    <div class="row">
        <div class="col-md-12 mb-3">
            <h1>Permiso de importación de muestras experimentales con fines de pruebas de calidad relativas a la garantía de composición de las sustancias tóxicas</h1>
        </div>
        @if (!esFormaValido && esFormaValido !== undefined) {
          <div class="col-md-12">
            <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
          </div>
        }
        <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
      </div>
      <div class="row">
        @switch (indice) { 
        @case (1) {
          <app-datos></app-datos>
        } @case (2) {
          <app-paso-dos></app-paso-dos>
        } @case (3) {
          <app-paso-tres></app-paso-tres>
        }
       }
      </div>
      <btn-continuar
      [datos]="datosPasos"
      [dePadre]="consultaState.readonly ? false : true"
      (continuarEvento)="getValorIndice($event)"
    >
    </btn-continuar>

    <div class="mt-5">
        <ng-alert [CONTENIDO]="avisoPrivacidadAlert"></ng-alert>
      </div>
</div>
