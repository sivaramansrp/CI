<div class="page">
    <div class="container mt-5">
      <div class="row">
        <h1>
          Permiso de importación de plaguicidas
        </h1>
        @if (!esFormaValido && esFormaValido !== undefined) {
          <div class="col-md-12">
            <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
          </div>
        }
        @if (esFormaValido) {
          <div class="col-md-12">
            <ng-alert [CONTENIDO]="formSuccessAlert"></ng-alert>
          </div>
        }
        <app-wizard [listaPasos]="pasos"></app-wizard>
      </div>
  
      <div class="row">
        @switch (indice) { @case (1) {
        <app-paso-uno></app-paso-uno>
        } @case (2) {
        <app-paso-dos></app-paso-dos>
        } @case (3) {
        <app-paso-tres></app-paso-tres>
        } }
  
        <btn-continuar
          [datos]="datosPasos"
          [dePadre]="consultaState.update ? false : true"
          (continuarEvento)="getValorIndice($event)"
        ></btn-continuar>
      </div>
    </div>
  </div>
