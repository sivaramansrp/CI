<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h1>{{ tituloMensaje || null }}</h1>
    </div>
    <ng-container *ngIf="indice === 2"> </ng-container>
    @if(esFormaValido){
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
        }
    <app-wizard [listaPasos]="pasos"></app-wizard>
  </div>

  <div class="row">
    @switch (indice) { @case (1) {
    <app-paso-uno #pasoUno></app-paso-uno>
    } @case (2) {
    <app-paso-dos></app-paso-dos>
    } @case (3) {
    <app-paso-tres></app-paso-tres>

    } }

    <btn-continuar
      [datos]="datosPasos"
      (continuarEvento)="getValorIndice($event)"
    ></btn-continuar>
  </div>
</div>
