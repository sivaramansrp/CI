<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        <h2>Solicitud de modificación y/o prórroga del permiso previo para muestras o consumo personal</h2>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>

    </div>

    <div class="row">
      @switch (indice) {
      @case (1) {
      <paso-uno></paso-uno>
      }
      @case (2) {
        <paso-dos></paso-dos>
        }
      @case (3) {
      <paso-tres></paso-tres>
      }
      }

      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    </div>
  </div>
</div>
