<div class="container form-container">
  <ng-titulo titulo="Pago de derechos" />
  <div>
    <form [formGroup]="formSolicitud">
      <ng-container formGroupName="datosImportadorExportador">
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="claveDeReferencia"
                >Clave de referencia:</label
              >
              <input
                class="form-control"
                id="claveDeReferencia"
                formControlName="claveDeReferencia"
                type="text"
                (change)="
                  setValoresStore(
                    datosImportadorExportador,
                    'claveDeReferencia',
                    'setClaveDeReferencia'
                  )
                "
              />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="cadenaDependencia"
                >Cadena de la dependencia:</label
              >
              <input
                class="form-control"
                id="cadenaDependencia"
                formControlName="cadenaDependencia"
                type="text"
                (change)="
                  setValoresStore(
                    datosImportadorExportador,
                    'cadenaDependencia',
                    'setCadenaDependencia'
                  )
                "
                appUppercase
              />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <div class="form-group">
                <app-catalogo-select
                  [catalogo]="bancoCatalogo.catalogos"
                  formControlName="banco"
                  [label]="'Banco'"
                  [isDisabled]="esFormularioSoloLectura"
          
                  (change)="
                    setValoresStore(
                      datosImportadorExportador,
                      'banco',
                      'setBanco'
                    )
                  "
                ></app-catalogo-select>
              </div>
            </div>
          </div>
        </div>

        <!-- Llave de pago, Fecha de pago, Importe de pago -->
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="llaveDePago"
                >Llave de pago:</label
              >
              <input
                class="form-control"
                id="llaveDePago"
                formControlName="llaveDePago"
                type="text"
                (change)="
                  setValoresStore(
                    datosImportadorExportador,
                    'llaveDePago',
                    'setllaveDePago'
                  )
                "
              />
            </div>
          </div>

          <div class="col-md-4">
            <div class="form-group">
              <input-fecha
                [datos]="INPUT_FECHA_CONFIG"
                [setFecha]="
                  formSolicitud.get('datosImportadorExportador.fechaPago')
                    ?.value
                "
                (valorCambiado)="
                  setValoresStore(
                    datosImportadorExportador,
                    'fechaPago',
                    'setFechaPago'
                  )
                "
              ></input-fecha>
            </div>
          </div>

          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="importePago"
                >Importe de pago:</label
              >
              <input
                class="form-control"
                id="importePago"
                formControlName="importePago"
                type="text"
                (change)="
                  setValoresStore(
                    datosImportadorExportador,
                    'importePago',
                    'setImportePago'
                  )
                "
                appUppercase
              />
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-12 text-right">
            <div class="form-group">
              <button
                type="button"
                class="btn btn-danger"
                [disabled]="esFormularioSoloLectura"
              >
                Borrar datos del pago
              </button>
            </div>
          </div>
        </div>
      </ng-container>
    </form>
  </div>
</div>
