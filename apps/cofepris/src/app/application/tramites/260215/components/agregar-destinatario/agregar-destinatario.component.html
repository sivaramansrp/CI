<div class="row">
    <div class="col-md-12">
      <h6 class="mb-5">Destinatario (destino final)*</h6>
      <app-tabla-dinamica
        [configuracionTabla]="configuracionTabla"
        [datos]="tercerosProd"
        [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX">
      </app-tabla-dinamica>
      <div style="text-align: right">
        <button style="text-align: right"
                type="button"
                class="btn btn-primary ms-2"
                data-bs-toggle="modal"
                data-bs-target="#modaldestinatario"
                (click)="abrirModaldestinatario()">
          Agregar
        </button>
      </div>
    </div>
  </div>
  
  <div class="container mt-4">
    <div class="modal fade" id="modaldestinatario" tabindex="-1" aria-labelledby="modaldestinatarioLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <ng-titulo titulo="Agregar Proveedor"></ng-titulo>
          </div>
          <div class="modal-body">
            <form [formGroup]="destinatarioForm">
              <h6>Datos generales</h6>
              <div class="row mb-3">
                <div class="col-md-6">
                  <div class="col-md-12">
                    <label class="form-label" for="tipoPersona">Tipo persona*:</label>
                    
                    <div>
                      <input type="radio" id="rediofisica" formControlName="rediofisica">
                      <label for="fisica">Física</label>
                    </div>
                    <div>
                      <input type="radio" id="rediomoral" formControlName="rediomoral">
                      <label for="moral">Moral</label>
                    </div>
                  </div>
                </div>
                <div class="row">
                <div class="col-md-6">
                  <label class="form-label" for="rfc">R.F.C*:</label>
                  <input type="text" class="form-control" id="destinatariorfc" formControlName="destinatariorfc"[ngClass]="isValid(destinatarioForm, 'destinatariorfc') ? 'required' : ''">
                </div>
              </div>
              </div>
              <div class="row">
                <div class="col-md-8 mb-3">
                  <label class="form-label" for="denominacion">Denominación/razón social*:</label>
                  <input type="text" class="form-control" id="destinatariodenominacion" formControlName="destinatariodenominacion" [ngClass]="isValid(destinatarioForm, 'destinatariodenominacion') ? 'required' : ''">
                </div>
              </div>
              <ng-titulo titulo="Domicilio"></ng-titulo>
              <div class="row">
                <div class="col-md-4">
                  <app-catalogo-select
                    [catalogo]="proveedorList"
                    formControlName="destinatariopail"
                    [label]="'Pail*'"
                    [placeholder]="'Seleccione una aduana'">
                    [ngClass]="isValid(destinatarioForm, 'destinatariopail') ? 'required' : ''"
                  </app-catalogo-select>
                </div>
                <div class="col-md-4 mb-3">
                  <app-catalogo-select
                    [catalogo]="proveedorList"
                    formControlName="destinatariomunicipio"
                    [label]="'Municipio*'"
                    [placeholder]="'Seleccione un municipio'">
                    [ngClass]="isValid(destinatarioForm, 'destinatariomunicipio') ? 'required' : ''"
                  </app-catalogo-select>
                </div>
                <div class="col-md-4">
                  <app-catalogo-select
                    [catalogo]="proveedorList"
                    formControlName="destinatariolocalidad"
                    [label]="'Localidad*'"
                    [placeholder]="'Seleccione una localidad'"
                    [ngClass]="isValid(destinatarioForm, 'destinatariolocalidad') ? 'required' : ''">
                  </app-catalogo-select>
                </div>
              </div>
              <div class="row">
                <div class="col-md-4">
                  <app-catalogo-select
                    [catalogo]="proveedorList"
                    formControlName="destinatarioApellido"
                    [label]="'Apellido*'"
                    [placeholder]="'Seleccione un apellido'" [ngClass]="isValid(destinatarioForm, 'destinatarioApellido') ? 'required' : ''">
                  </app-catalogo-select>
                </div>
                <div class="col-md-4 mb-3">
                  <app-catalogo-select
                    [catalogo]="proveedorList"
                    formControlName="destinatarioequivalente"
                    [label]="'Equivalente'"
                    [placeholder]="'Seleccione un equivalente'"
                    [ngClass]="isValid(destinatarioForm, 'destinatarioequivalente') ? 'required' : ''">
                  </app-catalogo-select>
                </div>
                <div class="col-md-4">
                  <app-catalogo-select
                    [catalogo]="proveedorList"
                    formControlName="destinatario"
                    [label]="'Destinatario*'"
                    [placeholder]="'Seleccione un destinatario'">
                  </app-catalogo-select>
                </div>
              </div>
              <div class="row">
                <div class="col-md-8">
                  <label class="form-label" for="destinatarionumeroCalle">Calle*:</label>
                  <input type="text" class="form-control" id="destinatarionumeroCalle" formControlName="destinatarionumeroCalle"
                  [ngClass]="isValid(destinatarioForm, 'destinatarionumeroCalle') ? 'required' : ''">
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="destinatarioexperior">Numero exterior*:</label>
                  <input type="text" class="form-control" id="destinatarioexperior" formControlName="destinatarioexperior"
                  [ngClass]="isValid(destinatarioForm, 'destinatarioexperior') ? 'required' : ''">
                </div>
              </div>
              <div class="row">
                <div class="col-md-4">
                  <label class="form-label" for="destinatariointerior">Numero interior:</label>
                  <input type="text" class="form-control" id="destinatariointerior" formControlName="destinatariointerior">
                </div>
                <div class="col-md-1 mb-3">
                  <label class="form-label" for="destinatariolada">Lada:</label>
                  <input type="text" class="form-control" id="destinatariolada" formControlName="destinatariolada">
                </div>
                <div class="col-md-3 mb-3">
                  <label class="form-label" for="destinatarionumerotelefono">Teléfono:</label>
                  <input type="text" class="form-control" id="destinatarionumerotelefono" formControlName="destinatarionumerotelefono">
                </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label" for="destinatariocorreoElectronico">Correo electrónico:</label>
                  <div class="input-group">
                    <input type="email" class="form-control" id="destinatariocorreoElectronico" formControlName="destinatariocorreoElectronico">
                  </div>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer custom-footer">
            <button type="button" class="btn btn-primary">Cancelar</button>
            <button type="button" class="btn btn-default" data-bs-dismiss="modal" #closeModal>Limpiar</button>
            <button type="button" class="btn btn-primary">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
