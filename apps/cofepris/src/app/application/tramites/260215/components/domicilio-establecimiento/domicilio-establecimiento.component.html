<ng-titulo titulo="Domicilio del establecimiento"></ng-titulo>
<form [formGroup]="domicilio">
  <div class="row">
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="codigoPostal">Código postal*:</label>
        <input
          class="form-control"
          id="codigoPostal"
          placeholder=""
          type="text"
          formControlName="codigoPostal"
          (change)="
            setValoresStore(domicilio, 'codigoPostal', 'setCodigoPostal')
          "
        />
      </div>
    </div>
    <div class="col-md-4">
      <app-catalogo-select
        [catalogo]="estado"
        formControlName="estado"
        [label]="'Estado'"
        [required]="true"
        [isDisabled]="esFormularioSoloLectura"
        name="estado"
        (change)="setValoresStore(domicilio, 'estado', 'setEstado')"
      ></app-catalogo-select>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="muncipio">Municipio o alcaldía*:</label>
        <input
          class="form-control"
          id="muncipio"
          placeholder=""
          type="text"
          formControlName="muncipio"
          (change)="setValoresStore(domicilio, 'muncipio', 'setMuncipio')"
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="localidad">Localidad:</label>
        <input
          class="form-control"
          id="localidad"
          placeholder=""
          type="text"
          formControlName="localidad"
          (change)="setValoresStore(domicilio, 'localidad', 'setLocalidad')"
        />
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="colonia">Colonia:</label>
        <input
          class="form-control"
          id="colonia"
          placeholder=""
          type="text"
          formControlName="colonia"
          (change)="setValoresStore(domicilio, 'colonia', 'setColonia')"
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-8">
      <div class="form-group">
        <label class="form-label" for="calle">Calle*:</label>
        <input
          class="form-control"
          id="calle"
          placeholder=""
          type="text"
          formControlName="calle"
          (change)="setValoresStore(domicilio, 'calle', 'setCalle')"
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-1">
      <div class="form-group">
        <label class="form-label" for="lada">Lada:</label>
        <input
          class="form-control"
          id="lada"
          placeholder=""
          type="number"
          formControlName="lada"
          (change)="setValoresStore(domicilio, 'lada', 'setLada')"
        />
      </div>
    </div>
    <div class="col-md-3">
      <div class="form-group">
        <label class="form-label" for="telefono">Teléfono*:</label>
        <input
          class="form-control"
          id="telefono"
          placeholder=""
          type="number"
          formControlName="telefono"
          (change)="setValoresStore(domicilio, 'telefono', 'setTelefono')"
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12 mt-5">
      <h4>S.C.I.A.N.*:</h4>
    </div>
  </div>
  <div class="row">
    <app-tabla-dinamica
      [tipoSeleccionTabla]="tablaSeleccionCheckbox"
      [configuracionTabla]="nicoTabla"
      [datos]="nicoTablaDatos"
    ></app-tabla-dinamica>
    <div class="container text-end mt-5">
      <button class="btn btn-default me-2">Eliminar</button>
      <button
        class="btn btn-primary me-2"
        data-bs-toggle="modal"
        data-bs-target="#modalAddAgent"
      >
        Agregar
      </button>
    </div>
  </div>
  <div class="row align-item-center">
    <div class="col-md-4">
      <div class="form-check">
        <input
          class="form-check-input"
          type="checkbox"
          id="avisoCheckbox"
          formControlName="avisoCheckbox"
          (change)="
            onAvisoCheckboxChange($event);
            setValoresStore(domicilio, 'avisoCheckbox', 'setAvisoCheckbox')
          "
        />
        <label class="form-check-label" for="avisoCheckbox">
          <span>Aviso de funcionamiento:</span>
        </label>
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="licenciaSanitaria"
          >No. de licencia sanitaria:</label
        >
        <input
          class="form-control"
          id="licenciaSanitaria"
          placeholder=""
          type="text"
          formControlName="licenciaSanitaria"
          (change)="
            setValoresStore(
              domicilio,
              'licenciaSanitaria',
              'setLicenciaSanitaria'
            )
          "
        />
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4">
      <app-catalogo-select
        [catalogo]="estado"
        formControlName="regimen"
        [label]="'Régimen'"
        [required]="true"
        [isDisabled]="esFormularioSoloLectura"
        name="regimen"
        (change)="setValoresStore(domicilio, 'regimen', 'setRegimen')"
      ></app-catalogo-select>
    </div>
    <div class="col-md-8">
      <app-catalogo-select
        [catalogo]="estado"
        formControlName="aduanasEntradas"
        [label]="'Aduanas de entradas'"
        [required]="true"
        [isDisabled]="esFormularioSoloLectura"
        name="aduanasEntradas"
        (change)="
          setValoresStore(domicilio, 'aduanasEntradas', 'setAduanasEntradas')
        "
      ></app-catalogo-select>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label text-start" for="numeroPermiso"
          >Número de Permiso de Importación expedido por la CNSNS:</label
        >
        <input
          class="form-control"
          id="numeroPermiso"
          placeholder=""
          type="number"
          formControlName="numeroPermiso"
          (change)="
            setValoresStore(domicilio, 'numeroPermiso', 'setNumeroPermiso')
          "
        />
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-12 mt-5">
      <h4>Mercancías*:</h4>
    </div>
  </div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [tipoSeleccionTabla]="tablaSeleccionCheckbox"
      [configuracionTabla]="mercanciasTabla"
      [datos]="mercanciasTablaDatos"
    ></app-tabla-dinamica>
    <div class="container text-end mt-5">
      <button
        class="btn btn-default me-2"
        data-bs-toggle="modal"
        data-bs-target="#modalAddAgentMercancias"
      >
        Modificar
      </button>
      <button class="btn btn-default me-2">Eliminar</button>
      <button
        class="btn btn-primary me-2"
        data-bs-toggle="modal"
        data-bs-target="#modalAddAgentMercancias"
      >
        Agregar
      </button>
    </div>
  </div>
</form>

<div
  class="modal fade"
  id="modalAddAgent"
  tabindex="-1"
  aria-labelledby="modalAddAgentLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content overflow-auto">
      <div class="modal-header">
        <h4 class="modal-title">Clave S.C.I.A.N.</h4>
      </div>
      <div class="modal-body">
        <form [formGroup]="formAgente">
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="estado"
              formControlName="claveScianModal"
              [label]="'Clave S.C.I.A.N.'"
              [required]="true"
              [isDisabled]="esFormularioSoloLectura"
              name="claveScianModal"
              (change)="
                setValoresStore(
                  formAgente,
                  'claveScianModal',
                  'setClaveScianModal'
                )
              "
            ></app-catalogo-select>
          </div>
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="estado"
              formControlName="claveDescripcionModal"
              [label]="'Descripción del S.C.I.A.N.'"
              [required]="false"
              [isDisabled]="esFormularioSoloLectura"
              name="claveDescripcionModal"
              (change)="
                setValoresStore(
                  formAgente,
                  'claveDescripcionModal',
                  'setClaveDescripcionModal'
                )
              "
            ></app-catalogo-select>
          </div>
        </form>
      </div>
      <div class="modal-footer custom-footer">
        <button [disabled]="esFormularioSoloLectura" type="button" class="btn btn-default" data-bs-dismiss="modal">
          Limpiar
        </button>
        <button [disabled]="esFormularioSoloLectura" type="button" class="btn btn-default" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button  [disabled]="esFormularioSoloLectura" type="button" class="btn btn-primary" data-bs-dismiss="modal">
          Agregar
        </button>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  id="modalAddAgentMercancias"
  tabindex="-1"
  aria-labelledby="modalAddAgentMercanciasLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered" style="max-width: 80vw">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Datos mercancías</h4>
      </div>
      <div class="modal-body modal-height">
        <form [formGroup]="formMercancias">
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="estado"
              formControlName="clasificacion"
              [label]="'Clasificación del producto'"
              [required]="true"
              [isDisabled]="esFormularioSoloLectura"
              name="clasificacion"
              (change)="
                setValoresStore(
                  formMercancias,
                  'clasificacion',
                  'setClasificacion'
                )
              "
            ></app-catalogo-select>
          </div>
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="estado"
              formControlName="especificar"
              [label]="'Especificar clasificación del producto'"
              [required]="true"
              [isDisabled]="esFormularioSoloLectura"
              name="especificar"
              (change)="
                setValoresStore(formMercancias, 'especificar', 'setEspecificar')
              "
            ></app-catalogo-select>
          </div>
          <div class="form-group">
            <label for="denominacionEspecifica"
              >Denominación específica del producto*:</label
            >
            <input
              type="text"
              id="denominacionEspecifica"
              formControlName="denominacionEspecifica"
              class="form-control"
              (change)="
                setValoresStore(
                  formMercancias,
                  'denominacionEspecifica',
                  'setDenominacionEspecifica'
                )
              "
            />
          </div>
          <div class="form-group">
            <label for="denominacionDistintiva"
              >Denominación distintiva*:</label
            >
            <input
              type="text"
              id="denominacionDistintiva"
              formControlName="denominacionDistintiva"
              class="form-control"
              (change)="
                setValoresStore(
                  formMercancias,
                  'denominacionDistintiva',
                  'setDenominacionDistintiva'
                )
              "
            />
          </div>
          <div class="form-group">
            <label for="denominacionComun"
              >Denominación común, nombre común o nombre científico*:</label
            >
            <input
              type="text"
              id="denominacionComun"
              formControlName="denominacionComun"
              class="form-control"
              (change)="
                setValoresStore(
                  formMercancias,
                  'denominacionComun',
                  'setDenominacionComun'
                )
              "
            />
          </div>
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="estado"
              formControlName="tipoDeProducto"
              [label]="'Tipo de producto'"
              [required]="true"
              [isDisabled]="esFormularioSoloLectura"
              name="tipoDeProducto"
              (change)="
                setValoresStore(
                  formMercancias,
                  'tipoDeProducto',
                  'setTipoDeProducto'
                )
              "
            ></app-catalogo-select>
          </div>
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="estado"
              formControlName="estadoFisico"
              [label]="'Estado físico'"
              [required]="true"
              [isDisabled]="esFormularioSoloLectura"
              name="estadoFisico"
              (change)="
                setValoresStore(
                  formMercancias,
                  'estadoFisico',
                  'setEstadoFisico'
                )
              "
            ></app-catalogo-select>
          </div>
          <div class="form-group">
            <label for="fraccionArancelaria">Fracción arancelaria*:</label>
            <input
              type="text"
              id="fraccionArancelaria"
              formControlName="fraccionArancelaria"
              class="form-control"
              (change)="
                setValoresStore(
                  formMercancias,
                  'fraccionArancelaria',
                  'setFraccionArancelaria'
                )
              "
            />
          </div>
          <div class="form-group">
            <label for="descripcionFraccion"
              >Descripción de la fracción*:</label
            >
            <input
              type="text"
              id="descripcionFraccion"
              formControlName="descripcionFraccion"
              class="form-control"
              (change)="
                setValoresStore(
                  formMercancias,
                  'descripcionFraccion',
                  'setDescripcionFraccion'
                )
              "
            />
          </div>
          <div class="form-group">
            <label for="cantidadUMT">Cantidad UMT*:</label>
            <input
              type="text"
              id="cantidadUMT"
              formControlName="cantidadUMT"
              class="form-control"
              (change)="
                setValoresStore(formMercancias, 'cantidadUMT', 'setCantidadUMT')
              "
            />
          </div>
          <div class="form-group">
            <label for="UMT">UMT*:</label>
            <input
              type="text"
              id="UMT"
              formControlName="UMT"
              class="form-control"
              (change)="setValoresStore(formMercancias, 'UMT', 'setUMT')"
            />
          </div>
          <div class="form-group">
            <label for="cantidadUMC">Cantidad UMC*:</label>
            <input
              type="text"
              id="cantidadUMC"
              formControlName="cantidadUMC"
              class="form-control"
              (change)="
                setValoresStore(formMercancias, 'cantidadUMC', 'setCantidadUMC')
              "
            />
          </div>
          <div class="form-group">
            <app-catalogo-select
              [catalogo]="estado"
              formControlName="UMC"
              [label]="'UMC'"
              [required]="true"
              [isDisabled]="esFormularioSoloLectura"
              name="UMC"
              (change)="setValoresStore(formMercancias, 'UMC', 'setUMC')"
            ></app-catalogo-select>
          </div>
          <div class="form-group">
            <label for="presentacion"
              >Presentación farmacéutica o tipo de envase*:</label
            >
            <input
              type="text"
              id="presentacion"
              formControlName="presentacion"
              class="form-control"
              (change)="
                setValoresStore(
                  formMercancias,
                  'presentacion',
                  'setPresentacion'
                )
              "
            />
          </div>
          <div class="form-group">
            <label for="numeroRegistro">Número de registro sanitario*:</label>
            <input
              type="text"
              id="numeroRegistro"
              formControlName="numeroRegistro"
              class="form-control"
              (change)="
                setValoresStore(
                  formMercancias,
                  'numeroRegistro',
                  'setNumeroRegistro'
                )
              "
            />
          </div>
          <div class="form-group">
            <input-fecha
              [datos]="INPUT_FECHA_CADUCIDAD_CONFIG"
              [setFecha]="formMercancias.get('fechaCaducidad')?.value"
              (valorCambiado)="
                setValoresStore(
                  formMercancias,
                  'fechaCaducidad',
                  'setFechaCaducidad'
                )
              "
            ></input-fecha>
          </div>
          <div class="form-group mt-5">
            <div class="panel-group ficha-collapse" id="accordion">
              <div class="panel panel-default">
                <div
                  class="panel-heading"
                  (click)="mostrar_colapsable()"
                  tabindex="0"
                >
                  <p class="panel-title">País de orígen</p>
                  <button
                    type="button"
                    class="collpase-button collapsed"
                  ></button>
                </div>
                @if(colapsable){
                <div class="panel-collapse collapse in" id="panel-01">
                  <div class="panel-body">
                    <crosslist
                      [fechas]="seleccionarOrigenDelPais"
                      [label]="paisDeProcedenciaLabel"
                      [botones]="paisDeProcedenciaBotones"
                    ></crosslist>
                  </div>
                </div>
                }
              </div>
            </div>
          </div>

          <div class="form-group mt-5">
            <div class="panel-group ficha-collapse" id="accordion">
              <div class="panel panel-default">
                <div
                  class="panel-heading"
                  (click)="mostrar_colapsableDuos()"
                  tabindex="0"
                >
                  <p class="panel-title">País de procedencia</p>
                  <button
                    type="button"
                    class="collpase-button collapsed"
                  ></button>
                </div>
                @if(colapsableDuos){
                <div class="panel-collapse collapse in" id="panel-01">
                  <div class="panel-body">
                    <crosslist
                      [fechas]="seleccionarOrigenDelPaisDuos"
                      [label]="paisDeProcedenciaLabel"
                      [botones]="paisDeProcedenciaBotonesDuos"
                    ></crosslist>
                  </div>
                </div>
                }
              </div>
            </div>
          </div>

          <div class="form-group mt-5">
            <div class="panel-group ficha-collapse" id="accordion">
              <div class="panel panel-default">
                <div
                  class="panel-heading"
                  (click)="mostrar_colapsableTres()"
                  tabindex="0"
                >
                  <p class="panel-title">Uso específico</p>
                  <button
                    type="button"
                    class="collpase-button collapsed"
                  ></button>
                </div>
                @if(colapsableTres){
                <div class="panel-collapse collapse in" id="panel-01">
                  <div class="panel-body">
                    <crosslist
                      [fechas]="seleccionarOrigenDelPaisTres"
                      [label]="paisDeProcedenciaLabel"
                      [botones]="paisDeProcedenciaBotonesTres"
                    ></crosslist>
                  </div>
                </div>
                }
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer custom-footer">
        <button [disabled]="esFormularioSoloLectura" type="button" class="btn btn-default" data-bs-dismiss="modal">
          Limpiar
        </button>
        <button [disabled]="esFormularioSoloLectura" type="button" class="btn btn-default" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button [disabled]="esFormularioSoloLectura" type="button" class="btn btn-primary" data-bs-dismiss="modal">
          Agregar
        </button>
      </div>
    </div>
  </div>
</div>
