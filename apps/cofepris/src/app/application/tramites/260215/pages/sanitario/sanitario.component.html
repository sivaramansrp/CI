<div class="page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <h2>
          Permiso sanitario de importación de dispositivos médicos para
          investigación en humanos
        </h2>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno></app-paso-uno>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
      } }

      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
      <app-aviso-de-privacidad *ngIf="indice === 1"></app-aviso-de-privacidad>
    </div>
  </div>
</div>
