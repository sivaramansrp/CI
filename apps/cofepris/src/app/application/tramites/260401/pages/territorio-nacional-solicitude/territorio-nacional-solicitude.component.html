<div class="Page">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h3>
          Solicitud permiso de salida del territorio nacional de células y tejidos incluyendo sangre, sus componentes y derivados, así como otros productos de seres humanos
        </h3>
      </div>
      <app-wizard [listaPasos]="territorioPasos"></app-wizard>
    </div>
    <div class="row">
      @switch (indice) { @case (1) {
      <app-datos-territorio></app-datos-territorio>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
      }}
    </div>
    <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
  </div>
</div>
