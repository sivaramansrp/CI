<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h4>{{ tituloMensaje || null }}</h4>
    </div>
    @if(esFormaValido){
      <ng-alert
        [CONTENIDO]="MENSAJE_DE_ERROR"
        [CUSTOMECLASS]="'alert-danger text-center'"
      ></ng-alert>
      }
    <ng-container *ngIf="indice === 2"> </ng-container>
    <app-wizard [listaPasos]="pasos"></app-wizard>
  </div>


  <div class="row">
    <ng-container *ngIf="indice === 1">
      <app-paso-uno #PasoUnoComponent></app-paso-uno>
    </ng-container>
    <ng-container *ngIf="indice === 2">
      <app-paso-carga-documento
        [idSolicitud]="storeData.idSolicitud"
        [idTipoTRamite]="'260207'"
        [cargaArchivosEvento]="cargarArchivosEvento"
        (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
        (reenviarCargaRealizada)="cargaRealizada($event)"
        (cargaEnProgreso)="onCargaEnProgreso($event)"
      ></app-paso-carga-documento>
    </ng-container>
    <ng-container *ngIf="indice === 3">
      <paso-firma 
        [idSolicitud]="storeData.idSolicitud" 
        [procedure]="260207" 
        [procedureUrl]="'importacion-tratamientos-especiales/contenedor-de-pasos'">
      </paso-firma>
    </ng-container>

    <div class="row">
      <div class="col-md-12">
        <!-- Only one btn-continuar for all steps except step 2 -->
        <ng-container *ngIf="indice !== 2; else cargaDocumentosBotones">
          <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
        </ng-container>
        <ng-template #cargaDocumentosBotones>
          <div class="mt-5 mb-3 d-flex justify-content-end">
            <button
              type="button"
              class="btn btn-default"
              (click)="anterior()"
              *ngIf="seccionCargarDocumentos"
            >
              Anterior
            </button>
            <button
              class="btn btn-primary ms-3"
              (click)="seccionCargarDocumentos ? onClickCargaArchivos() : getValorIndice({accion: 'cont', valor: indice})"
              [disabled]="(seccionCargarDocumentos && !activarBotonCargaArchivos) || (!seccionCargarDocumentos && cargaEnProgreso)"
            >
              {{ seccionCargarDocumentos ? 'Cargar archivos' : 'Continuar' }}
            </button>
          </div>
        </ng-template>

  @if(indice === 1) {
    <div class="mt-5">
      <ng-alert [CONTENIDO]="TEXTOS" [CUSTOMECLASS]="infoAlert"></ng-alert>
    </div>
  }


@if(mostrarAlerta){
  <section>
    <lib-notificaciones [notificacionInput]="seleccionarFilaNotificacion" (confirmacionModal)="mostrarAlerta = false">
    </lib-notificaciones>
  </section>
}
