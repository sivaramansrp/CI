<div class="row mt-5">
  <div class="col-md-12">
    <ng-titulo titulo="Terceros relacionados" />

    <ng-alert [CONTENIDO]="TEXTOS.TEXTOS_TERCEROS"></ng-alert>
  </div>

  <div class="col-md-12">
    <label class="form-label" for="">Destinatario (destino final)*:</label>
    <app-tabla-dinamica
      [tipoSeleccionTabla]="destinatarioSeleccionTabla"
      [configuracionTabla]="destinatarioConfiguracionTabla"
      [datos]="destinatarioDatos"
      [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
      [inputSelection]="inputSelectionDestinatario"
      (listaDeFilaSeleccionada)="seleccionDestinatarioDatos($event)"
    >
    </app-tabla-dinamica>
  </div>

  <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
    <div class="btn-group">
      @if (selectedDestinatario.length > 0) {
      <button
        class="btn btn-default 3"
        type="button"
        [disabled]="esFormularioSoloLectura"
        (click)="eliminarMercancias()"
      >
        Eliminar
      </button>
      <button
        type="button"
        [disabled]="esFormularioSoloLectura"
        class="btn btn-default btn-space ms-3"
        (click)="openModificarMercancias()"
      >
        Modificar
      </button>
      }
      <button
        type="button"
        class="btn btn-primary ms-3"
        [disabled]="esFormularioSoloLectura"
        (click)="agregarMercancias()"
      >
        Agregar
      </button>
    </div>
  </div>

  <div class="col-md-12">
    <label class="form-label" for="">Fabricante*:</label>
    <app-tabla-dinamica
      [tipoSeleccionTabla]="fabricanteSeleccionTabla"
      [configuracionTabla]="fabricanteConfiguracionTabla"
      [datos]="fabricanteDatos"
      [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
      (listaDeFilaSeleccionada)="seleccionFabricanteDatos($event)"
    >
    </app-tabla-dinamica>
  </div>

  <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
    <div class="btn-group">
      @if (selectedFabricante.length > 0) {
      <button
        class="btn btn-default 3"
        type="button"
        [disabled]="esFormularioSoloLectura"
        (click)="eliminarMercancias()"
      >
        Eliminar
      </button>
      <button
        type="button"
        [disabled]="esFormularioSoloLectura"
        class="btn btn-default btn-space ms-3"
        (click)="modificarModalFabricante()"
      >
        Modificar
      </button>
      }
      <button
        type="button"
        [disabled]="esFormularioSoloLectura"
        class="btn btn-primary ms-3"
        (click)="agregarModalFabricante()"
      >
        Agregar
      </button>
    </div>
  </div>
</div>
<div
  class="modal fade"
  #modalAgregarMercancias
  tabindex="-1"
  aria-labelledby="modalAgregarMercanciasLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <app-modificar-destinatario
        (cerrarModal)="cerrarMercanciasModal($event)"
      ></app-modificar-destinatario>
    </div>
  </div>
</div>

<div
  class="modal fade"
  #modalFabricante
  tabindex="-1"
  aria-labelledby="modalFabricanteLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <app-fabricante
        [datosDestinatario]="modificarFabricante"
        (cerrarModal)="cerrarFabricanteModal($event)"
      ></app-fabricante>
    </div>
  </div>
</div>
