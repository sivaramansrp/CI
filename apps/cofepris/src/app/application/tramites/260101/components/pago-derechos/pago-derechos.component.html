<div class="row mt-5">
  <div class="col-md-12">
    <ng-titulo titulo="Pago de derechos" />
  </div>

  <div class="col-md-4 mt-3">
    <label class="form-label" for="">Clave de referencia:</label>
    <input class="form-control" id="" placeholder="" type="text" />
  </div>

  <div class="col-md-4 mt-3">
    <label class="form-label" for="">Cadena de la dependencia:</label>
    <input class="form-control" id="" placeholder="" type="text" />
  </div>

  <div class="col-md-4 mt-3">
    <app-catalogo-select
      [id]="'aduana'"
      [catalogo]="bancoCatalogo.catalogos"
      [label]="bancoCatalogo.labelNombre"
      [placeholder]="bancoCatalogo.primerOpcion"
      [required]="bancoCatalogo.required"
    >
    </app-catalogo-select>
  </div>

  <div class="col-md-4 mt-3">
    <label class="form-label" for="">Liave de pago:</label>
    <input class="form-control" id="" placeholder="" type="text" />
  </div>

  <div class="col-md-4 mt-3">
    <input-fecha
      [datos]="fechaPago"
      (valorCambiado)="seleccionarFechaInicio($event)"
    ></input-fecha>
  </div>

  <div class="col-md-4 mt-3">
    <label class="form-label" for="">Importe de pago:</label>
    <input class="form-control" id="" placeholder="" type="text" />
  </div>

  <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
    <button class="btn btn-default" type="button">Borrar datos del pago</button>
  </div>
</div>
