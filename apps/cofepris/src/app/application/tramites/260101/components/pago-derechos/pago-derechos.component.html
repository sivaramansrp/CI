<form [formGroup]="pagoDeDerechosForm">
  <div class="row mt-5">
    <div class="col-md-12">
      <ng-titulo titulo="Pago de derechos" />
    </div>

    <div class="col-md-4 mt-3">
      <label class="form-label" for="claveDeReferencia"
        >Clave de referencia:</label
      >
      <input
        class="form-control"
        id="claveDeReferencia"
        placeholder=""
        type="text"
        formControlName="claveDeReferencia"
        (change)="setClaveDeReferencia($event)"
      />
    </div>

    <div class="col-md-4 mt-3">
      <label class="form-label" for="cadenaDeDependencia"
        >Cadena de la dependencia:</label
      >
      <input
        class="form-control"
        id="cadenaDeDependencia"
        placeholder=""
        type="text"
        formControlName="cadenaDeDependencia"
        (change)="setCadenaDeDependencia($event)"
      />
    </div>

    <div class="col-md-4 mt-3">
      <app-catalogo-select
        [id]="'aduana'"
        [catalogo]="bancoCatalogo.catalogos"
        [label]="bancoCatalogo.labelNombre"
        [placeholder]="bancoCatalogo.primerOpcion"
        formControlName="banco"
        [required]="bancoCatalogo.required"
        (selectionChange)="setBanco($event)"
        [isDisabled]="esFormularioSoloLectura"
      >
      </app-catalogo-select>
    </div>

    <div class="col-md-4 mt-3">
      <label class="form-label" for="liaveDePago">Liave de pago:</label>
      <input
        class="form-control"
        id="liaveDePago"
        placeholder=""
        type="text"
        formControlName="liaveDePago"
        (change)="setLiaveDePago($event)"
      />
    </div>

    <div class="col-md-4 mt-3">
      <input-fecha
        [datos]="fechaPago"
        [isDisabled]="esFormularioSoloLectura"
        [setFecha]="pagoDeDerechosForm.get('fechaDePago')?.value"
        (valorCambiado)="seleccionarFechaInicio($event)"
      ></input-fecha>
    </div>

    <div class="col-md-4 mt-3">
      <label class="form-label" for="importeDePago">Importe de pago:</label>
      <input
        class="form-control"
        id="importeDePago"
        placeholder=""
        type="number"
        formControlName="importeDePago"
        (change)="setImporteDePago($event)"
      />
    </div>

    <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
      <button
        class="btn btn-default"
        [disabled]="esFormularioSoloLectura"
        type="button"
      >
        Borrar datos del pago
      </button>
    </div>
  </div>
</form>
