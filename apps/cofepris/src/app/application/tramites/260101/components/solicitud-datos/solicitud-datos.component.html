<form [formGroup]="solicitudForm">
  <div class="row mt-5">
    <div class="col-md-12">
      <div class="panel-group ficha-collapse" id="accordion">
        <div class="panel panel-default">
          <div
            class="panel-heading"
            (click)="mostrarColapsable()"
            (keyup.enter)="mostrarColapsable()"
            tabindex="0"
          >
            <h4 class="panel-title">
              <a aria-label="Repeat"
                ><i class="bi bi-repeat" aria-hidden="true"></i
              ></a>
              <span> Opciones de pre-IIenado de Solicitud</span>
            </h4>
            <button
              type="button"
              class="collpase-button collapsed"
              (keydown)="mostrarColapsable()"
            ></button>
          </div>
          @if(colapsable){
          <div class="panel-collapse collapse in" id="panel-01">
            <div class="panel-body">
              <ng-alert [CONTENIDO]="TEXTOS.TEXTOS_SOLICITUD"></ng-alert>
              <div class="col-md-12 mr-0">
                <label for="solicitud">Solicitud</label>
              </div>
              <div class="col-md-12">
                <table class="table table-responsive table-striped">
                  <thead>
                    <tr>
                      @for (item of tablaHeadData; track $index) {
                      <th>{{ item }}</th>
                      }
                    </tr>
                  </thead>
                  <tbody>
                    @for (item of tablaFilaDatos; let i = $index; track i) {
                    <tr>
                      <td>{{ item.fechaCreacion }}</td>
                      <td (click)="updateSCIANData(tablaFilaDatos, i)">
                        {{ item.mercancia }}
                      </td>
                      <td>{{ item.cantidad }}</td>
                      <td>{{ item.proovedor }}</td>
                    </tr>
                    }
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          }
        </div>
      </div>
    </div>

    <div class="col-md-12">
      <ng-titulo titulo="Datos del establecimiento" />
    </div>

    <div class="col-md-12 d-flex justify-content-end align-items-end">
      <div class="btn-group">
        <button class="btn btn-primary ms-2" type="button">
          Seleccionar establecimiento
        </button>
      </div>
    </div>

    <div class="col-md-8">
      <label class="form-label" for="razonSocial"
        >Denominacion o razón social*:</label
      >
      <input
        class="form-control"
        id="razonSocial"
        placeholder=""
        type="text"
        formControlName="razonSocial"
      />
    </div>

    <div class="col-md-4">
      <label class="form-label" for="correoElectronico"
        >Correo electrónico*:</label
      >
      <input
        class="form-control"
        id="correoElectronico"
        placeholder=""
        type="text"
        formControlName="correoElectronico"
      />
    </div>

    <div class="col-md-12">
      <ng-titulo titulo="Domicilio del establecimiento" />
    </div>

    <div class="col-md-4">
      <label class="form-label" for="codigoPostal">Código postal*:</label>
      <input
        class="form-control"
        id="codigoPostal"
        placeholder=""
        type="number"
        formControlName="codigoPostal"
      />
    </div>

    <div class="col-md-4">
      <app-catalogo-select
        [id]="'estado'"
        [catalogo]="estadoCatalogo.catalogos"
        [label]="estadoCatalogo.labelNombre"
        [placeholder]="estadoCatalogo.primerOpcion"
        [required]="estadoCatalogo.required"
        formControlName="estado"
        (selectionChange)="setEstado($event)"
      >
      </app-catalogo-select>
    </div>

    <div class="col-md-4">
      <label class="form-label" for="municipio">Municipio y alcaldía*:</label>
      <input
        class="form-control"
        id="municipio"
        placeholder=""
        type="text"
        formControlName="municipio"
      />
    </div>

    <div class="col-md-4">
      <label class="form-label" for="localidad">Localidad:</label>
      <input
        class="form-control"
        id="Localidad"
        placeholder=""
        type="text"
        formControlName="localidad"
      />
    </div>

    <div class="col-md-4">
      <label class="form-label" for="colonia">Colonia*:</label>
      <input
        class="form-control"
        id="colonia"
        placeholder=""
        type="text"
        formControlName="colonia"
      />
    </div>

    <div class="col-md-8">
      <label class="form-label" for="calle">Calle*:</label>
      <input
        class="form-control"
        id="calle"
        placeholder=""
        type="text"
        formControlName="calle"
      />
    </div>

    <div class="row">
      <div class="col-md-1">
        <label class="form-label" for="lada">Lada:</label>
        <input
          class="form-control"
          id="lada"
          placeholder=""
          type="number"
          formControlName="lada"
        />
      </div>
      <div class="col-md-3">
        <label class="form-label" for="telefono">Teléfono*:</label>
        <input
          class="form-control"
          id="telefono"
          placeholder=""
          type="number"
          formControlName="telefono"
        />
      </div>
    </div>

    <div class="col-md-12 mt-5">
      <label class="form-label mb-5" for="">S.C.I.A.N.*:</label>
      <ng-table
        [commonTableHeader]="tableDataSCIAN.tableHeader"
        [commonTableBody]="tableDataSCIAN.tableBody"
      ></ng-table>
    </div>

    <div class="col-md-4">
      <div class="form-check mt-3">
        <input
          class="form-check-input"
          type="checkbox"
          id="avisoDeFuncionamiento"
          formControlName="avisoDeFuncionamiento"
          aria-label="Aviso de funcionamiento"
        />
        <label class="control-label" for="avisoDeFuncionamiento">
          Aviso de funcionamiento
        </label>
      </div>
    </div>

    <div class="col-md-4">
      <label class="form-label" for="licenciaSanitaria"
        >No. de licencia sanitaria:</label
      >
      <input
        class="form-control"
        id="licenciaSanitaria"
        placeholder=""
        type="text"
        formControlName="licenciaSanitaria"
        (change)="setLicenciaSanitaria($event)"
      />
    </div>

    <div class="col-md-6">
      <div class="form-check mt-3">
        <input
          class="form-check-input"
          type="checkbox"
          id="flexCheckDefault"
          aria-label="Aviso de funcionamiento"
          formControlName="liveFreshFrozen"
        />
        <label class="control-label" for="flexCheckDefault">
          Marcar en caso de que sea VIVO/FRESCO/ENHIELADO
        </label>
      </div>
    </div>

    <div class="col-md-8">
      <app-catalogo-select
        [id]="'regimenCatalogo'"
        [catalogo]="regimenCatalogo.catalogos"
        [label]="regimenCatalogo.labelNombre"
        [placeholder]="regimenCatalogo.primerOpcion"
        [required]="regimenCatalogo.required"
        formControlName="regimen"
        (selectionChange)="setRegimen($event)"
      >
      </app-catalogo-select>
    </div>

    <div class="col-md-4">
      <app-catalogo-select
        [id]="'aduana'"
        [catalogo]="aduanaCatalogo.catalogos"
        [label]="aduanaCatalogo.labelNombre"
        [placeholder]="aduanaCatalogo.primerOpcion"
        [required]="aduanaCatalogo.required"
        formControlName="aduana"
        (selectionChange)="setAduana($event)"
      >
      </app-catalogo-select>
    </div>

    <div class="col-md-12 mt-5">
      <label class="form-label mb-5" for="">mercancías*:</label>
      <app-tabla-dinamica
      [tipoSeleccionTabla]="mercanciasSeleccionTabla"
      [datos]="mercanciasDatos"
      [configuracionTabla]="mercanciasConfiguracionTabla">

      </app-tabla-dinamica>
    </div>

    <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
      <div class="btn-group">
        <button
          type="button"
          class="btn btn-default btn-space"
          data-bs-toggle="modal"
          data-bs-target="#modalAgregarMercancias"
          (click)="openModificarMercancias()"
        >
          Modificar
        </button>
        <button
          class="btn btn-default ms-3"
          type="button"
          name="aceptar"
          id="agregarAduana"
        >
          Eliminar
        </button>
        <button
          type="button"
          class="btn btn-primary ms-3"
          data-bs-toggle="modal"
          data-bs-target="#modalAgregarMercancias"
          (click)="openAgregarMercancias()"
        >
          Agregar
        </button>
      </div>
    </div>

    <div class="col-md-12">
      <ng-titulo titulo="Manifiestos y declaraciones" />

      <ng-alert [CONTENIDO]="TEXTOS.TEXTOS_MANIFIESTOS"></ng-alert>
    </div>

    <div class="col-md-12">
      <label class="form-label" for=""
        >Los datos o anexos pueden contener informacion confidencial Esta de
        acuerdo en hacerlos públicos?*:</label
      >
      <app-input-radio
        [radioOptions]="hacerlosRadioOptions"
        [selectedValue]="hacerlosPublicos"
        [isRequired]="true"
        [layout]="'horizontal'"
        fromControlName="hacerlos"
        (valueChange)="setHacerlos($event)"
      >
      </app-input-radio>
    </div>

    <div class="col-md-12">
      <ng-titulo titulo="Representante legal" />
    </div>

    <div class="col-md-4">
      <label class="form-label" for="rfc">RFC*:</label>
      <input
        class="form-control"
        id="rfc"
        placeholder=""
        type="text"
        formControlName="rfc"
        (change)="setRFC($event)"
      />
    </div>

    <div class="col-md-2">
      <button type="button" class="btn btn-default btn-space">Buscar</button>
    </div>

    <div class="col-md-6"></div>

    <div class="col-md-4">
      <label class="form-label" for="legalRazonSocial"
        >Nombre o razón Social*:</label
      >
      <input
        class="form-control"
        id="legalRazonSocial"
        placeholder=""
        type="text"
        formControlName="legalRazonSocial"
      />
    </div>

    <div class="col-md-4">
      <label class="form-label" for="apellidoPaterno">Apellido paterno*:</label>
      <input
        class="form-control"
        id="apellidoPaterno"
        placeholder=""
        type="text"
        formControlName="apellidoPaterno"
      />
    </div>

    <div class="col-md-4">
      <label class="form-label" for="apellidoMaterno">Apellido materno:</label>
      <input
        class="form-control"
        id="apellidoMaterno"
        placeholder=""
        type="text"
        formControlName="apellidoMeterno"
      />
    </div>
  </div>
  <div
    class="modal fade"
    id="modalAgregarMercancias"
    tabindex="-1"
    aria-labelledby="modalAgregarMercanciasLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <app-modificar-mercancias></app-modificar-mercancias>
      </div>
    </div>
  </div>
</form>
