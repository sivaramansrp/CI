<form [formGroup]="solicitudForm">
  <div class="row mt-5">
    <div class="col-md-12">
      <div class="panel-group ficha-collapse" id="accordion">
        <div class="panel panel-default">
          <div
            class="panel-heading"
            (click)="mostrarColapsable()"
            (keyup.enter)="mostrarColapsable()"
            tabindex="0"
          >
            <h6 class="panel-title">
              <h6>
                <a aria-label="Repeat"
                  ><i class="bi bi-clipboard2-fill" aria-hidden="true"></i
                ></a>
                Opciones de pre-llenado de Solicitud
              </h6>
            </h6>
            <button
              type="button"
              class="collpase-button collapsed"
              (keydown)="mostrarColapsable()"
            ></button>
          </div>
          @if(colapsable){
          <div class="panel-collapse collapse in" id="panel-01">
            <div class="panel-body">
              <ng-alert [CONTENIDO]="TEXTOS.TEXTOS_SOLICITUD"></ng-alert>
              <div class="col-md-12 mr-0">
                <label for="solicitud">Solicitud</label>
              </div>
              <div class="col-md-12">
                <app-tabla-dinamica
                  [tipoSeleccionTabla]="solicitudSeleccionTabla"
                  [datos]="solicitudDatos"
                  [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
                  [configuracionTabla]="solicitudConfiguracionTabla"
                >
                </app-tabla-dinamica>
              </div>
            </div>
          </div>
          }
        </div>
      </div>
    </div>
    <div class="col-md-12">
      <ng-titulo titulo="Datos del establecimiento" />
    </div>

    <div class="col-md-12 mt-4 d-flex justify-content-end align-items-end">
      <div class="btn-group">
        <button
          class="btn btn-primary ms-2"
          [disabled]="esFormularioSoloLectura"
          (click)="openSeleccionarEstablecimiento()"
          type="button"
        >
          Seleccionar establecimiento
        </button>
      </div>
    </div>

    <div class="col-md-8 mt-4">
      <label class="form-label" for="razonSocial"
        >Denominación o razón social*:</label
      >
      <input
        class="form-control"
        id="razonSocial"
        placeholder=""
        type="text"
        formControlName="razonSocial"
      />
    </div>

    <div class="col-md-4 mt-4">
      <label class="form-label" for="correoElectronico"
        >Correo electrónico*:
        <span
          class="bi bi-question-circle-fill"
          title="ejemplo@dominio.com"
          data-bs-toggle="tooltip"
        ></span
      ></label>
      <input
        class="form-control"
        id="correoElectronico"
        placeholder=""
        type="text"
        formControlName="correoElectronico"
      />
    </div>

    <div class="col-md-12">
      <ng-titulo titulo="Domicilio del establecimiento" />
    </div>

    <div class="col-md-4 mt-4">
      <label class="form-label" for="codigoPostal">Código postal*:</label>
      <input
        class="form-control"
        id="codigoPostal"
        placeholder=""
        type="number"
        formControlName="codigoPostal"
      />
    </div>

    <div class="col-md-4 mt-4">
      <app-catalogo-select
        [id]="'estado'"
        [catalogo]="estadoCatalogo.catalogos"
        [label]="estadoCatalogo.labelNombre"
        [placeholder]="estadoCatalogo.primerOpcion"
        [required]="estadoCatalogo.required"
        formControlName="estado"
        [isDisabled]="esFormularioSoloLectura"
        (selectionChange)="setEstado($event)"
      >
      </app-catalogo-select>
    </div>

    <div class="col-md-4 mt-4">
      <label class="form-label" for="municipio">Municipio y alcaldía*:</label>
      <input
        class="form-control"
        id="municipio"
        placeholder=""
        type="text"
        formControlName="municipio"
      />
    </div>

    <div class="col-md-4 mt-4">
      <label class="form-label" for="localidad">Localidad:</label>
      <input
        class="form-control"
        id="Localidad"
        placeholder=""
        type="text"
        formControlName="localidad"
      />
    </div>

    <div class="col-md-4 mt-4">
      <label class="form-label" for="colonia">Colonia*:</label>
      <input
        class="form-control"
        id="colonia"
        placeholder=""
        type="text"
        formControlName="colonia"
      />
    </div>

    <div class="col-md-8 mt-4">
      <label class="form-label" for="calle"
        >Calle*:
        <span
          class="bi bi-question-circle-fill"
          title="Domicilio, calle, número interior, numero exterior, lote"
          data-bs-toggle="tooltip"
        ></span
      ></label>
      <input
        class="form-control"
        id="calle"
        placeholder=""
        type="text"
        formControlName="calle"
      />
    </div>

    <div class="row">
      <div class="col-md-1 mt-4">
        <label class="form-label" for="lada">Lada:</label>
        <input
          class="form-control"
          id="lada"
          placeholder=""
          type="number"
          formControlName="lada"
        />
      </div>
      <div class="col-md-3 mt-4">
        <label class="form-label" for="telefono">Teléfono*:</label>
        <input
          class="form-control"
          id="telefono"
          placeholder=""
          type="number"
          formControlName="telefono"
        />
      </div>
    </div>

    <div class="col-md-12 mt-5">
      <label class="form-label mb-5" for="">S.C.I.A.N.*:</label>
      <app-tabla-dinamica
        [tipoSeleccionTabla]="scianSeleccionTabla"
        [datos]="scianDatos"
        [filasSeleccionadas]="scianSeleccionados"
        [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
        (listaDeFilaSeleccionada)="getscianDatos($event)"
        [configuracionTabla]="scianConfiguracionTabla"
      >
      </app-tabla-dinamica>
    </div>

    <div class="col-md-4 mt-4">
      <div class="form-check mt-3">
        <input
          class="form-check-input"
          type="checkbox"
          id="avisoDeFuncionamiento"
          formControlName="avisoDeFuncionamiento"
          (change)="setAvisoDeFuncionamiento($event)"
          aria-label="Aviso de funcionamiento"
        />
        <label class="control-label" for="avisoDeFuncionamiento">
          Aviso de funcionamiento
        </label>
      </div>
    </div>

    <div class="col-md-4 mt-4">
      <label class="form-label" for="licenciaSanitaria"
        >No. de licencia sanitaria:
        <span
          class="bi bi-question-circle-fill"
          title="Nï¿½mero de la autorizaciï¿½n indicado en el documento emitido por la autoridad sanitaria competente"
          data-bs-toggle="tooltip"
        ></span>
      </label>
      <input
        class="form-control"
        id="licenciaSanitaria"
        placeholder=""
        type="text"
        formControlName="licenciaSanitaria"
        (change)="setLicenciaSanitaria($event)"
      />
    </div>

    <div class="col-md-6 mt-4">
      <div class="form-check mt-3">
        <input
          class="form-check-input"
          type="checkbox"
          id="flexCheckDefault"
          aria-label="Aviso de funcionamiento"
          formControlName="liveFreshFrozen"
          (change)="setLiveFreshFrozen($event)"
        />
        <label class="control-label" for="flexCheckDefault">
          Marcar en caso de que sea VIVO/FRESCO/ENHIELADO
        </label>
      </div>
    </div>

    <div class="col-md-8 mt-4">
      <app-catalogo-select
        [id]="'regimenCatalogo'"
        [catalogo]="regimenCatalogo.catalogos"
        [label]="regimenCatalogo.labelNombre"
        [placeholder]="regimenCatalogo.primerOpcion"
        [required]="regimenCatalogo.required"
        formControlName="regimen"
        [isDisabled]="esFormularioSoloLectura"
        [tooltipQuestionCircle]="true"
        [tooltipQuestionCircleText]="'Régimen al que se destinará la mercancía'"
        (selectionChange)="setRegimen($event)"
      >
      </app-catalogo-select>
    </div>

    <div class="col-md-4 mt-4">
      <app-catalogo-select
        [id]="'aduana'"
        [catalogo]="aduanaCatalogo.catalogos"
        [label]="aduanaCatalogo.labelNombre"
        [placeholder]="aduanaCatalogo.primerOpcion"
        [required]="aduanaCatalogo.required"
        formControlName="aduana"
        [isDisabled]="esFormularioSoloLectura"
        (selectionChange)="setAduana($event)"
      >
      </app-catalogo-select>
    </div>

    <div class="col-md-12 mt-4">
      <label class="form-label mb-5" for="">mercancías*:</label>
      <app-tabla-dinamica
        [tipoSeleccionTabla]="mercanciasSeleccionTabla"
        [datos]="mercanciasDatos"
        [filasSeleccionadas]="mercanciasSeleccionados"
        [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
        (listaDeFilaSeleccionada)="getMercanciasDatos($event)"
        [configuracionTabla]="mercanciasConfiguracionTabla"
      >
      </app-tabla-dinamica>
    </div>

    <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
      <div class="btn-group">
        <button
          type="button"
          class="btn btn-default btn-space"
          [disabled]="esFormularioSoloLectura"
          (click)="openModificarMercancias()"
        >
          Modificar
        </button>
        <button
          class="btn btn-default ms-3"
          type="button"
          name="aceptar"
          [disabled]="esFormularioSoloLectura"
          id="agregarAduana"
          (click)="eliminarMercancias()"
        >
          Eliminar
        </button>
        <button
          type="button"
          class="btn btn-primary ms-3"
          [disabled]="esFormularioSoloLectura"
          (click)="openAgregarMercancias()"
        >
          Agregar
        </button>
      </div>
    </div>

    <div class="col-md-12 mt-4">
      <ng-titulo titulo="Manifiestos y declaraciones" />
      <div class="alert alert-info">
        <label style="font-weight: normal">
          <div class="col-md-1 mt-5">
            <input
              type="checkbox"
              class="mt-5"
              formControlName="manifesto"
              (change)="setManifesto($event)"
              id="manifesto"
            />
            <b> *</b>
          </div>
          <div class="col-md-11 mt-4">
            Cumplo con los requisitos y normatividad aplicable, sin que me
            eximan de que la autoridad sanitaria verifique su cumplimiento, esto
            sin perjuicio de las sanciones en que puedo incurrir por falsedad de
            declaraciones dadas a una autoridad. Asimismo acepto que la
            notificación de este trámite, sea a través de la Ventanilla Única de
            Comercio Exterior por los mecanismos de la misma.
          </div>
        </label>
      </div>
    </div>

    <div class="col-md-12 mt-4">
      <label class="form-label" for=""
        >Los datos o anexos pueden contener información confidencial ¿Está de
        acuerdo en hacerlos públicos?*:</label
      >
      <app-input-radio
        formControlName="hacerlos"
        [selectedValue]="solicitudForm.get('hacerlos')?.value"
        [radioOptions]="hacerlosRadioOptions"
        [layout]="'horizontal'"
        [isRequired]="true"
        (valueChange)="setHacerlos($event)"
      ></app-input-radio>
    </div>

    <div class="col-md-12">
      <ng-titulo titulo="Representante legal" />
    </div>

    <div class="col-md-4 mt-2">
      <label class="form-label" for="rfc">RFC*:</label>
      <input
        class="form-control"
        id="rfc"
        placeholder=""
        type="text"
        formControlName="rfc"
        (change)="setRFC($event)"
      />
    </div>

    <div class="col-md-2 mt-4">
      <button
        type="button"
        class="btn btn-primary btn-space"
        [disabled]="esFormularioSoloLectura"
      >
        Buscar
      </button>
    </div>

    <div class="col-md-6 mt-4"></div>

    <div class="col-md-4 mt-4">
      <label class="form-label" for="legalRazonSocial"
        >Nombre o Razón Social*:</label
      >
      <input
        class="form-control"
        id="legalRazonSocial"
        placeholder=""
        type="text"
        formControlName="legalRazonSocial"
      />
    </div>

    <div class="col-md-4 mt-4">
      <label class="form-label" for="apellidoPaterno">Apellido paterno*:</label>
      <input
        class="form-control"
        id="apellidoPaterno"
        placeholder=""
        type="text"
        formControlName="apellidoPaterno"
      />
    </div>

    <div class="col-md-4 mt-4">
      <label class="form-label" for="apellidoMaterno">Apellido materno:</label>
      <input
        class="form-control"
        id="apellidoMaterno"
        placeholder=""
        type="text"
        formControlName="apellidoMeterno"
      />
    </div>
  </div>
</form>

<div
  class="modal fade"
  #modalAgregarMercancias
  tabindex="-1"
  aria-labelledby="modalAgregarMercanciasLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <app-modificar-mercancias></app-modificar-mercancias>
    </div>
  </div>
</div>

@if (nuevaNotificacion) {
<section>
  <lib-notificaciones
    [notificacionInput]="nuevaNotificacion"
    (confirmacionModal)="eliminarPedimento($event)"
  >
  </lib-notificaciones>
</section>
}
