<div class="container">
    <ng-titulo titulo="Terceros relacionados" />
    <ng-alert [CONTENIDO]="TEXTOS.alerta"></ng-alert>
    <div class="row mb-4">
        <div class="col-md-12">
            <h5 class="mb-5 mt-5">Destinatario (destino final)*:</h5>
            <app-tabla-dinamica
                [configuracionTabla]="configuracionTabla"
                [datos]="destinatarioDatos"
                [tipoSeleccionTabla]="checkbox"
                (listaDeFilaSeleccionada)="setTablaSeleccionDestinatario($event)">
            </app-tabla-dinamica>
            <div class="d-flex justify-content-end mt-4">
                @if(tieneFilaSeleccionada) {
                    <button type="button" class="btn btn-danger me-2" (click)="abrirModal(template)">Eliminar</button>
                    <button type="button" class="btn btn-default me-2">Modificar</button>
                }
                <button type="button" class="btn btn-primary" (click)="abrirFabricanteModal('Destinatario (destino final)')">Agregar</button>
            </div>
        </div>
    </div>
    <div class="row mb-4">
        <div class="col-md-12">
            <h5>Fabricante*:</h5>
        <div class="col-md-12">
            <app-tabla-dinamica
                [configuracionTabla]="configuracionTablaFabricante"
                [datos]="fabricanteTablaDatos"
                [tipoSeleccionTabla]="checkbox"
                (listaDeFilaSeleccionada)="setTablaSeleccionFabricante($event)">
            </app-tabla-dinamica>
            <div class="d-flex justify-content-end mt-4">
                @if(tieneFilaSeleccionadaFabricante) {
                    <button type="button" class="btn btn-danger me-2" (click)="abrirModal(template)">Eliminar</button>
                    <button type="button" class="btn btn-default me-2">Modificar</button>
                }
                <button type="button" class="btn btn-primary" (click)="abrirFabricanteModal('Fabricante')">Agregar</button>
            </div>
        </div>
    </div>
</div>

<!-- Confirmar Modal -->
<ng-template #template>
    <div class="modal-header">
        <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide()">
          <span aria-hidden="true" class="visually-hidden">&times;</span>
        </button>
      </div>
    <div class="modal-body">
        ¿Confirma la eliminación?
    </div>
    <div class="modal-footer d-flex justify-content-center">
        <button type="button" class="btn btn-default me-2" (click)="modalRef?.hide()">Cancelar</button>
        <button type="button" class="btn btn-danger" (click)="eliminarDatos()">Aceptar</button>
    </div>
  </ng-template>
