<div class="container">
    <ng-titulo titulo="Pago de derechos" />
      <form [formGroup]="formSolicitud">
        <ng-container formGroupName="datosImportadorExportador">
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="claveDeReferencia"
                  >Clave de referencia:</label
                >
                <input
                  class="form-control"
                  id="claveDeReferencia"
                  formControlName="claveDeReferencia"
                  type="text"/>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="cadenaDependencia"
                  >Cadena de la dependencia:</label
                >
                <input
                  class="form-control"
                  id="cadenaDependencia"
                  formControlName="cadenaDependencia"
                  type="text"/>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-group">
                <div class="form-group">
                  <app-catalogo-select
                    [catalogo]="bancoCatalogo"
                    formControlName="banco"
                    [label]="'Banco'"
                    [required]="true">
                  </app-catalogo-select>
                </div>
              </div>
            </div>
          </div>
  
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="llaveDePago"
                  >Llave de pago:</label
                >
                <input
                  class="form-control"
                  id="llaveDePago"
                  formControlName="llaveDePago"
                  type="text"/>
              </div>
            </div>
  
            <div class="col-md-4">
              <div class="form-group">
                <input-fecha
                    [datos]="INPUT_FECHA_CONFIG"
                    [setFecha]="
                    formSolicitud.get('datosImportadorExportador.fechaPago') ?.value">
                </input-fecha>
              </div>
            </div>
  
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="importePago"
                  >Importe de pago:</label
                >
                <input
                  class="form-control"
                  id="importePago"
                  formControlName="importePago"
                  type="text"/>
              </div>
            </div>
          </div>
        </ng-container>
        <div class="d-flex justify-content-end mt-5">
            <button type="button" class="btn btn-danger">Borrar datos del pago</button>
        </div>
    </form>
</div>
