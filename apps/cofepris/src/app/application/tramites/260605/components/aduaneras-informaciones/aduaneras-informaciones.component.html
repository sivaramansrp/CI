<form [formGroup]="aduanerasInformacionesForm">
  <div class="container">
    <div class="row w-100">
      <div class="col-md-8">
        <div class="form-group">
          <label class="form-label" for="importPermitNumber">Número de permiso de importación de PLAFEST*</label>
          <input class="form-control" id="numeroDPmiso" formControlName="numeroDePermiso" type="text"
            (change)="setValoresStore(aduanerasInformacionesForm,'numeroDePermiso', 'setNumeroDPmiso')" />
        </div>
      </div>
      <div class="col-md-4 m-top">
        <div class="btn-group">
          <button class="btn btn-default" type="button" (click)="enEnviar()">Cargar Aduanas</button>
        </div>
      </div>
    </div>
  </div>

  <ng-container *ngIf="esFormularioValido">
    <div class="container">
      <div class="row w-100">
        <!-- Available Items and Buttons -->
        <div class="col-md-6">
          <label>Aduanas actuales*:</label>
          <div class="box-first">
            <ul class="list-first-box">
              <li *ngFor="let item of aduanasDisponiblesSeleccionadas; let i = index" class="box-item-frst">{{ item }}
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <crosslist [isDisabled]="esFormularioSoloLectura" [fechas]="aduanasDisponibles" [label]="paisDeOriginLabel" [botones]="paisDeProcedenciaBotons"
            (fechasSeleccionadasChange)="paisDeOriginSeleccionadasChange($event)"></crosslist>
        </div>
        <div class="col-md-8">
          <div class="form-group">
            <label class="form-label" for="technicalJustification">Justificación técnica para importar o exportar la
              cantidad solicitada*:</label>
            <textarea class="form-control cstm-ht" id="cstumbresAtuales" formControlName="cstumbresAtuales"
              (change)="setValoresStore(aduanerasInformacionesForm,'cstumbresAtuales', 'setCstumbresAtuales')"
              rows="3"></textarea>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</form>
