<div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1>
            Modificación del permiso sanitario de
            importación de insumos para la salud de dispositivos médicos, sin registro, usados
        </h1>
      </div>
    </div>
  
    <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    <div>
      @switch (indice) { @case (1) {
      <app-paso-uno></app-paso-uno>
      } @case (2) {
      <app-paso-dos></app-paso-dos>
      } @case (3) {
      <app-paso-tres></app-paso-tres>
      } }
    </div>
    <btn-continuar
      [datos]="datosPasos"
      (continuarEvento)="getValorIndice($event)"
    ></btn-continuar>
    @if(1 === indice) {
      <div class="mt-5">
        <div class="mt-5">
          <ng-alert [CONTENIDO]="TEXTOS.ADJUNTAR" [CUSTOMECLASS]="infoAlert"></ng-alert>
        </div>
      </div>
      }
  </div>
