<p>derechos works!</p>

<div class="container">
    <ng-titulo titulo="Transporte" />   
    <form [formGroup]="derechosForm" (ngSubmit)="validarTransporteFormulario()">
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">                
                  <!-- <select-catalogos [catalogosDatos]="tiposDocumentos"></select-catalogos> -->
              </div>
            </div>
            <div class="col-md-4">

              <div class="form-group">
                <label class="form-label" for="identificationDelTransporte">Identification del transporte:</label>
                <input class="form-control" id="identificationDelTransporte" formControlName="identificationDelTransporte"
                  placeholder="" type="text">
              </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="numerodeContenedor">Número de Contenedor:</label>
                  <input class="form-control" id="numerodeContenedor" placeholder="" type="text"
                    formControlName="numerodeContenedor" >
                </div>
              </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="fetchdeEmbarque">Fetcha de Embarque:</label>
                <input class="form-control" id="fetchdeEmbarque" placeholder="" type="text"
                  formControlName="fetchdeEmbarque" >
              </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="numerodeFlejes">Número de Flejes:</label>
                  <input class="form-control" id="numerodeFlejes" placeholder="" type="text"
                    formControlName="numerodeFlejes" >
                </div>
              </div>
          </div>
          <div class="row mt-5 mb-2">
            <div class="col-md-8">
                <p>* Campos obligatorios</p>
            </div>
            <div class="col-md-4">
              <div class="btn-group">
                <button class="btn btn-primary me-2" type="button">Guardar</button>
                <button class="btn btn-danger" type="button">Continuar</button>
              </div>
            </div>
          </div>   
      </form>
  </div>
