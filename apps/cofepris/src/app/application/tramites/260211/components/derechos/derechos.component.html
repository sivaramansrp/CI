<p>derechos works!</p>

<div class="container">
    <ng-titulo titulo="Pago de derechos" />   
    <form [formGroup]="derechosForm" (ngSubmit)="validarTransporteFormulario()">
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">                
                <label class="form-label" for="referencia">Clave de referencia:</label>
                <input class="form-control" id="referencia" formControlName="referencia"
                  placeholder="" type="text">
              </div>
            </div>
            <div class="col-md-4">

              <div class="form-group">
                <label class="form-label" for="Chandenadependencia">Chandena de la dependencia:</label>
                <input class="form-control" id="Chandenadependencia" formControlName="Chandenadependencia"
                  placeholder="" type="text">
              </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                  <app-catalogo-select
                    [catalogo]="derechosList"
                   
                    [label]="'benco'"
                    [placeholder]="'Seleccione una aduana'"
                    formControlName="benco"
                  ></app-catalogo-select>
                </div>
              </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <div class="form-group">
                <label class="form-label" for="Llave">Llave de page</label>
                <input class="form-control" id="Llave" placeholder="" type="text"
                  formControlName="Llave" >
              </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="deFetch">Fetch de page</label>
                  <input class="form-control" id="deFetch" placeholder="" type="date"
                    formControlName="deFetch" >
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="importe">Importe de pago</label>
                  <input class="form-control" id="importe" placeholder="" type="text"
                    formControlName="importe" >
                </div>
              </div>
          </div>
          <div class="row mt-5 mb-2">
            <div class="col-md-8">
            </div>
            <div class="col-md-4">
              <div class="btn-group">
                <button type="button" class="btn btn-outline-warning custom-button">Borrar datos del pago</button>
              </div>
            </div>
          </div>   
      </form>
  </div>
