<ng-titulo titulo="Manifiestos y declaraciones"></ng-titulo>
<ng-alert [CONTENIDO]="mensaje"></ng-alert>
<form [formGroup]="manifiestos">
    <div class="form mt-5">
        <div class="row">
            <div class="col-md-12">
              <label class="control-label" for="buscar">Los datos o anexos pueden contener información confidencial ¿Está de acuerdo en hacerlos públicos?*:</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="cumplimiento" value="aa" id="certficacion_no">
              <label class="control-label" for="cumplimiento">No</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="cumplimiento" value="a" id="cumplimiento_si">
              <label class="control-label" for="cumplimiento">Si</label>
            </div>
          </div>
    </div>
</form>
