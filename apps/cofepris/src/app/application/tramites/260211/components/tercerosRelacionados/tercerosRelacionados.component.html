<div class="container table-container">
  <ng-titulo titulo="Terceros relacionados"></ng-titulo>
  <ng-alert [CONTENIDO]="TEXTOS.ADJUNTAR" [CUSTOMECLASS]="infoAlert"></ng-alert>

  <!-- Proveedor Section -->
  <div class="row">
    <div class="col-md-12">
      <h6 class="mb-5">Fabricante*</h6>
      <app-tabla-dinamica
        [configuracionTabla]="configuracionTabla"
        [datos]="tercerosProd"
        [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX">
      </app-tabla-dinamica>

      <div style="text-align: right">
        <button
          style="text-align: right"
          type="button"
          class="btn btn-primary ms-2"
          data-bs-toggle="modal"
          data-bs-target="#modalAgregar"
          (click)="abrirModal()">
          Agregar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal for Proveedor -->
  <div class="container mt-4">
    <div class="modal fade" id="modalAgregar" tabindex="-1" aria-labelledby="modalAgregarLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <ng-titulo titulo="Agregar Fabricante"></ng-titulo>
          </div>
          <div class="modal-body">
            <!-- Use *ngIf to ensure the form is initialized before rendering -->
            <form *ngIf="proveedorForm" [formGroup]="proveedorForm">
              <h6>Datos generales</h6>
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label" for="nacionalidad">Nacionalidad:</label>
                  <div>
                    <input type="radio" id="nacional" name="nacionalidad" formControlName="nacionalidad" value="nacional">
                    <label for="nacional">Nacional</label>
                  </div>
                  <div>
                    <input type="radio" id="extranjero" name="nacionalidad" formControlName="nacionalidad" value="extranjero">
                    <label for="extranjero">Extranjero</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="tipoPersona">Tipo Persona*:</label>
                  <div>
                    <input type="radio" id="fisica" name="tipoPersona" formControlName="tipoPersona" value="fisica">
                    <label for="fisica">Física</label>
                  </div>
                  <div>
                    <input type="radio" id="moral" name="tipoPersona" formControlName="tipoPersona" value="moral">
                    <label for="moral">Moral</label>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <label class="form-label" for="rfc">R.F.C*:</label>
                  <input type="text" class="form-control" id="rfc" formControlName="rfc" [ngClass]="isValid(proveedorForm, 'rfc') ? 'required' : ''">
                </div>
           <div class="col-md-6" *ngIf="proveedorForm.get('nacionalidad')?.value === 'extranjero' && proveedorForm.get('tipoPersona')?.value === 'fisica'">
                  <label class="form-label" for="curp">C.U.R.P*:</label>
                  <input type="text" class="form-control" id="curp" formControlName="curp" />
                </div>

              </div>
              <div class="row">
                <div class="col-md-6">
                  <label class="form-label" for="denominacion">Denominación/razón social*:</label>
                  <input type="text" class="form-control" id="denominacion" formControlName="denominacion" [ngClass]="isValid(proveedorForm, 'denominacion') ? 'required' : ''">
                </div>
              </div>
              <ng-titulo titulo="Domicilio" />
              <div class="row">
                <div class="col-md-4 ">
                   
                  <app-catalogo-select
                  [catalogo]="proveedorList"
                  formControlName="pail"
                  [label]="'Pail*'"
                  [placeholder]="'Seleccione una aduana'"
                  [ngClass]="isValid(proveedorForm, 'pail') ? 'required' : ''"
                ></app-catalogo-select>
                  
                </div>

                <div class="col-md-4 mb-3">
                   
                  <app-catalogo-select
                  [catalogo]=" localidadList "
                  formControlName="pail"
                  [label]="'localidad*'"
                  [placeholder]="'Seleccione una aduana'"
                  [ngClass]="isValid(proveedorForm, 'pail') ? 'required' : ''"
                ></app-catalogo-select>
                
                </div>
                <div class="col-md-4 mb-3">
                 
                  <app-catalogo-select
                  [catalogo]=" localidadList "
                  formControlName="municipio"
                  [label]="'Municipio/alcalda*'"
                  [placeholder]="'Seleccione una aduana'"
                  [ngClass]="isValid(proveedorForm, 'municipio') ? 'required' : ''"
                ></app-catalogo-select>
                </div>
             <div class="row">

              <div class="col-md-4 ">
                  
                <app-catalogo-select
                [catalogo]=" localidadList "
               [label]="'Localidad*'"
                [placeholder]="'Seleccione una aduana'"
                formControlName="nombrelocalidad"
                [ngClass]="isValid(proveedorForm, 'nombrelocalidad') ? 'required' : ''"></app-catalogo-select>
              </div>
              <div class="col-md-4 mb-3">
                
                <app-catalogo-select
                [catalogo]=" localidadList "
               [label]="'Cadigo Postal oequd'"
                [placeholder]="'Seleccione una aduana'"
                formControlName="primerApellido"
              ></app-catalogo-select>
              </div>
              <div class="col-md-4 ">
                
                <app-catalogo-select
                [catalogo]=" localidadList "
                 [label]="'Colonia'"
                [placeholder]="'Seleccione una aduana'"
                formControlName="segundoApellido"
              ></app-catalogo-select>
              </div>
           </div>
            </div>
            <div class="row">
              <div class="col-md-4 ">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="equivalente">Colonia o equivalente:</label>
                <input type="text" class="form-control" id="equivalente" formControlName="equivalente"
                (change)="setValoresStore(proveedorForm,'equivalente', 'setequivalente')">
              </div>
              <div class="col-md-4 ">
              </div>
            </div>

            <div class="row">
              <div class="col-md-8">
                <label class="form-label" for="numeroCalle">Calle*:</label>
                <input type="text" class="form-control" id="numeroCalle" formControlName="numeroCalle"
                [ngClass]="isValid(proveedorForm, 'numeroCalle') ? 'required' : ''"
                (change)="setValoresStore(proveedorForm,'numeroCalle', 'setnumeroCalle')">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="experior">Numero experior*:</label>
                <input type="text" class="form-control" id="experior" formControlName="experior"
                [ngClass]="isValid(proveedorForm, 'experior') ? 'required' : ''"
                (change)="setValoresStore(proveedorForm,'experior', 'setexperior')">
              </div>
          </div>
          <div class="row">
            <div class="col-md-4">
              <label class="form-label" for="interior">Numero interior:</label>
              <input type="text" class="form-control" id="interior" formControlName="interior"
              (change)="setValoresStore(proveedorForm,'interior', 'setinterior')">
            </div>
            <div class="col-md-1 mb-3">
              <label class="form-label" for="lada">Lada:</label>
              <input type="text" class="form-control" id="lada" formControlName="lada"
              (change)="setValoresStore(proveedorForm,'lada', 'setlada')">
            </div>
            <div class="col-md-3 mb-3">
              <label class="form-label" for="numerotelefono">Teléfono:</label>
              <input type="text" class="form-control" id="numerotelefono" formControlName="numerotelefono"
              (change)="setValoresStore(proveedorForm,'numerotelefono', 'setnumerotelefono')">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label" for="correoElectronico">Correo electrónico:</label>
              <div class="input-group">
                <input type="email" class="form-control" id="correoElectronico" formControlName="correoElectronico"
                [ngClass]="isValid(proveedorForm, 'correoElectronico') ? 'required' : ''"
                (change)="setValoresStore(proveedorForm,'correoElectronico', 'setcorreoElectronico')">
                </div>
            </div>
          </div>

            </form>
          </div>
          <div class="modal-footer custom-footer">
            <button type="button" class="btn btn-primary">Cancelar</button>
            <button type="button" class="btn btn-default" data-bs-dismiss="modal">Limpiar</button>
            <button type="button" class="btn btn-primary">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <app-agregar-destinatario></app-agregar-destinatario>
  <!-- Requerida Section -->
  <div class="row">
    <div class="col-md-12">
      <h6 class="mb-5">Proveedor</h6>
      <app-tabla-dinamica
        [configuracionTabla]="configuracionTabla"
        [datos]="tercerosProd"
        [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX">
      </app-tabla-dinamica>
      <div style="text-align: right">
        <button
          style="text-align: right"
          type="button"
          class="btn btn-primary ms-2"
          data-bs-toggle="modal"
          data-bs-target="#modalrequerida"
          (click)="abrirModalrequerida()">
          Agregar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal for Requerida -->
  <div class="container mt-4">
    <div class="modal fade" id="modalrequerida" tabindex="-1" aria-labelledby="modalrequeridaLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <ng-titulo titulo="Agregar Proveedor"></ng-titulo>
          </div>
          <div class="modal-body">
            <!-- Use *ngIf to ensure the form is initialized before rendering -->
            <form *ngIf="requeridaForm" [formGroup]="requeridaForm">
              <h6>Datos generales</h6>
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label" for="tipoPersona">Tipo Persona*:</label>
                  <div>
                    <input type="radio" id="fisica" name="tipoPersona" formControlName="tipoPersona" value="fisica">
                    <label for="fisica">Física</label>
                  </div>
                  <div>
                    <input type="radio" id="moral" name="tipoPersona" formControlName="tipoPersona" value="moral">
                    <label for="moral">Moral</label>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 ">
                  <label class="form-label" for="rfc">R.F.C:</label>
                  <input type="text" class="form-control" id="nombre" formControlName="tiporfc"
                  (change)="setValoresStore(requeridaForm,'tiporfc', 'settiporfc')">
                </div>
                <div class="col-md-6 *ngIf=hideCurp ">
                    <label class="form-label" for="curp">C.U.R.P*:</label>
                    <input type="text" class="form-control" id="curp" formControlName="tipocurp"
                    (change)="setValoresStore(requeridaForm,'tipocurp', 'settipocurp')">
                  </div>
              </div>
              <div class="row">
                <div class="col-md-8 mb-3">
                  <label class="form-label" for="denominación">Denominación/razón social*:</label>
                  <input type="text" class="form-control" id="tipodenominacion" formControlName="tipodenominacion"
                  (change)="setValoresStore(requeridaForm,'tipodenominacion', 'settipodenominacion')">
                </div>
            </div>
            <ng-titulo titulo="Domicilio" />
                  
                    <div class="row">
                      <div class="col-md-4 ">
                       <app-catalogo-select
                        [catalogo]="proveedorList"
                        formControlName="tipopail"
                        [label]="'Pail*'"
                        [placeholder]="'Seleccione una aduana'"
                       
                      ></app-catalogo-select>
                        
                      </div>
                      <div class="col-md-4 mb-3">
                        <label class="form-label" for="numeroEstado">Estado*:</label>
                        <input type="text" class="form-control" id="numeroEstado" formControlName="numeroEstado"
                        (change)="setValoresStore(requeridaForm,'numeroEstado', 'setnumeroEstado')">
                        
                      
                      </div>
                      <div class="col-md-4">
                        <label class="form-label" for="numeropostal">Codigo postal o equivalente</label>
                        <input type="text" class="form-control" id="numeropostal" formControlName="numeropostal"
                        (change)="setValoresStore(requeridaForm,'numeropostal', 'setnumeropostal')">
                       
                      </div>
                    </div>
                  <div class="row">
                      <div class="col-md-4 ">
                        <label class="form-label" for="nombreequivalente">Colonia o equivalente:</label>
                        <input type="text" class="form-control" id="nombreequivalente" formControlName="nombreequivalente"
                        (change)="setValoresStore(requeridaForm,'nombreequivalente', 'setnombreequivalente')">
                        
                      </div>
                      <div class="col-md-4 mb-3">
                       
                      </div>
                      <div class="col-md-4 ">
                        
                      </div>
                    </div>

                    <div class="row">
                      <div class="col-md-8">
                        <label class="form-label" for="numeroCalle">Calle*:</label>
                        <input type="text" class="form-control" id="numeroCalle" formControlName="numerosCalle"
                        (change)="setValoresStore(requeridaForm,'numerosCalle', 'setnumerosCalle')">
                      </div>
                      <div class="col-md-4">
                        <label class="form-label" for="experior">Numero experior*:</label>
                        <input type="text" class="form-control" id="experior" formControlName="numbroexperior"
                        (change)="setValoresStore(requeridaForm,'numbroexperior', 'setnumbroexperior')">
                      </div>
                  </div>
                  <div class="row">
                    <div class="col-md-4">
                      <label class="form-label" for="numbrointerior">Numero interior:</label>
                      <input type="text" class="form-control" id="numbrointerior" formControlName="numbrointerior"
                      (change)="setValoresStore(requeridaForm,'numbrointerior', 'setnumbrointerior')">
                    </div>
                    <div class="col-md-1 mb-3">
                      <label class="form-label" for="numbrolada">Lada:</label>
                      <input type="text" class="form-control" id="numbrolada" formControlName="numbrolada"
                      (change)="setValoresStore(requeridaForm,'numbrolada', 'setnumbrolada')">
                    </div>
                    <div class="col-md-3 mb-3">
                      <label class="form-label" for="numerotelefono">Teléfono:</label>
                      <input type="text" class="form-control" id="numerostelefono" formControlName="numerostelefono"
                      (change)="setValoresStore(requeridaForm,'numerostelefono', 'setnumerostelefono')">
                    </div>
                    <div class="col-md-4 mb-3">
                      <label class="form-label" for="correoElectronico">Correo electrónico:</label>
                      <div class="input-group">
                        <input type="email" class="form-control" id="tipocorreoElectronico" formControlName="tipocorreoElectronico"
                        (change)="setValoresStore(requeridaForm,'tipocorreoElectronico', 'settipocorreoElectronico')">
                        </div>
                    </div>
                  </div>
                   
            </form>
          </div>
          <div class="modal-footer custom-footer">
            <button type="button" class="btn btn-primary">Cancelar</button>
            <button type="button" class="btn btn-default" data-bs-dismiss="modal">Limpiar</button>
            <button type="button" class="btn btn-primary">Guardar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- <app-agregar-destinatario></app-agregar-destinatario> -->
<app-agregar-facturator></app-agregar-facturator>
