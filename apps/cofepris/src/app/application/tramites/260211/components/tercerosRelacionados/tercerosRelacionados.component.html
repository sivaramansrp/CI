<div class="container table-container">
    <ng-titulo titulo="Terceros relacionados" />
    <ng-alert [CONTENIDO]="TEXTOS.ADJUNTAR" [CUSTOMECLASS]="infoAlert"></ng-alert>
    <div class="row">
    <div class="col-md-12">
<h6 class="mb-5">Fabricante*</h6>
<app-tabla-dinamica
[configuracionTabla]="configuracionTabla"
[datos]="tercerosProd"
[tipoSeleccionTabla]="TablaSeleccion.CHECKBOX">
</app-tabla-dinamica>

<div  style="text-align: right">
<button style="text-align: right"
        type="button"
        class="btn btn-primary ms-2"
        data-bs-toggle="modal"
        data-bs-target="#modalAgregar"
        (click)="abrirModal()"
      >
        Agregar
      </button>
    
</div>
</div>
</div>


<div class="container mt-4">
    <div
      class="modal fade"
      id="modalAgregar"
      tabindex="-1"
      aria-labelledby="modalAgregarLabel"
      aria-hidden="true"
    >
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <ng-titulo titulo="Agregar Fabricante" />
           
          </div>
          <div class="modal-body">
            <form [formGroup]="proveedorForm"  (ngSubmit)="guardarProveedor()">
                <h6>Datos generales</h6>
                <div class="row mb-3">
                    <div class="col-md-6">
                    <div class="col-md-12">
                      <label class="form-label" for="tipoPersona">Terceros Naciolalidad:</label>
                    </div>
                    
                    <div class="col-md-12">
                      <input type="radio" id="fisica" name="nacional" formControlName="nacional" value="nacional"  (change)="JustificacionSeleccion()" >
                      <label for="fisica"  >Nacional</label>
                    </div>
                    <div class="col-md-12">
                      <input type="radio" id="moral" name="nacional" formControlName="extranjero">
                      <label for="moral">Extranjero</label>
                    </div>
                  </div>
              <div class="col-md-6">
                    <div class="col-md-12">
                      <label class="form-label" for="tipoPersona">Tipo persona*:</label>
                    </div>
                    <div class="col-md-12">
                      <input type="radio" id="fisica" name="nacional1" formControlName="fisica" >
                      <label for="fisica">Física</label>
                    </div>
                    <div class="col-md-12">
                      <input type="radio" id="moral" name="nacional1" formControlName="moral" value="moral"  >
                      <label for="moral">Moral</label>
                    </div>
                  </div>
                  </div>
                  <div class="row">
                    <div class="col-md-6 ">
                      <label class="form-label" for="rfc">R.F.C:</label>
                      <input type="text" class="form-control" id="nombre" formControlName="rfc">
                    </div>
                    <div class="col-md-6 *ngIf=hideCurp ">
                        <label class="form-label" for="curp">C.U.R.P*:</label>
                        <input type="text" class="form-control" id="curp" formControlName="rfc">
                      </div>
                  </div>
                  <div class="row">
                    <div class="col-md-8 mb-3">
                      <label class="form-label" for="denominación">Denominación/razón social*:</label>
                      <input type="text" class="form-control" id="denominacion" formControlName="denominacion">
                    </div>
                </div>
                <ng-titulo titulo="Domicilio" />
              
                <div class="row">
                  <div class="col-md-4 ">
                   
                    <app-catalogo-select
                    [catalogo]="proveedorList"
                    formControlName="pail"
                    [label]="'Pail*'"
                    [placeholder]="'Seleccione una aduana'"
                    
                  ></app-catalogo-select>
                    
                  </div>
                  <div class="col-md-4 mb-3">
                   
                    <app-catalogo-select
                    [catalogo]=" localidadList "
                    formControlName="pail"
                    [label]="'localidad'"
                    [placeholder]="'Seleccione una aduana'"
                    
                  ></app-catalogo-select>
                  
                  </div>
                  <div class="col-md-4 mb-3">
                   
                    <app-catalogo-select
                    [catalogo]=" localidadList "
                    formControlName="municipio"
                    [label]="'Municipio/alcalda*'"
                    [placeholder]="'Seleccione una aduana'"
                   
                  ></app-catalogo-select>
                  </div>
                </div>
              
                <div class="row">
                  <div class="col-md-4 ">
                  
                    <app-catalogo-select
                    [catalogo]=" localidadList "
                   [label]="'Localidad*'"
                    [placeholder]="'Seleccione una aduana'"
                    formControlName="nombrelocalidad"
                  ></app-catalogo-select>
                  </div>
                  <div class="col-md-4 mb-3">
                    
                    <app-catalogo-select
                    [catalogo]=" localidadList "
                   [label]="'Cadigo Postal oequd'"
                    [placeholder]="'Seleccione una aduana'"
                    formControlName="primerApellido"
                  ></app-catalogo-select>
                  </div>
                  <div class="col-md-4 ">
                    
                    <app-catalogo-select
                    [catalogo]=" localidadList "
                     [label]="'Colonia'"
                    [placeholder]="'Seleccione una aduana'"
                    formControlName="segundoApellido"
                  ></app-catalogo-select>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-4 ">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="equivalente">Colonia o equivalente:</label>
                    <input type="text" class="form-control" id="equivalente" formControlName="equivalente">
                  </div>
                  <div class="col-md-4 ">
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-8">
                    <label class="form-label" for="numeroCalle">Calle*:</label>
                    <input type="text" class="form-control" id="numeroCalle" formControlName="numeroCalle">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label" for="experior">Numero experior*:</label>
                    <input type="text" class="form-control" id="experior" formControlName="experior">
                  </div>
              </div>
              <div class="row">
                <div class="col-md-4">
                  <label class="form-label" for="interior">Numero interior:</label>
                  <input type="text" class="form-control" id="interior" formControlName="interior">
                </div>
                <div class="col-md-1 mb-3">
                  <label class="form-label" for="lada">Lada:</label>
                  <input type="text" class="form-control" id="lada" formControlName="lada">
                </div>
                <div class="col-md-3 mb-3">
                  <label class="form-label" for="numerotelefono">Teléfono:</label>
                  <input type="text" class="form-control" id="numerotelefono" formControlName="numerotelefono">
                </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label" for="correoElectronico">Correo electrónico:</label>
                  <div class="input-group">
                    <input type="email" class="form-control" id="correoElectronico" formControlName="correoElectronico">
                    </div>
                </div>
              </div>
</form>
</div>


<div class="modal-footer custom-footer justify-content-center">
    <button type="button" class="btn btn-primary">Agregar</button>
    <button
      type="button"
      class="btn btn-default"
      data-bs-dismiss="modal"
      #closeModal
    >
      Cerrar
    </button>
  </div>     
</div>
</div>

</div>
