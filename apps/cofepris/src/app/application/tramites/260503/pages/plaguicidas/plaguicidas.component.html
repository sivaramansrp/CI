<div class="page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <h2>
          Permiso de importación de muestras experimentales con fines de pruebas
          de calidad relativas a la garantía de composición de los plaguicidas.
          (incluye estándares analíticos)
        </h2>
      </div>
      <div *ngIf="isPeligro" class="alert alert-danger text-center" role="alert" [innerHTML]="textoPeligro">
          {{textoPeligro}}
        </div>
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { 
        @case (1) {
          <app-paso-uno #pasoUnoRef [isContinuarTriggered]="isContinuarTriggered"></app-paso-uno>
      } @case (2) {
        <app-paso-carga-documento 
          [idSolicitud]="guardarIdSolicitud"
          idTipoTRamite]="'260503'"
          [cargaArchivosEvento]="cargarArchivosEvento"
          (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
          (reenviarCargaRealizada)="cargaRealizada($event)"
          (cargaEnProgreso)="onCargaEnProgreso($event)"
        ></app-paso-carga-documento>
      } @case (3) {
        <paso-firma [idSolicitud]="guardarIdSolicitud" [procedure]="260503" [procedureUrl]="'permiso-experimentales-plaguicidas/plaguicidas'"></paso-firma>
      } 
    }

      <btn-continuar
        [datos]="datosPasos"
        [dePadre]="true"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
    </div>
  </div>
</div>
