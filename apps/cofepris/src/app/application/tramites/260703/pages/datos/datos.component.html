<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h1>Solicitud de modificación y/o prórroga del permiso previo por retorno de productos </h1>
    </div>
  </div>
    <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    <div>
      @switch (indice) {
      @case (1) {
      <app-paso-uno></app-paso-uno>
      }
      @case (2) {
        <app-paso-dos></app-paso-dos>

      }
      @case (3) {
        <app-paso-tres></app-paso-tres>
      }
    }
    </div>
    <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    <ng-alert [CONTENIDO]="mensajeAlertaAvisoPrivacidad" [CUSTOMECLASS]="'alert-info'"></ng-alert>
</div>
