<div class="container">
  <ng-titulo titulo="Manifiestos y declaraciones"></ng-titulo>
  <div class="row mt-5">
    <ng-container [formGroup]="manifiestosForm">
      @for (manifiesto of manifiestos; let i = $index; track i) {
      <div class="row">
        <div class="col-md-12">
          <div class="d-flex alert alert-info">
            <input
              class="form-check-input"
              type="checkbox"
              [id]="'manifiesto-' + i"
              [value]="manifiesto.declaracion.clave"
              [checked]="seleccionadaManifiesto.value[i]"
              class="required"
              (change)="onManifiestoCheckboxCambiar($event, i)"
            />
            <div class="manifiesto-descripcion">
              <label>* {{ manifiesto.declaracion.descripcion }}</label>
            </div>
          </div>
        </div>
      </div>
      }

      <div class="row">
        <div class="col-md-12">
          <label class="form-label" for="informacionConfidencial"
            >Los datos o anexos pueden contener información confidencial ¿Está
            de acuerdo en hacerlos públicos? *:</label
          >
          <app-input-radio
            [radioOptions]="opcionDeBotonDeRadio"
            [isRequired]="true"
            [layout]="'horizontal'"
            formControlName="informacionConfidencial"
            (change)="setValoresStore('informacionConfidencial')"
          ></app-input-radio>
        </div>
      </div>
    </ng-container>
  </div>
</div>
