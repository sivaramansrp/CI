<div class="container">
  <ng-titulo titulo="Domicillo del establecimiento"></ng-titulo>
  <form [formGroup]="domicilloDelEstablecimientoForm">
    <div class="row">
      <div class="col-md-4">
        <label for="codigoPostal" class="form-label">Código postal *:</label>
        <input
          type="text"
          name="codigoPostal"
          id="codigoPostal"
          class="form-control"
          formControlName="codigoPostal"
          placeholder="95270"
          maxlength="12"
          (change)="setValoresStore('codigoPostal')"
          [class.is-invalid]="
            domicilloDelEstablecimientoForm.get('codigoPostal')?.touched &&
            domicilloDelEstablecimientoForm.get('codigoPostal')?.invalid
          "
        />
        <div
          class="invalid-feedback"
          *ngIf="
            domicilloDelEstablecimientoForm.get('codigoPostal')?.touched &&
            domicilloDelEstablecimientoForm.get('codigoPostal')?.invalid
          "
        >
          <span
            *ngIf="
              domicilloDelEstablecimientoForm
                .get('codigoPostal')
                ?.hasError('required')
            "
            >Este campo es obligatorio.</span
          >
        </div>
      </div>
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="estado"
          [placeholder]="'VERACRUZ'"
          formControlName="estado"
          [label]="'Estado'"
          [required]="true"
          name="estado"
          [isDisabled]="esFormularioSoloLectura"
          (change)="estadoSeleccion()"
        ></app-catalogo-select>
      </div>
      <div class="col-md-4">
        <label for="descripcionMunicipio" class="form-label"
          >Municipio y alcaldía *:</label
        >
        <input
          type="text"
          name="descripcionMunicipio"
          id="descripcionMunicipio"
          placeholder="ALVARADO"
          class="form-control"
          formControlName="descripcionMunicipio"
          (change)="setValoresStore('descripcionMunicipio')"
          [class.is-invalid]="
            domicilloDelEstablecimientoForm.get('descripcionMunicipio')
              ?.touched &&
            domicilloDelEstablecimientoForm.get('descripcionMunicipio')?.invalid
          "
        />
        <div
          class="invalid-feedback"
          *ngIf="
            domicilloDelEstablecimientoForm.get('descripcionMunicipio')
              ?.touched &&
            domicilloDelEstablecimientoForm.get('descripcionMunicipio')?.invalid
          "
        >
          <span
            *ngIf="
              domicilloDelEstablecimientoForm
                .get('descripcionMunicipio')
                ?.hasError('required')
            "
            >Este campo es obligatorio.</span
          >
        </div>
      </div>
    </div>
    <div class="row mt-5">
      <lib-notificaciones
        [notificacionInput]="notificacionInput"
      ></lib-notificaciones>
    </div>
    <div class="row">
      <div class="col-md-4">
        <label for="informacionExtra" class="form-label">Localidad:</label>
        <input
          type="text"
          name="informacionExtra"
          id="informacionExtra"
          placeholder="ALVARADO"
          class="form-control"
          formControlName="informacionExtra"
          (change)="setValoresStore('informacionExtra')"
        />
      </div>
      <div class="col-md-4">
        <label for="descripcionColonia" class="form-label">Colonia:</label>
        <input
          type="text"
          name="descripcionColonia"
          id="descripcionColonia"
          placeholder="CENTRO"
          class="form-control"
          formControlName="descripcionColonia"
          (change)="setValoresStore('descripcionColonia')"
        />
      </div>
    </div>
    <div class="row">
      <div class="col-md-8">
        <label for="calle" class="form-label">Calle *:</label>
        <input
          type="text"
          name="calle"
          id="calle"
          placeholder="HERMENEGUILDO GALEANA"
          class="form-control"
          formControlName="calle"
          (change)="setValoresStore('calle')"
          [class.is-invalid]="
            domicilloDelEstablecimientoForm.get('calle')?.touched &&
            domicilloDelEstablecimientoForm.get('calle')?.invalid
          "
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="
          domicilloDelEstablecimientoForm.get('calle')?.touched &&
          domicilloDelEstablecimientoForm.get('calle')?.invalid
        "
      >
        <span
          *ngIf="
            domicilloDelEstablecimientoForm.get('calle')?.hasError('required')
          "
          >Este campo es obligatorio.</span
        >
      </div>
    </div>
    <div class="row">
      <div class="col-md-1">
        <label for="lada" class="form-label">Lada:</label>
        <input
          type="text"
          name="lada"
          id="lada"
          class="form-control"
          formControlName="lada"
          placeholder="22"
          (change)="setValoresStore('lada')"
        />
      </div>
      <div class="col-md-3">
        <label for="telefono" class="form-label">Teléfono *:</label>
        <input
          type="text"
          name="telefono"
          id="telefono"
          class="form-control"
          formControlName="telefono"
          placeholder="2979725632"
          (change)="setValoresStore('telefono')"
          [class.is-invalid]="
            domicilloDelEstablecimientoForm.get('telefono')?.touched &&
            domicilloDelEstablecimientoForm.get('telefono')?.invalid
          "
        />
      </div>
      <div
        class="invalid-feedback"
        *ngIf="
          domicilloDelEstablecimientoForm.get('telefono')?.touched &&
          domicilloDelEstablecimientoForm.get('telefono')?.invalid
        "
      >
        <span
          *ngIf="
            domicilloDelEstablecimientoForm
              .get('telefono')
              ?.hasError('required')
          "
          >Este campo es obligatorio.</span
        >
      </div>
    </div>

    <div class="row" class="mt-5">
      <div class="form-group">
        <label class="form-label" for="scian">S.C.I.A.N. *:</label>
        <app-tabla-dinamica
          [configuracionTabla]="configuracionTabla"
          [datos]="scianDatos"
          [tipoSeleccionTabla]="tipoSeleccionTabla"
        >
        </app-tabla-dinamica>
      </div>
      <div class="row" style="padding-bottom: 20px; text-align: right">
        <div>
          <button type="button" class="btn me-2" >Eliminar</button>
          <button
            type="button"
            class="btn btn-primary me-2"
          >
            Agregar
          </button>
        </div>
      </div>
    </div>

    <div class="row mt-5 d-flex align-items-center">
      <div class="col-md-3">
        <label>
          <input
            type="checkbox"
            id="funcionamiento"
            formControlName="funcionamiento"
            (change)="setValoresStore('funcionamiento')"
          />Aviso de funcionamiento *
        </label>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="licencia" 
        *ngIf='this.domicilloDelEstablecimientoForm.get("funcionamiento")?.value'
          >No. de licencia sanitaria:
        </label>
        <label class="form-label" for="licencia"
        *ngIf='!this.domicilloDelEstablecimientoForm.get("funcionamiento")?.value'

          >No. de licencia sanitaria*:
        </label>
        <input
          type="text"
          id="licencia"
          name="licencia"
          class="form-control"
          formControlName="licencia"
          (change)="setValoresStore('licencia')"
        />
      </div>
    </div>
    <div class="row mt-5">
      <div class="col-md-8">
        <app-catalogo-select
          [catalogo]="solicitudPermisoService.regimen"
          formControlName="regimen"
          [placeholder]="'Definitivos'"
          [label]="'Regimen al que se destinara la mercancia'"
          [required]="true"
          [tooltipQuestionCircle]="true"
          name="regimen"
          (onChange)="setValoresStore('regimen')"
          [isDisabled]="esFormularioSoloLectura"
        ></app-catalogo-select>
      </div>
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="solicitudPermisoService.aduana"
          [placeholder]="'DOS BOCAS'"
          formControlName="aduana"
          [label]="'Aduana'"
          [required]="true"
          name="aduana"
          (onChange)="setValoresStore('aduana')"
          [isDisabled]="esFormularioSoloLectura"
        ></app-catalogo-select>
      </div>
    </div>
    <div class="row mt-5">
      <div class="form-group">
        <label class="form-label" for="mercancias">Mercancías *:</label>
        <app-tabla-dinamica
          [configuracionTabla]="configuracionTablaMercancia"
          [datos]="mercanciaDatos"
          [tipoSeleccionTabla]="tipoSeleccionTabla"
        >
        </app-tabla-dinamica>
        <div class="row" style="padding-bottom: 20px; text-align: right">
          <div>
            <button type="button" class="btn btn-default me-2">
              Modificar
            </button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
