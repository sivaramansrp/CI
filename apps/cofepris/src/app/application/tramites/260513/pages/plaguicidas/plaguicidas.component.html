<div class="page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <h2>
          Permiso de importación de muestras experimentales de sustancias tóxicas
        </h2>
      </div>
          @if (esFormaValido) {
          <div class="col-md-12">
            <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
          </div>
        }
      

      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
    <app-paso-uno #PasoUnoComponent></app-paso-uno>
    } @case (2) {
      <app-paso-carga-documento 
      [idSolicitud]="idSolicitudState"
      [idTipoTRamite]="idTipoTramite"
      [cargaArchivosEvento]="cargarArchivosEvento"
      (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
      (reenviarCargaRealizada)="cargaRealizada($event)"
      (cargaEnProgreso)="onCargaEnProgreso($event)"
      ></app-paso-carga-documento>
    } @case (3) {
      <paso-firma [idSolicitud]="idSolicitudState" [procedure]="260513" [procedureUrl]="'muestras-de-toxicos/plaguicidas'"></paso-firma>
     
    } }

      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
        [dePadre]="true"
      ></btn-continuar>
      <app-aviso-de-privacidad *ngIf="indice === 1"></app-aviso-de-privacidad>
    </div>
  </div>
</div>

@if(mostrarAlerta){
  <section>
    <lib-notificaciones [notificacionInput]="seleccionarFilaNotificacion" (confirmacionModal)="mostrarAlerta = false">
    </lib-notificaciones>
  </section>
  }
