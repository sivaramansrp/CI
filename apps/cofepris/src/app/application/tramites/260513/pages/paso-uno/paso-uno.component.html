<div class="container">
  <div class="row">
    <ul class="nav nav-tabs" *ngIf="[1,2,3,4].includes(indice)">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(1)" role="button" tabindex="0">Solicitante</a>
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(2)" role="button" tabindex="2">Datos de la solicitud</a>
      </li>
      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(3)" role="button" tabindex="3">Terceros relacionados</a>
      </li>
      <li [ngClass]="indice === 4 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(4)" role="button" tabindex="4">Pago de derechos</a>
      </li>
    </ul> 

    <ng-container>
      <solicitante #Solicitante [hidden]="indice !== 1"></solicitante>
      <app-datos-solicitud #datosSolicitudRef [hidden]="indice !== 2"></app-datos-solicitud>
      <app-terceros-relacionados-fabricante #tercerosRelacionadosFabricanteRef [hidden]="indice !== 3"></app-terceros-relacionados-fabricante>
      <app-pago-derechos #pagoDerechosRef [hidden]="indice !== 4"></app-pago-derechos>
    </ng-container>
  </div>
</div>
