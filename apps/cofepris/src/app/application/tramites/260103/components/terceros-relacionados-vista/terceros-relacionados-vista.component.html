<div class="container">
  <ng-titulo titulo="Terceros relacionados"></ng-titulo>

  <div class="row mt-5">
    <ng-alert
      [CONTENIDO]="MENSAJE_TABLA_OBLIGATORIA"
      [CUSTOMECLASS]="infoAlert"
    ></ng-alert>
  </div>
  <div class="row mt-5">
    <h6>Destinatario(Destino final)*:</h6>
  </div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaDestinatario"
      [datos]="(destinatarioTablaDatos$ | async) || []"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
        >
          Eliminar
        </button>

        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="navigate(tipoTablaDatos.DESTINATARIO)"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-5"><h6>Fabricante*:</h6></div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFabricante"
      [datos]="(fabricanteTablaDatos$ | async) || []"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
        >
          Eliminar
        </button>

        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="navigateFabricante()"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-5"></div>
</div>
