<div class="container">
  <ng-titulo titulo="Terceros relacionados"></ng-titulo>

  <div class="row mt-5">
    <ng-alert
      [CONTENIDO]="MENSAJE_TABLA_OBLIGATORIA"
      [CUSTOMECLASS]="infoAlert"
    ></ng-alert>
  </div>
  <div class="row mt-5">
    <h6>Destinatario (destino final)*:</h6>
  </div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaDestinatario"
      [datos]="(destinatarioTablaDatos$ | async) || []"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
      [acciones]="accionesServcios"
      (listaDeFilaSeleccionada)="onListaDeFilaSeleccionada($event,'destinatario')"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right" *ngIf="(destinatarioTablaDatos$ | async) as datos">
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
           *ngIf= "datos.length !== 0"
           [disabled]="listaDeTablasSeleccionadasDestinatario.length !== 1"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
         *ngIf= "datos.length !== 0"
         [disabled]="listaDeTablasSeleccionadasDestinatario.length !== 1"
         (click)="eliminarDestinatario()"
        >
          Eliminar
        </button>

        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="navigate(tipoTablaDatos.DESTINATARIO)"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-5"><h6>Fabricante*:</h6></div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFabricante"
      [datos]="(fabricanteTablaDatos$ | async) || []"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
      [acciones]="accionesServcios"
      (listaDeFilaSeleccionada)="onListaDeFilaSeleccionada($event,'fabricante')"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right" *ngIf="(fabricanteTablaDatos$ | async) as datos">
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
           *ngIf= "datos.length !== 0"
            [disabled]="listaDeTablasSeleccionadasFabricante.length !== 1"
             (click)="navigateFabricante('edit')"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
          *ngIf= "datos.length !== 0"
          [disabled]="listaDeTablasSeleccionadasFabricante.length !== 1"
          (click)="eliminarFabricante()"
        >
          Eliminar
        </button>

        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="navigateFabricante()"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-5"></div>
</div>
