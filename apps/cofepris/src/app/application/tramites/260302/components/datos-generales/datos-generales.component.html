<div class="container">
  @if(tipoDatos) {

  <ng-titulo titulo="Agregar {{ tipoDatos }}"></ng-titulo>
  <!-- Datos Generales -->
  <h4>Datos Generales</h4>
  }

  <form class="row col-12" [formGroup]="agregarDatosForm">
    <div class="row">
      <div class="col-md-6">
        <label class="form-label" for="nombreRazonSocial"
          >Denominación/razón social*:</label
        >
        <input
          class="form-control"
          id="nombreRazonSocial"
          type="text"
          formControlName="nombreRazonSocial"
        />
      </div>
    </div>

    <div class="row">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="paisesDatos"
          formControlName="pais"
          [label]="'País'"
          [required]="true"
        ></app-catalogo-select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Estado:</label>
        <input type="text" class="form-control" formControlName="estado" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Código postal o equivalente:</label>
        <input
          type="text"
          class="form-control"
          formControlName="codigoPostal"
        />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-8">
        <label class="form-label">Calle*:</label>
        <span
          class="bi bi-question-circle-fill"
          title="Calle"
          data-bs-toggle="tooltip"
        ></span>
        <input type="text" class="form-control" formControlName="calle" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Número exterior:</label>
        <input
          type="text"
          class="form-control"
          formControlName="numeroExterior"
        />
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-md-4">
        <label class="form-label">Número interior:</label>
        <input
          type="text"
          class="form-control"
          formControlName="numeroInterior"
        />
      </div>
      <div class="col-md-1">
        <label class="form-label">Lada:</label>
        <input type="text" class="form-control" formControlName="lada" />
      </div>
      <div class="col-md-3">
        <label class="form-label">Teléfono:</label>
        <input type="text" class="form-control" formControlName="telefono" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Correo electrónico:</label>
        <span
          class="bi bi-question-circle-fill"
          title="Correo electrónico"
          data-bs-toggle="tooltip"
        ></span>
        <input
          type="email"
          class="form-control"
          formControlName="correoElectronico"
        />
      </div>
    </div>

    <div class="row mt-5">
      <div class="col-md-12">
        <div class="pull-right">
          <button
            type="button"
            name="modificarMercancias"
            class="btn btn-default"
            (click)="cancelar()"
          >
            Cancelar
          </button>
          <button
            type="button"
            name="limpiarDatos"
            class="btn btn-danger ms-2"
            (click)="limpiarFormulario()"
          >
            Limpar
          </button>
          <button
            type="button"
            name="agregarMercancias"
            class="btn btn-primary ms-2"
            (click)="guardarDatos()"
          >
            Guardar
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
