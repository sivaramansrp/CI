<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
          <h4>parmiso de importacion de muestras experimentales con fines de pruebas de calidad relativas a la garantia de compasicion de las substanicias toxicas</h4>
        </div>
        <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
      </div>
      <div class="row">
        @switch (indice) { 
        @case (1) {
          <app-datos-260514></app-datos-260514>
        } @case (2) {
          <app-paso-dos></app-paso-dos>
        } @case (3) {
          <app-paso-tres></app-paso-tres>
        }
       }
      </div>
      <btn-continuar
      [datos]="datosPasos"
      (continuarEvento)="getValorIndice($event)"
    >
    </btn-continuar>
</div>
