<div class="modal-header">
    <h3 class="modal-title pull-left">{{titulo}}</h3>
  </div>
  <div class="modal-body">
    <form [formGroup]="tercerosRelacionadosForm">
        @if(titulo !== 'Agregar otros') {
            <h5>Datos generales</h5>
            <div class="row mb-5">
                <div class="col-md-8">
                    <div class="form-group">
                        <label for="denominacion">Denominación/razón social*:</label>
                        <input type="text" class="form-control" 
                            formControlName="denominacionSocial" 
                            (change)="setValoresStore(tercerosRelacionadosForm,'denominacionSocial', 'SetTercerosRelacionadosDenominacionSocial')"
                            id="denominacion">
                    </div>
                </div>
            </div>
            } @else {
                <div class="row mb-5">
                    <div class="col-md-12">
                        <div class="form-group">
                            <label for="nombreDescripcion">Tercero nombre descripcion*:</label>
                            <input type="text" class="form-control" 
                            formControlName="terceroNombre" 
                            (change)="setValoresStore(tercerosRelacionadosForm,'terceroNombre', 'SetTercerosRelacionadosTerceroNombre')"
                            id="nombreDescripcion">
                        </div>
                    </div>
                </div>
                <h5>Datos generales</h5>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <p class="fw-bold">Terceros nacionalidad*:</p>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" 
                                formControlName="nacional" 
                                (change)="setValoresStore(tercerosRelacionadosForm,'nacional', 'SetTercerosRelacionadosNacional')"
                                name="nacional" id="flexRadioDefault3">
                            <label class="form-check-label" for="flexRadioDefault3">
                                Nacional
                            </label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="radio" 
                                formControlName="extranjero" 
                                name="extranjero" 
                                (change)="setValoresStore(tercerosRelacionadosForm,'extranjero', 'SetTercerosRelacionadosExtranjero')"
                                id="flexRadioDefault4">
                            <label class="form-check-label" for="flexRadioDefault4">
                                Extranjero
                            </label>
                          </div>
                    </div>
                    <div class="col-md-6">
                        <p class="fw-bold">Tipo persona*:</p>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" 
                                formControlName="fisica"
                                (change)="setValoresStore(tercerosRelacionadosForm,'fisica', 'SetTercerosRelacionadosFisica')" 
                                name="fisica" 
                                id="flexRadioDefault1">
                            <label class="form-check-label" for="flexRadioDefault1">
                                Fisica <i class="bi bi-question-circle-fill"></i>
                            </label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="radio" 
                                formControlName="moral" 
                                (change)="setValoresStore(tercerosRelacionadosForm,'moral', 'SetTercerosRelacionadosMoral')"
                                name="moral" 
                                id="flexRadioDefault2">
                            <label class="form-check-label" for="flexRadioDefault2">
                                Moral <i class="bi bi-question-circle-fill"></i>
                            </label>
                          </div>
                          <div class="form-check">
                            <input class="form-check-input" type="radio" 
                                formControlName="noContribuyente"
                                (change)="setValoresStore(tercerosRelacionadosForm,'noContribuyente', 'SetTercerosRelacionadosNoContribuyente')" 
                                name="noContribuyente" 
                                id="flexRadioDefault3">
                            <label class="form-check-label" for="flexRadioDefault3">
                                No contribuyente
                            </label>
                          </div>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="rfc" class="form-label">RFC*:</label>
                            <input type="text" id="rfc" 
                                formControlName="rfc"
                                (change)="setValoresStore(tercerosRelacionadosForm,'rfc', 'SetTercerosRelacionadosRfc')" 
                                class="form-control">
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="button" class="btn btn-primary mt-5">Bucar</button>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="curp" class="form-label">C.U.R.P*:</label>
                            <input type="text" id="curp" 
                                formControlName="curp"
                                (change)="setValoresStore(tercerosRelacionadosForm,'curp', 'SetTercerosRelacionadosCurp')" 
                                class="form-control">
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-8">
                        <div class="form-group">
                            <label for="denominacion" class="form-label">Denominación/razón social*:</label>
                            <input type="text" id="denominacion" 
                                formControlName="razonSocial" 
                                (change)="setValoresStore(tercerosRelacionadosForm,'razonSocial', 'SetTercerosRelacionadosRazonSocial')"
                                class="form-control">
                        </div>
                    </div>
                </div>
            }
            <h5>Domicilio</h5>
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="pais" class="form-label">País</label>
                        <input type="text" id="pais" 
                            formControlName="pais"
                            (change)="setValoresStore(tercerosRelacionadosForm,'pais', 'SetTercerosRelacionadosPais')" 
                            class="form-control">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="estado" class="form-label">Estado</label>
                        <input type="text" id="estado" 
                            formControlName="estado"
                            (change)="setValoresStore(tercerosRelacionadosForm,'estado', 'SetTercerosRelacionadosEstado')" 
                            class="form-control">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="estado" class="form-label">Código postal o equivalente</label>
                        <input type="text" id="estado" 
                            formControlName="codigoPostal" 
                            (change)="setValoresStore(tercerosRelacionadosForm,'codigoPostal', 'SetTercerosRelacionadosCodigoPostal')"
                            class="form-control">
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <div class="form-group">
                        <label for="calle" class="form-label">Calle*:</label>
                        <input type="text" id="calle" 
                            formControlName="calle" 
                            (change)="setValoresStore(tercerosRelacionadosForm,'calle', 'SetTercerosRelacionadosCalle')"
                            class="form-control">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="numeroExterior" class="form-label">Número exterior*:</label>
                        <input type="text" id="numeroExterior" 
                            formControlName="numeroExterior"
                            (change)="setValoresStore(tercerosRelacionadosForm,'numeroExterior', 'SetTercerosRelacionadosNumeroExterior')" 
                            class="form-control">
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="numeroInterior" class="form-label">Número interior:</label>
                        <input type="text" id="numeroInterior" 
                            formControlName="numeroInterior"
                            (change)="setValoresStore(tercerosRelacionadosForm,'numeroInterior', 'SetTercerosRelacionadosNumeroInterior')" 
                            class="form-control">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="d-flex">
                        <div class="form-group">
                            <label for="lada" class="form-label">Lada:</label>
                            <input type="text" id="lada" 
                                formControlName="lada"
                                (change)="setValoresStore(tercerosRelacionadosForm,'lada', 'SetTercerosRelacionadosLada')" 
                                class="form-control lada">
                        </div>
                        <div class="form-group">
                            <label for="telefono" class="form-label">Teléfono*:</label>
                            <input type="text" id="telefono" 
                                formControlName="telefono"
                                (change)="setValoresStore(tercerosRelacionadosForm,'telefono', 'SetTercerosRelacionadosTelefono')" 
                                class="form-control">
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="d-flex">
                        <div class="form-group">
                            <label for="correoElectronico" class="form-label">Correo electrónico: </label>
                            <input type="text" id="correoElectronico" 
                                formControlName="correoElectronico"
                                (change)="setValoresStore(tercerosRelacionadosForm,'correoElectronico', 'SetTercerosRelacionadosCorreoElectronico')" 
                                class="form-control">
                        </div>
                    </div>
                </div>
            </div>
    </form>
  </div>
  <div class="modal-footer">
    <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-danger me-2">Cancelar</button>
        <button type="button" class="btn btn-default me-2">Limpiar</button>
        <button type="button" class="btn btn-primary" (click)="bsModalRef.hide()">Guardar</button>
    </div>
  </div>
