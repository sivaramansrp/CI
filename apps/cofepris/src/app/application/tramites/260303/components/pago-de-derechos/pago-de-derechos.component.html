<div class="container">
    <ng-titulo titulo="Pago de derechos"></ng-titulo>
    <div class="row mb-3">
        <div class="col-md-4">
            <div class="form-group">
                <label for="claveDe" class="form-label">Clave de referencia:</label>
                <input type="text" id="claveDe" class="form-control">
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="cadena" class="form-label">Cadena de la dependencia:</label>
                <input type="text" id="cadena" class="form-control">
            </div>
        </div>
        <div class="col-md-4">
            <app-catalogo-select 
                [catalogo]="bancoCatalogo" 
                [label]="'Banco'"
                [required]="true"
                name="banco">
            </app-catalogo-select>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-4">
            <div class="form-group">
                <label for="Llave" class="form-label">Llave de pago:</label>
                <input type="text" id="Llave" class="form-control">
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="cadena" class="form-label">Fecha de pago:</label>
                <input type="date" id="cadena" class="form-control">
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="importe" class="form-label">Importe de pago: </label>
                <input type="text" id="Importe" class="form-control">
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-end mt-5">
        <button type="button" class="btn btn-danger">Borrar datos del pago</button>
    </div>
</div>
