<div class="container">
    <ng-titulo titulo="Pago de derechos"></ng-titulo>
    <form [formGroup]="pagoDerechosForm">
        <div class="row mb-3">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="claveDe" class="form-label">Clave de referencia:</label>
                    <input type="text" id="claveDe" formControlName="claveDeReferencia" class="form-control">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label for="cadena" class="form-label">Cadena de la dependencia:</label>
                    <input type="text" id="cadena" formControlName="cadenaDaLaDependencia" class="form-control">
                </div>
            </div>
            <div class="col-md-4">
                <app-catalogo-select 
                    [catalogo]="bancoCatalogo" 
                    [label]="'Banco'"
                    [required]="true"
                    formControlName="banco"
                    name="banco">
                </app-catalogo-select>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="Llave" class="form-label">Llave de pago:</label>
                    <input type="text" id="Llave" formControlName="laveDePago" class="form-control">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label for="cadena" class="form-label">Fecha de pago:</label>
                    <input type="date" id="cadena" formControlName="fechaDePago" class="form-control">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label for="importe" class="form-label">Importe de pago: </label>
                    <input type="text" id="Importe" formControlName="importeDePago" class="form-control">
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-5">
            <button type="button" class="btn btn-danger">Borrar datos del pago</button>
        </div>
    </form>
</div>
