<div class="container">
    <ng-titulo titulo="Pago de derechos"></ng-titulo>
    <form [formGroup]="pagoDerechosForm">
        <div class="row mb-3">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="claveDe" class="form-label">Clave de referencia:</label>
                    <input type="text" id="claveDe" 
                        formControlName="claveDeReferencia" 
                        class="form-control"
                        (change)="setValoresStore(pagoDerechosForm,'claveDeReferencia', 'setClaveDeReferencia')">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label for="cadena" class="form-label">Cadena de la dependencia:</label>
                    <input type="text" id="cadena" 
                        formControlName="cadenaDaLaDependencia" 
                        class="form-control"
                        (change)="setValoresStore(pagoDerechosForm,'cadenaDaLaDependencia', 'setCadenaDaLaDependencia')">
                </div>
            </div>
            <div class="col-md-4">
                <app-catalogo-select 
                    [catalogo]="bancoCatalogo" 
                    [label]="'Banco'"
                    [required]="true"
                    formControlName="banco"
                    name="banco"
                    (change)="setValoresStore(pagoDerechosForm,'banco', 'setBanco')" [isDisabled]="consultaState.readonly">
                </app-catalogo-select>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="Llave" class="form-label">Llave de pago:</label>
                    <input type="text" id="Llave" 
                        formControlName="laveDePago" 
                        class="form-control"
                        (change)="setValoresStore(pagoDerechosForm,'laveDePago', 'setLaveDePago')">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <input-fecha 
                        [datos]="fechaInicioInput" 
                        (valorCambiado)="cambioFechaFinal($event)" 
                        name="fechaDePago"
                        [setFecha]="pagoDerechosForm.get('fechaDePago')?.value">
                    </input-fecha>
                  </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label for="importe" class="form-label">Importe de pago: </label>
                    <input type="text" id="Importe" 
                        formControlName="importeDePago" 
                        class="form-control"
                        (change)="setValoresStore(pagoDerechosForm,'importeDePago', 'setImporteDePago')">
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-end mt-5">
            <button type="button" class="btn btn-danger" [disabled]="consultaState.readonly" (click)="borrarDatosDelPago()">Borrar datos del pago</button>
        </div>
    </form>
</div>
