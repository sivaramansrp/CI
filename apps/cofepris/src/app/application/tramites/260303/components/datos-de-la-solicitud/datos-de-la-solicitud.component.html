<div class="container">
    <ng-titulo titulo="Datos del establecimiento"></ng-titulo>
    <div class="d-flex justify-content-end">
        <button class="btn btn-primary" type="button" (click)="seleccionar(template)">Seleccionar establecimiento</button>
    </div>
    <div class="row mb-3">
        <div class="col-md-8">
            <form [formGroup]="denominacionForm">
                <div class="form-group">
                    <label for="denominacionRazon" class="form-label">Denominación o razón social*:</label>
                    <input type="text" id="denominacionRazon" formControlName="denominacionRazon" class="form-control">
                </div>
            </form>
        </div>
    </div>
    <ng-titulo titulo="Domicilio del establecimiento"></ng-titulo>
    <div class="row mb-3">
        <div class="col-md-4">
            <div class="form-group">
                <label for="codigoPostal" class="form-label">Código postal*:</label>
                <input type="text" id="codigoPostal" class="form-control">
            </div>
        </div>
        <div class="col-md-4">
            <app-catalogo-select 
                [catalogo]="estadoCatalogo" 
                [label]="'Estado'"
                [required]="true"
                name="estado">
            </app-catalogo-select>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="municipioAlcaldia" class="form-label">Municipio o alcaldía*:</label>
                <input type="text" id="municipioAlcaldia" class="form-control">
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-4">
            <div class="form-group">
                <label for="localidad" class="form-label">Localidad*:</label>
                <input type="text" id="localidad" class="form-control">
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="colonia" class="form-label">Colonia*:</label>
                <input type="text" id="colonia" class="form-control">
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="calle" class="form-label">Calle y número*: <i class="bi bi-question-circle-fill"></i></label>
                <input type="text" id="calle" class="form-control">
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-4">
            <div class="form-group">
                <label for="correoElectronico" class="form-label">Correo electrónico*: <i class="bi bi-question-circle-fill"></i></label>
                <input type="text" id="correoElectronico" class="form-control">
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="rfc" class="form-label">RFC del responsable sanitario:</label>
                <input type="text" id="rfc" class="form-control">
            </div>
        </div>
        <div class="col-md-4">
            <div class="d-flex">
                <div class="form-group">
                    <label for="lada" class="form-label">Lada:</label>
                    <input type="text" id="lada" class="form-control lada">
                </div>
                <div class="form-group">
                    <label for="telefono" class="form-label">Teléfono*:</label>
                    <input type="text" id="telefono" class="form-control">
                </div>
            </div>
        </div>
    </div>
    <div class="row mb-3 mt-5">
        <h5 class="mb-5">S.C.I.A.N*:</h5>
        <div class="col-md-12">
            <app-tabla-dinamica
                [configuracionTabla]="configuracionTabla"
                [datos]="scianTablaDatos"
                [tipoSeleccionTabla]="checkbox">
            </app-tabla-dinamica>
            <div class="d-flex justify-content-end mt-3">
                <button class="btn btn-danger me-3">Eliminar</button>
                <button class="btn btn-primary" (click)="seleccionarAgregar(scian)">Agregar</button>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="aviso">
                <label class="form-check-label fw-normal" for="aviso">
                    Aviso de funcionamiento
                </label>
            </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
                <label for="licenciaSanitaria" class="form-label">No. de licencia sanitaria: <i class="bi bi-question-circle-fill"></i></label>
                <input type="text" id="licenciaSanitaria" class="form-control">
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <div class="col-md-8">
            <app-catalogo-select 
                [catalogo]="regimenCatalogo" 
                [label]="'Régimen al que se destinará la mercancía'"
                [required]="true"
                name="regimenCatalogo">
            </app-catalogo-select>
        </div>
    </div>
</div>

<!-- modal -->
<ng-template #template>
    <div class="modal-header">
      <button type="button" class="btn-close close pull-right" aria-label="Close">
        <span aria-hidden="true" class="visually-hidden">&times;</span>
      </button>
    </div>
    <div class="modal-body">
        Por el momento no hay comunicación con el
        Sistema de COFEPRIS, favor de capturar su establecimiento.
    </div>
    <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-primary" (click)="cerrar()">Aceptar</button>
    </div>
</ng-template>

<!-- S.C.I.A.N Tabla Modal -->
<ng-template #scian>
    <div class="modal-header">
      <h3>Clave S.C.I.A.N</h3>
    </div>
    <div class="modal-body">
        <form>
            <div class="row">
                <div class="col-md-8">
                    <app-catalogo-select 
                        [catalogo]="claveCatalogo" 
                        [label]="'Clave S.C.I.A.N'"
                        [required]="true"
                        name="clave">
                    </app-catalogo-select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-8">
                    <app-catalogo-select 
                        [catalogo]="estadoCatalogo" 
                        [label]="'Descripción del S.C.I.A.N'"
                        [required]="true"
                        name="descripcion">
                    </app-catalogo-select>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer justify-content-end mt-3">
        <button type="button" class="btn btn-default me-3">Cancelar</button>
        <button type="button" class="btn btn-default me-3">Limpiar</button>
        <button type="button" class="btn btn-primary" (click)="modalRef?.hide()">Agregar</button>
    </div>
</ng-template>
