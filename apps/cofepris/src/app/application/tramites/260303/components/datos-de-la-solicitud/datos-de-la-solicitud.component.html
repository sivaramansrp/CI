<div class="container">
    <ng-titulo titulo="Datos del establecimiento"></ng-titulo>
    <div class="d-flex justify-content-end">
        <button class="btn btn-primary" type="button" (click)="seleccionar(template)">Seleccionar establecimiento</button>
    </div>
    <div class="row mb-3">
        <div class="col-md-8">
            <form [formGroup]="denominacionForm">
                <div class="form-group">
                    <label for="denominacionRazon" class="form-label">Denominación o razón social*:</label>
                    <input type="text" id="denominacionRazon" formControlName="denominacionRazon" class="form-control">
                </div>
            </form>
        </div>
    </div>
    <ng-titulo titulo="Domicilio del establecimiento"></ng-titulo>
</div>

<!-- modal -->
<ng-template #template>
    <div class="modal-header">
      <button type="button" class="btn-close close pull-right" aria-label="Close">
        <span aria-hidden="true" class="visually-hidden">&times;</span>
      </button>
    </div>
    <div class="modal-body">
        Por el momento no hay comunicación con el
        Sistema de COFEPRIS, favor de capturar su establecimiento.
    </div>
    <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-primary" (click)="cerrar()">Aceptar</button>
    </div>
  </ng-template>
