<div class="container">
    <ng-titulo titulo="Requisitos obligatorios"></ng-titulo>
    <ng-titulo titulo="Requisitos opcionales"></ng-titulo>
    <ng-alert [CONTENIDO]="TEXTOS.INSTRUCCIONES"></ng-alert>
    <div class="row mb-3">
        <div class="col-md-6">
            <form [formGroup]="tipoDeDocumentoForm">
              <app-catalogo-select 
                [catalogo]="tipoDocumentoCatalogo" 
                [label]="'Tipo de documento'" 
                [required]="true" 
                name="documento"
                formControlName="tipoDocumento"
                (change)="setValoresStore(tipoDeDocumentoForm,'tipoDocumento', 'SetTipoDocumento')">
              </app-catalogo-select>
            </form>
        </div>
        <div class="col-md-6">
            <div class="form-check d-flex justify-content-evenly">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    Tipo de documento
                </label>
            </div>
            <table class="table table-bordered">
                <tbody>
                  @for(datos of documentoDatos; track $index) {
                    <tr>
                      <td class="grey-column">{{datos.id}}</td>
                      <td>
                        <input
                          type="checkbox"
                          id="donacion"
                        />
                      </td>
                      <td>
                        {{datos.name}}
                      </td>
                    </tr>
                  }
                </tbody>
              </table>
              <div class="d-flex justify-content-end mt-5">
                <button type="button" class="btn btn-danger me-2">Elimiar</button>
                <button type="button" class="btn btn-primary">Agregar nuevo</button>
              </div>
        </div>
    </div>
</div>
