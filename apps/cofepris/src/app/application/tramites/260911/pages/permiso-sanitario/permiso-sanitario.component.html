<div class="container">
    <div class="row">
      <div class="col-md-12">
        <h1>Modificación al permiso sanitario de importación de dispositivos médicos que cuenten con registro sanitario/ fuentes de radiación</h1>
      </div>
    </div>

    <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
    <div>
      @switch (indice) {
      @case (1) {
      <app-paso-uno></app-paso-uno>
      }
      @case (2) {
        <app-paso-dos></app-paso-dos>

      }
      @case (3) {
        <app-paso-tres></app-paso-tres>

      }
    }
    </div>
    <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
    <ng-alert [CONTENIDO]="AVISO_DE_PRIVACIDAD"></ng-alert>
</div>
