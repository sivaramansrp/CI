<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a data-toggle="tab" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(1)">Solicitante</a>
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a data-toggle="tab" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(2)">Datos de la solicitud</a>
      </li>
      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a data-toggle="tab" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(3)">Terceros relacionados</a>
      </li>
      <li [ngClass]="indice === 4 ? 'active' : ''">
        <a data-toggle="tab" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(4)">Pago de derechos</a>
      </li>
      <li [ngClass]="indice === 5 ? 'active' : ''">
        <a data-toggle="tab" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(5)">Tramites Asociados</a>
      </li>
    </ul>

    <ng-container>
      @switch (indice) {
      @case (1) {
      <solicitante [tabindex]="1"></solicitante>
      }
      @case (2) {
        @if(esDatosRespuesta){
          <app-datos-solicitud></app-datos-solicitud>
        }
      }
      @case (3) {
        @if(esDatosRespuesta){
          <app-terceros-relacionados-fabricante></app-terceros-relacionados-fabricante>
        }
      }
      @case (4){
        @if(esDatosRespuesta){
          <app-pago-de-derechos [formularioPagoDerechos]="formularioPagoDerechos" [banco]="banco"
          (setValoresStoreEvent)="setValoresStore($event)" [isDisabled]="esFormularioSoloLectura"></app-pago-de-derechos>    
            } 
        }
      
       @case (5){
        @if(esDatosRespuesta){
          <app-tramite-asociados [configuracionTabla]="configuracionTabla"
          [tramiteAsociados]="tramiteAsociados"></app-tramite-asociados>   
            }
        }
      }
    
     

    </ng-container>
  </div>
</div>
