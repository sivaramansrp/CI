<p>Seleccione el tipo de operación que desea realizar*: </p>
<h1> </h1>
<form [formGroup]="preOperativeForm">
<div class="col-md-4">
    <app-input-radio
    [radioOptions]="radioOptions"
    formControlName="ideGenerica1" 
    (change)="setValoresStore(preOperativeForm,'ideGenerica1')"
    [layout]="'horizontal'"
  ></app-input-radio>
</div>

    <div class="row mt-5">
      <div class="col-md-4 form-group">
          <label class="form-label" for="motivoDesistimiento">justificacion*:</label>
          <textarea formControlName="observaciones" id="motivoDesistimiento" name="motivoDesistimiento" rows="4"
              cols="50" [ngClass]="isValid('motivoDesistimiento') ? 'required' : ''"
              (change)="setValoresStore(preOperativeForm,'observaciones')"></textarea>
              <div *ngIf="preOperativeForm?.get('observaciones')?.invalid && preOperativeForm?.get('observaciones')?.touched" class="text-danger">
                  Favor de seleccionar el Motivo observaciones.
              </div>
      </div>
  </div>
    <br>
</form>
<br>
