<ng-titulo titulo="Mercancias*:"></ng-titulo>
<app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion" [datos]="mercanciasDatas"
  [configuracionTabla]="configuracionTabla"></app-tabla-dinamica>
<ng-container>
  <div class="row mt-5">
    <label>Mercancías seleccionadas</label>
  </div>
  <div class="table-container mt-5">
    <div class="col-md-12 mt-5 d-flex justify-content-end">
      <button type="button" class="btn btn-danger ms-3">Eliminar</button>
      <button type="button" class="btn btn-primary ms-3"> Modificar </button>
    </div>
  </div>
</ng-container>
<div formGroupName="Aduana">
  <div class="row">
    <div class="col-md-4">
      <app-catalogo-select formControlName="Aduana" [label]="'Aduana'"></app-catalogo-select>
    </div>
  </div>
</div>
