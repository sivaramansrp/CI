<div class="row">
    <div class="col-md-4">
        <label>
            <input type="checkbox" (change)="toggleReadonly($event)" /> Aviso de funcionamiento:
        </label>
    </div>

    <div class="col-md-4">
        <div class="form-group">
            <label class="form-label" for="noLicenciaSanitaria:">No. de licencia sanitaria:</label>
            <input class="form-control" type="text" id="noLicenciaSanitaria" [readonly]="isReadonly"
                [ngClass]="{'readonly-input': isReadonly}">
        </div>
    </div>
</div>
<div class="row pb-5 mb-5">
    <div class="col-md-4">
        <div class="form-group">
            <label class="form-label" for="régimen">Régimen*:</label>
            <input class="form-control" type="text" id="régimen">
        </div>
    </div>
    <div class="col-md-8">
        <app-catalogo-select [catalogo]="clave" [label]="'Descripcíon del S.C.I.A.N'" [required]="true" name="clave">
        </app-catalogo-select>
    </div>
</div>
