<div class="container mt-4">
    <ng-container>
        <ng-titulo titulo="Clave S.C.I.A.N"> </ng-titulo>
        <div class="row">
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="clave" [label]="'Clave S.C.I.A.N*:'" [required]="true" name="clave">
                </app-catalogo-select>
            </div>
            <div class="col-md-4">
                <app-catalogo-select [catalogo]="clave" [label]="'Descripcíon del S.C.I.A.N'" [required]="true"
                    name="clave">
                </app-catalogo-select>
            </div>
        </div>
    </ng-container>

    <div class="row">
        <div class="col-md-12 d-flex justify-content-end">
            <button type="button" class="btn btn-primary">
                Limpiar
            </button>
            <button type="button" class="btn btn-primary" (click)="cancelar()">
                cancelar
            </button>
            <button type="button" class="btn btn-primary">
                Agregar
            </button>
        </div>
    </div>
</div>
