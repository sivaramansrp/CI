<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Opciones de pre-llenado de Solicitud</h4>
    <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center"
      (click)="handleToggle()">
      <i class="bi" [ngClass]="toggleState ? 'bi-dash-lg' : 'bi-plus-lg'"></i>
    </button>
  </div>

  <div *ngIf="toggleState" class="table-responsive">
    <div *ngIf="toggleState" class="mt-3">
      <app-tabla-dinamica [configuracionTabla]="configuracionTabla" 
      [datos]="solicitudData">
      </app-tabla-dinamica>
    </div>
  </div>



  <ng-titulo titulo="Datos del establecimiento" />


  <div class="d-flex justify-content-end mt-3">
    <button class="btn btn-primary">Seleccionar establecimiento</button>
  </div>

  <div class="row">
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="rfcDelResponsableSanitario">RFC del responsable sanitario:</label>
        <input class="form-control" type="text" id="rfcDelResponsableSanitario">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="denominaciónRazónSocial*:">Denominación o razón social*:</label>
        <input class="form-control" type="text" id="denominaciónRazónSocial">
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="correoElectrónico">Correo electrónico*:<span
            class="bi bi-question-circle-fill fs-4 m-1" title="Title" ata-bs-toggle="tooltip"></span>
        </label>
        <input type="text" class="form-control" id="correoElectrónico">
      </div>
    </div>

  </div>
</div>
