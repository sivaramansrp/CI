<div class="container">
  <div *ngIf="!mostrarFormularioScian && !mostrarFormularioMercancias">
    <div class="container mt-4">
      <div class="panel-group ficha-collapse" id="accordion">
        <div class="panel panel-default">
          <div class="panel-heading" (click)="mostrar_colapsable()">
            <h4 class="panel-title spaced-text fs-3">
              Opciones de pre-llenado de Solicitud
            </h4>
            <button type="button" class="collpase-button collapsed"></button>
          </div>
          @if(colapsable){
          <div class="panel-collapse collapse in" id="panel-01">
            <div class="panel-body">
              <div class="row">
                <ng-alert [CONTENIDO]="DATOS_ALERT.DATOS_SOLICITUD"></ng-alert>
              </div>
              <h5>Solicitud</h5>
              <div class="table-responsive">
                <app-tabla-dinamica [configuracionTabla]="configuracionTabla" [datos]="solicitudData">
                </app-tabla-dinamica>
              </div>
            </div>
          </div>
          }
        </div>
      </div>
      <ng-titulo titulo="Datos del establecimiento" />
      <div class="d-flex justify-content-end mt-3">
        <button class="btn btn-primary">Seleccionar establecimiento</button>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="rfcDelResponsableSanitario">RFC del responsable sanitario:</label>
            <input class="form-control" type="text" id="rfcDelResponsableSanitario">
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="denominacionRazonSocial">Denominación o razón social*:</label>
            <input class="form-control" type="text" id="denominacionRazonSocial">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="correoElectronico">Correo electrónico*:
              <span class="bi bi-question-circle-fill fs-4 m-1" title="Title" data-bs-toggle="tooltip"></span>
            </label>
            <input type="text" class="form-control" id="correoElectronico">
          </div>
        </div>
      </div>

      <ng-titulo titulo="Datos del establecimiento" />

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="códigoPostal">Código postal*:</label>
            <input class="form-control" type="text" id="códigoPostal">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="estado">Estado*:</label>
            <input class="form-control" type="text" id="estado">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="municipioAlcaldía">Municipio o alcaldía*:
            </label>
            <input type="text" class="form-control" id="municipioAlcaldía">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="localidad">Localidad:
            </label>
            <input type="text" class="form-control" id="localidad">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="colonia">Colonia:
            </label>
            <input type="text" class="form-control" id="colonia">
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-group">
            <label class="form-label" for="caller">Caller:<span class="bi bi-question-circle-fill fs-4 m-1"
                title="Title" ata-bs-toggle="tooltip"></span>
            </label>
            <input type="text" class="form-control" id="caller">
          </div>
        </div>
      </div>


      <div class="row mb-5">
        <div class="col-md-2">
          <div class="form-group">
            <label class="form-label" for="lada">Lada</label>
            <input class="form-control" type="text" id="lada">
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-group">
            <label class="form-label" for="teléfono">Teléfono</label>
            <input class="form-control" type="text" id="teléfono">
          </div>
        </div>
      </div>

      <h5 class="fs-4">S.C.I.A.N.*</h5>
      <div class="table-responsive">
        <app-tabla-dinamica [configuracionTabla]="configuracionTablas" [datos]="claveDatas"
          [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX">
        </app-tabla-dinamica>
      </div>

      <div class="row">
        <div class="col-md-12 d-flex justify-content-end">
          <button name="eliminarServicio" class="btn btn-danger">
            Eliminar
          </button>
          <button name="agregarServicio" class="btn btn-primary mx-2" (click)="toggleScianFormulario()">
            Agregar
          </button>
        </div>
      </div>

      <app-formulario-operacion-comercial></app-formulario-operacion-comercial>

      <app-tabla-dinamica [configuracionTabla]="mercanciasTabla" [datos]="mercanicaData"
        [tipoSeleccionTabla]="TablaSeleccion.UNDEFINED">
      </app-tabla-dinamica>

      <!-- <button (click)="openForm()" class="btn btn-secondary">Agregar</button> -->

      <div class="d-flex justify-content-end">
        <button class="btn btn-primary" (click)="openForm()">
            Agregar
        </button>
        <button class="btn btn-default ms-2">Modificar</button>
        <button class="btn btn-default ms-2">Eliminar</button>
    </div>

    </div>
    <ng-titulo titulo="Manifiestos y declaraciones" />
    <div>
      <input type="checkbox"  /> *:
      <ng-alert [CONTENIDO]="MANIFIESTOS_ALERT.DATOS_MANIFIESTOS"></ng-alert>
    </div>
    <app-representante-legal></app-representante-legal>
  </div>
</div>

<div *ngIf="mostrarFormularioMercancias">
  <app-mercancias-table-form (cancel)="closeForm()"></app-mercancias-table-form>
</div>

<div *ngIf="mostrarFormularioScian">
  <app-clave-scian (cancel)="closeScianFormulario()"></app-clave-scian>
</div>
