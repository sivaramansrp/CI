<div class="row mt-5">
  <div class="col-md-12">
    <div class="panel-group ficha-collapse" id="accordion">
      <div class="panel panel-default">
        <div class="panel-heading" (click)="mostrarPaisDeOrigen()" tabindex="0">
          <h4 class="panel-title">
            País de origen
          </h4>
          <button type="button" class="collpase-button" [ngClass]="paisDeOrigenPlegable ? '' : 'collapsed'"></button>
        </div>
        @if(paisDeOrigenPlegable){
        <div class="panel-collapse collapse in" id="panel-01">
          <div class="panel-body">
            <crosslist [fechas]="selectRangoDias" [botones]="paisDeOrigenBotones" [label]="paisDeOrigenLabel">
            </crosslist>
          </div>
        </div>
        }
      </div>
    </div>
  </div>

  <div class="col-md-12">
    <div class="panel-group ficha-collapse" id="accordion">
      <div class="panel panel-default">
        <div class="panel-heading" (click)="mostrarPaisDeProcedencia()" tabindex="0">
          <h4 class="panel-title">
            País de procedencia
          </h4>
          <button type="button" class="collpase-button" [ngClass]="paisDeProcedenciaPlegable ? '' : 'collapsed'"></button>
        </div>
        @if(paisDeProcedenciaPlegable){
        <div class="panel-collapse collapse in" id="panel-01">
          <div class="panel-body">
            <crosslist [fechas]="selectPaisDeProcedencia" [botones]="paisDeProcedenciaBotones" [label]="paisDeProcedenciaLabel">
            </crosslist>
          </div>
        </div>
        }
      </div>
    </div>
  </div>

  <div class="col-md-12">
    <div class="panel-group ficha-collapse" id="accordion">
      <div class="panel panel-default">
        <div class="panel-heading" (click)="mostrarUsoEpecifico()" tabindex="0">
          <h4 class="panel-title">
            Uso específico
          </h4>
          <button type="button" class="collpase-button" [ngClass]="usoEspecificoPlegable ? '' : 'collapsed'"></button>
        </div>
        @if(usoEspecificoPlegable){
        <div class="panel-collapse collapse in" id="panel-01">
          <div class="panel-body">
            <crosslist [fechas]="selectUsoEspecifico" [botones]="usoEspecificoBotones" [label]="usoEspecificoLabel">
            </crosslist>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
