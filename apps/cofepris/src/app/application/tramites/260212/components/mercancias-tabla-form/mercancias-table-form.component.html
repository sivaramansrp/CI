<div class="container">
    <ng-titulo titulo="Datos mercancía" />
    <form [formGroup]="datosMercanciaForm">
        <div class="row">
            <div class="col-md-8">
                <app-catalogo-select [catalogo]="clave" [label]="'Clasificación del producto*:'" [required]="true"
                    name="clave" formControlName="clasificacion">
                </app-catalogo-select>
            </div>
            <div class="col-md-8">
                <app-catalogo-select [catalogo]="clave" [label]="'Especificar clasificación del producto*:'"
                    [required]="true" name="clave" formControlName="especificarClasificacion">
                </app-catalogo-select>
            </div>
            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label" for="específicaDelProducto">Denominación específica del producto*:</label>
                    <input class="form-control" type="text" id="específicaDelProducto"
                        formControlName="especificaDelProducto">
                </div>
            </div>
            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label" for="denominaciónDistintiva">Denominación distintiva*:</label>
                    <input class="form-control" type="text" id="denominaciónDistintiva"
                        formControlName="denominacionDistintiva">
                </div>
            </div>
            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label" for="nombreCientífico">Denominación o nombre científico*:</label>
                    <input class="form-control" type="text" id="nombreCientífico" formControlName="nombreCientifico">
                </div>
            </div>
            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label" for="tipoDeProducto">Tipo de producto*:</label>
                    <input class="form-control" type="text" id="tipoDeProducto" formControlName="tipoDeProducto">
                </div>
            </div>
            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label" for="estadoFísico">Estado físico*:</label>
                    <input class="form-control" type="text" id="estadoFísico" formControlName="estadoFisico">
                </div>
            </div>
            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label" for="fracciónArancelaria">Fracción arancelaria*:</label>
                    <input class="form-control" type="text" id="fracciónArancelaria"
                        formControlName="fraccionArancelaria">
                </div>
            </div>
            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label" for="descripcionFraccion">Descripción de la fracción arancelaria*:</label>
                    <input class="form-control" type="text" id="descripcionFraccion"
                        formControlName="descripcionFraccion">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="cantidadUMT">Cantidad UMT*:</label>
                    <input class="form-control" type="text" id="cantidadUMT" formControlName="cantidadUMT">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="UMT"> UMT*:</label>
                    <input class="form-control" type="text" id="UMT" formControlName="UMT">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="cantidadUMC">Cantidad UMC*:</label>
                    <input class="form-control" type="text" id="cantidadUMC" formControlName="cantidadUMC">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="UMC"> UMC*:</label>
                    <input class="form-control" type="text" id="UMC" formControlName="UMC">
                </div>
            </div>

            <div class="col-md-8">
                <label for="tipoDeEnvase" class="form-label">Presentación farmacéutica o tipo de envase*:</label>
                <textarea id="tipoDeEnvase" class="form-control mb-4" placeholder=""
                    formControlName="tipoDeEnvase"></textarea>
            </div>
        </div>

            <button class="btn btn-default ms-2">Limpiar</button>

</form>
