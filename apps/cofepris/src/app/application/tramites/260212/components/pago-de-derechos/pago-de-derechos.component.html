<div class="container pago-de-derechos-container">
  <hr />
  <ng-titulo titulo="Pago de derechos" />

  <!-- form container -->
  <form [formGroup]="pagoDerechos">
    <div class="row d-flex pago-de-derechos-form-container">
      <div class="col-md-4 mt-5">
        <div class="form-group">
          <label class="form-label" for="claveDeReferncia">Clave de referencia:</label>
          <input class="form-control" type="text" id="claveDeReferncia" formControlName="claveDeReferncia"
            (input)="updateClaveDeReferncia()" />
        </div>
      </div>

      <div class="col-md-4 mt-5">
        <div class="form-group">
          <label class="form-label" for="cadenaDeLaDependencia">Cadena de la dependencia:</label>
          <input class="form-control" type="text" id="cadenaDeLaDependencia" formControlName="cadenaDeLaDependencia"
            (input)="updateCadenaDeLaDependencia()" />
        </div>
      </div>

      <div class="col-md-4 mt-5">
        <div class="form-group">
          <app-catalogo-select [catalogo]="dropdownData" [label]="'BANCO'" [required]="true" name="dropdownData"
            id="banco" formControlName="banco" (change)="getMunicipios()"></app-catalogo-select>
        </div>
      </div>



      <hr />
      <div class="col-md-4 mt-5">
        <div class="form-group">
          <label class="form-label" for="llaveDePago">Llave de pago:</label>
          <input class="form-control" type="text" id="llaveDePago" formControlName="llaveDePago"
            (input)="updateLlaveDePago()" />
        </div>
      </div>

      <div class="col-md-4 mt-5">
        <input-fecha [datos]="fechaInicioInput" [setFecha]="fechaPagoDate" name="fechaDePago" id="fechaDePago" formControlName="fechaDePago"></input-fecha>
      </div>

<!-- 
      <div class="col-md-4 mt-5">
        <div class="form-group">
          <label class="form-label" for="fechaDePago">Fecha de pago:</label>
          <input class="form-control" type="date" id="fechaDePago" formControlName="fechaDePago"
            (input)="updateFechaDePago()" />
        </div>
      </div> -->

      <div class="col-md-4 mt-5">
        <div class="form-group">
          <label class="form-label" for="importeDePago">Importe de pago:</label>
          <input class="form-control" type="text" id="importeDePago" formControlName="importeDePago"
            (input)="updateImporteDePago()" />
        </div>
      </div>
    </div>
  </form>

  <!-- borrar datos button -->
  <div class="col-md-12 text-end mt-5">
    <button class="btn btn-danger">Borrar datos del pago</button>
  </div>
</div>
