<div class="page">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1>Permiso de internación al territorio nacional de células y tejidos incluyendo sangre, sus componentes y derivados,así como otros productos de seres humano</h1>
            </div>
            <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
        </div>
        <div class="row">
            @switch (indice) {
                @case (1) {
                   <app-datos-260402></app-datos-260402> 
                }
                @case (2) {
                    <app-paso-dos></app-paso-dos>
                 }
                 @case (3) {
                      <app-paso-tres></app-paso-tres>
                 }
                }
             <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
        </div>
    </div>
</div>
