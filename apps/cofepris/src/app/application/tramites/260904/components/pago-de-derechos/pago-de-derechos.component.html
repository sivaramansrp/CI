<div class="col-md-12">
    <form [formGroup]="pagoDeDerechosForm">
      <ng-titulo titulo="Pago de derechos" />
      <div class="row mt-2">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label">Clave de referencia:</label>
            <input
              class="form-control"
              placeholder=""
              type="text"
              name="claveDeReferencia"
              formControlName="claveDeReferencia"
              maxlength="50"
              (change)="setValoresStore(pagoDeDerechosForm,'claveDeReferencia')"
            />
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label">Cadena de la dependencia:</label>
            <input
              class="form-control"
              placeholder=""
              type="text"
              name="cadenaPagoDependencia"
              formControlName="cadenaPagoDependencia"
              (change)="setValoresStore(pagoDeDerechosForm,'cadenaPagoDependencia')"
            />
            <div *ngIf="esInvalido('cadenaPagoDependencia')" class="text-danger">
              <small *ngIf="pagoDeDerechosForm.controls['cadenaPagoDependencia'].hasError('maxlength')">Máximo 50 caracteres.</small>
          </div>
          </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
              <label class="form-label">Banco:</label>
               <select name="clave" class="form-control form-select" formControlName="clave" (change)="setValoresStore(pagoDeDerechosForm,'clave')">
                <option value="" selected>Seleccione un valor</option>
                @for (banco of bancoList; track banco.name) {
                  <option value={{banco.name}}>{{banco.name}}</option>
                }
                
               </select>
              <div *ngIf="esInvalido('clave')" class="text-danger">
                <small *ngIf="pagoDeDerechosForm.controls['clave'].hasError('required')">Banco es obligatoria.</small>
            </div>
            </div>
          </div>
      </div>
  
      <div class="row mt-2">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label">Llave de pago:</label>
            <input
              class="form-control"
              placeholder=""
              type="text"
              name="llaveDePago"
              formControlName="llaveDePago"
              maxlength="30"
              (change)="setValoresStore(pagoDeDerechosForm,'llaveDePago')"
              (input)="validarLongitudMaxima('llaveDePago', 30)"
              [ngClass]="{'is-invalid': esInvalido('llaveDePago')}"
            />
            <div *ngIf="esInvalido('llaveDePago')" class="text-danger">
              <small *ngIf="pagoDeDerechosForm.controls['llaveDePago'].hasError('maxlength')">Máximo 30 caracteres.</small>
              <span *ngIf="pagoDeDerechosForm.get('llaveDePago')?.errors?.['pattern']">
                Existen datos incorrectos que no cumplen con el formato esperado.
              </span>
          </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label">Fecha de pago:</label>
            <input
            class="form-control"
            placeholder=""
            type="date"
            name="fecPago"
            formControlName="fecPago"
            (change)="setValoresStore(pagoDeDerechosForm,'fecPago'); validarFechaFutura('fecPago')"
          />
            <div *ngIf="esInvalido('fecPago')" class="text-danger">
              <small *ngIf="pagoDeDerechosForm.controls['fecPago'].hasError('required')">Fecha de pago es obligatoria.</small>
              <small *ngIf="pagoDeDerechosForm.get('fecPago')?.hasError('fechaLim')">La fecha de pago debe ser menor o igual a la fecha actual</small>
          </div>
          </div>
        </div>
        <div class="col-md-4">
            <div class="form-group">
              <label class="form-label">Importe de pago:</label>
              <input
                class="form-control"
                placeholder=""
                type="text"
                name="impPago"
                formControlName="impPago"
                maxlength="30"
                (change)="setValoresStore(pagoDeDerechosForm,'impPago'); validarSinComas('impPago')"
                [ngClass]="{'is-invalid': esInvalido('impPago')}"
              />
              <div *ngIf="esInvalido('impPago')" class="text-danger">
                
                <small *ngIf="pagoDeDerechosForm.get('impPago')?.hasError('noComa')">El campo no debe contener comas.</small>
                 <span *ngIf="pagoDeDerechosForm.get('impPago')?.errors?.['pattern']">
                    Por favor, escribe un número entero válido.
                </span>
            </div>
            </div>
          </div>
      </div>
  
      <div class="d-flex justify-content-end mt-5">
        <button type="button" class="btn btn-primary ms-2 d-flex" [disabled]="esFormularioSoloLectura">Borrar datos del pago</button>
      </div>
    </form>
  </div>
