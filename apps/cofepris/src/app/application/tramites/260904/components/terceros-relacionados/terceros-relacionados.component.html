<div class="page">
    <div class="container">
            <ng-titulo [titulo]="'Terceros relacionados'"></ng-titulo>
    
            <ng-alert [CONTENIDO]="TEXTOS.INSTRUCCIONES_DEL_CAMPO_DE_TABLA"></ng-alert>
            <div class="row">
                <div class="col-md-12">
                     <label for="Fabricante" class="control-label">Fabricante<span class="require">*</span>:</label>
                </div>

                <div class="col-md-12">
                    <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
                        [configuracionTabla]="fabricanteTableColumns"
                        [datos]="fabricantedatosTabla"
                        [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
                        ></app-tabla-dinamica>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 mt-5 d-flex justify-content-end">

                    <button type="button" class="btn btn-primary ms-3" [disabled]="esFormularioSoloLectura">
                        Agregar
                    </button>
                </div>
            </div>


            <div class="row">
                <div class="col-md-12">
                    <label for="Fabricante" class="control-label">Destinatario (destino final)<span class="require">*</span>:</label>
                </div>

                <div class="col-md-12">
                    <app-tabla-dinamica [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
                        [configuracionTabla]="destinatarioTableColumns"
                        [datos]="destinatarioDatosTabla"
                        [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
                        ></app-tabla-dinamica>

                </div>
            </div>

            <div class="row">
                <div class="col-md-12 mt-5 d-flex justify-content-end">

                    <button type="button" class="btn btn-primary ms-3" [disabled]="esFormularioSoloLectura">
                        Agregar
                    </button>
                </div>
            </div>

     <div class="row">
      <div class="col-md-12">
        <label for="Fabricante" class="control-label"
          >Proveedor:</label
        >

      </div>

      <div class="col-md-12" *ngIf="destinatarioDatosTabla">
        <app-tabla-dinamica
          [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
          [configuracionTabla]="proveedorTableColumns"
          [datos]="proveedorDatosTabla"
          [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
        ></app-tabla-dinamica>
      </div>
    </div>

         <div class="row">
      <div class="col-md-12 mt-5 d-flex justify-content-end">
        <button type="button" class="btn btn-primary ms-3" [disabled]="esFormularioSoloLectura">Agregar</button>
      </div>
    </div>

      <div class="row">
      <div class="col-md-12">
        <label for="Fabricante" class="control-label"
          >Facturador:</label
        >
      </div>

      <div class="col-md-12" *ngIf="destinatarioDatosTabla">
        <app-tabla-dinamica
          [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
          [configuracionTabla]="facturadorTableColumns"
          [datos]="facturadorDatosTabla"
          [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
        ></app-tabla-dinamica>
      </div>
      <div class="row">
      <div class="col-md-12 mt-5 d-flex justify-content-end">
        <button type="button" class="btn btn-primary ms-3" [disabled]="esFormularioSoloLectura">Agregar</button>
      </div>
    </div>

    </div>
        </div>
   
</div>
