<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="subTabIndex === 1 ? 'active' : ''">
        <a (click)="seleccionaTab(1)" tabindex="0">Solicitante</a>
      </li>
      <li [ngClass]="subTabIndex === 2 ? 'active' : ''">
        <a (click)="seleccionaTab(2)" tabindex="0">Datos de la solicitud</a>
      </li>
      <li [ngClass]="subTabIndex === 3 ? 'active' : ''">
        <a (click)="seleccionaTab(3)" tabindex="0">Terceros relacionados</a>
      </li>
      <li [ngClass]="subTabIndex === 4 ? 'active' : ''">
        <a (click)="seleccionaTab(4)" tabindex="0">Pago de derechos</a>
      </li>
      <li [ngClass]="subTabIndex === 5 ? 'active' : ''">
        <a (click)="seleccionaTab(5)" tabindex="0">Trámites Asociados</a>
      </li>
    </ul>

    <ng-container>
      <solicitante [tabindex]="1" [hidden]="subTabIndex !== 1"></solicitante>

      <ng-container *ngIf="esDatosRespuesta">
        <app-datos-de-la-solicitud-260904
          #datosDeLaSolicitudComponent
          (tipoTramiteChange)="selectedTipoTramite = $event"
          [hidden]="subTabIndex !== 2"
        ></app-datos-de-la-solicitud-260904>

        <app-domicilio-del-establecimiento-260904
          #domicilioDelEstablecimientoComponent
          [tipoTramite]="selectedTipoTramite"
          [hidden]="subTabIndex !== 2"
        ></app-domicilio-del-establecimiento-260904>

        <app-terceros-relacionados-vista
          #tercerosRelacionadosVistaComponent
          [tipoTramite]="selectedTipoTramite"
          [hidden]="subTabIndex !== 3"
        ></app-terceros-relacionados-vista>

        <app-pago-de-derechos
          #pagoDeDerechosComponent
          [tipoTramite]="selectedTipoTramite"
          [hidden]="subTabIndex !== 4"
        ></app-pago-de-derechos>

        <app-tramites-asociado
          #tramitesAsociadoComponent
          [tipoTramite]="selectedTipoTramite"
          [hidden]="subTabIndex !== 5"
        ></app-tramites-asociado>
      </ng-container>
    </ng-container>
  </div>
</div>
