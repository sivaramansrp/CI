<div class="container">
  <div class="row">
    <div class="col-md-12">
      <h1>
        Modificación del permiso sanitario de importación de insumos para la
        salud de medicamentos con registro sanitario
      </h1>
    </div>
  </div>

  <div *ngIf="message" class="alert alert-danger error-message text-center" style="margin-bottom: 16px;">
    {{ message }}
  </div>

  <app-wizard [listaPasos]="pantallasPasos"></app-wizard>

  <div>
    <app-paso-uno 
      (tabChanged)="onPasoUnoTabChanged($event)" 
      [subTabIndex]="subTabIndex">
    </app-paso-uno>
  </div>

  <btn-continuar
    [datos]="datosPasos"
    [ocultabotonAnterior]="ocultarBtnAnterior"
    *ngIf="shouldShowContinuarButton"
    (continuarEvento)="onContinuar($event)">
  </btn-continuar>

  <ng-alert [CONTENIDO]="AVISO_DE_PRIVACIDAD"></ng-alert>

  <div class="modal fade" [class.show]="showPaymentModal" [style.display]="showPaymentModal ? 'block' : 'none'" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
       
        </div>
        <div class="modal-body">
          <p>¿Está seguro que su solicitud no requiere los datos del Pago de derechos?</p>
        </div>
        <div class="modal-footer d-flex">
          <button type="button" class="btn btn-secondary" (click)="onPaymentModalNo()">No</button>
          <button type="button" class="btn btn-primary" (click)="onPaymentModalYes()">Sí</button>
        </div>
      </div>
    </div>
  </div>
</div>
