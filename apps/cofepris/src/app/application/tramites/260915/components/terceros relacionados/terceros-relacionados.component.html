<div class="container">
  <div class="row mt-5">
      <div class="col-md-12">
        <ng-titulo titulo="Terceros relacionados" /> 
        <ng-alert [CONTENIDO]="TEXTOS.TEXTOS_TERCEROS"></ng-alert>
        <div class="col-md-12 mt-5">
          <label class="form-label" for="">Fabricante:</label>
          <app-tabla-dinamica
            [tipoSeleccionTabla]="destinatarioSeleccionTabla"
            [configuracionTabla]="destinatarioConfiguracionTabla"
            [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
            [datos]="fabricanteDatos"
            
          >
          </app-tabla-dinamica>
          <div class="col-md-12">
            <app-table-pagination [showCurrentPage]="true"></app-table-pagination>
          </div>

          
        </div>
        <div class="col-md-12 d-flex justify-content-end">
          <div class="btn-group">
            <button
            type="button"
            class="btn btn-primary ms-3"
            [disabled]="esFormularioSoloLectura"
          >
            Agregar
          </button>
          </div>
        </div>
        <div class="col-md-12 mt-5">
          <label class="form-label" for="">Destinatario(destino final)*:</label>
          <app-tabla-dinamica
            [tipoSeleccionTabla]="destinatarioSeleccionTabla"
            [configuracionTabla]="destinatarioConfiguracionTabla"
            [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
            [datos]="destinatarioDatos"
          >
          </app-tabla-dinamica>
            <div class="col-md-12">
            <app-table-pagination [showCurrentPage]="true"></app-table-pagination>
          </div>
        </div>
        <div class="col-md-12 d-flex justify-content-end">
          <div class="btn-group">
            <button
            type="button"
            class="btn btn-primary ms-3"
            [disabled]="esFormularioSoloLectura"
          >
            Agregar
          </button>
          </div>
        </div>
        <div class="col-md-12">
          <label class="form-label" for="">Proveedor:</label>
          <app-tabla-dinamica
            [tipoSeleccionTabla]="destinatarioSeleccionTabla"
            [configuracionTabla]="destinatarioConfiguracionTabla"
             [datos]="proveedorDatos"
             (listaDeFilaSeleccionada)="onSelectedRowsChange($event)"
             [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
             >
          </app-tabla-dinamica>
            <div class="col-md-12">
            <app-table-pagination [showCurrentPage]="true"></app-table-pagination>
          </div>
        </div>
        <div class="col-md-12 d-flex justify-content-end">
          <div class="btn-group">
           <div>
            <button
            *ngIf="selectedRows.size > 0"
            class="btn btn-default"
              class="btn btn-default 3"
              type="button"
              data-bs-toggle="modal"
             (click)="onDeleted()"
             [disabled]="esFormularioSoloLectura"
            >
              Eliminar
            </button>
            <button
            *ngIf="selectedRows.size === 1"
              type="button"
              class="btn btn-default btn-space ms-3"
              (click)="openModificarMercancias()" 
              [disabled]="esFormularioSoloLectura"   
            >
              Modificar
            </button>
            </div>
            <button
              type="button"
              class="btn btn-primary ms-3"
              (click)="agregarMercancias()"
              [disabled]="esFormularioSoloLectura"
            >
              Agregar
            </button>
          </div>  
      </div>
        <div class="col-md-12 mt-5">
          <label class="form-label" for="">Facturador:</label>
          <app-tabla-dinamica
            [tipoSeleccionTabla]="destinatarioSeleccionTabla"
            [configuracionTabla]="destinatarioConfiguracionTabla"
            [disableSeleccionTablaCheckBox]="esFormularioSoloLectura"
            [datos]="facturadorDatos"
          >
          </app-tabla-dinamica>
            <div class="col-md-12">
            <app-table-pagination [showCurrentPage]="true"></app-table-pagination>
          </div>
        </div>
        <div class="col-md-12 d-flex justify-content-end">
          <div class="btn-group">
            <button
            type="button"
            class="btn btn-primary ms-3"
            [disabled]="esFormularioSoloLectura"
          >
            Agregar
          </button>
          </div>
        </div>
      </div>
  </div>
  </div>
  @if (nuevaNotificacion) {
    <section >
    <lib-notificaciones 
    [notificacionInput]="nuevaNotificacion" 
    (confirmacionModal)="eliminarPedimento($event)">
    </lib-notificaciones>
    </section>
    }
  

    <div class="modal fade custom-backdrop"
    id="modalAgregarMercancias"
    tabindex="-1"
    aria-labelledby="modalAgregarMercanciasLabel"
    aria-hidden="true"
    data-bs-focus="false"
    data-backdrop="false" 
    #modalAgregarMercancias
    >
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title mt-0">Agregar proveedor</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form [formGroup]="destinatarioForm">
            <ng-container formGroupName="agregarDestinatario">
              <h3>Datos generales</h3>
              <div class="row mb-3">
                <div class="col-md-12">
                  <label class="form-label" for="tipoPersona">Tipo persona*:</label>
                </div>
                <app-input-radio 
                [radioOptions]="tipoPersonaRadioOptions" 
                [selectedValue]="agregarDestinatario.get('tipoPersona')?.value" 
                (valueChange)="setTipoPersona($event)" 
                formControlName="tipoPersona" 
                (change)="setValoresStore(agregarDestinatario,'tipoPersona')">
              </app-input-radio>
              </div>
            </ng-container>
            
            <ng-titulo titulo="Datos personales" />
            <ng-container formGroupName="datosPersonales">
              @if (selectedTipoPersona === 'fisica') {
              <div class="row">
                <div class="col-md-4 mb-3">
                  <label class="form-label" for="nombre">Nombre(s)*:</label>
                  <input class="form-control" id="nombre" type="text" formControlName="nombre"
                  (change)="setValoresStore(agregarDestinatario,'nombre')" />
                </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label" for="primerApellido">Primer apellido*:</label>
                  <input class="form-control" id="primerApellido" type="text" formControlName="primerApellido"
                  (change)="setValoresStore(agregarDestinatario,'primerApellido')" />
                </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label" for="segundoApellido">Segundo apellido:</label>
                  <input class="form-control" id="segundoApellido" type="text" formControlName="segundoApellido"
                  (change)="setValoresStore(agregarDestinatario,'segundoApellido')" />
                </div>
              </div>
              } @if (selectedTipoPersona === 'moral') {
              <div class="row">
                <div class="col-md-8 mb-3">
                  <label class="form-label" for="nombre">Denominación/razón social*:</label>
                  <input class="form-control" id="nombre" type="text" formControlName="nombre"
                  (change)="setValoresStore(agregarDestinatario,'nombre')" />
                </div>
              </div>
              }
              
              <ng-titulo titulo="Domicilio" />    
              <div class="row">
                <div class="col-md-4 mb-3">
                  <app-catalogo-select 
                  id="paisData"
                  formControlName="pais"
                  [catalogo]="paisData.catalogos" 
                  [label]="'País'"
                  [required]="true"
                  (change)="setValoresStore(agregarDestinatario,'pais')"
                  [isDisabled]="esFormularioSoloLectura"
                  ></app-catalogo-select>
                </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label" for="estado">Estado*:</label>
                  <input class="form-control" id="estado" type="text" formControlName="estado"
                  (change)="setValoresStore(agregarDestinatario,'estado')" />
                </div>
                <div class="col-md-4 mb-3">
                  <label class="form-label" for="codigopostal">Código postal o equivalente:</label>
                  <input class="form-control" id="codigopostal" type="text" formControlName="codigopostal"
                  (change)="setValoresStore(agregarDestinatario,'codigopostal')" />
                </div>
              </div>
              <div class="row">
                  <div class="col-md-8 mb-3">
                      <label class="form-label" for="calle">Calle*:</label>
                      <input class="form-control" id="calle" type="text" formControlName="calle"
                      (change)="setValoresStore(agregarDestinatario,'calle')" />
                  </div>
                  <div class="col-md-4 mb-3">
                      <label class="form-label" for="numeroexterior">Número exterior*:</label>
                      <input class="form-control" id="numeroexterior" type="text" formControlName="numeroExterior"
                      (change)="setValoresStore(agregarDestinatario,'numeroExterior')" />
                  </div>
              </div>    
              <div class="row">
                  <div class="col-md-4 mb-3">
                      <label class="form-label" for="numerointerior">Número interior*:</label>
                      <input class="form-control" id="numerointerior" type="text" formControlName="numeroInterior"
                      (change)="setValoresStore(agregarDestinatario,'numeroInterior')" />
                  </div>
                <div class="col-md-2 mb-3">
                  <label class="form-label" for="lada">Lada:</label>
                  <input class="form-control" id="lada" type="number" formControlName="lada"
                  (change)="setValoresStore(agregarDestinatario,'lada')" />
                </div>
                <div class="col-md-3 mb-3">
                  <label class="form-label" for="telefono">Teléfono:</label>
                  <input class="form-control" id="telefono" type="number" formControlName="telefono"
                  (change)="setValoresStore(agregarDestinatario,'telefono')" />
                </div>
                <div class="col-md-3 mb-3">
                  <label class="form-label" for="correoElectronico">Correo electrónico:</label>
                  <input class="form-control" id="correoElectronico" type="email" formControlName="correoElectronico"
                  (change)="setValoresStore(agregarDestinatario,'correoElectronico')" />
                </div>
              </div>
            </ng-container>
            </form>
          </div>
          <div class="modal-footer d-flex justify-content-end mb-5">
            <div class="btn-group">
              <button class="btn btn-danger" type="button" (click)="cancelarFormulario()" [disabled]="esFormularioSoloLectura">Cancelar</button>
              <button class="btn btn-default" type="button" (click)="limpiarFormulario()" [disabled]="esFormularioSoloLectura">Limpiar</button>
              <button class="btn btn-primary me-5" type="button" (click)="onGuardar()" [disabled]="esFormularioSoloLectura">Guardar</button>
            </div>
          </div>
      </div>
    </div>
</div>
