<div class="container">
  <ng-titulo titulo="Terceros relacionados"></ng-titulo>

  <div class="row mt-5">
    <ng-alert
      [CONTENIDO]="MENSAJEDEALERTA.ADJUNTAR"
      [CUSTOMECLASS]="infoAlert"
    ></ng-alert>
  </div>
  <div class="row mt-5">
    <h6>Fabricante*:</h6>
  </div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFacturador"
      [datos]="(fabricanteTablaDatos$ | async) || []"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
          disabled="formularioDeshabilitado"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
          disabled="formularioDeshabilitado"
        >
          Eliminar
        </button>

        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="navigate(tipoTablaDatos.FABRICANTE)"
           disabled="formularioDeshabilitado"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-5"><h6>Facturador*:</h6></div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFacturador"
      [datos]="(facturadorTablaDatos$ | async) || []"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
          disabled="formularioDeshabilitado"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
          disabled="formularioDeshabilitado"
        >
          Eliminar
        </button>

        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="navigate(tipoTablaDatos.FACTURADOR)"
           disabled="formularioDeshabilitado"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-5"><h6>Proveedor/ distribudor:</h6></div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFacturador"
      [datos]="(proveedorTablaDatos$ | async) || []"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
      
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
          disabled="formularioDeshabilitado"
        >
          Eliminar
        </button>

        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="navigate(tipoTablaDatos.PROVEEDOR)"
           disabled="formularioDeshabilitado"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-5"><h6>Certificado analítico :</h6></div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFacturador"
      [datos]="(certificadoTablaDatos$ | async) || []"
      [tipoSeleccionTabla]="tipoSeleccionTabla"

  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
          disabled="formularioDeshabilitado"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
          disabled="formularioDeshabilitado"
        >
          Eliminar
        </button>

        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="navigate(tipoTablaDatos.CERTIFICADO)"
           disabled="formularioDeshabilitado"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-5"><h6>Otros :</h6></div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFacturador"
      [datos]="(otrasTablaDatos$ | async) || []"
      [tipoSeleccionTabla]="tipoSeleccionTabla"

  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
          disabled="formularioDeshabilitado"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
          disabled="formularioDeshabilitado"
        >
          Eliminar
        </button>

        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          (click)="navigateOtros()"
           disabled="formularioDeshabilitado"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-5"></div>
</div>
