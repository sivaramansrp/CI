<div class="page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <h2>
          Permiso de importación de sustancias sujetos a control por SEMARNAT
        </h2>
      </div>
      @if (esFormaValido) {
        <div class="col-md-12">
          <ng-alert [CONTENIDO]="formErrorAlert" [CUSTOMECLASS]="'alert-danger'"></ng-alert>
        </div>
      }
    
      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno></app-paso-uno>
      }@case (2) {
    <app-paso-carga-documento 
    [idSolicitud]="solicitudState.idSolicitud"
    [idTipoTRamite]="idTipoTRamite"
    [cargaArchivosEvento]="cargarArchivosEvento"
    (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
    (reenviarCargaRealizada)="cargaRealizada($event)"
    (cargaEnProgreso)="onCargaEnProgreso($event)"
    (enBlancoObligatoria)="onBlancoObligatoria($event)"
    ></app-paso-carga-documento>
    } @case (3) {
     <paso-firma [idSolicitud]="solicitudState.idSolicitud" [procedure]="260515" [procedureUrl]="'sustancias-permitidas/plaguicidas'"></paso-firma>
    } }

      <btn-continuar
        [datos]="datosPasos"
        (continuarEvento)="getValorIndice($event)"
        [dePadre]="true"
      ></btn-continuar>
      <app-aviso-de-privacidad *ngIf="indice === 1"></app-aviso-de-privacidad>
    </div>
  </div>
</div>
