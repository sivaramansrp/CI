<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
          <h2>Desistimiento</h2>
        </div>
        <app-wizard [listaPasos]="pantallasPasos"></app-wizard>
      </div>
      <div class="row">
        @switch (indice) { 
        @case (1) {
          <paso-uno (pestanaCambiado)="pestanaCambiado($event)"></paso-uno>
        } @case (2) {
          <app-pasoduos></app-pasoduos>
        } @case (3) {
          <app-paso-tres></app-paso-tres>
        }
       }
      </div>
      <btn-continuar
      [datos]="datosPasos"
      (continuarEvento)="getValorIndice($event)"
    >
    </btn-continuar>

    @if (indiceDePestanaSeleccionada===2) {
      <div class="mt-5">
        <ng-alert [CONTENIDO]="avisoPrivacidadAlert"></ng-alert>
      </div>
    }
</div>
