<form [formGroup]="datosMercanciaForm">
  <div class="row mt-5">
    <div class="col-md-12">
      <ng-titulo titulo="Datos mercancía" />
    </div>
    <div class="col-md-8 mt-3">
      <app-catalogo-select [id]="'productos'" [catalogo]="productosCatalogo.catalogos"
        [label]="productosCatalogo.labelNombre" [placeholder]="productosCatalogo.primerOpcion"
        [required]="productosCatalogo.required" (selectionChange)="seleccionaProductos($event)"
        formControlName="clasificaionProductos">
      </app-catalogo-select>
    </div>
    <div class="col-md-8 mt-3">
      <app-catalogo-select [id]="'productos'" [catalogo]="especificarCatalogo.catalogos"
        [label]="especificarCatalogo.labelNombre" [placeholder]="especificarCatalogo.primerOpcion"
        [required]="especificarCatalogo.required" formControlName="especificarProducto"
        (selectionChange)="seleccionaEspecificar($event)">
      </app-catalogo-select>
    </div>
    <div class="col-md-8 mt-3">
      <label class="form-label" for="denominacionProducto">Denominación especifica del producto*:</label>
      <input class="form-control" id="denominacionProducto" placeholder="" type="text"
        formControlName="nombreProductoEspecifico" (change)="setNombreProductoEspecifico($event)" />
    </div>
    <div class="col-md-8 mt-3">
      <label class="form-label" for="distintiva">Denominación distintiva*:</label>
      <input class="form-control" id="distintiva" placeholder="" type="text" formControlName="distintiva"
        (change)="setDistintiva($event)" />
    </div>
    <div class="col-md-8 mt-3">
      <label class="form-label" for="cientifico">Denominación o nombre científico*: <span tooltip="Denominación común internacional o genérica"><i class="bi bi-question-circle-fill"></i></span></label>
      <input class="form-control" id="cientifico" placeholder="" type="text" formControlName="cientifico"
        (change)="setCientifico($event)" />
    </div>
    <div class="col-md-8 mt-3">
      <app-catalogo-select [id]="'productos'" [catalogo]="tipoProductoCatalogo.catalogos"
        [label]="tipoProductoCatalogo.labelNombre" [placeholder]="tipoProductoCatalogo.primerOpcion"
        [required]="tipoProductoCatalogo.required" formControlName="tipoProducto"
        (selectionChange)="seleccionaTipoProducto($event)">
      </app-catalogo-select>
    </div>

    <div class="col-md-8 mt-3">
      <app-catalogo-select [id]="'farmaceutica'" [catalogo]="farmaceuticaCatalogo.catalogos"
        [label]="farmaceuticaCatalogo.labelNombre" [placeholder]="farmaceuticaCatalogo.primerOpcion"
        [required]="farmaceuticaCatalogo.required" formControlName="farmaceutica"
        (selectionChange)="seleccionaFarmaceutica($event)">
      </app-catalogo-select>
    </div>
    <div class="col-md-8 mt-3">
      <app-catalogo-select [id]="'fisico'" [catalogo]="fisicoCatalogo.catalogos" [label]="fisicoCatalogo.labelNombre"
        [placeholder]="fisicoCatalogo.primerOpcion" [required]="fisicoCatalogo.required" formControlName="fisico"
        (selectionChange)="seleccionaFisico($event)">
      </app-catalogo-select>
    </div>
    <div class="col-md-8 mt-3">
      <label class="form-label" for="fraccionArancelaria">Fracción arancelaria*: <span tooltip="Descripción numérica o desglose de un código de clasificación que otorga el Sistema Armonizado"><i class="bi bi-question-circle-fill"></i></span>
      </label>
      <input class="form-control" id="fraccionArancelaria" placeholder="" type="text"
        formControlName="fraccionArancelaria" (change)="setFraccionArancelaria($event)" />
    </div>
    <div class="col-md-8 mt-3">
      <label class="form-label" for="descripcionFraccionArancelaria">Descripción de la fracción arancelaria*:</label>
      <input class="form-control" id="descripcionFraccionArancelaria" placeholder="" type="text"
        formControlName="descripcionFraccionArancelaria" />
    </div>
    <div class="col-md-4 mt-3"></div>
    <div class="col-md-4 mt-3">
      <label class="form-label" for="cantidadUMT">Cantidad UMT*:</label>
      <input class="form-control" id="cantidadUMT" placeholder="" type="number" formControlName="cantidadUMT"
        (change)="setCantidadUMT($event)" />
    </div>
    <div class="col-md-4 mt-3">
      <label class="form-label" for="umt">UMT*: <span tooltip="Unidad de medida de la tarifa"><i class="bi bi-question-circle-fill"></i></span>
      </label>
      <input class="form-control" id="umt" placeholder="" type="text" formControlName="umt" />
    </div>
    <div class="col-md-4 mt-3"></div>
    <div class="col-md-4 mt-3">
      <label class="form-label" for="cantidadUMC">Cantidad UMC*:</label>
      <input class="form-control" id="cantidadUMC" placeholder="" type="number" formControlName="cantidadUMC"
        (change)="setCantidadUMC($event)" />
    </div>
    <div class="col-md-4 mt-3">
      <app-catalogo-select [id]="'umc'" [catalogo]="umcCatalogo.catalogos" [label]="umcCatalogo.labelNombre"
        [placeholder]="umcCatalogo.primerOpcion" [required]="umcCatalogo.required" formControlName="umc"
        [tooltipQuestionCircle]="true"
        tooltipQuestionCircleText="Unidad de medida de comercialización"
        (selectionChange)="setUMC($event)">
      </app-catalogo-select>
    </div>
    <div class="col-md-4 mt-3"></div>
    <div class="col-md-8 mt-3">
      <div class="form-group">
        <label class="form-label" for="presentacionFarmaceutica">Presentación Farmacéutica o tipo de envase*:</label>
        <textarea class="form-control cstm-ht" id="presentacionFarmaceutica" formControlName="presentacionFarmaceutica"
          (change)="setValoresStore(datosMercanciaForm,'presentacionFarmaceutica', 'setPresentacionFarmaceutica')"
          rows="7" cols="70"></textarea>
      </div>
    </div>
    <div class="col-md-4 mt-3"></div>
    <div class="col-md-4 mt-3">
      <label class="form-label" for="registroSanitario">N&uacute;mero de registro sanitario*:</label>
      <input class="form-control" id="registroSanitario" placeholder="" type="number" formControlName="registroSanitario" />
    </div>
    <div class="col-md-4 mt-3">
      <input-fecha class="width" [datos]="fechaCaducidad" [setFecha]="datosMercanciaForm.get('fechaCaducidad')?.value"
        (valorCambiado)="seleccionarFechaCaducidad($event)"></input-fecha>
    </div>

    <div class="col-md-12 mt-4">
      <div class="panel-group ficha-collapse" id="accordion">
        <div class="panel panel-default">
          <div class="panel-heading" (click)="paisOrigenColapsable()" tabindex="0">
            <h4 class="panel-title">País de origen</h4>
            <button type="button" class="collpase-button" [class.collapsed]="!paisOrigen"></button>
          </div>
          <div class="panel-collapse" [ngClass]="{'collapse': !paisOrigen, 'in': paisOrigen}" id="panel-01">
            <div class="panel-body">
              <crosslist [label]="paisOrigenCrossList.label" [fechas]="paisOrigenCrossList.fechas" [botones]="paisDeOrigenBotons"></crosslist>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-12 mt-4">
      <div class="panel-group ficha-collapse" id="accordion">
        <div class="panel panel-default">
          <div class="panel-heading" (click)="paisProcedencis_colapsable()" tabindex="0">
            <h4 class="panel-title">País de procedencia</h4>
            <button type="button" class="collpase-button" [class.collapsed]="!paisProcedencisColapsable"></button>
          </div>
          <div class="panel-collapse" [ngClass]="{'collapse': !paisProcedencisColapsable, 'in': paisProcedencisColapsable}" id="panel-01">
            <div class="panel-body">
              <crosslist [label]="paisProcedencisCrossList.label" [fechas]="paisProcedencisCrossList.fechas" [botones]="paisDeProcedenciaBotons">
              </crosslist>
            </div>
          </div>
        </div>
      </div>
    </div>


    <div class="col-md-12 mt-4">
      <div class="panel-group ficha-collapse" id="accordion">
        <div class="panel panel-default">
          <div class="panel-heading" (click)="usoEspecificoColapsable()" tabindex="0">
            <h4 class="panel-title">Uso específico</h4>
            <button type="button" class="collpase-button" [class.collapsed]="!usoEspecifico"></button>
          </div>
          <div class="panel-collapse" [ngClass]="{'collapse': !usoEspecifico, 'in': usoEspecifico}" id="panel-01">
            <div class="panel-body">
              <crosslist [fechas]="usoEspecificoCrossList.fechas" [label]="usoEspecificoCrossList.label" [botones]="usoEspecificoBotons">
              </crosslist>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-12 d-flex justify-content-end align-items-end">
      <div class="btn-group">
        <button type="button" class="btn btn-default btn-space ms-3" data-bs-dismiss="modal" >
          Cancelar
        </button>
        <button type="button" class="btn btn-primary ms-3" data-bs-dismiss="modal" (click)="modificarMercanias()">
          Modificar
        </button>
      </div>
    </div>
  </div>
</form>
