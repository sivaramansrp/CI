<div class="row mt-5">
  <div class="col-md-12">
    <ng-titulo titulo="Terceros relacionados" />

    <ng-alert [CONTENIDO]="TEXTOS.TEXTOS_TERCEROS"></ng-alert>
  </div>

  <div class="col-md-12">
    <label class="form-label" for="">Fabricante:</label>
    <app-tabla-dinamica [tipoSeleccionTabla]="fabricanteSeleccionTabla"
      [configuracionTabla]="fabricanteConfiguracionTabla" [datos]="fabricanteDatos"
      (listaDeFilaSeleccionada)="getFabricanteDatos($event)" [disableSeleccionTablaCheckBox]="esFormularioSoloLectura">
    </app-tabla-dinamica>
  </div>

  <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
    <div class="btn-group">
      @if (selectedFabricante.length > 0) {
      <button class="btn btn-default ms-3" type="button" name="eliminar" id="eliminarFabricante" data-bs-toggle="modal"
        data-bs-target="#modal-confirmar" (click)="confirmarEliminar('fabricante')" [disabled]="esFormularioSoloLectura">
        Eliminar
      </button>
      <button type="button" class="btn btn-default btn-space ms-3" [disabled]="esFormularioSoloLectura">
        Modificar
      </button>
      }
      <button type="button" class="btn btn-primary ms-3" [disabled]="esFormularioSoloLectura">
        Agregar
      </button>
    </div>
  </div>

  <div class="col-md-12">
    <label class="form-label" for="">Destinatario (destino final)*:</label>
    <app-tabla-dinamica [tipoSeleccionTabla]="destinatarioSeleccionTabla"
      [configuracionTabla]="destinatarioConfiguracionTabla" [datos]="destinatarioDatos"
      (listaDeFilaSeleccionada)="getDestinatarioDatos($event)" [disableSeleccionTablaCheckBox]="esFormularioSoloLectura">
    </app-tabla-dinamica>
  </div>

  <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
    <div class="btn-group">
      @if (selectedDestinatario.length > 0) {
      <button class="btn btn-default ms-3" type="button" name="eliminar" id="eliminarDestinatario" data-bs-toggle="modal"
        data-bs-target="#modal-confirmar" (click)="confirmarEliminar('destinatario')" [disabled]="esFormularioSoloLectura">
        Eliminar
      </button>
      <button type="button" class="btn btn-default btn-space ms-3" [disabled]="esFormularioSoloLectura">
        Modificar
      </button>
      }
      <button type="button" class="btn btn-primary ms-3" [disabled]="esFormularioSoloLectura">
        Agregar
      </button>
    </div>
  </div>

  <div class="col-md-12">
    <label class="form-label" for="">Proveedor:</label>
    <app-tabla-dinamica [tipoSeleccionTabla]="proveedorSeleccionTabla"
      [configuracionTabla]="proveedorConfiguracionTabla" [datos]="proveedorDatos"
      (listaDeFilaSeleccionada)="getProveedorDatos($event)" [disableSeleccionTablaCheckBox]="esFormularioSoloLectura">
    </app-tabla-dinamica>
  </div>

  <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
    <div class="btn-group">
      @if (selectedProveedor.length > 0) {
      <button class="btn btn-default ms-3" type="button" name="eliminar" id="eliminarProveedor" data-bs-toggle="modal"
        data-bs-target="#modal-confirmar" (click)="confirmarEliminar('proveedor')" [disabled]="esFormularioSoloLectura">
        Eliminar
      </button>
      <button type="button" class="btn btn-default btn-space ms-3" [disabled]="esFormularioSoloLectura">
        Modificar
      </button>
      }
      <button type="button" class="btn btn-primary ms-3" [disabled]="esFormularioSoloLectura">
        Agregar
      </button>
    </div>
  </div>

  <div class="col-md-12">
    <label class="form-label" for="">Facturador:</label>
    <app-tabla-dinamica [tipoSeleccionTabla]="facturadorSeleccionTabla"
      [configuracionTabla]="facturadorConfiguracionTabla" [datos]="facturadorDatos"
      (listaDeFilaSeleccionada)="getFacturadorDatos($event)" [disableSeleccionTablaCheckBox]="esFormularioSoloLectura">
    </app-tabla-dinamica>
  </div>

  <div class="col-md-12 mt-5 d-flex justify-content-end align-items-end">
    <div class="btn-group">
      @if (selectedFacturador.length > 0) {
      <button class="btn btn-default ms-3" type="button" name="eliminar" id="eliminarFacturador" data-bs-toggle="modal"
        data-bs-target="#modal-confirmar" (click)="confirmarEliminar('facturador')" [disabled]="esFormularioSoloLectura">
        Eliminar
      </button>
      <button type="button" class="btn btn-default btn-space ms-3" [disabled]="esFormularioSoloLectura">
        Modificar
      </button>
      }
      <button type="button" class="btn btn-primary ms-3" [disabled]="esFormularioSoloLectura">
        Agregar
      </button>
    </div>
  </div>


</div>

@if (nuevaNotificacion) {
  <section>
      <lib-notificaciones 
          [notificacionInput]="nuevaNotificacion" 
          (confirmacionModal)="seleccionaTipo(seleccionadoTipo);">
      </lib-notificaciones>
  </section>
}
<div class="modal fade" id="modal-agregar-destinatario" tabindex="-1" aria-labelledby="modal-agregar-destinatarioLabel"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <app-modificar-destinatario></app-modificar-destinatario>
    </div>
  </div>
</div>
