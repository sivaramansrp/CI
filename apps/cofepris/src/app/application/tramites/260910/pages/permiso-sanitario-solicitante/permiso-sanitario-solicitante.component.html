<div class="page">
  <div class="container">
    <div class="row">
      <div class="col-md-9">
        <h2>Modificación al permiso sanitario de importación de medicamentos destinados a pruebas de laboratorio</h2>
      </div>

      @if(!esValido) {
      <ng-alert [CONTENIDO]="ALERTA" [CUSTOMECLASS]="infoError"></ng-alert>
      }
      
      <app-wizard [listaPasos]="pasos"></app-wizard>

    </div>

    <div class="row">
      @switch (indice) {
      @case (1) {
      <app-paso-uno></app-paso-uno>
      }
      @case (2) {
      <app-paso-dos></app-paso-dos>
      }
      @case (3) {
      <app-paso-tres></app-paso-tres>
      }
      }

      <btn-continuar [datos]="datosPasos" (continuarEvento)="getValorIndice($event)"></btn-continuar>
      @if (indice === 1) {

      <ng-alert [CONTENIDO]="TEXTOS.Aviso" [CUSTOMECLASS]="infoAlert"></ng-alert>
      }

    </div>
  </div>
</div>
