<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(1)" (keydown.enter)="seleccionaTab(1)" (keydown.space)="seleccionaTab(1)" role="button" tabindex="0">Solicitante</a>
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(2)" (keydown.enter)="seleccionaTab(2)" (keydown.space)="seleccionaTab(2)" role="button" tabindex="2">Datos de la solicitud</a>
      </li>
      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(3)" (keydown.enter)="seleccionaTab(3)" (keydown.space)="seleccionaTab(3)" role="button" tabindex="3">Terceros relacionados</a>
      </li>
      <li [ngClass]="indice === 4 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(4)" (keydown.enter)="seleccionaTab(4)" (keydown.space)="seleccionaTab(4)" role="button" tabindex="4">Pago de derechos</a>
      </li>
      <li [ngClass]="indice === 5 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(5)" (keydown.enter)="seleccionaTab(5)" (keydown.space)="seleccionaTab(5)" role="button" tabindex="5">Trámites Asociados</a>
      </li>
    </ul>
    <ng-container>
      @switch(indice) {
        @case(1) {
          <form [formGroup]="solicitudForm">
            <solicitante [tabindex]="1"></solicitante>
            <div class="row">
              <div class="col">
                <ng-titulo titulo="N&uacute;mero folio de desistimiento" />
                <div class="row">
                  <div class="col-md-8">
                    <div class="form-group">
                      <input class="form-control" type="text" id="folioDeDesistimiento" name="folioDeDesistimiento" formControlName="folioDeDesistimiento" [attr.disabled]="true" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md">
                <ng-titulo titulo="Folio original" />
                <div class="row">
                  <div class="col-md-8">
                    <label for="folio">Folio:</label>
                    <div class="form-group">
                      <input class="form-control" type="text" id="folioOriginal" name="folioOriginal" formControlName="folioOriginal" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </form>
        }
        @case(2) {
          @if(esDatosRespuesta) {
            <app-solicitud-datos></app-solicitud-datos>
          }
        }
        @case(3) {
          @if(esDatosRespuesta) {
            <app-terceros-relacionados-fab-seccion></app-terceros-relacionados-fab-seccion>
          }
        }
        @case(4) {
          @if(esDatosRespuesta) {
            <app-pago-derechos></app-pago-derechos>
          }
        }
        @case(5) {
          @if(esDatosRespuesta) {
            <app-tramites-asociados></app-tramites-asociados>
          }
        }
      }
    </ng-container>
  </div>
</div>
