<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <li [ngClass]="indice === 1 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(1)" (keydown.enter)="seleccionaTab(1)"
          (keydown.space)="seleccionaTab(1)" role="button" tabindex="0">Solicitante</a>
      </li>
      <li [ngClass]="indice === 2 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(2)" (keydown.enter)="seleccionaTab(2)"
          (keydown.space)="seleccionaTab(2)" role="button" tabindex="2">Datos de la solicitud</a>
      </li>
      <li [ngClass]="indice === 3 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(3)" (keydown.enter)="seleccionaTab(3)"
          (keydown.space)="seleccionaTab(3)" role="button" tabindex="3">Terceros relacionados</a>
      </li>
      <li [ngClass]="indice === 4 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(4)" (keydown.enter)="seleccionaTab(4)"
          (keydown.space)="seleccionaTab(4)" role="button" tabindex="4">Pago de derechos</a>
      </li>
      <li [ngClass]="indice === 5 ? 'active' : ''">
        <a data-toggle="tab" (click)="seleccionaTab(5)" (keydown.enter)="seleccionaTab(5)"
          (keydown.space)="seleccionaTab(5)" role="button" tabindex="5">Tramites Asociados</a>
      </li>
    </ul>

    <ng-container>
      @switch (indice) {
      @case (1) {
      <solicitante [tabindex]="1"></solicitante>
      <div class="row">
        <div class="col-md-12 m-5">

          <ng-titulo titulo="N&uacute;mero folio de desistimiento" />
          <div class="row">
            <div class="col-md-8">
              <div class="form-group">
                <input class="form-control" type="text" id="folioDeDesistimiento" name="folioDeDesistimiento"
                  formControlName="folioDeDesistimiento" [attr.disabled]="true" />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12 m-5">

          <ng-titulo titulo="Folio original" />
          <div class="row">
            <div class="col-md-8">
              <div class="form-group">
                <input class="form-control" type="text" id="folioOriginal" name="folioOriginal"
                  formControlName="folioOriginal" [attr.disabled]="true" />
              </div>
            </div>
          </div>
        </div>
      </div>
      }
      @case (2) {
      <app-solicitud-datos></app-solicitud-datos>
      }
      @case (3) {
      <app-terceros-relacionados></app-terceros-relacionados>
      } 
      @case (4) {
        <app-pago-derechos></app-pago-derechos>
      }
      @case (5) {
        <app-tramites-asociados></app-tramites-asociados>
      }
      }
    </ng-container>
  </div>
</div>
