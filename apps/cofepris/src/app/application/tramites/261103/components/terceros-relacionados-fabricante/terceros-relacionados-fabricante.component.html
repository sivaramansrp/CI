<div class="container mt-5">
    <ng-alert [CONTENIDO]="TEXTOS.Importante"></ng-alert>
    <div class="row mb-3">
        <h5>Fabricante*:</h5>
        <div class="col-md-12">
            <app-tabla-dinamica [configuracionTabla]="configuracionTabla" [datos]="fabricanteTablaDatos"
                [tipoSeleccionTabla]="checkbox" (listaDeFilaSeleccionada)="manejarFila($event, 'fabricante')" [disableSeleccionTablaCheckBox]="debeEstarDeshabilitado">
            </app-tabla-dinamica>
            <div class="d-flex justify-content-end mt-4">
                <ng-container *ngIf="listaFilaFabricante.length">
                    <button type="button" class="btn btn-danger me-2">
                        Eliminar
                    </button>
                    <button type="button" class="btn btn-default me-2">
                        Modificar
                </button>
                </ng-container>
                <button type="button" class="btn btn-primary" [disabled]="debeEstarDeshabilitado">Agregar</button>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <h5>Facturador*:</h5>
        <div class="col-md-12">
            <app-tabla-dinamica [configuracionTabla]="configuracionFacturadorTabla" [datos]="fabricanteTablaDatos"
                [tipoSeleccionTabla]="checkbox"  (listaDeFilaSeleccionada)="manejarFila($event, 'facturador')" [disableSeleccionTablaCheckBox]="debeEstarDeshabilitado">
            </app-tabla-dinamica>
            <div class="d-flex justify-content-end mt-4">
                <ng-container *ngIf="listaFilaFacturador.length">
                <button type="button" class="btn btn-danger me-2" [disabled]="debeEstarDeshabilitado">
                    Eliminar
                </button>
                <button type="button" class="btn btn-default me-2" [disabled]="debeEstarDeshabilitado">
                    Modificar
                </button>
                </ng-container>
                <button type="button" class="btn btn-primary" [disabled]="debeEstarDeshabilitado">Agregar</button>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <h5>Proveedor/distribuidor:</h5>
        <div class="col-md-12">
            <app-tabla-dinamica [configuracionTabla]="configuracionProveedorTabla" [datos]="fabricanteTablaDatos"
                [tipoSeleccionTabla]="checkbox"  (listaDeFilaSeleccionada)="manejarFila($event, 'proveedor')" [disableSeleccionTablaCheckBox]="debeEstarDeshabilitado">
            </app-tabla-dinamica>
            <div class="d-flex justify-content-end mt-4">
                <ng-container *ngIf="listaFilaProveedor.length">
                <button type="button" class="btn btn-danger me-2" [disabled]="debeEstarDeshabilitado">
                    Eliminar
                </button>
                <button type="button" class="btn btn-default" [disabled]="debeEstarDeshabilitado">
                    Modificar
                </button>
                </ng-container>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <h5>Certificado analítico:</h5>
        <div class="col-md-12">
            <app-tabla-dinamica [configuracionTabla]="configuracionCertificadoAnaliticoTabla"
                [datos]="fabricanteTablaDatos"  (listaDeFilaSeleccionada)="manejarFila($event, 'certificado')" [tipoSeleccionTabla]="checkbox" [disableSeleccionTablaCheckBox]="debeEstarDeshabilitado">
            </app-tabla-dinamica>
            <div class="d-flex justify-content-end mt-4">
                <ng-container *ngIf="listaFilaCertificado.length">
                <button type="button" class="btn btn-danger me-2" [disabled]="debeEstarDeshabilitado">
                    Eliminar
                </button>
                <button type="button" class="btn btn-default" [disabled]="debeEstarDeshabilitado">
                    Modificar
                </button>
            </ng-container>
            </div>
        </div>
    </div>
    <div class="row mb-3">
        <h5>Otros:</h5>
        <div class="col-md-12">
            <app-tabla-dinamica [configuracionTabla]="configuracionOtrosTabla" [datos]="otrosTablaDatos"
                [tipoSeleccionTabla]="checkbox" (listaDeFilaSeleccionada)="manejarFila($event, 'otros')" [disableSeleccionTablaCheckBox]="debeEstarDeshabilitado">
            </app-tabla-dinamica>
            <div class="d-flex justify-content-end mt-4">
                <ng-container *ngIf="listaFilaOtros.length">
                <button type="button" class="btn btn-danger me-2" [disabled]="debeEstarDeshabilitado">
                    Eliminar
                </button>
                <button type="button" class="btn btn-default" [disabled]="debeEstarDeshabilitado">
                    Modificar
                </button>
                </ng-container>
            </div>
        </div>
    </div>
</div>
