<div class="container">
    <div class="row">
        <ul class="nav nav-tabs">
            <li [ngClass]="indice === 1 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(1)" (click)="seleccionaTab(1)">Solicitante</a>
            </li>
            <li [ngClass]="indice === 2 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(2)" (click)="seleccionaTab(2)">Datos de la
                    solicitud</a>
            </li>
            <li [ngClass]="indice === 3 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(3)" (click)="seleccionaTab(3)">Terceros
                    Relacionados</a>
            </li>
            <li [ngClass]="indice === 4 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(4)" (click)="seleccionaTab(4)">Pago de
                    derechos</a>
            </li>
            <li [ngClass]="indice === 5 ? 'active' : ''">
                <a data-toggle="tab" tabindex="0" (keyup)="seleccionaTab(5)" (click)="seleccionaTab(5)">Tramites
                    Asociados</a>
            </li>
        </ul>

        <div [ngStyle]="{ display: indice === 1 ? 'block' : 'none' }">
            <solicitante [tabindex]="1"></solicitante>
        </div>
        <div [ngStyle]="{ display: indice === 2 ? 'block' : 'none' }">
            <app-datos-de-la-solicitud-modificacion [insumos]="true"></app-datos-de-la-solicitud-modificacion>
        </div>
        <div [ngStyle]="{ display: indice === 3 ? 'block' : 'none' }">
            <app-terceros-relacionados-fabricante [programTitle]="true"></app-terceros-relacionados-fabricante>
        </div>
        <div [ngStyle]="{ display: indice === 4 ? 'block' : 'none' }">
            <app-pago-de-derechos-entrada></app-pago-de-derechos-entrada>
        </div>
        <div [ngStyle]="{ display: indice === 5? 'block' : 'none' }">
            <app-tramites-asociados-seccion></app-tramites-asociados-seccion>
        </div>
    </div>
</div>
