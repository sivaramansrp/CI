<div class="page">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-6">
        <h2>
          Permiso de importación de plaguicidas sujetos a control por SEMARNAT
        </h2>
      </div>

      <app-wizard [listaPasos]="pasos"></app-wizard>
    </div>

    <div class="row">
      @switch (indice) { @case (1) {
      <app-paso-uno #pasoUnoRef></app-paso-uno>
      } @case (2) {
       <app-paso-carga-documento 
          [idSolicitud]="solicitudState.idSolicitud"
          [idTipoTRamite]="'260504'"
          [cargaArchivosEvento]="cargarArchivosEvento"
          (reenviarEventoCarga)="manejaEventoCargaDocumentos($event)"
          (reenviarCargaRealizada)="cargaRealizada($event)"
          (cargaEnProgreso)="onCargaEnProgreso($event)"
        ></app-paso-carga-documento>
      } @case (3) {
       <paso-firma [idSolicitud]="solicitudState.idSolicitud" [procedure]="260504" [procedureUrl]="'permiso-sujetos/plaguicidas'"></paso-firma>
      } }

      <btn-continuar
        [datos]="datosPasos"
        [dePadre]="true"
        (continuarEvento)="getValorIndice($event)"
      ></btn-continuar>
      <app-aviso-de-privacidad *ngIf="indice === 1"></app-aviso-de-privacidad>
    </div>
  </div>
</div>
