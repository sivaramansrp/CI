

<ng-titulo titulo="Domicillio del establecimiento"></ng-titulo>
<form [formGroup]="domicilioEstablecimiento">
  <div class="row">
    <div id="establecimientoDomicilioCodigoPostal" class="col-md-4">
      <label for="establecimientoDomicilioCodigoPostal"
        >Código postal <span class="require">*</span>:</label
      >

      <div>
        <input
          type="text"
          id="establecimientoDomicilioCodigoPostalId"
          formControlName="establecimientoDomicilioCodigoPostal"
          class="form-control"
          (change)="onControlChange('establecimientoDomicilioCodigoPostal')"
        />
      </div>
    </div>

    <div id="Estado" class="col-md-4">
      <app-catalogo-select
        [catalogo]="estadoJson"
        [label]="'Estado*'"
        [placeholder]="'Seleccione una valor'"
        formControlName="establecimientoDomicilioEstado"
        (change)="onControlChange('establecimientoDomicilioEstado')"
      ></app-catalogo-select>
    </div>

    <div id="establecimientoMunicipioYAlcaldia" class="col-md-4">
      <label for="establecimientoMunicipioYAlcaldia"
        >Municipio y alcaldia<span class="require">*</span>:</label
      >

      <div>
        <input
          type="text"
          id="establecimientoMunicipioYAlcaldiaId"
          formControlName="establecimientoMunicipioYAlcaldia"
          class="form-control"
          (change)="onControlChange('establecimientoMunicipioYAlcaldia')"
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div id="establecimientoDomicilioLocalidad" class="col-md-4">
      <label for="establecimientoDomicilioLocalidad"
        >Localidad <span class="require">*</span>:</label
      >
      <div>
        <input
          type="text"
          id="establecimientoDomicilioLocalidadId"
          formControlName="establecimientoDomicilioLocalidad"
          class="form-control"
          (change)="onControlChange('establecimientoDomicilioLocalidad')"
        />
      </div>
    </div>

    <div id="establecimientoDomicilioColonia" class="col-md-4">
      <label for="establecimientoDomicilioColonia"
        >Colonia <span class="require">*</span>:</label
      >
      <div>
        <input
          type="text"
          id="establecimientoDomicilioColoniaId"
          formControlName="establecimientoDomicilioColonia"
          class="form-control"
          (change)="onControlChange('establecimientoDomicilioColonia')"
        />
      </div>
    </div>

    <div class="col-md-4"></div>
  </div>
  <div class="row">
    <div id="establecimientoDomicilioCalle" class="col-md-8">
      <label for="establecimientoDomicilioCalle"
        >Calle <span class="require">*</span>:</label
      >
      <div>
        <input
          type="text"
          id="establecimientoDomicilioCalleId"
          formControlName="establecimientoDomicilioCalle"
          class="form-control"
          (change)="onControlChange('establecimientoDomicilioCalle')"
        />
      </div>
    </div>
  </div>
  <div class="row">
    <div id="establecimientoDomicilioLada" class="col-md-1">
      <label for="establecimientoDomicilioLada"
        >Lada <span class="require">*</span>:</label
      >
      <div>
        <input
          type="text"
          id="establecimientoDomicilioLadaId"
          formControlName="establecimientoDomicilioLada"
          class="form-control"
          (change)="onControlChange('establecimientoDomicilioLada')"
        />
      </div>
    </div>

    <div id="establecimientoDomicilioTelefono" class="col-md-3">
      <label for="establecimientoDomicilioTelefono"
        >Teléfono <span class="require">*</span>:</label
      >
      <div>
        <input
          type="text"
          id="establecimientoDomicilioTelefonoId"
          formControlName="establecimientoDomicilioTelefono"
          class="form-control"
          (change)="onControlChange('establecimientoDomicilioTelefono')"
        />
      </div>
    </div>

    <div class="col-md-8"></div>
  </div>

    <label class="mt-5"> S.C.I.A.N. </label>
    <app-tabla-dinamica
      [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
      [configuracionTabla]="configuracionTabla"
      [datos]="personaparas"
    >
    </app-tabla-dinamica>
    <div class="col-md-12 mt-5 d-flex justify-content-end">
      <button type="button" class="btn btn-primary">Eliminar</button>
      <button
        type="button"
        class="btn btn-primary ms-3"
        (click)="openScianModal()"
      >
        Agregar
      </button>
    </div>

 
  <div class="row">
    <div id="rfcDelProfesionalResponsable" class="col-md-4">
      <label for="rfcDelProfesionalResponsable"
        >RFC del profesional responsable :</label
      >
      <div>
        <input
          type="text"
          id="rfcDelProfesionalResponsableId"
          formControlName="rfcDelProfesionalResponsable"
          class="form-control"
          (change)="onControlChange('rfcDelProfesionalResponsable')"
        />
      </div>
    </div>

    <div id="nombreDelProfesionalResponsable" class="col-md-8">
      <label for="nombreDelProfesionalResponsable">
        Nombre del profesional responsable :</label
      >
      <div>
        <input
          type="text"
          id="nombreDelProfesionalResponsableId"
          formControlName="nombreDelProfesionalResponsable"
          class="form-control"
          (change)="onControlChange('nombreDelProfesionalResponsable')"
        />
      </div>
    </div>
  </div>

  <div class="row mt-5">
    <div class="col-md-4">
      <div class="form-check">
        <input
          type="checkbox"
          id="avisoDeFuncionamientoId"
          formControlName="avisoDeFuncionamiento"
          class="form-check-input"
          (change)="onControlChange('avisoDeFuncionamiento')"
        />
        <label class="form-check-label" for="avisoDeFuncionamiento">
          Aviso de funcionamiento
        </label>
      </div>
    </div>
    <div class="col-md-4">
      <label for="noDeLicenciaSanitaria"> No.de licencia sanitaria :</label>

      <div class="d-flex flex-column align-items-end">
        <input
          type="text"
          id="noDeLicenciaSanitariaId"
          formControlName="noDeLicenciaSanitaria"
          class="form-control"
          (change)="onControlChange('noDeLicenciaSanitaria')"
        />

        <div class="mt-4">
          <button type="button" [disabled]="isCheckboxChecked()" class="btn btn-primary mt-2">Agregar</button>
        </div>
        <div class="col-md-12 row mt-4">
          <textarea
            id="message"
            class="form-control mb-5"
            placeholder=""
            rows="15"
          ></textarea>
        </div>
        <div>
          <button type="button" class="btn btn-primary" [disabled]="isCheckboxChecked()" >Eliminar</button>
        </div>
      </div>
    </div>

    <div class="col-md-4"></div>
  </div>
  <div class="row">
    <div class="col-md-8">
      <app-catalogo-select
        [catalogo]="regimenQueDestinara"
        [label]="'Régimen al que se destinará la mercancía*'"
        [placeholder]="'Seleccione un valor'"
        formControlName="regimenAlQueSeDestinaraLaMercancía"
        (change)="onControlChange('regimenAlQueSeDestinaraLaMercancía')"
      ></app-catalogo-select>
    </div>
    <div class="col-md-4">
      <app-catalogo-select
        [catalogo]="aduanaDeSalida"
        [label]="'Aduana de salida*'"
        [placeholder]="'Seleccione una valor'"
        formControlName="aduanaDeSalida"
        (change)="onControlChange('aduanaDeSalida')"
      ></app-catalogo-select>
    </div>
  </div>
</form>




<div
  class="modal fade"
  #establecimientoModal

>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form [formGroup]="scianForm">
        <div class="modal-body">
          <ng-titulo titulo="Clave S.C.I.A.N."></ng-titulo>
          <div class="row">
            <div class="col-md-8">
              <app-catalogo-select
                [catalogo]="scianJson"
                [label]="'Clave S.C.I.A.N.*'"
                [placeholder]="'Seleccione una valor'"
                formControlName="scian"
                (change)="onControlChange('scian')"
               
              ></app-catalogo-select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-8">
              <label for="descripcionScian">Descripción del S.C.I.A.N.</label>
              <input
                type="text"
                id="descripcionScianId"
                formControlName="descripcionScian"
                class="form-control"
                (change)="onControlChange('descripcionScian')"
              />
            </div>
          </div>
        </div>
        <div class="modal-footer mt-5">
          <button type="button" class="btn btn-primary" (click)="limpiarScianForm()">Limpiar</button>
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
            Cancelar
          </button>
          <button type="button" class="btn btn-primary"  (click)="guardarScian()">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
