<ng-titulo titulo="Manifiestos y declaraciones"></ng-titulo>
<form [formGroup]="manifiestos">
  <div class="form-check bg-light p-0">
  <div class="alert alert-info content-with-checkbox py-6">
    <input type="checkbox" id="mensaje" formcontrolName="mensaje" [checked]="esFormularioSoloLectura" [disabled]="esFormularioSoloLectura"/>
    <span class="fw-bold align-middle"> *</span>
    <div>{{ mensaje }} </div>
  </div>
</div>
  <div class="form mt-5">
    <div class="row">
      <div class="col-md-12">
        <label class="control-label" for="buscar">Los datos o anexos pueden contener información confidencial ¿Está de
          acuerdo en hacerlos públicos?*:</label>
      </div>
      <div class="col-md-2">
        <app-input-radio [radioOptions]="cumplimientoOptions" [isRequired]="true" formControlName="cumplimiento"
          [layout]="'horizontal'"
          (change)="setValoresStore(manifiestos,'cumplimiento', 'setCumplimiento')"></app-input-radio>
      </div>
    </div>
  </div>
</form>
