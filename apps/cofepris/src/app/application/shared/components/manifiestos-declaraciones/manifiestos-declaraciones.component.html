<ng-titulo titulo="Manifiestos y declaraciones"></ng-titulo>
<form [formGroup]="manifiestos">
  <div class="row">
<div class="col-md-12">
  <div class="alert alert-info d-flex align-items-start p-3 rounded content-with-checkbox">
    <!-- Checkbox Section -->
    <div class="me-3 d-flex align-items-center">
      <input
        type="checkbox"
        id="mensaje"
        formControlName="mensaje"
        [checked]="esFormularioSoloLectura ? true : isUpdateDatos"
        [disabled]="esFormularioSoloLectura"
        (change)="setValoresStore(manifiestos, 'mensaje', 'setMensaje')"
      />
      <span class="fw-bold ms-1" [ngClass]="{'tiene-error':manifiestos.get('mensaje')?.touched && manifiestos.get('mensaje')?.errors?.['required']}">*</span>
    </div>

    <!-- Message Section -->
    <div class="flex-grow-1">
      {{ mensaje }}
    </div>
  </div>
</div>

  </div>
  <div class="row">
    <div class="col-md-12">
      <label class="control-label" for="buscar">Los datos o anexos pueden contener información confidencial ¿Está de
        acuerdo en hacerlos públicos?<span [ngClass]="{'tiene-error':manifiestos.get('cumplimiento')?.touched && manifiestos.get('cumplimiento')?.errors?.['required']}" class="fw-bold align-middle">*</span>:</label>
    </div>
    <div class="col-md-2">
      <app-input-radio [radioOptions]="cumplimientoOptions" [isRequired]="true" formControlName="cumplimiento"
        [layout]="'horizontal'"
        (change)="setValoresStore(manifiestos,'cumplimiento', 'setCumplimiento')"></app-input-radio>
    </div>
    @if (manifiestos.get('cumplimiento')?.touched && manifiestos.get('cumplimiento')?.errors?.['required']) {
      <div class="col-md-12">
        <div class="mensaje-error mt-2">
          Este campo es obligatorio.
        </div>
      </div>
    }
    
  </div>
</form>
