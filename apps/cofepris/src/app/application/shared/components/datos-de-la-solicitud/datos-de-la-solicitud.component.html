<div class="container">
    <ng-titulo titulo="Datos del establecimiento"></ng-titulo>
    <div class="row">
        <div class="col-md-12">
            <div class="pull-right ml-2">
                <button type="button" class="btn btn-primary" data-bs-toggle="offcanvas"
                    data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">
                    Seleccionar establecimiento
                </button>
            </div>
        </div>
    </div>

    <form formgroup="datosSolicitudForm">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label" for="rfcSanitario">RFC del responsable sanitario:</label>
                    <input class="form-control" id="rfcSanitario" placeholder="Nombre comercial" type="text"
                        formControlName="rfcSanitario"
                        [ngClass]="isValid(datosSolicitudForm, 'rfcSanitario') ? 'required' : ''">
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label class="form-label" for="denominacionRazon">Denominación o razón social:</label>
                    <input class="form-control" id="denominacionRazon" type="text" formControlName="denominacionRazon"
                        [ngClass]="isValid(datosSolicitudForm, 'denominacionRazon') ? 'required' : ''">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="form-group">
                    <label class="form-label" for="correoElectronico">Correo electrónico:</label>
                    <input class="form-control" id="correoElectronico" type="text" formControlName="correoElectronico"
                        [ngClass]="isValid(datosSolicitudForm, 'correoElectronico') ? 'required' : ''">
                </div>
            </div>
        </div>

        <ng-titulo titulo="Domicilio del establecimiento"></ng-titulo>

        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="codigoPostal">Código postal:</label>
                    <input class="form-control" id="codigoPostal" type="text" formControlName="codigoPostal"
                        [ngClass]="isValid(datosSolicitudForm, 'codigoPostal') ? 'required' : ''">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <app-catalogo-select [catalogo]="estadoDatos" formControlName="estado" [label]="'Estado'"
                        [required]="true" name="estado"></app-catalogo-select>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="municipioAlcaldia">Municipio o alcaldía:</label>
                    <input class="form-control" id="municipioAlcaldia" type="text" formControlName="municipioAlcaldia"
                        [ngClass]="isValid(datosSolicitudForm, 'municipioAlcaldia') ? 'required' : ''">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="localidad">Localidad:</label>
                    <input class="form-control" id="localidad" type="text"
                        formControlName="localidad"
                        [ngClass]="isValid(datosSolicitudForm, 'localidad') ? 'required' : ''">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label class="form-label" for="colonia">Colonia:</label>
                    <input class="form-control" id="colonia" type="text" formControlName="colonia"
                        [ngClass]="isValid(datosSolicitudForm, 'colonia') ? 'required' : ''">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <div class="form-group">
                    <label class="form-label" for="calle">Calle*:</label>
                    <input class="form-control" id="calle" type="text" formControlName="calle"
                        [ngClass]="isValid(datosSolicitudForm, 'calle') ? 'required' : ''">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-1">
                <div class="form-group">
                    <label class="form-label" for="lada">Lada:</label>
                    <input class="form-control" id="lada" disabled type="number"
                        formControlName="lada"
                        [ngClass]="isValid(datosSolicitudForm, 'lada') ? 'required' : ''">
                </div>
            </div>
            <div class="col-md-3">
                <div class="form-group">
                    <label class="form-label" for="telefono">Telefono*:</label>
                    <input class="form-control" id="telefono" disabled type="number" formControlName="telefono"
                        [ngClass]="isValid(datosSolicitudForm, 'telefono') ? 'required' : ''">
                </div>
            </div>
        </div>

        <div class="row mb-5">
            <!-- <app-tabla-dinamica
              [tipoSeleccionTabla]="scianConfig.tipoSeleccionTabla"
              [configuracionTabla]="scianConfig.configuracionTabla"
              [datos]="scianConfig.datos"
            ></app-tabla-dinamica> -->
          </div>

        <div class="row">
            <div class="col-md-12">
                <div class="pull-right ml-2">
                    <button type="button" name="eliminarScian" class="btn btn-danger ms-2">
                        Eliminar
                    </button>
                    <button type="button" name="agregarScian" class="btn btn-primary ms-2" data-bs-toggle="modal"
                        data-bs-target="#modalAgregarScain">
                        Agregar
                    </button>
                </div>
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-md-4 mt-4">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" value="" id="aviso" formControlName="aviso">
                    <label class="form-check-label" for="aviso">Aviso de funcionamiento:
                    </label>
                </div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="licenciaSanitaria">No. de licencia sanitaria:</label>
                <span class="bi bi-question-circle-fill" title="Aeropuerto Internacional Ciudad de México"
                data-bs-toggle="tooltip"></span>
                <input class="form-control" id="licenciaSanitaria" disabled type="text" formControlName="licenciaSanitaria"
                    [ngClass]="isValid(datosSolicitudForm, 'licenciaSanitaria') ? 'required' : ''">
            </div>
        </div>

        <div class="row mt-2">
            <div class="col-md-4">
                <div class="form-group">
                    <app-catalogo-select [catalogo]="regimenDatos" formControlName="regimen" [label]="'Régimen'"
                    [tooltipQuestionCircle]="true"  [required]="true" name="regimen"></app-catalogo-select>
                </div>
            </div>
            <div class="col-md-8">
                <div class="form-group form-check">
                    <app-catalogo-select [catalogo]="adunasDeEntradasDatos" formControlName="adunasDeEntradas" [label]="'Aduanas de entradas'"
                        [required]="true" name="adunasDeEntradas"></app-catalogo-select>
                </div>
            </div>
        </div>
        <div class="row mt-2">
            <div class="col-md-12 pull-right">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="aeropuerto" formControlName="aeropuerto">
                    <label class="form-check-label" for="aeropuerto">Aeropuerto Internacional Ciudad de México (AICM)
                    </label>
                    <span class="bi bi-question-circle-fill" title="Aeropuerto Internacional Ciudad de México"
                        data-bs-toggle="tooltip"></span>
                </div>
                </div>
                </div>

        <!-- // table 2 -->

        <div class="row mt-5">
            <div class="col-md-12">
                <div class="pull-right">
                    <button type="button" name="modificarMercancias" class="btn btn-default">
                        Modificar
                    </button>
                    <button type="button" name="eliminarMercancias" class="btn btn-danger ms-2">
                        Eliminar
                    </button>
                    <button type="button" name="agregarMercancias" class="btn btn-primary ms-2" data-bs-toggle="modal"
                        data-bs-target="#modalAgregarMercancias">
                        Agregar
                    </button>
                </div>
            </div>
        </div>

<ng-titulo titulo="Manifiestos y declaraciones" class="mt-4"></ng-titulo>

<div class="mt-5">
    <ng-alert [CONTENIDO]="alertaDeManifestoContenido" [CUSTOMECLASS]="infoAlert"></ng-alert>
</div>
<div class="row mt-3">
    <div class="col-md-12">
        <label class="form-label">Los datos o anexos pueden contener información confidencial ¿Está de acuerdo en
            hacerlos públicos?*:</label>
        <div class="row">
            <div class="col-md-1">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="publico" id="publicoNo" value="no"
                        formControlName="publico">
                    <label class="form-check-label" for="publicoNo">No</label>
                </div>
            </div>
            <div class="col-md-1">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="publico" id="publicoSi" value="si"
                        formControlName="publico">
                    <label class="form-check-label" for="publicoSi">Si</label>
                </div>
            </div>
        </div>
    </div>
</div>
<ng-titulo titulo="Representante legal" class="mt-4"></ng-titulo>

<div class="row">
    <div class="col-md-4">
        <div class="form-group">
            <label class="form-label" for="representanteRfc">RFC*:</label>
            <input class="form-control" id="representanteRfc" type="text" formControlName="representanteRfc"
                [ngClass]="isValid(datosSolicitudForm, 'representanteRfc') ? 'required' : ''">
        </div>
    </div>
    <div class="col-md-2 mt-5">
        <button type="button" name="representanteRfcBuscar" class="btn btn-default"
        (click)="buscarRepresentanteRfc()">
            Buscar
        </button>
    </div>
</div>
<div class="row mt-2">
    <div class="col-md-4">
        <div class="form-group">
            <label class="form-label" for="representanteNombre">Nombre o Razón Social*:</label>
            <input class="form-control" id="representanteNombre" disabled type="text" formControlName="representanteNombre"
                [ngClass]="isValid(datosSolicitudForm, 'representanteNombre') ? 'required' : ''">
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label class="form-label" for="apellidoPaterno">Apellido paterno*:</label>
            <input class="form-control" id="apellidoPaterno" disabled type="text" formControlName="apellidoPaterno"
                [ngClass]="isValid(datosSolicitudForm, 'apellidoPaterno') ? 'required' : ''">
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group">
            <label class="form-label" for="apellidoMaterno">Apellido materno:</label>
            <input class="form-control" id="apellidoMaterno" disabled type="text" formControlName="apellidoMaterno"
                [ngClass]="isValid(datosSolicitudForm, 'apellidoMaterno') ? 'required' : ''">
        </div>
    </div>
</div>
    </form>

</div>
