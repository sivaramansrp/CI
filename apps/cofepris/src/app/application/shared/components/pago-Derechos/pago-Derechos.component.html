<div class="container mt-4">
  <ng-titulo titulo="Pago de derechos"></ng-titulo>
  <form [formGroup]="derechosForm">
    <div class="row g-3">
      <!-- Clave de referencia -->
      <div class="col-md-4">
        <label for="claveReferencia" class="form-label">Clave de referencia:</label>
        <input type="text" id="claveReferencia" class="form-control" formControlName="claveReferencia"
          (change)="setValoresStore(derechosForm,'claveReferencia', 'setclaveReferencia')" />
      </div>

      <!-- Cadena de la dependencia -->
      <div class="col-md-4">
        <label for="cadenaDependencia" class="form-label">Cadena de la dependencia:</label>
        <input type="text" id="cadenaDependencia" class="form-control" formControlName="cadenaDependencia"
          (change)="setValoresStore(derechosForm,'cadenaDependencia', 'setcadenaDependencia')" />
      </div>

      <div class="col-md-4">
        <app-catalogo-select [catalogo]="derechosList" formControlName="banco" [label]="'Banco'" [required]="true"
          (change)="setValoresStore(derechosForm,'banco', 'setbanco')"
          [isDisabled]="esFormularioSoloLectura ? true : false"></app-catalogo-select>
      </div>
    </div>

    <div class="row g-3 mt-2">
      <!-- Llave de pago -->
      <div class="col-md-4">
        <label for="llavePago" class="form-label">Llave de pago:</label>
        <input type="text" id="llavePago" class="form-control" formControlName="llavePago"
          (change)="setValoresStore(derechosForm,'llavePago', 'setllavePago')" />
      </div>

      <!-- Fecha de pago -->
      <div class="col-md-4">
        <input-fecha [datos]="fechaInicioInput" formControlName="fechaPago" (valorCambiado)="cambioFechaIngreso($event)"
          [setFecha]="derechosForm.get('fechaPago')?.value" [isDisabled]="esFormularioSoloLectura ? true : false"></input-fecha>
      </div>

      <!-- Importe de pago -->
      <div class="col-md-4">
        <label for="importePago" class="form-label">Importe de pago:</label>
        <input type="text" id="importePago" class="form-control" formControlName="importePago"
          (change)="setValoresStore(derechosForm,'importePago', 'setimportePago')" />
      </div>
    </div>

    <div class="row mt-5">
      <div class="col-md-12">
        <div class="pull-right">
          <button type="button" name="agregarMercancias" class="btn btn-primary ms-2">
            Borrar datos del pago
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
