<div class="container">
    <ng-titulo titulo="Datos mercancía"></ng-titulo>

    <form [formGroup]="mercanciaForm">
        <div class="row">
            <div class="col-md-10">
                <div class="ml-2">
                    <app-catalogo-select [catalogo]="clasificacionProductoDatos" formControlName="clasificacionProducto"
                        [label]="'Clasificación del producto'" [required]="true"
                        name="clasificacionProducto"></app-catalogo-select>
                </div>

            </div>
        </div>
        <div class="row">
            <div class="col-md-10 ml-2">
                <div class="form-group">
                    <app-catalogo-select [catalogo]="especificarClasificacionProductoDatos"
                        formControlName="especificarClasificacionProducto"
                        [label]="'Especificar clasificación del producto'" [required]="true"
                        name="especificarClasificacionProducto"></app-catalogo-select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-10">
                <div class="form-group">
                    <label class="form-label" for="denominacionEspecificaProducto">Denominación específica del
                        producto*:</label>
                    <input class="form-control" id="denominacionEspecificaProducto" type="text"
                        formControlName="denominacionEspecificaProducto"
                        [ngClass]="isValid(mercanciaForm, 'denominacionEspecificaProducto') ? 'required' : ''">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-10">
                <div class="form-group">
                    <label class="form-label" for="denominacionDistintiva">Denominación distintiva*:</label>
                    <input class="form-control" id="denominacionDistintiva" type="text"
                        formControlName="denominacionDistintiva"
                        [ngClass]="isValid(mercanciaForm, 'denominacionDistintiva') ? 'required' : ''">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-10">
                <div class="form-group">
                    <label class="form-label" for="denominacionComun">Denominación o nombre científico*:</label>
                    <input class="form-control" id="denominacionComun" type="text" formControlName="denominacionComun"
                        [ngClass]="isValid(mercanciaForm, 'denominacionComun') ? 'required' : ''">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-10 ml-2">
                <app-catalogo-select [catalogo]="tipoProductoDatos" formControlName="tipoProducto"
                    [label]="'Tipo de producto'" [required]="true"
                    name="tipoProducto"></app-catalogo-select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-10 ml-2">
                <app-catalogo-select [catalogo]="formaFarmaceuticaDatos" formControlName="formaFarmaceutica"
                    [label]="'Forma farmacéutica'" [required]="true"
                    name="formaFarmaceutica"></app-catalogo-select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-10 ml-2">
                <app-catalogo-select [catalogo]="estadoFisicoDatos" formControlName="estadoFisico"
                    [label]="'Estado físico'" [required]="true"
                    name="estadoFisico"></app-catalogo-select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-10">
                <div class="form-group">
                    <label class="form-label" for="fraccionArancelaria">Fracción arancelaria*:</label>
                    <span class="bi bi-question-circle-fill" title="Fracción arancelaria"
                    data-bs-toggle="tooltip"></span>
                    <input class="form-control" id="fraccionArancelaria" type="text" formControlName="fraccionArancelaria"
                        [ngClass]="isValid(mercanciaForm, 'fraccionArancelaria') ? 'required' : ''">
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-10">
                <div class="form-group">
                    <label class="form-label" for="descripcionFraccion">Descripción de la fracción arancelaria*:</label>
                    <input class="form-control" id="descripcionFraccion" disable type="text" formControlName="descripcionFraccion">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-5">
                <div class="form-group">
                    <label class="form-label" for="cantidadUmtValor">Cantidad UMT*:</label>
                    <input class="form-control" id="cantidadUmtValor" type="text" formControlName="cantidadUmtValor"
                        [ngClass]="isValid(mercanciaForm, 'cantidadUmtValor') ? 'required' : ''">
                </div>
            </div>
            <div class="col-md-5">
                <div class="form-group">
                    <label class="form-label" for="cantidadUmt">UMT*:</label>
                    <span class="bi bi-question-circle-fill" title="UMT"
                    data-bs-toggle="tooltip"></span>
                    <input class="form-control" id="cantidadUmt" type="text" formControlName="cantidadUmt"
                        [ngClass]="isValid(mercanciaForm, 'cantidadUmt') ? 'required' : ''">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-5">
                <div class="form-group">
                    <label class="form-label" for="cantidadUmcValor">Cantidad UMC*:</label>
                    <input class="form-control" id="cantidadUmcValor" type="text" formControlName="cantidadUmcValor"
                        [ngClass]="isValid(mercanciaForm, 'cantidadUmcValor') ? 'required' : ''">
                </div>
            </div>
            <div class="col-md-10 ml-2">
                <app-catalogo-select [catalogo]="cantidadUmcDatos" formControlName="cantidadUmc" [label]="'UMC'"
                    [required]="true" [tooltipQuestionCircle]="true" name="cantidadUmc"></app-catalogo-select>
            </div>
        </div>

        <div class="row">
            <div class="col-6">
                <label class="form-label text-start" for="presentacion">
                    Presentación farmacéutica o tipo de envase*:
                </label>
                <textarea id="presentacion" class="form-control height" rows="3"
                    formControlName="presentacion" style="height: 90px;"></textarea>
            </div>
        </div>

        <div class="row">
            <div class="col-md-5">
                <div class="form-group">
                    <label class="form-label" for="numeroRegistroSanitario">Número de registro sanitario:</label>
                    <input class="form-control" id="numeroRegistroSanitario" type="number" formControlName="numeroRegistroSanitario"
                        [ngClass]="isValid(mercanciaForm, 'numeroRegistroSanitario') ? 'required' : ''">
                </div>
            </div>
            <div class="col-md-5">
                <div class="form-group">
                    <label class="form-label" for="fechaCaducidad">Fecha de caducidad</label>
                    <input class="form-control" id="fechaCaducidad" type="date" formControlName="fechaCaducidad"
                        [ngClass]="isValid(mercanciaForm, 'fechaCaducidad') ? 'required' : ''">
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-md-12 mt-5">
              <crosslist [fechas]="seleccionarOrigenDelPais"
                [label]="paisDeOriginLabel" [fechasSeleccionadas]="seleccionadasPaisDeOriginDatos"
                (fechasSeleccionadasChange)="paisDeOriginSeleccionadasChange($event)"></crosslist>
            </div>
          </div>

          <div class="row mt-5">
            <div class="col-md-12 mt-5">
              <crosslist [fechas]="paisDeProcedenciaDatos"
                [label]="paisDeProcedenciaLabel" [fechasSeleccionadas]="seleccionadasPaisDeProcedenciaDatos"
                (fechasSeleccionadasChange)="paisDeProcedenciaSeleccionadasChange($event)"></crosslist>
            </div>
          </div>

    </form>
</div>
