<div class="container">
  <ng-titulo titulo="Pago de derechos" />

  <form [formGroup]="pagoDerechosForm">
    <div class="row g-3">
      <!-- Clave de referencia -->
      <div class="col-md-4">
        <label for="claveReferencia" class="form-label"
          >Clave de referencia:</label
        >
        <input
          type="text"
          id="claveReferencia"
          class="form-control"
          formControlName="claveReferencia"
        />
      </div>

      <!-- Cadena de la dependencia -->
      <div class="col-md-4">
        <label for="cadenaDependencia" class="form-label"
          >Cadena de la dependencia:</label
        >
        <input
          type="text"
          id="cadenaDependencia"
          class="form-control"
          formControlName="cadenaDependencia"
        />
      </div>

      @if(mostrarBanco) {
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="bancoDatos"
            formControlName="banco"
            [label]="'Banco'"
            [required]="false"
          ></app-catalogo-select>
        </div>
      } @else {
     <!-- Estado (using <app-catalogo-select>) -->
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="estadosDatos"
          formControlName="estado"
          [label]="'Estado/localidad'"
          [required]="true"
        ></app-catalogo-select>
      </div>
      }
      
    </div>

    <div class="row g-3 mt-2">
      <!-- Llave de pago -->
      <div class="col-md-4">
        <label for="llavePago" class="form-label">Llave de pago:</label>
        <input
          type="text"
          id="llavePago"
          class="form-control"
          formControlName="llavePago"
        />
      </div>

      <!-- Fecha de pago -->
      <div class="col-md-4">
        <input-fecha [datos]="fechaInicioInput"
        name="fechaPago"
        (valorCambiado)="onFechaCambiada($event)"
        [setFecha]="pagoDerechosForm.get('fechaPago')?.value"
        ></input-fecha>
      </div>

      <!-- Importe de pago -->
      <div class="col-md-4">
        <label for="importePago" class="form-label">Importe de pago:</label>
        <input
          type="text"
          id="importePago"
          class="form-control"
          formControlName="importePago"
        />
      </div>
    </div>

    <div class="row mt-5">
      <div class="col-md-12">
        <div class="pull-right">
          <button
            type="button"
            name="agregarMercancias"
            class="btn btn-primary ms-2"
            (click)="onReset()"
          >
            Borrar datos del pago
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
