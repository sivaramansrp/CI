<div class="container">
    <ng-titulo titulo="Clave S.C.I.A.N."></ng-titulo>
    <form [formGroup]="scianForm">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <app-catalogo-select [catalogo]="scianLista" formControlName="clave" [label]="'Clave S.C.I.A.N.'"
                        [required]="true" name="clave"
                        (selectionChange)="claveSelecionada($event)"></app-catalogo-select>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <app-catalogo-select
                    [catalogo]="scianNinoLista"
                    formControlName="scianNino"
                    [label]="'Descripción del S.C.I.A.N.'"
                    [required]="scianNinoRequerido"
                    name="scianNino"
                    [isDisabled]="true"
                  ></app-catalogo-select>
                </div>
            </div>
        </div>
       </form>
       <div class="row mt-3">
        <div class="col-md-12">
            <div class="pull-right ml-2">
                <button type="button" name="eliminarScian" class="btn btn-danger ms-2"
                (click)="limpiarScian()">
                    Limpiar  
                </button>
                <button type="button" name="eliminarScian" class="btn btn-danger ms-2"
                (click)="cancelar()">
                Cancelar
                </button>
                <button type="button" name="agregarScian" class="btn btn-primary ms-2" data-bs-toggle="modal"
                    data-bs-target="#modalAgregarScain" (click)="agregarScian()">
                    Agregar
                </button>
            </div>
        </div>
    </div>
    </div>
