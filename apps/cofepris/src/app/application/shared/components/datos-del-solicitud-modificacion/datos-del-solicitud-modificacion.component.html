
<div class="container">
    <form >
      <div>
        <label>
          Seleccione el tipo de operación que desea realizar*:
        </label>
        <!-- <app-input-radio
          [radioOptions]="opcionDeBotonDeRadio"
          [layout]="'horizontal'"
          formControlName="tipoOperacion"
          (change)="getTipoOperacion()"
        ></app-input-radio> -->
        <app-input-radio
        [radioOptions]="radioOptions"
        [isRequired]="true"
        [layout]="'horizontal'"
        formControlName="ideGenerica1"
      ></app-input-radio>
  <div class="radio">
    <label>
      <input 
        type="radio" 
        value="TIMOD.PRO" 
        formControlName="ideGenerica1" 
        id="pro" 
      
      /> Prórroga
    </label>  
    &nbsp;&nbsp;&nbsp;
    <label>
      <input 
        type="radio" 
        value="TIMOD.MOD" 
        formControlName="ideGenerica1" 
        id="mod" 
       
      /> Modificación
    </label>
    &nbsp;&nbsp;&nbsp;
    <label>
      <input 
        type="radio" 
        value="TIMOD.MYP" 
        formControlName="ideGenerica1" 
        id="modPro" 
       
      /> Modificación y prórroga
    </label>
  </div>

  <div class="row">
    <div class="col-md-12" style="margin-bottom:25px">
      <div>
        <label for="justificacionId"> labelOpinionJustificacion</label>
        <span class="require">*</span>
        <label for="puntos"> labelPuntos </label>
      </div>
      <div>
        <textarea 
          formControlName="observaciones" 
          cols="70"
          rows="5" 
          id="justificacionId" 
          class="form-control" 
         
        ></textarea>
      </div>
    </div>
  </div>
        <ng-titulo titulo="Domicilio del establecimiento"></ng-titulo>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="codigoPostal">Código postal*:</label>
              <input
                class="form-control"
                type="text"
                id="codigoPostal"
                appUppercase
                aria-labelledby="codigoPostal"
              />
            </div>
          </div>
  
          <div class="col-md-4">
            <div class="form-group">
              <app-catalogo-select
                [catalogo]="estado"
                [label]="'Estado*'"
                name="estado"
              >
              </app-catalogo-select>
            </div>
          </div>
  
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="municipioOAlcaldía"
                >Municipio o alcaldía*:</label
              >
              <input
                class="form-control"
                type="text"
                id="municipioOAlcaldía"
                appUppercase
                aria-labelledby="municipioOAlcaldía"
                
              />
            </div>
          </div>
        </div>
  
        <div class="row mt-5">
          <!-- <ng-alert
            [CONTENIDO]="TEXTOS.ADVERTENCIA"
            [CUSTOMECLASS]="class"
          ></ng-alert> -->
        </div>
  
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="localidad">Localidad:</label>
              <input
                class="form-control"
                type="text"
                id="localidad"
               
                appUppercase
                aria-labelledby="localidad"
               
              />
            </div>
          </div>
  
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="colonias">Colonias:</label>
              <input
                class="form-control"
                type="text"
                id="colonias"
               
                appUppercase
                aria-labelledby="colonias"
              
              />
            </div>
          </div>
        </div>
  
        <div class="row">
          <div class="col-md-8">
            <div class="form-group">
              <label class="form-label" for="calle"
                >Calle*:
                <span
                  class="bi bi-question-circle-fill"
                  title="Calle"
                  data-bs-toggle="tooltip"
                ></span
              ></label>
              <input
                class="form-control"
                type="text"
                id="calle"
              
                appUppercase
                aria-labelledby="calle"
               
              />
            </div>
          </div>
        </div>
  
        <div class="row">
          <div class="col-md-1">
            <div class="form-group">
              <label class="form-label" for="lada">Lada:</label>
              <input
                class="form-control"
                type="text"
                id="lada"
              
                appUppercase
                aria-labelledby="lada"
               
              />
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-group">
              <label class="form-label" for="telefono">Teléfono*:</label>
              <input
                class="form-control"
                type="text"
                id="telefono"
               
                appUppercase
                aria-labelledby="telefono"
               
              />
            </div>
          </div>
        </div>
      </div>
    </form>
  
    <div class="row mt-5">
      <label class="form-label mt-4 text-start">S.C.I.A.N.*:</label>
    </div>
    <div class="row">
      <!-- <app-tabla-dinamica
        [tipoSeleccionTabla]="tablaSeleccionCheckbox"
        [configuracionTabla]="nicoTabla"
        [datos]="nicoTablaDatos"
      ></app-tabla-dinamica> -->
      <div class="container text-end mt-5">
        <button class="btn btn-default me-2">Eliminar</button>
        <button
          class="btn btn-primary me-2"
          data-bs-toggle="modal"
          data-bs-target="#modalAddAgent"
        >
          Agregar
        </button>
      </div>
    </div>
    <form >
      <div class="row align-item-center">
        <div class="col-md-4 mt-5">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="avisoCheckbox"
            
            />
            <label class="form-check-label" for="avisoCheckbox">
              <span>Aviso de funcionamiento</span>
            </label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="licenciaSanitaria"
              >No. de licencia sanitaria:
              <span
                class="bi bi-question-circle-fill"
                title="No. de licencia sanitaria"
                data-bs-toggle="tooltip"
              ></span
            ></label>
            <input
              class="form-control"
              id="licenciaSanitaria"
              placeholder=""
              type="text"
              formControlName="licenciaSanitaria"
            />
          </div>
        </div>
      </div>
  
      <div class="row">
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="estado"
         
            [label]="'Régimen'"
            [required]="true"
            name="regimen"
            [tooltipQuestionCircle]="true"
          
          ></app-catalogo-select>
        </div>
        <div class="col-md-8">
          <app-catalogo-select
            [catalogo]="estado"
        
            [label]="'Aduanas de entradas'"
            [required]="true"
            name="aduanasEntradas"
          
          ></app-catalogo-select>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4"></div>
        <div class="col-md-4"></div>
        <div class="col-md-4">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="aifaCheckbox"
            
              
            />
            <label class="form-check-label" for="aifaCheckbox">
              <span
                >Aeropuerto Internacional Felipe Ángeles (AIFA).
                <span
                  class="bi bi-question-circle-fill"
                  title="Aeropuerto Internacional Felipe Ángeles (AIFA)."
                  data-bs-toggle="tooltip"
                ></span>
              </span>
            </label>
          </div>
        </div>
      </div>
  
      <div>
        <div class="row">
          <div class="col-md-12 mt-5">
            <h4>Mercancías*:</h4>
          </div>
        </div>
        <div class="row mt-5">
          <!-- <app-tabla-dinamica
            [tipoSeleccionTabla]="tablaSeleccionCheckbox"
            [configuracionTabla]="mercanciasTabla"
            [datos]="mercanciasTablaDatos"
          ></app-tabla-dinamica> -->
          <div class="container text-end mt-5">
            <button class="btn btn-default me-2">Modificar</button>
            <button class="btn btn-default me-2">Eliminar</button>
            <button
              class="btn btn-primary me-2"
              data-bs-toggle="modal"
              data-bs-target="#modalAddAgentMercancias"
            >
              Agregar
            </button>
          </div>
        </div>
      </div>
  
      <div class="row mt-2">
        <div class="col-md-12">
          <ng-titulo titulo="Manifiesto bajo protesta" />
          <div class="form-check bg-light p-0">
            <div class="alert alert-info content-with-checkbox py-6">
              <input
                formControlName="manifests"
                type="checkbox"
                id="manifiesto"
             
              />
              <span class="fw-bold align-middle"> *</span>
              <div>manifests </div>
            </div>
          </div>
        </div>
      </div>
    </form>
    <div>
      <form>
        <h6>
          Los datos o anexos pueden contener información confidencial ¿Está de
          acuerdo en hacerlos públicos?*:
        </h6>
        <div class="row px-3">
          <!-- <app-input-radio
            [radioOptions]="opcionDeBotonDeRadio"
            [layout]="'horizontal'"
            formControlName="acuerdoPublico"
            (change)="getAcuerdoPublico()"
          ></app-input-radio> -->
        </div>
        <ng-titulo titulo="Representante legal"></ng-titulo>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="rfc">RFC*:</label>
              <input
                class="form-control"
                type="text"
                id="rfc"
                formControlName="rfc"
                appUppercase
                aria-labelledby="rfc"
               
              />
            </div>
          </div>
          <div class="col-md-3 mt-5">
            <button class="btn btn-default me-2">Modificar</button>
          </div>
        </div>
  
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="nombre"
                >Nombre o Razón Social*:</label
              >
              <input
                class="form-control"
                type="text"
                id="nombre"
                formControlName="nombre"
                appUppercase
                aria-labelledby="nombre"
              />
            </div>
          </div>
  
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="apellidoPaterno"
                >Apellido paterno*:</label
              >
              <input
                class="form-control"
                type="text"
                id="apellidoPaterno"
                formControlName="apellidoPaterno"
                appUppercase
                aria-labelledby="apellidoPaterno"
              />
            </div>
          </div>
  
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="apellidoMaterno"
                >Apellido materno:</label
              >
              <input
                class="form-control"
                type="text"
                id="apellidoMaterno"
                formControlName="apellidoMaterno"
                appUppercase
                aria-labelledby="apellidoMaterno"
              />
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
