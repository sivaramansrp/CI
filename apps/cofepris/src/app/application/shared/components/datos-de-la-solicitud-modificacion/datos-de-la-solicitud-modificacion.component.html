<div class="container">
    <form [formGroup]="datosSolicitudform">
      <div>
        <div>
          <label class="mt-5 mb-3">
            Seleccione el tipo de operación que desea realizar*:
          </label>
  
          <app-input-radio
            [radioOptions]="genericOptions"
            [isRequired]="true"
            [layout]="'horizontal'"
            formControlName="ideGenerica1"
           
          ></app-input-radio>
        </div>
  
        <div class="row mt-5">
          <div class="col-md-12">
            <div>
              <label for="observaciones"> Justificacion</label>
              <span class="require">*</span>
            </div>
            <div>
              <textarea
                cols="70"
                rows="5"
                id="observacionesId"
                class="form-control"
                formControlName="observaciones" 
                placeholder="Justificación"
               
              ></textarea>
            </div>
          </div>
        </div>
        <ng-titulo titulo="Datos del establecimiento"></ng-titulo>
        <div class="row">
          <div class="col-md-8"></div>
          <div class="col-md-4 d-flex justify-content-end">
            <button
              type="button"
              class="btn btn-primary"
              (click)="abrirModal()"
            >
              Seleccionar establecimiento
            </button>
          </div>
        </div>
        <div class="row">
          <div class="col-md-8">
            <div class="form-group">
              <label class="form-label" for="establecimientoRazonSocial"
                >Denominación o razón social*:</label
              >
              <input
                class="form-control"
                id="establecimientoRazonSocialId"
                placeholder=""
                type="text"
                formControlName="establecimientoRazonSocial"
               
              />
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="establecimientoCorreoElectronico">Correo electrónico*:</label>
              <input
                class="form-control"
                id="establecimientoCorreoElectronicoId"
                placeholder=""
                type="text"
                formControlName="establecimientoCorreoElectronico"
              
              />
            </div>
          </div>
        </div>
        <ng-titulo titulo="Domicilio del establecimiento"></ng-titulo>
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="establecimientoDomicilioCodigoPostal">Código postal*:</label>
              <input
                class="form-control"
                type="text"
                id="establecimientoDomicilioCodigoPostalId"
                appUppercase
             formControlName="establecimientoDomicilioCodigoPostal"
           
              />
            </div>
          </div>
  
          <div class="col-md-4">
            <div class="form-group">
              <app-catalogo-select
                [catalogo]="estado"
                [label]="'Estado*'"
                name="estado"
                [required]="true"
                formControlName="establecimientoEstados"
              
              >
              </app-catalogo-select>
            </div>
          </div>
  
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="descripcionMunicipio"
                >Municipio o alcaldía*:</label
              >
              <input
                class="form-control"
                type="text"
                id="descripcionMunicipioId"
                appUppercase
                formControlName="descripcionMunicipio"
              
              />
            </div>
          </div>
        </div>
  
        <div class="row mt-5">
          <ng-alert [CONTENIDO]="TEXTOS.ALERTA" [CUSTOMECLASS]="class"></ng-alert>
        </div>
  
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="localidad">Localidad:</label>
              <input
                class="form-control"
                type="text"
                id="localidad"
                formControlName="localidad"
              
              />
            </div>
          </div>
  
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="establishomentoColonias">Colonias:</label>
              <input
                class="form-control"
                type="text"
                id="establishomentoColoniasId"
                formControlName="establishomentoColonias"
              
              />
            </div>
          </div>
        </div>
  
        <div class="row">
          <div class="col-md-8">
            <div class="form-group">
              <label class="form-label" for="calle"
                >Calle*:
                <span
                  class="bi bi-question-circle-fill"
                  title="Calle"
                  data-bs-toggle="tooltip"
                
                ></span
              ></label>
              <input
                class="form-control"
                type="text"
                id="calle"
                appUppercase
                formControlName="calle"
               
              />
            </div>
          </div>
        </div>
  
        <div class="row">
          <div class="col-md-1">
            <div class="form-group">
              <label class="form-label" for="lada">Lada:</label>
              <input
                class="form-control"
                type="text"
                id="lada"
                appUppercase
                formControlName ="lada"
              
              />
            </div>
          </div>
          <div class="col-md-3">
            <div class="form-group">
              <label class="form-label" for="telefono">Teléfono*:</label>
              <input
                class="form-control"
                type="text"
                id="telefono"
                appUppercase
                formControlName = "telefono"
                
              />
            </div>
          </div>
        </div>
      </div>
   
      <div class="row" class="mt-5">
        <div class="form-group">
          <label class="form-label" for="scian">S.C.I.A.N.*:</label>
          <app-tabla-dinamica
            [configuracionTabla]="configuracionTabla"
            [datos]="datosData"
            [tipoSeleccionTabla]="tipoSeleccionTabla.CHECKBOX"
            formcontrolname="scian"
          >
          </app-tabla-dinamica>
        </div>
      </div>
  
      <div class="d-flex justify-content-end">
        <button type="button" class="btn btn-default btn-space me-2">Eliminar</button>
        <button
          type="button"
          class="btn btn-primary btn-space"
        >
          Agregar
        </button>
      </div>
    </form>

      <div class="row align-item-center">
        <div class="col-md-4 mt-5">
          <lib-input-check
          [label]="'Aviso de funcionamiento'"
          [id]="'avisoCheckbox'"
          [required]="true"
          formControlName="avisoCheckbox"
          
        ></lib-input-check>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="licenciaSanitaria"
              >No. de licencia sanitaria:
              <span
                class="bi bi-question-circle-fill"
                title="No. de licencia sanitaria"
                data-bs-toggle="tooltip"
              ></span
            ></label>
            <input
              class="form-control"
              id="licenciaSanitaria"
              placeholder=""
              type="text"
              formControlName="noLicenciaSanitaria"
              
            />
          </div>
        </div>
      </div>
  
      <div class="row">
        <div class="col-md-4">
          <app-catalogo-select
            [catalogo]="estado"
            [label]="'Régimen'"
            [required]="true"
            name="regimen"
            [tooltipQuestionCircle]="true"
            formControlName="regimen"
          
          ></app-catalogo-select>
        </div>
        <div class="col-md-8">
          <app-catalogo-select
            [catalogo]="estado"
            [label]="'Aduanas de entradas'"
            [required]="true"
            name="aduanasEntradas"
            formControlName="aduanasEntradas"
          
          ></app-catalogo-select>
        </div>
      </div>
      <div class="row mt-5">
        <div class="col-md-4"></div>
        <div class="col-md-4"></div>
        <div class="col-md-4">
         
          <lib-input-check
          [label]="'Aeropuerto Internacional Felipe Ángeles (AIFA)'"
          [id]="'aifaCheckbox'"
          [required]="true"
          formControlName="aifaCheckbox"
         
        ></lib-input-check>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12 mt-5">
          <h4>Mercancías*:</h4>
        </div>
      </div>
      <div class="row mt-5">
        <app-tabla-dinamica
          [tipoSeleccionTabla]="tablaSeleccionCheckbox"
          [configuracionTabla]="mercanciasTabla"
          [datos]="mercanciasTablaDatos"
        ></app-tabla-dinamica>
        <div class="container text-end mt-5">
          <button class="btn btn-default me-2">Modificar</button>
          <button class="btn btn-default me-2">Eliminar</button>
        </div>
      </div>
  
      <ng-titulo titulo="Manifiestos y declaraciones" />

<form [formGroup]="manifiestosRepresentanteForm">
    <div class="form-check bg-light p-0">
        <div class="alert alert-info content-with-checkbox py-6">
          <input
            formControlName="manifests"
            type="checkbox"
            id="manifiesto"
          />
          <span class="fw-bold align-middle"> *</span>
          <div>{{ manifiestosText }} </div>
        </div>
      </div>

      <div class="row">
        <label>
          Los datos o anexos pueden contener información confidencial ¿Está de acuerdo en hacerlos públicos?*:
        </label>
        <app-input-radio
        [radioOptions]="informacionConfidencialRadioOption"
        [isRequired]="true"
        [layout]="'vertical'"
        [gap]="'50px'"
        formControlName="informacionConfidencialRadio"
      ></app-input-radio>
      </div>

    </form>
  </div>
  @if (nuevaNotificacion) {
    <section>
    <lib-notificaciones [notificacionInput]="nuevaNotificacion" (confirmacionModal)="eliminarPedimento($event)">
    </lib-notificaciones>
    </section>
    }
