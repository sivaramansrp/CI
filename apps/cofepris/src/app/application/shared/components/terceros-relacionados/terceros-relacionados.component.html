<div class="container">
  <ng-titulo titulo="Terceros relacionados"></ng-titulo>

  <div class="row mt-5">
    <ng-alert
      [CONTENIDO]="MENSAJE_TABLA_OBLIGATORIA"
      [CUSTOMECLASS]="infoAlert"
    ></ng-alert>
  </div>
  <div class="row mt-5">
    <div class="col-md-3">
        <h6>Fabricante
          <span class="form-label" *ngIf="esCampoRequerido('fabricante')">*</span>
          <span class="form-label">:</span>
        </h6>
    </div>
  </div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFabricante"
      [datos]="fabricanteTablaDatos"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        @if (!estaOculto) {
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
        >
          Eliminar
        </button>
        }
        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          data-bs-toggle="modal"
          data-bs-target="#modalAgregarMercancias"
          (click)="irAAcciones('../agregar-fabricante')"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>
  <div class="row mt-5">
    <div class="col-md-3">
      <h6> Destinatario (destino final)
        <span class="form-label" *ngIf="esCampoRequerido('destinoFinal')">*</span>
        <span class="form-label">:</span>
      </h6>
    </div>
  </div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaDestinatarioFinal"
      [datos]="destinatarioFinalTablaDatos"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        @if (!estaOculto) {
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
        >
          Eliminar
        </button>
        }
        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          data-bs-toggle="modal"
          data-bs-target="#modalAgregarMercancias"
          (click)="irAAcciones('../agregar-destinatario-final')"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>

  @if(habilitarProveedor===true ){
  <div class="row mt-5"><h6>Proveedor :</h6></div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaProveedor"
      [datos]="proveedorTablaDatos"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        @if (!estaOculto) {
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
        >
          Eliminar
        </button>
        }
        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          data-bs-toggle="modal"
          data-bs-target="#modalAgregarMercancias"
          (click)="irAAcciones('../agregar-proveedor')"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>
  } @if(habilitarFacturador === true){
  <div class="row mt-5"><h6>Facturador :</h6></div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFacturador"
      [datos]="facturadorTablaDatos"
      [tipoSeleccionTabla]="tipoSeleccionTabla"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        @if (!estaOculto) {
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
        >
          Eliminar
        </button>
        }
        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          data-bs-toggle="modal"
          data-bs-target="#modalAgregarMercancias"
          (click)="irAAcciones('../agregar-facturador')"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>
  }
  <div class="row mt-5"></div>
</div>
