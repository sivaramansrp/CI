<div class="container">
  <ng-titulo titulo="Terceros relacionados"></ng-titulo>

  <div class="row mt-5">
    <h6>Fabricante :</h6>
  </div>
  <div class="row mt-5">
    <app-tabla-dinamica
      [configuracionTabla]="configuracionTablaFabricante"
      [datos]="fabricanteTablaDatos"
    ></app-tabla-dinamica>
  </div>

  <div class="row mt-5">
    <div class="col-md-12">
      <div class="pull-right">
        <button
          type="button"
          name="modificarMercancias"
          class="btn btn-default"
        >
          Modificar
        </button>
        <button
          type="button"
          name="eliminarMercancias"
          class="btn btn-danger ms-2"
        >
          Eliminar
        </button>
        <button
          type="button"
          name="agregarMercancias"
          class="btn btn-primary ms-2"
          data-bs-toggle="modal"
          data-bs-target="#modalAgregarMercancias"
        >
          Agregar
        </button>
      </div>
    </div>
  </div>
