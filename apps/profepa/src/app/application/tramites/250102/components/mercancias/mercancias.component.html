<div class="mercancias-container">
    <ng-titulo titulo="Descripción del producto" />
    <div class="row">
        <h6>Descripción del producto:*</h6>
        <app-tabla-expandible [datos]="producto" [configuracionTabla]="configuracionTabla"
            [configuracionTablaAnidada]="configuracionMercanciasTabla" [obtenerDatosAnidados]="getDetalle"
            [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX" [tableId]="'products-table'"
            (filaSeleccionada)="onProductSelected($event)"></app-tabla-expandible>
    </div>

    <div class="col-md-12 mt-5 d-flex justify-content-end">
        <button type="button" class="btn btn-danger">Borrar</button>
        <button type="button" class="btn btn-default ms-3">Guardor datos</button>
        <button type="button" class="btn btn-primary ms-3" (click)="mercancias()">Agregar</button>
    </div>
</div>

<app-modal [active]="showMercanciasModal">
    <div>
    <ng-titulo titulo="Mercancías sin CFI" />
    <form [formGroup]="formMercancias">
    <div class="row">
 
        <div class="col-md-8">
            <div class="form-group">
              <app-catalogo-select [catalogo]="descripcion" formControlName="descripcion" [label]="'Descripción del producto'"
                [required]="true" name="descripcion" (change)="setValoresStore(formMercancias, 'descripcion', 'setDescripcion')"></app-catalogo-select>
            </div>
          </div>
      </div>
      <ng-titulo titulo="Detalle" />
      <div class="row">
 
        <div class="col-md-4">
            <div class="form-group">
              <app-catalogo-select [catalogo]="fraccion" formControlName="fraccion" [label]="'Fracción arancelaria'"
                [required]="true" name="fraccion"  (change)="setValoresStore(formMercancias, 'fraccion', 'setFraccion')"></app-catalogo-select>
            </div>
          </div>
          <div class="col-md-8">
            <div class="form-group">
                <label class="form-label" for="arancelaria">Descripción de la fracción arancelaria*: </label>
              <input class="form-control" id="arancelaria" type="text"
                formControlName="arancelaria" (change)="setValoresStore(formMercancias, 'arancelaria', 'setArancelaria')" />
             
            </div>
          </div>
      </div>
      <div class="row">      
          <div class="col-md-4">
            <div class="form-group">
                <label class="form-label" for="cantidad">Cantidad*:</label>
              <input class="form-control" id="cantidad" type="text"
                formControlName="cantidad" (change)="setValoresStore(formMercancias, 'cantidad', 'setCantidad')"/>
             
            </div>
            @if(formMercancias.controls['cantidad'].invalid && formMercancias.controls['cantidad'].touched) {
              <div class="d-grid">
                @if(formMercancias.controls['cantidad'].errors?.['required']) {
                  <span class="mensaje-error">Este campo es obligatorio</span>
                }
              
              </div>
            }
          </div>
          <div class="col-md-4">
            <div class="form-group">
                <app-catalogo-select [catalogo]="medida" formControlName="medida" [label]="' Unidad de medida'"
                [required]="true" name="medida"(change)="setValoresStore(formMercancias, 'medida', 'setMedida')" ></app-catalogo-select>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
                <app-catalogo-select [catalogo]="genero" formControlName="genero" [label]="'Género'"
                [required]="true" name="genero" (change)="setValoresStore(formMercancias, 'genero', 'setGenero')" ></app-catalogo-select>
            </div>
          </div>
      </div>
      <div class="row">  
        <div class="col-md-4">
            <div class="form-group">
                <app-catalogo-select [catalogo]="especie" formControlName="especie" [label]="'Especie'"
                [required]="true" name="especie" (change)="setValoresStore(formMercancias, 'especie', 'setEspecie')" ></app-catalogo-select>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
                <app-catalogo-select [catalogo]="comun" formControlName="comun" [label]="'Nombre común'"
                [required]="true" name="comun" (change)="setValoresStore(formMercancias, 'comun', 'setComun')"></app-catalogo-select>
            </div>
          </div>
      </div>
      <div class="row">  
        <div class="col-md-4">
            <div class="form-group">
                <app-catalogo-select [catalogo]="origen" formControlName="origen" [label]="'País de origen'"
                [required]="true" name="origen" (change)="setValoresStore(formMercancias, 'origen', 'setOrigen')" ></app-catalogo-select>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-group">
                <app-catalogo-select [catalogo]="procedencia" formControlName="procedencia" [label]="'País de procedencia'"
                [required]="true" name="procedencia" (change)="setValoresStore(formMercancias, 'procedencia', 'setProcedencia')" ></app-catalogo-select>
            </div>
          </div>
      </div>
      <div class="col-md-12 mt-5 d-flex justify-content-end">    
   
        <button type="button" class="btn btn-default ms-3">Borrar</button>    
        <button type="button" class="btn btn-primary ms-3"  (click)="detalleData()" >Agregar</button>
      </div>
 
    </form>
    <div class="row">
        <h6>Fraccion:*</h6>
        <app-tabla-dinamica
          [configuracionTabla]="configuracionMercanciasTabla"
          [datos]="fraccionData"
          [tipoSeleccionTabla]="TablaSeleccion.CHECKBOX"
        ></app-tabla-dinamica>
        
        <nav aria-label="Page navigation example">
          <ul class="pagination justify-content-center">
            <li class="page-item"><a class="page-link">1</a></li>
          </ul>
        </nav>
      </div>
      <div class="col-md-12 mt-5 d-flex justify-content-end">    
   
        <button type="button" class="btn btn-default ms-3" (click)="detalleCancelar()" >Cancelar</button>    
        <button type="button" class="btn btn-primary ms-3"  (click)="detalleGuardar()"   >Guardar</button>
      </div>
 

</div>
</app-modal>
