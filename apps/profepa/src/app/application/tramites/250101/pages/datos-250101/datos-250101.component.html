<div class="page">
  <div class="container">
    <div class="row">
      <ul class="nav nav-tabs">
        <li [ngClass]="indice === 1 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(1)" (keydown.enter)="seleccionaTab(1)"
            (keydown.space)="seleccionaTab(1)" role="button" tabindex="1">Solicitante</a>
        </li>
        <li [ngClass]="indice === 2 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(2)" (keydown.enter)="seleccionaTab(2)"
            (keydown.space)="seleccionaTab(2)" role="button" tabindex="2">Tipo de movimiento</a>
        </li>
        <li [ngClass]="indice === 3 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(3)" (keydown.enter)="seleccionaTab(3)"
            (keydown.space)="seleccionaTab(3)" role="button" tabindex="3">Destinatario y agente aduanal</a>
        </li>
        <li [ngClass]="indice === 4 ? 'active' : ''">
          <a data-toggle="tab" (click)="seleccionaTab(4)" (keydown.enter)="seleccionaTab(4)"
            (keydown.space)="seleccionaTab(4)" role="button" tabindex="4">Certificados</a>
        </li>
      </ul>

      <ng-container>
        @switch (indice) {
        @case (1) {
        <solicitante></solicitante>
        }
        @case (2) {
        <app-tipo-movimiento></app-tipo-movimiento>
        }
        @case (3) {
        <app-destinatario-agente-aduanal></app-destinatario-agente-aduanal>
        }
        @case (4) {
        <app-certificados></app-certificados>
        }
        }
      </ng-container>
    </div>
  </div>
