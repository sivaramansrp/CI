<div class="container">
    <ng-titulo titulo="Pago de derechos" />
    
    <form [formGroup]="pagoDerechosForm">
      <div class="form">
        
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="clave">Clave de referencia:</label>
              <input class="form-control" id="clave" type="number" maxlength="14"
                formControlName="clave" (change)="setValoresStore(pagoDerechosForm, 'clave', 'setClave')" />
            </div>
          </div>
          
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="dependencia">Cadena de la dependencia:</label>
              <input class="form-control" id="dependencia" maxlength="20"
                type="text" formControlName="dependencia" (change)="setValoresStore(pagoDerechosForm, 'dependencia', 'setDependencia')" />
            </div>
          </div>
          
          <div class="col-md-4">
            <div class="form-group">
              <app-catalogo-select [catalogo]="bancocatalogo" formControlName="banco" [label]="'Banco'"
                [required]="true" name="banco" (change)="setValoresStore(pagoDerechosForm, 'banco', 'setBanco')"></app-catalogo-select>
            </div>
          </div>
        </div>
  
       
        <div class="row">
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="llave">Llave de pago:</label>
              <input class="form-control" id="llave" type="number" maxlength="10"
                formControlName="llave" (change)="setValoresStore(pagoDerechosForm, 'llave', 'setLlave')" />
            </div>
          </div>
          
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="fecha">Fecha de pago:</label>
              <input class="form-control" id="fecha" type="date"  [max]="fechaInicioTramite" 
                formControlName="fecha" (change)="setValoresStore(pagoDerechosForm, 'fecha', 'setFecha')" />
            </div>
          </div>
          
          <div class="col-md-4">
            <div class="form-group">
              <label class="form-label" for="importe">Importe de pago:</label>
              <input class="form-control" id="importe" type="number"  maxlength="16"
                formControlName="importe" (change)="setValoresStore(pagoDerechosForm, 'importe', 'setImporte')" />
            </div>
          </div>
        </div>
        
      </div>
   
    <div class="col-md-12 mt-5 d-flex justify-content-end">
   
      <button type="button" class="btn btn-danger ms-3">Borrar datos del pago</button>
      <button type="button" class="btn btn-primary ms-3">Guardar pago</button>
    </div>
   
    <div class="mb-3">
    
      <input 
        class="form-check-input ms-2" 
        id="revisados" 
        type="checkbox"
        formControlName="revisados"
        (change)="setValoresStore(pagoDerechosForm, 'revisados', 'setRevisados')" />
        <label class="form-label" for="revisados">Datos revisados y correctos</label>
    </div>
  </form>
   
    
  </div>
