<div class="container">
    <div *ngIf="showTableDiv">
        <div class="row">
            <ng-titulo titulo="Datos del destinatario*" />
            <div class="datos-table">
                <div class="table-responsive mt-5">
                    <ng-table [commonTableHeader]="tablaDestinatarioData"
                        [commonTableBody]="tablaDestinatarioFilaDatos"></ng-table>
                </div>
            </div>
            <div class="col-md-12 mt-5 d-flex justify-content-end">
                <button type="button" class="btn btn-danger">Eliminar</button>
                <button type="button" class="btn btn-default ms-3" id="agregarDestinatario">Seleccionar</button>
                <button type="button" class="btn btn-primary ms-3" id="capturarDestinatario"
                    (click)="cambiarDestinatario()">Agregar</button>
            </div>
        </div>

        <div class="row">
            <ng-titulo titulo="Datos del agente aduanal" />
            <div class="datos-table">
                <div class="table-responsive mt-5">
                    <ng-table [commonTableHeader]="tablaAgenteAduanalData"
                        [commonTableBody]="tablaAgenteAduanaFilaDatos"></ng-table>
                </div>
            </div>

            <div class="col-md-12 mt-5 d-flex justify-content-end">
                <button type="button" class="btn btn-danger" id="eliminarRequisito">Eliminar</button>
                <button type="button" class="btn btn-primary ms-3" id="agregarRequisito"
                    (click)="cambiarAgenteAduanal()">Agregar</button>
            </div>
        </div>
    </div>
</div>

<app-modal [active]="showDestinatarioModal">
    <div>
        <ng-titulo titulo="Destinatario" />
        <form [formGroup]="formDestinatariosModal" id="formDestinatariosModal">
            <app-input-radio [radioOptions]="destinatarioOpcionDeBotonDeRadio"
                [layout]="'horizontal'"></app-input-radio>

            <div class="col-md-8 mt-5">
                <label class="form-label" for="denominacionRSDestinatario">Denominación o razón social*:</label>
                <input type="text" class="form-control" id="denominacionRSDestinatario"
                    formControlName="destinatarioRazonSocial" name="denominacionRSDestinatario" [required]=true>
            </div>

            <div class="clearfix"></div>


            <div class="col-md-4 mt-5 dropdown-field">
                <div class="form-group">
                    <app-catalogo-select [catalogo]="paisData" [label]="'País'" [required]="true" name=""
                        id="paisNacionalDestinatario1" formControlName="paisNacionalDestinatario"></app-catalogo-select>
                </div>
            </div>

            <div class="col-md-4 mt-5 dropdown-field">
                <div class="form-group">
                    <app-catalogo-select [catalogo]="estadoData" [label]="'Estado'" [required]="true" name=""
                        id="estadoNacionalDestinatario1"
                        formControlName="estadoNacionalDestinatario"></app-catalogo-select>
                </div>
            </div>

            <div class="col-md-4 mt-5 dropdown-field">
                <label class="form-label" for="codigoPostalDestinatario">Código postal o equivalente*:</label>
                <input type="text" class="form-control" id="codigoPostalDestinatario"
                    formControlName="codigoPostalDestinatario" name="codigoPostalDestinatario" [required]=true>
            </div>

            <div class="col-md-8 mt-4">
                <label class="form-label" for="domicilio">Domicilio*:</label>
                <input type="text" class="form-control" id="domicilioDestinatario"
                    formControlName="domicilioDestinatario" name="domicilio" [required]=true>
            </div>

            <div class="col-md-12 mt-5 d-flex justify-content-end">
                <button type="button" class="btn btn-danger" id="cancelarDestinatarioBtn"
                    (click)="cambiarDestinatario()">Cancelar</button>
                <button type="button" class="btn btn-default ms-3" id="limpiarDestinatarioBtn">Limpiar</button>
                <button type="button" class="btn btn-primary ms-3" id="registroDestinatarioBtn"
                    (click)="enviarDestinatarioFormulario()">Agregar</button>
            </div>
        </form>
    </div>
</app-modal>

<app-modal [active]="showAgenteModal">
    <div>
        <ng-titulo titulo="Agente aduanal" />
        <form [formGroup]="formAgenteAduanal">
            <div class="col-md-4 mt-5">
                <label class="form-label" for="nombreAgente">Nombre(s)*:</label>
                <input type="text" class="form-control" id="nombreAgente" formControlName="nombreAgenteAduanal"
                    name="nombreAgente" [required]=true>
            </div>

            <div class="col-md-4 mt-5">
                <label class="form-label" for="apellidoPaternoAgente">Primer apellido*:</label>
                <input type="text" class="form-control" id="apellidoPaternoAgente"
                    formControlName="primerApellidoAgenteAduanal" name="apellidoPaternoAgente" [required]=true>
            </div>

            <div class="col-md-4 mt-5">
                <label class="form-label" for="apellidoMaternoAgente">Segundo apellido*:</label>
                <input type="text" class="form-control" id="apellidoMaternoAgente"
                    formControlName="segundoApellidoAgenteAduanal" name="apellidoMaternoAgente" [required]=true>
            </div>

            <div class="col-md-8 mt-5">
                <label class="form-label" for="patente">Número de patente de agente aduanal*:</label>
                <input type="text" class="form-control" id="patente" formControlName="patenteAgenteAduanal"
                    name="patente" [required]=true>
            </div>

            <div class="col-md-12 mt-5 d-flex justify-content-end">
                <button type="button" class="btn btn-danger" id="btnCancelarAgente"
                    (click)="cambiarAgenteAduanal()">Cancelar</button>
                <button type="button" class="btn btn-primary ms-3" id="btnAgregarAgente"
                    (click)="enviarAgenteAduanalFormulario()">Agregar</button>
            </div>
        </form>
    </div>
</app-modal>
