<div class="container">
    <ng-titulo titulo="Datos transporte" />
    
    <form [formGroup]="transporteForm">
      
        
        <div class="row custom-spacing" >
          <div class="col-md-4 ">
            <div class="form-group ">
                <app-catalogo-select [catalogo]="medio" formControlName="medio" [label]="'Medio transporte'"
                [required]="true" name="medio" (change)="setValoresStore(transporteForm, 'medio', 'setMedio')" ></app-catalogo-select>
          </div>
          </div>
        </div>
        <div class="row " >
            <h6>Transporte:*</h6>
            <app-tabla-dinamica
              [configuracionTabla]="configuracionTransporteTabla"
              [datos]="TransporteTabla"
              [tipoSeleccionTabla]="checkbox"
            ></app-tabla-dinamica>
            
            <nav aria-label="Page navigation example">
              <ul class="pagination justify-content-center">
                <li class="page-item"><a class="page-link">1</a></li>
              </ul>
            </nav>
          </div>
          <div class="col-md-12 mt-5 d-flex justify-content-end">
            <button type="button" class="btn btn-danger" >Eliminar</button>
            <button type="button" class="btn btn-primary ms-3"
                (click)="transporte()">Agregar</button>
        </div>
        <app-modal [active]="showtransporteModal">
            <ng-titulo titulo="Transporte" />
            <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="identificacion">No. identificación:*</label>
                  <input class="form-control" id="identificacion"  maxlength="20"
                    type="number" formControlName="identificacion"   (change)="setValoresStore(transporteForm, 'identificacion', 'setIdentificacion')"/>
                </div>
              </div> 
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="economico">No. económico:*:</label>
                  <input class="form-control" id="economico" maxlength="50"
                    type="number" formControlName="economico"  (change)="setValoresStore(transporteForm, 'economico', 'setEconomico')" />
                </div>
              </div> 
              <div class="col-md-4">
                <div class="form-group">
                  <label class="form-label" for="placa">Placa:*</label>
                  <input class="form-control" id="placa"  maxlength="25"
                    type="number" formControlName="placa"  (change)="setValoresStore(transporteForm, 'placa', 'setPlaca')"/>
                </div>
              </div>
            </div>
            <div class="col-md-12 mt-5 d-flex justify-content-end">
                <button type="button" class="btn btn-danger" id="btnCancelarAgente" (click)="transporteEliminar()"
                   >Cancelar</button>
                <button type="button" class="btn btn-primary ms-3" id="btnAgregarAgente"
                (click)="TransporteDatos()">Agregar</button>
            </div>
        </app-modal>
        <ng-titulo titulo="Requisitos" />
        <div class="row">
            <h6>Requisitos:*</h6>
            <app-tabla-dinamica
              [configuracionTabla]="configuracionRequisitosTabla"
              [datos]="RequisitosTabla"
              [tipoSeleccionTabla]="checkbox"
            ></app-tabla-dinamica>
            
            <nav aria-label="Page navigation example">
              <ul class="pagination justify-content-center">
                <li class="page-item"><a class="page-link">1</a></li>
              </ul>
            </nav>
          </div>
          <div class="col-md-12 mt-5 d-flex justify-content-end">
            <button type="button" class="btn btn-danger" >Eliminar</button>
            <button type="button" class="btn btn-primary ms-3"
                (click)="requisitos()">Agregar</button>
        </div>
        <app-modal [active]="showrequisitosModal">
            <ng-titulo titulo=" Seleccionar requisito" />
            <div class="row">
                <div class="col-md-8">
                    <div class="form-group">
                        <app-catalogo-select [catalogo]="requisitoCatalogo" formControlName="requisito" [label]="'Seleccionar requisito'"
                        [required]="true" name="requisito"  (change)="setValoresStore(transporteForm, 'requisito', 'setRequisito')" ></app-catalogo-select>
                    </div>
                  </div>
            </div>
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                      <label class="form-label" for="numero">Número*:</label>
                      <input class="form-control" id="numero" maxlength="50"
                        type="number" formControlName="numero"  (change)="setValoresStore(transporteForm, 'numero', 'setNumero')"/>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="fechas">Fecha*:</label>
                        <input class="form-control" id="fechas" type="date"  [max]="fechaInicioTramite" 
                          formControlName="fechas"  (change)="setValoresStore(transporteForm, 'fechas', 'setFechas')" />
                    </div>
                  </div>

            </div>


            <div class="col-md-12 mt-5 d-flex justify-content-end">
                <button type="button" class="btn btn-danger" id="btnCancelarAgente"
                (click)="requisitosEliminar()">Cancelar</button>
                <button type="button" class="btn btn-primary ms-3" id="btnAgregarAgente"
                (click)="RequisitosDatos()" >Agregar</button>
            </div>

        </app-modal>
    </form>
    
</div>
