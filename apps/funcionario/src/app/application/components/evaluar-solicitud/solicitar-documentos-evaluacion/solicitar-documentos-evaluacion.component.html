<div class="container rounded p-3 bg-light">
    <div class="row padding-top">
        <form>
            <h5>Agregar Documento</h5>
            <div class="col-md-12">
                <div class="row ">
                    <div class="col-md-6">
                        <table class="table table-bordered mt-3">
                            <thead class="table-light">
                              <tr>
                                <th>#</th>
                                <th>Tipo de Documento</th>
                                <th>Acciones</th>
                              </tr>
                            </thead>
                            <tbody>
                              <tr *ngFor="let doc of documentosSeleccionados; let i = index">
                                <td>{{ i + 1 }}</td>
                                <td>{{ doc }}</td>
                                <td>
                                  <button class="btn btn-danger btn-sm" (click)="eliminarDocumento(i)">Eliminar</button>
                                </td>
                              </tr>
                            </tbody>
                          </table>
                    </div>
                    <div class="col-md-6">
                      <select class="form-select" [(ngModel)]="documentoSeleccionado" name="documento">
                        <option value="" disabled selected>Seleccione un tipo de documento</option>
                        <option *ngFor="let doc of documentos" [value]="doc">{{ doc }}</option>
                      </select>
                        <br>
                        <button class="btn btn-primary" (click)="agregarDocumento()">Agregar nuevo</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
