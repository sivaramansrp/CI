<div class="container rounded p-3 bg-light">
    <div class="row padding-top">
        <form [formGroup]="formSolicitudDocumentos">
            <h5>Agregar Documento</h5>
            <div class="col-md-12">
                <div class="row ">
                    <div class="col-md-6">
                      <br>
                        <table class="table table-bordered mt-3">
                            <thead class="table-light">
                              <tr>
                                <th>#</th>
                                <th>Tipo de Documento</th>
                                <th>Acciones</th>
                              </tr>
                            </thead>
                            <tbody>
                              <tr *ngFor="let doc of documentosSeleccionados; let i = index">
                                <td>{{ i + 1 }}</td>
                                <td>{{ doc }}</td>
                                <td>
                                  <button class="btn btn-danger btn-sm" (click)="eliminarDocumento(i)">Eliminar</button>
                                </td>
                              </tr>
                            </tbody>
                          </table>
                    </div>
                    <div class="col-md-6">
                      <app-catalogo-select [catalogo]="catTipoDocumento" formControlName="tipoDocumento" [label]="'Tipo documento'"
                      [required]="true" name="tipoDocumento" (change)="tipoDocumentoSeleccionado()"></app-catalogo-select>
                      <br>
                    <button class="btn btn-primary" (click)="agregarDocumento()">Agregar nuevo</button>
                    <br>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
