<div class="page">
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h1>Solicitud servicios extraordinarios</h1>
            </div>

            <app-wizard [listaPasos]="pasos"></app-wizard>
        </div>
        <div class="row">
            <ul class="nav nav-tabs">
                <li [ngClass]="indice === 1 ? 'active' : ''">
                    <a data-toggle="tab" (click)="seleccionaTab(1)">Solicitante</a>
                </li>
                <li [ngClass]="indice === 2 ? 'active' : ''">
                    <a data-toggle="tab" (click)="seleccionaTab(2)">Datos de la solicitud</a>
                </li>
                <li [ngClass]="indice === 3 ? 'active' : ''">
                    <a data-toggle="tab" (click)="seleccionaTab(3)">Terceros relacionados</a>
                </li>
            </ul>

            <ng-container>
                @switch (indice) {
                @case (1) {
                <ng-template *ngTemplateOutlet="solicitante"></ng-template>

                }
                @case (2) {
                <ng-template *ngTemplateOutlet="solicitud"></ng-template>

                }
                @case (3) {
                <ng-template *ngTemplateOutlet="terceros"></ng-template>
                }
                }
            </ng-container>
        </div>
    </div>

</div>

<ng-template #solicitante>
    <div class="row">
        <div class="col-md-12">
            <ng-titulo titulo="Datos generales del solicitante"/>

        </div>

        <div class="col-md-12">
            <ng-titulo titulo="Domicilio fiscal del solicitante"/>
        </div>
    </div>



</ng-template>

<ng-template #solicitud>
    <ng-titulo titulo="Datos de la solicitud"></ng-titulo>


</ng-template>

<ng-template #terceros>
    <ng-titulo titulo="Terceros relacionados"></ng-titulo>


</ng-template>
