<div class="container">
    <div class="row">
      <ul class="nav nav-tabs">
        <li [ngClass]="indice === 1 ? 'active' : ''">
            <a data-toggle="tab" (click)="seleccionaTab(1)">Solicitante</a>
        </li>
        <li [ngClass]="indice === 2 ? 'active' : ''">
            <a data-toggle="tab" (click)="seleccionaTab(2)">Datos de la solicitud</a>
        </li>
      </ul>
  
      <ng-container>
        @switch (indice) { @case (1) {
            <app-solicitante></app-solicitante>
        } 
        @case (2) {
            <app-datos-de-la-solicitud></app-datos-de-la-solicitud>
        } 
        <!-- @case (3) {
        <datos-para-movilizacion-nacional></datos-para-movilizacion-nacional>
        } @case (4) {
        <terceror-relacionados></terceror-relacionados>
        } @case (5) {
        <pago-de-derechos></pago-de-derechos>
        }  -->
    }
      </ng-container>
    </div>
  </div>
