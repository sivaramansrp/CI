<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <ul class="nav nav-tabs">
        <li
          *ngFor="let tab of cortina_A_la_italiana"
          [ngClass]="indice === tab.index ? 'active' : ''"
        >
          <a data-toggle="tab" (click)="seleccionaTab(tab.index)">{{
            tab.title
          }}</a>
        </li>
      </ul>
    </ul>

    <ng-container>
      @switch (indice) { @case (1) {
      <solicitante></solicitante>
      } @case (2) {
      <datos-de-la-solicitud></datos-de-la-solicitud>
      } @case (3) {
      <datos-para-movilizacion-nacional></datos-para-movilizacion-nacional>
      } @case (4) {
      <terceror-relacionados></terceror-relacionados>
      } @case (5) {
      <pago-de-derechos></pago-de-derechos>
      } }
    </ng-container>
  </div>
</div>
