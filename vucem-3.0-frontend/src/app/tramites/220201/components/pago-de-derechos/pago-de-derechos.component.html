<div class="container">
  <form [formGroup]="pagoForm">
    <div class="row">
      <ng-titulo titulo="Pago de derechos" />
      <div class="row mt-2">
        <div class="col-md-12">
          <label for="certficacion_a">Exento de pago</label>
        </div>
        <div class="col-md-4">
          <input
            class="form-check-input me-3"
            type="radio"
            name="exentoPagoNo"
            value=""
            id="certficacion_a"
            formControlName="exentoPagoNo"
          />
          <label class="form-label" for="certficacion_a">No</label>
        </div>
        <div class="col-md-4">
          <input
            class="form-check-input me-3"
            type="radio"
            name="exentoPagoSi"
            value="aa"
            id="certficacion_aa"
            formControlName="exentoPagoSi"
          />
          <label class="form-label" for="certficacion_aa">Sí</label>
        </div>
      </div>
      <div class="col-md-4">
        <label for="seccionAduanera" class="form-label">Justificación*</label>
        <select
          class="form-control"
          id="seccionAduanera"
          name="justificacion"
          formControlName="justificacion"
          [disabled]="true"
        >
          <option>Selecciona un valor</option>
          <option>AEROPUERTO INTERNAL. CD.DE MEXICO, D.F.</option>
          <option>34 - 306 - ANZALDUAS, CIUDAD REYNOSA, TAMAULIPAS.</option>
          <option>31 - 303 - NUEVO AMANECER, CD. REYNOSA, TAMPS.</option>
        </select>
      </div>
      <div class="col-md-8"></div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="nombreImportExport"
            >Clave de referencia*</label
          >
          <input
            class="form-control"
            id="nombreImportExport"
            placeholder=""
            type="text"
            [disabled]="true"
            name="claveReferencia"
            formControlName="claveReferencia"
          />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="nombreImportExport"
            >Cadena de la dependencia*</label
          >
          <input
            class="form-control"
            id="nombreImportExport"
            placeholder=""
            type="text"
            appUppercase
            [disabled]="true"
            name="cadenaDependencia"
            formControlName="cadenaDependencia"
          />
        </div>
      </div>
      <div class="col-md-4">
        <select-catalogos [catalogosDatos]="bancoSelector"></select-catalogos>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="nombreImportExport"
            >Llave de pago</label
          >
          <input
            class="form-control"
            id="nombreImportExport"
            placeholder=""
            type="text"
            appUppercase
            [disabled]="true"
            name="llavePago"
            formControlName="llavePago"
          />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <input-fecha [datos]="fechaInicioInput"></input-fecha>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="form-label" for="nombreImportExport"
            >Importe de pago*:</label
          >
          <input
            class="form-control"
            id="nombreImportExport"
            placeholder=""
            type="text"
            [disabled]="true"
            name="importePago"
            formControlName="importePago"
          />
        </div>
      </div>
    </div>
  </form>
</div>
