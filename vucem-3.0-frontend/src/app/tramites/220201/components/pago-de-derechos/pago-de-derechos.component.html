<div class="container">
  <div class="row">
    <ng-titulo titulo="Pago de derechos" />
    <div class="row mt-2">
      <div class="col-md-12">
        <label for="exentoPago">Exento de pago</label>
      </div>
      <div class="col-md-4">
        <input
          class="form-check-input me-3"
          type="radio"
          name="certficacion"
          value="a"
          id="exentoPagoNo"
        />
        <label class="form-label" for="exentoPagoNo">No</label>
      </div>
      <div class="col-md-4">
        <input
          class="form-check-input me-3"
          type="radio"
          name="certficacion"
          value="aa"
          id="exentoPagoSi"
        />
        <label class="form-label" for="exentoPagoSi">Si</label>
      </div>
    </div>
    <div class="col-md-4">
      <label for="justificacion" class="form-label">Justificacion*</label>
      <select class="form-control" id="justificacion" disabled="true">
        <option>Selecciona un valor</option>
        <option>AEROPUERTO INTERNAL. CD.DE MEXICO, D.F.</option>
        <option>34 - 306 - ANZALDUAS, CIUDAD REYNOSA, TAMAULIPAS.</option>
        <option>31 - 303 - NUEVO AMANECER, CD. REYNOSA, TAMPS.</option>
      </select>
    </div>
    <div class="col-md-8"></div>
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="claveReferencia"
          >Clave de referencia*</label
        >
        <input
          class="form-control"
          id="claveReferencia"
          placeholder=""
          type="text"
          disabled="true"
        />
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="cadenaDependencia"
          >Cadena de la dependencia*</label
        >
        <input
          class="form-control"
          id="cadenaDependencia"
          placeholder=""
          type="text"
          appUppercase
          disabled="true"
        />
      </div>
    </div>
    <div class="col-md-4">
      <label for="banco" class="form-label">Banco*</label>
      <select class="form-control" id="banco" disabled="true">
        <option>Selecciona un valor</option>
        <option>AEROPUERTO INTERNAL. CD.DE MEXICO, D.F.</option>
        <option>34 - 306 - ANZALDUAS, CIUDAD REYNOSA, TAMAULIPAS.</option>
        <option>31 - 303 - NUEVO AMANECER, CD. REYNOSA, TAMPS.</option>
      </select>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="llavePago">Llave de pago</label>
        <input
          class="form-control"
          id="llavePago"
          placeholder=""
          type="text"
          appUppercase
          disabled="true"
        />
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <input-fecha [datos]="fechaInicioInput"></input-fecha>
      </div>
    </div>
    <div class="col-md-4">
      <div class="form-group">
        <label class="form-label" for="importePago">Importe de pago*:</label>
        <input
          class="form-control"
          id="importePago"
          placeholder=""
          type="text"
          disabled="true"
        />
      </div>
    </div>
  </div>
</div>
