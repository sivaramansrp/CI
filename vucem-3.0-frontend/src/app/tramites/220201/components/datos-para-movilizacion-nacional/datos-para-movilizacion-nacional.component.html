<div class="container">
  <form [formGroup]="movilizacionForm">
    <ng-titulo titulo="Destino" />
    <div class="row">
      <div class="col-md-4 form-group">
        <label class="form-label" for="aMaterno"
          >Coordenadas geograficas:</label
        >
        <input
          class="form-control"
          id="coordenadas"
          formControlName="coordenadas"
          placeholder=""
          type="text"
        />
      </div>
    </div>
    <ng-titulo titulo="Medio de transporte" />
    <div class="row">
      <div class="col-md-4">
        <label for="seccionAduanera" class="form-label"
          >Medio de transporte*</label
        >
        <select
          class="form-control"
          id="seccionAduanera"
          formControlName="medio"
        >
          <option>Selecciona un valor</option>
          <option>Aereo</option>
          <option>34 - 306 - ANZALDUAS, CIUDAD REYNOSA, TAMAULIPAS.</option>
          <option>31 - 303 - NUEVO AMANECER, CD. REYNOSA, TAMPS.</option>
        </select>
      </div>
      <div class="col-md-4 form-group">
        <label class="form-label" for="aMaterno"
          >Identification del transporte:</label
        >
        <input
          class="form-control"
          id="identification"
          placeholder=""
          type="text"
          formControlName="transporte"
        />
      </div>
      <div class="col-md-8">
        <label for="seccionAduanera" class="form-label"
          >Punto de verificacion federal:
          <i class="bi bi-question-circle-fill" style="margin-bottom: '5px'"></i
        ></label>
        <select
          class="form-control"
          id="seccionAduanera"
          formControlName="punto"
        >
          <option>Selecciona un valor</option>
          <option>Aereo</option>
          <option>34 - 306 - ANZALDUAS, CIUDAD REYNOSA, TAMAULIPAS.</option>
          <option>31 - 303 - NUEVO AMANECER, CD. REYNOSA, TAMPS.</option>
        </select>
      </div>
      <div class="col-md-8">
        <label for="seccionAduanera" class="form-label"
          >Nombre de la empresa transportista*</label
        >
        <select
          class="form-control"
          id="seccionAduanera"
          formControlName="nombre"
        >
          <option>Selecciona un valor</option>
          <option>Group</option>
          <option>34 - 306 - ANZALDUAS, CIUDAD REYNOSA, TAMAULIPAS.</option>
          <option>31 - 303 - NUEVO AMANECER, CD. REYNOSA, TAMPS.</option>
        </select>
      </div>
    </div>
  </form>
</div>
