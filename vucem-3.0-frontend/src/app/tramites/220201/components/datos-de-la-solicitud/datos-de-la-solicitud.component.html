<div class="container">
  <form [formGroup]="forma">
    <div class="row mt-5">
      <div class="col-md-12">
        <div class="panel-group ficha-collapse" id="accordion">
          <div class="panel panel-default">
            <div
              class="panel-heading"
              (click)="mostrar_colapsable()"
              tabindex="0"
            >
              <h4 class="panel-title">
                <a aria-label="Repeat"
                  ><i class="bi bi-repeat" aria-hidden="true"></i>.</a
                >
              </h4>
              <button type="button" class="collpase-button collapsed"></button>
            </div>
            @if(colapsable){
            <div class="panel-collapse collapse in" id="panel-01">
              <div class="panel-body">
                <crosslist [fechas]="selectRangoDias"></crosslist>
              </div>
            </div>
            }
          </div>
        </div>
      </div>
    </div>

    <div class="row" formGroupName="datosDelaSolicitud">
      <ng-titulo titulo="Datos del trámite a realizar" />

      <div class="col-md-12">
        <select-catalogos [catalogosDatos]="aduanaDeIngreso"></select-catalogos>
      </div>
      <div class="col-md-12">
        <select-catalogos
          [catalogosDatos]="sanidadAgropecuaria"
        ></select-catalogos>
      </div>
      <div class="col-md-12">
        <select-catalogos [catalogosDatos]="puntoInspeccion"></select-catalogos>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label" for="claveUCON"
            >Clave UCON*:
            <i
              class="bi bi-question-circle-fill"
              style="margin-bottom: '5px'"
            ></i
          ></label>
          <input
            formControlName="claveUCON"
            value=""
            class="form-control"
            id="claveUCON"
            placeholder=""
            type="text"
            appUppercase
          />
        </div>
      </div>
      <div class="col-md-6">
        <select-catalogos
          [catalogosDatos]="establecimientoTIF"
        ></select-catalogos>
      </div>
      <div class="col-md-12">
        <select-catalogos [catalogosDatos]="veterinario"></select-catalogos>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label" for="numeroGuia">Número de guia</label>
          <input
            class="form-control"
            id="numeroGuia"
            placeholder=""
            type="text"
            appUppercase
          />
        </div>
      </div>
      <div class="col-md-6">
        <select-catalogos [catalogosDatos]="regimen"></select-catalogos>
      </div>
    </div>

    <div class="row">
      <ng-titulo titulo="Tipo de Mercancía" />
      <div class="col-md-12">
        <label for="certficacion_a">Captura de datos de mercancía</label>
      </div>
      <div class="col-md-12">
        <input
          class="form-check-input me-3"
          type="radio"
          name="certficacion"
          value="a"
          id="certficacion_a"
        />
        <label class="form-label" for="certficacion_a">Animales Vivos:</label>
      </div>
      <div class="col-md-12">
        <input
          class="form-check-input me-3"
          type="radio"
          name="certficacion"
          value="aa"
          id="certficacion_aa"
        />
        <label class="form-label" for="certficacion_aa"
          >Productos Subproductos</label
        >
      </div>
    </div>
    <div class="row">
      <ng-alert [CONTENIDO]="TEXTOS"></ng-alert>
      <div class="row mt-5">
        <div class="col-md-12">
          <label for="mercancia">Mercancía</label>
        </div>
        <div class="col-md-12">
          <table class="table table-responsive">
            <thead>
              <tr>
                <th>Gafete</th>
                <th>Nombre</th>
                <th>Apellido paterno</th>
                <th>Apellido materno</th>
                <th>Acciones</th>
              </tr>
            </thead>

            <tbody>
              <!-- <tr>
              @for (persona of personas; let i = $index; track i) {
              <td>{{ persona.gafete }}</td>
              <td>{{ persona.nombre }}</td>
              <td>{{ persona.aPaterno }}</td>
              <td>{{ persona.aMaterno }}</td>
              <td>
                <button type="button" class="btn btn-link">
                  <i class="bi bi-trash3 bi-c"></i>
                </button>
              </td>
              }
            </tr> -->
            </tbody>
          </table>
        </div>
      </div>
      <div class="row my-5">
        <div class="col-md-12 d-flex justify-content-end">
          <button type="button" class="btn btn-default">Modificar</button>
          <button type="button" class="btn btn-default ms-3">Elimiar</button>
          <button type="button" class="btn btn-primary ms-3">Agregar</button>
        </div>
      </div>
    </div>
  </form>
</div>
