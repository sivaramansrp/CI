<div class="container">
  <ng-titulo [titulo]="'Datos de los residuos y/o materia prima a importar'"></ng-titulo>
  <h4>Agregar materia prima a importar </h4>
      <form [formGroup]="materiaPrimaForm" id="materiaPrimaForm" class="form-group">
        <div class="row mt-3">
          <div class="col-md-8">
            <div class="form-group">
              <label for="descripcionMercancia" class="form-label">Nombre de la Materia Prima *:</label>
              <input
                type="text"
                formControlName="descripcionMercancia"
                class="form-control"
                id="descripcionMercancia"
                [placeholder]="'Nombre de la materia prima'"
              />
              <div *ngIf="materiaPrimaForm.get('descripcionMercancia')?.invalid && (materiaPrimaForm.get('descripcionMercancia')?.dirty || materiaPrimaForm.get('descripcionMercancia')?.touched)">
                  <div *ngIf="materiaPrimaForm.get('descripcionMercancia')?.errors?.['required']">
                      <small class="text-danger">Este campo es obligatorio</small>
                  </div>
              </div>
            </div>
            
          </div>
          <div class="col-md-4">
            <div class="form-group">
              <label for="generica2" class="form-label">Cantidad *:</label>
              <input
                type="text"
                formControlName="generica2"
                class="form-control"
                id="generica2"
                [placeholder]="'1'"
                (blur)="obtenerLetraCantidad(materiaPrimaForm.get('generica2').value)"
              />
              <div *ngIf="materiaPrimaForm.get('generica2')?.invalid && (materiaPrimaForm.get('generica2')?.dirty || materiaPrimaForm.get('generica2')?.touched)">
                  <div *ngIf="materiaPrimaForm.get('generica2')?.errors?.['required']">
                      <small class="text-danger">Este campo es obligatorio</small>
                  </div>
              </div>
            </div>
          </div>
        </div>
    
        <div class="row mt-3">
          <div class="col-md-8">
            <div class="form-group">
              <label for="cantidadEnLetra" class="form-label">Cantidad (letra) *:</label>
              <input
                type="text"
                formControlName="cantidadEnLetra"
                class="form-control"
                id="cantidadEnLetra"
                [placeholder]="'UNO '"
              />
            </div>
          </div>
          <div class="col-md-4" formGroupName="unidadMedidaComercial">
            <app-catalogo-select  (change)="cambiaUnidadMedida()" 
             formControlName="clave" 
             [catalogo]="comboUnidadMedida" 
             [label]="'Unidad de medida'"
             [required]="true"></app-catalogo-select>
          </div>
        </div>
    
        <div class="row mt-3">
          <div class="col-md-12">
            <div class="form-group">
              <app-catalogo-select  (change)="cambiaCapituloFraccion()"  
               formControlName="capituloFraccion"
               [catalogo]="comboCapituloFraccion" 
               [label]="'Capítulo'"
               [required]="true">
              </app-catalogo-select>
            </div>
          </div>
        </div>
    
        <div class="row mt-3">
          <div class="col-md-12">
            <div class="form-group">
              <app-catalogo-select  (change)="cambiaPartidaFraccion()"  
               formControlName="partidaFraccion" 
               [catalogo]="comboPartidaFraccion" 
               [label]="'Partida'"
               [required]="true">
              </app-catalogo-select>
            </div>
          </div>
        </div>
    
        <div class="row mt-3">
          <div class="col-md-4">
            <div class="form-group">
              <app-catalogo-select  (change)="cambiaSubPartidaFraccion()"  
               formControlName="subPartidaFraccion" 
               [catalogo]="comboSubPartidaFraccion" 
               [label]="'Sub partida'"
               [required]="true">
             </app-catalogo-select>
            </div>
          </div>
          <div class="col-md-8">
            <div class="form-group">
              <app-catalogo-select  (change)="cambiaFraccion()"  
               formControlName="fraccion" 
               [catalogo]="comboFraccionArancelariaParametros" 
               [label]="'Fracción arancelaria'"
               [required]="true">
          </app-catalogo-select>
            </div>
          </div>
        </div>
    
        <div class="row mt-3">
          <div class="col-md-12">
              <btn-continuar [datos]="datosPasosGuardar"></btn-continuar>
          </div>
        </div>
      </form>
    </div>
