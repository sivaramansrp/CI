<div class="container">
    <form [formGroup]="form">
        <!--Solicitud Tabla-->
        <app-solicitud-datos [tablaHeadData]="hSolicitud" [tablaFilaDatos]="dSolicitud"></app-solicitud-datos>

        <!--Datos del tramite a realizar-->
        <app-datose-del-tramite-a-realizer claveDeControl="datoseDelTramiteRealizer"></app-datose-del-tramite-a-realizer>

        <!--Responsable inspeccion en punto-->
        <app-responsable-inspeccion-en-punto
        claveDeControl="responsableInspeccionEnPunto"></app-responsable-inspeccion-en-punto>

        <!--Medio de transporte-->
        <medio-transporte (transporteSeleccionado)="onTransporteSeleccionado($event)"></medio-transporte>

        @if (mostrarSeccion) {
        <!--Cantidad de carros de ferrocarril 2-->
        <app-carros-de-ferrocarril [tablaHeadData]="hCarroFerrocarril" 
            [tablaFilaDatos]="dCarrosDeFerrocarril"></app-carros-de-ferrocarril>

        <!-- Historial inspeccion fisica -->
        <app-historial-inspeccion-fisica [tablaHeadData]="hHistorialinspeccion"
            [tablaFilaDatos]="dHistorialInspecciones"></app-historial-inspeccion-fisica>
        }
    </form>
</div>
