<div class="container">
  <ng-titulo titulo="Número de folio del trámite" />
  <form [formGroup]="forma">
    <div
      class="panel-group ficha-collapse margin-bottom-30px"
      id="accordion"
    ></div>
    <div class="row">
      <div class="col-md-8">
        <label class="form-label" for="nombreVeterinario"
          >Folio del trámite:</label
        >
        <input
          formControlName="claveUCON"
          value="1502200200120240301000015"
          class="form-control"
          id="claveUCON"
          placeholder=""
          readonly
          type="text"
          appUppercase
        />
      </div>
    </div>
    <div class="row" formGroupName="datosDelaSolicitud">
      <ng-titulo titulo="Datos del tramite a realizar" />
      <div class="row">
        <div class="col-md-4">
          <select-catalogos
            [catalogosDatos]="aduanaIngreso"
            (valorSeleccion)="aduanaDeIngreso($event)"
          />
        </div>
        <div class="col-md-8">
          <select-catalogos
            [catalogosDatos]="oficianaInspeccion"
            (valorSeleccion)="oficianaDeInspeccion($event)"
          />
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <select-catalogos
            [catalogosDatos]="puntoInspeccion"
            (valorSeleccion)="puntoDeInspeccion($event)"
          />
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="claveUCON"
              >Clave UCON:
              <i
                class="bi bi-question-circle-fill"
                style="margin-bottom: '5px'"
              ></i
            ></label>
            <input
              formControlName="claveUCON"
              value=""
              class="form-control"
              id="claveUCON"
              placeholder=""
              type="text"
              appUppercase
            />
          </div>
        </div>
        <div class="col-md-4">
          <select-catalogos
            [catalogosDatos]="establecimiento"
            (valorSeleccion)="establecimientoDe($event)"
          />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="nombreVeterinario"
            >Nombre del médico veterinario:</label
          >
          <input
            formControlName="claveUCON"
            readonly
            [disabled]="true"
            value=""
            class="form-control"
            id="claveUCON"
            placeholder=""
            type="text"
            appUppercase
          />
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="form-label" for="numeroGuia">Número de guía:</label>
            <input
              class="form-control"
              readonly
              [disabled]="true"
              id="numeroGuia"
              placeholder=""
              type="text"
              appUppercase
            />
          </div>
        </div>
        <div class="col-md-8">
          <select-catalogos
            [catalogosDatos]="regimenDestinaran"
            (valorSeleccion)="regimenDeDestinaran($event)"
          />
        </div>
      </div>
    </div>

    <div class="row">
      <ng-titulo titulo="Tipo de Mercancía" />
      <div class="col-md-12">
        <label for="certficacion_a">Captura de datos de mercancía*:</label>
      </div>
      <div class="col-md-12">
        <input
          class="form-check-input me-3"
          type="radio"
          name="certficacion"
          value="a"
          id="certficacion_a"
        />
        <label class="form-label" for="certficacion_a">Animales Vivos:</label>
      </div>
      <div class="col-md-12">
        <input
          class="form-check-input me-3"
          type="radio"
          name="certficacion"
          value="aa"
          id="certficacion_aa"
        />
        <label class="form-label" for="certficacion_aa"
          >Productos Subproductos</label
        >
      </div>
    </div>
    <div class="row">
      <div class="row mt-5">
        <div class="col-md-12">
          <label for="mercancia">Mercancía</label>
        </div>
        <div class="col-md-12 mt-5">
          <div class="table-container">
            <table class="table table-responsive">
              <thead>
                <tr>
                  <th style="width: 20px"></th>
                  <th style="width: 20px"></th>
                  <th class="name-column">
                    No. partida
                    <div class="icon-stack">
                      <i
                        [ngClass]="{
                          'bi-caret-up-fill': currentDirection === -1,
                          'bi-caret-up': currentDirection !== -1
                        }"
                        (click)="rotateRow(-1)"
                      >
                      </i>
                      <i
                        [ngClass]="{
                          'bi-caret-down-fill': currentDirection === 1,
                          'bi-caret-down': currentDirection !== 1
                        }"
                        (click)="rotateRow(1)"
                      >
                      </i>
                    </div>
                  </th>
                  <th>Tipo de requisito</th>
                  <th>Requisito</th>
                  <th>Número de certificado internacional</th>
                  <th>Fracción arancelaria</th>
                  <th>Descripción de la fracción</th>
                  <th>Nico</th>
                </tr>
              </thead>

              <tbody>
                <tr
                  *ngFor="let row of rows; let i = index"
                  [class.visible-row]="i == currentIndex"
                  [class.hidden-row]="i !== currentIndex"
                >
                  <td
                    style="
                      background-color: rgb(233, 236, 239);
                      text-align: center !important;
                    "
                  >
                    1
                  </td>
                  <td>
                    <button type="button" class="btn btn-link">
                      <i class="bi bi-plus"></i>
                    </button>
                  </td>
                  <td style="text-align: center !important">
                    {{ row.Partida }}
                  </td>
                  <td>{{ row.Tiporequisito }}</td>
                  <td>{{ row.Requisito }}</td>
                  <td>{{ row.Certificado }}</td>
                  <td>{{ row.Fraccion }}</td>
                  <td>{{ row.Descripcion }}</td>
                  <td>{{ row.Nico }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="container">
        <form [formGroup]="movilizacionForm">
          <ng-titulo titulo="Destino" />
          <div class="row">
            <div class="col-md-4 form-group">
              <label class="form-label" for="coordenadas"
                >Coordenadas geográficas:</label
              >
              <input
                class="form-control"
                id="coordenadas"
                readonly
                [disabled]="true"
                formControlName="coordenadas"
                placeholder=""
                type="text"
              />
            </div>
          </div>
          <ng-titulo titulo="Medio de transporte" />
          <div class="row">
            <div class="col-md-4">
              <select-catalogos
                [catalogosDatos]="movilizacionNacional"
                (valorSeleccion)="movilizacionDeNacional($event)"
              />
            </div>
            <div class="col-md-8 form-group">
              <label class="form-label" for="identificacionTransporte"
                >Identificación del transporte:</label
              >
              <input
                class="form-control"
                id="identificacionTransporte"
                readonly
                [disabled]="true"
                placeholder=""
                type="text"
                formControlName="transporte"
              />
            </div>
            <div class="col-md-4">
              <select-catalogos
                [catalogosDatos]="puntoVerificacion"
                (valorSeleccion)="puntoDeVerificacion($event)"
              />
            </div>
            <div class="col-md-8">
              <select-catalogos
                [catalogosDatos]="empresaTransportista"
                (valorSeleccion)="empresaDeTransportista($event)"
              />
            </div>
          </div>
        </form>
      </div>
      <div class="row my-5">
        <div class="col-md-12 d-flex justify-content-end"></div>
      </div>
    </div>
  </form>
</div>
