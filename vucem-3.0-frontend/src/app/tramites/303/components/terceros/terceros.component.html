<div class="container">
  <ng-titulo titulo="Terceros relacionados" />
  <form [formGroup]="FormTercero">
    <div class="form">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="buscar">Registro Federal de Contribuyentes*:</label>
            <input class="form-control" id="buscar" placeholder="RFC" type="text" formControlName="buscar">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <div class="btn-group-center">
              <button class="btn btn-primary ms-2 d-flex" type="button" (click)="agregaPersona()">Buscar</button>
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="rfc">RFC:</label>
            <input class="form-control" id="rfc" placeholder="RFC" type="text" formControlName="rfc">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="nombre">Nombre:</label>
            <input class="form-control" id="nombre" placeholder="Nombre" type="text" formControlName="nombre">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="apePaterno">Apellido Paterno:</label>
            <input class="form-control" id="apePaterno" placeholder="Apellido Paterno" type="text" formControlName="apePaterno">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="apeMaterno">Apellido Materno:</label>
            <input class="form-control" id="apeMaterno" placeholder="Apellido Materno" type="text"
              formControlName="apeMaterno">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="telefono">Teléfono:</label>
            <input class="form-control" id="telefono" placeholder="Teléfono" type="text" formControlName="telefono">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="correo">Correo Electrónico:</label>
            <input class="form-control" id="correo" placeholder="Correo Electrónico" type="text" formControlName="correo">
          </div>
        </div>
      </div>
    </div>
  </form>
  
</div>
