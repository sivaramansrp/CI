<div class="container">
  <form [formGroup]="paisForm">
    
  <div class="row">
    <ng-titulo titulo="Pais(es) procedencia"> </ng-titulo>

    <div class="row mb-5">
      <div class="col-md-4">
        <app-catalogo-select
          [catalogo]="paisProc"
          (change)="fetchPaisProc()"
          [tooltipQuestionCircle]="true"
          [label]="'Bloque'"
          [placeholder]="'Seleccione un bloque'"
          formControlName="bloque"
        ></app-catalogo-select>

        
      </div>
      <div
        class="col-md-4 d-flex justify-content-center align-items-center mt-5 mx-4"
      >
        <button type="button" class="btn-primary btn" name="todos paises">Todos los paises</button>
      </div>
      <div class="col-md-4"></div>
    </div>
    <crosslist
      [fechas]="selectRangoDias"
      [showSearchInput1]="true"
      [showSearchInput2]="true"
      [botonField]="botonField"
    ></crosslist>
  </div>
  <div class="row mt-4">
    <div class="col-md-8">
      <div class="form-group">
        <label for="descripcion" class="form-label"
          >Justificacion y beneficio que se obtiene*:</label
        >
        <textarea
          class="form-control"
          rows="3"
          id="descripcion"
          placeholder="Justificacion y beneficio que se obtiene"
          formControlName="descripcionJustificacion"
        ></textarea>
      </div>
    </div>
  </div>
  <div class="row mt-4">
    <div class="col-md-8">
      <div class="form-group">
        <label for="descripcion" class="form-label">Observaciones:</label>
        <textarea
          class="form-control"
          rows="3"
          id="descripcion"
          placeholder="Observaciones"
          formControlName="observaciones"
        ></textarea>
      </div>
    </div>
  </div>
  </form>



</div>
