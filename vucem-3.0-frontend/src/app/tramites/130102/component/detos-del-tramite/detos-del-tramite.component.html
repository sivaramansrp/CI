<div class="container">
  <form [formGroup]="form">
    <ng-titulo titulo="Datos del tramite a realizar"> </ng-titulo>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label for="solicitude">Solicitude*:</label>
          <app-input-radio
            [radioOptions]="solicitude"
            [selectedValue]="defaultSelect"
            [isRequired]="true"
            (valueChange)="onValueChange($event)"
            [layout]="'vertical'"
          ></app-input-radio>
        </div>
      </div>
      <div class="col-md-8">
        <div *ngFor="let tiposDocumentos of tiposDocumentosArray ">
          <select-catalogos
            [catalogosDatos]="tiposDocumentos"
            (valorSeleccion)="tipoTransporte($event)"
          ></select-catalogos>
        
        </div>
      </div>
    </div>
  </form>
</div>
