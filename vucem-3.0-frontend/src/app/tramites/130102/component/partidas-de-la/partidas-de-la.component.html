<div class="container">
    <form [formGroup]="form">
        <div>
            <ng-titulo titulo="Partidas de la mercancía"></ng-titulo>
            <ng-alert [CONTENIDO]="TEXTOS.INSTRUCCIONES"></ng-alert>
            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="cantidad">Cantidad*:</label>
                        <input class="form-control" type="text" id="cantidad" formControlName="cantidad" appUppercase aria-labelledby="cantidad">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="fraccionArancelariaTIGIE">Fracción Arancelaria TIGIE*:</label>
                        <input class="form-control" type="text" id="fraccionArancelariaTIGIE" formControlName="fraccionArancelariaTIGIE" aria-labelledby="fraccionArancelariaTIGIE">
                    </div>
                </div>
                <div class="col-md-4">
                    <select-catalogos [catalogosDatos]="fraccionArancelariaTIGIE" (valorSeleccion)="fraccionArancelariaTIGIESelection($event)"></select-catalogos>
                </div>
            </div>
            <div class="row">
                <div class="col-md-8">
                    <div class="form-group">
                        <label class="form-label" for="descripcion">Descripción*:</label>
                        <textarea class="form-control height" rows="3" id="descripcion" formControlName="descripcion" aria-labelledby="descripcion"></textarea>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="form-label" for="valorPartidaUSD">Valor partida USD*:</label>
                        <input class="form-control" type="number" id="valorPartidaUSD" formControlName="valorPartidaUSD" aria-labelledby="valorPartidaUSD">
                    </div>
                </div>
            </div>
            <div class="row mt-5">
                <div class="col-md-4"></div>
                <div class="col-md-8">
                    <hr>
                </div>
            </div>
            <div class="row">
                <div class="col-md-8"></div>
                <div class="col-md-4">
                    <div class="btn-group">
                        <button class="btn btn-primary me-2" type="button">Cargar archivo</button>
                        <button class="btn btn-danger" type="button">Agregar</button>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div>
        <ng-alert [CONTENIDO]="TEXTOS.INSTRUCCIONES"></ng-alert>
    </div>
</div>
