<div class="container">
    <form [formGroup]="FormSolicitud" (ngSubmit)="validarFormulario()">
        <!--Datos Regimen-->
        <ng-titulo titulo="Datos del trámite a realizar" />
        <ng-container formGroupName="datosRegimen">
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="form-group">
                        <select-catalogos [catalogosDatos]="datosRegimenMercancia"
                            (valorSeleccion)="regimenMercancia($event)" />
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group clasifi-regimen-catalogo">
                        <select-catalogos [catalogosDatos]="datosClasifiRegimen"
                            (valorSeleccion)="clasifiRegimen($event)" />
                    </div>
                </div>
            </div>
        </ng-container>

        <!--Datos Mercancia-->
        <ng-titulo titulo="Datos de la mercancía" />
        <ng-container formGroupName="datosMercancia">
            <div class="row mb-3">
                <div class="col-md-8">
                    <div class="form-group">
                        <label for="descripcion" class="form-label">Descripción de la mercancía*:</label>
                        <textarea class="form-control" cols="60" rows="10" id="valueTA" formControlName="valueTA"
                            [ngClass]="isValid(datosMercancia, 'valueTA') ? 'required' : ''"></textarea>
                        <input type="hidden" id="valueHidden" name="descripcionMerc" />
                        @if (FormSolicitud.get('datosMercancia.valueTA')?.hasError('maxlength')){
                        <div class="text-danger">
                            Por favor, no escriba más de 1000 caracteres.
                        </div>
                        }
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <select-catalogos [catalogosDatos]="datosFraccionArancelaria"
                        (valorSeleccion)="fraccionArancelaria($event)" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <select-catalogos [catalogosDatos]="datosNico" (valorSeleccion)="nico($event)" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <label for="unidadMedidaTarifaria" class="form-label">Unidad de medida de la tarifa (UMT)*:</label>
                    <span class="bi bi-question-circle-fill" title="Unidad de medida de la tarifa (UMT)"
                        data-bs-toggle="tooltip"></span>
                </div>
                <div class="col-md-8">
                    <select id="unidadTarifariaComboId" class="form-control" formControlName="unidadMedidaTarifaria"
                        [ngClass]="isValid(datosMercancia, 'unidadMedidaTarifaria') ? 'required' : ''">
                        <option value="">Selecciona un valor</option>
                        <option>Metros</option>
                        <option>Kilogramo</option>
                        <option>Litros</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <label for="cantidadTarifaria" class="form-label">Cantidad*:</label>
                    <input class="form-control onceEnterosDosdecimals"
                        [ngClass]="isValid(datosMercancia, 'cantidadTarifaria') ? 'required' : ''" type="number"
                        formControlName="cantidadTarifaria" name="cantidadTarifaria" id="cantidadTarifaria"
                        (change)="calcularUmtPrecioUnitario()" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <label for="valorFacturaUSD" class="form-label">Valor factura USD*:</label>
                    <span class="bi bi-question-circle-fill"
                        title="En caso de no contar con valor factura proporciona el valor estimado"
                        data-bs-toggle="tooltip"></span>
                    <input class="form-control" [ngClass]="isValid(datosMercancia, 'valorFacturaUSD') ? 'required' : ''"
                        type="number" formControlName="valorFacturaUSD" name="valorFacturaUSD" id="valorFacturaUSD"
                        (change)="calcularUmtPrecioUnitario()" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <label for="precioUnitarioUSD" class="form-label">Precio unitario en USD*:</label>
                    <input class="form-control"
                        [ngClass]="isValid(datosMercancia, 'precioUnitarioUSD') ? 'required' : ''" type="text"
                        formControlName="precioUnitarioUSD" name="precioUnitarioUSD" id="precioUnitarioUSD" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <select-catalogos [catalogosDatos]="datosPaisOrigen" (valorSeleccion)="paisOrigen($event)" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-8">
                    <select-catalogos [catalogosDatos]="datosPaisDestino" (valorSeleccion)="paisDestino($event)" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="lote" class="form-label">Número de certificado de molino o de calidad*:
                        <span class="bi bi-question-circle-fill" title="Número de certificado de molino o de calidad"
                            data-bs-toggle="tooltip"></span></label>
                    <input type="text" [ngClass]="isValid(datosMercancia, 'lote') ? 'required' : ''"
                        class="form-control" id="lote" formControlName="lote" />
                </div>
                <div class="col-md-4">
                    <div class="input-group">
                        <input-fecha [datos]="fechaFinalInput" (valorCambiado)="cambioFechaFinal($event)"></input-fecha>
                    </div>
                </div>
            </div>
            <div class="row mb-4">
                <div class="col-md-8">
                    <div class="form-group">
                        <label for="observaciones" class="form-label">Observaciones:</label>
                        <textarea cols="60" rows="5" class="form-control" formControlName="observaciones"
                            id="valueTAObs"></textarea>
                        <input type="hidden" id="valueHiddenObsv" name="observacionMerc"
                            formControlName="observacionMerc"
                            [value]="escapeHtmlQuotes(FormSolicitud.get('datosMercancia.observaciones')?.value)">
                    </div>
                </div>
            </div>
        </ng-container>

        <!--Datos Productor-->
        <ng-titulo titulo="Datos del productor" />
        <ng-container formGroupName="datosProducto">
            <div class="row mb-3" id="tipoPer">
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="tipoPersona" class="form-label">Tipo de persona*:</label>
                        <div class="form-check">
                            <input type="radio" value="pfisica" id="pfisica" class="form-check-input"
                                formControlName="tipoPersona" (change)="personaFisica()">
                            <label for="pfisica" class="form-check-label">Física</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" value="pmoral" id="pmoral" class="form-check-input"
                                formControlName="tipoPersona" (change)="personaMoral()">
                            <label for="pmoral" class="form-check-label">Moral</label>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                                <span id="errorTipoPersona" name="errorTipoPersona"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <br>
            </div>

            @if(isVisibleFisica){
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="nombre" class="form-label">Nombre(s)*:</label>
                        <input class="form-control" [ngClass]="isValid(datosProducto, 'nombre') ? 'required' : ''"
                            type="text" name="nombre" id="nombre" formControlName="nombre" />
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="apellidoPaterno" class="form-label">Primer apellido*:</label>
                        <input class="form-control"
                            [ngClass]="isValid(datosProducto, 'apellidoPaterno') ? 'required' : ''" type="text"
                            name="apellidoPaterno" id="apellidoPaterno" formControlName="apellidoPaterno" />
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="apellidoMaterno" class="form-label">Segundo apellido:</label>
                        <input class="form-control" type="text" name="apellidoMaterno" id="apellidoMaterno"
                            formControlName="apellidoMaterno" />
                    </div>
                </div>
            </div>
            }

            @if(isVisibleMoral){
            <div class="row mb-3 pm">
                <div class="col-md-8">
                    <div class="form-group">
                        <label for="razonSocial" class="form-label">Razon social*:</label>
                        <input class="form-control" [ngClass]="isValid(datosProducto, 'razonSocial') ? 'required' : ''"
                            type="text" name="razonSocial" id="razonSocial" formControlName="razonSocial" />
                    </div>
                </div>
            </div>
            }

            <div class="row mb-3" id="molino">
                <div class="col-md-8">
                    <label for="molinoSeleccion" class="form-label">Molino*:</label>
                    <select id="molinoSeleccion" [ngClass]="isValid(datosProducto, 'molinoSeleccion') ? 'required' : ''"
                        class="form-control" formControlName="molinoSeleccion">
                        <option value="">Selecciona un valor</option>
                        <option value="">Molino_01</option>
                        <option value="">Molino_02</option>
                        <option value="">Molino_03</option>
                    </select>
                    <input type="hidden" id="selectMolino">
                </div>
            </div>

            <div class="row mb-3">
                <br>
            </div>

            <div class="row mb-3" style="margin-bottom:51px ">
                <div class="col-md-8">
                    <div class="form-group">
                        <label for="domicilio" class="form-label">Domicilio*:</label>
                        <textarea class="form-control" [ngClass]="isValid(datosProducto, 'domicilio') ? 'required' : ''"
                            id="domicilio" name="domicilio" cols="50" rows="7" formControlName="domicilio"></textarea>
                    </div>
                </div>
            </div>
        </ng-container>

        <!--Registro Federal-->
        <ng-titulo titulo="Representación federal" />
        <ng-container formGroupName="registroFederal">
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="form-group">
                        <select-catalogos [catalogosDatos]="datosEstado" (valorSeleccion)="estado($event)" />
                        <input type="hidden" name="entidadSolicitud" />
                    </div>
                </div>
                <div class="col-md-4 rf-input">
                    <div class="form-group">
                        <label for="unidadAdministrativaRepresentacionFederal">Representación Federal*:</label>
                        <input type="hidden" name="idRepresetancionFederalSeleccionado"
                            id="idRepresetancionFederalSeleccionado" />
                        <select name="unidadAdministrativaRepresentacionFederal" id="representacionFederalSelect"
                            class="form-control" formControlName="representacionFederal"
                            [ngClass]="isValid(registroFederal, 'representacionFederal') ? 'required' : ''">
                            <option value="">Seleccione un valor</option>
                            <option value="culiacan">CULIACAN</option>
                        </select>
                    </div>
                </div>
            </div>
        </ng-container>
    </form>
</div>
