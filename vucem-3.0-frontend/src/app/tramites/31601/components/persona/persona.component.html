<ng-titulo titulo="Personas para oir y recibir notificaciones" />
<div class="custom-table-wrapper">
<div class="container">
    <div class="header">
      <span >
        Personas para oir y recibir notificaciones
      </span>
      <span class="plus-icon" tabindex="0" (click)="toggleContent()" (keyup.enter)="toggleContent()" (keyup.space)="toggleContent()">+</span>
    </div>
    <div *ngIf="showContent" class="content">
                 
      
        <table class="custom-table">
            <thead>
              <tr>
                <th>RFC</th>
                <th>CURP</th>
                <th>Nombre</th>
                <th>Apellido paterno</th>
                <th>Apellido materno</th>
              
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let persona of personaparas">
                <td>{{ persona.RFC }}</td>
                <td>{{ persona.CURP }}</td>
                <td>{{ persona.Nombre }}</td>
                <td>{{ persona.Apellido_paterno }}</td>
                <td>{{ persona.Apellido_materno }}</td>
              </tr>
            </tbody>
          </table>
        
    </div>
</div>
  
</div>
