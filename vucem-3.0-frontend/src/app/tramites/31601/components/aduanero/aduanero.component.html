<!-- Angular Template: form.component.html -->
<div class="container mt-4">
    <form >
      <div id="preoperativoA" class="w-100 p-3 border rounded shadow-sm">
        <div class="mb-3">
          <span class="require">*</span>
          <label class="form-label fw-bold">
            ¿Desea obtener la autorización del Esquema Integral modalidad IVA e IEPS, como pre-operativo?
          </label>
          <p class="text-muted small">
            (El período pre-operativo únicamente podrá ser solicitado por única ocasión de conformidad con la regla 7.1.2 y el mismo deberá ser solicitado al momento del llenado de la presente solicitud, no podrá solicitarlo posteriormente.)
          </p>
        </div>
        <div class="d-flex gap-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" formControlName="preOperativo" [value]="true" >
            <label class="form-check-label">Sí</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" formControlName="preOperativo" [value]="false" >
            <label class="form-check-label">No</label>
          </div>
        </div>
        <!-- <div *ngIf="errorPreOperativo" class="text-danger mt-2">{{ errorPreOperativo }}</div> -->
      </div>
  
      <div class="w-100 p-3 border rounded shadow-sm mt-4">
        <fieldset>
          <legend class="fs-5 fw-bold">Indique los regímenes aduaneros a los que pertenece</legend>
          <div class="d-flex flex-column gap-2">
            <!-- <div *ngFor="let regimen of regimens; let i = index" class="form-check">
              <input class="form-check-input" type="checkbox" [formControlName]="regimen.controlName" (click)="validarSeleccion(i)">
              <label class="form-check-label">{{ regimen.label }}</label>
            </div> -->
          </div>
        </fieldset>
        <!-- <div *ngIf="errorChecksRegimenes" class="text-danger mt-2">{{ errorChecksRegimenes }}</div> -->
      </div>
    </form>
  </div>
