<div class="container">
  <ng-titulo titulo="Tipo de servicio extraordinario" />

  <div class="row">
    <div class="col-md-4">
      <select-catalogos [catalogos_datos]="datos_tipos_solicitud" (valorSelección)="tipoSolicitud($event)" />
    </div>
  </div>

  @if(tipo_sol_seleccionada) {
  <form [formGroup]="FormSolicitud" (ngSubmit)="validarFormulario()">
    <ng-titulo titulo="Datos del importador/exportador" />
    <div formGroupName="datos_importador_exportador">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="rfc_import_export">RFC*:</label>
            <input class="form-control" id="rfc_import_export" placeholder="RFC" type="text"
              formControlName="rfc_import_export"
              [ngClass]="isValid(datos_importador_exportador,'rfc_import_export') ? 'required' : ''" appUppercase
              (blur)="busqueda_rfc()">
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-group">
            <label class="control-label" for="nombre_import_export">Nombre*:</label>
            <input class="form-control" id="nombre_import_export" formControlName="nombre_import_export"
              placeholder="Nombre" type="text" appUppercase>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="nombre_imp">Número de registro o programa:</label>
            <input class="form-control" id="rfc_imp" placeholder="Numero de registro" type="text"
              formControlName="nro_registro">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <input-check [datos]="programa_fomento" (valores)="valorInputCheck($event)"></input-check>
        </div>

        <div class="col-md-4">
          <input-check [datos]="immex" (valores)="valorInputCheck($event)"></input-check>
        </div>

        <div class="col-md-4">
          <input-check [datos]="industria_automotriz" (valores)="valorInputCheck($event)"></input-check>
        </div>
      </div>

      <div class="row mt-2">
        <div class="col-md-12">
          <label for="certficacion_a">Tipo de empresa certificada</label>
        </div>
        <div class="col-md-4">
          <input class="form-check-input me-3" type="radio" name="certficacion" value="a" id="certficacion_a">
          <label class="control-label" for="nombre_imp">I.V.A e I.E.P.S Certificación A:</label>
        </div>
        <div class="col-md-4">
          <input class="form-check-input me-3" type="radio" name="certficacion" value="aa" id="certficacion_aa">
          <label class="control-label" for="nombre_imp">I.V.A e I.E.P.S Certificación AA:</label>
        </div>
        <div class="col-md-4">
          <input class="form-check-input me-3" type="radio" name="certficacion" value="aaa" id="certficacion_aaa">
          <label class="control-label" for="nombre_imp">I.V.A e I.E.P.S Certificación AAA:</label>
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-md-4">
          <input-check [datos]="socio_comercial" (valores)="valorInputCheck($event)"></input-check>
        </div>

        <div class="col-md-4">
          <input class="form-check-input me-3" type="checkbox" value="" id="flexCheckDefault">
          <label class="control-label" for="nombre_imp">Operador económico autorizado</label>
        </div>

        <div class="col-md-4">
          <input class="form-check-input me-3" type="checkbox" value="" id="flexCheckDefault">
          <label class="control-label" for="nombre_imp">Revisión en origen</label>
        </div>
      </div>
    </div>

    <ng-titulo titulo="Datos del servicio" />
    <div class="row">
      <div class="col-md-4">
        <input-fecha [datos]="fecha_inicio" (valorCambiado)="cambioFechaInicio($event)"></input-fecha>
      </div>


      <div class="col-md-4">
        <input-hora [datosHora]="hora_inicio" (horaValor)="obtenerHora($event, 'i')"></input-hora>
      </div>

    </div>

    <div class="row">
      <div class="col-md-4">
        <input-fecha [datos]="fecha_final" (valorCambiado)="cambioFechaFinal($event)"></input-fecha>
      </div>

      <div class="col-md-4">
        <input-hora [datosHora]="hora_final" (horaValor)="obtenerHora($event, 'f')"></input-hora>
      </div>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="panel-group ficha-collapse" id="accordion">
          <div class="panel panel-default">
            <div class="panel-heading" (click)="mostrar_colapsable()">
              <h4 class="panel-title">
                <a>
                  Especifique los días que se utilizarán dentro del periodo*:
                </a>
              </h4>
              <button type="button" class="collpase-button collapsed"></button>
            </div>
            @if(colapsable){
            <div class="panel-collapse collapse in" id="panel-01">
              <div class="panel-body">
                <crosslist [fechas]="selectRangoDias"></crosslist>
              </div>
            </div>
            }
          </div>
        </div>
      </div>
    </div>

    <ng-titulo titulo="Datos del despacho para el servicio extraordinario" />

    <div class="row" formGroupName="despacho">
      <div class="col-md-4">
        <input-check [datos]="despacho_lda" (valores)="valorInputCheck($event)"></input-check>
      </div>
      <div class="col-md-4">
        <input-check [datos]="despacho_dd" (valores)="valorInputCheck($event)"></input-check>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4">
        <label for="tipo_solicitud" class="control-label">Aduana*:</label>
        <select class="form-control" id="tipo-solicitud">
          <option>Selecciona un valor</option>
          <option>Individual</option>
          <option>Semanal</option>
          <option>Mensual</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="tipo_solicitud" class="control-label">Sección aduanera*:</label>
        <select class="form-control" id="tipo-solicitud">
          <option>Selecciona un valor</option>
          <option>Individual</option>
          <option>Semanal</option>
          <option>Mensual</option>
        </select>

      </div>
      <div class="col-md-4">
        <label for="tipo_solicitud" class="control-label">Nombre del recinto:</label>
        <select class="form-control" id="tipo-solicitud">
          <option>Selecciona un valor</option>
          <option>Individual</option>
          <option>Semanal</option>
          <option>Mensual</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="col-md-4">
        <label for="tipo_solicitud" class="control-label">Tipo de operación*:</label>
        <select class="form-control" id="tipo-solicitud">
          <option>Selecciona un valor</option>
          <option>Individual</option>
          <option>Semanal</option>
          <option>Mensual</option>
        </select>
      </div>
      <div class="col-md-4">
        <label for="tipo_solicitud" class="control-label">Patente/Número de autorización:</label>
        <input class="form-control" type="text" name="" id="">
      </div>
      <div class="col-md-4">
        <div class="group-checkbox">
          <div>
            <label class="control-label" for="nombre_imp">Relación de sociedad: </label>
            <input class="form-check-input ms-3" type="checkbox" value="" id="flexCheckDefault">
          </div>
          <div>
            <label class="control-label" for="nombre_imp">Encargo conferido:</label>
            <input class="form-check-input ms-3" type="checkbox" value="" id="flexCheckDefault">
          </div>
        </div>

      </div>
    </div>


    @if (!datos_servicio) {
    <ng-titulo titulo="Datos del pedimento" />

    <div class="row" formGroupName="pedimento">
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="id_pedimento">Número de pedimento:</label>
          <input class="form-control" id="id_pedimento" placeholder="" type="text" formControlName="id_pedimento"
            [ngClass]="isValid(datos_importador_exportador,'rfc_import_export') ? 'required' : ''" appUppercase
            (blur)="busqueda_rfc()">
        </div>
      </div>
      <div class="col-md-4 d-flex align-items-center">
        <button type="button" class="btn btn-primary">Agregar</button>
      </div>
    </div>
    }


    <ng-titulo titulo="Mercancía" />
    <div class="row">
      <div class="col-md-4">
        <label for="tipo_solicitud" class="control-label">País de origen*:</label>
        <select class="form-control" id="tipo-solicitud">
          <option>Selecciona un valor</option>
          <option>Individual</option>
          <option>Semanal</option>
          <option>Mensual</option>
        </select>
      </div>

      <div class="col-md-4">
        <label for="tipo_solicitud" class="control-label">País de procedencia*:</label>
        <select class="form-control" id="tipo-solicitud">
          <option>Selecciona un valor</option>
          <option>Individual</option>
          <option>Semanal</option>
          <option>Mensual</option>
        </select>
      </div>

      <div class="col-md-8">
        <div class="form-group">
          <label for="tipo_solicitud" class="control-label">Descripción genérica*:</label>
          <textarea class="form-control" rows="3"></textarea>
        </div>
      </div>

      <div class="col-md-8">
        <div class="form-group">
          <label for="tipo_solicitud" class="control-label">Justificación*:</label>
          <textarea class="form-control" rows="3"></textarea>
        </div>
      </div>
    </div>


    <ng-titulo titulo="Personas responsables del despacho (máximo 5)" />

    <div class="row d-flex">
      <div class="col-md-4 form-group">
        <label class="control-label" for="nombre_imp">Gafete:</label>
        <input class="form-control" id="rfc_imp" placeholder="RFC" type="text">
      </div>
      <div class="col-md-4">
        <div class="btn-group">
          <button class="btn btn-default" type="button">Buscar</button>
          <button class="btn btn-primary ms-2" type="button">Agregar</button>
        </div>
      </div>
    </div>
 <ng-titulo titulo="Datos del vehículo de como se presentará al despacho" />

      <agregar-transporte tipo="'despacho'"></agregar-transporte>


      <ng-titulo titulo="Datos del transporte de arribo/salida (al/del) país" />
    <ng-titulo titulo="Pagos" />

    <div class="row rf">
      <div class="col-md-4 form-group">
        <label class="control-label" for="nombre_imp">Monto a pagar:</label>
        <input class="form-control" id="rfc_imp" placeholder="RFC" type="text">
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 form-group">
        <label class="control-label" for="nombre_imp">Línea de captura*:</label>
        <input class="form-control" id="rfc_imp" placeholder="RFC" type="text">
      </div>
      <div class="col-md-4 form-group">
        <label class="control-label" for="nombre_imp">Monto*:</label>
        <input class="form-control" id="rfc_imp" placeholder="RFC" type="text">
      </div>

    </div>

    <div class="row">
      <div class="col-md-8"></div>
      <div class="col-md-4">
        <div class="btn-group">
          <button class="btn btn-primario me-2" type="button">Consultar</button>
          <button class="btn btn-danger" type="button">Eliminar</button>
        </div>
      </div>
    </div>

    <div class="row">
      <p class="p-bold">A través del siguiente vinculo puedes ingresar a la página para generar la línea de captura de
        la
        constancia que se solicita:</p>
      <p>Generar línea de captura</p>
    </div>
  </form>
  }
</div>
