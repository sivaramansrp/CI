<div class="row">
  <div class="col-md-4">
    <div class="form-group">
      <label class="control-label" for="id_pedimento">Número de pedimento:</label>
      <input class="form-control" id="id_pedimento" placeholder="" type="text" [formControl]="pedimento"
        [ngClass]="isValid ? 'required' : ''" appSoloNumeros>
    </div>
  </div>
  <div class="col-md-4 d-flex align-items-center">
    <button type="button" class="btn btn-primary" (click)="agregaPedimento()">Agregar</button>
  </div>
</div>
