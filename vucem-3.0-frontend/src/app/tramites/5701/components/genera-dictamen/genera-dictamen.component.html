<div class="container rounded p-3 bg-light">
      <form [formGroup]="formDictamen">
        <div class="form">
          <div class="row ">
            <div class="col-md-12">
              <label class="control-label" for="sentidoDictamen">Sentido dictamen </label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="cumplimiento" value="a" id="sentidoDictamenAceptado">
              <label class="control-label" for="sentidoDictamen">Aceptado</label>
            </div>
            <div class="col-md-2">
              <input class="form-check-input me-3" type="radio" name="cumplimiento" value="aa" id="sentidoDictamenRechazado">
              <label class="control-label" for="sentidoDictamen">Rechazado</label>
            </div>
        </div>
        <div class="row">
            <div class="col-md-12">
                <label for="justificacionDictamen" class="form-label">Justificacion dictamen :</label>
                <textarea id="justificacionDictamen" class="form-control mb-4" placeholder="" ></textarea>
                </div>
        </div>

  
        </div>
      </form>
</div>
