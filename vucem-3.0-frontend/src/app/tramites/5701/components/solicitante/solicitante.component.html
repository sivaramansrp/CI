<div class="container">
  <ng-titulo titulo="Datos generales del solicitante" />

  <!-- Persona Fisica Nacional -->
  @if (nacional) {
  <form [formGroup]="FormPersonaFisica">
    <div class="form">
      @if (personaFisica) {
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="curp">CURP:
            </label>

            <input class="form-control" id="curp" placeholder="CURP" type="text" formControlName="curp">

          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="rfc">RFC:</label>
            <input class="form-control" id="rfc" placeholder="RFC" type="text" formControlName="rfc">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="nombre_razon_social">Nombre(s):</label>
            <input class="form-control" id="nombre_razon_social" placeholder="Nombre" type="text"
              formControlName="nombre_razon_social">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="aPaterno">Primer Apellido:</label>
            <input class="form-control" id="aPaterno" placeholder="Primer Apellido" type="text"
              formControlName="aPaterno">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="aMaterno">Segundo Apellido:</label>
            <input class="form-control" id="aMaterno" placeholder="Segundo Apellido" type="text"
              formControlName="aMaterno">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-8">
          <div class="form-group">
            <label class="control-label" for="actEconomica">Actividad económica preponderante:</label>
            <input class="form-control" id="actEconomica" placeholder="Nombre" type="text"
              formControlName="actEconomica">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="correo">Correo electrónico:</label>
            <input class="form-control" id="correo" placeholder="correo" type="text" formControlName="correo">
          </div>
        </div>
      </div>
      } @else {
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="rfc">RFC:</label>
            <input class="form-control" id="rfc" placeholder="RFC" type="text" formControlName="rfc">
          </div>
        </div>
        <div class="col-md-8">
          <div class="form-group">
            <label class="control-label" for="nombre_razon_social">Nombre(s):</label>
            <input class="form-control" id="nombre_razon_social" placeholder="Nombre" type="text"
              formControlName="nombre_razon_social">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-12">
          <div class="form-group">
            <label class="control-label" for="actEconomica">Actividad económica preponderante:</label>
            <input class="form-control" id="actEconomica" placeholder="Nombre" type="text"
              formControlName="actEconomica">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="correo">Correo electrónico:</label>
            <input class="form-control" id="correo" placeholder="correo" type="text" formControlName="correo">
          </div>
        </div>
      </div>

      }
    </div>

    <ng-titulo titulo="Domicilio fiscal del solicitante" />

    <div class="form">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="pais">País:</label>
            <input class="form-control" id="pais" placeholder="País" type="text" formControlName="pais">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="codigoPostal">Código postal:</label>
            <input class="form-control" id="codigoPostal" placeholder="CP" type="text" formControlName="codigoPostal">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="entidadFederativa">Estado:</label>
            <input class="form-control" id="entidadFederativa" placeholder="Estado" type="text"
              formControlName="entidadFederativa">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="municipio">Municipio o alcaldía:</label>
            <input class="form-control" id="municipio" placeholder="Municipio" type="text" formControlName="municipio">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="localidad">Localidad:</label>
            <input class="form-control" id="localidad" placeholder="Localidad" type="text" formControlName="localidad">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="colonia">Colonia:</label>
            <input class="form-control" id="colonia" placeholder="Colonia" type="text" formControlName="colonia">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-8">
          <div class="form-group">
            <label class="control-label" for="calle">Calle:</label>
            <input class="form-control" id="calle" placeholder="Calle" type="text" formControlName="calle">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="nExt">Número exterior:</label>
            <input class="form-control" id="nExt" placeholder="N Exterior" type="text" formControlName="nExt">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="nInt">Número interior:</label>
            <input class="form-control" id="nInt" placeholder="N Interior" type="text" formControlName="nInt">
          </div>
        </div>
        <div class="col-md-1">
          <div class="form-group">
            <label class="control-label" for="lada">Lada:</label>
            <input class="form-control" id="lada" placeholder="Lada" type="text" formControlName="lada">
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-group">
            <label class="control-label" for="telefono">Télefono:</label>
            <input class="form-control" id="telefono" placeholder="Teléfono" type="text" formControlName="telefono">
          </div>
        </div>
      </div>
    </div>
  </form>
  } @else {
  <!-- Persona Extranjera -->
  <form [formGroup]="FormExtranjero">
    <div class="form">

      @if(personaFisica) {
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="nombre_razon_social">Nombre(s):</label>
            <input class="form-control" id="nombre_razon_social" placeholder="Nombre" type="text"
              formControlName="nombre_razon_social">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="p_apellido">Primer Apellido:</label>
            <input class="form-control" id="p_apellido" placeholder="Primer Apellido" type="text"
              formControlName="p_apellido">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="s_apellido">Segundo Apellido:</label>
            <input class="form-control" id="s_apellido" placeholder="Segundo Apellido" type="text"
              formControlName="s_apellido">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="n_id_fiscal">Número de identificación fiscal:</label>
            <input class="form-control" id="n_id_fiscal" placeholder="correo" type="text" formControlName="n_id_fiscal">
          </div>

        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="n_seg_social">Número de seguro social:</label>
            <input class="form-control" id="n_seg_social" placeholder="correo" type="text"
              formControlName="n_seg_social">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="correo">Correo electrónico:</label>
            <input class="form-control" id="correo" placeholder="correo" type="text" formControlName="correo">
          </div>
        </div>
      </div>
      }
      @else {
      <div class="row">
        <div class="col-md-8">
          <div class="form-group">
            <label class="control-label" for="actEconomica">Actividad económica preponderante:</label>
            <input class="form-control" id="actEconomica" placeholder="Nombre" type="text"
              formControlName="actEconomica">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="correo">Correo electrónico:</label>
            <input class="form-control" id="correo" placeholder="correo" type="text" formControlName="correo">
          </div>
        </div>
      </div>
      }
    </div>

    <ng-titulo titulo="Domicilio fiscal del solicitante" />

    <div class="form">
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="pais">País:</label>
            <input class="form-control" id="pais" placeholder="País" type="text" formControlName="pais">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="codigoPostal">Código postal:</label>
            <input class="form-control" id="codigoPostal" placeholder="CP" type="text" formControlName="codigoPostal">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="estado">Estado:</label>
            <input class="form-control" id="estado" placeholder="Estado" type="text" formControlName="estado">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-8">
          <div class="form-group">
            <label class="control-label" for="calle">Calle:</label>
            <input class="form-control" id="calle" placeholder="Calle" type="text" formControlName="calle">
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="nExt">Número y/o letra exterior:</label>
            <input class="form-control" id="nExt" placeholder="N Exterior" type="text" formControlName="nExt">
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label class="control-label" for="nInt">Número interior:</label>
            <input class="form-control" id="nInt" placeholder="N Interior" type="text" formControlName="nInt">
          </div>
        </div>
      </div>
    </div>
  </form>
  }

</div>
