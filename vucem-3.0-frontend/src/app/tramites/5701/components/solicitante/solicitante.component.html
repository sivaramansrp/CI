<div class="container">

  <ng-titulo titulo="Datos generales del solicitante" />

  <div class="form">
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="curp">CURP:</label>
          <input class="form-control" id="curp" placeholder="CURP" type="text">
          <button type="button" class="btn btn-default" data-toggle="tooltip" data-placement="top"
            title="Tooltip en la izquierda">Tooltip en la izquierda</button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="rfc">RFC:</label>
          <input class="form-control" id="rfc" placeholder="RFC" type="text">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="nombre">Nombre(s):</label>
          <input class="form-control" id="nombre" placeholder="Nombre" type="text">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="a_paterno">Primer Apellido:</label>
          <input class="form-control" id="a_paterno" placeholder="Primer Apellido" type="text">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="a_materno">Segundo Apellido:</label>
          <input class="form-control" id="a_materno" placeholder="Segundo Apellido" type="text">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-8">
        <div class="form-group">
          <label class="control-label" for="act_economica">Actividad económica preponderante:</label>
          <input class="form-control" id="act_economica" placeholder="Nombre" type="text">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="correo">Correo electrónico:</label>
          <input class="form-control" id="correo" placeholder="correo" type="text">
        </div>
      </div>
    </div>
  </div>

  <ng-titulo titulo="Domicilio fiscal del solicitante" />

  <div class="form">
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="curp">País:</label>
          <input class="form-control" id="curp" placeholder="País" type="text">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="rfc">Código postal:</label>
          <input class="form-control" id="rfc" placeholder="CP" type="text">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="rfc">Estado:</label>
          <input class="form-control" id="rfc" placeholder="Estado" type="text">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="nombre">Municipio o alcaldía:</label>
          <input class="form-control" id="nombre" placeholder="Municipio" type="text">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="a_paterno">Localidad:</label>
          <input class="form-control" id="a_paterno" placeholder="Localidad" type="text">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="a_materno">Colonia:</label>
          <input class="form-control" id="a_materno" placeholder="Colonia" type="text">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-8">
        <div class="form-group">
          <label class="control-label" for="act_economica">Calle:</label>
          <input class="form-control" id="act_economica" placeholder="Calle" type="text">
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="n_ext">Número exterior:</label>
          <input class="form-control" id="n_ext" placeholder="N Exterior" type="text">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4">
        <div class="form-group">
          <label class="control-label" for="n_int">Número interior:</label>
          <input class="form-control" id="n_int" placeholder="N Interior" type="text">
        </div>
      </div>
      <div class="col-md-1">
        <div class="form-group">
          <label class="control-label" for="lada">Lada:</label>
          <input class="form-control" id="lada" placeholder="Lada" type="text">
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-group">
          <label class="control-label" for="telefono">Télefono:</label>
          <input class="form-control" id="telefono" placeholder="Teléfono" type="text">
        </div>
      </div>
    </div>
  </div>

</div>
