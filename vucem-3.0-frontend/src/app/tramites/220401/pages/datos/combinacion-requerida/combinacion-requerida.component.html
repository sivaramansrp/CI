<div class="container form-container">
    <h4 class="form-title">Combinación Requerida</h4>
    <hr class="red">
    <form>
        <div class="row mb-3">
            <div class="col-md-4">
                <label for="especie" class="form-label">Especie*</label>
                <select class="form-select" id="especie" required>
                    <option selected>Selecciona un valor</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="funcion" class="form-label">Función Zootécnica*</label>
                <select class="form-select" id="funcion" required>
                    <option selected>Selecciona un valor</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="mercancia" class="form-label">Mercancía*</label>
                <select class="form-select" id="mercancia" required>
                    <option selected>Selecciona un valor</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label for="paisDestino" class="form-label">País Destino*</label>
                <select class="form-select" id="paisDestino" required>
                    <option selected>Selecciona un valor</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <label for="nombreEstablecimiento" class="form-label">Nombre, Denominación o Razón Social*</label>
                <select class="form-select" id="nombreEstablecimiento" required>
                    <option selected>Selecciona un valor</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <label for="tipoActividad" class="form-label">Tipo de Actividad del Establecimiento*</label>
                <select class="form-select" id="tipoActividad" required>
                    <option selected>Selecciona un valor</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="otro" class="form-label">Otro</label>
                <input type="text" class="form-control" id="otro">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                    <label for="establecimientoAutorizado" class="form-label">Establecimiento de Origen Autorizado*</label>
                    <div class="d-flex d-flex p-5 fs-5">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="nombreEstablecimientoCheck">
                            <label class="form-check-label" for="nombreEstablecimientoCheck">Nombre del Establecimiento</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="numeroAutorizacionCheck">
                            <label class="form-check-label" for="numeroAutorizacionCheck">Número de Autorización</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="tipoActividadCheck">
                            <label class="form-check-label" for="tipoActividadCheck">Tipo de Actividad del Establecimiento</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="otroCheck">
                            <label class="form-check-label" for="otroCheck">Otro</label>
                        </div>
                    </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <label for="aduanaSalida" class="form-label">Aduana de Salida/Lugar de Embarque*</label>
                <select class="form-select" id="aduanaSalida" required>
                    <option selected>Selecciona un valor</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <label for="oisaSalida" class="form-label">OISA de Salida*</label>
                <select class="form-select" id="oisaSalida" required>
                    <option selected>Selecciona un valor</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <label for="regimenMercancia" class="form-label">Régimen al que se Destinará la Mercancía*</label>
                <select class="form-select" id="regimenMercancia" required>
                    <option selected>Selecciona un valor</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <label for="paisOrigen" class="form-label">País Origen*</label>
                <select class="form-select" id="paisOrigen" required>
                    <option selected>MÉXICO (ESTADOS UNIDOS MEXICANOS)</option>
                    <option value="1">Opción 1</option>
                    <option value="2">Opción 2</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="fechaArribo" class="form-label">Fecha Arribo País Importador</label>
                <input type="date" class="form-control" id="fechaArribo">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label for="puntoIngreso" class="form-label">Punto de Ingreso al País Destino</label>
                <input type="text" class="form-control" id="puntoIngreso">
            </div>
        </div>
    </form>
</div>
