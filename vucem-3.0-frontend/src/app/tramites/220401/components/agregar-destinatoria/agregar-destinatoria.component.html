<div class="container">
    <ng-titulo titulo="Agregar destinatario (destino final)" />
    
    <div class="mb-3">
      <label class="form-label">Tipo persona*:</label>
      <div>
        <input type="radio" id="fisica" name="tipoPersona" checked>
        <label for="fisica">Física</label>
        <input type="radio" id="moral" name="tipoPersona" class="ms-3">
        <label for="moral">Moral</label>
      </div>
    </div>

    <ng-titulo titulo="Datos personales" />
    <!-- <h5 class="section-title">Datos personales</h5> -->
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Nombre(s)*:</label>
        <input type="text" class="form-control">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Primer apellido*:</label>
        <input type="text" class="form-control">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Segundo apellido:</label>
        <input type="text" class="form-control">
      </div>
    </div>
    
    <div class="row">
      <div class="col-md-4 mb-3">
        <select-catalogos [catalogosDatos]="pais"
                         (valorSeleccion)="docSeleccionado($event)">
        </select-catalogos>
      </div>
    </div>

    <div class="row">
        <div class="col-md-8 mb-3">
            <label class="form-label">Domicilio*:</label>
            <textarea class="form-control" rows="2" height="50" placeholder="Calle, No Ext, No Int, Ciudad, C.P."></textarea>
        </div>
    </div>
    
    <div class="row">
      <div class="col-md-1 mb-3">
        <label class="form-label">Lada:</label>
        <input type="text" class="form-control">
      </div>
      <div class="col-md-3 mb-3">
        <label class="form-label">Teléfono:</label>
        <input type="text" class="form-control">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Correo electrónico:</label>
        <div class="input-group">
          <input type="email" class="form-control">
          <span class="input-group-text"></span>
        </div>
      </div>
    </div>
  </div>
