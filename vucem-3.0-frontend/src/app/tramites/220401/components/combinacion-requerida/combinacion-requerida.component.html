<div class="container form-container">
    <ng-titulo titulo="Combinación Requerida" />
    <form>
        <div class="row mb-3">
            <div class="col-md-4">
                <select-catalogos [catalogosDatos]="especie"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
            <div class="col-md-4">
                <select-catalogos [catalogosDatos]="funcionZootecnica"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
            <div class="col-md-4">
                <select-catalogos [catalogosDatos]="mercancia"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <select-catalogos [catalogosDatos]="paisDestino"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <select-catalogos [catalogosDatos]="nombreEstablecimiento"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <select-catalogos [catalogosDatos]="tipoActividad"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
            <div class="col-md-4">
                <label for="otro" class="form-label">Otro</label>
                <input type="text" class="form-control" id="otro">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                    <label for="establecimientoAutorizado" class="form-label">Establecimiento de Origen Autorizado*</label>
                    <div class="d-flex d-flex p-5 fs-5">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="nombreEstablecimientoCheck">
                            <label class="form-check-label" for="nombreEstablecimientoCheck">Nombre del Establecimiento</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="numeroAutorizacionCheck">
                            <label class="form-check-label" for="numeroAutorizacionCheck">Número de Autorización</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="tipoActividadCheck">
                            <label class="form-check-label" for="tipoActividadCheck">Tipo de Actividad del Establecimiento</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="otroCheck">
                            <label class="form-check-label" for="otroCheck">Otro</label>
                        </div>
                    </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <select-catalogos [catalogosDatos]="aduanaSalida"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <select-catalogos [catalogosDatos]="oisaSalida"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <select-catalogos [catalogosDatos]="regimenMercancia"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-8">
                <select-catalogos [catalogosDatos]="paisOrigen"
                                  (valorSeleccion)="docSeleccionado($event)">
                </select-catalogos>
            </div>
            <div class="col-md-4">
                <label for="fechaArribo" class="form-label">Fecha Arribo País Importador</label>
                <input type="date" class="form-control" id="fechaArribo">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label for="puntoIngreso" class="form-label">Punto de Ingreso al País Destino</label>
                <input type="text" class="form-control" id="puntoIngreso">
            </div>
        </div>
    </form>
</div>
