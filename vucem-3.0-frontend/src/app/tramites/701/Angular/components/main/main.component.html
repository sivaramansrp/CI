<main class="page">
    <div class="container">
        <!-- Breadcrumb Solicitudes Component -->
        <app-breadcrumb-solicitudes></app-breadcrumb-solicitudes>

        <!-- Header Component -->
        <app-header></app-header>

        <div id="content_tramite">
            <div id="workingArea">
                <div class="row" id="tituloTramite" *ngIf="title">
                    <div class="col-md-8">
                        <h1 id="h1_title" *ngIf="title.length < 50; else h2Title" class="mb-0">
                            {{ title }}
                        </h1>
                        <ng-template #h2Title>
                            <h2 id="h1_title" *ngIf="title.length >= 50 && title.length < 150; else h3Title" class="mb-0">
                                {{ title }}
                            </h2>
                        </ng-template>
                        <ng-template #h3Title>
                            <h3 id="h1_title" class="mb-0">
                                {{ title }}
                            </h3>
                        </ng-template>
                    </div>
                </div>
                <br />

                <div class="alert alert-warning" id="businessWarnings" *ngIf="businessWarnings" style="margin-bottom:15px; margin-top:64px;"></div>
                <div class="alert alert-danger" id="errorCampos" *ngIf="errorCampos" style="margin-bottom:15px; margin-top:64px;"></div>

                <div class="row" *ngIf="hasMessagesOrValidationErrors" style="margin-top:64px;">
                    <div class="col-md-12 text-center mb-4" id="notification">
                        <app-notification></app-notification>
                    </div>
                </div>
                <app-working-area></app-working-area>
            </div>
        </div>
        <div id="footer">
            <app-footer></app-footer>
        </div>
    </div>
</main>
