<form [formGroup]="tipoDocumentosForm" (ngSubmit)="guardarTipoDoctos()">
  <input type="hidden" formControlName="solicitud.idSolicitud" id="idSol" />
  <input type="hidden" formControlName="solicitud.esNuevo" id="idEsNuevo" />

  <div id="alertsDocumentos" class="row col-md-12" [ngStyle]="{'display': showAlerts ? 'block' : 'none'}">
    <div>
      <p id="parrafoError">{{ mensajeError }}</p>
    </div>
  </div>

  <app-encabezado-wizard-captura></app-encabezado-wizard-captura>

  <div id="divDoctosEspecificos" class="row">
    <div class="col-md-12">
      <h3>Especificos</h3>
      <hr class="red" />
      <p>
        Si usted necesita anexar más de un documento del mismo tipo selecciónelo de la lista y presione "Agregar nuevo"
      </p>
      <label for="selectDoctosEspecificos">Tipo de Documento:</label>
    </div>

    <div class="col-md-6">
      <select
        formControlName="tipoDocumento"
        class="form-control"
        id="selectDoctosEspecificos"
      >
        <option *ngFor="let documento of documentos" [value]="documento.id">
          {{ documento.nombre }}
        </option>
      </select>
    </div>

    <div class="col-md-2">
      <button type="button" class="btn btn-primary" (click)="addDoctoEspecifico()">
        Agregar nuevo
      </button>
    </div>

    <div class="innercontainer col-md-12" style="margin-top:5%;">
      <table id="tablaDatosGenerales" class="table table-bordered" width="100%" align="center">
        <tr>
          <td>
            <table id="jqgridDoctosEspecificos" class="table table-striped" width="100%">
              <thead>
                <tr>
                  <th>Documento</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let docto of doctosEspecificos">
                  <td>{{ docto.nombre }}</td>
                  <td>
                    <button type="button" class="btn btn-danger" (click)="eliminarDocto(docto.id)">
                      Eliminar
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </td>
        </tr>
      </table>
    </div>

    <div class="col-md-2">
      <button type="button" class="btn btn-danger" id="deleteButton" (click)="eliminarSeleccionados()">
        Eliminar
      </button>
    </div>

    <div class="col-md-12">
      <button type="submit" class="btn btn-primary float-right">
        Continuar
      </button>
      <button type="button" class="btn btn-default float-right mr-2" (click)="anterior()">
        Anterior
      </button>
      <input type="hidden" formControlName="elementoWizard.anteriorTmp" />
    </div>
  </div>
</form>
