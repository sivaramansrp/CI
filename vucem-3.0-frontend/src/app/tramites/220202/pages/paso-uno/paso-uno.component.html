<div class="container">
  <div class="row">
    <ul class="nav nav-tabs">
      <ul class="nav nav-tabs">
        <li
          *ngFor="let tab of cortina_A_la_italiana"
          [ngClass]="indice === tab.index ? 'active' : ''"
        >
          <a
            data-toggle="tab"
            tabindex="0"
            (click)="seleccionaTab(tab.index)"
            (keydown.enter)="seleccionaTab(tab.index)"
            >{{ tab.title }}</a
          >
        </li>
      </ul>
    </ul>
    <ng-container>
      @switch (indice) { @case (1) {
      <app-solicitante></app-solicitante>
      } @case (2) {
      <app-datos-de-la-solicitud></app-datos-de-la-solicitud>
      } @case (3) {
      <app-datos-para-movilizacion-nacional></app-datos-para-movilizacion-nacional>
      } @case (4) {
      <app-terceros-relacionados></app-terceros-relacionados>
      } @case (5) {
      <app-pago-de-derechos></app-pago-de-derechos>
      } }
    </ng-container>
  </div>
</div>
