<div class="container">
  <div class="row">
    <div class="col-md-12">
      <ng-titulo titulo="Importador en destino" />
    </div>
    <form [formGroup]="importadorForm">
      <div class="row mt-5">
        <div class="col-md-6">
          <div class="form-group">
            <select-catalogos [catalogosDatos]="tipo"></select-catalogos>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="Cantidad-total"
              >Valor (sin espacios, sin guiones)*:</label
            >
            <input
              class="form-control"
              value=""
              class="form-control"
              id="Cantidad-total"
              placeholder=""
              type="text"
              appUppercase
              name="Cantidad-total"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="Razón-social">Razón social*:</label>
            <input
              class="form-control"
              value=""
              class="form-control"
              id="Razón-social"
              placeholder=""
              type="text"
              appUppercase
              name="Razón-social"
            />
          </div>
        </div>
        <div class="col-md-6"></div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="Domicilio">Domicilio*:</label>
            <input
              class="form-control"
              value=""
              class="form-control"
              id="Domicilio"
              placeholder=""
              type="text"
              appUppercase
              name="Domicilio"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="ciudad"
              >Ciudad (población, estado o provincia)*:</label
            >
            <input
              class="form-control"
              value=""
              class="form-control"
              id="ciudad"
              placeholder=""
              type="text"
              appUppercase
              name="ciudad"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="cp">C P*:</label>
            <input
              class="form-control"
              value=""
              class="form-control"
              id="cp"
              placeholder=""
              type="text"
              appUppercase
              name="cp"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label class="form-label" for="País">País*:</label>
            <input
              class="form-control"
              value=""
              class="form-control"
              id="País"
              placeholder=""
              type="text"
              appUppercase
              name="País"
            />
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
