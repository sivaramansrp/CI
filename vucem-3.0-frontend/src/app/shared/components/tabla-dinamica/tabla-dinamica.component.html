<div class="table-responsive table-wrapper">  
    <table class="table table-striped table-bordered ">
      <thead>
        <tr>
          @if(tablaSeleccion === 'RADIO') {
            <th></th>
          }
          <!-- Crear el encabezado de manera dinámica -->
          <th *ngFor="let col of obtenerConfiguracionOrdenada()">
            {{ col.encabezado }}
          </th>
        </tr>
      </thead>
      <tbody>
        <!-- Crear las filas de manera dinámica -->
        <tr *ngFor="let fila of datos;let i=index">
          <!-- Botón de radio para seleccionar una fila -->
           @if(tablaSeleccion === 'RADIO') {
            <td *ngIf="tablaSeleccion === 'RADIO'">
              <input 
                class="cursor-pointer"
                type="radio" 
                name="filaSeleccionada" 
                [(ngModel)]="idFilaSeleccionada" 
                [value]="i" 
                (change)="seleccionarFila(i, fila)"
                [checked]="idFilaSeleccionada === i"
              />
            </td>
    
           }
          
          <!-- Renderizar cada columna de manera dinámica utilizando la función 'clave' -->
          <td *ngFor="let col of obtenerConfiguracionOrdenada()">
            {{ col.clave(fila) || ' ' }}
          </td>
        </tr>
      </tbody>
    </table>
  
  </div>
