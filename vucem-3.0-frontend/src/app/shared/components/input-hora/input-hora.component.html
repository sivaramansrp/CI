<div class="form-group">
  <label class="control-label" for="calendar">{{datosHora.labelNombre}} {{datosHora.required ? '*' : ''}}:</label>
  <input class="form-control" type="text" name="hora" id="hora" [formControl]="hora" placeholder="00:00 (24 hrs)"
    HoraFormato [ngClass]="isValid ? 'required' : ''" (blur)="onBlurEvent()">
</div>
