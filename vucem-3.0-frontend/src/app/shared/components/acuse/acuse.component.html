<div class="container">
  <div class="row">
    <div class="col-md 6">
      <h1>Acuse de recibo</h1>
    </div>
  </div>

  <div class="row">
    <div class="col-md-12">
      <ng-alert [CONTENIDO]="txtAlerta"></ng-alert>
    </div>
  </div>

  <div class="row">
    <div class="col-md-12">
      <ng-titulo [titulo]="subtitulo"></ng-titulo>

      <table class="table table-striped">
        <thead>
          <tr>
            @for (item of encabezadoTablaAcuse; track $index) {
            <th>{{ item.valor }}</th>
            }
            <th class="center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (row of datosTablaAcuse; track $index) {
          <tr>
            @for (item of encabezadoTablaAcuse; track item.key; let i = $index) {
            <td>{{ row[item.key] }}</td>
            }
            <!-- <td class="center">
              <button type="button" class="btn btn-link me-2" [id]="accion.tipo" data-bs-toggle="button"
                data-bs-placement="top" [title]="accion.label" (click)="verPDF()">
                <i class="bi bi-c" [ngClass]="accion.icono"></i>
              </button>
            </td> -->

          </tr>
          }
        </tbody>
      </table>

      <!-- <app-tabla [encabezadosTabla]="encabezadoTablaAcuse" [datosTabla]="datosTablaAcuse"
        [accionesTabla]="accionesTablaAcuse"></app-tabla> -->
    </div>
  </div>
</div>
