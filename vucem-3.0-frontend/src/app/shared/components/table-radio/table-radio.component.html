<div class="table-responsive" [ngClass]="{'enable-scrollbar': enableScrollbar}">
    <table class="table">
        <thead>
            <tr>
                <th scope="col">
                    
                </th>
                @for (item of tableData.tableHeader; track $index) {
                    <th scope="col">{{item}}</th>
    
                }
            </tr>
        </thead>
        <tbody>
            @for (data of tableData.tableBody; track $index) {
                <tr>
                    <td><input name="element" type="radio" aria-label="Select Row"></td>
                    @for (element of data.tbodyData; track $index) {
                        <td>{{element}}</td>
                    }
                </tr>
            }
        </tbody>
    </table>
</div>
