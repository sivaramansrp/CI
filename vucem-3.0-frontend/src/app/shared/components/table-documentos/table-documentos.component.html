<div class="row">
  <div class="col-sm-12">
    <table class="table table-responsive">
      <thead>
        <tr>
          <th class="th-center" colspan="2">
            Tipo de documento
          </th>
          <th>
            Documento
          </th>
          <th>
            Acciones
          </th>
        </tr>
      </thead>
      <tbody>
        @for (item of listaDocumentos; track item.id; let i = $index) {
        <tr>
          <td>{{i + 1}}</td>
          <td> {{ item.value }} </td>
          <td>
            <select name="" id=""></select>
          </td>
          <td>
            <button class="btn btn-link" (click)="verDocumento(i)" [disabled]="!item.acciones.ver">
              <i class="bi bi-eye bi-c"></i>
            </button>

            <button type="button" class="btn btn-link" [disabled]="!item.acciones.cargar"
              (click)="abrirVentanaCargaDoc()" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"
              aria-controls="offcanvasRight">
              <i class="bi bi-cloud-arrow-up bi-c"></i>
            </button>
          </td>
        </tr>
        }

      </tbody>
    </table>
  </div>
</div>

<div class="offcanvas offcanvas-size-xl offcanvas-end" data-bs-backdrop="static" tabindex="-1" id="offcanvasRight"
  aria-labelledby="offcanvasRightLabel">
  <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasRightLabel">Adjuntar documentos</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div class="colsm-12">
      <table class="table table-responsive">
        <thead>
          <tr>
            <th>Tipo de Documento</th>
            <th>Tamaño máximo permitido (MB)</th>
            <th>Resolución mínima de las imagenes contenidas (DPIs)</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>


        </tbody>
      </table>

    </div>


  </div>
  <div class="offcanvas-footer">
    <button type="button" (click)="adjuntar()" class="btn btn-primary">Adjuntar</button>
  </div>
</div>
