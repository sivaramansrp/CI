
<div class="d-flex justify-content-between align-items-center">

  <div class="d-flex align-items-center">
    <label class="me-2">Pagina</label>
    <select class="form-select" (change)="onItemsPerPageChange($event)">
      <option *ngFor="let option of [5, 10, 20, 50]" [selected]="option === itemsPerPage">
        {{ option }}
      </option>
    </select>
    <label class="ms-2">de</label>
  </div>
  
  <nav *ngIf="totalPages > 1">
      <ul class="pagination justify-content-center">
        <!-- Previous -->
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1">Previous</button>
        </li>
    
        <!-- Page Numbers -->
        <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index">
          <button class="page-link" (click)="onPageChange(i + 1)" [class.active]="currentPage === i + 1">{{ i + 1 }}</button>
        </li>
    
        <!-- Next -->
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="onPageChange(currentPage + 1)" [disabled]="currentPage === totalPages">Next</button>
        </li>
      </ul>
    </nav>
    

</div>
