<div [formGroup]="formSelect">
    <label for="{id}" class="form-label" *ngIf="label">{{ label }} @if (required) {*}:
        @if(tooltipQuestionCircle){ <span class="bi bi-question-circle-fill" title="{{catalogosDatos.labelNombre}}"
        data-bs-toggle="tooltip"></span>}
    </label>
    <select class="form-control" [id]="id" formControlName="selectControl" (change)="handleChange($event)" [ngClass]="isInvalid() ? 'required' : ''">
        <option value="" disabled selected>Seleccione una opción</option>
        <option *ngFor="let option of catalogo" [value]="option.id">{{ option.descripcion }}</option>
    </select>
    <div *ngIf="isInvalid()" class="mensaje-error">
        Este campo es obligatorio.
    </div>
</div>
