<table class="table table-striped">
  <thead>
    <tr>
      @for (item of encabezadosTabla; track $index) {
      <th>{{ item.valor }}</th>
      }
      <th class="center">Acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (row of datosTabla; track $index) {
    <tr>
      @for (item of encabezadosTabla; track item.key; let i = $index) {
      <td>{{ row[item.key] }}</td>
      }
      @if (accionesTabla.length) {
      <td class="center">
        @for (accion of accionesTabla; track $index) {
        <button type="button" class="btn btn-link me-2" [id]="accion.tipo" data-bs-toggle="button"
          data-bs-placement="top" [title]="accion.label" (click)="onAccion()">
          <i class="bi bi-c" [ngClass]="accion.icono"></i>
        </button>
        }
      </td>
      }
    </tr>
    }
  </tbody>
</table>
