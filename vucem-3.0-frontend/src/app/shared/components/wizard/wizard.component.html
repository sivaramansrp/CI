<div class="row">
    <div class="col-md-12 hidden-xs">
        <ul class="wizard-steps">
            @for (item of lista; track item; let i = $index) {
                <li class="wizard-item">
                    <h5>Paso {{i + 1}}</h5>
                    <span> {{item.titulo}} </span>

                </li>

            }
        </ul>
    </div>
</div>
