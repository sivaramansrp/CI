<div class="rows" [formGroup]="FormCertificado">
  <div class="col-md-4">
    <div class="input-group">
       <label for="cer">Certificado (cer)*:</label>
      <input type="file" class="form-control" id="cer"  (change)="onCertFileChange($event)" accept=".cer">
    </div>
    <div class="input-group">
       <label for="key">Clave privada (key)*:</label>
      <input type="file" class="form-control" id="key" (change)="onKeyFileChange($event)" accept=".key">
    </div>
    <div class="input-group">
       <label for="password">Contraseña de clave privada*:</label>
      <input type="password" class="form-control" id="password" formControlName="password">

      <div>
        {{validation_message}}
      </div>
    </div>

    <button type="button" class="btn btn-primary mt-4" (click)="validarCertificado()">Firmar</button>
  </div>


</div>
