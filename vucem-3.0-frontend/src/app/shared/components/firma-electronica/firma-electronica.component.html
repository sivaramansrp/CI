<div class="rows">
  <form action="" [formGroup]="FormCertificado" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label class="form-label" for="cer">Certificado (cer)*:</label>
      <input type="file" class="form-control" id="cer" (change)="handleFile('cer', $event)" accept=".cer">
    </div>
    <div class="form-group">
      <label class="form-label" for="key">Clave privada (key)*:</label>
      <input type="file" class="form-control" id="key" (change)="handleFile('key', $event)" accept=".key">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Contraseña de clave privada*:</label>
      <input type="password" class="form-control" [ngClass]="isValid('password') ? 'required' : ''" id="password"
        formControlName="password">
    </div>

    <div class="row">
      <div class="col-md-12 d-flex justify-content-end mt-3">
        @if (login) {
        <button type="submit" class="btn btn-primary me-2">Ingresar</button>
        <button type="button" class="btn btn-default">Registrarse</button>
        } @else {
        <button type="submit" class="btn btn-primary mt-4">Firmar</button>
        }
      </div>
    </div>
  </form>
</div>
