@if (catalogosPaises) {
<label for="tipoSolicitud" class="form-label">
  {{catalogosPaises.labelNombre}}
  @if (catalogosPaises.required) {*}:
</label>
<select class="form-control" id="tipo-solicitud" [formControl]="pais" (change)="seleccion()"
  [ngClass]="isValid() ? 'required' : ''">
  <option value=0 disabled>Selecciona un valor</option>
  @for (item of catalogosPaises.catalogos; track $index)
  {
  <option value={{item.id}}>{{item.nombre}}</option>
  }
</select>
}
