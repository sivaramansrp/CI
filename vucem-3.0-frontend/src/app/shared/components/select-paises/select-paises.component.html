<div [formGroup]="formSelect">
  <label for="{id}" class="form-label" *ngIf="label">{{ label }} @if (required) {*}:</label>
  <select class="form-control" [id]="id" formControlName="selectControl" (change)="handleChange($event)" [ngClass]="isInvalid() ? 'required' : ''">
      <option value="" disabled selected>Seleccione una opción</option>
      <option *ngFor="let option of catalogosPaises" [value]="option.id">{{ option.nombre }}</option>
  </select>
  <div *ngIf="isInvalid()" class="mensaje-error">
      Este campo es obligatorio.
  </div>
</div>
