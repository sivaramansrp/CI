name: Deploy Dashboard QA

on:
  workflow_dispatch:

jobs:
  build-and-push-qa:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-image-tag.outputs.TAG }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker image tag
        id: set-image-tag
        # You can adapt this line if you want to use a different tag, such as a commit SHA, timestamp, or branch name.
        # Here, we use package.json version + '-qa' for clarity, but you could use just 'qa-latest' or similar.
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="$VERSION-qa"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Update Docker Compose image tag (QA)
        run: |
          sed -i "s|image: ghcr.io/vucem30/dockerized-modulefederation-dashboard:.*|image: ghcr.io/vucem30/dockerized-modulefederation-dashboard:${{ steps.set-image-tag.outputs.TAG }}|g" docker/qa/modulefederation-dashboard.yml

      - name: Build Docker image for dashboard QA
        run: |
          docker compose -f docker/qa/modulefederation-dashboard.yml build --no-cache

      - name: Push Docker QA image
        run: |
          docker push ghcr.io/vucem30/dockerized-modulefederation-dashboard:${{ steps.set-image-tag.outputs.TAG }}

  deploy-qa:
    needs: build-and-push-qa
    runs-on: ubuntu-latest
    environment:
      name: qa
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker image tag
        id: set-image-tag
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="$VERSION-qa"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Update image tag in QA deployment YAML
        run: |
          sed -i "s|image: ghcr.io/vucem30/dockerized-modulefederation-dashboard:.*|image: ghcr.io/vucem30/dockerized-modulefederation-dashboard:${{ steps.set-image-tag.outputs.TAG }}|g" k8s/qa/dashboard/dashboard-deployment-qa

      - name: Copy QA deployment YAMLs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_QA_SRV_IP }}
          username: ${{ secrets.REMOTE_QA_SRV_USER }}
          key: ${{ secrets.REMOTE_QA_SRV_PRIV_KEY }}
          source: |
            k8s/qa/dashboard/dashboard-deployment-qa
            k8s/qa/dashboard/dashboard-service-qa.yaml
            k8s/qa/dashboard/dashboard-ingress-qa.yaml
          target: ~/deployments/dashboard-qa/
          strip_components: 3

      - name: List files on remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_QA_SRV_IP }}
          username: ${{ secrets.REMOTE_QA_SRV_USER }}
          key: ${{ secrets.REMOTE_QA_SRV_PRIV_KEY }}
          script: |
            ls -l ~/deployments/dashboard-qa/

      - name: Deploy to Kubernetes QA
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_QA_SRV_IP }}
          username: ${{ secrets.REMOTE_QA_SRV_USER }}
          key: ${{ secrets.REMOTE_QA_SRV_PRIV_KEY }}
          script: |
            cd ~/deployments/dashboard-qa/
            # Make sure the image was updated
            grep "image: ghcr.io/vucem30/dockerized-modulefederation-dashboard:${{ steps.set-image-tag.outputs.TAG }}" dashboard-deployment-qa

            # Deploy in order: deployment, service, ingress
            microk8s kubectl apply -f dashboard-deployment-qa
            microk8s kubectl apply -f dashboard-service-qa.yaml
            microk8s kubectl apply -f dashboard-ingress-qa.yaml

            # Restart pods for new image
            microk8s kubectl rollout restart deployment modulefederation-dashboard-deployment-qa -n default
            microk8s kubectl rollout status deployment modulefederation-dashboard-deployment-qa -n default
            microk8s kubectl get pods | grep dashboard
