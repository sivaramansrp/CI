name: CI/CD deploy-vucem30-front

on:
  workflow_dispatch:

  push:
    branches: [ "develop" ]
    paths:
      - 'vucem-3.0-frontend/**'

jobs:
  deploy:
    name: Deploy deploy-vucem30-front and build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd vucem-3.0-frontend
          npm install -g @angular/cli@17.3.11

      - name: Build Angular project
        run: |
          cd vucem-3.0-frontend
          npm run build --configuration=production

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Packages
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v2
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./vucem-3.0-frontend/
          # Note: tags has to be all lower-case
          tags: |
            ghcr.io/vucem30/dockerized-front-vucem30:latest
          # build on feature branches, push only on develop branch
          push: ${{ github.ref == 'refs/heads/develop' }}

      - name: Execute remote command (last one)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/vucem-3.0-frontend
            microk8s kubectl rollout restart deployment front-vucem30-deployment-dev
