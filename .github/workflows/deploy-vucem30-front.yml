name: CI/CD VUCEM Microfrontends
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      deployment_mode:
        description: 'Deployment mode'
        required: true
        default: 'changed'
        type: choice
        options:
          - changed
          - selected
          - all
      selected_apps:
        description: 'Select apps to deploy (comma-separated, only used when deployment_mode is "selected")'
        required: false
        default: 'dashboard'
        type: string
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'docker/**'
      - 'package.json'
      - 'nx.json'
      - '.github/workflows/**'

env:
  NODE_VERSION: '20'
  NX_VERSION: '16.10.0'
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository_owner }}/vucem-front
  ALL_APPS: 'dashboard,login,aga,agriculture,se,semarnat,agace,funcionario,cofepris,amecafe,sener'
  # Variables para controlar problemas de NX
  NX_SKIP_NX_CACHE: 'true'
  NX_NATIVE_BINDINGS: 'false'

jobs:
  setup:
    name: Setup and Check Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      changed_apps: ${{ steps.detect-changes.outputs.changed_apps }}
      final_apps: ${{ steps.determine-apps.outputs.final_apps }}
      apps_matrix: ${{ steps.matrix-prep.outputs.apps_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NX globally
        run: npm install -g nx@${{ env.NX_VERSION }}

      - name: Detect changed apps
        id: detect-changes
        run: |
          # En caso de workflow_dispatch, no necesitamos detectar cambios si no es modo 'changed'
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.deployment_mode }}" != "changed" ]; then
            echo "changed_apps=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Para push events, necesitamos encontrar el commit antes
          BEFORE_COMMIT=""
          if [ "${{ github.event.before }}" != "" ]; then
            BEFORE_COMMIT="${{ github.event.before }}"
          else
            # Si no hay before commit, usar HEAD~1
            BEFORE_COMMIT=$(git rev-parse HEAD~1)
          fi
          
          # Detect changes in apps directory
          CHANGED_FILES=$(git diff --name-only $BEFORE_COMMIT ${{ github.sha }} | grep -E '^apps/' || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            # Check for changes in shared libs that would affect all apps
            SHARED_CHANGES=$(git diff --name-only $BEFORE_COMMIT ${{ github.sha }} | grep -E '^libs/shared/' || echo "")
            if [ -n "$SHARED_CHANGES" ]; then
              # If shared libs changed, mark all apps as changed
              CHANGED_APPS="${{ env.ALL_APPS }}"
            else
              CHANGED_APPS=""
            fi
          else
            # Extract the app names from changed files
            CHANGED_APPS=$(echo "$CHANGED_FILES" | grep -oP 'apps/\K[^/]+' | sort -u | tr '\n' ',' | sed 's/,$//')
          
            # Always include dashboard when any app changes
            if [ -n "$CHANGED_APPS" ] && [[ ! "$CHANGED_APPS" =~ "dashboard" ]]; then
              CHANGED_APPS="dashboard,$CHANGED_APPS"
            fi
          fi
          
          echo "Changed apps: $CHANGED_APPS"
          echo "changed_apps=$CHANGED_APPS" >> $GITHUB_OUTPUT

      - name: Determine apps to deploy
        id: determine-apps
        run: |
          # Default to detected changes
          FINAL_APPS=""
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Handle manual deployment mode selection
            if [ "${{ github.event.inputs.deployment_mode }}" == "all" ]; then
              FINAL_APPS="${{ env.ALL_APPS }}"
              echo "Using all apps mode"
            elif [ "${{ github.event.inputs.deployment_mode }}" == "selected" ]; then
              FINAL_APPS="${{ github.event.inputs.selected_apps }}"
              echo "Using selected apps mode: $FINAL_APPS"
            else
              # Changed mode - use detected changes or fallback to dashboard
              if [ -n "${{ steps.detect-changes.outputs.changed_apps }}" ]; then
                FINAL_APPS="${{ steps.detect-changes.outputs.changed_apps }}"
                echo "Using detected changed apps: $FINAL_APPS"
              else
                FINAL_APPS="dashboard"
                echo "No changes detected, defaulting to dashboard"
              fi
            fi
          else
            # Auto mode for push events
            if [ -n "${{ steps.detect-changes.outputs.changed_apps }}" ]; then
              FINAL_APPS="${{ steps.detect-changes.outputs.changed_apps }}"
            else
              # No changes detected, workflow will skip the build job
              FINAL_APPS=""
            fi
          fi
          
          echo "final_apps=$FINAL_APPS" >> $GITHUB_OUTPUT

      - name: Prepare matrix format
        id: matrix-prep
        if: steps.determine-apps.outputs.final_apps != ''
        run: |
          # Convertir a formato JSON para la matriz
          APPS_ARRAY=$(echo "${{ steps.determine-apps.outputs.final_apps }}" | tr ',' '\n')
          APPS_JSON="["
          
          # Construir array JSON manualmente para evitar dependencias externas
          FIRST=true
          for APP in $APPS_ARRAY; do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              APPS_JSON="${APPS_JSON},"
            fi
            APPS_JSON="${APPS_JSON}\"${APP}\""
          done
          
          APPS_JSON="${APPS_JSON}]"
          echo "Matrix format: $APPS_JSON"
          echo "apps_matrix=$APPS_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build Microfrontends
    needs: setup
    if: needs.setup.outputs.final_apps != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40  # Aumentado para dar más tiempo
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps_matrix) }}
      fail-fast: false  # Permitir que otros jobs continúen si uno falla
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git python3 make g++ python3-pip

      - name: Set npm and NX environment variables
        run: |
          # npm environment variables
          echo "npm_config_python=/usr/bin/python3" >> $GITHUB_ENV
          echo "npm_config_unsafe_perm=true" >> $GITHUB_ENV
          echo "npm_config_build_from_source=false" >> $GITHUB_ENV
          echo "PYTHON=/usr/bin/python3" >> $GITHUB_ENV
          
          # Establecer tiempo de espera de npm más largo
          echo "npm_config_timeout=600000" >> $GITHUB_ENV
          
          # Disable NX native modules to avoid binary compatibility issues
          echo "NX_SKIP_NX_CACHE=true" >> $GITHUB_ENV
          echo "NX_NATIVE_BINDINGS=false" >> $GITHUB_ENV

      - name: Ensure .eslintrc.json exists in root
        run: |
          if [ ! -f ".eslintrc.json" ]; then
            echo "Creating root .eslintrc.json file"
            echo '{
              "root": true,
              "ignorePatterns": ["**/*"],
              "plugins": ["@nx"],
              "extends": [
                "eslint:recommended",
                "plugin:@typescript-eslint/recommended",
                "prettier"
              ],
              "overrides": [
                {
                  "files": ["*.ts", "*.tsx", "*.js", "*.jsx"],
                  "rules": {
                    "@typescript-eslint/no-explicit-any": "off",
                    "@nx/enforce-module-boundaries": "off"
                  }
                }
              ]
            }' > .eslintrc.json
          fi

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Reset NX cache
        run: npx nx reset || echo "No se pudo resetear NX cache, continuando de todos modos"

      # Modificación para instalar los paquetes con más opciones de seguridad
      - name: Install dependencies with specific options
        run: |
          # Verificar que npm está correctamente configurado
          npm config list
          # Instalar dependencias con más opciones de seguridad
          npm install --legacy-peer-deps --no-package-lock --prefer-offline --no-fund

      - name: Install NX globally with specific version
        run: |
          npm install -g nx@${{ env.NX_VERSION }}
          nx --version || echo "Advertencia: No se pudo verificar la versión de NX, pero continuaremos"

      - name: Build ${{ matrix.app }}
        run: |
          # Crear un script de build temporal sin postinstall hooks
          echo "Construyendo la aplicación ${{ matrix.app }}..."
          
          # Usar comando directo sin npx para evitar problemas de binarios
          node node_modules/.bin/nx build ${{ matrix.app }} --configuration=production --skip-nx-cache --verbose

      - name: Verify build output
        run: |
          ls -la dist/apps/${{ matrix.app }} || echo "Build output not found at expected location"

      # Configuración corregida de Docker Buildx
      - name: Setup Docker Buildx with increased memory
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host
          buildkitd-flags: --debug

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.environment }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.app }}
            org.opencontainers.image.description=VUCEM ${{ matrix.app }} microfrontend
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # Modificado para construir directamente con el Dockerfile optimizado
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production
            APP_ENV=${{ needs.setup.outputs.environment }}
            NX_SKIP_NX_CACHE=true
            NX_NATIVE_BINDINGS=false
          driver-opts: |
            network=host
            memory=4g
            memory-swap=4g
          timeout-minutes: 20  # Aumentado
          no-cache: ${{ contains(matrix.app, 'se') }}

  deploy:
    name: Deploy Microfrontends
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Execute remote deployment
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "Deploying VUCEM Microfrontends to ${{ needs.setup.outputs.environment }}..."
            cd /home/ubuntu/v30
            
            # Create directory for manifests if it doesn't exist
            mkdir -p k8s
            
            # Create the K8s manifest directly instead of downloading it
            # This eliminates dependency on GitHub raw file access
            echo "Creating Kubernetes manifest template directly..."
            cat > k8s/vucem-microfrontends.yaml << 'EOL'
            ---
            # Namespace for VUCEM Microfrontends
            apiVersion: v1
            kind: Namespace
            metadata:
              name: vucem-${ENV}
            ---
            # ConfigMap for environment variables
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: vucem-frontend-config
              namespace: vucem-${ENV}
            data:
              NODE_ENV: "production"
              API_URL: "https://api-vucem-${ENV}.example.com"
            ---
            # ConfigMap for Module Federation Manifest
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: module-federation-manifest
              namespace: vucem-${ENV}
            data:
              module-federation.manifest.json: |
                {
                  "login": "https://vucem-${ENV}.example.com/login",
                  "aga": "https://vucem-${ENV}.example.com/aga", 
                  "agriculture": "https://vucem-${ENV}.example.com/agriculture",
                  "se": "https://vucem-${ENV}.example.com/se",
                  "semarnat": "https://vucem-${ENV}.example.com/semarnat",
                  "agace": "https://vucem-${ENV}.example.com/agace",
                  "funcionario": "https://vucem-${ENV}.example.com/funcionario",
                  "cofepris": "https://vucem-${ENV}.example.com/cofepris",
                  "amecafe": "https://vucem-${ENV}.example.com/amecafe",
                  "sener": "https://vucem-${ENV}.example.com/sener"
                }
            ---
            # Deployment for VUCEM Microfrontends
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: vucem-microfrontends-${ENV}
              namespace: vucem-${ENV}
              labels:
                app: vucem-microfrontends
                env: ${ENV}
            spec:
              replicas: ${REPLICAS}
              selector:
                matchLabels:
                  app: vucem-microfrontends
                  env: ${ENV}
              template:
                metadata:
                  labels:
                    app: vucem-microfrontends
                    env: ${ENV}
                spec:
                  imagePullSecrets:
                    - name: github-container-registry
                  volumes:
                    - name: module-federation-manifest
                      configMap:
                        name: module-federation-manifest
                  containers:
                    - name: dashboard
                      image: ${REGISTRY}/vucem-front-dashboard:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: dashboard
                      volumeMounts:
                        - name: module-federation-manifest
                          mountPath: /usr/share/nginx/html/assets/module-federation.manifest.json
                          subPath: module-federation.manifest.json
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: login
                      image: ${REGISTRY}/vucem-front-login:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: login
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: aga
                      image: ${REGISTRY}/vucem-front-aga:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: aga
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: agriculture
                      image: ${REGISTRY}/vucem-front-agriculture:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: agriculture
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: se
                      image: ${REGISTRY}/vucem-front-se:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: se
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: semarnat
                      image: ${REGISTRY}/vucem-front-semarnat:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: semarnat
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: agace
                      image: ${REGISTRY}/vucem-front-agace:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: agace
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: funcionario
                      image: ${REGISTRY}/vucem-front-funcionario:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: funcionario
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: cofepris
                      image: ${REGISTRY}/vucem-front-cofepris:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: cofepris
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: amecafe
                      image: ${REGISTRY}/vucem-front-amecafe:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: amecafe
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
                    - name: sener
                      image: ${REGISTRY}/vucem-front-sener:${TAG}
                      imagePullPolicy: Always
                      ports:
                        - containerPort: 80
                          name: sener
                      resources:
                        requests:
                          memory: "128Mi"
                          cpu: "100m"
                        limits:
                          memory: "256Mi"
                          cpu: "500m"
                      livenessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 30
                        timeoutSeconds: 3
                        periodSeconds: 30
                      readinessProbe:
                        httpGet:
                          path: /health.txt
                          port: 80
                        initialDelaySeconds: 10
                        timeoutSeconds: 3
                        periodSeconds: 10
            ---
            # Services for each microfrontend
            apiVersion: v1
            kind: Service
            metadata:
              name: dashboard-svc-${ENV}
              namespace: vucem-${ENV}
              labels:
                app: vucem-microfrontends
                component: dashboard
                env: ${ENV}
            spec:
              selector:
                app: vucem-microfrontends
                env: ${ENV}
              ports:
                - name: http
                  port: 80
                  targetPort: dashboard
              type: ClusterIP
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: cofepris-svc-${ENV}
              namespace: vucem-${ENV}
              labels:
                app: vucem-microfrontends
                component: cofepris
                env: ${ENV}
            spec:
              selector:
                app: vucem-microfrontends
                env: ${ENV}
              ports:
                - name: http
                  port: 80
                  targetPort: cofepris
              type: ClusterIP
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: amecafe-svc-${ENV}
              namespace: vucem-${ENV}
              labels:
                app: vucem-microfrontends
                component: amecafe
                env: ${ENV}
            spec:
              selector:
                app: vucem-microfrontends
                env: ${ENV}
              ports:
                - name: http
                  port: 80
                  targetPort: amecafe
              type: ClusterIP
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: sener-svc-${ENV}
              namespace: vucem-${ENV}
              labels:
                app: vucem-microfrontends
                component: sener
                env: ${ENV}
            spec:
              selector:
                app: vucem-microfrontends
                env: ${ENV}
              ports:
                - name: http
                  port: 80
                  targetPort: sener
              type: ClusterIP
            ---
            # Ingress for VUCEM Microfrontends
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: vucem-frontend-ingress-${ENV}
              namespace: vucem-${ENV}
              annotations:
                kubernetes.io/ingress.class: "nginx"
                nginx.ingress.kubernetes.io/ssl-redirect: "true"
                nginx.ingress.kubernetes.io/use-regex: "true"
                cert-manager.io/cluster-issuer: "letsencrypt-prod"
                nginx.ingress.kubernetes.io/proxy-body-size: "50m"
                nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
                nginx.ingress.kubernetes.io/proxy-connect-timeout: "180"
                nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
                nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
                nginx.ingress.kubernetes.io/configuration-snippet: |
                  # Add CORS headers
                  add_header 'Access-Control-Allow-Origin' '*' always;
                  add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                  add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
                  add_header 'Access-Control-Max-Age' 1728000;
                  # Handle OPTIONS preflight requests
                  if ($request_method = 'OPTIONS') {
                    add_header 'Access-Control-Allow-Origin' '*';
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                    add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
                    add_header 'Access-Control-Max-Age' 1728000;
                    add_header 'Content-Type' 'text/plain charset=UTF-8';
                    add_header 'Content-Length' 0;
                    return 204;
                  }
