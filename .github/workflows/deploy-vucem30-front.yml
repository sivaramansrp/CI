name: CI/CD VUCEM Microfrontends
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      deployment_mode:
        description: 'Deployment mode'
        required: true
        default: 'changed'
        type: choice
        options:
          - changed
          - selected
          - all
      selected_apps:
        description: 'Select apps to deploy (comma-separated, only used when deployment_mode is "selected")'
        required: false
        default: 'dashboard'
        type: string
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'docker/**'
      - 'package.json'
      - 'nx.json'
      - '.github/workflows/**'

env:
  # Updated to match Angular 18.x compatibility requirements
  NODE_VERSION: '18.19.1'
  NX_VERSION: '19.3.1'
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository_owner }}/vucem-front
  ALL_APPS: 'dashboard,login,aga,agriculture,se,semarnat,agace,funcionario,cofepris,amecafe,sener'
  # Variables para controlar problemas de NX
  NX_SKIP_NX_CACHE: 'true'
  NX_NATIVE_BINDINGS: 'false'
  # Added for Webpack compatibility
  WEBPACK_VERSION: '5.91.0'

jobs:
  setup:
    name: Setup and Check Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      changed_apps: ${{ steps.detect-changes.outputs.changed_apps }}
      final_apps: ${{ steps.determine-apps.outputs.final_apps }}
      apps_matrix: ${{ steps.matrix-prep.outputs.apps_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NX globally
        run: npm install -g nx@${{ env.NX_VERSION }}

      - name: Detect changed apps
        id: detect-changes
        run: |
          # En caso de workflow_dispatch, no necesitamos detectar cambios si no es modo 'changed'
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.deployment_mode }}" != "changed" ]; then
            echo "changed_apps=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Para push events, necesitamos encontrar el commit antes
          BEFORE_COMMIT=""
          if [ "${{ github.event.before }}" != "" ]; then
            BEFORE_COMMIT="${{ github.event.before }}"
          else
            # Si no hay before commit, usar HEAD~1
            BEFORE_COMMIT=$(git rev-parse HEAD~1)
          fi
          
          # Detect changes in apps directory
          CHANGED_FILES=$(git diff --name-only $BEFORE_COMMIT ${{ github.sha }} | grep -E '^apps/' || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            # Check for changes in shared libs that would affect all apps
            SHARED_CHANGES=$(git diff --name-only $BEFORE_COMMIT ${{ github.sha }} | grep -E '^libs/shared/' || echo "")
            if [ -n "$SHARED_CHANGES" ]; then
              # If shared libs changed, mark all apps as changed
              CHANGED_APPS="${{ env.ALL_APPS }}"
            else
              CHANGED_APPS=""
            fi
          else
            # Extract the app names from changed files
            CHANGED_APPS=$(echo "$CHANGED_FILES" | grep -oP 'apps/\K[^/]+' | sort -u | tr '\n' ',' | sed 's/,$//')
          
            # Always include dashboard when any app changes
            if [ -n "$CHANGED_APPS" ] && [[ ! "$CHANGED_APPS" =~ "dashboard" ]]; then
              CHANGED_APPS="dashboard,$CHANGED_APPS"
            fi
          fi
          
          echo "Changed apps: $CHANGED_APPS"
          echo "changed_apps=$CHANGED_APPS" >> $GITHUB_OUTPUT

      - name: Determine apps to deploy
        id: determine-apps
        run: |
          # Default to detected changes
          FINAL_APPS=""
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Handle manual deployment mode selection
            if [ "${{ github.event.inputs.deployment_mode }}" == "all" ]; then
              FINAL_APPS="${{ env.ALL_APPS }}"
              echo "Using all apps mode"
            elif [ "${{ github.event.inputs.deployment_mode }}" == "selected" ]; then
              FINAL_APPS="${{ github.event.inputs.selected_apps }}"
              echo "Using selected apps mode: $FINAL_APPS"
            else
              # Changed mode - use detected changes or fallback to dashboard
              if [ -n "${{ steps.detect-changes.outputs.changed_apps }}" ]; then
                FINAL_APPS="${{ steps.detect-changes.outputs.changed_apps }}"
                echo "Using detected changed apps: $FINAL_APPS"
              else
                FINAL_APPS="dashboard"
                echo "No changes detected, defaulting to dashboard"
              fi
            fi
          else
            # Auto mode for push events
            if [ -n "${{ steps.detect-changes.outputs.changed_apps }}" ]; then
              FINAL_APPS="${{ steps.detect-changes.outputs.changed_apps }}"
            else
              # No changes detected, workflow will skip the build job
              FINAL_APPS=""
            fi
          fi
          
          echo "final_apps=$FINAL_APPS" >> $GITHUB_OUTPUT

      - name: Prepare matrix format
        id: matrix-prep
        if: steps.determine-apps.outputs.final_apps != ''
        run: |
          # Convertir a formato JSON para la matriz
          APPS_ARRAY=$(echo "${{ steps.determine-apps.outputs.final_apps }}" | tr ',' '\n')
          APPS_JSON="["
          
          # Construir array JSON manualmente para evitar dependencias externas
          FIRST=true
          for APP in $APPS_ARRAY; do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              APPS_JSON="${APPS_JSON},"
            fi
            APPS_JSON="${APPS_JSON}\"${APP}\""
          done
          
          APPS_JSON="${APPS_JSON}]"
          echo "Matrix format: $APPS_JSON"
          echo "apps_matrix=$APPS_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build Microfrontends
    needs: setup
    if: needs.setup.outputs.final_apps != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40  # Aumentado para dar más tiempo
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps_matrix) }}
      fail-fast: false  # Permitir que otros jobs continúen si uno falla
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git python3 make g++ python3-pip

      - name: Set npm and NX environment variables
        run: |
          # npm environment variables
          echo "npm_config_python=/usr/bin/python3" >> $GITHUB_ENV
          echo "npm_config_unsafe_perm=true" >> $GITHUB_ENV
          echo "npm_config_build_from_source=false" >> $GITHUB_ENV
          echo "PYTHON=/usr/bin/python3" >> $GITHUB_ENV
          
          # Establecer tiempo de espera de npm más largo
          echo "npm_config_timeout=600000" >> $GITHUB_ENV
          
          # Disable NX native modules to avoid binary compatibility issues
          echo "NX_SKIP_NX_CACHE=true" >> $GITHUB_ENV
          echo "NX_NATIVE_BINDINGS=false" >> $GITHUB_ENV

      - name: Ensure .eslintrc.json exists in root
        run: |
          if [ ! -f ".eslintrc.json" ]; then
            echo "Creating root .eslintrc.json file"
            echo '{
              "root": true,
              "ignorePatterns": ["**/*"],
              "plugins": ["@nx"],
              "extends": [
                "eslint:recommended",
                "plugin:@typescript-eslint/recommended",
                "prettier"
              ],
              "overrides": [
                {
                  "files": ["*.ts", "*.tsx", "*.js", "*.jsx"],
                  "rules": {
                    "@typescript-eslint/no-explicit-any": "off",
                    "@nx/enforce-module-boundaries": "off"
                  }
                }
              ]
            }' > .eslintrc.json
          fi

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}-v2
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Reset NX cache
        run: npx nx reset || echo "No se pudo resetear NX cache, continuando de todos modos"

      # Modificación para instalar los paquetes con más opciones de seguridad
      - name: Install dependencies with specific options
        run: |
          # Verificar que npm está correctamente configurado
          npm config list
          # Instalar dependencias con más opciones de seguridad
          npm install --legacy-peer-deps --no-package-lock --prefer-offline --no-fund
          
          # Verificar versión instalada de webpack y forzar si es necesario
          echo "Verificando versión de webpack..."
          CURRENT_WEBPACK=$(node -e "try { console.log(require('webpack/package.json').version) } catch (e) { console.log('not installed') }")
          if [ "$CURRENT_WEBPACK" != "${{ env.WEBPACK_VERSION }}" ]; then
            echo "Instalando webpack específico ${{ env.WEBPACK_VERSION }}"
            npm install webpack@${{ env.WEBPACK_VERSION }} --save-dev --force
          fi
          
          # Verificar que el módulo de Module Federation esté correctamente instalado
          echo "Verificando @angular-architects/module-federation..."
          if [ ! -d "node_modules/@angular-architects/module-federation" ]; then
            echo "Reinstalando @angular-architects/module-federation..."
            npm install @angular-architects/module-federation --save --force
          fi

      - name: Use locally installed NX
        run: |
          # Usar la versión instalada localmente en lugar de instalar globalmente
          echo "Usando NX versión local del proyecto"
          npx nx --version || echo "Advertencia: No se pudo verificar la versión de NX, pero continuaremos"

      - name: Build ${{ matrix.app }}
        run: |
          echo "Construyendo la aplicación ${{ matrix.app }}..."
          # Usar --skip-nx-cache para evitar problemas de caché
          # Añadir --verbose para más información de diagnóstico
          npx nx build ${{ matrix.app }} --configuration=production --skip-nx-cache --verbose

      - name: Verify build output
        run: |
          ls -la dist/apps/${{ matrix.app }} || echo "Build output not found at expected location"

      # Configuración corregida de Docker Buildx
      - name: Setup Docker Buildx with increased memory
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host
          buildkitd-flags: --debug

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.environment }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.app }}
            org.opencontainers.image.description=VUCEM ${{ matrix.app }} microfrontend
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # Modificado para construir directamente con el Dockerfile optimizado
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production
            APP_ENV=${{ needs.setup.outputs.environment }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            NX_SKIP_NX_CACHE=true
            NX_NATIVE_BINDINGS=false
          driver-opts: |
            network=host
            memory=4g
            memory-swap=4g
          timeout-minutes: 20  # Aumentado
          no-cache: ${{ contains(matrix.app, 'se') }}

  deploy:
    name: Deploy Microfrontends
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Execute remote deployment
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "Deploying VUCEM Microfrontends to ${{ needs.setup.outputs.environment }}..."
            cd /home/ubuntu/v30
            
            # Create directory for manifests if it doesn't exist
            mkdir -p k8s
            
            # Download the K8s manifest template from repository
            curl -s https://raw.githubusercontent.com/vucem30-dev/frontend/fix/cicd/k8s/vucem-microfrontends.yaml -o k8s/vucem-microfrontends.yaml
            
            # Prepare the apps to be included in the deployment
            APPS_LIST="${{ needs.setup.outputs.final_apps }}"
            
            # Set the replicas based on environment
            if [ "${{ needs.setup.outputs.environment }}" == "prod" ]; then
              REPLICAS=2
              MIN_REPLICAS=2
              MAX_REPLICAS=5
            else
              REPLICAS=1
              MIN_REPLICAS=1
              MAX_REPLICAS=3
            fi
            
            # Generate module federation manifest
            cat > module-federation.manifest.json << EOF
            {
              "login": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/login",
              "aga": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/aga",
              "agriculture": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/agriculture",
              "se": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/se",
              "semarnat": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/semarnat",
              "agace": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/agace",
              "funcionario": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/funcionario",
              "cofepris": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/cofepris",
              "amecafe": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/amecafe",
              "sener": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/sener"
            }
            EOF
            
            # Replace placeholders with actual values for all parameters
            sed -i "s/\${ENV}/${{ needs.setup.outputs.environment }}/g" k8s/vucem-microfrontends.yaml
            sed -i "s/\${REGISTRY}/${{ env.REGISTRY }}/g" k8s/vucem-microfrontends.yaml
            sed -i "s/\${TAG}/${{ needs.setup.outputs.environment }}/g" k8s/vucem-microfrontends.yaml
            
            # Set replica counts based on environment
            if [ "${{ needs.setup.outputs.environment }}" == "prod" ]; then
              sed -i "s/\${REPLICAS}/2/g" k8s/vucem-microfrontends.yaml
              sed -i "s/\${MIN_REPLICAS}/2/g" k8s/vucem-microfrontends.yaml
              sed -i "s/\${MAX_REPLICAS}/5/g" k8s/vucem-microfrontends.yaml
            else
              sed -i "s/\${REPLICAS}/1/g" k8s/vucem-microfrontends.yaml
              sed -i "s/\${MIN_REPLICAS}/1/g" k8s/vucem-microfrontends.yaml
              sed -i "s/\${MAX_REPLICAS}/3/g" k8s/vucem-microfrontends.yaml
            fi
            
            # Create ConfigMap for Module Federation Manifest
            microk8s kubectl create configmap module-federation-manifest \
              --from-file=module-federation.manifest.json \
              -n vucem-${{ needs.setup.outputs.environment }} \
              --dry-run=client -o yaml | microk8s kubectl apply -f -
            
            # Validate YAML syntax (optional but recommended)
            if command -v yamllint &> /dev/null; then
              yamllint -d relaxed k8s/vucem-microfrontends.yaml || echo "YAML validation warning (continuing anyway)"
            fi
            
            # Apply Kubernetes manifest
            microk8s kubectl apply -f k8s/vucem-microfrontends.yaml
            
            # Restart the deployment to pull the latest images
            microk8s kubectl rollout restart deployment vucem-microfrontends-${{ needs.setup.outputs.environment }}
            
            # Wait for rollout to complete
            microk8s kubectl rollout status deployment/vucem-microfrontends-${{ needs.setup.outputs.environment }} --timeout=300s
