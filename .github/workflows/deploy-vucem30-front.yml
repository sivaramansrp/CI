name: CI/CD VUCEM Microfrontends
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      deployment_mode:
        description: 'Deployment mode'
        required: true
        default: 'changed'
        type: choice
        options:
          - changed
          - selected
          - all
      selected_apps:
        description: 'Select apps to deploy (comma-separated, only used when deployment_mode is "selected")'
        required: false
        default: 'dashboard'
        type: string
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  ORGANIZATION: vucem30
  ALL_APPS: 'dashboard,login,aga,agriculture,se,semarnat,agace,funcionario,cofepris,amecafe,sener'
  SONAR_VERSION: '6.2.1.4610-linux-x64'

jobs:
  build-and-deploy:
    name: Build and Deploy Microfrontends
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set environment and determine apps to deploy
        id: set-env
        run: |
          # Set environment
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "DEPLOY_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          fi
          
          # Determine which apps to deploy
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.deployment_mode }}" == "all" ]; then
              echo "DEPLOY_APPS=${{ env.ALL_APPS }}" >> $GITHUB_ENV
              echo "Deploying all apps"
            elif [ "${{ github.event.inputs.deployment_mode }}" == "selected" ]; then
              echo "DEPLOY_APPS=${{ github.event.inputs.selected_apps }}" >> $GITHUB_ENV
              echo "Deploying selected apps: ${{ github.event.inputs.selected_apps }}"
            else
              # Changed mode - detect changed apps
              CHANGED_APPS=$(git diff --name-only HEAD~1 HEAD | grep -oP 'apps/\K[^/]+' | sort -u | tr '\n' ',' | sed 's/,$//')
              if [ -z "$CHANGED_APPS" ]; then
                # Check for changes in shared libs that would affect all apps
                SHARED_CHANGES=$(git diff --name-only HEAD~1 HEAD | grep -E '^libs/shared/' || echo "")
                if [ -n "$SHARED_CHANGES" ]; then
                  echo "DEPLOY_APPS=${{ env.ALL_APPS }}" >> $GITHUB_ENV
                  echo "Shared libs changed, deploying all apps"
                else
                  echo "DEPLOY_APPS=dashboard" >> $GITHUB_ENV
                  echo "No changes detected, defaulting to dashboard"
                fi
              else
                # Always include dashboard when any app changes
                if [[ ! "$CHANGED_APPS" =~ "dashboard" ]]; then
                  CHANGED_APPS="dashboard,$CHANGED_APPS"
                fi
                echo "DEPLOY_APPS=$CHANGED_APPS" >> $GITHUB_ENV
                echo "Deploying changed apps: $CHANGED_APPS"
              fi
            fi
          else
            # Auto mode for push events
            CHANGED_APPS=$(git diff --name-only HEAD~1 HEAD | grep -oP 'apps/\K[^/]+' | sort -u | tr '\n' ',' | sed 's/,$//')
            if [ -z "$CHANGED_APPS" ]; then
              # Check for changes in shared libs that would affect all apps
              SHARED_CHANGES=$(git diff --name-only HEAD~1 HEAD | grep -E '^libs/shared/' || echo "")
              if [ -n "$SHARED_CHANGES" ]; then
                echo "DEPLOY_APPS=${{ env.ALL_APPS }}" >> $GITHUB_ENV
                echo "Shared libs changed, deploying all apps"
              else
                echo "DEPLOY_APPS=dashboard" >> $GITHUB_ENV
                echo "No changes detected, defaulting to dashboard"
              fi
            else
              # Always include dashboard when any app changes
              if [[ ! "$CHANGED_APPS" =~ "dashboard" ]]; then
                CHANGED_APPS="dashboard,$CHANGED_APPS"
              fi
              echo "DEPLOY_APPS=$CHANGED_APPS" >> $GITHUB_ENV
              echo "Deploying changed apps: $CHANGED_APPS"
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Download SonarScanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${{ env.SONAR_VERSION }}.zip
          unzip sonar-scanner.zip
          echo "SONAR_SCANNER_HOME=$PWD/sonar-scanner-${{ env.SONAR_VERSION }}" >> $GITHUB_ENV

      - name: Verify SonarScanner Installation
        run: ${{ env.SONAR_SCANNER_HOME }}/bin/sonar-scanner --version

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ${{ env.SONAR_SCANNER_HOME }}/bin/sonar-scanner \
            -Dsonar.projectKey=vucem_microfrontends \
            -Dsonar.organization=v30 \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://sonar.ultrasist.net \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.verbose=true

      - name: Install dependencies
        run: npm ci

      - name: Build microfrontends
        run: |
          for app in $(echo "${{ env.DEPLOY_APPS }}" | tr ',' ' '); do
            echo "Building $app..."
            npx ng build $app --configuration=production
          done

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images for selected apps
        run: |
          for app in $(echo "${{ env.DEPLOY_APPS }}" | tr ',' ' '); do
            echo "Building and pushing Docker image for $app..."
          
            # Build and push Docker image
            docker buildx build \
              --platform linux/amd64 \
              --tag ${{ env.REGISTRY }}/${{ env.ORGANIZATION }}/vucem-front-$app:${{ env.DEPLOY_ENV }} \
              --tag ${{ env.REGISTRY }}/${{ env.ORGANIZATION }}/vucem-front-$app:latest \
              --file ./apps/$app/Dockerfile \
              --build-arg NODE_ENV=production \
              --build-arg APP_ENV=${{ env.DEPLOY_ENV }} \
              --push \
              .
          done

      - name: Prepare Kubernetes Manifests
        id: prepare-manifests
        run: |
          # Create directory for manifests
          mkdir -p kubernetes
          
          # Generate ConfigMap
          echo "Generating ConfigMap..."
          echo "apiVersion: v1
          kind: ConfigMap
          metadata:
            name: vucem-frontend-config-${{ env.DEPLOY_ENV }}
            namespace: vucem-${{ env.DEPLOY_ENV }}
          data:
            NODE_ENV: \"production\"
            API_URL: \"https://api-vucem-${{ env.DEPLOY_ENV }}.example.com\"
          " > kubernetes/configmap.yaml
          
          # Determine replica count based on environment
          if [ "${{ env.DEPLOY_ENV }}" == "prod" ]; then
            REPLICAS=2
            MIN_REPLICAS=2
            MAX_REPLICAS=5
          else
            REPLICAS=1
            MIN_REPLICAS=1
            MAX_REPLICAS=3
          fi
          
          # Generate Deployment header
          echo "Generating Deployment..."
          echo "apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vucem-microfrontends-${{ env.DEPLOY_ENV }}
            namespace: vucem-${{ env.DEPLOY_ENV }}
            labels:
              app: vucem-microfrontends
              env: ${{ env.DEPLOY_ENV }}
          spec:
            replicas: $REPLICAS
            selector:
              matchLabels:
                app: vucem-microfrontends
                env: ${{ env.DEPLOY_ENV }}
            template:
              metadata:
                labels:
                  app: vucem-microfrontends
                  env: ${{ env.DEPLOY_ENV }}
              spec:
                imagePullSecrets:
                  - name: github-container-registry
                containers:" > kubernetes/deployment.yaml
          
          # Generate container definitions for selected apps
          for app in $(echo "${{ env.DEPLOY_APPS }}" | tr ',' ' '); do
            echo "  - name: $app
                image: ${{ env.REGISTRY }}/${{ env.ORGANIZATION }}/vucem-front-$app:${{ env.DEPLOY_ENV }}
                imagePullPolicy: Always
                ports:
                  - containerPort: 80
                resources:
                  requests:
                    memory: \"128Mi\"
                    cpu: \"100m\"
                  limits:
                    memory: \"256Mi\"
                    cpu: \"500m\"
                livenessProbe:
                  httpGet:
                    path: /health.txt
                    port: 80
                  initialDelaySeconds: 30
                  timeoutSeconds: 3
                  periodSeconds: 30
                readinessProbe:
                  httpGet:
                    path: /health.txt
                    port: 80
                  initialDelaySeconds: 10
                  timeoutSeconds: 3
                  periodSeconds: 10" >> kubernetes/deployment.yaml
          done
          
          # Generate Service
          echo "Generating Service..."
          echo "apiVersion: v1
          kind: Service
          metadata:
            name: vucem-frontend-svc-${{ env.DEPLOY_ENV }}
            namespace: vucem-${{ env.DEPLOY_ENV }}
            labels:
              app: vucem-microfrontends
              env: ${{ env.DEPLOY_ENV }}
              tier: frontend
          spec:
            selector:
              app: vucem-microfrontends
              env: ${{ env.DEPLOY_ENV }}
            ports:
              - name: http
                port: 80
                targetPort: 80
                protocol: TCP
            sessionAffinity: ClientIP
            sessionAffinityConfig:
              clientIP:
                timeoutSeconds: 10800
            type: ClusterIP" > kubernetes/service.yaml
          
          # Generate Ingress
          echo "Generating Ingress..."
          echo "apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: vucem-frontend-ingress-${{ env.DEPLOY_ENV }}
            namespace: vucem-${{ env.DEPLOY_ENV }}
            annotations:
              nginx.ingress.kubernetes.io/rewrite-target: /
              nginx.ingress.kubernetes.io/ssl-redirect: \"true\"
              cert-manager.io/cluster-issuer: \"letsencrypt-prod\"
              kubernetes.io/ingress.class: \"nginx\"
              nginx.ingress.kubernetes.io/proxy-body-size: \"50m\"
              nginx.ingress.kubernetes.io/proxy-buffer-size: \"128k\"
              nginx.ingress.kubernetes.io/proxy-connect-timeout: \"180\"
              nginx.ingress.kubernetes.io/proxy-read-timeout: \"180\"
              nginx.ingress.kubernetes.io/proxy-send-timeout: \"180\"
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - vucem-${{ env.DEPLOY_ENV }}.example.com
                secretName: vucem-tls-cert
            rules:
              - host: vucem-${{ env.DEPLOY_ENV }}.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: vucem-frontend-svc-${{ env.DEPLOY_ENV }}
                          port:
                            number: 80
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: vucem-backend-svc
                          port:
                            number: 8080" > kubernetes/ingress.yaml
          
          # Generate HPA
          echo "Generating HorizontalPodAutoscaler..."
          echo "apiVersion: autoscaling/v2
          kind: HorizontalPodAutoscaler
          metadata:
            name: vucem-microfrontends-hpa-${{ env.DEPLOY_ENV }}
            namespace: vucem-${{ env.DEPLOY_ENV }}
          spec:
            scaleTargetRef:
              apiVersion: apps/v1
              kind: Deployment
              name: vucem-microfrontends-${{ env.DEPLOY_ENV }}
            minReplicas: $MIN_REPLICAS
            maxReplicas: $MAX_REPLICAS
            metrics:
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: 80
              - type: Resource
                resource:
                  name: memory
                  target:
                    type: Utilization
                    averageUtilization: 80" > kubernetes/hpa.yaml
          
          # Create a combined file
          echo "---" > kubernetes/combined.yaml
          cat kubernetes/configmap.yaml >> kubernetes/combined.yaml
          echo "---" >> kubernetes/combined.yaml
          cat kubernetes/deployment.yaml >> kubernetes/combined.yaml
          echo "---" >> kubernetes/combined.yaml
          cat kubernetes/service.yaml >> kubernetes/combined.yaml
          echo "---" >> kubernetes/combined.yaml
          cat kubernetes/ingress.yaml >> kubernetes/combined.yaml
          echo "---" >> kubernetes/combined.yaml
          cat kubernetes/hpa.yaml >> kubernetes/combined.yaml
          
          # Upload manifests as artifacts
          echo "::set-output name=manifest_path::kubernetes/combined.yaml"

      - name: Upload Kubernetes Manifests
        uses: actions/upload-artifact@v3
        with:
          name: kubernetes-manifests
          path: kubernetes/combined.yaml
          retention-days: 7

      - name: Copy manifest to remote server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          source: "kubernetes/combined.yaml"
          target: "/home/ubuntu/v30/k8s"
          strip_components: 1

      - name: Execute remote deployment
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script_stop: true
          envs: DEPLOY_ENV,DEPLOY_APPS
          script: |
            echo "Deploying VUCEM Microfrontends to $DEPLOY_ENV..."
            echo "Apps being deployed: $DEPLOY_APPS"
            cd /home/ubuntu/v30
            
            # Create namespace if it doesn't exist
            microk8s kubectl get namespace vucem-$DEPLOY_ENV > /dev/null 2>&1 || \
            microk8s kubectl create namespace vucem-$DEPLOY_ENV
            
            # Apply Kubernetes manifest
            microk8s kubectl apply -f k8s/combined.yaml
            
            # Check if deployment exists before trying to restart it
            if microk8s kubectl get deployment vucem-microfrontends-$DEPLOY_ENV -n vucem-$DEPLOY_ENV > /dev/null 2>&1; then
              # Restart the deployment to pull the latest images
              echo "Restarting deployment..."
              microk8s kubectl rollout restart deployment vucem-microfrontends-$DEPLOY_ENV -n vucem-$DEPLOY_ENV
            
              # Wait for rollout to complete
              microk8s kubectl rollout status deployment/vucem-microfrontends-$DEPLOY_ENV -n vucem-$DEPLOY_ENV --timeout=300s
            else
              echo "Deployment not found - it will be created by the apply command"
            fi
            
            # Print summary of deployment
            echo "Deployment summary:"
            echo "Environment: $DEPLOY_ENV"
            echo "Apps deployed: $DEPLOY_APPS"
            microk8s kubectl get pods -n vucem-$DEPLOY_ENV -l app=vucem-microfrontends
