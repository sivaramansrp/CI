name: CI/CD VUCEM Microfrontends
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      deployment_mode:
        description: 'Deployment mode'
        required: true
        default: 'changed'
        type: choice
        options:
          - changed
          - selected
          - all
      selected_apps:
        description: 'Select apps to deploy (comma-separated, only used when deployment_mode is "selected")'
        required: false
        default: 'dashboard'
        type: string
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'docker/**'
      - 'package.json'
      - 'nx.json'
      - '.github/workflows/**'

env:
  NODE_VERSION: '20'
  NX_VERSION: '16.10.0'
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository_owner }}/vucem-front
  ALL_APPS: 'dashboard,login,aga,agriculture,se,semarnat,agace,funcionario,cofepris,amecafe,sener'
  # Variables para controlar problemas de NX
  NX_SKIP_NX_CACHE: 'true'
  NX_NATIVE_BINDINGS: 'false'
  # Variables adicionales para control de memoria y compatibilidad
  NODE_OPTIONS: '--max-old-space-size=8192'
  FORCE_COLOR: 1

jobs:
  setup:
    name: Setup and Check Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      changed_apps: ${{ steps.detect-changes.outputs.changed_apps }}
      final_apps: ${{ steps.determine-apps.outputs.final_apps }}
      apps_matrix: ${{ steps.matrix-prep.outputs.apps_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NX globally
        run: npm install -g nx@${{ env.NX_VERSION }}

      - name: Detect changed apps
        id: detect-changes
        run: |
          # En caso de workflow_dispatch, no necesitamos detectar cambios si no es modo 'changed'
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.deployment_mode }}" != "changed" ]; then
            echo "changed_apps=" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Para push events, necesitamos encontrar el commit antes
          BEFORE_COMMIT=""
          if [ "${{ github.event.before }}" != "" ]; then
            BEFORE_COMMIT="${{ github.event.before }}"
          else
            # Si no hay before commit, usar HEAD~1
            BEFORE_COMMIT=$(git rev-parse HEAD~1)
          fi
          
          # Detect changes in apps directory
          CHANGED_FILES=$(git diff --name-only $BEFORE_COMMIT ${{ github.sha }} | grep -E '^apps/' || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            # Check for changes in shared libs that would affect all apps
            SHARED_CHANGES=$(git diff --name-only $BEFORE_COMMIT ${{ github.sha }} | grep -E '^libs/shared/' || echo "")
            if [ -n "$SHARED_CHANGES" ]; then
              # If shared libs changed, mark all apps as changed
              CHANGED_APPS="${{ env.ALL_APPS }}"
            else
              CHANGED_APPS=""
            fi
          else
            # Extract the app names from changed files
            CHANGED_APPS=$(echo "$CHANGED_FILES" | grep -oP 'apps/\K[^/]+' | sort -u | tr '\n' ',' | sed 's/,$//')
          
            # Always include dashboard when any app changes
            if [ -n "$CHANGED_APPS" ] && [[ ! "$CHANGED_APPS" =~ "dashboard" ]]; then
              CHANGED_APPS="dashboard,$CHANGED_APPS"
            fi
          fi
          
          echo "Changed apps: $CHANGED_APPS"
          echo "changed_apps=$CHANGED_APPS" >> $GITHUB_OUTPUT

      - name: Determine apps to deploy
        id: determine-apps
        run: |
          # Default to detected changes
          FINAL_APPS=""
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Handle manual deployment mode selection
            if [ "${{ github.event.inputs.deployment_mode }}" == "all" ]; then
              FINAL_APPS="${{ env.ALL_APPS }}"
              echo "Using all apps mode"
            elif [ "${{ github.event.inputs.deployment_mode }}" == "selected" ]; then
              FINAL_APPS="${{ github.event.inputs.selected_apps }}"
              echo "Using selected apps mode: $FINAL_APPS"
            else
              # Changed mode - use detected changes or fallback to dashboard
              if [ -n "${{ steps.detect-changes.outputs.changed_apps }}" ]; then
                FINAL_APPS="${{ steps.detect-changes.outputs.changed_apps }}"
                echo "Using detected changed apps: $FINAL_APPS"
              else
                FINAL_APPS="dashboard"
                echo "No changes detected, defaulting to dashboard"
              fi
            fi
          else
            # Auto mode for push events
            if [ -n "${{ steps.detect-changes.outputs.changed_apps }}" ]; then
              FINAL_APPS="${{ steps.detect-changes.outputs.changed_apps }}"
            else
              # No changes detected, workflow will skip the build job
              FINAL_APPS=""
            fi
          fi
          
          echo "final_apps=$FINAL_APPS" >> $GITHUB_OUTPUT

      - name: Prepare matrix format
        id: matrix-prep
        if: steps.determine-apps.outputs.final_apps != ''
        run: |
          # Convertir a formato JSON para la matriz
          APPS_ARRAY=$(echo "${{ steps.determine-apps.outputs.final_apps }}" | tr ',' '\n')
          APPS_JSON="["
          
          # Construir array JSON manualmente para evitar dependencias externas
          FIRST=true
          for APP in $APPS_ARRAY; do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              APPS_JSON="${APPS_JSON},"
            fi
            APPS_JSON="${APPS_JSON}\"${APP}\""
          done
          
          APPS_JSON="${APPS_JSON}]"
          echo "Matrix format: $APPS_JSON"
          echo "apps_matrix=$APPS_JSON" >> $GITHUB_OUTPUT

  build:
    name: Build Microfrontends
    needs: setup
    if: needs.setup.outputs.final_apps != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Aumentado para dar más tiempo
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.setup.outputs.apps_matrix) }}
      fail-fast: false  # Permitir que otros jobs continúen si uno falla
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Deshabilitado cache para evitar problemas de compatibilidad
          # cache: 'npm'
          # cache-dependency-path: package-lock.json

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git python3 make g++ python3-pip

      - name: Set npm and NX environment variables
        run: |
          # npm environment variables
          echo "npm_config_python=/usr/bin/python3" >> $GITHUB_ENV
          echo "npm_config_unsafe_perm=true" >> $GITHUB_ENV
          echo "npm_config_build_from_source=false" >> $GITHUB_ENV
          echo "PYTHON=/usr/bin/python3" >> $GITHUB_ENV
          
          # Establecer tiempo de espera de npm más largo
          echo "npm_config_timeout=600000" >> $GITHUB_ENV
          
          # Disable NX native modules to avoid binary compatibility issues
          echo "NX_SKIP_NX_CACHE=true" >> $GITHUB_ENV
          echo "NX_NATIVE_BINDINGS=false" >> $GITHUB_ENV
          
          # Ampliar memoria disponible para Node
          echo "NODE_OPTIONS=--max-old-space-size=8192" >> $GITHUB_ENV
          
          # Aumentar el tiempo de espera del compilador de TypeScript
          echo "TSC_WATCHFILE=UseFsEventsWithFallbackDynamicPolling" >> $GITHUB_ENV
          echo "TSC_NONPOLLING_WATCHER=true" >> $GITHUB_ENV

      - name: Ensure .eslintrc.json exists in root
        run: |
          if [ ! -f ".eslintrc.json" ]; then
            echo "Creating root .eslintrc.json file"
            echo '{
              "root": true,
              "ignorePatterns": ["**/*"],
              "plugins": ["@nx"],
              "extends": [
                "eslint:recommended",
                "plugin:@typescript-eslint/recommended",
                "prettier"
              ],
              "overrides": [
                {
                  "files": ["*.ts", "*.tsx", "*.js", "*.jsx"],
                  "rules": {
                    "@typescript-eslint/no-explicit-any": "off",
                    "@nx/enforce-module-boundaries": "off"
                  }
                }
              ]
            }' > .eslintrc.json
          fi

      # Eliminar caché para forzar reinstalación limpia
      - name: Clean environment before build
        run: |
          echo "Limpiando entorno y caché..."
          rm -rf node_modules
          rm -rf ~/.npm
          npm cache clean --force
          echo "Entorno limpiado correctamente"

      # Reset NX cache
      - name: Reset NX cache
        run: npx nx reset || echo "No se pudo resetear NX cache, continuando de todos modos"

      # Instalar dependencias con opciones específicas para resolver conflictos
      - name: Install dependencies with specific options
        run: |
          # Verificar que npm está correctamente configurado
          npm config list
          # Instalar dependencias con opciones específicas para prevenir conflictos
          npm install --legacy-peer-deps --no-package-lock --force
          echo "Dependencias instaladas correctamente"

      # Asegurar que la versión específica de NX está instalada
      - name: Install NX globally with specific version
        run: |
          npm install -g nx@${{ env.NX_VERSION }}
          nx --version || echo "Advertencia: No se pudo verificar la versión de NX, pero continuaremos"

      # Aplicar resoluciones específicas para webpack para evitar duplicados
      - name: Apply webpack resolutions
        run: |
          echo "Aplicando resoluciones específicas para webpack..."
          if [ -f "package.json" ]; then
            # Verificar si ya existe la sección "resolutions"
            if ! grep -q '"resolutions"' package.json; then
              # Insertar sección de resoluciones antes del último }
              sed -i '/"dependencies"/,/"devDependencies"/ s/"devDependencies"/  "resolutions": {\n    "webpack": "^5.76.0"\n  },\n  "devDependencies"/' package.json
            else
              # Si ya existe, agregar la resolución de webpack
              sed -i '/"resolutions"/ a\    "webpack": "^5.76.0",' package.json
            fi
            echo "Resoluciones aplicadas correctamente"
            
            # Reinstalar para aplicar resoluciones
            npm install --force
          else
            echo "package.json no encontrado"
          fi

      # Ajustar configuración de Module Federation específicamente para sener
      - name: Fix Module Federation config for sener app
        if: matrix.app == 'sener'
        run: |
          echo "Ajustando configuración de Module Federation para la aplicación sener..."
          
          # Buscar y ajustar archivo de configuración de webpack
          if [ -f "apps/sener/webpack.config.js" ]; then
            # Realizar ajustes en la configuración específica de sener
            cat > apps/sener/webpack.fix.js << EOF
            // Función auxiliar para ajustar la configuración de ModuleFederationPlugin
            const fixModuleFederationConfig = (webpackConfig) => {
              if (webpackConfig.plugins) {
                const mfPluginIndex = webpackConfig.plugins.findIndex(plugin => 
                  plugin.constructor && plugin.constructor.name === 'ModuleFederationPlugin'
                );
                
                if (mfPluginIndex >= 0) {
                  const originalPlugin = webpackConfig.plugins[mfPluginIndex];
                  // Crear una nueva instancia con configuración compatible
                  const webpack = require('webpack');
                  webpackConfig.plugins[mfPluginIndex] = new webpack.container.ModuleFederationPlugin({
                    ...originalPlugin._options,
                    shared: {
                      ...originalPlugin._options.shared,
                      "@angular/core": { singleton: true, eager: true, strictVersion: false },
                      "@angular/common": { singleton: true, eager: true, strictVersion: false },
                      "@angular/router": { singleton: true, eager: true, strictVersion: false }
                    }
                  });
                }
              }
              return webpackConfig;
            };
            
            // Exportar módulo que ajusta la configuración de webpack
            module.exports = (webpackConfig) => {
              return fixModuleFederationConfig(webpackConfig);
            };
            EOF
            
            # Modificar el webpack.config.js original para usar nuestro ajuste
            sed -i '1i const webpackFix = require("./webpack.fix.js");' apps/sener/webpack.config.js
            sed -i 's/module.exports = /const originalConfig = /' apps/sener/webpack.config.js
            echo 'module.exports = webpackFix(originalConfig);' >> apps/sener/webpack.config.js
            
            echo "Configuración de webpack para sener ajustada correctamente"
          else
            echo "No se encontró webpack.config.js para sener, intentando buscar en otro lugar..."
            
            # Buscar en configuración global de NX
            if [ -f "webpack.config.js" ]; then
              echo "Ajustando configuración global de webpack..."
              sed -i '/ModuleFederationPlugin/ a\            // Fix para el error de compilación en sener\n            if (options.name === "sener") {\n              console.log("Aplicando fix específico para sener...");\n              options.shared = {\n                ...options.shared,\n                "@angular/core": { singleton: true, eager: true, strictVersion: false },\n                "@angular/common": { singleton: true, eager: true, strictVersion: false },\n                "@angular/router": { singleton: true, eager: true, strictVersion: false }\n              };\n            }' webpack.config.js
              echo "Configuración global ajustada"
            fi
          fi

      # Construir con opciones adicionales específicas para cada app
      - name: Build ${{ matrix.app }}
        run: |
          echo "Construyendo la aplicación ${{ matrix.app }}..."
          
          # Configurar opciones específicas para cada app
          BUILD_OPTIONS="--configuration=production --skip-nx-cache --verbose"
          
          # Agregar opciones específicas para sener
          if [ "${{ matrix.app }}" == "sener" ]; then
            BUILD_OPTIONS="$BUILD_OPTIONS --no-progress --aot --optimization=false --sourceMap=false"
          fi
          
          # Utilizar comando con memoria aumentada y opciones personalizadas
          node --max-old-space-size=8192 node_modules/.bin/nx build ${{ matrix.app }} $BUILD_OPTIONS
          
          # Verificar resultado del build
          if [ $? -ne 0 ]; then
            echo "Error durante la construcción de ${{ matrix.app }}"
            exit 1
          fi

      # Verificar la salida del build
      - name: Verify build output
        run: |
          ls -la dist/apps/${{ matrix.app }} || echo "Build output not found at expected location"

      # Configuración de Docker Buildx con recursos adicionales
      - name: Setup Docker Buildx with increased memory
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host
          buildkitd-flags: --debug

      # Login al registro de contenedores
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extraer metadatos para Docker
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.environment }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.app }}
            org.opencontainers.image.description=VUCEM ${{ matrix.app }} microfrontend
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # Construir y publicar imagen Docker con recursos adicionales
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NODE_ENV=production
            APP_ENV=${{ needs.setup.outputs.environment }}
            NX_SKIP_NX_CACHE=true
            NX_NATIVE_BINDINGS=false
          driver-opts: |
            network=host
            memory=8g
            memory-swap=8g
          timeout-minutes: 30  # Aumentado
          no-cache: ${{ contains(matrix.app, 'sener') }}  # Siempre sin caché para sener

  deploy:
    name: Deploy Microfrontends
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Execute remote deployment
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "Deploying VUCEM Microfrontends to ${{ needs.setup.outputs.environment }}..."
            cd /home/ubuntu/v30
            
            # Create directory for manifests if it doesn't exist
            mkdir -p k8s
            
            # Download the K8s manifest template from repository
            curl -s https://raw.githubusercontent.com/vucem30-dev/frontend/fix/cicd/k8s/vucem-microfrontends.yaml -o k8s/vucem-microfrontends.yaml
            
            # Prepare the apps to be included in the deployment
            APPS_LIST="${{ needs.setup.outputs.final_apps }}"
            
            # Set the replicas based on environment
            if [ "${{ needs.setup.outputs.environment }}" == "prod" ]; then
              REPLICAS=2
              MIN_REPLICAS=2
              MAX_REPLICAS=5
            else
              REPLICAS=1
              MIN_REPLICAS=1
              MAX_REPLICAS=3
            fi
            
            # Generate module federation manifest
            cat > module-federation.manifest.json << EOF
            {
              "login": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/login",
              "aga": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/aga",
              "agriculture": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/agriculture",
              "se": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/se",
              "semarnat": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/semarnat",
              "agace": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/agace",
              "funcionario": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/funcionario",
              "cofepris": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/cofepris",
              "amecafe": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/amecafe",
              "sener": "https://vucem-${{ needs.setup.outputs.environment }}.example.com/sener"
            }
            EOF
            
            # Replace placeholders with actual values for all parameters
            sed -i "s/\${ENV}/${{ needs.setup.outputs.environment }}/g" k8s/vucem-microfrontends.yaml
            sed -i "s/\${REGISTRY}/${{ env.REGISTRY }}/g" k8s/vucem-microfrontends.yaml
            sed -i "s/\${TAG}/${{ needs.setup.outputs.environment }}/g" k8s/vucem-microfrontends.yaml
            
            # Set replica counts based on environment
            if [ "${{ needs.setup.outputs.environment }}" == "prod" ]; then
              sed -i "s/\${REPLICAS}/2/g" k8s/vucem-microfrontends.yaml
              sed -i "s/\${MIN_REPLICAS}/2/g" k8s/vucem-microfrontends.yaml
              sed -i "s/\${MAX_REPLICAS}/5/g" k8s/vucem-microfrontends.yaml
            else
              sed -i "s/\${REPLICAS}/1/g" k8s/vucem-microfrontends.yaml
              sed -i "s/\${MIN_REPLICAS}/1/g" k8s/vucem-microfrontends.yaml
              sed -i "s/\${MAX_REPLICAS}/3/g" k8s/vucem-microfrontends.yaml
            fi
            
            # Create ConfigMap for Module Federation Manifest
            microk8s kubectl create configmap module-federation-manifest \
              --from-file=module-federation.manifest.json \
              -n vucem-${{ needs.setup.outputs.environment }} \
              --dry-run=client -o yaml | microk8s kubectl apply -f -
            
            # Validate YAML syntax (optional but recommended)
            if command -v yamllint &> /dev/null; then
              yamllint -d relaxed k8s/vucem-microfrontends.yaml || echo "YAML validation warning (continuing anyway)"
            fi
            
            # Apply Kubernetes manifest
            microk8s kubectl apply -f k8s/vucem-microfrontends.yaml
            
            # Restart the deployment to pull the latest images
            microk8s kubectl rollout restart deployment vucem-microfrontends-${{ needs.setup.outputs.environment }}
            
            # Wait for rollout to complete
            microk8s kubectl rollout status deployment/vucem-microfrontends-${{ needs.setup.outputs.environment }} --timeout=300s
