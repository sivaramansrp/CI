name: CI/CD - Microfront Dashboard

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'docker/**'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_POSTINSTALL: 1   # Evita la ejecución del postinstall de Nx
    steps:
      # 1. Obtiene el código de tu repositorio.
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configura la versión de Node.js requerida (22.14.0).
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.14.0'
          
      - name: Instalar NX globalmente
        run: npm install -g nx@19.3.1
        
      # Instala el módulo nativo requerido para Linux.
      - name: Install native binding for Nx on Linux
        run: npm install @nx/nx-linux-x64-gnu
        
      # Instala el binding nativo de SWC para Linux (necesario para la compilación)
      - name: Install SWC native binding for Linux
        run: npm install @swc/core-linux-x64-gnu
        

      # 3. Instala las dependencias usando --force, tal como lo haces localmente.
      - name: Install dependencies
        run: |
          npm install --force
      # 4. Construye el proyecto Angular con Nx (build del dashboard).
      - name: Build Docker images from docker-compose
        run:  docker-compose -f ./docker/modulefederation-microfrontends.yml up -d
   

      - name: Listar archivos
        run: ls -la
        
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Packages
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: apps/dashboard/Dockerfile
          tags: |
            ghcr.io/vucem30/modulefederation-dashboard:latest
          push: ${{ github.ref == 'refs/heads/develop' }}

      - name: Execute remote command (last one)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/v30
            microk8s kubectl rollout restart deployment modulefederation-dashboard

      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v2
        with:
          context: ./
          file: apps/dashboard/Dockerfile
          tags: |
            ghcr.io/vucem30/modulefederation-login-microfront:latest
          push: ${{ github.ref == 'refs/heads/develop' }}

      - name: Execute remote command (last one)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/v30
            microk8s kubectl rollout restart deployment modulefederation-login-microfront	

      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v2
        with:
          context: ./
