name: CI/CD deploy-vucem30-front

on:
  workflow_dispatch:

  push:
    branches: [ "develop" ]
    paths:
      - 'vucem-3.0-frontend/**'

jobs:
  deploy:
    name: Deploy deploy-vucem30-front and build Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.9.0

      - name: Set Sonar Version Number
        run: echo "VERSION=6.2.1.4610-linux-x64" >> $GITHUB_ENV
        
      - name: Define SonarScanner full name
        run: echo "SONAR=sonar-scanner-${{ env.VERSION }}" >> $GITHUB_ENV
        
      - name: Download SonarScanner
        run: |
          cd vucem-3.0-frontend
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${{ env.VERSION }}.zip
          unzip sonar-scanner.zip
          
      - name: Verify SonarScanner Installation
        run: |
          cd vucem-3.0-frontend
          ./${{ env.SONAR }}/bin/sonar-scanner --version
        
      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd vucem-3.0-frontend
          ./${{ env.SONAR }}/bin/sonar-scanner \
            -Dsonar.projectKey=v30_front \
            -Dsonar.organization=v30 \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://sonar.ultrasist.net \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.verbose=true

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          cd vucem-3.0-frontend
          npm ci

      - name: Build Angular project
        run: |
          cd vucem-3.0-frontend
          npx ng build --configuration=production
        
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to GitHub Packages
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build image and push to GitHub Container Registry
        uses: docker/build-push-action@v2
        with:
          context: ./vucem-3.0-frontend/
          tags: |
            ghcr.io/vucem30/dockerized-front-vucem30:latest
          push: ${{ github.ref == 'refs/heads/develop' }}

      - name: Execute remote command (last one)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/v30
            microk8s kubectl rollout restart deployment front-vucem30-deployment-dev
