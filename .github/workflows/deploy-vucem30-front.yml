name: CI/CD - Microfront Dashboard

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'docker/**'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_POSTINSTALL: 1   # Evita la ejecución del postinstall de Nx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.14.0'

      - name: Install NX globally
        run: npm install -g nx@19.3.1

      - name: Install native binding for Nx on Linux
        run: npm install @nx/nx-linux-x64-gnu

      - name: Install SWC native binding for Linux
        run: npm install @swc/core-linux-x64-gnu

      - name: Install dependencies
        run: npm install

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Build image and push to GitHub Container Registry
        run: docker compose -f ./docker/modulefederation-microfrontends.yml build
		
      - name: Build image and push to GitHub Container Registry
        run: docker compose -f ./docker/modulefederation-microfrontends.yml push						

      - name: Execute remote command (last one)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/v30
            microk8s kubectl rollout restart deployment modulefederation-dashboard-deployment-dev
            microk8s kubectl rollout restart deployment modulefederation-login-microfront-deployment-dev
            microk8s kubectl rollout restart deployment modulefederation-aga-microfront-deployment-dev
            microk8s kubectl rollout restart deployment modulefederation-agriculture-microfront-deployment-dev
            microk8s kubectl rollout restart deployment modulefederation-se-microfront-dev
            microk8s kubectl rollout restart deployment modulefederation-semarnat-microfront-dev
            microk8s kubectl rollout restart deployment modulefederation-agace-microfront-deployment-dev
            microk8s kubectl rollout restart deployment modulefederation-funcionario-microfront-deployment-dev
            microk8s kubectl rollout restart deployment modulefederation-cofepris-microfront-deployment-dev
            microk8s kubectl rollout restart deployment modulefederation-amecafe-microfront-deployment-dev
            microk8s kubectl rollout restart deployment modulefederation-inbal-microfront-deployment-dev
            microk8s kubectl rollout restart deployment modulefederation-sedena-microfront
