name: CI/CD VUCEM Microfrontends

on:
  push:
    branches:
      - develop  # O la rama que prefieras

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout el código del repositorio
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Login en GitHub Container Registry (GHCR)
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }} # Usamos el nombre de usuario de GitHub
        password:  ${{ secrets.GITHUB_TOKEN }}  # Usamos el token de GitHub preconfigurado

    # 3. Construir la imagen Docker
    - name: Build Docker image
      run: docker compose -f ./docker/modulefederation-dashboard-microfront.yml build --no-cache	

    # 4. Subir la imagen al registro de GitHub Container Registry (GHCR)
    - name: Push Docker image to GHCR
      run: docker push ghcr.io/vucem30/dockerized-modulefederation-dashboard-microfront:1.0.0

