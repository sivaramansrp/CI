name: CI/CD VUCEM Microfrontends
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
  push:
    branches: [ "develop", "main" ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'docker/**'
      - 'package.json'
      - 'nx.json'
      - '.github/workflows/**'

env:
  NODE_VERSION: '22.14.0'
  NX_VERSION: '19.3.1'
  REGISTRY: ghcr.io
  BASE_IMAGE_NAME: ${{ github.repository_owner }}/vucem-front

jobs:
  setup:
    name: Setup and Check Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      changed_apps: ${{ steps.detect-changes.outputs.changed_apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install NX globally
        run: npm install -g nx@${{ env.NX_VERSION }}
      
      - name: Detect changed apps
        id: detect-changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Build all apps for manual workflow runs
            CHANGED_APPS="dashboard,login,aga,agriculture,se,semarnat,agace,funcionario,cofepris,amecafe"
          else
            # Detect changes in apps directory
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^apps/' || echo "")
            
            if [ -z "$CHANGED_FILES" ]; then
              # Check for changes in shared libs that would affect all apps
              SHARED_CHANGES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^libs/shared/' || echo "")
              if [ -n "$SHARED_CHANGES" ]; then
                # If shared libs changed, rebuild all apps
                CHANGED_APPS="dashboard,login,aga,agriculture,se,semarnat,agace,funcionario,cofepris,amecafe"
              else
                CHANGED_APPS=""
              fi
            else
              # Extract the app names from changed files
              CHANGED_APPS=$(echo "$CHANGED_FILES" | grep -oP 'apps/\K[^/]+' | sort -u | tr '\n' ',' | sed 's/,$//')
              
              # Always include dashboard when any app changes
              if [ -n "$CHANGED_APPS" ] && [[ ! "$CHANGED_APPS" =~ "dashboard" ]]; then
                CHANGED_APPS="dashboard,$CHANGED_APPS"
              fi
            fi
          fi
          
          echo "Changed apps: $CHANGED_APPS"
          echo "changed_apps=$CHANGED_APPS" >> $GITHUB_OUTPUT

  build:
    name: Build Microfrontends
    needs: setup
    if: needs.setup.outputs.changed_apps != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON('["' + replace(needs.setup.outputs.changed_apps, ',', '","') + '"]') }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            node_modules
            apps/*/node_modules
            libs/*/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: npm install --force
      
      - name: Install NX globally
        run: |
          npm install -g nx@${{ env.NX_VERSION }}
          npx nx --version
      
      - name: Reset NX cache
        run: npx nx reset
      
      - name: Build ${{ matrix.app }}
        run: npx nx build ${{ matrix.app }} --configuration=production
      
      - name: Verify build output
        run: |
          ls -la dist/apps/${{ matrix.app }} || echo "Build output not found at expected location"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-${{ matrix.app }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.environment }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Microfrontends
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout repository for Kubernetes manifests
        uses: actions/checkout@v3
      
      - name: Create Kubernetes deployment manifest
        run: |
          mkdir -p k8s
          cat > k8s/microfrontends-deployment.yaml << EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: vucem-microfrontends-${{ needs.setup.outputs.environment }}
          spec:
            replicas: ${{ needs.setup.outputs.environment == 'prod' && 2 || 1 }}
            selector:
              matchLabels:
                app: vucem-microfrontends
                env: ${{ needs.setup.outputs.environment }}
            template:
              metadata:
                labels:
                  app: vucem-microfrontends
                  env: ${{ needs.setup.outputs.environment }}
              spec:
                containers:
          EOF
          
          # Add containers for each changed app
          for app in $(echo "${{ needs.setup.outputs.changed_apps }}" | tr ',' ' '); do
            cat >> k8s/microfrontends-deployment.yaml << EOF
                - name: $app
                  image: ${{ env.REGISTRY }}/${{ env.BASE_IMAGE_NAME }}-$app:${{ needs.setup.outputs.environment }}
                  ports:
                    - containerPort: 80
                  resources:
                    requests:
                      memory: "128Mi"
                      cpu: "100m"
                    limits:
                      memory: "256Mi"
                      cpu: "500m"
                  livenessProbe:
                    httpGet:
                      path: /
                      port: 80
                    initialDelaySeconds: 30
                    timeoutSeconds: 3
                    periodSeconds: 30
          EOF
          done
      
      - name: Create Kubernetes service manifest
        run: |
          cat > k8s/microfrontends-service.yaml << EOF
          apiVersion: v1
          kind: Service
          metadata:
            name: vucem-microfrontends-svc-${{ needs.setup.outputs.environment }}
          spec:
            selector:
              app: vucem-microfrontends
              env: ${{ needs.setup.outputs.environment }}
            ports:
              - port: 80
                targetPort: 80
            type: ClusterIP
          EOF
      
      - name: Create Ingress manifest
        run: |
          cat > k8s/microfrontends-ingress.yaml << EOF
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: vucem-microfrontends-ingress-${{ needs.setup.outputs.environment }}
            annotations:
              nginx.ingress.kubernetes.io/rewrite-target: /
          spec:
            ingressClassName: nginx
            rules:
              - host: vucem-${{ needs.setup.outputs.environment }}.example.com
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: vucem-microfrontends-svc-${{ needs.setup.outputs.environment }}
                          port:
                            number: 80
          EOF
      
      - name: Execute remote deployment
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "Deploying VUCEM Microfrontends to ${{ needs.setup.outputs.environment }}..."
            cd /home/ubuntu/v30
            
            # Apply Kubernetes manifests from a directory
            mkdir -p k8s-${{ needs.setup.outputs.environment }}
            cat > k8s-${{ needs.setup.outputs.environment }}/vucem-microfrontends.yaml << 'MANIFESTSEOF'
            ${{ secrets.KUBECONFIG }}
            MANIFESTSEOF
            
            # Apply Kubernetes manifests
            microk8s kubectl apply -f k8s-${{ needs.setup.outputs.environment }}/vucem-microfrontends.yaml
            
            # Restart the deployment to pull the latest images
            microk8s kubectl rollout restart deployment vucem-microfrontends-${{ needs.setup.outputs.environment }}
            
            # Wait for rollout to complete
            microk8s kubectl rollout status deployment/vucem-microfrontends-${{ needs.setup.outputs.environment }} --timeout=300s