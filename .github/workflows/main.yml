name: Build, Push, Deploy Profepa App

on:
  # push:
  #   branches:
  #     - develop
  #   paths:
  #     - 'apps/profepa/**'
  #     - 'libs/**'
  #     - 'package.json'
  #     - 'nx.json'
  #     - 'angular.json'
  #     - 'workspace.json'
  #     - 'docker/**'
  #     - 'k8s/profepa-microfront/**'
  #     - '.github/workflows/profepa-build-deploy.yml'
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dockerized-modulefederation-profepa-microfront

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract app version
        id: get_version
        run: |
          echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Build Angular app (Nx)
        run: npx nx build profepa --configuration=production

      - name: Inject version into build
        if: hashFiles('script/inject-version.js') != ''
        run: node script/inject-version.js

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ env.VERSION }} -f apps/profepa/Dockerfile.dev .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ env.VERSION }}

      - name: Update deployment manifest image tag
        run: |
          sed -i "s|\(image: ghcr.io/vucem30-dev/dockerized-modulefederation-profepa-microfront:\).*|\1${VERSION}|" k8s/profepa-microfront/profepa-microfront-deployment-dev.yaml

      - name: Upload Kubernetes manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          source: "k8s/profepa-microfront"
          target: "~/profepa-microfront/"

      - name: Deploy on Microk8s via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          script: |
            set -e
            cd ~/profepa-microfront/
            # Apply all .yaml, .yml, .json files in this directory
            for f in *.yaml *.yml *.json; do
              [ -e "$f" ] && microk8s.kubectl apply -f "$f"
            done
            # Recursively apply manifests in subdirectories as well
            find . -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) -exec microk8s.kubectl apply -f {} \;

      - name: Wait for deployment to become ready
        run: sleep 60

# NOTE:
# - The push trigger is commented out. This workflow will only run when you manually trigger it from the Actions tab.
# - The version check step has been removed.
# - The deployment manifest is updated to use the correct image tag before upload.
