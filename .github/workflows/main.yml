name: Build and Deploy Profepa Microfront to MicroK8s

on:
  push:
    branches:
      - qa-1
    paths:
      - 'apps/profepa/**'
      - 'libs/**'
      - 'docker/modulefederation-profepa-microfront.yml'
      - 'k8s/profepa-microfront/**'
      - '.github/workflows/profepa-build-deploy.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/vucem30/dockerized-modulefederation-profepa-microfront
  IMAGE_TAG: 1.0.3

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: apps/profepa/Dockerfile.dev
        push: true
        tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        build-args: |
          NODE_ENV=production

  deploy:
    name: Deploy to MicroK8s via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Copy K8s manifests to remote
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.REMOTE_SRV_IP }}
        username: ${{ secrets.REMOTE_SRV_USER }}
        key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
        source: "k8s/profepa-microfront/"
        target: "~/profepa-microfront-manifests/"

    - name: Deploy on MicroK8s host via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.REMOTE_SERVER_IP }}
        username: ${{ secrets.REMOTE_SERVER_USER }}
        key: ${{ secrets.REMOTE_SERVER_KEY }}
        envs: IMAGE_NAME,IMAGE_TAG
        script: |
          echo "Logging in to GHCR..."
          echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "Updating deployment image (if deployment exists)..."
          kubectl set image deployment/modulefederation-profepa-microfront-dev modulefederation-profepa-microfront=${IMAGE_NAME}:${IMAGE_TAG} --namespace=default || true

          echo "Applying K8s manifests..."
          kubectl apply -f ~/profepa-microfront-manifests/profepa-microfront-service-dev.yaml
          kubectl apply -f ~/profepa-microfront-manifests/profepa-microfront-ingress-dev.yaml

          echo "Deployment completed."
