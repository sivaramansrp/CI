name: Build and Deploy profepa App

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'apps/profepa/**'
      - 'docker/modulefederation-profepa-microfront.yml'
      - 'k8s/profepa-microfront/**'
      - 'package.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_NAME: ghcr.io/vucem30/dockerized-modulefederation-profepa-microfront:${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        run: |
          docker compose -f docker/modulefederation-profepa-microfront.yml build
          docker compose -f docker/modulefederation-profepa-microfront.yml push
      - name: Deploy to MicroK8s via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/v30/deploy/deploy-microfront/profepa-microfront/
            # Replace image tag in deployment YAML dynamically
            sed -i "s|ghcr.io/vucem30/dockerized-modulefederation-profepa-microfront:.*|ghcr.io/vucem30/dockerized-modulefederation-profepa-microfront:${{ github.sha }}|g" profepa-microfront-deployment-dev.yaml
            microk8s kubectl apply -f profepa-microfront-deployment-dev.yaml
            microk8s kubectl rollout restart deployment modulefederation-profepa-microfront-deployment-dev -n default
            microk8s kubectl get pods -n default | grep profepa
