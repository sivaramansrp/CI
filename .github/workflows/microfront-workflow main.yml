name: Build, Push, Deploy Microfront App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App to deploy (e.g., crt, profepa)'
        required: true
        type: string
        default: 'crt'

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON('["crt", "profepa"]'), github.event.inputs.app_name) }}
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dockerized-modulefederation-${{ github.event.inputs.app_name }}-microfront

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "🎯 Building $IMAGE_NAME:$VERSION"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build ${{ env.APP_NAME }} app
        run: |
          # Use envsubst to replace ${APP_NAME} in nginx.conf
          cp apps/${{ env.APP_NAME }}/nginx.conf /tmp/nginx.conf
          sed -i "s|\${APP_NAME}|${{ env.APP_NAME }}|g" /tmp/nginx.conf

          # Build Docker image
          docker build \
            --build-arg APP_NAME=${{ env.APP_NAME }} \
            --build-arg NODE_ENV=production \
            -t $IMAGE_NAME:${{ env.VERSION }} \
            -f apps/${{ env.APP_NAME }}/Dockerfile.dev \
            --build-arg VERSION=${{ env.VERSION }} \
            --build-context node=. \
            --build-context nginx=/tmp/nginx.conf \
            .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ env.VERSION }}

      - name: Update deployment manifest image tag
        run: |
          sed -i "s|\(image: ghcr.io/${{ github.repository_owner }}/dockerized-modulefederation-${{ env.APP_NAME }}-microfront:\).*|\1${{ env.VERSION }}|" \
            apps/${{ env.APP_NAME }}/k8s/*.yaml

      - name: Deploy to remote server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          source: "apps/${{ env.APP_NAME }}/k8s/*"
          target: "~/deploy/${{ env.APP_NAME }}/"

      - name: Apply Kubernetes manifests
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          script: |
            cd ~/deploy/${{ env.APP_NAME }}
            find . -type f \( -name "*.yaml" -o -name "*.yml" \) -exec microk8s.kubectl apply -f {} \;

      - name: Wait for rollout
        run: |
          sleep 15
          microk8s.kubectl rollout status deployment/${{ env.APP_NAME }}-microfront --timeout=60s || true
