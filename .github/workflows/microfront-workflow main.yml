name: Build, Push, Deploy Microfront App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name of the app to build and deploy (e.g., crt, profepa)'
        required: true
        default: 'crt'

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON('["crt", "profepa"]'), github.event.inputs.app_name) }}
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dockerized-modulefederation-${{ github.event.inputs.app_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "🎯 Building $IMAGE_NAME:$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (Nx)
        run: npx nx build ${{ env.APP_NAME }} --configuration=production

      - name: Inject version into build
        if: hashFiles('script/inject-version.js') != ''
        run: node script/inject-version.js ${{ env.APP_NAME }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$VERSION -f apps/${{ env.APP_NAME }}/Dockerfile.dev .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$VERSION

      - name: Update deployment manifest image tag
        run: |
          sed -i "s|\(image: ghcr.io/${{ github.repository_owner }}/dockerized-modulefederation-${{ env.APP_NAME }}:\).*|\1${{ env.VERSION }}|" \
            k8s/${{ env.APP_NAME }}-microfront/${{ env.APP_NAME }}-microfront-deployment-dev.yaml

      - name: Upload Kubernetes manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          source: "k8s/${{ env.APP_NAME }}-microfront/*"
          target: "~/deploy/${{ env.APP_NAME }}/"

      - name: Apply Kubernetes manifests
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          script: |
            cd ~/deploy/${{ env.APP_NAME }}
            find . -type f \( -name "*.yaml" -o -name "*.yml" \) -exec microk8s.kubectl apply -f {} \;

      - name: Wait for deployment rollout
        run: |
          sleep 15
          microk8s.kubectl rollout status deployment/${{ env.APP_NAME }}-microfront --timeout=60s || true
