name: Build, Push, Deploy Microfront App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name of the app to build and deploy (e.g., crt, profepa)'
        required: true
        type: string
        default: 'crt'

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON('["crt", "profepa"]'), github.event.inputs.app_name) }}
    env:
      APP_NAME: ${{ github.event.inputs.app_name }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dockerized-modulefederation-${{ github.event.inputs.app_name }}-microfront

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "🎯 Building $IMAGE_NAME:$VERSION"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build ${{ env.APP_NAME }} app
        run: |
          # Build the app using Nx
          npx nx build ${{ env.APP_NAME }} --configuration=production --base-href=/${{ env.APP_NAME }}/

      - name: Inject version into index.html
        if: hashFiles('script/inject-version.js') != ''
        run: |
          if [ -f "script/inject-version.js" ]; then
            node script/inject-version.js ${{ env.APP_NAME }}
            echo "✅ Version ${{ env.VERSION }} injected into ${{ env.APP_NAME }}"
          else
            echo "⚠️ script/inject-version.js not found, skipping"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_NAME=${{ env.APP_NAME }} \
            --build-arg NODE_ENV=production \
            --build-arg VERSION=${{ env.VERSION }} \
            -t $IMAGE_NAME:${{ env.VERSION }} \
            -f apps/${{ env.APP_NAME }}/Dockerfile.dev \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ env.VERSION }}

      - name: Update image tag in Kubernetes manifests
        run: |
          find k8s/${{ env.APP_NAME }}-microfront/ -type f \( -name "*.yaml" -o -name "*.yml" \) -exec \
            sed -i "s|image: ghcr.io/${{ github.repository_owner }}/dockerized-modulefederation-${{ env.APP_NAME }}-microfront:.*|image: $IMAGE_NAME:${{ env.VERSION }}|g" {} \;

      - name: Upload Kubernetes manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          source: "k8s/${{ env.APP_NAME }}-microfront/*"
          target: "~/deploy/${{ env.APP_NAME }}/"

      - name: Apply Kubernetes manifests
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_PRIV_KEY }}
          script: |
            cd ~/deploy/${{ env.APP_NAME }}
            find . -type f \( -name "*.yaml" -o -name "*.yml" \) -exec microk8s.kubectl apply -f {} \;

      - name: Wait for deployment rollout
        run: |
          sleep 15
          microk8s.kubectl rollout status deployment/${{ env.APP_NAME }}-microfront --timeout=60s || true
