name: Build, Push, Deploy Microfront App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'crt'
        required: true
        default: 'profepa'

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dockerized-modulefederation-${{ github.event.inputs.app_name }}-microfront

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract app version
        id: get_version
        run: |
          echo "VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Build Angular app (Nx)
        run: npx nx build ${{ github.event.inputs.app_name }} --configuration=production

      - name: Inject version into build
        if: hashFiles('script/inject-version.js') != ''
        run: node script/inject-version.js ${{ github.event.inputs.app_name }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ env.VERSION }} -f apps/${{ github.event.inputs.app_name }}/Dockerfile.dev .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ env.VERSION }}

      - name: Update deployment manifest image tag
        run: |
          sed -i "s|\(image: ghcr.io/vucem30-dev/dockerized-modulefederation-${{ github.event.inputs.app_name }}-microfront:\).*|\1${VERSION}|" k8s/${{ github.event.inputs.app_name }}-microfront/${{ github.event.inputs.app_name }}-microfront-deployment-dev.yaml

      - name: Upload Kubernetes manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          source: "k8s/${{ github.event.inputs.app_name }}-microfront"
          target: "~/${{ github.event.inputs.app_name }}-microfront/"

      - name: Deploy on Microk8s via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          script: |
            set -e
            cd ~/${{ github.event.inputs.app_name }}-microfront/
            # Apply all .yaml, .yml, .json files in this directory
            for f in *.yaml *.yml *.json; do
              [ -e "$f" ] && microk8s.kubectl apply -f "$f"
            done
            # Recursively apply manifests in subdirectories as well
            find . -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) -exec microk8s.kubectl apply -f {} \;

      - name: Wait for deployment to become ready
        run: sleep 60

# NOTE:
# - To deploy, go to the Actions tab, run this workflow, and input the app name (e.g., profepa, crt).
# - The workflow will build, inject version, dockerize, and deploy the specified app.
