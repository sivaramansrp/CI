name: Deploy Microfront App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Microfront app name (e.g. crt-microfront)'
        required: true
        default: 'crt-microfront'
      image_tag:
        description: 'Docker image tag (e.g. 1.1.83)'
        required: true
        default: '1.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image for microfront app
        run: |
          docker compose -f docker/modulefederation-${{github.event.inputs.app_name}}.yml build --no-cache

      - name: Tag Docker image
        run: |
          docker tag ghcr.io/vucem30/dockerized-modulefederation-${{github.event.inputs.app_name}}:1.0.3 \
            ghcr.io/vucem30/dockerized-modulefederation-${{github.event.inputs.app_name}}:${{github.event.inputs.image_tag}}

      - name: Push Docker image
        run: |
          docker push ghcr.io/vucem30/dockerized-modulefederation-${{github.event.inputs.app_name}}:${{github.event.inputs.image_tag}}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug:List yaml files before copy
        run: |
          echo "Showing YAML files in k8s/${{github.event.inputs.app_name}}/"
          ls -l k8s/${{github.event.inputs.app_name}}/ || echo "Directory does not exist"
          echo "Full find output:"
          find k8s/${{github.event.inputs.app_name}}/ || echo "Directory does not exist"

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          source: k8s/${{github.event.inputs.app_name}}/*.yaml
          target: ~/deployments/${{github.event.inputs.app_name}}/
          strip_components: 2

      - name: List files on remote after copy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          script: |
            ls -l ~/deployments/${{github.event.inputs.app_name}}/

      - name: SSH Deploy and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          script: |
            set -e
            APP_NAME="${{ github.event.inputs.app_name }}"
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            DEPLOY_DIR=~/deployments/$APP_NAME
            DEPLOYMENT_FILE="${APP_NAME}-deployment-dev.yaml"
            SERVICE_FILE="${APP_NAME}-service-dev.yaml"
            INGRESS_FILE="${APP_NAME}-ingress-dev.yaml"
            cd "$DEPLOY_DIR"
            for FILE in "$DEPLOYMENT_FILE" "$SERVICE_FILE" "$INGRESS_FILE"; do
              if [ ! -f "$FILE" ]; then
                echo "ERROR: $FILE not found in $(pwd)"
                ls -l
                exit 1
              fi
            done
            docker login --username ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }} ghcr.io
            docker pull ghcr.io/vucem30/dockerized-modulefederation-$APP_NAME:$IMAGE_TAG
            # Update deployment YAML with new image tag
            sed -i "s|ghcr.io/vucem30/dockerized-modulefederation-$APP_NAME:.*|ghcr.io/vucem30/dockerized-modulefederation-$APP_NAME:$IMAGE_TAG|g" "$DEPLOYMENT_FILE"
            # Make sure imagePullSecret is present in the YAML (add if missing)
            if ! grep -q "imagePullSecrets:" $DEPLOYMENT_FILE; then
              sed -i "/containers:/a\ \ \ \ imagePullSecrets:\n\ \ \ \ \ \ - name: vucem30registrykey" $DEPLOYMENT_FILE
            fi
            # Apply K8s resources
            microk8s kubectl apply -f $DEPLOYMENT_FILE -n $NAMESPACE
            microk8s kubectl apply -f $SERVICE_FILE -n $NAMESPACE
            microk8s kubectl apply -f $INGRESS_FILE -n $NAMESPACE
            # Optionally, delete old pods (if you want a clean slate)
            DEPLOY_NAME=$(microk8s kubectl get deploy -n $NAMESPACE --no-headers | grep "${{ github.event.repository.name }}" | awk '{print $1}')
            if [ ! -z "$DEPLOY_NAME" ]; then
              microk8s kubectl rollout restart deployment/$DEPLOY_NAME -n $NAMESPACE
            fi

            # Show pod status
            microk8s kubectl get pods -n $NAMESPACE | grep "${{ github.event.repository.name }}"

            
