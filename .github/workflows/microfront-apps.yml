name: Deploy Microfront App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Microfront app name (e.g. crt-microfront)'
        required: true
        default: 'crt-microfront'
      image_tag:
        description: 'Docker image tag (e.g. 1.1.83)'
        required: true
        default: '1.0.0'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image for microfront app
        run: |
          docker compose -f docker/modulefederation-${{ github.event.inputs.app_name }}.yml build --no-cache

      - name: Tag Docker image
        run: |
          docker tag ghcr.io/vucem30/dockerized-modulefederation-${{ github.event.inputs.app_name }}:1.0.2 \
            ghcr.io/vucem30/dockerized-modulefederation-${{ github.event.inputs.app_name }}:${{ github.event.inputs.image_tag }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/vucem30/dockerized-modulefederation-${{ github.event.inputs.app_name }}:${{ github.event.inputs.image_tag }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          source: k8s/${{ github.event.inputs.app_name }}/*
          target: ~/deployments/${{ github.event.inputs.app_name }}/

      - name: SSH Deploy and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_SRV_IP }}
          username: ${{ secrets.REMOTE_SRV_USER }}
          key: ${{ secrets.REMOTE_SRV_PRIV_KEY }}
          script: |
            cd ~/deployments/${{ github.event.inputs.app_name }}/
            docker login --username ${{ secrets.DOCKER_USERNAME }} --password ${{ secrets.DOCKER_PASSWORD }} ghcr.io
            docker pull ghcr.io/vucem30/dockerized-modulefederation-${{ github.event.inputs.app_name }}:${{ github.event.inputs.image_tag }}
            # Update deployment YAML with new image tag
            sed -i "s|ghcr.io/vucem30/dockerized-modulefederation-${{ github.event.inputs.app_name }}:.*|ghcr.io/vucem30/dockerized-modulefederation-${{ github.event.inputs.app_name }}:${{ github.event.inputs.image_tag }}|g" ${{ github.event.inputs.app_name }}-deployment-dev.yaml
            microk8s kubectl apply -f ${{ github.event.inputs.app_name }}-deployment-dev.yaml
            microk8s kubectl rollout restart deployment modulefederation-${{ github.event.inputs.app_name }}-deployment-dev -n default
            microk8s kubectl get pods | grep ${{ github.event.inputs.app_name }}
