name: Quality Lint and Test Affected Projects

on:
  pull_request:
    # Solo ejecutar cuando los PRs van hacia ramas principales
    branches: [ "develop", "staging", "production" ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'nx.json'
      - '.eslintrc.json'
  push:
    branches: ["develop", "staging", "production" ]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'package.json'
      - 'nx.json'
      - '.eslintrc.json'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      NX_SKIP_POSTINSTALL: 1   # Evita la ejecución del postinstall de Nx
    steps:
      # Obtiene el código de tu repositorio.
      - name: Checkout repository
        uses: actions/checkout@v3

      #  Configura la versión de Node.js requerida (22.14.0).
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.14.0'
          
      - name: Instalar NX globalmente
        run: npm install -g nx@19.3.1
        
      # Instala el módulo nativo requerido para Linux.
      - name: Install native binding for Nx on Linux
        run: npm install @nx/nx-linux-x64-gnu
        
      # Instala el binding nativo de SWC para Linux (necesario para la compilación)
      - name: Install SWC native binding for Linux
        run: npm install @swc/core-linux-x64-gnu
        

      # 3. Instala las dependencias usando --force, tal como lo haces localmente.
      - name: Install dependencies
        run: |
          npm install --force
        
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1


      - name: Get affected projects
        id: affected
        run: |
          npx nx show projects --affected --base=origin/${{ github.event.pull_request.base.ref || 'main' }} --head=HEAD > affected.txt
          cat affected.txt
          echo "AFFECTED_PROJECTS<<EOF" >> $GITHUB_ENV
          cat affected.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run lint for affected projects
        run: |
          echo "🔍 Running lint for affected projects..."
          for project in $AFFECTED_PROJECTS; do
            if npx nx run $project:lint 2>/dev/null; then
              echo "✅ Lint passed for $project"
            else
              echo -e "\033[0;31m❌ Lint failed for $project\033[0m"
            fi
          done

      - name: Run unit tests for affected projects
        continue-on-error: true
        run: |
          echo "🧪 Running unit tests for affected projects..."
          for project in $AFFECTED_PROJECTS; do
            if npx nx run $project:test --watch=false --browsers=ChromeHeadless 2>/dev/null; then
              echo "✅ Tests passed for $project"
            else
              echo -e "\033[0;31m❌ Tests failed for $project\033[0m"
            fi
          done
