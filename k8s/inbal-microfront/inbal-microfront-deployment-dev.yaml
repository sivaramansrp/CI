apiVersion: apps/v1
kind: Deployment
metadata:
  name: modulefederation-inbal-microfront-deployment-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: modulefederation-inbal-microfront-dev
  template:
    metadata:
      labels:
        app: modulefederation-inbal-microfront-dev
    spec:
      containers:
      - name: front-vucem30-container-dev
        image: ghcr.io/vucem30/dockerized-modulefederation-inbal-microfront:latest
        ports:
        - containerPort: 80
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: dev
      imagePullSecrets:
      - name: vucem30registrykey
