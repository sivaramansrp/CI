---
# Service for VUCEM Microfrontends
apiVersion: v1
kind: Service
metadata:
  name: vucem-frontend-svc-${ENV}
  namespace: vucem-${ENV}
  labels:
    app: vucem-microfrontends
    env: ${ENV}
    tier: frontend
spec:
  selector:
    app: vucem-microfrontends
    env: ${ENV}
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  type: ClusterIP
---
# Ingress for VUCEM Microfrontends
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vucem-frontend-ingress-${ENV}
  namespace: vucem-${ENV}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - vucem-${ENV}.example.com
    secretName: vucem-tls-cert
  rules:
  - host: vucem-${ENV}.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vucem-frontend-svc-${ENV}
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: vucem-backend-svc
            port:
              number: 8080
---
# HorizontalPodAutoscaler for VUCEM Microfrontends
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vucem-microfrontends-hpa-${ENV}
  namespace: vucem-${ENV}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vucem-microfrontends-${ENV}
  minReplicas: ${MIN_REPLICAS}
  maxReplicas: ${MAX_REPLICAS}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80