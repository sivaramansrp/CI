---
# Namespace for VUCEM Microfrontends
apiVersion: v1
kind: Namespace
metadata:
  name: vucem-${ENV}
---
# ConfigMap for environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: vucem-frontend-config
  namespace: vucem-${ENV}
data:
  NODE_ENV: "production"
  API_URL: "https://api-vucem-${ENV}.example.com"
---
# Deployment for VUCEM Microfrontends
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vucem-microfrontends-${ENV}
  namespace: vucem-${ENV}
  labels:
    app: vucem-microfrontends
    env: ${ENV}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: vucem-microfrontends
      env: ${ENV}
  template:
    metadata:
      labels:
        app: vucem-microfrontends
        env: ${ENV}
    spec:
      imagePullSecrets:
        - name: github-container-registry
      containers:
        - name: dashboard
          image: ${REGISTRY}/vucem-front-dashboard:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health.txt
              port: 80
            initialDelaySeconds: 30
            timeoutSeconds: 3
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health.txt
              port: 80
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
        - name: login
          image: ${REGISTRY}/vucem-front-login:${TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
