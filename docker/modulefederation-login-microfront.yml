services:
#----------------------------------------------------------------
  modulefederation-login-microfront:
    image: modulefederation-login-microfront:1.0.0
    build: 
      context: ./../
      dockerfile: apps/login/Dockerfile
    container_name: modulefederation-login-microfront
    restart: on-failure
    expose:
      - '4201'
    ports:
      - "4201:80"
    networks:
      - modulefederation-network
#----------------------------------------------------------------
networks:
  modulefederation-network:
