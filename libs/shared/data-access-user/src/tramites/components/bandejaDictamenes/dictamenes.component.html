<div class="container">
    <div class="row mt-4 mb-4">
      <div class="col-md 6">
        <h4 class="titulo titulo-gold">Dictame(s)</h4>
      </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-12">
        <table class="table table-striped">
            <thead>
              <tr>
                @for (item of encabezadoTablaDictamen; track $index) {
                  <th>{{ item.valor }}</th>
                  }
                <th class="center">Detalle</th>
              </tr>
            </thead>
            <tbody>
              @for (row of datosTablaDictamen; track $index) {
              <tr>
                @for (item of encabezadoTablaDictamen;  let i = $index; track $index) {
                <td>{{ row[item.key] }}</td>
                }
                <td class="center">
                  <button type="button" class="btn btn-link me-2" id="verPdf" data-bs-toggle="button"
                    data-bs-placement="top" title="Detalle requerimiento" (click)="verPdf(row.urlPdf)">
                    <i class="bi bi-file-earmark-pdf text-danger"></i>
                  </button>
                </td>
              </tr>
              }
            </tbody>
          </table>
    </div>
</div>
</div>
