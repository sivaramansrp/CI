<div class="row mt-4">
  <div class="col-md-12">
    <table class="table table-striped">
      <thead>
        @for (item of headerTabla; track $index) {
        <th>{{ item }}</th>
        }
      </thead>
      <tbody>

      </tbody>
    </table>

  </div>
</div>

<div class="row">

  <div class="col-md-12 d-flex justify-content-end">
    <button type="button" class="btn btn-primary" (click)="abrirModal()">Agregar</button>
  </div>

</div>

<!-- Modal error -->
<div class="modal modal-lg fade" [ngClass]="modal" id="modalError" #modalError tabindex="-1"
  aria-labelledby="modalErrorLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Datos del vehículo de como se presentará al despacho</h4>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-12">
            @switch (tipo) {
            @case ('1') {
            <ng-container *ngTemplateOutlet="carretero"></ng-container>
            }
            @case ('2') {
            <ng-container *ngTemplateOutlet="ferroviario"></ng-container>
            }
            @case ('3') {
            <ng-container *ngTemplateOutlet="maritimo"></ng-container>
            }
            @case ('4') {
            <ng-container *ngTemplateOutlet="aereo"></ng-container>
            }
            @case ('5') {
            <ng-container *ngTemplateOutlet="peatonal"></ng-container>
            }
            @default {
            <ng-container *ngTemplateOutlet="otro"></ng-container>
            }
            }

            <div class="form-group">
              <label class="form-label" for="idPedimento">Observaciones</label>
              <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" (click)="cerrarModal()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</div>

<ng-template #carretero>
  <div class="row" [formGroup]="carreteroForma">
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="empresaTransportista">Empresa transportista:</label>
        <input class="form-control" id="empresaTransportista" placeholder="" type="text"
          formControlName="empresaTransportista">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="numeroCartaPorte">Número carta porte:</label>
        <input class="form-control" id="numeroCartaPorte" placeholder="" type="text" formControlName="numeroCartaPorte">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="idPedimento">Fecha carta porte:</label>
        <input class="form-control" id="idPedimento" placeholder="" type="text" formControlName="numeroCartaPorte">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="fechaCartaPorte">Marca:</label>
        <input class="form-control" id="fechaCartaPorte" placeholder="" type="text" formControlName="fechaCartaPorte">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="modelo">Modelo:</label>
        <input class="form-control" id="modelo" placeholder="" type="text" formControlName="modelo">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="placas">Placas:</label>
        <input class="form-control" id="placas" placeholder="" type="text" formControlName="placas">
      </div>
    </div>
    <div class="col-md-12">
      <div class="form-group">
        <label class="form-label" for="contenedores">Contenedor(es)</label>
        <textarea class="form-control" id="contenedores" rows="3" formControlName="contenedores"></textarea>
      </div>
    </div>
  </div>

</ng-template>

    <div class="col-md-6">

        <label class="form-label" for="idPedimento">Npumero de BL:</label>

      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="idPedimento">Tipo de equipo:</label>
        <input class="form-control" id="idPedimento" placeholder="" type="text">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="idPedimento">Iniciales de equipo:</label>
        <input class="form-control" id="idPedimento" placeholder="" type="text">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="idPedimento">Número de equipo:</label>
        <input class="form-control" id="idPedimento" placeholder="" type="text">
      </div>
    </div>
  </div>
</ng-template>

      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="idPedimento">Nombre transportista:</label>
        <input class="form-control" id="idPedimento" placeholder="" type="text">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="idPedimento">ID de Gafete:</label>

      </div>
    </div>

<ng-template #maritimo></ng-template>

<ng-template #aereo></ng-template>

<ng-template #otro>
  <div class="row">
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="idPedimento">Tipo de transporte:</label>
        <input class="form-control" id="idPedimento" placeholder="" type="text">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="idPedimento">Empresa transportista:</label>
        <input class="form-control" id="idPedimento" placeholder="" type="text">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label class="form-label" for="idPedimento">Datos del transporte:</label>
        <input class="form-control" id="idPedimento" placeholder="" type="text">
      </div>
    </div>
  </div>
</ng-template>
