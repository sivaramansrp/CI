<ng-titulo titulo="Terceros relacionados" />
<div class="row d-flex">
  <div class="col-md-8" [formGroup]="FormPersona">
    <div class="col-md-6 form-group">
      <label class="form-label" for="nombre_rfc">Nombre / Razón Social:</label>
      <input
        class="form-control"
        id="nombre_rfc"
        placeholder=""
        type="text"
        formControlName="nombre"
        [ngClass]="isValid('nombre') ? 'required' : ''"
        libUppercase
      />
    </div>
    <div class="col-md-6 form-group">
      <label class="form-label" for="nombre_imp">Correo electrónico:</label>
      <input
        class="form-control"
        id="correo"
        placeholder=""
        type="text"
        formControlName="correo"
        [ngClass]="isValid('correo') ? 'required' : ''"
      />
      @if (correoValido()) {
      <p>Formato incorrecto</p>
      }
    </div>
  </div>

  <div class="col-md-4 d-flex align-items-end">
    <button
      class="btn btn-primary ms-2 d-flex"
      type="button"
      (click)="agregaPersona()"
      [disabled]="esFormularioSoloLectura"
    >
      Agregar
    </button>
  </div>
</div>

<div class="row mt-4">
  <div class="col-md-2"></div>
  <div class="col-md-8">
    <table class="table table-responsive">
      <thead>
        <tr>
          <th>Nombre/Razón social</th>
          <th>Correo electrónico</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (item of personas; let i = $index; track item.nombre;) {
        <tr>
          <td>{{ item.nombre }}</td>
          <td>{{ item.correo }}</td>
          <td>
            <button class="btn btn-link" title="Eliminar" (click)="eliminar(i)">
              <i class="bi bi-trash3"></i>
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
  <div class="col-md-2"></div>
</div>

@if (nuevaNotificacion) {
<section>
  <lib-notificaciones [notificacionInput]="nuevaNotificacion">
  </lib-notificaciones>
</section>
}
