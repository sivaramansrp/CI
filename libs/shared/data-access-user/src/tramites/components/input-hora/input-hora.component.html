<div [formGroup]="forma">
  <label class="form-label" [for]="inputId">{{ label }} @if(required){*} :</label>
  <input class="form-control" type="text" name="hora" [id]="inputId" formControlName="hora" placeholder="00:00 (24 hrs)"
    HoraFormato [ngClass]="isValid ? 'required' : ''" (change)="handleChange($event)" />
  <div *ngIf="isValid" class="mensaje-error">
    Hora no válida
  </div>
</div>
