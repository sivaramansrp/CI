<div class="container">
    <div class="row">
      <ul class="nav nav-tabs">
        <li [ngClass]="indice === 1 ? 'active' : ''">
          <a (click)="seleccionaTab(1)" (keyup.enter)="seleccionaTab(1)" (keydown.space)="seleccionaTab(1)" tabindex="0" data-toggle="tab" >Opinión</a>
        </li>
        <li *ngIf="indice === 2" [ngClass]="indice === 2 ? 'active' : ''">
          <a (click)="seleccionaTab(2)" (keyup.enter)="seleccionaTab(2)" (keydown.space)="seleccionaTab(2)" tabindex="0" data-toggle="tab" >Detalle</a>
        </li>
      </ul>
  
      <ng-container>
        @switch (indice) {
        @case (1) {
         <lib-opinion [opinion] = "opinion" (idOpinionSeleccionada)="onIdOpinionSeleccionada($event)"></lib-opinion>
        }
        @case (2) {
         <lib-detalle-opinion *ngIf="indice === 2" [solicitud]="solicitud"></lib-detalle-opinion>
        }
        }
      </ng-container>
    </div>
  </div>
