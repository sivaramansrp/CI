<div class="row mt-4 mb-4">
  <div class="col-md 12">
    <table class="table table-container ">
      <thead>
        <tr class="table-header">
          @for (item of encabezadoTablaDocumentos; track $index) {
            <th>{{ item.valor }}</th>
            }
          <th class="center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (row of datosTablaDocumentos; track $index) {
        <tr class="table-row" >
          @for (item of encabezadoTablaDocumentos;  let i = $index; track $index) {                  
              <td *ngIf="item.key === 'estatus'">
              <span *ngIf="row[item.key] === 'Autorizado'" class="text-success">
                <i class="bi bi-check-circle-fill"></i> {{ 'Correcto' }}
              </span>
              <span *ngIf="row[item.key] !== 'Autorizado'" class="text-danger">
                <i class="bi bi-x-circle-fill"></i> {{ row[item.key] }}
              </span>
              </td>
              <td *ngIf="item.key !== 'estatus'">
              {{ row[item.key] }}
              </td>
          }
          <td class="center">
            <button type="button" class="btn btn-link me-2" id="verPdf" data-bs-toggle="button"
              data-bs-placement="top" title="Ver Documento" (click)="verPdf(row.urlPdf ?? '')">
              <i class="bi bi-eye bi-c text-gold"></i>
            </button>
            <button type="button" class="btn btn-link me-2" id="descargarPdf" data-bs-toggle="button"
              data-bs-placement="top" title="Ver Documento" (click)="descargarPdf(row.urlPdf ?? '')">
              <i class="bi bi-download bi-c text-gray"></i>
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
