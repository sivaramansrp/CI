<form [formGroup]="formSolicitudDocumentos">
  <h5>Seleccione los documentos que van a ser requeridos</h5>
  <div class="col-md-12">
    <div class="row">
      <table class="table table-bordered">
        <thead class="table-light">
          <tr>
            <th>Requerir</th>
            <th>Tipo de documento</th>
            <th>Nombre del archivo</th>
            <th>Estatus</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let documento of exampleDocumentosRequeridos">
            <td>
              <input type="checkbox" [checked]="documento.requerido" />
            </td>
            <td>{{documento.tipoDocumento}}</td>
            <td>{{documento.nombreArchivo}}</td>
            <td>{{documento.estatus}}</td>
            <td>
              <div class="icono">
                <span class="d-flex justify-content-center">
                  <i class="bi bi-archive"></i></span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="col-md-12" *ngIf="isSegundaTabla">
    <div class="row ">
      <div class="col-md-6">
        <br>
        <app-tabla-dinamica [tipoSeleccionTabla]="tablaSeleccion.CHECKBOX"
          [configuracionTabla]="encabezadoDeTablaDocumentos" [datos]="listadoDocumentos"
          (listaDeFilaSeleccionada)="documentosSeleccionados = $event">
        </app-tabla-dinamica>
        <button class="btn btn-primary" (click)="eliminarDocumento()">Eliminar</button>
      </div>
      <div class="col-md-6">
        <label for="tipoDocumento">Tipo documento</label>
        <select id="tipoDocumento" formControlName="tipoDocumento" class="form-select form-control" >
          <option value=""  >Seleccione un documento</option>
          <option *ngFor="let doc of documentosEspecificos" [value]="doc.id_tipo_documento">
            {{ doc.documento }}
          </option>
        </select>
        <br>
        <button class="btn btn-primary" (click)="agregarDocumento()">Agregar nuevo</button>
        <br>
      </div>
    </div>
  </div>
</form>
@if (nuevaNotificacion) {
<section>
  <lib-notificaciones [notificacionInput]="nuevaNotificacion">
  </lib-notificaciones>
</section>
}
