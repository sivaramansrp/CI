<div class="container">
  <div class="container1">
    <ng-titulo titulo="Acuses y resoluciones" />
    <form [formGroup]="acusesYResolucionesFormGroup">
      <div class="row">
        <div class="col-md-6">
          <label class="form-label" for="folio"
            >Folio:<span
              class="bi bi-question-circle-fill fs-4 m-1"
              title="Title"
              ata-bs-toggle="tooltip"
            ></span>
          </label>
          <input
            type="text"
            class="form-control"
            id="folio"
            formControlName="folio"
            readonly
          />
        </div>

        <div class="col-md-6">
          <label class="form-label" for="fechaInicial"
            >Fecha inicio tr&aacute;mite:</label
          >
          <input
            type="text"
            class="form-control"
            id="fechaInicial"
            formControlName="fechaInicial"
            readonly
          />
        </div>

        <div class="col-md-12">
          <label class="form-label" for="dependencia">Dependencia:</label>
          <input
            type="text"
            class="form-control"
            id="dependecia"
            formControlName="dependencia"
            readonly
          />
        </div>

        <div class="col-md-12">
          <label
            class="form-label"
            for="unidadAdministrativaORepresentacionFederal"
            >Unidad administrativa o representación federal:</label
          >
          <input
            type="text"
            class="form-control"
            id="unidadAdministrativaORepresentacionFederal"
            formControlName="unidadAdministrativaORepresentacionFederal"
            readonly
          />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="tipoDeSolicitud"
            >Tipo de solicitud:</label
          >
          <input
            type="text"
            class="form-control"
            id="tipoDeSolicitud"
            formControlName="tipoDeSolicitud"
            readonly
          />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="estatusDeLaSolicitud"
            >Estatus de la solicitud:</label
          >
          <input
            type="text"
            class="form-control"
            id="estatusDeLaSolicitud"
            formControlName="estatusDeLaSolicitud"
            readonly
          />
        </div>

        <div class="col-md-6">
          <label class="form-label" for="diasHabilesTranscurridos"
            >Días hábiles transcurridos:</label
          >
          <input
            type="text"
            class="form-control"
            id="diasHabilesTranscurridos"
            formControlName="diasHabilesTranscurridos"
            readonly
          />
        </div>

        <div class="row mt-5">
          <div class="col-md-12 mt-5 d-flex justify-content-end">
            <button type="button" class="btn btn-primary" (click)="regresar()">
              Regresar
            </button>
            <button
              type="button"
              class="btn btn-danger ms-2"
              (click)="solicitarCancelacion()"
            >
              Solicitar cancelación
            </button>
            <button
              type="button"
              class="btn btn-danger ms-2"
              (click)="solicitarModificacion()"
            >
              Solicitar modificación
            </button>
            <button
              type="button"
              class="btn btn-primary ms-2"
              (click)="desistir()"
            >
              Desistir
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
