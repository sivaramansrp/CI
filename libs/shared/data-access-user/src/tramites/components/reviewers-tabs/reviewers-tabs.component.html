<div class="container">
    <div class="row">
        <ul class="nav nav-tabs">
            @for (item of listaDeTabulaciones;let i=$index; track item.id) {
            <li [ngClass]="{
                'active': indice === i,
                'disabled': item?.disabled,
              }">
                <a data-toggle="tab" (click)=" seleccionaTab(i,item)" (keydown.enter)=" seleccionaTab(i,item)"
                    (keydown.space)=" seleccionaTab(i,item)" role="button" tabindex="0">{{item.titulo}}</a>
            </li>
            }
        </ul>
        <ng-container>
            @switch (indice) {
            @case (0) {
            <ng-template #childContainer></ng-template>
            }
            @case (1) {
            <lib-documentos [documentos]="documentos"></lib-documentos>
            }
            @case (2) {
            <lib-dictamenes></lib-dictamenes>
            }
            @case(3) {
            <lib-consultarequerimientos></lib-consultarequerimientos>
            }
            @case(4) {
            <lib-opinion></lib-opinion>
            }
            @case (5) {
            <lib-acuses-resoluciones></lib-acuses-resoluciones>
            }
            @case (6) {
            <lib-tareas-tramite></lib-tareas-tramite>
            }
            @case (7) {
            <lib-envio-digital></lib-envio-digital>
            }
            @default {
            <p>tab</p>
            }
            }
        </ng-container>
    </div>
</div>
