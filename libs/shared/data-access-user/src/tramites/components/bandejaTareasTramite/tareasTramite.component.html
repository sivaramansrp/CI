<div class="container">
    <div class="row mt-4 mb-4">
      <div class="col-md 6">
        <h4 class="titulo titulo-gold">Tareas(s)</h4>
      </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-12">
        <table class="table table-striped">
            <thead>
              <tr>
                @for (item of encabezadoTablaTareasTramite; track $index) {
                  <th>{{ item.valor }}</th>
                  }
              </tr>
            </thead>
            <tbody>
              @for (row of datosTablaTareasTramite; track $index) {
              <tr>
                @for (item of encabezadoTablaTareasTramite;  let i = $index; track $index) {
                <td>{{ row[item.key] }}</td>
                }
              </tr>
              }
            </tbody>
          </table>
    </div>
</div>
</div>
