<div class="table-responsive table-wrapper">  
    <table class="table table-striped table-bordered ">
      <thead>
        <tr>
          @if(tipoSeleccionTabla === TablaSeleccion.RADIO) {
            <th></th>
          }
          @else if(tipoSeleccionTabla === TablaSeleccion.CHECKBOX) {
            <th>
              <input 
                class="cursor-pointer"
                type="checkbox" 
                name="filaSeleccionada" 
                (change)="seleccionarDeseleccionarTodos($event)"
                aria-label="Seleccionar/Deseleccionar todo"
                [checked]="filasSeleccionadas.length === datos.length"
              />
            </th>
          }
          <!-- Crear el encabezado de manera dinámica -->
          <th *ngFor="let col of obtenerConfiguracionOrdenada()">
            {{ col.encabezado }}
          </th>
        </tr>
      </thead>
      <tbody>
        <!-- Crear las filas de manera dinámica -->
        <tr *ngFor="let fila of datos;let i=index">
          <!-- Botón de radio para seleccionar una fila -->
           @if(tipoSeleccionTabla === TablaSeleccion.RADIO) {
            <td>
              <input 
                class="cursor-pointer"
                type="radio" 
                name="filaSeleccionada" 
                [(ngModel)]="idFilaSeleccionada" 
                [value]="i" 
                (change)="seleccionarFila(i, fila)"
                [checked]="idFilaSeleccionada === i"
                aria-label="Seleccionar"
              />
            </td>
           }
           @else if(tipoSeleccionTabla === TablaSeleccion.CHECKBOX) {
            <td>
              <input 
                class="cursor-pointer"
                type="checkbox" 
                name="filaSeleccionada" 
                [value]="i" 
                (change)="cambiarEstadoCheckbox($event,i )"
                [checked]="filasSeleccionadas.includes(i)"
                aria-label="Seleccionar"
              />
            </td>   
           }
          
          <!-- Renderizar cada columna de manera dinámica utilizando la función 'clave' -->
          <td *ngFor="let col of obtenerConfiguracionOrdenada()">
            <!-- {{col | json}}
            {{fila | json}} -->
            <ng-container [ngSwitch]="col.encabezado">
              <ng-container *ngSwitchCase="'Documentos'">
                <app-catalogo-select
                id="disponiblesDocumentos"
                [catalogo]="disponiblesDocumentos.catalogos"
                [label]="disponiblesDocumentos.labelNombre"
                [placeholder]="disponiblesDocumentos.primerOpcion"
                [required]="disponiblesDocumentos.required"
                [isDisabled]="false"
                (selectionChange)="enDocumentSelect(i,$event)"
      
              ></app-catalogo-select>
              </ng-container>
              <ng-container *ngSwitchCase="'Ver documento'">
                <button
                class="btn btn-link"
                (click)="verDocument(i)"
              >
                <i class="bi bi-file-earmark-pdf" style="font-size: 1.5rem"></i>
              </button>
              </ng-container> 
              <ng-container *ngSwitchDefault>
                {{ col.clave(fila) || ' ' }}
              </ng-container>
              
              </ng-container>
            
          </td>
        </tr>
      </tbody>
    </table>
  
  </div>
