<div class="form-group">
  <form [formGroup]="FormInputRadio">
    <div *ngFor="let option of radioOptions" [ngClass]="layout">
      <input
        type="radio"
        [value]="option.value"
        [id]="option.value"
        [checked]="selectedValue === option.value"
        (change)="onSelectionChange(option.value)"
        formControlName="seleccion"
      />
      <span class="radio-label" [ngClass]="{'bold': isBold}">{{ option.label }}</span>
      <span
        *ngIf="showTooltip && option.hint"
        class="bi bi-question-circle-fill fs-4 m-1"
        [title]="option.hint"
        ata-bs-toggle="tooltip"
      >
        <ng-container *ngFor="let part of getParts()">
          <ng-container [ngSwitch]="part">
            <input
              *ngSwitchCase="'input'"
              type="radio"
              [value]="option.value"
              [id]="option.value"
              [checked]="selectedValue === option.value"
              (change)="onSelectionChange(option.value)"
              formControlName="seleccion"
            />
            <span
              *ngSwitchCase="'label'"
              class="etiqueta-de-radio"
              [ngClass]="{
                'fw-bold': gridLayout,
                'radio-label-margin-left': labelName === 'last',
                'radio-label-margin-right': labelName !== 'last'
              }"
              [title]="option.label"
              >{{ option.label }}</span
            >
          </ng-container>
        </ng-container>
        <span
          *ngIf="showTooltip && option.hint"
          class="bi bi-question-circle-fill fs-4 m-1"
          [title]="option.hint"
          ata-bs-toggle="tooltip"
        >
        </span>
      </div>
    </div>
  </form>
</div>
