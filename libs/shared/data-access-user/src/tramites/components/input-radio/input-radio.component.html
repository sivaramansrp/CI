<div class="form-group">
  <form [formGroup]="FormInputRadio">
    <div [ngClass]="{'radio-row': gridLayout}">
      <div *ngFor="let option of radioOptions" [ngStyle]="obtenerEstiloParaRadio()" #radioContainer>
        <input
          type="radio"
          [value]="option.value"
          [id]="option.value"
          [checked]="selectedValue === option.value"
          (change)="onSelectionChange(option.value)"
          formControlName="seleccion"
        />
        <span class="etiqueta-de-radio" [ngClass]="{ 'fw-bold': gridLayout }" [title]="option.label">{{ option.label }}</span>
        <span
          *ngIf="showTooltip && option.hint"
          class="bi bi-question-circle-fill fs-4 m-1"
          [title]="option.hint"
          ata-bs-toggle="tooltip"
        >
        </span>
      </div>
    </div>
  </form>
</div>
