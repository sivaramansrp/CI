<div class="form-group">
  <form [formGroup]="FormInputRadio">
    <div [ngClass]="{ 'radio-row': gridLayout }">
      <div
        *ngFor="let option of radioOptions"
        [ngStyle]="obtenerEstiloParaRadio()"
        #radioContainer
      >
        <ng-container *ngFor="let part of getParts()">
          <ng-container [ngSwitch]="part">
            <input
              *ngSwitchCase="'input'"
              [type]="allowDeselection ? 'checkbox' : 'radio'"
              [value]="option.value"
              [id]="option.value"
              [checked]="isOptionSelected(option.value)"
              [disabled]="isOptionDisabled(option.value)"
              (change)="onSelectionChange(option.value)"
            />
            <span
              *ngSwitchCase="'label'"
              class="etiqueta-de-radio"
              [ngClass]="{
                'fw-bold': gridLayout || isBold,
                'radio-label-margin-left': labelName === 'last',
                'radio-label-margin-right': labelName !== 'last',
                'text-muted': isOptionDisabled(option.value)
              }"
              [title]="option.label"
              >{{ option.label }}</span
            >
          </ng-container>
        </ng-container>
        <span
          *ngIf="showTooltip && option.hint"
          class="bi bi-question-circle-fill fs-4 m-1"
          [title]="option.hint"
          data-bs-toggle="tooltip"
        >
        </span>
      </div>
    </div>

  </form>
</div>
