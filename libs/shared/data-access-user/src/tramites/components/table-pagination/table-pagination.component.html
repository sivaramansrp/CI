<div class="d-flex justify-content-between align-items-center">
  @if (showCurrentPage) {
    <div class="d-flex justify-content-center w-100">
      <button class="currentPageBtn">{{currentPage}}</button>
    </div>
  } @else {
    <div class="d-flex align-items-center">
    <label class="me-2" for=""></label>
    <select class="form-select" (change)="onItemsPerPageChange($event)" style="display: none;">
      <option
        *ngFor="let option of [5, 10, 20, 50]"
        [selected]="option === itemsPerPage"
      >
        {{ option }}
      </option>
    </select>
    <label class="ms-2" for=""></label>
  </div>

  <nav *ngIf="totalPages > 1">
    <ul class="pagination justify-content-center d-flex">
      <!-- Anterior -->
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button
          class="page-link"
          (click)="onPageChange(currentPage - 1)"
          [disabled]="currentPage === 1"
        >
          Anterior
        </button>
      </li>

      <!-- Page Numbers -->
      <li
        class="page-item"
        *ngFor="let page of [].constructor(totalPages); let i = index"
      >
        <button
          class="page-link"
          (click)="onPageChange(i + 1)"
          [class.active]="currentPage === i + 1"
        >
          {{ i + 1 }}
        </button>
      </li>

      <!-- Siguiente -->
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button
          class="page-link"
          (click)="onPageChange(currentPage + 1)"
          [disabled]="currentPage === totalPages"
        >
          Siguiente
        </button>
      </li>
    </ul>
  </nav>
  }
</div>
