<div class="modal-header">
  <h4 class="modal-title">{{ titulo }}</h4>
</div>
<div class="modal-body">
  @if (getHtml) {
    <div [innerHTML]="txtHtml"></div>
  }
</div>
<div class="modal-footer custom-footer">
  <button type="button" class="btn btn-default" (click)="cerrarModal(false)">{{ cancelarBtnTxt }}</button>
  <button type="button" class="btn btn-primary" (click)="cerrarModal(true)">{{ confirmarBtnTxt }}</button>
</div>
