<!-- Modal -->
<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h4 class="modal-title">Eliminar archivo</h4>
    </div>
    <div class="modal-body">
      @if ( getHtml ) {}
      <div [innerHTML]="txtHtml"></div>
    </div>
    <div class="modal-footer custom-footer">
      <button type="button" class="btn btn-default" (click)="cerrarModal(true)">{{ cancelarBtnTxt }} </button>
      <button type="button" class="btn btn-primary" (click)="cerrarModal(false)">{{ confirmarBtnTxt }}</button>
    </div>
  </div><!-- /.modal-content -->
</div><!-- /.modal-dialog -->
