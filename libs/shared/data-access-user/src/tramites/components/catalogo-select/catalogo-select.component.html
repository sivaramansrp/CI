<div [formGroup]="formSelect" [ngClass]="{'row': isInline}">
    <label for="{id}" class="form-label text-left" [ngClass]="{'col-sm-3': isInline}" *ngIf="label">{{ label }} @if (required) {*}:
        @if(tooltipQuestionCircle){ <span class="bi bi-question-circle-fill" title="{{label}}"
        data-bs-toggle="tooltip"></span>}
    </label>
    <label *ngIf="!label" for="{{id}}" class="form-label label-height"></label>
    <select class="form-control" [id]="id" formControlName="selectControl" title="Seleccione una opción" (change)="handleChange($event)" [ngClass]="{ 'required': isInvalid(), 'col-sm-9': isInline }">
        <option value="-1" disabled>{{placeholder ? placeholder : 'Seleccione una opción'}}</option>
        <option *ngFor="let option of catalogo" [value]="option.id">{{ option.descripcion }}</option>
    </select>
    <div *ngIf="isInvalid()" class="mensaje-error">
        Este campo es obligatorio.
    </div>
</div>
