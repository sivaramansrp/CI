<div [formGroup]="formSelect" [ngClass]="{ row: isInline }">
  <label
    for="{id}"
    class="form-label text-left"
    [ngClass]="{ 'col-sm-3': isInline }"
    *ngIf="label"
    >{{ label }}@if(required){*}: @if(tooltipQuestionCircle){
    <span
      class="bi bi-question-circle-fill"
      title="{{ tooltipQuestionCircleText ? tooltipQuestionCircleText : label }}"
      data-bs-toggle="tooltip"
    ></span
    >}
  </label>
  <label *ngIf="!label" for="{{ id }}" class="form-label label-height"></label>
  <select
    class="form-control form-select"
    [id]="id"
    formControlName="selectControl"
    title="Seleccione una opción"
    (change)="handleChange($event)"
    [ngClass]="{ required: isInvalid(), 'col-sm-9': isInline }"
  >
    <option
      value="{{ primerOptionValue }}"
      selected
      [hidden]="hiddenPrimerOption"
      [disabled]="disabledPrimerOption"
    >
      {{placeholder ? placeholder : 'Seleccione una opción'}}
    </option>
    <option *ngFor="let option of catalogo" [value]="option.id">
      {{ option.descripcion }}
    </option>
  </select>
  <div *ngIf="isInvalid()" class="mensaje-error">
    Este campo es obligatorio.
  </div>
</div>
